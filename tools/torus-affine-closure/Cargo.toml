[package]
name = "torus-affine-closure"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
flate2 = "1"
torus-s4 = { path = "../torus-s4" }
torus-s4-tree = { path = "../torus-s4-tree" }
torus-coset-circuit = { path = "../torus-coset-circuit" }
torus-indexed-circuit = { path = "../torus-indexed-circuit" }
torus-worklist-solver = { path = "../torus-worklist-solver" }
