[package]
name = "aps-partition-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
crypto_lib = { package = "crypto", path = "../..", default-features = false }
aps-partition-lab = { path = "../aps-partition-lab" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[profile.release]
codegen-units = 256

