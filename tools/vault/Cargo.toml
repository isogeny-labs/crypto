[package]
name = "vault"
version = "0.1.0"
edition = "2021"
description = "Transparent git encryption for research findings: AES-SIV under per-realm data keys wrapped by AWS KMS"
publish = false

# Standalone: not part of the root crate's build.
[workspace]

[[bin]]
name = "vault"
path = "src/main.rs"

[dependencies]
aes-siv = "0.7"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.7"

[dev-dependencies]
tempfile = "3"
