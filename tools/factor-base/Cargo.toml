[package]
name = "factor-base"
version = "0.1.0"
edition = "2021"
description = "Reproducible elliptic-curve factor-base construction and immutable precomputation archives"

[workspace]

[dependencies]
anyhow = "1"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"

