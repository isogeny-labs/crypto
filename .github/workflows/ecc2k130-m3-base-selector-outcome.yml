name: ECC2K-130 m3 base-selector outcome replay

on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-m3-base-selector-outcome.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-m3-base-selector-outcome.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github/workflows/ecc2k130-m3-four-policy.yml
            .github/workflows/ecc2k130-m3-base-selector-source.yml
            research/notes/ecc2k130/m3_base_selector_20260930
            research/notes/ecc2k130/m3_four_policy_20260930
            research/ecc2k130_factor_base_pilot_20260924
            research/ecc2k130_factor_base_replication_20260925
            research/ecc2k130_dual_transport_20260925
            research/ecc2k130_relations
            research/ecc2k130_oriented_transport_20260924
            /tools/artifacts/
          sparse-checkout-cone-mode: false
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research
      - name: Check source lock and independently replay every raw case
        run: |
          python3 research/notes/ecc2k130/m3_base_selector_20260930/check_source_lock.py
          python3 research/notes/ecc2k130/m3_base_selector_20260930/verify.py \
            --evidence research/notes/ecc2k130/m3_base_selector_20260930/evidence_run_20260930_2127Z \
            --manifest research/notes/ecc2k130/m3_base_selector_20260930/evidence_run_20260930_2127Z/EVIDENCE.json \
            --out "$RUNNER_TEMP/replay.json"
          cmp "$RUNNER_TEMP/replay.json" \
            research/notes/ecc2k130/m3_base_selector_20260930/evidence_run_20260930_2127Z/replay.json
      - name: Regenerate frozen decision and pair table
        run: |
          python3 research/notes/ecc2k130/m3_base_selector_20260930/analyze.py \
            --evidence research/notes/ecc2k130/m3_base_selector_20260930/evidence_run_20260930_2127Z \
            --out "$RUNNER_TEMP/analysis.json"
          cmp "$RUNNER_TEMP/analysis.json" \
            research/notes/ecc2k130/m3_base_selector_20260930/ANALYSIS.json
