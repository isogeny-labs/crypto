name: Prime31 W8 target-reduced 8x8 elliptic determinant exact source
on:
  push:
    branches:
      - automation/prime31-rr9-weighted-resultant-20261118
    paths:
      - research/prime31_ic_20261115/native/examples/prime31_w8_det8.rs
      - research/prime31_ic_20261115/native/verify_prime31_w8_det8.py
      - research/prime31_ic_20261115/rr9/W8_TARGET_REDUCED_DETERMINANT_PROTOCOL_20261118.md
      - .github/workflows/prime31-w8-det8.yml
  pull_request:
    paths:
      - research/prime31_ic_20261115/native/examples/prime31_w8_det8.rs
      - research/prime31_ic_20261115/native/verify_prime31_w8_det8.py
      - .github/workflows/prime31-w8-det8.yml
  workflow_dispatch:

permissions:
  contents: read
jobs:
  original-prime31-target-reduced-determinant:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned original Prime31 Rust arithmetic
        uses: actions/checkout@v4
        with:
          ref: 1df714645aa683cf975bc76fcacb9842cb4780fd
          path: pinned
          persist-credentials: false
      - name: Install exact Rust compiler
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Overlay ONLY the new RR9 determinant example
        run: |
          cp research/prime31_ic_20261115/native/examples/prime31_w8_det8.rs \
             pinned/research/prime31_ic_20261115/native/examples/prime31_w8_det8.rs
      - name: Original library regression suite
        run: cargo +1.100.0 test --locked --release --manifest-path pinned/research/prime31_ic_20261115/native/Cargo.toml --lib
      - name: Two target-reduced determinant Rust tests
        run: cargo +1.100.0 test --locked --release --manifest-path pinned/research/prime31_ic_20261115/native/Cargo.toml --example prime31_w8_det8
      - name: Produce exact 48-case record
        run: |
          cargo +1.100.0 run --locked --release \
            --manifest-path pinned/research/prime31_ic_20261115/native/Cargo.toml \
            --example prime31_w8_det8 > prime31-w8-det8.json
          test -s prime31-w8-det8.json
      - name: Independent Python BigInt verification
        run: python3 research/prime31_ic_20261115/native/verify_prime31_w8_det8.py prime31-w8-det8.json
      - name: Archive source-bound determinant evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime31-w8-target-reduced-8x8-det
          path: prime31-w8-det8.json
          if-no-files-found: warn
          retention-days: 30
