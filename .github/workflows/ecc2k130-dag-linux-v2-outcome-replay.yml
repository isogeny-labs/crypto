name: ECC2K-130 DAG Linux v2 first-outcome successor replay
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'research/notes/ecc2k130/symbolic_dag_dimacs_linux_v2_outcome_replay_20260929/**'
      - 'research/notes/ecc2k130/symbolic_dag_dimacs_linux_v2_20260928/**'
      - '.github/workflows/ecc2k130-dag-linux-v2-outcome-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-only-replay:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-dag-linux-v2-outcome-replay.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-dag-linux-v2-outcome-replay.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile versioned verifier
        run: |
          python3 -m py_compile research/notes/ecc2k130/symbolic_dag_dimacs_linux_v2_outcome_replay_20260929/{gate,corrected_replay}.py
      - name: Bind first-run ZIP and replay all semantics without rerunning children
        run: |
          python3 research/notes/ecc2k130/symbolic_dag_dimacs_linux_v2_outcome_replay_20260929/gate.py
