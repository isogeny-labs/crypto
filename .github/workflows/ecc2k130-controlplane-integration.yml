# The control plane against real Postgres, Redis and S3.
#
# `ecc2k130-certification.yml` runs test_controlplane.py, which drives the
# same code against SQLite, a fake cache and a directory so that it passes
# anywhere.  This one runs test_integration.py, whose job is the things that
# only show up against the real servers: the advisory lock two hosts contend
# for, a bigint column, a TTL the server owns, a client library's own retry
# defaults, and a listing longer than one S3 page.
name: ECC2K control-plane integration
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-controlplane-integration.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-controlplane-integration.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 ecc2k130
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the clients production imports lazily
        run: make -C ecc2k130 test-integration-deps
      # The same script a developer runs, so the docker path is the one CI
      # exercises and the compose file cannot rot unnoticed.
      - name: Postgres, Redis and MinIO, and the suite against them
        run: make -C ecc2k130 test-integration
      - name: Service logs
        if: failure()
        run: |
          cd ecc2k130/aws/integration
          docker compose -f docker-compose.yml logs --no-color --tail 200 || true
      - name: Stop the services
        if: always()
        run: ecc2k130/aws/integration/services.sh down || true
