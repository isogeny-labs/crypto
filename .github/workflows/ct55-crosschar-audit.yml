name: CT55 cross-characteristic finite-stage audit
on:
  pull_request:
    paths:
      - 'research/cross_characteristic_global_torsion_20261112/ct55/**'
      - 'research/cross_characteristic_global_torsion_20261112/ct56/**'
      - '.github/workflows/ct55-crosschar-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ct55:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python and independently implemented JavaScript controls
        shell: bash
        run: |
          set -euo pipefail
          base="research/cross_characteristic_global_torsion_20261112/ct55"
          python3 -B "$base/ct55_universal.py" > ct55-python.txt
          python3 -O -B "$base/ct55_universal.py" > ct55-python-opt.txt
          cmp ct55-python.txt ct55-python-opt.txt
          node "$base/ct55_independent.js" > ct55-javascript.txt
          node --no-opt "$base/ct55_independent.js" > ct55-javascript-noopt.txt
          cmp ct55-javascript.txt ct55-javascript-noopt.txt
          python3 -B "$base/ct55_toy_controls.py" > ct55-toy-python.txt
          python3 -O -B "$base/ct55_toy_controls.py" > ct55-toy-python-opt.txt
          cmp ct55-toy-python.txt ct55-toy-python-opt.txt
          node "$base/ct55_toy_independent.js" > ct55-toy-js.txt
          node --no-opt "$base/ct55_toy_independent.js" > ct55-toy-js-noopt.txt
          cmp ct55-toy-js.txt ct55-toy-js-noopt.txt
          python3 - <<'PY'
          from pathlib import Path
          py=Path("ct55-python.txt").read_text().splitlines()
          js=Path("ct55-javascript.txt").read_text().splitlines()
          # Separate arithmetic implementations must agree on all 12 binary degrees.
          assert [s.split()[-2:] for s in py[10:22]] == [s.split()[-2:] for s in js[10:22]]
          assert len(py)==23 and len(js)==23
          assert "parity mutant rejected" in py[-1]
          assert "parity mutant rejected" in js[-1]
          toy_py=Path("ct55-toy-python.txt").read_text().splitlines()
          toy_js=Path("ct55-toy-js.txt").read_text().splitlines()
          assert toy_py[:2]==toy_js[:2]
          assert "positive p5 to p2" in toy_py[0]
          assert "negative p7 to p2" in toy_py[1]
          print("CT55 finite-stage, toy positive/negative controls passed; no uniform global field algorithm tested")
          PY
          sha256sum ct55-python.txt ct55-javascript.txt
      - name: CT56 sharp Serre bound and full-level pairing controls
        shell: bash
        run: |
          set -euo pipefail
          base="research/cross_characteristic_global_torsion_20261112/ct56"
          python3 -B "$base/ct56_serre_gate.py" > ct56-python.txt
          python3 -O -B "$base/ct56_serre_gate.py" > ct56-python-opt.txt
          cmp ct56-python.txt ct56-python-opt.txt
          node "$base/ct56_independent.js" > ct56-javascript.txt
          node --no-opt "$base/ct56_independent.js" > ct56-javascript-noopt.txt
          cmp ct56-javascript.txt ct56-javascript-noopt.txt
          python3 - <<'PY'
          from pathlib import Path
          remove=str.maketrans('', '', ',()[]')
          def normalise(path):
              return [' '.join(line.translate(remove).split())
                      for line in Path(path).read_text().splitlines()]
          assert normalise('ct56-python.txt')==normalise('ct56-javascript.txt'), "independent arithmetic mismatch"
          assert len(normalise('ct56-python.txt'))==13, "missing test rows"
          assert "PASS: exact Serre" in Path('ct56-python.txt').read_text()
          print("CT56 exact independent gates passed; necessity only, no global solver")
          PY
          sha256sum ct56-python.txt ct56-javascript.txt
          python3 -B "$base/ct56_genus2_witness.py" > ct56-genus2-python.txt
          python3 -O -B "$base/ct56_genus2_witness.py" > ct56-genus2-python-opt.txt
          cmp ct56-genus2-python.txt ct56-genus2-python-opt.txt
          node "$base/ct56_genus2_independent.js" > ct56-genus2-js.txt
          node --no-opt "$base/ct56_genus2_independent.js" > ct56-genus2-js-noopt.txt
          cmp ct56-genus2-js.txt ct56-genus2-js-noopt.txt
          cmp ct56-genus2-python.txt ct56-genus2-js.txt
          grep -q '"max_j":19' ct56-genus2-python.txt
          grep -q '"smooth_models":640' ct56-genus2-python.txt
          sha256sum ct56-genus2-python.txt ct56-genus2-js.txt
