name: Compact base sweep replay
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|compact-base-sweep-replay.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|compact-base-sweep-replay.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/notes/ecc2k130/compact_base_sweep_20260925
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check frozen scripts
        run: python3 -m py_compile research/notes/ecc2k130/compact_base_sweep_20260925/{make_inputs,run,verify,verify_holdouts,archive,replay_all,unordered_four_sum_bound}.py
      - name: Check exact unordered-count thresholds
        run: python3 research/notes/ecc2k130/compact_base_sweep_20260925/unordered_four_sum_bound.py > /dev/null
      - name: Independently replay every archived relation, point log and rho scalar
        run: python3 research/notes/ecc2k130/compact_base_sweep_20260925/replay_all.py
