name: IC reference evidence replay
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ic-reference-evidence.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ic-reference-evidence.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/ic_candidate_tournament_20260915/evidence research/ic_candidate_tournament_20260915/goal_20260924
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive decoder
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Fresh extraction with SHA-256, file-count and byte-count checks
        run: |
          python research/ic_candidate_tournament_20260915/evidence/restore.py \
            --archive ic-reference-qualification-20260925 --out "$RUNNER_TEMP/ic-reference-evidence"
      - name: Independently replay certificates, accounting, summaries and reference selection
        run: |
          python research/ic_candidate_tournament_20260915/goal_20260924/reference-qualification/audit_archive.py \
            --bundle "$RUNNER_TEMP/ic-reference-evidence/ic-reference-qualification" \
            --out "$RUNNER_TEMP/ic-reference-audit.json"
      - name: Reproduce every exported table row
        run: |
          python research/ic_candidate_tournament_20260915/goal_20260924/reference-qualification/export_report.py \
            --round "$RUNNER_TEMP/ic-reference-evidence/ic-reference-qualification/full/ic-reference-qualification-36127866931-1/tournament" \
            --out research/ic_candidate_tournament_20260915/goal_20260924/reference-qualification/RESULTS.json --verify
      - name: Retain replay receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ic-reference-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ic-reference-audit.json
          if-no-files-found: warn
          retention-days: 30
