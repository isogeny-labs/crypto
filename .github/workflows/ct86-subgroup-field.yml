name: "CT86–91 subgroup tower, CRT and full binary torsion (bounded)"
on:
  push:
    branches:
      - research/ct81-fixed-prime-orientation-20261113
    paths:
      - "research/cross_characteristic_global_torsion_20261112/ct86/**"
      - "research/cross_characteristic_global_torsion_20261112/ct87/**"
      - "research/cross_characteristic_global_torsion_20261112/ct88/**"
      - "research/cross_characteristic_global_torsion_20261112/ct89/**"
      - "research/cross_characteristic_global_torsion_20261112/ct90/**"
      - "research/cross_characteristic_global_torsion_20261112/ct91/**"
      - ".github/workflows/ct86-subgroup-field.yml"
  pull_request:
    paths:
      - "research/cross_characteristic_global_torsion_20261112/ct86/**"
      - "research/cross_characteristic_global_torsion_20261112/ct87/**"
      - "research/cross_characteristic_global_torsion_20261112/ct88/**"
      - "research/cross_characteristic_global_torsion_20261112/ct89/**"
      - "research/cross_characteristic_global_torsion_20261112/ct90/**"
      - "research/cross_characteristic_global_torsion_20261112/ct91/**"
      - ".github/workflows/ct86-subgroup-field.yml"
  workflow_dispatch:

jobs:
  independent-exact-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Run Python and independent Node controls at the exact head
        shell: bash
        run: |
          set -euo pipefail
          D=research/cross_characteristic_global_torsion_20261112/ct86
          python3 -B "$D/ct86_subgroup_field.py" > /tmp/ct86-py.txt
          python3 -O -B "$D/ct86_subgroup_field.py" > /tmp/ct86-pyopt.txt
          node "$D/ct86_subgroup_field_independent.js" > /tmp/ct86-js.txt
          node --no-opt "$D/ct86_subgroup_field_independent.js" > /tmp/ct86-js-noopt.txt
          cmp /tmp/ct86-py.txt /tmp/ct86-pyopt.txt
          cmp /tmp/ct86-py.txt /tmp/ct86-js.txt
          cmp /tmp/ct86-py.txt /tmp/ct86-js-noopt.txt
          printf '%s  %s\n' ac4efd15c28c904c5eb88394736b42e4dbca637fac1ff51953ab94c824aaed96 /tmp/ct86-py.txt | sha256sum -c
          cat /tmp/ct86-py.txt

      - name: Verify explicit CT87 relative-cubic tower independently
        shell: bash
        run: |
          set -euo pipefail
          D=research/cross_characteristic_global_torsion_20261112/ct87
          python3 -B "$D/ct87_tower.py" > /tmp/ct87-py.txt
          python3 -O -B "$D/ct87_tower.py" > /tmp/ct87-pyopt.txt
          node "$D/ct87_tower_independent.js" > /tmp/ct87-js.txt
          node --no-opt "$D/ct87_tower_independent.js" > /tmp/ct87-js-noopt.txt
          cmp /tmp/ct87-py.txt /tmp/ct87-pyopt.txt
          cmp /tmp/ct87-py.txt /tmp/ct87-js.txt
          cmp /tmp/ct87-py.txt /tmp/ct87-js-noopt.txt
          printf '%s  %s\n' 9ae4951f266e6b9c2ef8e146ab9b82014e7753868f13c4324da368cd8bce371c /tmp/ct87-py.txt | sha256sum -c
          cat /tmp/ct87-py.txt

      - name: Verify CT88 binary target order-index and nonmaximal polynomial independently
        shell: bash
        run: |
          set -euo pipefail
          D=research/cross_characteristic_global_torsion_20261112/ct88
          python3 -B "$D/ct88_index.py" > /tmp/ct88-py.json
          python3 -O -B "$D/ct88_index.py" > /tmp/ct88-opt.json
          node "$D/ct88_index_independent.js" > /tmp/ct88-js.json
          node --no-opt "$D/ct88_index_independent.js" > /tmp/ct88-jsopt.json
          cmp /tmp/ct88-py.json /tmp/ct88-opt.json
          cmp /tmp/ct88-py.json /tmp/ct88-js.json
          cmp /tmp/ct88-py.json /tmp/ct88-jsopt.json
          printf '%s  %s\n' 4953ec9689c3ce372eda1d53cc53eceb3340f7dc013270bcd3d0cf909956f096 /tmp/ct88-py.json | sha256sum -c
          cat /tmp/ct88-py.json

      - name: Verify CT89 2-maximal basis, products and binary CRT factors
        shell: bash
        run: |
          set -euo pipefail
          D=research/cross_characteristic_global_torsion_20261112/ct89
          python3 -B "$D/ct89_basis.py" > /tmp/ct89-py.json
          python3 -O -B "$D/ct89_basis.py" > /tmp/ct89-opt.json
          node "$D/ct89_basis_independent.js" > /tmp/ct89-js.json
          node --no-opt "$D/ct89_basis_independent.js" > /tmp/ct89-jsopt.json
          cmp /tmp/ct89-py.json /tmp/ct89-opt.json
          cmp /tmp/ct89-py.json /tmp/ct89-js.json
          cmp /tmp/ct89-py.json /tmp/ct89-jsopt.json
          printf '%s  %s\n' c7ff3a7388db0d05797b758d707e0cf2bdbaa77c3a4a6d0eb55c1a4ebb3d8a1b /tmp/ct89-py.json | sha256sum -c
          cat /tmp/ct89-py.json

      - name: Verify CT90 two F16 residue projections and CT80 target-place selection
        shell: bash
        run: |
          set -euo pipefail
          D=research/cross_characteristic_global_torsion_20261112/ct90
          python3 -B "$D/ct90_binary_projections.py" > /tmp/ct90-py.json
          python3 -O -B "$D/ct90_binary_projections.py" > /tmp/ct90-opt.json
          node "$D/ct90_binary_projections_independent.js" > /tmp/ct90-js.json
          node --no-opt "$D/ct90_binary_projections_independent.js" > /tmp/ct90-jsopt.json
          cmp /tmp/ct90-py.json /tmp/ct90-opt.json
          cmp /tmp/ct90-py.json /tmp/ct90-js.json
          cmp /tmp/ct90-py.json /tmp/ct90-jsopt.json
          printf '%s  %s\n' ab40a0b47b997abb6e6cbf5f6854a6eb10bdcbf15da2776a0850c798f87f6417 /tmp/ct90-py.json | sha256sum -c
          cat /tmp/ct90-py.json

      - name: Verify CT91 both CRT cubics and all 48 geometric 7-torsion points
        shell: bash
        run: |
          set -euo pipefail
          D=research/cross_characteristic_global_torsion_20261112/ct91
          python3 -B "$D/ct91_binary_subgroup_partition.py" > /tmp/ct91-py.json
          python3 -O -B "$D/ct91_binary_subgroup_partition.py" > /tmp/ct91-opt.json
          node "$D/ct91_binary_partition_independent.js" > /tmp/ct91-js.json
          node --no-opt "$D/ct91_binary_partition_independent.js" > /tmp/ct91-jsopt.json
          cmp /tmp/ct91-py.json /tmp/ct91-opt.json
          cmp /tmp/ct91-py.json /tmp/ct91-js.json
          cmp /tmp/ct91-py.json /tmp/ct91-jsopt.json
          printf '%s  %s\\n' 380218d31be6e794362d2f362725da5037d4e15264361ae2d61f082101aa3790 /tmp/ct91-py.json | sha256sum -c
          cat /tmp/ct91-py.json
