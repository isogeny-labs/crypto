name: NIST sm120 static CUDA
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
concurrency:
  group: nist-sm120-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ptxas:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|nist-sm120-static.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|nist-sm120-static.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    container:
      image: nvidia/cuda:13.0.2-devel-ubuntu24.04
    strategy:
      fail-fast: false
      matrix:
        ptx: [0, 1]
        maxreg: [0, 96, 128, 160]
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 360 }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile sm_120
        working-directory: gpu/nist
        run: |
          make -B bench ARCH=sm_120 NIST_PTX=${{ matrix.ptx }} MAXREG=${{ matrix.maxreg }} 2>&1 | tee ptxas-${{ matrix.ptx }}-${{ matrix.maxreg }}.log
          grep -E 'Used [0-9]+ registers|stack frame|spill|Function properties' ptxas-${{ matrix.ptx }}-${{ matrix.maxreg }}.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: sm120-ptxas-${{ matrix.ptx }}-${{ matrix.maxreg }}
          path: gpu/nist/ptxas-${{ matrix.ptx }}-${{ matrix.maxreg }}.log
