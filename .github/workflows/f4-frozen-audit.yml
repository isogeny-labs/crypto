name: f4-frozen-audit

on:
  pull_request:
    paths:
      - '.github/workflows/f4-frozen-audit.yml'
      - 'research/f4_fp_ic_effect_20261018/native-audit/**'
      - 'research/f4_fp_ic_effect_20261018/summary.json'
      - 'research/f4_fp_ic_effect_20261018/reports/run-20261018T1548Z/raw/dlp_main.json'
      - 'research/f4_fp_ic_effect_20261018/reports/run-20261018T1548Z/raw/dlp_new.json'
      - 'scripts/build_ic_leaderboard.py'
      - 'scripts/test_build_ic_leaderboard.py'
      - 'docs/ic/LEADERBOARD.md'
      - 'docs/ic-leaderboard.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f4-frozen-audit-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-f4-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 research/f4_fp_ic_effect_20261018
      - name: Test native audit failure controls
        run: cargo test --locked --manifest-path research/f4_fp_ic_effect_20261018/native-audit/Cargo.toml
      - name: Recompute frozen F4 arithmetic from raw rows
        run: cargo run --locked --manifest-path research/f4_fp_ic_effect_20261018/native-audit/Cargo.toml
