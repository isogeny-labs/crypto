name: ECC2K-130 PDP difficulty input freeze

on:
  pull_request:
    paths:
      - "research/notes/ecc2k130/pdp_difficulty_features_20261001/**"
      - ".github/workflows/ecc2k130-pdp-difficulty-protocol.yml"
  push:
    branches: [main]
    paths:
      - "research/notes/ecc2k130/pdp_difficulty_features_20261001/**"
      - ".github/workflows/ecc2k130-pdp-difficulty-protocol.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-pdp-difficulty-protocol.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-pdp-difficulty-protocol.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/notes/ecc2k130/pdp_difficulty_features_20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen archives without scoring public-point features
        run: |
          python3 research/notes/ecc2k130/pdp_difficulty_features_20261001/check_config.py \
            --out /tmp/ecc2k130-pdp-difficulty-input-check.json
          cmp /tmp/ecc2k130-pdp-difficulty-input-check.json \
            research/notes/ecc2k130/pdp_difficulty_features_20261001/INPUT_CHECK.json
  outcome:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-pdp-difficulty-protocol.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-pdp-difficulty-protocol.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/notes/ecc2k130/pdp_difficulty_features_20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute the scored diagnostic without importing the producer
        if: hashFiles('research/notes/ecc2k130/pdp_difficulty_features_20261001/OUTCOME.json') != ''
        run: |
          python3 research/notes/ecc2k130/pdp_difficulty_features_20261001/check_score.py \
            --choice research/notes/ecc2k130/pdp_difficulty_features_20261001/TRAIN_CHOICE.json \
            --outcome research/notes/ecc2k130/pdp_difficulty_features_20261001/OUTCOME.json
      - name: Check source-only toy algebra and deterministic statistics
        run: python3 -m unittest discover -s research/notes/ecc2k130/pdp_difficulty_features_20261001 -p test_source.py -v
      - name: Check frozen pre-outcome source and protocol bytes
        run: |
          python3 research/notes/ecc2k130/pdp_difficulty_features_20261001/source_preflight.py \
            --out /tmp/ecc2k130-pdp-difficulty-source-check.json
          cmp /tmp/ecc2k130-pdp-difficulty-source-check.json \
            research/notes/ecc2k130/pdp_difficulty_features_20261001/SOURCE_CHECK.json
