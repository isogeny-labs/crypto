name: Rootfind round107 inversion addition chain A/B
on:
  push:
    branches: ['automation/rootfind-column-accumulator-round89-20261121']
    paths:
      - 'src/cryptanalysis/prime_root_trace.rs'
      - 'research/amm_digit_perf_20261118/round107_full_ab.py'
      - '.github/workflows/rootfind-round107-inverse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  round107-source-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round107_full_ab.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Production Rust frozen Round106 vs Round107
        env:
          ROOTFIND_BASELINE_REF: 1561ce05a62418906b6a10dfd7523738c9304cc5
          ROOTFIND_AB_OUTPUT: research/amm_digit_perf_20261118/round107_full_results.csv
        run: python3 research/amm_digit_perf_20261118/round107_full_ab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfind-round107-source-exact-results
          path: research/amm_digit_perf_20261118/round107_full_results.csv
