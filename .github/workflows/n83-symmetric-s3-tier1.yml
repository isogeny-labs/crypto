name: N83 symmetric S3 Tier 1 capacity gate

on:
  push:
    branches: [codex/n83-symmetric-root-20261013]
    paths:
      - .github/workflows/n83-symmetric-s3-tier1.yml
      - examples/koblitz_orbit_dlp_fast.rs
      - research/n83_symmetric_root_20261013/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n83-symmetric-s3-tier1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  primary-point:
    if: github.repository == 'aburan28/crypto'
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|n83-symmetric-s3-tier1.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|n83-symmetric-s3-tier1.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/n83_symmetric_root_20261013

      - name: Freeze public input and observe runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-symmetric-s3-tier1"
          python3 research/n83_symmetric_root_20261013/run.py --preflight \
            > "$RUNNER_TEMP/n83-symmetric-s3-tier1/preflight.json"
          rustc --version > "$RUNNER_TEMP/n83-symmetric-s3-tier1/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-symmetric-s3-tier1/cargo-version.txt"

      - name: Build and test exact producer and rho worker
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-symmetric-s3-cargo-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast \
            root_bloom_table_tests \
            > "$RUNNER_TEMP/n83-symmetric-s3-tier1/example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast \
            --example n83_rho_optimization_eval \
            > "$RUNNER_TEMP/n83-symmetric-s3-tier1/build.log" 2>&1

      - name: Run bounded same-point arms and strong rho
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-symmetric-s3-cargo-target"
          python3 research/n83_symmetric_root_20261013/run.py \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --rho-binary "$CARGO_TARGET_DIR/release/examples/n83_rho_optimization_eval" \
            --output "$RUNNER_TEMP/n83-symmetric-s3-tier1/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-symmetric-s3-tier1/run.log"

      - name: Independently replay complete base, relation and scalar
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/n83-symmetric-s3-tier1/results" ]; then
            python3 research/n83_symmetric_root_20261013/verify.py \
              "$RUNNER_TEMP/n83-symmetric-s3-tier1/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-symmetric-s3-tier1/verify.log"
          fi

      - name: Preserve all raw receipts and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-symmetric-s3-tier1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-symmetric-s3-tier1/
          if-no-files-found: error
          retention-days: 14
