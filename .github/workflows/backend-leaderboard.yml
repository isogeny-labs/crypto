name: backend-leaderboard

# Check every PR: an extensible manifest can name sources outside an allowlist.
# This runs no solver or benchmark.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /tools/backend-leaderboard/
            /src/cryptanalysis/ecbench/band.rs
            /src/cryptanalysis/ecbench/canonical.rs
            /src/cryptanalysis/ecbench/stats.rs
            /src/cryptanalysis/ecbench/methods.rs
            /src/cryptanalysis/curve_aliases.json
            /docs/ic/calibration.json
            /docs/backend-leaderboard/
            /docs/ecbench/BACKEND_REPRODUCTION.md
            /tools/artifacts/
            /.artifacts/
      - name: Materialize the manifest's sealed inputs
        run: |
          jq -r '.sessions[] | "/" + .dir + "/", (select(.replay_receipt != null) | "/" + .replay_receipt)' docs/backend-leaderboard/manifest.json > /tmp/backend-sources.txt
          git sparse-checkout add --stdin < /tmp/backend-sources.txt
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          # Manifest sessions may keep records.jsonl in the store (e.g. claim-n13-v2).
          mapfile -t session_dirs < <(jq -r '.sessions[].dir' docs/backend-leaderboard/manifest.json)
          python3 tools/artifacts/artifacts.py pull --jobs 16 docs/backend-leaderboard "${session_dirs[@]}"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/backend-leaderboard
      - name: Format, admission tests and lint
        run: |
          cargo +1.99.1 fmt --manifest-path tools/backend-leaderboard/Cargo.toml --check
          cargo +1.99.1 test --locked --manifest-path tools/backend-leaderboard/Cargo.toml
          cargo +1.99.1 clippy --locked --manifest-path tools/backend-leaderboard/Cargo.toml --all-targets -- -D warnings
      - name: Frozen report matches its reviewed source snapshot and sealed outputs
        run: |
          python3 tools/backend-leaderboard/test_check_frozen_report.py
          python3 tools/backend-leaderboard/check_frozen_report.py
