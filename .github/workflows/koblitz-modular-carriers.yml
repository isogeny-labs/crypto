name: Koblitz modular carrier replay
on:
  pull_request:
    paths:
      - 'research/koblitz_modular_ic_20261018/**'
      - 'src/cryptanalysis/curve_construction/weil.rs'
      - 'src/cryptanalysis/curve_construction/modular.rs'
      - 'src/cryptanalysis/curve_construction/gf2k.rs'
      - 'src/cryptanalysis/curve_construction/lpoly.rs'
      - 'src/binary_ecc/**'
      - 'src/cryptanalysis/identity_certificate.rs'
      - 'src/hash/sha256.rs'
      - '.github/workflows/koblitz-modular-carriers.yml'
  push:
    branches: [main]
    paths:
      - 'research/koblitz_modular_ic_20261018/**'
      - '.github/workflows/koblitz-modular-carriers.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native tests and exact evidence replay
        shell: bash
        run: |
          set -euo pipefail
          study=research/koblitz_modular_ic_20261018
          manifest="$study/native/Cargo.toml"
          cargo test --release --locked --manifest-path "$manifest"
          replay_dir="$(mktemp -d)"
          cargo run --release --locked --manifest-path "$manifest" -- "$replay_dir"
          cmp "$study/results.json" "$replay_dir/results.json"
          for identity in "$study"/identity-n*-t*.json; do
            cmp "$identity" "$replay_dir/$(basename "$identity")"
          done
          cargo run --release --locked --manifest-path "$manifest" -- --cyclic-only "$replay_dir/cyclic-window.json"
          cmp "$study/cyclic-window.json" "$replay_dir/cyclic-window.json"
          cargo run --release --locked --manifest-path "$manifest" -- --large-identity "$replay_dir/identity-n131-balanced.json"
          cmp "$study/identity-n131-balanced.json" "$replay_dir/identity-n131-balanced.json"
      - name: Replay round 02 and its independent certificate checkers
        shell: bash
        run: |
          set -euo pipefail
          round=research/koblitz_modular_ic_20261018/rounds/02
          (cd "$round" && sha256sum -c runs.tar.xz.sha256 && tar -xJf runs.tar.xz && sha256sum -c runs.sha256)
          "$round/REPLAY.sh"
      - name: Replay round 03 twists, polarization kernels and n5 relations
        shell: bash
        run: |
          set -euo pipefail
          round=research/koblitz_modular_ic_20261018/rounds/03
          (cd "$round" && sha256sum -c runs.tar.xz.sha256 && tar -xJf runs.tar.xz && sha256sum -c runs.sha256)
          "$round/REPLAY.sh"
      - name: Replay round 04 quotient geometry and direct modular relations
        shell: bash
        run: |
          set -euo pipefail
          round=research/koblitz_modular_ic_20261018/rounds/04
          (cd "$round" && sha256sum -c runs.tar.xz.sha256 && tar -xJf runs.tar.xz && sha256sum -c runs.sha256)
          "$round/REPLAY.sh"
      - name: Replay round 05 reverse transfer, quotients and interior divisors
        shell: bash
        run: |
          set -euo pipefail
          round=research/koblitz_modular_ic_20261018/rounds/05
          (cd "$round" && sha256sum -c runs.tar.xz.sha256 && tar -xJf runs.tar.xz && sha256sum -c runs.sha256)
          "$round/REPLAY.sh"
      - name: Replay round 06 column images, quotient equations and reverse divisor
        shell: bash
        run: |
          set -euo pipefail
          round=research/koblitz_modular_ic_20261018/rounds/06
          (cd "$round" && sha256sum -c runs.tar.xz.sha256 && tar -xJf runs.tar.xz && sha256sum -c runs.sha256)
          "$round/REPLAY.sh"
      - name: Replay round 07 independent norms, odd reverse divisor and richer relations
        shell: bash
        run: |
          set -euo pipefail
          round=research/koblitz_modular_ic_20261018/rounds/07
          (cd "$round" && sha256sum -c runs.tar.xz.sha256 && tar -xJf runs.tar.xz && sha256sum -c runs.sha256)
          "$round/REPLAY.sh"
      - name: Replay round 08 line norms and global Kummer charts
        shell: bash
        run: |
          set -euo pipefail
          round=research/koblitz_modular_ic_20261018/rounds/08
          (cd "$round" && sha256sum -c runs.tar.xz.sha256 && tar -xJf runs.tar.xz && sha256sum -c runs.sha256)
          "$round/REPLAY.sh"
      - name: Replay round 09 Frobenius circuits, invariants and bounded controls
        shell: bash
        run: |
          set -euo pipefail
          round=research/koblitz_modular_ic_20261018/rounds/09
          (cd "$round" && sha256sum -c runs.tar.xz.sha256 && tar -xJf runs.tar.xz && sha256sum -c runs.sha256)
          "$round/REPLAY.sh"
      - name: Replay round 10 F2 equations, saturation and coupled divisor strata
        shell: bash
        run: |
          set -euo pipefail
          round=research/koblitz_modular_ic_20261018/rounds/10
          (cd "$round" && sha256sum -c runs.tar.xz.sha256 && tar -xJf runs.tar.xz && sha256sum -c runs.sha256)
          "$round/REPLAY.sh"
      - name: Replay round 11 local diagonal contacts and saturated graph
        shell: bash
        run: |
          set -euo pipefail
          round=research/koblitz_modular_ic_20261018/rounds/11
          (cd "$round" && sha256sum -c runs.tar.xz.sha256 && tar -xJf runs.tar.xz && sha256sum -c runs.sha256)
          "$round/REPLAY.sh"
      - name: Replay round 12 SS divisors and actual boundary saturation
        shell: bash
        run: |
          set -euo pipefail
          round=research/koblitz_modular_ic_20261018/rounds/12
          (cd "$round" && sha256sum -c runs.tar.xz.sha256 && tar -xJf runs.tar.xz && sha256sum -c runs.sha256)
          "$round/REPLAY.sh"
      - name: Replay round 13 ordinary fibers, deck images and saturation repairs
        shell: bash
        run: |
          set -euo pipefail
          round=research/koblitz_modular_ic_20261018/rounds/13
          (cd "$round" && sha256sum -c runs.tar.xz.sha256 && tar -xJf runs.tar.xz && sha256sum -c runs.sha256)
          "$round/REPLAY.sh"
      - name: Replay round 14 ordinary images, closed divisors and polarized target
        shell: bash
        run: |
          set -euo pipefail
          round=research/koblitz_modular_ic_20261018/rounds/14
          (cd "$round" && sha256sum -c runs.tar.xz.sha256 && tar -xJf runs.tar.xz && sha256sum -c runs.sha256)
          (cd "$round" && sha256sum -c validation-runs.tar.xz.sha256 && tar -xJf validation-runs.tar.xz && sha256sum -c validation-runs.sha256)
          "$round/REPLAY.sh"
          # Frozen rounds pin their original source snapshot; later registrations
          # and generators intentionally change the current source tree.
          git fetch --no-tags origin 1f733a2963736514f644aa8cff202d6e507c9dad
          research/koblitz_modular_ic_20261018/native/target/release/koblitz-modular-carriers --round15-verify-history "$round"
      - name: Replay round 15 CM carriers, theta descent and new relations
        shell: bash
        run: |
          set -euo pipefail
          round=research/koblitz_modular_ic_20261018/rounds/15
          (cd "$round" && sha256sum -c runs.tar.xz.sha256 && tar -xJf runs.tar.xz && sha256sum -c runs.sha256)
          (cd "$round" && sha256sum -c validation-runs.tar.xz.sha256 && tar -xJf validation-runs.tar.xz && sha256sum -c validation-runs.sha256)
          "$round/REPLAY.sh"
          git fetch --no-tags origin 26b0d6f82349d35bf15b049f345f3ab2ebaa57f4
          research/koblitz_modular_ic_20261018/native/target/release/koblitz-modular-carriers --round16-verify-history "$round" 26b0d6f82349d35bf15b049f345f3ab2ebaa57f4
      - name: Replay round 16 incidence, cover bases and quartic saturation separators
        shell: bash
        run: |
          set -euo pipefail
          round=research/koblitz_modular_ic_20261018/rounds/16
          (cd "$round" && sha256sum -c runs.tar.xz.sha256 && tar -xJf runs.tar.xz && sha256sum -c runs.sha256)
          (cd "$round" && sha256sum -c validation-runs.tar.xz.sha256 && tar -xJf validation-runs.tar.xz && sha256sum -c validation-runs.sha256)
          "$round/REPLAY.sh"
          git fetch --no-tags origin dcc9802e717465708a3e69562f4498bd7046def4
          research/koblitz_modular_ic_20261018/native/target/release/koblitz-modular-carriers --round16-verify-history "$round" dcc9802e717465708a3e69562f4498bd7046def4
      - name: Replay round 17 integral controls, odd theta lifts and survivor exclusions
        shell: bash
        run: |
          set -euo pipefail
          round=research/koblitz_modular_ic_20261018/rounds/17
          (cd "$round" && sha256sum -c runs.tar.xz.sha256 && tar -xJf runs.tar.xz && sha256sum -c runs.sha256)
          (cd "$round" && sha256sum -c validation-runs.tar.xz.sha256 && tar -xJf validation-runs.tar.xz && sha256sum -c validation-runs.sha256)
          "$round/REPLAY.sh"
          research/koblitz_modular_ic_20261018/native/target/release/koblitz-modular-carriers --round16-verify-sources "$round"
      - name: Install pinned Lean
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check conditional numerical proof and axioms
        working-directory: research/koblitz_modular_ic_20261018
        run: |
          set -euo pipefail
          lean CyclicWindow.lean | tee /tmp/cyclic-axioms.log
          ! grep -E 'sorryAx|error:' /tmp/cyclic-axioms.log
      - name: Build structural proofs and audit transitive axioms
        run: |
          tools/lean/proof-gate.sh research/koblitz_modular_ic_20261018/lean
