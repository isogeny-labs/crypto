name: Koblitz modular carrier replay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/koblitz_modular_ic_20261018/**'
      - '.github/workflows/koblitz-modular-carriers.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|koblitz-modular-carriers.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|koblitz-modular-carriers.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o "$RUNNER_TEMP/awscli.zip"
            python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$RUNNER_TEMP/awscli.zip" "$RUNNER_TEMP/awscli"
            chmod -R u+x "$RUNNER_TEMP/awscli"
            "$RUNNER_TEMP/awscli/aws/install" --update -i "$RUNNER_TEMP/aws-cli" -b "$RUNNER_TEMP/aws-bin"
            export ARTIFACTS_AWS="$RUNNER_TEMP/aws-bin/aws"
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 research/koblitz_modular_ic_20261018
      - uses: dtolnay/rust-toolchain@stable
      - name: Native tests and exact evidence replay
        shell: bash
        run: |
          set -euo pipefail
          study=research/koblitz_modular_ic_20261018
          manifest="$study/native/Cargo.toml"
          cargo test --release --locked --manifest-path "$manifest"
          replay_dir="$(mktemp -d)"
          cargo run --release --locked --manifest-path "$manifest" -- "$replay_dir"
          cmp "$study/results.json" "$replay_dir/results.json"
          for identity in "$study"/identity-n*-t*.json; do
            cmp "$identity" "$replay_dir/$(basename "$identity")"
          done
          cargo run --release --locked --manifest-path "$manifest" -- --cyclic-only "$replay_dir/cyclic-window.json"
          cmp "$study/cyclic-window.json" "$replay_dir/cyclic-window.json"
          cargo run --release --locked --manifest-path "$manifest" -- --large-identity "$replay_dir/identity-n131-balanced.json"
          cmp "$study/identity-n131-balanced.json" "$replay_dir/identity-n131-balanced.json"
      - name: Replay round 02 and its independent certificate checkers
        shell: bash
        run: |
          set -euo pipefail
          round=research/koblitz_modular_ic_20261018/rounds/02
          (cd "$round" && sha256sum -c runs.tar.xz.sha256 && tar -xJf runs.tar.xz && sha256sum -c runs.sha256)
          "$round/REPLAY.sh"
      - name: Replay round 03 twists, polarization kernels and n5 relations
        shell: bash
        run: |
          set -euo pipefail
          round=research/koblitz_modular_ic_20261018/rounds/03
          (cd "$round" && sha256sum -c runs.tar.xz.sha256 && tar -xJf runs.tar.xz && sha256sum -c runs.sha256)
          "$round/REPLAY.sh"
      - name: Replay round 04 quotient geometry and direct modular relations
        shell: bash
