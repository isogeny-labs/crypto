name: Standalone Boolean quadratic state
on:
  pull_request:
    paths:
      - 'research/boolean_quadratic_state_20260923/**'
      - '.github/workflows/boolean-quadratic-state.yml'
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch, merge queue) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  correctness-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exhaustive bounded algebra and search checks
        run: |
          rustc --edition 2021 -O --test research/boolean_quadratic_state_20260923/worker.rs -o /tmp/boolean-quadratic-tests
          /tmp/boolean-quadratic-tests
      - name: Frozen evidence and corruption checks
        run: python3 -m unittest discover -s research/boolean_quadratic_state_20260923 -p 'test_*.py' -v
