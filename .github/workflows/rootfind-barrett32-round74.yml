name: Rootfind cached 32-bit Barrett source-exact A/B

on:
  pull_request:
    paths:
      - 'src/cryptanalysis/prime_radical_root.rs'
      - 'research/amm_digit_perf_20261118/round74_barrett32_isolated.py'
      - '.github/workflows/rootfind-barrett32-round74.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-rust-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/cryptanalysis/prime_radical_root.rs
            research/amm_digit_perf_20261118/round74_barrett32_isolated.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Run source-exact Rust baseline, correctness, and paired benchmarks
        run: |
          set -euo pipefail
          rustc --version
          python3 research/amm_digit_perf_20261118/round74_barrett32_isolated.py
