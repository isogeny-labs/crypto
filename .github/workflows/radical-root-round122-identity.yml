name: Rootfinding Round122b AMM first-digit identity source-exact Rust A/B
on:
  push:
    branches:
      - 'automation/radical-root-mersenne-sqrt-round114-20261122'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-rust-first-digit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/cryptanalysis/prime_radical_root.rs
            research/amm_digit_perf_20261118/round122_amm_skip_identity_ab.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Source-exact Rust equality and paired AMM root benchmark
        run: |
          set -euo pipefail
          rustc --version
          python3 research/amm_digit_perf_20261118/round122_amm_skip_identity_ab.py | tee round122_identity.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfind-round122b-rust
          path: round122_identity.txt
          if-no-files-found: warn
