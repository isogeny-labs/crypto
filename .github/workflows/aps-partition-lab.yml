name: APS partition structural checks

on:
  push:
    branches: [main]
    paths:
      - 'tools/aps-partition-lab/**'
      - '.github/workflows/aps-partition-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aps-partition-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.98.0', '1.99.1']
    defaults:
      run:
        working-directory: tools/aps-partition-lab
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: tools/aps-partition-lab
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/aps-partition-lab
      - name: Format
        run: cargo fmt --check
      - name: Strict lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Bounded coverage, arithmetic and negative controls
        run: cargo test --release --locked
