name: Rootfind round82 complete-split verifier A/B
on:
  push:
    branches:
      - 'automation/rootfind-complete-split-verification-round82-20261120'
  pull_request:
    paths:
      - 'src/cryptanalysis/prime_root_trace.rs'
      - 'research/amm_digit_perf_20261118/round82_full_ab.py'
      - '.github/workflows/rootfind-trace-round82-full.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-solve-verify-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round82_full_ab.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Source-exact complete producer and verifier A/B
        run: |
          set -euo pipefail
          cargo --version
          python3 research/amm_digit_perf_20261118/round82_full_ab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round82-full-solve-verify-raw-csv
          path: research/amm_digit_perf_20261118/round82_full_ab_results.csv
