name: N83 native small intermediate Tier 1 bridge

on:
  workflow_dispatch:
  push:
    branches: [codex/n83-small-intermediate-bridge-20261018]
    paths:
      - research/n83_small_intermediate_bridge_20261018/protocol.json

permissions:
  contents: read

concurrency:
  group: n83-native-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bridge-stratum:
    if: github.repository == 'aburan28/crypto' && github.ref == 'refs/heads/codex/n83-small-intermediate-bridge-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        stratum: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare persistent receipt directory and inspect cgroup telemetry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-bridge-${{ matrix.stratum }}"
          cat /proc/self/cgroup > "$RUNNER_TEMP/n83-bridge-${{ matrix.stratum }}/proc-self-cgroup.txt"
          find /sys/fs/cgroup -maxdepth 2 -type f -name 'memory.max' -o -name 'cpu.stat' -o -name 'memory.events' \
            > "$RUNNER_TEMP/n83-bridge-${{ matrix.stratum }}/cgroup-paths.txt"

      - name: Build and test native IC, rho, fixture, runner and replay
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-bridge-${{ matrix.stratum }}-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast
          cargo test --release --locked --example n83_rho_optimization_eval
          cargo test --release --locked --example n83_bridge_fixture
          cargo test --release --locked --example n83_bridge_select
          cargo build --release --locked \
            --example koblitz_orbit_dlp_fast \
            --example n83_rho_optimization_eval \
            --example n83_bridge_fixture \
            --example n83_bridge_verify \
            --example n83_bridge_run \
            --example n83_bridge_analyze \
            --example n83_bridge_select \
            --example n83_bridge_archive
          rustc --version > "$RUNNER_TEMP/n83-bridge-${{ matrix.stratum }}/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/n83-bridge-${{ matrix.stratum }}/cargo-version.txt"

      - name: Replay frozen native fixtures, candidates and dispatch
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-bridge-${{ matrix.stratum }}-target"
          FIXTURE=research/n83_small_intermediate_bridge_20261018
          "$CARGO_TARGET_DIR/release/examples/n83_bridge_fixture" points \
            "$FIXTURE/targets.jsonl" "$FIXTURE/answers.jsonl" \
            > "$RUNNER_TEMP/n83-bridge-${{ matrix.stratum }}/fixture-check.json"
          "$CARGO_TARGET_DIR/release/examples/n83_bridge_fixture" candidates "$FIXTURE" \
            > "$RUNNER_TEMP/n83-bridge-${{ matrix.stratum }}/candidate-check.txt"
          "$CARGO_TARGET_DIR/release/examples/n83_bridge_fixture" workloads "$FIXTURE" \
            > "$RUNNER_TEMP/n83-bridge-${{ matrix.stratum }}/workload-check.json"
          "$CARGO_TARGET_DIR/release/examples/n83_bridge_fixture" seal "$FIXTURE" \
            > "$RUNNER_TEMP/n83-bridge-${{ matrix.stratum }}/dispatch-check.json"

      - name: Run calibrated native same-point IC and rho pairs
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-bridge-${{ matrix.stratum }}-target"
          "$CARGO_TARGET_DIR/release/examples/n83_bridge_run" \
            "${{ matrix.stratum }}" research/n83_small_intermediate_bridge_20261018 \
            "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            "$CARGO_TARGET_DIR/release/examples/n83_rho_optimization_eval" \
            "$RUNNER_TEMP/n83-bridge-${{ matrix.stratum }}/results" \
            2>&1 | tee "$RUNNER_TEMP/n83-bridge-${{ matrix.stratum }}/run.log"

      - name: Independently replay factor bases, relations, scalars and resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-bridge-${{ matrix.stratum }}-target"
          if [ -f "$RUNNER_TEMP/n83-bridge-${{ matrix.stratum }}/results/events.json" ]; then
            "$CARGO_TARGET_DIR/release/examples/n83_bridge_analyze" \
              "${{ matrix.stratum }}" research/n83_small_intermediate_bridge_20261018 \
              "$CARGO_TARGET_DIR/release/examples/n83_bridge_verify" \
              "$RUNNER_TEMP/n83-bridge-${{ matrix.stratum }}/results" \
              2>&1 | tee "$RUNNER_TEMP/n83-bridge-${{ matrix.stratum }}/analyze.log"
          fi

      - name: Preserve every raw receipt and failed pair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-native-bridge-stratum-${{ matrix.stratum }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-bridge-${{ matrix.stratum }}/
          if-no-files-found: error
          retention-days: 14
