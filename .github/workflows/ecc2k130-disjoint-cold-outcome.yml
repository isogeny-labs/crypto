name: ECC2K130 disjoint-Q cold outcome replay

on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-disjoint-cold-outcome.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-disjoint-cold-outcome.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 35 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/notes/ecc2k130/compact_ir_ledger_20260930/archive.py
            research/notes/ecc2k130/compact_ir_ledger_20260930/run_panel.py
            research/notes/ecc2k130/compact_k_boundary_20260929
            research/notes/ecc2k130/compact_orbit_point_panel_20260929
            research/notes/ecc2k130/compact_orbit_rank_evidence_20260929/verify_rank.py
            research/notes/ecc2k130/compact_orbit_strong_rho_20260929
            research/notes/ecc2k130/compact_s3_batch_20260929
            research/notes/ecc2k130/compact_s3_prefilter_20260930
            research/notes/ecc2k130/compact_swap_quotient_20260929
            research/notes/ecc2k130/disjoint_cold_q_20260930
            research/notes/ecc2k130/disjoint_cold_outcome_20261001
            research/notes/ecc2k130/point_sum_cold_20260930
            research/sat_factor_base_review_20260908/autolab_orbit_extract_20260924/independent_replay.py
            /tools/artifacts/
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/notes/ecc2k130 research/sat_factor_base_review_20260908/autolab_orbit_extract_20260924
      - name: Check syntax and independently replay sealed outcome
        run: |
          set -euo pipefail
          python3 -m py_compile research/notes/ecc2k130/disjoint_cold_outcome_20261001/*.py
          python3 research/notes/ecc2k130/disjoint_cold_outcome_20261001/replay_archive.py
