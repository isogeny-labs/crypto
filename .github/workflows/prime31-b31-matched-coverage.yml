name: Prime31 B31 matched 256Q coverage null Rust control
on:
  push:
    branches: [automation/prime31-b31-coverage-null-control-20261117]
    paths:
      - 'research/prime31_ic_20261115/native/examples/prime31_s9_b31_half_sum_oracle.rs'
      - 'research/prime31_ic_20261115/native/B31_MATCHED_COVERAGE_NULL_PROTOCOL_20261117.md'
      - '.github/workflows/prime31-b31-matched-coverage.yml'
  pull_request:
    paths:
      - 'research/prime31_ic_20261115/native/examples/prime31_s9_b31_half_sum_oracle.rs'
      - '.github/workflows/prime31-b31-matched-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b31-coverage-null:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            research/prime31_ic_20261115/native/examples/prime31_s9_b31_half_sum_oracle.rs
          sparse-checkout-cone-mode: false
      - name: Checkout pinned original Rust crate and arithmetic
        uses: actions/checkout@v4
        with:
          ref: 1df714645aa683cf975bc76fcacb9842cb4780fd
          path: prime31-native-pinned
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            research/prime31_ic_20261115/native
            src/cryptanalysis
      - name: Install pinned Rust compiler
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Overlay candidate only, preserving pinned native crate
        run: |
          cp research/prime31_ic_20261115/native/examples/prime31_s9_b31_half_sum_oracle.rs prime31-native-pinned/research/prime31_ic_20261115/native/examples/
      - name: Original Rust native library regression
        run: cargo +1.100.0 test --locked --release --manifest-path prime31-native-pinned/research/prime31_ic_20261115/native/Cargo.toml --lib
      - name: Matched Dickson31 vs generic B31 public-Q coverage
        shell: bash
        run: |
          set -o pipefail
          timeout -k 10 1200 cargo +1.100.0 test --locked --release --manifest-path prime31-native-pinned/research/prime31_ic_20261115/native/Cargo.toml --example prime31_s9_b31_half_sum_oracle b31_coverage_null_tests -- --nocapture --test-threads=1 2>&1 | tee prime31-b31-matched-coverage.log
      - name: Frozen source-specific result gate
        if: success()
        shell: bash
        run: |
          grep -Fq 'test result: ok. 1 passed;' prime31-b31-matched-coverage.log
          grep -Fq 'B31_MATCHED_COVERAGE_JSON=' prime31-b31-matched-coverage.log
          grep -Fq '"first_shift_zero_hits":237' prime31-b31-matched-coverage.log
          grep -Fq '"same_public_target_count":256' prime31-b31-matched-coverage.log
          grep -Fq '"sign_independent_extraction":false' prime31-b31-matched-coverage.log
      - name: Archive raw native Rust result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime31-b31-matched-coverage-raw
          path: prime31-b31-matched-coverage.log
          retention-days: 30
          if-no-files-found: warn
