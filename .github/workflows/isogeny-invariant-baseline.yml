name: isogeny-invariant-baseline
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'research/isogeny_invariant_baseline_20260926/**'
      - '.github/workflows/isogeny-invariant-baseline.yml'
  push:
    branches: [main]
    paths:
      - 'research/isogeny_invariant_baseline_20260926/**'
      - '.github/workflows/isogeny-invariant-baseline.yml'
permissions:
  contents: read
# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch, merge queue) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  exact-replay:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|isogeny-invariant-baseline.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|isogeny-invariant-baseline.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fresh replay, independent verification, corruption controls and receipt
        run: |
          python3 research/isogeny_invariant_baseline_20260926/replay_with_receipt.py \
            --require-clean --output "$RUNNER_TEMP/isogeny-evidence"
      - name: Retain evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isogeny-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/isogeny-evidence/
          if-no-files-found: error
          retention-days: 90
