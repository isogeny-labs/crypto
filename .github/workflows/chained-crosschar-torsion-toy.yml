name: Cross-characteristic torsion toy (bounded)

on:
  pull_request:
    paths:
      - 'research/cross_characteristic_global_torsion_20261112/**'
      - '.github/workflows/chained-crosschar-torsion-toy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-independent-arithmetic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact rational and finite-field Python checks
        run: |
          python3 -B research/cross_characteristic_global_torsion_20261112/toy_transfer.py
          python3 -O -B research/cross_characteristic_global_torsion_20261112/toy_transfer.py
      - name: CT51 degree-eight global torsion bridge - Python and optimization replay
        run: |
          python3 -B research/cross_characteristic_global_torsion_20261112/ct51/degree_eight.py
          python3 -O -B research/cross_characteristic_global_torsion_20261112/ct51/degree_eight.py
      - name: CT51 independently encoded degree-eight field - JavaScript
        run: |
          node research/cross_characteristic_global_torsion_20261112/ct51/independent.js
          node --no-opt research/cross_characteristic_global_torsion_20261112/ct51/independent.js
      - name: Independent JavaScript verifier and negative control
        run: |
          node research/cross_characteristic_global_torsion_20261112/independent.js
          node --no-opt research/cross_characteristic_global_torsion_20261112/independent.js
      - name: CT52 exact Galois orbit certificates - Python and independent JavaScript
        run: |
          python3 -B research/cross_characteristic_global_torsion_20261112/ct52/ct52_galois.py
          python3 -O -B research/cross_characteristic_global_torsion_20261112/ct52/ct52_galois.py
          node research/cross_characteristic_global_torsion_20261112/ct52/ct52_independent.js
          node --no-opt research/cross_characteristic_global_torsion_20261112/ct52/ct52_independent.js

      - name: CT53 full-symplectic vs split-block orbit verifiers
        run: |
          python3 -B research/cross_characteristic_global_torsion_20261112/ct53/ct53_orbits.py
          python3 -O -B research/cross_characteristic_global_torsion_20261112/ct53/ct53_orbits.py
          node research/cross_characteristic_global_torsion_20261112/ct53/ct53_independent.js
          node --no-opt research/cross_characteristic_global_torsion_20261112/ct53/ct53_independent.js

      - name: CT81 fixed-source-prime compatibility, independent implementations
        run: |
          D=research/cross_characteristic_global_torsion_20261112/ct81
          python3 -B "$D/ct81_source_prime_alignment.py" > /tmp/ct81-py.txt
          python3 -O -B "$D/ct81_source_prime_alignment.py" > /tmp/ct81-pyopt.txt
          node "$D/ct81_alignment_independent.js" > /tmp/ct81-js.txt
          node --no-opt "$D/ct81_alignment_independent.js" > /tmp/ct81-jsopt.txt
          cmp /tmp/ct81-py.txt /tmp/ct81-pyopt.txt
          cmp /tmp/ct81-py.txt /tmp/ct81-js.txt
          cmp /tmp/ct81-py.txt /tmp/ct81-jsopt.txt
      - name: CT82 prime-to-37 global reduction and independent Hensel, pinned digest
        run: |
          D=research/cross_characteristic_global_torsion_20261112/ct82
          python3 -B "$D/ct82_local_inverse.py" > /tmp/ct82-py.txt
          python3 -O -B "$D/ct82_local_inverse.py" > /tmp/ct82-pyopt.txt
          node "$D/ct82_local_inverse_independent.js" > /tmp/ct82-js.txt
          node --no-opt "$D/ct82_local_inverse_independent.js" > /tmp/ct82-jsopt.txt
          cmp /tmp/ct82-py.txt /tmp/ct82-pyopt.txt
          cmp /tmp/ct82-py.txt /tmp/ct82-js.txt
          cmp /tmp/ct82-py.txt /tmp/ct82-jsopt.txt
          printf '%s  %s\n' a890c3fffb0f89eadc56688b7fa26a8ebb8538c61d528b8b2ea2ccafa6149d12 /tmp/ct82-py.txt | sha256sum -c

      - name: CT83 fixed-place precision obstruction and binary-residue negative control
        run: |
          D=research/cross_characteristic_global_torsion_20261112/ct83
          python3 -B "$D/ct83_precision_gate.py" > /tmp/ct83-py.json
          python3 -O -B "$D/ct83_precision_gate.py" > /tmp/ct83-pyopt.json
          node "$D/ct83_precision_independent.js" > /tmp/ct83-js.json
          node --no-opt "$D/ct83_precision_independent.js" > /tmp/ct83-jsopt.json
          cmp /tmp/ct83-py.json /tmp/ct83-pyopt.json
          cmp /tmp/ct83-py.json /tmp/ct83-js.json
          cmp /tmp/ct83-py.json /tmp/ct83-jsopt.json
          printf '%s  %s\n' 7625287b302b557c7a444ca6a632f92800c17a2d5864b505100f21041cb9ffd5 /tmp/ct83-py.json | sha256sum -c
