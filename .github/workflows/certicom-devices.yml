name: Certicom CPU and GPU correctness
on:
  pull_request:
    paths:
      - 'gpu/certicom/**'
      - 'src/cryptanalysis/certicom_dlp/**'
      - 'src/cryptanalysis/certicom_dlp_cli.rs'
      - 'suite/src/cryptanalysis/certicom_dlp/**'
      - 'suite/src/cryptanalysis/certicom_dlp_cli.rs'
      - 'tests/certicom_solvers.rs'
      - 'suite/tests/certicom_solvers.rs'
      - '.github/workflows/certicom-devices.yml'
  workflow_dispatch:
    inputs:
      hardware_backend:
        description: Backend to qualify on an existing GPU runner
        type: choice
        options: [cuda, metal]
        default: cuda
      hardware_runner:
        description: Existing runner label for real-device tests; empty skips hardware execution
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cpu-cross-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: crate
        shell: bash
        run: |
          if [[ -f suite/Cargo.toml ]]; then
            echo 'manifest=suite/Cargo.toml' >> "$GITHUB_OUTPUT"
            echo 'workspace=suite' >> "$GITHUB_OUTPUT"
          else
            echo 'manifest=Cargo.toml' >> "$GITHUB_OUTPUT"
            echo 'workspace=.' >> "$GITHUB_OUTPUT"
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.crate.outputs.workspace }} -> target
      - name: Cross-check the shared device source against independent Rust arithmetic
        env:
          CARGO_BUILD_JOBS: '2'
        run: cargo test --manifest-path '${{ steps.crate.outputs.manifest }}' --release --lib certicom_dlp -- --test-threads=2
  cuda-build:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.9.1-devel-ubuntu24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile native CUDA workers; this job does not execute GPU kernels
        shell: bash
        run: |
          for arch in sm_70 sm_80 sm_90; do
            nvcc -O2 -std=c++17 -arch="$arch" gpu/certicom/cuda.cu -o "/tmp/certicom_cuda_$arch"
          done
  metal-qualification:
    runs-on: macos-14
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        phase: [library, cli]
    steps:
      # This repository carries large research archives that the Metal build does
      # not read.  Materializing them consumed about three minutes of this job's
      # fixed 25-minute budget and made an otherwise passing cold qualification
      # time out.  Keep the exact Rust crate, its local dependencies and device
      # harness while leaving unrelated evidence blobs off the macOS runner.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Cargo.lock
            /Cargo.toml
            /src/
            /tests/certicom_solvers.rs
            /gpu/certicom/
            /tools/factor-base/
            /tools/volcano-cli/
            /isogeny_algos/
            /research/full_volcano_graphwide_ic_20261017/execution/driver.rs
            /research/full_volcano_graphwide_ic_20261017/execution/PROTOCOL.md
            /research/full_volcano_graphwide_ic_20261017/execution/summarize.rs
            /research/conductor_gap_cm_orbits_20261015/native/study.rs
            /research/conductor_gap_cm_orbits_20261015/native/ecbench_next.rs
            /research/conductor_gap_followups_20261016/native/followups.rs
            /research/conductor_gap_followups_20261016/native/posthoc.rs
            /docs/curves/cover-links.yaml
            /docs/curves/fixed-f8-genus3-order-certificate.json
            /docs/ecdlp-audit/ECDLP_AUDIT_PLAN.mock.json
            /docs/ecdlp-audit/ecdlp-audit-plan.schema.json
            /docs/curves/registry.json
            /docs/curves/standards/parameters.json
            /docs/curves/traits.json
            /docs/ecbench/schema.sql
            /docs/ic/archive-comparison-v1.json
            /docs/ic/archive-comparison-v1.json.sha256
            /docs/ic/archive-technique-comparison-v2.json
            /docs/ic/archive-technique-comparison-v2.json.sha256
            /docs/ic/boundary_targets.json
            /docs/ic/calibration.json
            /docs/identity-certificates/schoenhage-10mult.json
            /docs/units/bitop-v1.vectors.json
            /docs/units/bitop-v2.vectors.json
            /research/ecbench_n41_n53_shared_rank_20261005/sessions/mac-l0/records.jsonl
            /research/ecbench_n41_n53_shared_rank_20261005/sessions/mac-l0/session.json
            /research/ecbench_rootfind_parity_20261013/sessions/claim-n13-v2/comparisons/rho-strong__ic-c2-frob-counted-m2.json
            /research/f4_linear_algebra_20260914/contract.json
            /research/f6_ic_ecbench_ladder_20261005/sessions/n31-killed-02/host.json
            /research/f6_ic_ecbench_ladder_20261005/sessions/n31-killed-02/plan.json
            /research/f6_ic_ecbench_ladder_20261005/sessions/n31-killed-02/records.jsonl
            /research/f6_ic_ecbench_ladder_20261005/sessions/n31-killed-02/session.json
            /research/f6_ic_ecbench_ladder_20261005/sessions/n31-killed-02/spec.json
            /research/ghs_cubic_genus3_build_20261012/results/run-20261013T0320Z.jsonl
            /research/ic_candidate_tournament_20260915/goal_20260924/prepared-ic-state-v1/sat-preparation.json
            /research/ic_candidate_tournament_20260915/goal_20260924/prepared-ic-state-v1/f5-preparation.json
            /research/ic_candidate_tournament_20260915/goal_20260924/prepared-f5-runtime-v1/mathematics.json
            /research/ic_candidate_tournament_20260915/goal_20260924/prepared-f5-v3-control-v1/controls/pipeline.stdout
            /research/ic_candidate_tournament_20260915/goal_20260924/prepared-report-contract-v1/sat-source-check/instance.anf
            /research/ic_candidate_tournament_20260915/goal_20260924/prepared-report-contract-v1/sat-source-check/instance.xor.cnf
            /research/ic_candidate_tournament_20260915/goal_20260924/prepared-report-contract-v1/sat-source-check/manifest.json
            /research/ic_candidate_tournament_20260915/goal_20260924/prepared-report-contract-v1/sat-source-check/result.json
            /research/koblitz_isogeny_descent_37_results_20260925/raw.json.gz
            /research/notes/ecc2k130/disjoint_cold_v2_20261001/FROZEN.json
            /research/notes/ecc2k130/disjoint_cold_v2_20261001/fixtures/n37_L1024_b00.points.jsonl
            /research/notes/ecc2k130/n37_native_basis_bridge_20261002/NATIVE42.json
            /research/quartic_pic_canonical_20261018/results/v4_dump_q11.jsonl
            /research/quartic_pic_canonical_20261018/results/v4_dump_q5.jsonl
            /research/quartic_pic_canonical_20261018/results/v4_dump_q7.jsonl
            /tests/fixtures/ecbench_manifest_small.json
      - name: Compile native Metal shader and worker
        run: make -C gpu/certicom metal
      - name: Probe whether this macOS runner exposes a Metal device
        id: probe
        shell: bash
        run: |
          set +e
          gpu/certicom/certicom_metal --probe > certicom-device-probe.log 2>&1
          status=$?
          set -e
          cat certicom-device-probe.log
          if [[ "$status" == 0 ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [[ "$status" == 3 ]] && [[ $(cat certicom-device-probe.log) == 'certicom worker: no Metal device at requested ordinal' ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Metal compiled, but this runner exposes no Metal device. Hardware qualification remains open.' >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$status"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.probe.outputs.available == 'true'
      - name: Qualify Metal arithmetic and all three solvers (${{ matrix.phase }})
        if: steps.probe.outputs.available == 'true'
        env:
          CERTICOM_TEST_BACKEND: metal
          CERTICOM_TEST_PHASE: ${{ matrix.phase }}
          CARGO_BUILD_JOBS: '2'
        run: bash gpu/certicom/qualify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certicom-metal-hosted-device-observation-${{ matrix.phase }}
          path: certicom-device-*.log
          if-no-files-found: error
  metal-build:
    needs: metal-qualification
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require both Metal qualification phases
        env:
          QUALIFICATION_RESULT: ${{ needs.metal-qualification.result }}
        run: test "$QUALIFICATION_RESULT" = success
  hardware:
    if: github.event_name == 'workflow_dispatch' && inputs.hardware_runner != ''
    runs-on: ${{ inputs.hardware_runner || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      CERTICOM_TEST_BACKEND: ${{ inputs.hardware_backend }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Qualify the requested device through the library and release CLI
        shell: bash
        run: bash gpu/certicom/qualify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certicom-${{ inputs.hardware_backend }}-device-correctness
          path: certicom-device-*.log
          if-no-files-found: error
