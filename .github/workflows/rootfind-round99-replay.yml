name: Rootfind round99 quadratic PowerStep verifier A/B
on:
  push:
    branches:
      - 'automation/rootfind-column-accumulator-round89-20261121'
    paths:
      - 'src/cryptanalysis/prime_root_trace.rs'
      - 'research/amm_digit_perf_20261118/round99_full_ab.py'
      - '.github/workflows/rootfind-round99-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round99_full_ab.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Source-exact Rust Round98 vs Round99 complete root solve+verify
        env:
          ROOTFIND_BASELINE_REF: e1d8829f9208d3ef88a2c55e76df7bf221739e5f
          ROOTFIND_AB_OUTPUT: research/amm_digit_perf_20261118/round99_full_results.csv
        run: python3 research/amm_digit_perf_20261118/round99_full_ab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfind-round99-complete-ab
          path: research/amm_digit_perf_20261118/round99_full_results.csv
