name: Toy quotient and representation controls
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|toy-quotient-controls.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|toy-quotient-controls.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/toy_quotient_controls_20260924
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned independent algebra reference
        run: python3 -m pip install -r research/toy_quotient_controls_20260924/requirements.txt
      - name: Algebra, controls, profiling and negative tests
        run: python3 -m unittest discover -s research/toy_quotient_controls_20260924 -p 'test_*.py' -v
      - name: Verify committed evidence
        run: python3 research/toy_quotient_controls_20260924/verify_replay.py
      - name: Replay the complete bounded experiment
        run: python3 research/toy_quotient_controls_20260924/run.py --output "$RUNNER_TEMP/toy-quotient-controls"
      - name: Compare deterministic evidence
        run: python3 research/toy_quotient_controls_20260924/verify_replay.py "$RUNNER_TEMP/toy-quotient-controls"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toy-quotient-controls-results
          path: ${{ runner.temp }}/toy-quotient-controls
