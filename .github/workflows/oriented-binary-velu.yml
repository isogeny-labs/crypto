name: Oriented binary Velu
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|oriented-binary-velu.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|oriented-binary-velu.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate oriented maps and exceptional inputs
        run: python3 research/ecc2k130_oriented_transport_20260924/validate.py --out /tmp/oriented-velu-validation.json
      - name: Match deterministic evidence and source hashes
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          frozen = json.loads(Path('research/ecc2k130_oriented_transport_20260924/validation.json').read_text())
          fresh = json.loads(Path('/tmp/oriented-velu-validation.json').read_text())
          for key in ('status', 'sha256', 'toy_rows', 'generic_interface_control', 'exact_rows'):
              assert fresh[key] == frozen[key], key
          assert fresh['status'] == 'PASS'
          PYCODE
