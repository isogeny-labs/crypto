name: Rootfind Round 129 source-exact performance
on:
  push:
    branches:
      - automation/rootfind-round129-monic-factors-20261123
  pull_request:
    paths:
      - src/cryptanalysis/ecbench/isogeny.rs
      - research/rootfind_round129/**
      - .github/workflows/rootfind_round129.yml
permissions:
  contents: read
jobs:
  source-exact-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src/cryptanalysis/ecbench/isogeny.rs
            research/rootfind_round129
      - name: Build baseline and optimized from unmodified production modules
        shell: bash
        run: |
          set -euo pipefail
          BASE=b9041ccc17150f58cd0a823daf7ad9d575108e07
          git fetch --no-tags --depth=1 origin "$BASE"
          mkdir -p /tmp/rootfind_round129
          git show "$BASE:src/cryptanalysis/ecbench/isogeny.rs" > /tmp/rootfind_round129/baseline.rs
          cp src/cryptanalysis/ecbench/isogeny.rs /tmp/rootfind_round129/optimized.rs
          cat research/rootfind_round129/bench_helper.rs >> /tmp/rootfind_round129/baseline.rs
          cat research/rootfind_round129/bench_helper.rs >> /tmp/rootfind_round129/optimized.rs
          cp research/rootfind_round129/source_exact_main.rs /tmp/rootfind_round129/main.rs
          rustc --version
          rustc --edition=2021 -C opt-level=3 -C target-cpu=native /tmp/rootfind_round129/main.rs -o /tmp/rootfind_round129/bench
      - name: Source-exact native Rust correctness and A/B timings
        run: /tmp/rootfind_round129/bench