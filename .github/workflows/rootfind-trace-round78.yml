name: Rootfind round78 trace division (source-exact Rust)
on:
  pull_request:
    paths:
      - 'src/cryptanalysis/prime_root_trace.rs'
      - 'research/amm_digit_perf_20261118/round78_trace_isolated.py'
      - '.github/workflows/rootfind-trace-round78.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-exact-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round78_trace_isolated.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare exact Rust output and benchmark paired 13-trial A/B
        run: |
          set -euo pipefail
          rustc --version
          python3 research/amm_digit_perf_20261118/round78_trace_isolated.py
