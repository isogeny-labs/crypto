name: CM19 actual ramification and residual branch certificates
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - research/chained_cm19_ramification_20261124/**
      - .github/workflows/chained-cm19-ramification.yml
permissions:
  contents: read
jobs:
  canonical-divisor-and-residual-branches:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.artifacts/config.json
            /.gitattributes
            /.gitignore
            /AGENTS.md
            /pcc/claims/PCC-20261124-2bf624.json
