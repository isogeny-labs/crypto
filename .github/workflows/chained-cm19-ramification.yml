            /research/chained_cm19_fibres_20261124/LOCAL_EVALUATION_PROOF_F.md
            /research/chained_cm19_fibres_20261124/NEXT_RAMIFICATION_H.md
            /research/chained_cm19_fibres_20261124/WEIGHTED_FIBRE_S4_PROOF_H.md
            /research/chained_cm19_fibres_20261124/first-C-native/weighted-fibres.stdout
            /research/chained_cm19_fibres_20261124/first-E-native/actual-functions.stdout
            /research/chained_cm19_fibres_20261124/first-F-native/polynomial-evaluation.stdout
            /research/chained_cm19_fibres_20261124/maintenance/CURRENT_AGENTS_REVIEW_I.json
            /research/chained_cm19_ramification_20261124/ACTUAL_RAMIFICATION_PROOF_B.md
            /research/chained_cm19_ramification_20261124/BOOTSTRAP_A.json
            /research/chained_cm19_ramification_20261124/CHECKPOINT_CLASSIFICATION_A.md
            /research/chained_cm19_ramification_20261124/FIRST_A_LINT_NEGATIVE.json
            /research/chained_cm19_ramification_20261124/FIRST_B_NATIVE_INVENTORY.json
            /research/chained_cm19_ramification_20261124/FORMAT_PREPARATION_A.json
