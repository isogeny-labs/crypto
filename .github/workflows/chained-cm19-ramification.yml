            /research/chained_cm19_ramification_20261124/preformat-draft-C/main_c.rs
            /research/chained_cm19_ramification_20261124/run_ci_E.sh
            /research/chained_cm19_ramification_20261124/run_first_A.sh
            /research/chained_cm19_ramification_20261124/run_first_B.sh
            /research/chained_cm19_ramification_20261124/run_first_C.sh
      - name: Install exact native Rust toolchain with official rustup
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Verify frozen bytes and run bounded actual branch regression
        shell: bash
        run: bash research/chained_cm19_ramification_20261124/run_ci_E.sh "$RUNNER_TEMP/cm19-ramification-ci"
      - name: Retain complete new CI original streams and binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm19-ramification-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cm19-ramification-ci
          if-no-files-found: warn
          retention-days: 14
