name: Temporary cover assessment ledger refresh

on:
  push:
    branches: [codex/n83-cover-ledger-refresh-20261101]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message == 'Regenerate cover assessment ledger'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/workflows/
            /scripts/
            /src/
            /docs/curves/
            /docs/ecdlp-audit/
            /research/cover_transfer_assessment_20261013/
            /research/hyperelliptic_cover_infrastructure_20261006/
            /tools/artifacts/
            /.artifacts/
            /Cargo.toml
            /Cargo.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pull assessment artifacts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            "$RUNNER_TEMP/artifacts-awscli/bin/python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$RUNNER_TEMP/artifacts-awscli/bin/aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 docs/curves research/cover_transfer_assessment_20261013
      - name: Regenerate, verify, and self-remove
        run: |
          node scripts/build_cover_transfer_assessments.mjs --write
          node research/cover_transfer_assessment_20261013/verify_assessment.mjs
          rm .github/workflows/n83-cover-ledger-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/curves/cover-transfer-assessments.json .github/workflows/n83-cover-ledger-refresh.yml
          git diff --cached --exit-code && { echo 'expected regenerated changes'; exit 1; } || true
          git commit -m 'Refresh n83 cover assessment ledger'
          git push origin HEAD:codex/n83-cover-ledger-refresh-20261101
