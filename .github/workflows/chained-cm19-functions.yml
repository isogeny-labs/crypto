      - name: Install pinned Rust with official rustup
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Install pinned standard Lean release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst --output "$RUNNER_TEMP/lean-4.35.0-linux.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean-4.35.0-linux.tar.zst" -C "$RUNNER_TEMP"
          echo "LEAN_TOOLCHAIN_DIR=$RUNNER_TEMP/lean-4.35.0-linux" >> "$GITHUB_ENV"
      - name: Verify frozen source and run bounded actual map regression
        shell: bash
        run: bash research/chained_cm19_fibres_20261124/run_ci_I.sh "$RUNNER_TEMP/cm19-functions-ci"
      - name: Retain complete new CI originals and binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm19-functions-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cm19-functions-ci
          if-no-files-found: warn
          retention-days: 14
