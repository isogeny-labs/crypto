name: Workflow files parse
# A workflow GitHub cannot parse does not fail the way a failing step does. It
# produces a run with no jobs, named after the file path instead of the
# workflow, and the checks inside it stop happening silently. polynomial-reuse
# spent four days in that state on main -- red on every push, its redis-cache
# correctness tests not running once -- because a `--lib module::` filter left a
# plain YAML scalar ending in a colon. This job reports that as a test failure
# with a file and a line, on the pull request that introduces it.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/workflows_archive/**'
      - 'scripts/test_workflows_parse.py'
      - '.github/scripts/*ci-scope*'
      - '.github/scripts/*frozen-workflow*'
      - '.github/scripts/n53-historical-cargo-lock-view-v1.json'
      - '.github/scripts/check-pr-budgets.py'
      - '.github/scripts/test-pr-budgets.py'
      - 'research/weak_curve_properties_lean_20261011/EVIDENCE_SHA256.tsv'
      - 'research/weak_curve_conjectures_20261012/EVIDENCE_SHA256SUMS'
# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parse:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|workflows-parse.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|workflows-parse.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /.github/workflows_archive/
            /.github/scripts/
            /scripts/test_workflows_parse.py
            /research/weak_curve_properties_lean_20261011/EVIDENCE_SHA256.tsv
            /research/weak_curve_conjectures_20261012/EVIDENCE_SHA256SUMS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml
      - run: python3 -B scripts/test_workflows_parse.py -v
      - run: node --test .github/scripts/test-ci-scope.mjs
      - run: node --test .github/scripts/test-frozen-workflow-check.mjs
      - run: python3 -B .github/scripts/test-pr-budgets.py -v
      - run: python3 -B .github/scripts/check-pr-budgets.py
      # Archived workflows are not registered by GitHub and are skipped by the
      # globs above on purpose, but the cheap invariants still hold: they parse,
      # stay manual-only, do not shadow a live workflow, and match the manifest.
      - name: Archived workflows stay parseable and manual-only
        run: |
          python3 -B - <<'PY'
          import json, pathlib, sys, yaml
          live = pathlib.Path('.github/workflows')
          arch = pathlib.Path('.github/workflows_archive')
          problems = []
          files = sorted(arch.glob('*.yml')) + sorted(arch.glob('*.yaml'))
          for p in files:
              try:
                  doc = yaml.safe_load(p.read_text(encoding='utf-8'))
              except yaml.YAMLError as err:
                  problems.append('%s: unparseable: %s' % (p.name, err))
                  continue
              on = doc.get('on') or doc.get(True) if isinstance(doc, dict) else None
              if not (on == 'workflow_dispatch' or (isinstance(on, dict) and set(on) == {'workflow_dispatch'})):
                  problems.append('%s: archived workflows must be workflow_dispatch-only' % p.name)
              if not (isinstance(doc, dict) and doc.get('jobs')):
                  problems.append('%s: no jobs' % p.name)
              if (live / p.name).exists():
                  problems.append('%s: also present in .github/workflows' % p.name)
          manifest = json.loads((arch / 'MANIFEST.json').read_text(encoding='utf-8'))
          listed = sorted(m['file'] for m in manifest['moved'])
          if listed != sorted(p.name for p in files):
              problems.append('MANIFEST.json moved list does not match the archive directory')
          for m in manifest['left_in_place_with_reason']:
              if not (live / m['file']).exists():
                  problems.append('%s: listed as left in place but missing from .github/workflows' % m['file'])
          if problems:
              sys.exit('\n'.join(problems))
          print('archive ok: %d workflows' % len(files))
          PY
