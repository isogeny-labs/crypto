name: N83 K3114 fine-grid capacity proof

on:
  push:
    branches: [codex/n83-online-range-20261016]
    paths:
      - .github/workflows/n83-online-finegrid-proof.yml
      - research/n83_online_finegrid_20261016/Capacity.lean
      - research/n83_online_finegrid_20261016/lean-toolchain
      - research/n83_online_finegrid_20261016/proof_check.log
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-check:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|n83-online-finegrid-proof.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|n83-online-finegrid-proof.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research
      - name: Check the pinned capacity theorem and axioms
        shell: bash
        working-directory: research/n83_online_finegrid_20261016
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lean Capacity.lean > /tmp/n83-finegrid-proof-check.log
          diff -u proof_check.log /tmp/n83-finegrid-proof-check.log
          if rg -n '\b(sorry|admit|sorryAx)\b' Capacity.lean; then
            exit 1
          fi
