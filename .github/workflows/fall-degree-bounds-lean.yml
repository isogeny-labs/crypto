name: Fall-degree bounds Lean checks
# Re-derives the E3/E4/E6 scoring in Lean on every change to the study:
# Data.lean must be what examples/fall_degree_lean_data.rs generates from the
# committed records, the E5 replay must still match the Sage records, and
# Verdict.lean must close by kernel `decide`. See
# research/fall_degree_bounds_20261008/RESULTS.md.
on:
  # Not a pull-request check. The merge set is gate, size, and artifacts.
  # This runs when the matching change is on main, or on its schedule.
  push:
    branches: [main]
    paths:
      - '.github/workflows/fall-degree-bounds-lean.yml'
      - 'examples/fall_degree_lean_data.rs'
      - 'examples/hky_last_fall_degree.rs'
      - 'research/fall_degree_bounds_20261008/**'
  workflow_dispatch:

jobs:
  lean:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|fall-degree-bounds-lean.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|fall-degree-bounds-lean.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: research/fall_degree_bounds_20261008
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 research/fall_degree_bounds_20261008
      - name: Install Lean (toolchain pinned by lean/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Data.lean regenerated from the records; E5 replay against Sage
        run: |
          cargo build --release --example fall_degree_lean_data --example hky_last_fall_degree
          ../../target/release/examples/fall_degree_lean_data . /tmp/Data.lean
          diff -u lean/FallDegree/Data.lean /tmp/Data.lean
          for f in runs/n{8,10,12,14}_subfield_*.jsonl; do
            ../../target/release/examples/hky_last_fall_degree replay "$f"
          done | grep -c '"agree":true' | grep -qx 32
      - name: lake build (Rule, Verdict by decide)
        working-directory: research/fall_degree_bounds_20261008/lean
        run: lake build
