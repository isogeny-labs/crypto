name: Factor-base factory

on:
  # Not a pull-request check. The merge set is gate, size, and artifacts.
  # This runs when the matching change is on main, or on its schedule.
  push:
    branches: [main]
    paths:
      - 'tools/factor-base/**'
      - 'tools/complexity-catalog/**'
      - 'research/hexagon_cscc_20261030/**'
      - 'docs/ic/FACTOR_BASE_FACTORY.md'
      - '.github/workflows/factor-base-factory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factor-base-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Factory (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|factor-base-factory.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|factor-base-factory.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/factor-base
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools/factor-base
            tools/complexity-catalog
            research/hexagon_cscc_20261030
            crates/hashed-ecdl-tensor
            src
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/factor-base
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Check complete complexity-source coverage and finite controls
        working-directory: tools/complexity-catalog
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Regenerate every frozen archive and replay the relation receipt
        shell: bash
        run: |
          set -euo pipefail
          for manifest in validation/archive/manifests/*.json; do
            digest="$(basename "$manifest" .json)"
            target/release/factor-base verify validation/archive "$digest"
          done
          target/release/factor-base replay validation/archive \
            e17f8c9cba841c0af017a66ec04859885d24a5eb7519f05c5090a0f77fbf1c62 \
            validation/local/evaluation-binary.json
