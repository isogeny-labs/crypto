name: Weak curve conjecture evidence
on:
  # Not a pull-request check. The merge set is gate, size, and artifacts.
  # This runs when the matching change is on main, or on its schedule.
  push:
    branches: [main]
    paths:
      - 'research/weak_curve_conjectures_20261012/**'
      - 'research/iso1_weak_classes_20261007/two_branch_20261009/p*_classes.csv'
      - '.github/workflows/weak-curve-conjectures.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: research/weak_curve_conjectures_20261012
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 research/iso1_weak_classes_20261007/two_branch_20261009
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify frozen evidence and replay the fixed censuses
        run: |
          sha256sum -c EVIDENCE_SHA256SUMS
          jq -e -f validate.jq conjectures.json
          cp REVIEW.tsv /tmp/review-expected.tsv
          cp FALSIFIERS.tsv /tmp/falsifiers-expected.tsv
          cp INPUTS_SHA256.tsv /tmp/inputs-expected.tsv
          rustc --edition=2021 review.rs -o /tmp/weak-curve-review
          /tmp/weak-curve-review
          cmp REVIEW.tsv /tmp/review-expected.tsv
          cmp FALSIFIERS.tsv /tmp/falsifiers-expected.tsv
          cmp INPUTS_SHA256.tsv /tmp/inputs-expected.tsv
          rustc --edition=2021 --test review.rs -o /tmp/weak-curve-review-tests
          /tmp/weak-curve-review-tests
      - name: Build counting lemmas and replay in a fresh kernel
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/weak_curve_conjectures_20261012
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose CensusCounting'
      - name: Audit transitive axioms
        run: lake env lean AxiomAudit.lean
