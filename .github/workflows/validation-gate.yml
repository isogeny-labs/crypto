      # TEMPORARY store-outage fallback (2026-11-16): the artifact store
      # bucket returns AllAccessDisabled/403 for every object. Keep the gate
      # usable by continuing without the pulled data; remove this tolerance
      # and the continue-on-error below once the store is reachable again.
      - name: Pull store data this workflow reads (tools/artifacts)
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 benchmarks/20261115-fes-k13-runpod/session experiments/31_solve_cost experiments/37_solver_b_pivot_count research/blindspots_20261018/01-fp2-gaudry-k2/raw research/cheon_ecbench_20261022/sessions research/cheon_ecbench_wide_20261106/sessions research/ecbench_generator_orbit_20261022/sessions research/ecbench_overhead_review_20261022/sessions research/fes_k13_validated_20261112/runpod-a1/session research/five_leads_e2e_20261019/sessions_projective_chart_v2.tar.zst research/four_followups_20261021/results/matched research/four_followups_20261021/results/pencil-pilot research/ic_aimed_gather_20261023/aa2_20261029/runs research/ic_gw_bl_reuse_20261115 research/ic_gw_nrm_lz_20261115 research/ic_ksum_prune_20261115 research/ic_packed_filter_20261029 research/ic_tableb_binary_ksum_20261115 research/ic_tableb_ksum_20261115/sessions research/icb_large_prime_n53_n61_20261029/sessions research/kummer_coordinates_20261022/results research/kummer_differential_collector_20261022/results research/ml_cryptanalysis_pt_lgrow_k1_20261114 research/pencil_sparse_20261022/results research/pkm_tower_rootfind_20261018/sessions research/postgb_linear_stage_20261026 research/projective_law_followup_20261022/results research/wallfix_runpod_20261114/sessions/run2
      - name: Fetch the base tip
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.local_runner)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags --depth=1 --filter=blob:none origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          # validation_gate.py refuses a base ref that does not resolve; check
          # it here too so the failure names the fetch.
          git rev-parse --verify "origin/$BASE_REF^{commit}"
      - uses: actions/setup-python@v5
        # EKS runners may default to Python 3.12; the dedicated local runner
        # already includes 3.11 and keeps its isolated tool cache untouched.
        if: runner.environment == 'github-hosted' || !startsWith(runner.name, 'crypto-cli-gate-')
        with:
          python-version: '3.11'
