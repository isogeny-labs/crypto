name: validation-gate

# AGENTS.md, "Validation gate" (owner rule, 2026-10-19): no row reaches the IC
# leaderboard or benchmarks/README.md without a replay certificate, a validator
# report and a matched rho reference, named by the VALIDATION.json of its
# evidence directory (docs/VALIDATION_GATE.md).  Rows that predate the gate are
# frozen in docs/ic/validation/PRE_GATE.json and benchmarks/PRE_GATE.json and
# render as "unvalidated (pre-gate)"; a row added or changed after the freeze
# must be validated, and the freeze files may only shrink.
#
# This runs on every pull request (no paths filter): the check is cheap, and a
# filter would let a row slip in through a file the filter forgot.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The full research tree exceeds 7 GiB and exhausted a hosted runner
          # before this job reached its tests. Keep the complete evidence paths
          # used by the current leaderboard and benchmark rows. A new validated
          # row that cites another directory must add that directory here.
          fetch-depth: 2
          sparse-checkout: |
            benchmarks
            docs/ic
            papers
            research/validation_sweep_20261019
            research/ic_oracle_setup_blocked_20261020
            research/ic_tool_program
            research/isogeny-volcano-cost-v2_20261017
            research/pdp_split_slots_20261012
            research/two_sylow_fp64_20261017
            research/volcano_ecdlp_census_20261017
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: The gate's own tests, with a positive and a negative fixture
        run: python3 scripts/test_validation_gate.py
      - name: Every leaderboard and benchmarks row is validated or frozen pre-gate
        run: |
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Checkout's synthetic PR merge commit has the exact base as its
            # first parent and the submitted head as its second parent.
            test "$(git rev-parse HEAD^2)" = "${{ github.event.pull_request.head.sha }}"
            base="--base HEAD^1"
          fi
          python3 scripts/validation_gate.py check $base
