name: validation-gate

# AGENTS.md, "Validation gate" (owner rule, 2026-10-19): no row reaches the IC
# leaderboard or benchmarks/README.md without a replay certificate, a validator
# report and a matched rho reference, named by the VALIDATION.json of its
# evidence directory (docs/VALIDATION_GATE.md).  Rows that predate the gate are
# frozen in docs/ic/validation/PRE_GATE.json and benchmarks/PRE_GATE.json and
# render as "unvalidated (pre-gate)"; a row added or changed after the freeze
# must be validated, and the freeze files may only shrink.
#
# This runs on every pull request (no paths filter): the check is cheap, and a
# filter would let a row slip in through a file the filter forgot.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_runner:
        description: Use the dedicated local validation runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Keep the merge gate available while the optional EKS pools are offline.
    # This is ordinary CPU validation; experiment runner selection is separate.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # The full-history checkout no longer fits a hosted runner: from
      # 2026-10-23 04:20 UTC every run died with "No space left on device".
      # The gate reads the head's working tree and, through `git show`, two
      # files on the base tip, so it needs no history. Free the preinstalled
      # SDKs it does not use, check out only the head, and fetch only the
      # base tip; its blobs arrive on demand.
      - name: Free runner disk
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 research/blindspots_20261018/01-fp2-gaudry-k2/raw research/ecbench_generator_orbit_20261022/sessions research/ecbench_overhead_review_20261022/sessions research/five_leads_e2e_20261019/sessions_projective_chart_v2.tar.zst research/four_followups_20261021/results/matched research/four_followups_20261021/results/pencil-pilot research/ic_aimed_gather_20261023/aa2_20261029/runs research/kummer_coordinates_20261022/results research/kummer_differential_collector_20261022/results research/pencil_sparse_20261022/results research/pkm_tower_rootfind_20261018/sessions research/postgb_linear_stage_20261026 research/projective_law_followup_20261022/results
      - name: Fetch the base tip
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.local_runner)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags --depth=1 --filter=blob:none origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          # validation_gate.py treats an unreadable base file as absent, so
          # fail here rather than let the freeze comparison pass silently.
          git rev-parse --verify "origin/$BASE_REF^{commit}"
      - uses: actions/setup-python@v5
        # EKS runners may default to Python 3.12; the dedicated local runner
        # already includes 3.11 and keeps its isolated tool cache untouched.
        if: runner.environment == 'github-hosted' || !startsWith(runner.name, 'crypto-cli-gate-')
        with:
          python-version: '3.11'
      - name: Restore tracked benchmark inputs for committed-tree tests
        run: |
          git restore --source=HEAD --worktree -- \
            research/postgb_linear_stage_20261026 \
            research/ic_m2_linear_ladder_20261024 \
            research/s5_plain_c4_options_20261019 \
            benchmarks/20261029-ic-aimed-gather/registry-binding-20261030
      - name: The gate's own tests, with a positive and a negative fixture
        run: python3 scripts/test_validation_gate.py
      - name: Reject stale native curve catalog bindings
        run: |
          python3 scripts/test_curve_catalog_consistency.py
          python3 scripts/check_curve_catalog_consistency.py
      - name: Every leaderboard and benchmarks row is validated or frozen pre-gate
        env:
          BASE_REF: ${{ github.base_ref || (github.event_name == 'workflow_dispatch' && inputs.local_runner && 'main') || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 scripts/validation_gate.py check --base "origin/$BASE_REF"
          else
            python3 scripts/validation_gate.py check
          fi
