name: validation-gate

# AGENTS.md, "Validation gate" (owner rule, 2026-10-19): no row reaches the IC
# leaderboard or benchmarks/README.md without a replay certificate, a validator
# report and a matched rho reference, named by the VALIDATION.json of its
# evidence directory (docs/VALIDATION_GATE.md).  Rows that predate the gate are
# frozen in docs/ic/validation/PRE_GATE.json and benchmarks/PRE_GATE.json and
# render as "unvalidated (pre-gate)"; a row added or changed after the freeze
# must be validated, and the freeze files may only shrink.
#
# This runs on every pull request (no paths filter): the check is cheap, and a
# filter would let a row slip in through a file the filter forgot.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_runner:
        description: Use the dedicated local validation runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CRYPTO_VALIDATION_LOCAL_BRANCH != '' && vars.CRYPTO_VALIDATION_LOCAL_BRANCH == github.head_ref) || (github.event_name == 'workflow_dispatch' && inputs.local_runner)) && 'crypto-cli-gate-arm64') || ((github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|validation-gate.yml|') && 'crypto-eks-highmem') || ((github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|validation-gate.yml|') && 'crypto-eks-linux') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      # The full-history checkout no longer fits a hosted runner: from
      # 2026-10-23 04:20 UTC every run died with "No space left on device".
      # The gate reads the head's working tree and, through `git show`, two
      # files on the base tip, so it needs no history. Free the preinstalled
      # SDKs it does not use, check out only the head, and fetch only the
      # base tip; its blobs arrive on demand.
      - name: Free runner disk
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
      - name: Fetch the base tip
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.local_runner)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags --depth=1 --filter=blob:none origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          # validation_gate.py treats an unreadable base file as absent, so
          # fail here rather than let the freeze comparison pass silently.
          git rev-parse --verify "origin/$BASE_REF^{commit}"
      - uses: actions/setup-python@v5
        # EKS runners may default to Python 3.12; the dedicated local runner
        # already includes 3.11 and keeps its isolated tool cache untouched.
        if: runner.environment == 'github-hosted' || !startsWith(runner.name, 'crypto-cli-gate-')
        with:
          python-version: '3.11'
      - name: Confirm Python 3.11
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 11), sys.version'
      - name: The gate's own tests, with a positive and a negative fixture
        run: python3 scripts/test_validation_gate.py
      - name: Every leaderboard and benchmarks row is validated or frozen pre-gate
        env:
          BASE_REF: ${{ github.base_ref || (github.event_name == 'workflow_dispatch' && inputs.local_runner && 'main') || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 scripts/validation_gate.py check --base "origin/$BASE_REF"
          else
            python3 scripts/validation_gate.py check
          fi
