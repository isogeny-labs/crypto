name: IC generic backend qualification (archived)
on:
  # Not a pull-request check. The merge set is gate, size, and artifacts.
  # This runs when the matching change is on main, or on its schedule.
  push:
    branches: [main]
    paths:
      - '.github/workflows/ic-generic-backend-qualification.yml'
      - 'research/ic_candidate_tournament_20260915/tournament.py'
      - 'research/ic_candidate_tournament_20260915/driver_admission.py'
      - 'research/ic_candidate_tournament_20260915/generic_backend_yield.py'
      - 'research/ic_candidate_tournament_20260915/run_generic_backend_qualification.py'
      - 'research/ic_candidate_tournament_20260915/test_generic_backend_yield.py'
      - 'research/ic_candidate_tournament_20260915/goal_20260924/generic-backend-qualification/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ic-generic-backend-qualification-archived-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ic-generic-backend-qualification.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ic-generic-backend-qualification.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      # Reviewed PR #920 head: freeze worker, evaluator, panel and exclusions together.
      - uses: actions/checkout@v4
        with:
          ref: 765c3c5f19032bd852163805f257c56babef2040
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 research/ic_candidate_tournament_20260915
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check registration and Python scientific controls
        run: |
          test "$(git rev-parse HEAD)" = 765c3c5f19032bd852163805f257c56babef2040
          python -m unittest discover -s research/ic_candidate_tournament_20260915 -p 'test_*.py' -q
          python - <<'PY'
          import sys
          sys.path.insert(0, 'research/ic_candidate_tournament_20260915')
          from run_generic_backend_qualification import PANEL, check_generic_source, registration_check, registry
          from tournament import read
          panel = read(PANEL)
          registration_check(panel)
          check_generic_source()
          assert len(registry(panel, '/tmp/controlled-build')) == 9
          PY
