name: representation-join-native
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/representation_join_20261021/**'
      - '.github/workflows/representation-join-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|representation-join-native.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|representation-join-native.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/representation_join_20261021
      - name: Native exact-output correctness tests
        run: sh research/representation_join_20261021/check.sh
