name: Rootfind Round 135 guarded Atkin source-exact A/B
on:
  push:
    branches:
      - main
      - automation/rootfind-round135-atkin-p5mod8-20261123
    paths:
      - src/cryptanalysis/ecbench/isogeny.rs
      - research/rootfind_round135/**
      - .github/workflows/rootfind_round135.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src/cryptanalysis/ecbench/isogeny.rs
            research/rootfind_round134
            research/rootfind_round135
      - name: Build exact baseline and optimized production Rust modules
        shell: bash
        run: |
          set -euo pipefail
          # Historical round 134 baseline from merged PR #5003.
          git fetch --no-tags --depth=1 origin ba91444f6158aa0ce4230a3e28243c606871e1fc
          mkdir -p /tmp/rootfind_round135
          git show FETCH_HEAD:src/cryptanalysis/ecbench/isogeny.rs > /tmp/rootfind_round135/baseline.rs
          cp src/cryptanalysis/ecbench/isogeny.rs /tmp/rootfind_round135/optimized.rs
          for target in baseline optimized; do
            cat research/rootfind_round134/bench_helper.rs >> "/tmp/rootfind_round135/${target}.rs"
            cat research/rootfind_round135/bench_helper.rs >> "/tmp/rootfind_round135/${target}.rs"
          done
          cp research/rootfind_round135/source_exact_main.rs /tmp/rootfind_round135/main.rs
          rustc --version
          rustc --edition=2021 -C opt-level=3 -C target-cpu=native /tmp/rootfind_round135/main.rs -o /tmp/rootfind_round135/bench
      - name: Euler and polynomial oracles, alternating Rust A/B trials
        run: /tmp/rootfind_round135/bench
