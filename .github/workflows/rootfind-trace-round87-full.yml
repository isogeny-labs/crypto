name: Rootfind round87 remainder-only replay A/B
on:
  push:
    branches:
      - 'automation/rootfind-remainder-only-round87-20261121'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-exact-full-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round87_full_ab.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Round87 native Rust correctness and complete solve+verify A/B
        run: |
          set -euo pipefail
          rustc --version
          python3 research/amm_digit_perf_20261118/round87_full_ab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round87-source-exact-ab
          path: research/amm_digit_perf_20261118/round87_full_ab_results.csv
