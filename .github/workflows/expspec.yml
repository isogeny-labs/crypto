name: Experiment specs (expspec)
on:
  # Not a pull-request check. The merge set is gate, size, and artifacts.
  # This runs when the matching change is on main, or on its schedule.
  push:
    branches: [main]
    paths:
      - tools/expspec/**
      - tools/task_card.py
      - experiments/specs/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expspec:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|expspec.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|expspec.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/expspec/go.mod
          cache-dependency-path: tools/expspec/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PyYAML for tools/task_card.py (the card runner)
        run: python -m pip install pyyaml
      - name: Build
        run: go -C tools/expspec build -o "$PWD/target/expspec" .
      - name: Every spec validates
        run: target/expspec validate experiments/specs/EXP-*[0-9].yaml
      - name: Vet and end-to-end tests (local and batch hosts)
        run: |
          test -z "$(gofmt -l tools/expspec)"
          go -C tools/expspec vet ./...
          go -C tools/expspec test ./...
