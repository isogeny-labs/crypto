name: Experiment specs (expspec)
on:
  pull_request:
    paths:
      - tools/expspec/**
      - tools/task_card.py
      - experiments/specs/**
      - research/expspec_smoke_20261020/**
      - .github/workflows/expspec.yml
  push:
    branches: [main]
    paths:
      - tools/expspec/**
      - tools/task_card.py
      - experiments/specs/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expspec:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 experiments research tools
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/expspec/go.mod
          cache-dependency-path: tools/expspec/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PyYAML for tools/task_card.py (the card runner)
        run: python -m pip install pyyaml
      - name: Build
        run: go -C tools/expspec build -o "$PWD/target/expspec" .
      - name: Every spec validates
        run: target/expspec validate experiments/specs/EXP-*[0-9].yaml
      - name: Vet and end-to-end tests (local and batch hosts)
        run: |
          test -z "$(gofmt -l tools/expspec)"
          go -C tools/expspec vet ./...
          go -C tools/expspec test ./...
