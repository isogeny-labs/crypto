name: Quadratic twist phase demand native replay

on:
  pull_request:
    paths:
      - 'research/quadratic_twist_evidence_20261021/**'
      - '.github/workflows/quadratic-twist-phase-demand.yml'
      - 'src/cryptanalysis/identity_certificate.rs'
      - 'src/hash/sha256.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-phase-demand:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/quadratic_twist_evidence_20261021/
            /src/hash/sha256.rs
            /src/cryptanalysis/identity_certificate.rs
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ libssl-dev jq ripgrep
      - name: Replay setup, online and source-verification requests with independent arithmetic
        run: bash research/quadratic_twist_evidence_20261021/run-phase-demand.sh "$RUNNER_TEMP/twist-phase-demand"
      - name: Upload complete native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadratic-twist-phase-demand
          path: ${{ runner.temp }}/twist-phase-demand/
          if-no-files-found: error
