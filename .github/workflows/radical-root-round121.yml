name: Rootfinding Round121 sparse Fp2 and Jacobi Rust A/B
on:
  push:
    branches:
      - 'automation/radical-root-mersenne-sqrt-round114-20261122'
  pull_request:
    paths:
      - 'src/cryptanalysis/prime_radical_root.rs'
      - 'research/amm_digit_perf_20261118/round121_sparse_fq2_ab.py'
      - 'research/amm_digit_perf_20261118/round121_cubic_ab.py'
      - 'research/amm_digit_perf_20261118/round121_jacobi_ab.py'
      - '.github/workflows/radical-root-round121.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-rust-fp2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/cryptanalysis/prime_radical_root.rs
            research/amm_digit_perf_20261118/round121_sparse_fq2_ab.py
            research/amm_digit_perf_20261118/round121_cubic_ab.py
            research/amm_digit_perf_20261118/round121_jacobi_ab.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Source-exact Rust correctness and alternating Fp2 A/B
        run: |
          set -euo pipefail
          rustc --version
          python3 research/amm_digit_perf_20261118/round121_sparse_fq2_ab.py | tee round121_native_rust.txt
          python3 research/amm_digit_perf_20261118/round121_cubic_ab.py | tee round121_native_cubic.txt
          python3 research/amm_digit_perf_20261118/round121_jacobi_ab.py | tee round121_native_jacobi.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfind-round121-native-rust
          path: |
            round121_native_rust.txt
            round121_native_cubic.txt
            round121_native_jacobi.txt
          if-no-files-found: warn
