name: Koblitz Stage 156 current gate audit
on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-current-audit:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|koblitz-stage156-current-gate-audit.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|koblitz-stage156-current-gate-audit.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 docs/ic/runs research/sat_factor_base_review_20260908/continuation-05-sota-gates
      - name: Replay Stage 155 historical audit and Stage 156 current audit
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage155_gate_audit.py scripts/compose_koblitz_stage156_gate_audit.py
          python3 -m json.tool docs/ic/runs/koblitz-n59-fifo-lookahead64-rejection-20260922.json >/dev/null
          python3 scripts/compose_koblitz_stage155_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-155-current-gate-audit-20260922 > "$RUNNER_TEMP/stage155-historical.json"
          python3 scripts/compose_koblitz_stage156_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-156-current-gate-audit-20260922 > "$RUNNER_TEMP/stage156-current.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
