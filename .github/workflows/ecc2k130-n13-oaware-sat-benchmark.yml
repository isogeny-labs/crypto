name: ECC2K-130 n13 O-aware SAT stage archive
on:
  pull_request:
    paths:
      - 'research/notes/ecc2k130/n13_oaware_sat_benchmark_20260925/**'
      - '.github/workflows/ecc2k130-n13-oaware-sat-benchmark.yml'
      - 'docs/index-calculus-scoreboard.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-and-archive:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-n13-oaware-sat-benchmark.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-n13-oaware-sat-benchmark.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 docs research/notes/ecc2k130
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and verify frozen source/input hashes
        run: |
          python3 -m py_compile research/notes/ecc2k130/n13_oaware_sat_benchmark_20260925/{run,verify,ci_replay,analyze}.py
          python3 research/notes/ecc2k130/n13_oaware_sat_benchmark_20260925/ci_replay.py
      - name: Replay raw solver evidence without rerunning timed children
        run: |
          d=research/notes/ecc2k130/n13_oaware_sat_benchmark_20260925/evidence
          if test -f "$d/smoke/result.json" && test -f "$d/panel/result.json"; then
            python3 research/notes/ecc2k130/n13_oaware_sat_benchmark_20260925/ci_replay.py --smoke "$d/smoke" --panel "$d/panel"
          elif test -f "$d/smoke/result.json" || test -f "$d/panel/result.json"; then
            echo 'Incomplete evidence pair' >&2
            exit 1
          fi
