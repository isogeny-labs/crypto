name: ECC2K-130 sparse O-aware S3 CNF gate
on:
  # Not a pull-request check. The merge set is gate, size, and artifacts.
  # This runs when the matching change is on main, or on its schedule.
  push:
    branches: [main]
    paths:
      - 'research/notes/ecc2k130/rotated_s3_sparse_cnf_20260925/**'
      - '.github/workflows/ecc2k130-s3-sparse-cnf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-preflight:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-s3-sparse-cnf.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-s3-sparse-cnf.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 research/notes/ecc2k130/rotated_s3_sparse_cnf_20260925
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check frozen source and input bytes
        run: |
          python3 -m py_compile research/notes/ecc2k130/rotated_s3_sparse_cnf_20260925/{export,verify,run,ci_replay}.py
          python3 research/notes/ecc2k130/rotated_s3_sparse_cnf_20260925/ci_replay.py
      - name: Audit committed evidence when present
        run: |
          receipt=research/notes/ecc2k130/rotated_s3_sparse_cnf_20260925/evidence/final/receipt.json
          if test -f "$receipt"; then
            python3 research/notes/ecc2k130/rotated_s3_sparse_cnf_20260925/ci_replay.py --evidence "$receipt"
          fi
