name: ECC2K-130 sparse O-aware S3 CNF gate
on:
  pull_request:
    paths:
      - 'research/notes/ecc2k130/rotated_s3_sparse_cnf_20260925/**'
      - '.github/workflows/ecc2k130-s3-sparse-cnf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-preflight:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-s3-sparse-cnf.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-s3-sparse-cnf.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check frozen source and input bytes
        run: |
          python3 -m py_compile research/notes/ecc2k130/rotated_s3_sparse_cnf_20260925/{export,verify,run,ci_replay}.py
          python3 research/notes/ecc2k130/rotated_s3_sparse_cnf_20260925/ci_replay.py
      - name: Audit committed evidence when present
        run: |
          receipt=research/notes/ecc2k130/rotated_s3_sparse_cnf_20260925/evidence/final/receipt.json
          if test -f "$receipt"; then
            python3 research/notes/ecc2k130/rotated_s3_sparse_cnf_20260925/ci_replay.py --evidence "$receipt"
          fi
