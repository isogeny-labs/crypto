name: Free LLM pull-request review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to review
        required: true
        type: number

concurrency:
  group: llm-review-${{ github.event.pull_request.number || inputs.pull_request || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|llm-review.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|llm-review.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      # pull_request_target has access to secrets. Deliberately check out only
      # the trusted default branch and retrieve the PR patch as inert API data.
      # The reviewer script uses only Node built-ins, so a sparse checkout of
      # .github/scripts avoids cloning the multi-gigabyte repository; full
      # checkouts stalled past the job limit in October 2026.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Validate reviewer
        run: |
          node --check .github/scripts/llm-review.mjs
          node .github/scripts/llm-review.mjs --self-test

      - name: Review pull request
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          FIREWORKS_MODEL: ${{ vars.FIREWORKS_MODEL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
        run: node .github/scripts/llm-review.mjs
