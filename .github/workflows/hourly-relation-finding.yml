name: Hourly Koblitz relation-finding monitor

on:
  push:
    branches: [hourly-runs]
    paths:
      - ".github/workflows/hourly-relation-finding.yml"
      - "results/hourly_triggers/**"
  workflow_dispatch:
  pull_request:
    branches: [hourly-runs]
    paths:
      - '.github/workflows/hourly-relation-finding.yml'
      - 'scripts/hourly_cpu_telemetry.py'
      - 'scripts/hourly_relation_finding.py'
      - 'scripts/test_hourly_relation_finding.py'

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('hourly-koblitz-telemetry-pr-{0}', github.event.pull_request.number) || 'hourly-koblitz-relation-finding' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  telemetry-tests:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - run: python3 scripts/test_hourly_relation_finding.py
  record:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Free space for the Rust build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell || true
          df -h /
      - uses: actions/checkout@v4
        with:
          ref: hourly-runs
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /Cargo.toml
            /Cargo.lock
            /src/
            /examples/
            /scripts/
            /crates/
            /tools/
            /isogeny_algos/
            /research/pencil_large_prime_20261029/Cargo.toml
            /research/pencil_large_prime_20261029/src/
            /results/
      - name: Expand Rust source and path dependencies only
        run: |
          bash scripts/sparse-checkout.sh apply --profile minimal --path results/
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.1"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Test telemetry contract
        run: python3 scripts/test_hourly_relation_finding.py
      - name: Identify frozen control build inputs
        id: control-build
        shell: bash
        run: |
          set -euo pipefail
          # Exclude only hourly telemetry output, not build inputs.
          source_tree=$(git ls-tree -r --full-tree HEAD | awk -F '\t' '$2 !~ /^results\/hourly_triggers\// && $2 !~ /^results\/(hourly_log\.csv|relation_baseline\.json|relation_cpu_baselines\.json|hourly_alert\.md)$/' | sha256sum | cut -d' ' -f1)
          environment=$( { rustc -Vv; cargo -V; printf '%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-}" "${ImageVersion:-}" "$RUSTFLAGS" "$CARGO_INCREMENTAL" "$CARGO_PROFILE_RELEASE_DEBUG" "${CARGO_BUILD_TARGET:-}"; } | sha256sum | cut -d' ' -f1)
          echo "key=hourly-synthetic-control-v1-${source_tree}-${environment}" >> "$GITHUB_OUTPUT"
      - name: Restore immutable synthetic control executable
        id: control-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/hourly-control-build
          key: ${{ steps.control-build.outputs.key }}
      - name: Run frozen n=23 relation-yield benchmark and record CSV
        id: benchmark
        continue-on-error: true
        shell: bash
        env:
          CONTROL_CACHE_HIT: ${{ steps.control-cache.outputs.cache-hit }}
          CONTROL_CACHE_KEY: ${{ steps.control-build.outputs.key }}
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/hourly-control-build"
          binary=target/release/examples/koblitz_relation_yield_bridge
          args=(--build-timeout 1200 --run-timeout 900)
          if [[ "$CONTROL_CACHE_HIT" == true ]] && [[ -f "$cache/control" && -f "$cache/control.sha256" && -f "$cache/source_sha" && -f "$cache/cache_key" ]] && [[ "$(cat "$cache/cache_key")" == "$CONTROL_CACHE_KEY" ]] && (cd "$cache" && sha256sum --check --strict control.sha256); then
            install -D -m 0755 "$cache/control" "$binary"
            echo "Verified cached synthetic control; original build source: $(cat "$cache/source_sha")"
            args+=(--skip-build)
          else
            if [[ "$CONTROL_CACHE_HIT" == true ]]; then
              echo "::warning::Synthetic control cache verification failed; rebuilding and retaining strict build fingerprint."
            fi
            rm -rf "$cache"
          fi
          python3 scripts/hourly_relation_finding.py "${args[@]}"
      - name: Package verified synthetic control executable
        if: steps.benchmark.outcome == 'success' && steps.control-cache.outputs.cache-hit != 'true'
        id: control-package
        continue-on-error: true
        shell: bash
        env:
          CONTROL_CACHE_KEY: ${{ steps.control-build.outputs.key }}
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/hourly-control-build"
          mkdir -p "$cache"
          install -m 0755 target/release/examples/koblitz_relation_yield_bridge "$cache/control"
          (cd "$cache" && sha256sum control > control.sha256)
          git rev-parse HEAD > "$cache/source_sha"
          printf '%s\n' "$CONTROL_CACHE_KEY" > "$cache/cache_key"
      - name: Save verified synthetic control executable
        if: steps.control-package.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hourly-control-build
          key: ${{ steps.control-build.outputs.key }}
      - name: Preserve raw producer output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-relation-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/hourly_relation_result.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit and push new CSV and baseline on hourly-runs
        if: ${{ !cancelled() && (steps.benchmark.outcome == 'success' || steps.benchmark.outcome == 'failure') }}
        shell: bash
        run: |
          if [ -f results/hourly_log.csv ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Other research sessions may push while this benchmark runs.
            # Fast-forward before staging the new CSV row, so the log push
            # does not discard their branch changes.
            git fetch origin hourly-runs
            git merge --ff-only origin/hourly-runs
            git add -f results/hourly_log.csv
            if [ -f results/relation_baseline.json ]; then
              git add -f results/relation_baseline.json
            fi
            if [ -f results/relation_cpu_baselines.json ]; then
              git add -f results/relation_cpu_baselines.json
            fi
            if ! git diff --cached --quiet; then
              git commit -m "data: append hourly n23 relation yield measurement"
              git push origin HEAD:hourly-runs
            fi
          fi
      - name: Open a GitHub issue on run failure or >20% change
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -s results/hourly_alert.md ]; then
            title="[relation-monitor] n23 relation-yield failed or changed >20% (run $GITHUB_RUN_ID)"
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "$GITHUB_RUN_ID in:title" --json title --jq '.[].title')
            if ! grep -Fxq "$title" <<< "$existing"; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file results/hourly_alert.md
            fi
          fi
      - name: Surface a benchmark failure to CI
        if: steps.benchmark.outcome == 'failure'
        run: exit 1
