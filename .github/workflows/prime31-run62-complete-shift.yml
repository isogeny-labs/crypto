name: Prime31 run62 complete mixed-Jacobian shift
on:
  push:
    branches:
      - research/prime31-f4-admission-run51-20261121
    paths:
      - "research/prime31_ic_20261115/native/examples/prime31_run62_complete_shift.rs"
      - ".github/workflows/prime31-run62-complete-shift.yml"
  pull_request:
    paths:
      - "research/prime31_ic_20261115/native/examples/prime31_run62_complete_shift.rs"
      - ".github/workflows/prime31-run62-complete-shift.yml"
  workflow_dispatch:

jobs:
  complete-shift:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: research/prime31_ic_20261115/native
      - name: Independent Python big-int field and exceptional group-law replay
        run: python3 research/prime31_f4_admission_20261121/run62_independent.py
      - name: Run independently checked full-domain group and field gate
        working-directory: research/prime31_ic_20261115/native
        run: cargo run --release --example prime31_run62_complete_shift
