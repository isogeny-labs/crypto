name: N83 full-D18 Linux phase-first access gate

on:
  push:
    branches:
      - codex/n83-aws-handoff-20261025
    paths:
      - .github/workflows/n83-d18-phase-first-linux.yml
      - examples/koblitz_n83_factor_base_export.rs
      - research/koblitz_n83_factor_base_sweep_20261008/primary_adapter.rs
      - research/koblitz_n83_factor_base_sweep_20261008/verification/d18-full-orbit-20261025/linux-phase-first-20261025/**

permissions:
  contents: read

concurrency:
  group: n83-d18-phase-first-linux
  cancel-in-progress: false

jobs:
  full-d18-linux-pair:
    if: github.repository == 'aburan28/crypto' && github.ref == 'refs/heads/codex/n83-aws-handoff-20261025'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 110
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RAYON_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      IMAGE_REF: rust:1.98.1-bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
      STUDY: research/koblitz_n83_factor_base_sweep_20261008
      D18: research/koblitz_n83_factor_base_sweep_20261008/verification/d18-full-orbit-20261025
      PREFIX: factor-bases/icv1/etc/koblitz_n83_factor_base_sweep_20261008/d18-full-direct-subgroup-v1/a0
      OBJECT: c295da8898cfad29a053621c768ca059eea4263f89f5ca78b4f98af43c383f3f.jsonl.gz
    steps:
      - name: Check out the exact experiment source and protocol
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Freeze source, host and image identity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-d18-setup" "$RUNNER_TEMP/n83-d18-base/objects"
          git rev-parse HEAD > "$RUNNER_TEMP/n83-d18-setup/source-commit.txt"
          test -z "$(git status --porcelain)"
          uname -a > "$RUNNER_TEMP/n83-d18-setup/uname.txt"
          docker version > "$RUNNER_TEMP/n83-d18-setup/docker-version.txt"
          docker info > "$RUNNER_TEMP/n83-d18-setup/docker-info.txt"
          docker pull --platform linux/arm64 "$IMAGE_REF" \
            > "$RUNNER_TEMP/n83-d18-setup/docker-pull.stdout" \
            2> "$RUNNER_TEMP/n83-d18-setup/docker-pull.stderr"
          docker image inspect "$IMAGE_REF" --format '{{.Id}} {{.Architecture}} {{.Os}} {{json .RepoDigests}}' \
            > "$RUNNER_TEMP/n83-d18-setup/image.txt"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      - name: Fresh-fetch and hash the complete S3 base
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/n83-d18-base"
          cp "$D18/manifest.json" "$base/manifest.json"
          aws s3api get-object --bucket crypto-autoresearcher \
            --key "$PREFIX/manifest.json" --checksum-mode ENABLED \
            "$base/s3-manifest.json" > "$base/manifest-get-metadata.json"
          aws s3api get-object --bucket crypto-autoresearcher \
            --key "$PREFIX/objects/$OBJECT" --checksum-mode ENABLED \
            "$base/objects/$OBJECT" > "$base/object-get-metadata.json"
          printf '%s  %s\n' \
            1b93351febd47dac4de8c5dd39dbf58564d0057a044054baf448d978f6c0d616 \
            "$base/s3-manifest.json" | sha256sum -c \
            > "$RUNNER_TEMP/n83-d18-setup/manifest-sha256-check.txt"
          printf '%s  %s\n' \
            eaef94ef45b3d2d4cd2ec2f40c1173b4cdb2a437b7e618a858c73fb1caf3902b \
            "$base/objects/$OBJECT" | sha256sum -c \
            > "$RUNNER_TEMP/n83-d18-setup/object-sha256-check.txt"
      - name: Install pinned audit dependency and fetch Rust crates
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --only-binary=:all: \
            --target "$RUNNER_TEMP/n83-d18-pydeps" 'blake3==1.0.8' \
            > "$RUNNER_TEMP/n83-d18-setup/pip.stdout" \
            2> "$RUNNER_TEMP/n83-d18-setup/pip.stderr"
          mkdir -p "$RUNNER_TEMP/n83-d18-cargo" "$RUNNER_TEMP/n83-d18-target"
          docker run --rm --pull never --platform linux/arm64 \
            --cpus 2 --memory 8192m --memory-swap 8192m \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/n83-d18-cargo,dst=/cargo" \
            --env CARGO_HOME=/cargo --workdir /src "$IMAGE_REF" \
            cargo fetch --locked --target aarch64-unknown-linux-gnu \
            > "$RUNNER_TEMP/n83-d18-setup/cargo-fetch.stdout" \
            2> "$RUNNER_TEMP/n83-d18-setup/cargo-fetch.stderr"
      - name: Build one source-bound Linux release binary
        run: |
          set -euo pipefail
          docker run --rm --pull never --platform linux/arm64 \
            --network none --cpus 2 --memory 8192m --memory-swap 8192m \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/n83-d18-cargo,dst=/cargo" \
            --mount "type=bind,src=$RUNNER_TEMP/n83-d18-target,dst=/target" \
            --env CARGO_HOME=/cargo --env CARGO_TARGET_DIR=/target \
            --env CARGO_BUILD_JOBS=2 --workdir /src "$IMAGE_REF" \
            cargo build --release --locked --offline --example koblitz_n83_factor_base_export \
            > "$RUNNER_TEMP/n83-d18-setup/build.stdout" \
            2> "$RUNNER_TEMP/n83-d18-setup/build.stderr"
          sha256sum "$RUNNER_TEMP/n83-d18-target/release/examples/koblitz_n83_factor_base_export" \
            > "$RUNNER_TEMP/n83-d18-setup/binary.sha256"
      - name: Verify the exact worker cgroup before either arm
        run: |
          set -euo pipefail
          docker run --rm --pull never --platform linux/arm64 \
            --network none --cpus 1 --memory 8192m --memory-swap 8192m \
            "$IMAGE_REF" sh -c \
            'cat /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.swap.max /sys/fs/cgroup/cpu.max' \
            > "$RUNNER_TEMP/n83-d18-setup/cgroup-preflight.txt"
          python3 - "$RUNNER_TEMP/n83-d18-setup/cgroup-preflight.txt" <<'PY'
          import pathlib, sys
          memory, swap, cpu = pathlib.Path(sys.argv[1]).read_text().splitlines()
          quota, period = map(int, cpu.split())
          assert int(memory) == 8 * 1024 ** 3 and int(swap) == 0
          assert quota == period and quota > 0
          PY
      - name: Run checked positive gate then one public natural query
        env:
          PYTHONPATH: ${{ runner.temp }}/n83-d18-pydeps
        run: |
          set -euo pipefail
          python3 "$D18/linux-phase-first-20261025/run.py" \
            --source "$GITHUB_WORKSPACE" \
            --base "$RUNNER_TEMP/n83-d18-base" \
            --binary "$RUNNER_TEMP/n83-d18-target/release/examples/koblitz_n83_factor_base_export" \
            --image "$IMAGE_REF" \
            --output "$RUNNER_TEMP/n83-d18-linux-run" \
            > "$RUNNER_TEMP/n83-d18-setup/run.stdout" \
            2> "$RUNNER_TEMP/n83-d18-setup/run.stderr"
      - name: Preserve setup, custody, raw stages and audited outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-d18-phase-first-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/n83-d18-setup/
            ${{ runner.temp }}/n83-d18-base/s3-manifest.json
            ${{ runner.temp }}/n83-d18-base/manifest-get-metadata.json
            ${{ runner.temp }}/n83-d18-base/object-get-metadata.json
            ${{ runner.temp }}/n83-d18-linux-run/
          if-no-files-found: warn
          retention-days: 90
