name: Rootfind round98 quadratic verifier modular power A/B
on:
  push:
    branches:
      - 'automation/rootfind-column-accumulator-round89-20261121'
    paths:
      - 'src/cryptanalysis/prime_root_trace.rs'
      - 'research/amm_digit_perf_20261118/round98_quadratic_ab.py'
      - 'research/amm_digit_perf_20261118/round98_full_ab.py'
      - '.github/workflows/rootfind-round98-quadratic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  power-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round98_quadratic_ab.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Source-exact native Rust modular-power A/B
        env:
          ROOTFIND_BASELINE_REF: d6776c5c31f8f9d294a6a62abf177d818bff2404
          ROOTFIND_AB_OUTPUT: research/amm_digit_perf_20261118/round98_power_results.csv
        run: python3 research/amm_digit_perf_20261118/round98_quadratic_ab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfind-round98-power-ab
          path: research/amm_digit_perf_20261118/round98_power_results.csv
  full-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round98_full_ab.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Source-exact native Rust complete root solve and verification A/B
        env:
          ROOTFIND_BASELINE_REF: d6776c5c31f8f9d294a6a62abf177d818bff2404
          ROOTFIND_AB_OUTPUT: research/amm_digit_perf_20261118/round98_full_results.csv
        run: python3 research/amm_digit_perf_20261118/round98_full_ab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfind-round98-complete-ab
          path: research/amm_digit_perf_20261118/round98_full_results.csv
