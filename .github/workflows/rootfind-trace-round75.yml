name: Rootfind trace sparse and cached Barrett validation

on:
  pull_request:
    paths:
      - 'src/cryptanalysis/prime_root_trace.rs'
      - 'research/amm_digit_perf_20261118/round75_trace_isolated.py'
      - '.github/workflows/rootfind-trace-round75.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-exact-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round75_trace_isolated.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Check source-exact Rust and measure paired A/B
        run: |
          set -euo pipefail
          rustc --version
          python3 research/amm_digit_perf_20261118/round75_trace_isolated.py
