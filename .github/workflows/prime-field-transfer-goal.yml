name: Prime-field transfer goal correctness
on:
  push:
    branches: [main]
    paths:
      - 'research/prime_field_transfer_goal_20261116/**'
      - '.github/workflows/prime-field-transfer-goal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 research/prime_field_transfer_goal_20261116
      - name: Install native development dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libssl-dev
      - name: Reproduce fixed native controls
        shell: bash
        run: |
          set -euo pipefail
          study=research/prime_field_transfer_goal_20261116
          g++ -std=c++17 -O2 -Wall -Wextra -Werror "$study/component_candidate.cpp" -lcrypto -lgmpxx -lgmp -o /tmp/component-candidate
          /tmp/component-candidate > /tmp/component-native.jsonl
          cmp /tmp/component-native.jsonl "$study/receipts/round-01/native-01.jsonl"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror "$study/target_precision.cpp" -o /tmp/target-precision
          /tmp/target-precision > /tmp/component-precision.jsonl
          cmp /tmp/component-precision.jsonl "$study/receipts/round-01/target-precision-01.jsonl"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror "$study/round-02/fixture_driver.cpp" -lcrypto -lgmpxx -lgmp -o /tmp/local-fixture
          for fixture in p17 p257; do
            timeout 60s /tmp/local-fixture "$fixture" > "/tmp/local-$fixture.jsonl"
            cmp "/tmp/local-$fixture.jsonl" "$study/receipts/round-02/native-03-$fixture.jsonl"
          done
          g++ -std=c++17 -O2 -Wall -Wextra -Werror "$study/round-02/public_fixture.cpp" -lcrypto -lgmpxx -lgmp -o /tmp/local-public
          for point in 0 1 2 3; do
            timeout 60s /tmp/local-public "$point" > "/tmp/local-public-$point.jsonl"
            cmp "/tmp/local-public-$point.jsonl" "$study/receipts/round-02/native-04-public-$point.jsonl"
          done
