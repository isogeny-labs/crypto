name: Rootfind Round 137 source-exact Rust A/B
on:
  push:
    branches:
      - main
      - automation/rootfind-round137-pseudo-euclidean-gcd-20261123
    paths:
      - src/cryptanalysis/ecbench/isogeny.rs
      - research/rootfind_round137/**
      - .github/workflows/rootfind_round137.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src/cryptanalysis/ecbench/isogeny.rs
            research/rootfind_round134
            research/rootfind_round135
            research/rootfind_round136
            research/rootfind_round137
      - name: Compile source-exact production baseline and optimized modules
        shell: bash
        run: |
          set -euo pipefail
          # Historical round 136 baseline from merged PR #5010.
          git fetch --no-tags --depth=1 origin 017b09771ae9227a5a26c2b80c1e3356746cc8e8
          mkdir -p /tmp/rootfind_round137
          git show FETCH_HEAD:src/cryptanalysis/ecbench/isogeny.rs > /tmp/rootfind_round137/baseline.rs
          cp src/cryptanalysis/ecbench/isogeny.rs /tmp/rootfind_round137/optimized.rs
          for target in baseline optimized; do
            cat research/rootfind_round134/bench_helper.rs >> "/tmp/rootfind_round137/${target}.rs"
            cat research/rootfind_round135/bench_helper.rs >> "/tmp/rootfind_round137/${target}.rs"
            cat research/rootfind_round136/bench_helper.rs >> "/tmp/rootfind_round137/${target}.rs"
            cat research/rootfind_round137/bench_helper.rs >> "/tmp/rootfind_round137/${target}.rs"
          done
          cp research/rootfind_round137/source_exact_main.rs /tmp/rootfind_round137/main.rs
          rustc --version
          rustc --edition=2021 -C opt-level=3 -C target-cpu=native /tmp/rootfind_round137/main.rs -o /tmp/rootfind_round137/bench
      - name: Independent Euclid/root oracles and paired native A/B
        run: /tmp/rootfind_round137/bench
