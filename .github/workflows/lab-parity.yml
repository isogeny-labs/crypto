name: lab-parity

# The cross-repository contract (crypto-autoresearcher:docs/lab-contract.md):
# every skill resolves on both agent surfaces, every shared file matches
# docs/shared-code.lock.json, and every validation/v1 record is well formed.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Skills surfaces
        run: python3 tools/check_skills_parity.py
      - name: Shared-code lock
        run: python3 tools/check_lab_parity.py --repo crypto
      - name: Validation record validator
        run: python3 tools/test_validate_validation_json.py
      # Tool tests that no pull-request workflow ran
      # (docs/audits/2026-11-15-correctness-validation-assessment.md, C-2, V-19).
      - name: Result-switch registry covers every environment variable the producers read
        run: python3 tools/test_result_switches.py
      - name: Task-card tool tests
        run: python3 tools/test_task_card.py
      - name: Loss-ledger tool tests
        run: python3 tools/test_loss_ledger.py
