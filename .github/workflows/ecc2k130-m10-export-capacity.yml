name: ECC2K-130 m10 export capacity preflight

on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-preflight:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-m10-export-capacity.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-m10-export-capacity.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/notes/ecc2k130
      - name: Check exact frozen protocol hash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('research/notes/ecc2k130/m10_export_capacity_20260925/FROZEN.json')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '06b18465d807693550a66be04a1634812e5089c3dee06b7bb94b89fc034271d3'
          PY
      - name: Replay hashes, normal-basis maps, and n3 full-point toy
        run: python3 research/notes/ecc2k130/m10_export_capacity_20260925/ci_replay.py
      - name: Parse release gate and independent verifier without running n131
        run: |
          python3 -m py_compile \
            research/notes/ecc2k130/m10_export_capacity_20260925/ci_replay.py \
            research/notes/ecc2k130/m10_export_capacity_20260925/run.py \
            research/notes/ecc2k130/m10_export_capacity_20260925/dispatch_gate.py \
            research/notes/ecc2k130/m10_export_capacity_20260925/verify.py
          python3 -m unittest discover -s research/notes/ecc2k130/m10_export_capacity_20260925 -p 'test_dispatch_gate.py' -v
