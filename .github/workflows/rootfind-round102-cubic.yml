name: Rootfind round102 cubic verifier A/B
on:
  push:
    branches: ['automation/rootfind-column-accumulator-round89-20261121']
    paths:
      - 'src/cryptanalysis/prime_root_trace.rs'
      - 'research/amm_digit_perf_20261118/round102_full_ab.py'
      - '.github/workflows/rootfind-round102-cubic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  round102-source-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round102_full_ab.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Frozen Round101 versus Round102, full solve and cubic verifier
        env:
          ROOTFIND_BASELINE_REF: 563f39939b5f5568f9c322c02ba5cf59b7caa777
          ROOTFIND_AB_OUTPUT: research/amm_digit_perf_20261118/round102_full_results.csv
        run: python3 research/amm_digit_perf_20261118/round102_full_ab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfind-round102-full-cubic-ab
          path: research/amm_digit_perf_20261118/round102_full_results.csv
