name: Prime31 S4 versus S3-chain Rust development gate

on:
  push:
    branches: [research/prime31-s4-split-20261116]
    paths:
      - research/prime31_ic_20261115/native/**
      - .github/workflows/prime31-s4-split-20261116.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  split-s4:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            research/prime31_ic_20261115/native
            src/cryptanalysis
      - name: Install recorded Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Focused reused F4 library tests
        run: cargo +1.100.0 test --locked --release --lib --manifest-path research/prime31_ic_20261115/native/Cargo.toml
      - name: Compare exact S4 with three S3-chain projected ideals on prime31
        timeout-minutes: 4
        run: cargo +1.100.0 run --locked --release --manifest-path research/prime31_ic_20261115/native/Cargo.toml --example prime31_m8_balanced_f4_input -- --split-s4-f4
