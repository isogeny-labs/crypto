name: Prime31 run68 genuine-RHS generic calibration
on:
  push:
    branches:
      - research/prime31-f4-admission-run51-20261121
    paths:
      - "research/prime31_ic_20261115/native/examples/prime31_run68_rhs_control.rs"
      - "research/prime31_f4_admission_20261121/run57_basis.json"
      - "research/prime31_f4_admission_20261121/RUN66_Y7_EXTRA168.csv"
      - ".github/workflows/prime31-run68-rhs-control.yml"
  pull_request:
    paths:
      - "research/prime31_ic_20261115/native/examples/prime31_run68_rhs_control.rs"
      - ".github/workflows/prime31-run68-rhs-control.yml"
  workflow_dispatch:
jobs:
  real-rhs-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: research/prime31_ic_20261115/native
      - name: Original Rust full Prime31 genuine-RHS calibration (generic only)
        working-directory: research/prime31_ic_20261115/native
        run: cargo run --locked --release --example prime31_run68_rhs_control
