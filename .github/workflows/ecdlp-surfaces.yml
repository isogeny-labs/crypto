name: Elliptic-curve surface tools

on:
  pull_request:
    paths:
      - 'tools/ecdlp-surfaces/**'
      - 'docs/ecdlp-surfaces/**'
      - '.github/workflows/ecdlp-surfaces.yml'
  push:
    paths:
      - 'tools/ecdlp-surfaces/**'
      - 'docs/ecdlp-surfaces/**'
      - '.github/workflows/ecdlp-surfaces.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch, merge queue) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/ecdlp-surfaces
            docs/ecdlp-surfaces
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: tools/ecdlp-surfaces/check.sh
      - name: Native identity certificates
        working-directory: docs/ecdlp-surfaces/certificates
        run: |
          cargo fmt --all -- --check
          cargo test --release --locked
          cargo clippy --locked --all-targets -- -D warnings
          surface_certificate_dir=$(mktemp -d)
          trap 'rm -rf -- "$surface_certificate_dir"' EXIT
          cargo run --release --locked -- "$surface_certificate_dir"
          for surface_certificate in embedding_identity quadric_determinant identity_replay curve_record; do
            cmp "../evidence/$surface_certificate.json" "$surface_certificate_dir/$surface_certificate.json"
          done
