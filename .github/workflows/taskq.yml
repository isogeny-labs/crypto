name: taskq
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'taskq/**'
      - '.github/workflows/taskq.yml'
  push:
    branches: [main]
    paths:
      - 'taskq/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|taskq.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|taskq.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e './taskq[mcp,test]'
      - name: Test
        env:
          TASKQ_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: python -m pytest -q taskq/tests
      - name: Checkpoint supervisor regression checks
        run: |
          bash -n taskq/deploy/spot-checkpoint/checkpoint-hook.sh
          bash taskq/deploy/spot-checkpoint/test-checkpoint-hook.sh
      - uses: azure/setup-helm@v4
      - name: Helm chart renders and lints
        run: |
          helm lint taskq/deploy/helm/taskq
          helm template t taskq/deploy/helm/taskq > /dev/null
          helm template t taskq/deploy/helm/taskq --set keda.enabled=true --set mcp.enabled=true > /dev/null
          helm template t taskq/deploy/helm/taskq --set redis.enabled=false --set redis.externalUrlSecret.name=ext > /dev/null
      - name: Worker image builds
        run: docker build -f taskq/deploy/Dockerfile taskq
  terraform:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|taskq.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|taskq.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: taskq/deploy/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Plan against mocked providers
        # No AWS account: the providers are mocked, but the provider still
        # reads credentials at configure time.
        env:
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
        run: terraform test
      - name: State bootstrap validates and plans
        env:
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
        working-directory: taskq/deploy/aws/bootstrap
        run: |
          terraform init -input=false
          terraform validate
          terraform test
  ephemeral-cli:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|taskq.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|taskq.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: taskq/deploy/ephemeral/cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: taskq/deploy/ephemeral/cli
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
