name: Prime31 exact Frobenius inverse cubic Rust audit
on:
  push:
    branches: [automation/prime31-frobenius-cubic-inverse-20261118]
    paths:
      - 'research/prime31_ic_20261115/native/examples/prime31_frobenius_inverse.rs'
      - 'research/prime31_ic_20261115/native/verify_prime31_frobenius_inverse.py'
      - '.github/workflows/prime31-frobenius-inverse.yml'
  pull_request:
    paths:
      - 'research/prime31_ic_20261115/native/examples/prime31_frobenius_inverse.rs'
      - 'research/prime31_ic_20261115/native/verify_prime31_frobenius_inverse.py'
      - '.github/workflows/prime31-frobenius-inverse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prime31-inverse:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout candidate and independent Python verifier
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            research/prime31_ic_20261115/native/examples/prime31_frobenius_inverse.rs
            research/prime31_ic_20261115/native/verify_prime31_frobenius_inverse.py
          sparse-checkout-cone-mode: false
      - name: Checkout pinned original Rust arithmetic and F4 engine
        uses: actions/checkout@v4
        with:
          ref: 1df714645aa683cf975bc76fcacb9842cb4780fd
          path: native-pinned
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            research/prime31_ic_20261115/native
            src/cryptanalysis
      - name: Install Rust 1.100.0
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Overlay candidate only, without altering source curve
        shell: bash
        run: |
          set -euo pipefail
          cp research/prime31_ic_20261115/native/examples/prime31_frobenius_inverse.rs native-pinned/research/prime31_ic_20261115/native/examples/
          test "$(git -C native-pinned rev-parse HEAD)" = "1df714645aa683cf975bc76fcacb9842cb4780fd"
          echo "Candidate revision: $GITHUB_SHA"
      - name: Original Rust library regression
        run: cargo +1.100.0 test --release --locked --lib --manifest-path native-pinned/research/prime31_ic_20261115/native/Cargo.toml
      - name: Frobenius linear factor, quadratic, dual inverse Rust tests
        run: cargo +1.100.0 test --release --locked --example prime31_frobenius_inverse --manifest-path native-pinned/research/prime31_ic_20261115/native/Cargo.toml
      - name: Produce complete public Q and recovered P transcript
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.100.0 run --release --locked --example prime31_frobenius_inverse --manifest-path native-pinned/research/prime31_ic_20261115/native/Cargo.toml > prime31-frobenius-inverse.json
          python3 -m json.tool prime31-frobenius-inverse.json > /dev/null
      - name: Independent BigInt replay of all 256 original-prime31 targets
        shell: bash
        run: |
          set -euo pipefail
          python3 research/prime31_ic_20261115/native/verify_prime31_frobenius_inverse.py prime31-frobenius-inverse.json | tee prime31-frobenius-independent.json
      - name: Report exact counted primitive costs (not ECDLP costs)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          with open("prime31-frobenius-inverse.json", encoding="utf-8") as f:
              d = json.load(f)
          fields = [
              "public_targets", "unique_linear_gcd", "dual_agreement",
              "direct_inverse_fp_multiplications", "direct_inverse_fp_inversions",
              "dual_component_fp_multiplications", "dual_component_fp_inversions",
              "dual_native_scalar_fp_multiplications", "dual_native_scalar_fp_inversions",
              "dual_native_group_additions", "direct_stage_ns_diagnostic",
              "dual_stage_ns_diagnostic", "direct_stage_ba_ns_diagnostic",
              "dual_stage_ba_ns_diagnostic", "full_index_calculus_logs_solved",
              "full_cost_speedup_claim",
          ]
          print("UNSIGNED PRIME31 INVERSE COMPONENT:", json.dumps({k:d[k] for k in fields},sort_keys=True))
          PY
      - name: Retain original counters and independent replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime31-frobenius-inverse-exact
          path: |
            prime31-frobenius-inverse.json
            prime31-frobenius-independent.json
          retention-days: 30
          if-no-files-found: warn
