name: Rootfind round85 fixed-degree division A/B
on:
  push:
    branches:
      - 'automation/rootfind-fixed-division-round85-20261121'
  pull_request:
    paths:
      - 'src/cryptanalysis/prime_root_trace.rs'
      - 'research/amm_digit_perf_20261118/round85_full_ab.py'
      - 'research/amm_digit_perf_20261118/round85_ablation.py'
      - '.github/workflows/rootfind-trace-round85-full.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-solve-verify-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round85_full_ab.py
            research/amm_digit_perf_20261118/round85_ablation.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Round85 source-exact complete solve and certificate verify
        run: |
          set -euo pipefail
          rustc --version
          python3 research/amm_digit_perf_20261118/round85_full_ab.py
          python3 research/amm_digit_perf_20261118/round85_ablation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round85-rootfind-ab-raw
          path: |
            research/amm_digit_perf_20261118/round85_full_ab_results.csv
            research/amm_digit_perf_20261118/round85_ablation_results.csv
