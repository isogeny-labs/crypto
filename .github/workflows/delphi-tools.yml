name: Delphi tools
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - tools/delphi_tools/**
      - .github/workflows/delphi-tools.yml
  push:
    paths:
      - tools/delphi_tools/**
      - .github/workflows/delphi-tools.yml
permissions:
  contents: read
jobs:
  test:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install shellcheck and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: shellcheck (bash scripts, by shebang)
        run: grep -lZ '^#!/usr/bin/env bash' tools/delphi_tools/* | xargs -0 shellcheck -s bash
      - name: Python helpers compile
        run: grep -l '^#!/usr/bin/env python3' tools/delphi_tools/* | xargs python3 -m py_compile
      - name: Tests
        run: bash tools/delphi_tools/test.sh
