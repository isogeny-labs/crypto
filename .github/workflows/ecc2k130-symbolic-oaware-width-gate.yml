name: ECC2K-130 symbolic O-aware width gate
on:
  # Not a pull-request check. The merge set is gate, size, and artifacts.
  # This runs when the matching change is on main, or on its schedule.
  push:
    branches: [main]
    paths:
      - 'research/notes/ecc2k130/symbolic_oaware_width_gate_20260925/**'
      - '.github/workflows/ecc2k130-symbolic-oaware-width-gate.yml'
      - '.github/scripts/*frozen-workflow-check*'
      - '.github/scripts/run-frozen-workflow-replays.mjs'
      - '.github/scripts/frozen-workflow-pins.json'
      - '.github/scripts/symbolic-oaware-width-gate-source-view-v1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-and-archive:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-symbolic-oaware-width-gate.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-symbolic-oaware-width-gate.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # FROZEN.json pins this workflow's bytes and eight src/ files that changed
      # on main after the freeze. Both steps run in the replay's isolated view,
      # which restores those from Git (FROZEN_VIEW.md in the study says why).
      - name: Compile and verify frozen source hashes
        env:
          FROZEN_VIEW_STEP: |
            python3 -m py_compile research/notes/ecc2k130/symbolic_oaware_width_gate_20260925/{audit,verify,run,ci_replay}.py
            python3 research/notes/ecc2k130/symbolic_oaware_width_gate_20260925/audit.py --preflight
        run: node .github/scripts/run-frozen-workflow-replays.mjs --only symbolic_oaware_width_gate_20260925 -- bash -eo pipefail -c "$FROZEN_VIEW_STEP"
      - name: Archive-structure replay when committed
        env:
          FROZEN_VIEW_STEP: |
            python3 research/notes/ecc2k130/symbolic_oaware_width_gate_20260925/ci_replay.py
        run: node .github/scripts/run-frozen-workflow-replays.mjs --only symbolic_oaware_width_gate_20260925 -- bash -eo pipefail -c "$FROZEN_VIEW_STEP"
