name: Workstation setup validation

on:
  pull_request:
    paths:
      - '.mcp.json'
      - '.codex/config.toml'
      - 'scripts/isolab-agent.sh'
      - 'scripts/test-isolab-agent.sh'
      - '.claude/hooks/session-start.sh'
      - 'scripts/cairn-node.sh'
      - 'scripts/setup-workstation.sh'
      - 'scripts/test_setup_workstation_go.py'
      - 'scripts/test_setup_workstation_github.py'
      - 'scripts/test_setup_workstation_github_helper.py'
      - '.github/workflows/workstation-setup.yml'
  push:
    branches: [main]
    paths:
      - '.mcp.json'
      - '.codex/config.toml'
      - 'scripts/isolab-agent.sh'
      - 'scripts/test-isolab-agent.sh'
      - '.claude/hooks/session-start.sh'
      - 'scripts/cairn-node.sh'
      - 'scripts/setup-workstation.sh'
      - 'scripts/test_setup_workstation_go.py'
      - 'scripts/test_setup_workstation_github.py'
      - 'scripts/test_setup_workstation_github_helper.py'
      - '.github/workflows/workstation-setup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  linux-installer:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|workstation-setup.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|workstation-setup.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.mcp.json
            /.codex/config.toml
            /scripts/isolab-agent.sh
            /scripts/test-isolab-agent.sh
            /.claude/hooks/session-start.sh
            /scripts/cairn-node.sh
            /scripts/setup-workstation.sh
            /scripts/test_setup_workstation_go.py
            /scripts/test_setup_workstation_github.py
            /scripts/test_setup_workstation_github_helper.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
      - name: Check shell syntax and diagnostics
        run: |
          # The self-hosted runner images lack shellcheck; hosted ones have it.
          command -v shellcheck >/dev/null || python -m pip install --quiet shellcheck-py==0.11.0.1
          bash -n .claude/hooks/session-start.sh scripts/cairn-node.sh scripts/setup-workstation.sh scripts/isolab-agent.sh scripts/test-isolab-agent.sh
          shellcheck -S warning .claude/hooks/session-start.sh scripts/cairn-node.sh scripts/setup-workstation.sh scripts/isolab-agent.sh scripts/test-isolab-agent.sh
      - name: Check Iso Lab agent connections without submitting work
        run: |
          jq -e '.mcpServers.isolab.type == "stdio" and .mcpServers["isolab-eks"].type == "stdio"' .mcp.json
          python3 -c 'import tomllib; c = tomllib.load(open(".codex/config.toml", "rb")); assert {"isolab", "isolab-eks"} <= c["mcp_servers"].keys()'
          bash scripts/test-isolab-agent.sh
      - name: Exercise native Linux installer transactions
        run: |
          command -v flock
          command -v sha256sum
          command -v jq
          mv --version
          python3 -m unittest discover -s scripts -p 'test_setup_workstation_*.py' -v
