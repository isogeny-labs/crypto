name: Rootfind round106 nonmonic trace normalization A/B
on:
  push:
    branches: ['automation/rootfind-column-accumulator-round89-20261121']
    paths:
      - 'src/cryptanalysis/prime_root_trace.rs'
      - 'research/amm_digit_perf_20261118/round106_full_ab.py'
      - '.github/workflows/rootfind-round106-normalize.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  round106-source-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round106_full_ab.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Production Rust frozen Round105 vs Round106
        env:
          ROOTFIND_BASELINE_REF: 759c1202aa66ca5cbca1e56b058ac4f7b650399c
          ROOTFIND_AB_OUTPUT: research/amm_digit_perf_20261118/round106_full_results.csv
        run: python3 research/amm_digit_perf_20261118/round106_full_ab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfind-round106-source-exact-results
          path: research/amm_digit_perf_20261118/round106_full_results.csv
