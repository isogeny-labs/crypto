name: Selected-call frontier (48 frozen vectors)
on:
  pull_request:
    paths:
      - 'research/chained_jacobian_transfers_20261110/cost_frontier_20261114/**'
      - 'research/chained_jacobian_transfers_20261110/evidence/public-n4-complete-chain-checkpoint-01/01-literal-setup-and-selected-vectors.json'
      - '.github/workflows/chained-selected-cost-frontier.yml'
  push:
    branches:
      - 'research/chained-selected-cost-frontier-20261114'
jobs:
  selected-call-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/chained-selected-cost-frontier.yml
            research/chained_jacobian_transfers_20261110/cost_frontier_20261114/
            research/chained_jacobian_transfers_20261110/evidence/public-n4-complete-chain-checkpoint-01/01-literal-setup-and-selected-vectors.json
      - name: Check exact checked-out source
        run: |
          echo HEAD=$(git rev-parse HEAD)
          git status --short
      - name: Independent normal/optimized replay and negative controls
        shell: bash
        run: |
          set -euo pipefail
          s=research/chained_jacobian_transfers_20261110/cost_frontier_20261114
          python3 -S "$s/selected_call_frontier.py" --self-test > /tmp/a-self.json
          python3 -O -S "$s/selected_call_frontier.py" --self-test > /tmp/b-self.json
          diff -u /tmp/a-self.json /tmp/b-self.json
          python3 -S "$s/selected_call_frontier.py" > /tmp/a.json
          python3 -O -S "$s/selected_call_frontier.py" > /tmp/b.json
          diff -u /tmp/a.json /tmp/b.json
          node "$s/independent_audit.cjs" > /tmp/js.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/a.json'))
          b=json.load(open('/tmp/js.json'))
          for key in ('vectors','direct_minus_retained','literal_componentwise_dominated',
                      'saved_map_evaluations','literal_minus_retained_ranges'):
              assert a[key] == b[key], key
          assert a['vectors'] == 48
          print('Two independent 48-vector audits: matching count-only result')
          PY
          cat /tmp/a-self.json
          cat /tmp/a.json
