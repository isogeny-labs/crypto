name: Rootfinding Round120 source-exact Rust p=5 mod 8 Jacobi A/B
on:
  pull_request:
    paths:
      - 'src/cryptanalysis/prime_radical_root.rs'
      - 'research/amm_digit_perf_20261118/round120_five_mod_eight_ab.py'
      - '.github/workflows/radical-root-round120.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-rust-five-mod-eight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/cryptanalysis/prime_radical_root.rs
            research/amm_digit_perf_20261118/round120_five_mod_eight_ab.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Source-exact Rust correctness and paired root benchmarks
        run: |
          set -euo pipefail
          rustc --version
          python3 research/amm_digit_perf_20261118/round120_five_mod_eight_ab.py | tee round120_native_rust.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfind-round120-rust-ab
          path: round120_native_rust.txt
          if-no-files-found: warn
