name: P-192 geometry collector Lean proofs

on:
  # Not a pull-request check. The merge set is gate, size, and artifacts.
  # This runs when the matching change is on main, or on its schedule.
  push:
    branches: [main]
    paths:
      - .github/workflows/p192-geometry-collector-lean.yml
      - research/p192_extension_cover_20261012/lean/**
      - research/p192_extension_cover_20261012/*cross_cubic_anchor*
      - research/p192_extension_cover_20261012/*residual_point_reuse*
      - research/p192_extension_cover_20261012/reports/run-20261024-anchor-eight/**
  workflow_dispatch:

jobs:
  pencil-and-four-cell:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|p192-geometry-collector-lean.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|p192-geometry-collector-lean.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 45 || 35 }}
    defaults:
      run:
        working-directory: research/p192_extension_cover_20261012/lean
    steps:
      - uses: actions/checkout@v4
        with:
          # The full tree (144k files) leaves the runner too little disk to
          # unpack the Lean toolchain; the package needs only its own directory.
          sparse-checkout: |
            research/p192_extension_cover_20261012/lean
            tools/artifacts
            .artifacts
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 research/p192_extension_cover_20261012
      - name: Build the pencil and four-cell theorems
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/p192_extension_cover_20261012/lean
          auto-config: false
          use-mathlib-cache: true
          build: true
          build-args: 'PencilThreeSum FourCellDensity TraceThree CrossEndpointQueryTriple'
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose PencilThreeSum'
      - name: Audit pencil theorem axioms
        run: lake env lean PencilThreeSum.lean
      - name: Fresh-check four-cell theorem and audit axioms
        run: lake env leanchecker --fresh --verbose FourCellDensity && lake env lean FourCellDensity.lean
      - name: Fresh-check three-step trace theorem and audit axioms
        run: lake env leanchecker --fresh --verbose TraceThree && lake env lean TraceThree.lean
      - name: Fresh-check cross-endpoint query theorem and replay coordinate certificate
        run: |
          lake env leanchecker --fresh --verbose CrossEndpointQueryTriple
          lake env lean CrossEndpointQueryTriple.lean
          python3 -B ../analyze_cross_endpoint_query_triples.py
          cd ../../..
          sha256sum -c research/p192_extension_cover_20261012/reports/run-20261024/ARTIFACTS.sha256
  residual-endpoint-clique:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|p192-geometry-collector-lean.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|p192-geometry-collector-lean.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 research/p192_extension_cover_20261012
      - name: Build and fresh-check residual-endpoint theorems
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/p192_extension_cover_20261012/lean
          auto-config: false
          use-mathlib-cache: true
          build: true
          build-args: 'ResidualEndpointClique'
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose ResidualEndpointClique'
      - name: Audit theorem axioms and replay frozen coordinate receipts
        run: |
          cd research/p192_extension_cover_20261012/lean
          lake env lean ResidualEndpointClique.lean
          cd ../../..
          python3 -B research/p192_extension_cover_20261012/verify_residual_endpoint_clique_pilot.py
          python3 -B research/p192_extension_cover_20261012/screen_same_cubic_residual_endpoints.py
          python3 -B research/p192_extension_cover_20261012/verify_residual_endpoint_high_degree.py
          python3 -B research/p192_extension_cover_20261012/analyze_residual_endpoint_combined_rows.py
          sha256sum -c research/p192_extension_cover_20261012/reports/run-20261024-high-degree/ARTIFACTS.sha256
  cross-cubic-anchor-fan:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|p192-geometry-collector-lean.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|p192-geometry-collector-lean.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 research/p192_extension_cover_20261012
      - name: Build and fresh-check anchored fan theorems
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/p192_extension_cover_20261012/lean
          auto-config: false
          use-mathlib-cache: true
          build: true
          build-args: 'CrossCubicAnchorFan'
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose CrossCubicAnchorFan'
      - name: Audit axioms and replay anchored geometry
        run: |
          cd research/p192_extension_cover_20261012/lean
          lake env lean CrossCubicAnchorFan.lean
          cd ../../..
          python3 -B research/p192_extension_cover_20261012/screen_residual_point_reuse.py
          python3 -B research/p192_extension_cover_20261012/screen_cross_cubic_anchor.py
          python3 -B research/p192_extension_cover_20261012/verify_cross_cubic_anchor_degree_eight.py
          python3 -B research/p192_extension_cover_20261012/analyze_cross_cubic_anchor_combined_rows.py
          sha256sum -c research/p192_extension_cover_20261012/reports/run-20261024-anchor-eight/ARTIFACTS.sha256
