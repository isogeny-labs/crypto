name: Radical sparse Fp2 arithmetic A/B

on:
  pull_request:
    paths:
      - 'src/cryptanalysis/prime_radical_root.rs'
      - 'research/amm_digit_perf_20261118/round71_sparse_fp2_isolated.py'
      - '.github/workflows/radical-sparse-fp2-round71.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-exact-rust-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/cryptanalysis/prime_radical_root.rs
            research/amm_digit_perf_20261118/round71_sparse_fp2_isolated.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Build frozen before/after and run production Rust benchmarks
        run: |
          set -euo pipefail
          rustc --version
          python3 research/amm_digit_perf_20261118/round71_sparse_fp2_isolated.py | tee "$RUNNER_TEMP/round71-native.txt"
          cat "$RUNNER_TEMP/round71-native.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round71-sparse-fp2-native-rust
          path: ${{ runner.temp }}/round71-native.txt
          if-no-files-found: ignore
