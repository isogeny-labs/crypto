name: ICB aimed 2LP compile and focused gates (high-memory)

# This workflow is deliberately pre-data only. It compiles the prospective
# source, runs six toy/static unit gates, runs the native analyzer self-test,
# and prints the provider planner's draft receipt. It never invokes ecbench,
# any provider, or any freeze/checkpoint/image/launch path.
on:
  # One-shot branch trigger: the job also requires the push's parent to be the
  # audited pre-trigger commit, so later source pushes cannot execute it.
  push:
    branches:
      - codex/large-prime
    paths:
      - .github/workflows/icb-aimed-2lp-compile.yml
      - .github/docker/arc-runner/Dockerfile
      - Cargo.toml
      - Cargo.lock
      - benchmarks/20261101-icb-aimed-large-prime/**
      - docs/ecbench/README.md
      - docs/session-logs/2026-11-01.md
      - examples/ecbench_aimed2lp_analyze.rs
      - examples/ecbench_aimed2lp_preflight.rs
      - research/icb_aimed_large_prime_n53_n61_20261101/**
      - src/cryptanalysis/ecbench/compare.rs
      - src/cryptanalysis/ecbench/koblitz_descent.rs
      - src/cryptanalysis/ecbench/methods.rs
      - src/cryptanalysis/ic_framework/large_prime.rs
      - src/cryptanalysis/koblitz_index_calculus.rs
      - src/ml_dataset/mod.rs
      - taskq/deploy/eks-karpenter/arc/README.md
      - taskq/deploy/eks-karpenter/arc/highmem-values.yaml
      - taskq/deploy/eks-karpenter/run-ecbench
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact 40-character commit to compile (must equal the dispatched SHA)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: icb-aimed-2lp-compile
  cancel-in-progress: false

env:
  STUDY_DIR: research/icb_aimed_large_prime_n53_n61_20261101
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  RAYON_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  RUSTFLAGS: "-C target-cpu=x86-64"
  RUSTUP_TOOLCHAIN: "1.99.0"

jobs:
  compile-gates:
    # The high-memory one-shot remains bound to its original parent. A later
    # hosted-fallback push must create only a skipped high-memory job.
    if: ${{ github.repository == 'isogeny-labs/crypto' && github.ref == 'refs/heads/codex/large-prime' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == '73a35d4c4801193a306eddaf54ec5bbf1bee4c3f')) }}
    runs-on: crypto-eks-highmem
    timeout-minutes: 240
    env:
      EXPECTED_COMMIT: ${{ github.event_name == 'push' && github.sha || inputs.expected_commit }}
      EVENT_BEFORE: ${{ github.event.before }}
      TRIGGER_PARENT_COMMIT: 73a35d4c4801193a306eddaf54ec5bbf1bee4c3f
    steps:
      - name: Check out the exact unfrozen source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Assert draft state and initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          cargo_target_dir="$RUNNER_TEMP/icb-aimed-2lp-compile-target"
          evidence_dir="$RUNNER_TEMP/icb-aimed-2lp-compile-evidence"
          test ! -e "$cargo_target_dir"
          test ! -L "$cargo_target_dir"
          test ! -e "$evidence_dir"
          test ! -L "$evidence_dir"
          mkdir -m 700 "$cargo_target_dir" "$evidence_dir"
          test ! -L "$cargo_target_dir"
          test -z "$(find "$cargo_target_dir" -mindepth 1 -print -quit)"
          printf 'CARGO_TARGET_DIR=%s\nEVIDENCE_DIR=%s\n' \
            "$cargo_target_dir" "$evidence_dir" >> "$GITHUB_ENV"
          exec > >(tee "$evidence_dir/preconditions.log") 2>&1

          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$GITHUB_EVENT_NAME" in
            push)
              test "$EVENT_BEFORE" = "$TRIGGER_PARENT_COMMIT"
              test "$(git rev-parse HEAD^)" = "$TRIGGER_PARENT_COMMIT"
              ;;
            workflow_dispatch)
              test -n "$EXPECTED_COMMIT"
              ;;
            *)
              printf 'unauthorized event: %s\n' "$GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          test -z "$(git status --porcelain --untracked-files=all)"

          assert_empty_or_absent() {
            local path=$1
            if test -e "$path" || test -L "$path"; then
              test -d "$path"
              test ! -L "$path"
              test -z "$(find "$path" -mindepth 1 -print -quit)"
            fi
          }
          assert_empty_or_absent target
          assert_empty_or_absent "$STUDY_DIR/attempts"
          assert_empty_or_absent "$STUDY_DIR/sessions"

          jq -e '
            .freeze.status == "draft" and
            .freeze.protocol_sha256 == null and
            .freeze.commit == null and
            .freeze.frozen_at == null and
            .freeze.filed_before_affected_data == null and
            .analysis_plan.frozen_before_data == false and
            (.extensions.target_launch_gate | startswith("DISABLED:"))
          ' "$STUDY_DIR/protocol/protocol.json" >/dev/null
          jq -e '
            .status == "invalidated" and
            .source_commit == null and
            .target_data.n53_runs == 0 and
            .target_data.n61_runs == 0
          ' "$STUDY_DIR/receipts/focused-gates.json" >/dev/null
          for request in "$STUDY_DIR"/requests/*.json; do
            jq -e '
              .status == "draft_identity_blocked" and
              .source_revision == null and
              .ecbench_sha256 == null and
              .image_uri == null and
              .image_digest == null and
              .argv == null and
              .payload_sha256 == null and
              .payload_bytes == null and
              .provider_identity_sha256 == null and
              .pod_spec_sha256 == null
            ' "$request" >/dev/null
          done

          for forbidden in \
            "$STUDY_DIR/results.json" \
            "$STUDY_DIR/VALIDATION.json" \
            "$STUDY_DIR/export.json" \
            "$STUDY_DIR/receipts/checkpoint.json" \
            "$STUDY_DIR/receipts/image.json" \
            "$STUDY_DIR/receipts/provider-preflight.json" \
            "$STUDY_DIR/receipts/native-analyzer-tests.json"; do
            test ! -e "$forbidden"
            test ! -L "$forbidden"
          done

          memory_bytes=$(cat /sys/fs/cgroup/memory.max)
          [[ "$memory_bytes" =~ ^[0-9]+$ ]]
          test "$memory_bytes" -ge $((112 * 1024 * 1024 * 1024))
          test "$(uname -m)" = x86_64
          configured_runner_image=$(awk '$1 == "image:" {print $2; exit}' \
            taskq/deploy/eks-karpenter/arc/highmem-values.yaml)
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg runner_name "$RUNNER_NAME" \
            --arg arch "$(uname -m)" \
            --arg kernel "$(uname -sr)" \
            --arg cpu_max "$(cat /sys/fs/cgroup/cpu.max)" \
            --arg configured_runner_image "$configured_runner_image" \
            --argjson memory_bytes "$memory_bytes" \
            '{
              schema:"icb.aimed2lp.compile_host/v1",
              commit:$commit,
              ref:$ref,
              run_id:$run_id,
              run_attempt:$run_attempt,
              runner_name:$runner_name,
              arch:$arch,
              kernel:$kernel,
              cgroup:{memory_bytes:$memory_bytes,cpu_max:$cpu_max},
              configured_runner_image:$configured_runner_image
            }' > "$evidence_dir/host.json"

          hash_bound_source() {
            {
              printf '%s\n' \
                Cargo.toml Cargo.lock \
                .github/workflows/icb-aimed-2lp-compile.yml \
                benchmarks/20261101-icb-aimed-large-prime/README.md \
                docs/ecbench/README.md docs/session-logs/2026-11-01.md \
                examples/ecbench_aimed2lp_analyze.rs \
                examples/ecbench_aimed2lp_preflight.rs \
                src/cryptanalysis/ecbench/compare.rs \
                src/cryptanalysis/ecbench/koblitz_descent.rs \
                src/cryptanalysis/ecbench/methods.rs \
                src/cryptanalysis/ic_framework/large_prime.rs \
                src/cryptanalysis/koblitz_index_calculus.rs \
                src/ml_dataset/mod.rs \
                .github/docker/arc-runner/Dockerfile \
                taskq/deploy/eks-karpenter/arc/README.md \
                taskq/deploy/eks-karpenter/arc/highmem-values.yaml \
                taskq/deploy/eks-karpenter/run-ecbench
              find "$STUDY_DIR" -type f -print
            } | LC_ALL=C sort -u | while IFS= read -r path; do
              test -f "$path"
              test ! -L "$path"
              sha256sum "$path"
            done
          }
          hash_bound_source > "$evidence_dir/source-bindings.before.sha256"
          printf 'draft preconditions pass for %s\n' "$GITHUB_SHA"

      - name: Select and record the exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal \
            2>&1 | tee "$EVIDENCE_DIR/rustup-toolchain-install.log"
          cargo -V | tee "$EVIDENCE_DIR/cargo-version.txt"
          rustc -Vv | tee "$EVIDENCE_DIR/rustc-version.txt"
          test "$(cargo -V)" = "cargo 1.99.0 (5f94df478 2026-08-27)"
          test "$(rustc -V)" = "rustc 1.99.0 (b940084d7 2026-09-28)"
          grep -Fxq 'commit-hash: b940084d7eb6a299eb4bfeb8e34901bc051e7ac4' \
            "$EVIDENCE_DIR/rustc-version.txt"

      - name: Build ecbench and the two native gate binaries
        id: release_build
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{argv:[
            "cargo","build","--locked","--release","--no-default-features",
            "--bin","ecbench",
            "--example","ecbench_aimed2lp_analyze",
            "--example","ecbench_aimed2lp_preflight"
          ]}' > "$EVIDENCE_DIR/release-build-command.json"
          cargo build --locked --release --no-default-features \
            --bin ecbench \
            --example ecbench_aimed2lp_analyze \
            --example ecbench_aimed2lp_preflight \
            2>&1 | tee "$EVIDENCE_DIR/release-build.log"
          test -x "$CARGO_TARGET_DIR/release/ecbench"
          test -x "$CARGO_TARGET_DIR/release/examples/ecbench_aimed2lp_analyze"
          test -x "$CARGO_TARGET_DIR/release/examples/ecbench_aimed2lp_preflight"
          sha256sum \
            "$CARGO_TARGET_DIR/release/ecbench" \
            "$CARGO_TARGET_DIR/release/examples/ecbench_aimed2lp_analyze" \
            "$CARGO_TARGET_DIR/release/examples/ecbench_aimed2lp_preflight" \
            > "$EVIDENCE_DIR/release-binaries.sha256"

      - name: Compile the release lib-test harness
        id: test_harness
        if: ${{ steps.release_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{argv:[
            "cargo","test","--locked","--release","--no-default-features",
            "--lib","--no-run","--jobs","1"
          ]}' > "$EVIDENCE_DIR/test-harness-build-command.json"
          cargo test --locked --release --no-default-features \
            --lib --no-run --jobs 1 \
            2>&1 | tee "$EVIDENCE_DIR/test-harness-build.log"

      - name: Run all six exact focused tests
        id: focused_tests
        if: ${{ steps.test_harness.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            'cryptanalysis::ecbench::koblitz_descent::tests::projected_large_prime_rows_map_to_the_frozen_log_columns_and_fail_closed'
            'cryptanalysis::ecbench::koblitz_descent::tests::aimed_lp_adapter_preserves_the_frozen_ordinary_three_sum_opportunities'
            'cryptanalysis::ecbench::koblitz_descent::tests::lp_zero_is_the_frozen_pipeline_and_two_lp_recovers_a_toy_target'
            'cryptanalysis::ecbench::methods::tests::aimed_lp_report_control_and_native_ownership_are_exact'
            'cryptanalysis::koblitz_index_calculus::tests::exported_aimed_window_indices_are_the_collectors_exact_scan'
            'cryptanalysis::ic_framework::large_prime::tests::aimed_decomposition_scans_only_the_named_third_summands'
          )
          receipt_lines="$EVIDENCE_DIR/focused-tests.jsonl"
          : > "$receipt_lines"
          failed=0
          index=0
          for test_name in "${tests[@]}"; do
            index=$((index + 1))
            printf -v stem 'focused-test-%02d' "$index"
            log="$EVIDENCE_DIR/$stem.log"
            jq -n --arg test "$test_name" '{argv:[
              "cargo","test","--locked","--release","--no-default-features",
              "--lib",$test,"--jobs","1","--","--exact","--nocapture"
            ]}' > "$EVIDENCE_DIR/$stem-command.json"
            set +e
            cargo test --locked --release --no-default-features \
              --lib "$test_name" --jobs 1 -- --exact --nocapture \
              2>&1 | tee "$log"
            exit_code=${PIPESTATUS[0]}
            set -e
            pass_count=$(grep -c '^test result: ok\. 1 passed; 0 failed;' "$log" || true)
            observed=$(grep '^test result:' "$log" | tail -n 1 || true)
            outcome=pass
            if test "$exit_code" -ne 0 || test "$pass_count" -ne 1; then
              outcome=fail
              failed=1
            fi
            jq -cn \
              --arg id "$test_name" \
              --arg outcome "$outcome" \
              --arg observed "$observed" \
              --arg log "$stem.log" \
              --argjson exit_code "$exit_code" \
              '{id:$id,outcome:$outcome,exit_code:$exit_code,observed:$observed,log:$log}' \
              >> "$receipt_lines"
          done
          jq -s . "$receipt_lines" > "$EVIDENCE_DIR/focused-tests.json"
          test "$failed" -eq 0

      - name: Run the native analyzer adversarial self-test
        id: analyzer_self_test
        if: ${{ always() && steps.release_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/release/examples/ecbench_aimed2lp_analyze"
          log="$EVIDENCE_DIR/native-analyzer-self-test.log"
          set +e
          "$binary" --self-test 2>&1 | tee "$log"
          exit_code=${PIPESTATUS[0]}
          set -e

          checks=(
            clustered-sign-flip
            holm-four-cell
            canonical-json
            attempt-envelope-adversarial
            result-schema-v2-adversarial
            export-636-adversarial
          )
          checks_lines="$EVIDENCE_DIR/native-analyzer-checks.jsonl"
          : > "$checks_lines"
          failed=0
          for check in "${checks[@]}"; do
            outcome=fail
            if grep -Fxq "PASS: $check" "$log"; then
              outcome=pass
            else
              failed=1
            fi
            jq -cn --arg id "$check" --arg outcome "$outcome" \
              '{id:$id,outcome:$outcome}' >> "$checks_lines"
          done
          jq -s . "$checks_lines" > "$EVIDENCE_DIR/native-analyzer-checks.json"
          if test "$exit_code" -ne 0 || \
             ! grep -Fxq 'OK: native aimed-2LP analyzer self-test' "$log"; then
            failed=1
          fi
          status=fail
          if test "$failed" -eq 0; then status=pass; fi
          jq -n \
            --arg created "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg status "$status" \
            --arg source_sha256 "$(sha256sum examples/ecbench_aimed2lp_analyze.rs | awk '{print $1}')" \
            --arg binary_sha256 "$(sha256sum "$binary" | awk '{print $1}')" \
            --arg analysis_manifest_sha256 "$(sha256sum "$STUDY_DIR/analysis-manifest.json" | awk '{print $1}')" \
            --arg result_schema_sha256 "$(sha256sum "$STUDY_DIR/RESULT_SCHEMA.json" | awk '{print $1}')" \
            --arg receipt_schema_sha256 "$(sha256sum "$STUDY_DIR/RECEIPT_SCHEMA.json" | awk '{print $1}')" \
            --arg request_schema_sha256 "$(sha256sum "$STUDY_DIR/REQUEST_SCHEMA.json" | awk '{print $1}')" \
            --arg binary "$binary" \
            --slurpfile checks "$EVIDENCE_DIR/native-analyzer-checks.json" \
            '{
              schema:"icb.aimed2lp.native_analyzer_tests/v1",
              created:$created,
              status:$status,
              source_sha256:$source_sha256,
              binary_sha256:$binary_sha256,
              analysis_manifest_sha256:$analysis_manifest_sha256,
              result_schema_sha256:$result_schema_sha256,
              receipt_schema_sha256:$receipt_schema_sha256,
              request_schema_sha256:$request_schema_sha256,
              command:[$binary,"--self-test"],
              checks:$checks[0]
            }' > "$EVIDENCE_DIR/native-analyzer-tests.json"
          test "$failed" -eq 0

      - name: Run draft-only native provider preflight
        id: draft_preflight
        if: ${{ always() && steps.release_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/release/examples/ecbench_aimed2lp_preflight"
          jq -n --arg binary "$binary" --arg repo "$GITHUB_WORKSPACE" \
            '{argv:[$binary,"--repo",$repo]}' \
            > "$EVIDENCE_DIR/draft-preflight-command.json"
          set +e
          "$binary" --repo "$GITHUB_WORKSPACE" \
            > "$EVIDENCE_DIR/draft-preflight.json" \
            2> "$EVIDENCE_DIR/draft-preflight.stderr.log"
          exit_code=$?
          set -e
          cat "$EVIDENCE_DIR/draft-preflight.json"
          test "$exit_code" -eq 0
          jq -e '
            .schema == "icb.aimed2lp.provider_preflight/v1" and
            .status == "draft_pass" and
            (.specs | length) == 3 and
            ([.specs[].path] | sort) == ([
              "research/icb_aimed_large_prime_n53_n61_20261101/specs/control-n13.json",
              "research/icb_aimed_large_prime_n53_n61_20261101/specs/n53.json",
              "research/icb_aimed_large_prime_n53_n61_20261101/specs/n61.json"
            ] | sort) and
            (all(.specs[]; .scheduled_aa_pairs >= 5 and .warmup >= 1 and .rounds >= 5))
          ' "$EVIDENCE_DIR/draft-preflight.json" >/dev/null

      - name: Assemble source-bound compile-gate receipt
        if: ${{ always() && steps.release_build.outcome == 'success' }}
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.release_build.outcome }}
          HARNESS_OUTCOME: ${{ steps.test_harness.outcome }}
          FOCUSED_OUTCOME: ${{ steps.focused_tests.outcome }}
          ANALYZER_OUTCOME: ${{ steps.analyzer_self_test.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.draft_preflight.outcome }}
        run: |
          set -euo pipefail
          tests='[]'
          if test -f "$EVIDENCE_DIR/focused-tests.json"; then
            tests=$(cat "$EVIDENCE_DIR/focused-tests.json")
          fi
          analyzer_receipt_sha256=null
          if test -f "$EVIDENCE_DIR/native-analyzer-tests.json"; then
            analyzer_receipt_sha256=$(sha256sum "$EVIDENCE_DIR/native-analyzer-tests.json" | awk '{print $1}')
          fi
          preflight_receipt_sha256=null
          preflight_status=null
          if test -s "$EVIDENCE_DIR/draft-preflight.json" && \
             jq -e . "$EVIDENCE_DIR/draft-preflight.json" >/dev/null; then
            preflight_receipt_sha256=$(sha256sum "$EVIDENCE_DIR/draft-preflight.json" | awk '{print $1}')
            preflight_status=$(jq -r '.status // "invalid"' "$EVIDENCE_DIR/draft-preflight.json")
          fi
          overall=fail
          if test "$BUILD_OUTCOME" = success && \
             test "$HARNESS_OUTCOME" = success && \
             test "$FOCUSED_OUTCOME" = success && \
             test "$ANALYZER_OUTCOME" = success && \
             test "$PREFLIGHT_OUTCOME" = success; then
            overall=pass
          fi
          jq -n \
            --arg created "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg status "$overall" \
            --arg source_commit "$GITHUB_SHA" \
            --arg cargo "$(cat "$EVIDENCE_DIR/cargo-version.txt")" \
            --arg rustc "$(head -n 1 "$EVIDENCE_DIR/rustc-version.txt")" \
            --arg build "$BUILD_OUTCOME" \
            --arg harness "$HARNESS_OUTCOME" \
            --arg focused "$FOCUSED_OUTCOME" \
            --arg analyzer "$ANALYZER_OUTCOME" \
            --arg preflight "$PREFLIGHT_OUTCOME" \
            --arg preflight_status "$preflight_status" \
            --arg analyzer_receipt_sha256 "$analyzer_receipt_sha256" \
            --arg preflight_receipt_sha256 "$preflight_receipt_sha256" \
            --arg source_bindings_sha256 "$(sha256sum "$EVIDENCE_DIR/source-bindings.before.sha256" | awk '{print $1}')" \
            --arg binary_hashes_sha256 "$(sha256sum "$EVIDENCE_DIR/release-binaries.sha256" | awk '{print $1}')" \
            --argjson tests "$tests" \
            '{
              schema:"icb.aimed2lp.compile_gates/v1",
              created:$created,
              status:$status,
              source_commit:$source_commit,
              protocol_status:"draft",
              toolchain:{cargo:$cargo,rustc:$rustc},
              outcomes:{
                release_build:$build,
                lib_test_harness:$harness,
                focused_tests:$focused,
                analyzer_self_test:$analyzer,
                draft_preflight:$preflight
              },
              focused_tests:$tests,
              draft_preflight_status:$preflight_status,
              source_bindings_sha256:$source_bindings_sha256,
              binary_hashes_sha256:$binary_hashes_sha256,
              native_analyzer_receipt_sha256:(if $analyzer_receipt_sha256 == "null" then null else $analyzer_receipt_sha256 end),
              provider_preflight_receipt_sha256:(if $preflight_receipt_sha256 == "null" then null else $preflight_receipt_sha256 end),
              target_data:{control_runs:0,n53_runs:0,n61_runs:0}
            }' > "$EVIDENCE_DIR/compile-gates-receipt.json"

      - name: Delete build target and reassert the draft boundary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          post_log="$EVIDENCE_DIR/postconditions.log"
          printf 'postcondition audit for %s\n' "$GITHUB_SHA" | tee "$post_log"

          test "$CARGO_TARGET_DIR" = "$RUNNER_TEMP/icb-aimed-2lp-compile-target"
          if test -e "$CARGO_TARGET_DIR" || test -L "$CARGO_TARGET_DIR"; then
            test -d "$CARGO_TARGET_DIR"
            test ! -L "$CARGO_TARGET_DIR"
            find "$CARGO_TARGET_DIR" -depth -delete
          fi
          test ! -e "$CARGO_TARGET_DIR"
          test ! -L "$CARGO_TARGET_DIR"

          assert_empty_or_absent() {
            local path=$1
            if test -e "$path" || test -L "$path"; then
              test -d "$path"
              test ! -L "$path"
              test -z "$(find "$path" -mindepth 1 -print -quit)"
            fi
          }
          assert_empty_or_absent target
          assert_empty_or_absent "$STUDY_DIR/attempts"
          assert_empty_or_absent "$STUDY_DIR/sessions"
          jq -e '
            .freeze.status == "draft" and
            .freeze.protocol_sha256 == null and
            .freeze.commit == null and
            .freeze.frozen_at == null and
            .freeze.filed_before_affected_data == null and
            .analysis_plan.frozen_before_data == false and
            (.extensions.target_launch_gate | startswith("DISABLED:"))
          ' "$STUDY_DIR/protocol/protocol.json" >/dev/null
          jq -e '
            .status == "invalidated" and
            .source_commit == null and
            .target_data.n53_runs == 0 and
            .target_data.n61_runs == 0
          ' "$STUDY_DIR/receipts/focused-gates.json" >/dev/null
          for request in "$STUDY_DIR"/requests/*.json; do
            jq -e '
              .status == "draft_identity_blocked" and
              .source_revision == null and
              .ecbench_sha256 == null and
              .image_uri == null and
              .image_digest == null and
              .argv == null and
              .payload_sha256 == null and
              .payload_bytes == null and
              .provider_identity_sha256 == null and
              .pod_spec_sha256 == null
            ' "$request" >/dev/null
          done
          for forbidden in \
            "$STUDY_DIR/results.json" \
            "$STUDY_DIR/VALIDATION.json" \
            "$STUDY_DIR/export.json" \
            "$STUDY_DIR/receipts/checkpoint.json" \
            "$STUDY_DIR/receipts/image.json" \
            "$STUDY_DIR/receipts/provider-preflight.json" \
            "$STUDY_DIR/receipts/native-analyzer-tests.json"; do
            test ! -e "$forbidden"
            test ! -L "$forbidden"
          done

          hash_bound_source() {
            {
              printf '%s\n' \
                Cargo.toml Cargo.lock \
                .github/workflows/icb-aimed-2lp-compile.yml \
                benchmarks/20261101-icb-aimed-large-prime/README.md \
                docs/ecbench/README.md docs/session-logs/2026-11-01.md \
                examples/ecbench_aimed2lp_analyze.rs \
                examples/ecbench_aimed2lp_preflight.rs \
                src/cryptanalysis/ecbench/compare.rs \
                src/cryptanalysis/ecbench/koblitz_descent.rs \
                src/cryptanalysis/ecbench/methods.rs \
                src/cryptanalysis/ic_framework/large_prime.rs \
                src/cryptanalysis/koblitz_index_calculus.rs \
                src/ml_dataset/mod.rs \
                .github/docker/arc-runner/Dockerfile \
                taskq/deploy/eks-karpenter/arc/README.md \
                taskq/deploy/eks-karpenter/arc/highmem-values.yaml \
                taskq/deploy/eks-karpenter/run-ecbench
              find "$STUDY_DIR" -type f -print
            } | LC_ALL=C sort -u | while IFS= read -r path; do
              test -f "$path"
              test ! -L "$path"
              sha256sum "$path"
            done
          }
          hash_bound_source > "$EVIDENCE_DIR/source-bindings.after.sha256"
          cmp "$EVIDENCE_DIR/source-bindings.before.sha256" \
              "$EVIDENCE_DIR/source-bindings.after.sha256"
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -L "$EVIDENCE_DIR"
          test -z "$(find "$EVIDENCE_DIR" -mindepth 1 -type l -print -quit)"

          while IFS= read -r artifact; do
            test ! -L "$artifact"
            case "$artifact" in
              *.json|*.jsonl|*.log|*.txt|*.sha256) ;;
              *) printf 'unexpected evidence file: %s\n' "$artifact" >&2; exit 1 ;;
            esac
          done < <(find "$EVIDENCE_DIR" -maxdepth 1 -type f -print | LC_ALL=C sort)
          printf 'source unchanged; target, sessions, attempts and outputs absent\n' \
            | tee -a "$post_log"
          (
            cd "$EVIDENCE_DIR"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' \
              | LC_ALL=C sort | xargs -r sha256sum
          ) > "$EVIDENCE_DIR/SHA256SUMS"

      - name: Upload compile, test, hash, and draft-preflight evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: icb-aimed-2lp-compile-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/icb-aimed-2lp-compile-evidence/*.json
            ${{ runner.temp }}/icb-aimed-2lp-compile-evidence/*.jsonl
            ${{ runner.temp }}/icb-aimed-2lp-compile-evidence/*.log
            ${{ runner.temp }}/icb-aimed-2lp-compile-evidence/*.txt
            ${{ runner.temp }}/icb-aimed-2lp-compile-evidence/*.sha256
            ${{ runner.temp }}/icb-aimed-2lp-compile-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
