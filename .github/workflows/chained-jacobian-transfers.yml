name: Chained Jacobian transfer fixture
on:
  push:
    # The dedicated workflow is not on main yet;filtered research pushes
    # exercise these same jobs without a new repository-wide PR trigger.
    branches: [main, research/chained-jacobian-transfer-20261110]
    paths:
      - 'research/chained_jacobian_transfers_20261110/native/**'
      - 'research/chained_jacobian_transfers_20261110/lean/**'
      - 'research/chained_jacobian_transfers_20261110/successor-preflight/**'
      - 'research/chained_jacobian_transfers_20261110/algebra-certificates/**'
      - 'src/hash/sha256.rs'
      - 'src/cryptanalysis/identity_certificate.rs'
      - 'docs/identity-certificates/schoenhage-10mult.json'
      - 'src/prime_hyperelliptic/fp2.rs'
      - 'src/cryptanalysis/jv_cover.rs'
      - '.github/workflows/chained-jacobian-transfers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  algebra-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/chained_jacobian_transfers_20261110/algebra-certificates
            research/chained_jacobian_transfers_20261110/lean/QuarticGluing.lean
            research/chained_jacobian_transfers_20261110/lean/TwoPrimaryQuotient.lean
            research/chained_jacobian_transfers_20261110/lean/IsogenyCycles.lean
            research/chained_jacobian_transfers_20261110/lean/UnbalancedCovers.lean
            research/chained_jacobian_transfers_20261110/lean/EvenKernels.lean
            research/chained_jacobian_transfers_20261110/evidence/quartic-duplication-identity-03.json
            research/chained_jacobian_transfers_20261110/evidence/two-primary-halving-identity-03.json
            research/chained_jacobian_transfers_20261110/evidence/isogeny-cycle-norm-identity-01.json
            research/chained_jacobian_transfers_20261110/evidence/isogeny-cycle-first-identity-01.json
            research/chained_jacobian_transfers_20261110/evidence/isogeny-cycle-second-identity-01.json
            research/chained_jacobian_transfers_20261110/evidence/unbalanced-direct-identity-01.json
            research/chained_jacobian_transfers_20261110/evidence/unbalanced-reciprocal-identity-01.json
            research/chained_jacobian_transfers_20261110/evidence/even-kernel-cubic-identity-01.json
            src/hash/sha256.rs
            src/cryptanalysis/identity_certificate.rs
            docs/identity-certificates/schoenhage-10mult.json
      - name: Replay the native identity certificates with the existing checker
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          cd research/chained_jacobian_transfers_20261110/algebra-certificates
          sha256sum -c reference.sha256
          cargo fmt -- --check
          cargo fetch --locked
          cargo clippy --all-targets --offline --locked -- -D warnings
          cargo test --release --offline --locked -- --nocapture 2>&1 | tee "$RUNNER_TEMP/algebra-tests.txt"
          cargo run --release --offline --locked -- "$RUNNER_TEMP/duplication.json" "$RUNNER_TEMP/halving.json" "$RUNNER_TEMP/cycle-norm.json" "$RUNNER_TEMP/cycle-first.json" "$RUNNER_TEMP/cycle-second.json" "$RUNNER_TEMP/unbalanced-direct.json" "$RUNNER_TEMP/unbalanced-reciprocal.json" "$RUNNER_TEMP/kernel-cubic.json" 2>&1 | tee -a "$RUNNER_TEMP/algebra-tests.txt"
          cmp "$RUNNER_TEMP/duplication.json" ../evidence/quartic-duplication-identity-03.json
          cmp "$RUNNER_TEMP/halving.json" ../evidence/two-primary-halving-identity-03.json
          cmp "$RUNNER_TEMP/cycle-norm.json" ../evidence/isogeny-cycle-norm-identity-01.json
          cmp "$RUNNER_TEMP/cycle-first.json" ../evidence/isogeny-cycle-first-identity-01.json
          cmp "$RUNNER_TEMP/cycle-second.json" ../evidence/isogeny-cycle-second-identity-01.json
          cmp "$RUNNER_TEMP/unbalanced-direct.json" ../evidence/unbalanced-direct-identity-01.json
          cmp "$RUNNER_TEMP/unbalanced-reciprocal.json" ../evidence/unbalanced-reciprocal-identity-01.json
          cmp "$RUNNER_TEMP/kernel-cubic.json" ../evidence/even-kernel-cubic-identity-01.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chained-algebra-certificates-${{ github.sha }}
          path: ${{ runner.temp }}/algebra-tests.txt
          if-no-files-found: ignore

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: |
            research/chained_jacobian_transfers_20261110/native
            src/prime_hyperelliptic
      - name: Pin Rust and check the native fixtures
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          manifest=research/chained_jacobian_transfers_20261110/native/Cargo.toml
          cargo fmt --manifest-path "$manifest" -- --check
          cargo clippy --manifest-path "$manifest" --all-targets --features small-prime --offline --locked -- -D warnings
          cargo test --release --manifest-path "$manifest" --features small-prime --offline --locked -- --nocapture 2>&1 | tee "$RUNNER_TEMP/native-tests.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chained-jacobian-native-${{ github.sha }}
          path: ${{ runner.temp }}/native-tests.txt
          if-no-files-found: ignore

  successor-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Cargo.toml
            /Cargo.lock
            research/chained_jacobian_transfers_20261110/successor-preflight
            research/chained_jacobian_transfers_20261110/evidence/kernel-full-03/kernel-certificate.json
            isogeny_algos
            src/cryptanalysis/jv_cover.rs
      - name: Check the frozen constructor and successor/kernel replay
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
          CHAINED_EVEN_KERNEL_CERTIFICATE_OUT: ${{ runner.temp }}/even-kernel.json
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          cd research/chained_jacobian_transfers_20261110/successor-preflight
          sha256sum -c reference.sha256
          sha256sum -c legacy.sha256
          cargo fmt -- --check
          cargo clippy --all-targets --offline --locked -- -D warnings
          cargo test --release --offline --locked -- --nocapture 2>&1 | tee "$RUNNER_TEMP/successor-tests.txt"
          cmp "$RUNNER_TEMP/even-kernel.json" ../evidence/kernel-full-03/kernel-certificate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chained-successor-preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/successor-tests.txt
            ${{ runner.temp }}/even-kernel.json
          if-no-files-found: ignore

  structural-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: |
            research/chained_jacobian_transfers_20261110/lean
            tools/lean
      - name: Install the pinned Lean toolchain
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 15 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --no-modify-path --default-toolchain "$(cat research/chained_jacobian_transfers_20261110/lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit the proof files
        run: |
          set -euo pipefail
          for source in ChainTransfer PolynomialIdentities SuccessorCollapse CubicPullback BalancedDivisors FrobeniusPairings RichelotAlgebra ShiftedCover TargetFrobenius SplitQuotients OddKernelProjectors EllipticSeven SevenJacobian ChainTransport RichelotDescent DirectNorms ClosedFibres CyclicFortyNine TwoHopTransport SuccessorNorms KernelChart OddFieldDescent RootTable BalancedChart QuarticFibre ChainCompression SpectralControls ReverseRecovery IndependentMapChart SevenCensusControls QuarticGluing TwoPrimaryQuotient IsogenyCycles UnbalancedCovers PartialFrobenius EvenJacobian EvenKernels; do
            tools/lean/proof-gate.sh "research/chained_jacobian_transfers_20261110/lean/$source.lean" --out "$RUNNER_TEMP/proofs-$source"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chained-jacobian-proofs-${{ github.sha }}
          path: ${{ runner.temp }}/proofs-*
          if-no-files-found: ignore
