name: CT22 HLP mod-4 torsion census
on:
  pull_request:
    paths:
      - "research/chained_jacobian_transfers_20261110/ct22_mod4_gluing.rs"
      - "research/chained_jacobian_transfers_20261110/ct22_actual_e4.py"
      - ".github/workflows/ct22-mod4-torsion.yml"
  workflow_dispatch:
jobs:
  torsion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile std-only Rust test and run exhaustive 256-element checks
        run: |
          rustc --version
          rustc --edition=2021 --test \
            research/chained_jacobian_transfers_20261110/ct22_mod4_gluing.rs \
            -o /tmp/ct22_mod4_gluing
          /tmp/ct22_mod4_gluing --nocapture
      - name: Replay actual degree-seven elliptic 4-torsion and product lifts
        run: |
          python3 -S research/chained_jacobian_transfers_20261110/ct22_actual_e4.py
          python3 -m py_compile research/chained_jacobian_transfers_20261110/ct22_actual_e4.py
