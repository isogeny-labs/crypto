name: Hamming-ideal PDP oracle (self-test and replay)
# The standalone crate under research/hamming_ideal_pdp_20260930 encodes a
# weight-bounded factor base with the Hamming ideals of La Scala, Marchesin
# and Tiwari and solves point decompositions with a truncated Boolean F4
# inside MultiSolve. This job checks the F4 verdicts against brute force,
# replays the n = 7 cell for two encodings and compares the recorded call
# counts, and re-derives the summary table from the frozen raw results.
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selftest-and-replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|hamming-ideal-pdp.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|hamming-ideal-pdp.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 30 }}
    defaults:
      run:
        working-directory: research/hamming_ideal_pdp_20260930
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --manifest-path hamming_pdp/Cargo.toml
      - name: F4 verdicts against brute force (900 random systems)
        run: |
          for s in 1 7 13; do hamming_pdp/target/release/hamming_pdp --selftest $s; done
      - name: Replay the n = 7 cell (SUB and FC, four targets) and compare with the frozen run
        run: python3 replay_check.py --n 7 --encodings SUB,FC --targets 4
      - name: Summary table re-derives from the frozen raw results
        run: |
          python3 analyse.py --tag main > /tmp/summary.txt
          git diff --exit-code -- results/main/summary.json
