name: Prime31 Kummer16 curve/twist rational-fibre gate (source-specific)
on:
  push:
    branches:
      - automation/prime31-kummer-doubling-twist-20261119
    paths:
      - ".github/workflows/prime31-kummer16-twist-permutation.yml"
      - "research/prime31_ic_20261115/native/examples/prime31_kummer16_twist_permutation.rs"
      - "research/prime31_ic_20261115/native/verify_prime31_kummer16_twist.py"
      - "research/prime31_ic_20261115/rr9/KUMMER16_TWIST_PERMUTATION_PROTOCOL_20261119.md"
  pull_request:
    paths:
      - ".github/workflows/prime31-kummer16-twist-permutation.yml"
      - "research/prime31_ic_20261115/native/examples/prime31_kummer16_twist_permutation.rs"
      - "research/prime31_ic_20261115/native/verify_prime31_kummer16_twist.py"
      - "research/prime31_ic_20261115/rr9/KUMMER16_TWIST_PERMUTATION_PROTOCOL_20261119.md"
permissions:
  contents: read
jobs:
  original-source-prime31:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact study source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned original Rust crate and curve
        uses: actions/checkout@v4
        with:
          repository: isogeny-labs/crypto
          ref: 1df714645aa683cf975bc76fcacb9842cb4780fd
          path: pinned
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Overlay ONLY the certificate example into the original Rust crate
        run: |
          mkdir -p pinned/research/prime31_ic_20261115/native/examples
          cp research/prime31_ic_20261115/native/examples/prime31_kummer16_twist_permutation.rs \
             pinned/research/prime31_ic_20261115/native/examples/prime31_kummer16_twist_permutation.rs
          echo "SOURCE $(git rev-parse HEAD)"
          sha256sum research/prime31_ic_20261115/native/examples/prime31_kummer16_twist_permutation.rs \
             research/prime31_ic_20261115/native/verify_prime31_kummer16_twist.py \
             research/prime31_ic_20261115/rr9/KUMMER16_TWIST_PERMUTATION_PROTOCOL_20261119.md
      - name: Original arithmetic library tests
        run: cargo +1.100.0 test --locked --release --manifest-path pinned/research/prime31_ic_20261115/native/Cargo.toml --lib
      - name: Focused rational-fibre Rust tests
        run: cargo +1.100.0 test --locked --release --manifest-path pinned/research/prime31_ic_20261115/native/Cargo.toml --example prime31_kummer16_twist_permutation
      - name: Produce exact original-curve/twist certificates
        run: |
          cargo +1.100.0 run --locked --release \
            --manifest-path pinned/research/prime31_ic_20261115/native/Cargo.toml \
            --example prime31_kummer16_twist_permutation \
            > prime31-kummer16-producer.json
          jq -e '.schema=="prime31.kummer16.rational_fibre.v1" and
                 .curve.p==2147483647 and .curve.order==2147446831 and
                 .twist.order==2147520465 and
                 .sample_counts.curve==512 and .sample_counts.twist==512 and
                 .sample_counts.factor_base==31 and
                 (.certificates|length)==64 and
                 .all_chain_and_inverse_assertions_passed==true and
                 .generic_sum_oracle_used==false and
                 .public_only_ecdlp_extractor==false and
                 .complete_ecdlp_solved==false and .pcc_verified==false' \
                 prime31-kummer16-producer.json
      - name: Independent BigInt group-law and deterministic-input replay
        run: |
          python3 research/prime31_ic_20261115/native/verify_prime31_kummer16_twist.py \
            prime31-kummer16-producer.json | tee prime31-kummer16-independent.json
          sha256sum prime31-kummer16-producer.json prime31-kummer16-independent.json \
            research/prime31_ic_20261115/native/examples/prime31_kummer16_twist_permutation.rs \
            research/prime31_ic_20261115/native/verify_prime31_kummer16_twist.py \
            research/prime31_ic_20261115/rr9/KUMMER16_TWIST_PERMUTATION_PROTOCOL_20261119.md \
            | tee sha256.txt
      - name: Upload complete source-linked evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime31-kummer16-rational-fibre-20261119
          path: |
            prime31-kummer16-producer.json
            prime31-kummer16-independent.json
            sha256.txt
          if-no-files-found: warn
