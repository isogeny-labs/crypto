name: Toy binary formula audit
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|toy-binary-formula-audit.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|toy-binary-formula-audit.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaustive bounded replay
        working-directory: research/toy_binary_formula_audit_20260924
        run: |
          python3 audit.py --output /tmp/binary-formula-replay.json
          cmp results.json /tmp/binary-formula-replay.json
      - name: Verify evidence hashes
        working-directory: research/toy_binary_formula_audit_20260924
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          receipt = json.loads(Path('receipt.json').read_text())
          for name, expected in receipt['source_input_hashes'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          PY
