name: curve-identities
on:
  pull_request:
    paths:
      - 'tools/curve_identity.py'
      - 'tools/export_benchmark_snapshot.py'
      - 'tests/test_curve_identity.py'
      - 'tests/test_benchmark_export.py'
      - 'scripts/build_curve_registry.py'
      - 'scripts/build_certicom_prime_sources.py'
      - 'scripts/test_generated_extension_curves.py'
      - 'examples/curve_id_generated.rs'
      - 'scripts/test_prime_model_normalization.py'
      - 'scripts/check_curve_names.py'
      - 'scripts/test_curve_names_archived_labels.py'
      - 'research/f4_f5_history_20261012/reports/run-20261012T0009Z/REPORT.md'
      - 'tools/isogeny-cli/src/bin/registry_models.rs'
      - 'isogeny_algos/src/field.rs'
      - 'docs/curves/sources/prime-models.json'
      - 'docs/curves/sources/certicom-prime-models.json'
      - 'docs/curves/sources/generated.json'
      - 'docs/curves/sources/specs.txt'
      - 'research/ext_endo_rho_20261023/sessions-a1/gls-fp2/records.jsonl'
      - 'research/ext_endo_rho_20261023/sessions-a1/subfield-fp3/records.jsonl'
      - 'research/certicom131_ic_program_20261020/pkm_ext/specs/SPEC-p30.json'
      - 'research/sparse_la_timing_20261018/specs/SPEC-fp4-p29.json'
      - 'research/sparse_la_timing_20261018/specs/SPEC-prime-scaling.json'
      - 'src/cryptanalysis/gaudry_quartic_d4.rs'
      - 'src/ecc/curve_zoo.rs'
      - 'research/isogeny_fibers_20261010/round4/16_7_agm_isogeny_oracles/out_seed7.json'
      - '.github/workflows/curve-identities.yml'
  push:
    branches: [main]
    paths:
      - 'tools/curve_identity.py'
      - 'tools/export_benchmark_snapshot.py'
      - 'tests/test_curve_identity.py'
      - 'tests/test_benchmark_export.py'
      - 'scripts/build_curve_registry.py'
      - 'scripts/build_certicom_prime_sources.py'
      - 'scripts/test_generated_extension_curves.py'
      - 'examples/curve_id_generated.rs'
      - 'scripts/test_prime_model_normalization.py'
      - 'scripts/check_curve_names.py'
      - 'scripts/test_curve_names_archived_labels.py'
      - 'research/f4_f5_history_20261012/reports/run-20261012T0009Z/REPORT.md'
      - 'tools/isogeny-cli/src/bin/registry_models.rs'
      - 'isogeny_algos/src/field.rs'
      - 'docs/curves/sources/prime-models.json'
      - 'docs/curves/sources/certicom-prime-models.json'
      - 'docs/curves/sources/generated.json'
      - 'docs/curves/sources/specs.txt'
      - 'research/ext_endo_rho_20261023/sessions-a1/gls-fp2/records.jsonl'
      - 'research/ext_endo_rho_20261023/sessions-a1/subfield-fp3/records.jsonl'
      - 'research/certicom131_ic_program_20261020/pkm_ext/specs/SPEC-p30.json'
      - 'research/sparse_la_timing_20261018/specs/SPEC-fp4-p29.json'
      - 'research/sparse_la_timing_20261018/specs/SPEC-prime-scaling.json'
      - 'src/cryptanalysis/gaudry_quartic_d4.rs'
      - 'src/ecc/curve_zoo.rs'
      - 'research/isogeny_fibers_20261010/round4/16_7_agm_isogeny_oracles/out_seed7.json'
      - '.github/workflows/curve-identities.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|curve-identities.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|curve-identities.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 360 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check metadata identities without running experiments
        run: |
          python tests/test_curve_identity.py
          python scripts/test_prime_model_normalization.py
          python scripts/test_curve_names_archived_labels.py
          python scripts/build_certicom_prime_sources.py --check
          python scripts/test_generated_extension_curves.py
