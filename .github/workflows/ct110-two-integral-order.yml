name: CT110 2-maximal line-field order
on:
  push:
    paths:
      - 'research/cross_characteristic_global_torsion_20261112/ct110/**'
      - '.github/workflows/ct110-two-integral-order.yml'
  pull_request:
    paths:
      - 'research/cross_characteristic_global_torsion_20261112/ct110/**'
      - '.github/workflows/ct110-two-integral-order.yml'
  workflow_dispatch:
jobs:
  certify-two-order:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/cross_characteristic_global_torsion_20261112/ct110
          persist-credentials: false
      - name: Exact Python and independently written BigInt JavaScript
        shell: bash
        run: |
          set -euo pipefail
          D=research/cross_characteristic_global_torsion_20261112/ct110
          python3 -B "$D/ct110_two_integral_order.py" >/tmp/ct110-py.json
          python3 -O -B "$D/ct110_two_integral_order.py" >/tmp/ct110-pyopt.json
          node "$D/ct110_two_integral_order_independent.js" >/tmp/ct110-js.json
          node --no-opt "$D/ct110_two_integral_order_independent.js" >/tmp/ct110-jsopt.json
          cmp /tmp/ct110-py.json /tmp/ct110-pyopt.json
          cmp /tmp/ct110-py.json /tmp/ct110-js.json
          cmp /tmp/ct110-py.json /tmp/ct110-jsopt.json
          printf '%s  %s\n' 3b0fcd1fee2f85aaa9d45bb30a446c44171b8e3bcdda14b5e55cbd9d11f4a /tmp/ct110-py.json | sha256sum -c
          cat /tmp/ct110-py.json
