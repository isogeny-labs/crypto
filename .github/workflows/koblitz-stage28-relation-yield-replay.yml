name: Koblitz Stage 28 relation-yield replay

on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  independent-replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|koblitz-stage28-relation-yield-replay.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|koblitz-stage28-relation-yield-replay.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build from the frozen dependency lock
        run: |
          cp research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-20-rust-build/Cargo.lock Cargo.lock
          bash .github/scripts/frozen-lock-source.sh
          cargo build --release --locked --example koblitz_stage21_independent_replay
      - name: Verify and independently replay all pairs
        run: |
          python3 scripts/verify_koblitz_stage28_relation_yield_replay.py
          python3 scripts/process_meter.py \
            --cwd "$GITHUB_WORKSPACE" \
            --timeout 600 \
            --stdout "$RUNNER_TEMP/stage28-replay.json" \
            --stderr "$RUNNER_TEMP/stage28-replay.stderr" \
            --metrics "$RUNNER_TEMP/stage28-replay.metrics.json" \
            -- target/release/examples/koblitz_stage21_independent_replay \
            research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-28-independent-relation-yield-replay-20260911/input-yield-result.json
          cmp "$RUNNER_TEMP/stage28-replay.json" research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-28-independent-relation-yield-replay-20260911/replay.json
