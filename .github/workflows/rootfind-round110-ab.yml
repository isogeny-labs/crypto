name: Rootfind round110 native Rust quartic A/B
on:
  push:
    branches:
      - automation/rootfind-column-accumulator-round89-20261121
    paths:
      - src/cryptanalysis/prime_root_trace.rs
      - research/amm_digit_perf_20261118/round110_ab.py
      - .github/workflows/rootfind-round110-ab.yml
  pull_request:
    branches:
      - main
    paths:
      - src/cryptanalysis/prime_root_trace.rs
      - research/amm_digit_perf_20261118/round110_ab.py
      - .github/workflows/rootfind-round110-ab.yml
  workflow_dispatch:
jobs:
  round110-source-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare frozen Round109 with Round110
        env:
          ROOTFIND_AB_TRIALS: "13"
          ROOTFIND_BASELINE_REF: 7d001ce370be2271222b3c7390b2c482878e2f82
        run: python3 research/amm_digit_perf_20261118/round110_ab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfind-round110-source-exact-results
          path: research/amm_digit_perf_20261118/round110_full_results.csv
          if-no-files-found: warn
