# Expensive work runs on schedule/manual dispatch; keep the push/PR queue short.
name: Polynomial reuse correctness
on:
  workflow_dispatch:
  schedule:
    - cron: '43 9 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      redis:
        image: redis:7.4.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo check --no-default-features --lib --bin ic
      - run: cargo test --release --features redis-cache --lib polynomial_reuse
      - run: cargo test --release --features redis-cache --lib algebra_cache
      # Quoted because a plain YAML scalar may not end in a colon: unquoted,
      # the `::` module filter makes the whole file unparseable and every run
      # of it a startup failure.
      - run: "cargo test --release --features redis-cache --lib koblitz_groebner::"
      - run: "cargo test --release --features redis-cache --lib weil_charts::"
      - run: "cargo test --release --features redis-cache --lib semaev_leading_form::"
      - run: cargo check --release --features redis-cache --example weil_factor_composition
      # The cost harnesses assert nothing and so cannot flake; they are run,
      # not just compiled, because a harness that builds but no longer
      # produces numbers is the failure worth catching. gb_probe takes its
      # default point only -- the Buchberger engine has no interrupt hook and
      # the next point up does not terminate.
      - run: cargo check --release --features redis-cache --example preprocessing_cost --example gb_probe
      - run: cargo run --release --features redis-cache --example preprocessing_cost
        env:
          IC_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      - run: cargo run --release --example gb_probe
      - run: cargo test --release --features redis-cache --lib redis_cross_client -- --ignored
        env:
          IC_TEST_REDIS_URL: redis://127.0.0.1:6379/0
