name: Weak curve Lean proofs
on:
  # Not a pull-request check. The merge set is gate, size, and artifacts.
  # This runs when the matching change is on main, or on its schedule.
  push:
    branches: [main]
    paths:
      - 'research/weak_curve_properties_lean_20261011/**'
      - 'research/weak_curve_properties_20261010/**'
      - 'docs/curves/weak-families/models.json'
      - '.github/workflows/weak-curve-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: research/weak_curve_properties_lean_20261011
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 research/weak_curve_properties_20261010 research/weak_curve_properties_lean_20261011
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify source and evidence pins
        run: |
          rustc --edition=2021 proof_check.rs -o /tmp/weak-curve-proof-check
          /tmp/weak-curve-proof-check --check
      - name: Build proofs and replay in a fresh kernel
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/weak_curve_properties_lean_20261011
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose WeakCurveProperties'
      - name: Audit every theorem's transitive axioms
        run: lake env lean AxiomAudit.lean
