name: Weak curve Lean proofs
on:
  pull_request:
    paths:
      - 'research/weak_curve_properties_lean_20261011/**'
      - 'research/weak_curve_properties_20261010/**'
      - 'docs/curves/weak-families/models.json'
      - '.github/workflows/weak-curve-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: research/weak_curve_properties_lean_20261011
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 docs/curves research/weak_curve_properties_20261010 research/weak_curve_properties_lean_20261011
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify source and evidence pins
        run: |
          rustc --edition=2021 proof_check.rs -o /tmp/weak-curve-proof-check
          /tmp/weak-curve-proof-check --check
      - name: Build proofs and replay in a fresh kernel
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/weak_curve_properties_lean_20261011
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose WeakCurveProperties'
      - name: Audit every theorem's transitive axioms
        run: lake env lean AxiomAudit.lean
