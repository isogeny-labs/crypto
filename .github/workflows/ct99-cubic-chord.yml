name: CT99 scalar-blind cubic chord orientation
on:
  push:
    paths:
      - "research/cross_characteristic_global_torsion_20261112/ct99/**"
      - ".github/workflows/ct99-cubic-chord.yml"
  pull_request:
    paths:
      - "research/cross_characteristic_global_torsion_20261112/ct99/**"
      - ".github/workflows/ct99-cubic-chord.yml"
  workflow_dispatch:
jobs:
  exact-chord:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned exact number-field dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Replay in four modes with independent binary group operation table
        shell: bash
        run: |
          set -euo pipefail
          D=research/cross_characteristic_global_torsion_20261112/ct99
          python -B "$D/ct99_cubic_chord_orientation.py" >/tmp/ct99-py.json
          python -O -B "$D/ct99_cubic_chord_orientation.py" >/tmp/ct99-pyopt.json
          node "$D/ct99_cubic_chord_independent.js" >/tmp/ct99-js.json
          node --no-opt "$D/ct99_cubic_chord_independent.js" >/tmp/ct99-jsopt.json
          cmp /tmp/ct99-py.json /tmp/ct99-pyopt.json
          cmp /tmp/ct99-py.json /tmp/ct99-js.json
          cmp /tmp/ct99-py.json /tmp/ct99-jsopt.json
          cat /tmp/ct99-py.json
          sha256sum /tmp/ct99-py.json
          # Actual arbitrary encoded public-input interface, not six scalar labels.
          python -B "$D/ct99_cubic_chord_orientation.py" --point 27,9 | grep -F '"target_y":[77,1]'
          python -B "$D/ct99_cubic_chord_orientation.py" --point 28,0 | grep -F '"target_y":[2879,1]'
          if python -B "$D/ct99_cubic_chord_orientation.py" --point 27,10 2>/dev/null; then
            echo 'invalid oriented point was accepted' >&2
            exit 1
          fi
          if python -B "$D/ct99_cubic_chord_orientation.py" --point 10,4 2>/dev/null; then
            echo 'nonmember point was accepted' >&2
            exit 1
          fi

