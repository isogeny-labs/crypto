name: Rootfinding Round124 trace-engine Barrett native Rust A/B
on:
  push:
    branches:
      - 'automation/radical-root-mersenne-sqrt-round114-20261122'
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  native-rust-trace-field:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round124_native_trace_ab.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Execute source-exact trace-field A/B benchmark and correctness checks
        run: |
          set -euo pipefail
          rustc --version
          python3 research/amm_digit_perf_20261118/round124_native_trace_ab.py | tee round124_native_rust.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfind-round124-native-rust
          path: round124_native_rust.csv
          if-no-files-found: warn
