name: ECC2K-130 leaf m10 support outcome replay

on:
  pull_request:
    paths:
      - '.github/workflows/ecc2k130-leaf-m10-outcome.yml'
      - 'research/notes/ecc2k130/leaf_m10_support_20260930/evidence/**'
      - 'research/notes/ecc2k130/leaf_m10_support_outcome_20260930/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push' }}

jobs:
  replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-leaf-m10-outcome.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-leaf-m10-outcome.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/notes/ecc2k130/leaf_m10_support_20260930
            research/notes/ecc2k130/leaf_m10_support_outcome_20260930
            research/notes/ecc2k130/m10_export_capacity_20260925/INPUT.json
            research/notes/ecc2k130/dual_all_lines_20260930/RESULT.json
            research/notes/ecc2k130/rotated_subspace_support_20260925/gate.py
            research/notes/ecc2k130/rotated_unequal_arity_20260925/verify.py
            research/ecc2k130_relations/fastfield.py
            research/ecc2k130_relations/relations.py
            .github/workflows/ecc2k130-leaf-m10-support.yml
            .github/workflows/ecc2k130-leaf-m10-outcome.yml
      - name: Verify every archived byte and source receipt
        run: |
          python3 research/notes/ecc2k130/leaf_m10_support_outcome_20260930/verify_archive.py
      - name: Recompute decision table from archived counts
        run: |
          python3 research/notes/ecc2k130/leaf_m10_support_outcome_20260930/analyze.py
          git diff --exit-code -- research/notes/ecc2k130/leaf_m10_support_outcome_20260930/ANALYSIS.json
      - name: Replay all 294912 rows and 264 point images again
        run: |
          # Replay against the exact historical workflow recorded by CONFIG and
          # FROZEN; current runner routing is not part of that archived input.
          source_commit=1f69d4b034a50abb2be4d724454f66d0327a4f56
          workflow=.github/workflows/ecc2k130-leaf-m10-support.yml
          git fetch --no-tags --depth=1 origin "$source_commit"
          git show "$source_commit:$workflow" > "$RUNNER_TEMP/leaf-m10-frozen-workflow.yml"
          echo '23d9704a830cb053ed85dd365e9d87b4be9d1d8d8397f7170f196baf24e3bed1  '"$RUNNER_TEMP/leaf-m10-frozen-workflow.yml" | sha256sum --check
          cp "$workflow" "$RUNNER_TEMP/leaf-m10-current-workflow.yml"
          trap 'cp "$RUNNER_TEMP/leaf-m10-current-workflow.yml" "$workflow"' EXIT
          cp "$RUNNER_TEMP/leaf-m10-frozen-workflow.yml" "$workflow"
          python3 research/notes/ecc2k130/leaf_m10_support_20260930/verify.py \
            --evidence research/notes/ecc2k130/leaf_m10_support_20260930/evidence \
            --out "${{ runner.temp }}/replay.json"
          cmp "${{ runner.temp }}/replay.json" \
            research/notes/ecc2k130/leaf_m10_support_20260930/evidence/replay.json
