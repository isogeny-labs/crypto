name: Prime31 run60 native shift-cost gate
on:
  push:
    branches:
      - research/prime31-f4-admission-run51-20261121
  pull_request:
    paths:
      - "research/prime31_ic_20261115/native/examples/prime31_run60_shift_floor.rs"
      - ".github/workflows/prime31-run60-shift-floor.yml"
  workflow_dispatch:

jobs:
  native-shift:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: research/prime31_ic_20261115/native
      - name: Run original Prime31 Rust arithmetic shift gate
        working-directory: research/prime31_ic_20261115/native
        run: cargo run --release --example prime31_run60_shift_floor
