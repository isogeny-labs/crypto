name: ECC2K130 rotated m5/m6 exporter semantic gate

on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:

jobs:
  frozen-semantic-replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-rotated-m56-export-gate.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-rotated-m56-export-gate.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/notes/ecc2k130
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check independently pinned freeze anchor
        run: echo "be1cd1db1556a4a36cb79040e576adcbb1b6829e3d34934876d4a427d90c3d8a  research/notes/ecc2k130/rotated_m56_export_gate_20260925/FROZEN.json" | sha256sum --check
      - name: Check frozen source, targets, and pre-outcome self-test
        run: python3 research/notes/ecc2k130/rotated_m56_export_gate_20260925/ci_replay.py
      - name: Re-enumerate committed exact semantic outcomes
        if: ${{ hashFiles('research/notes/ecc2k130/rotated_m56_export_gate_20260925/evidence/receipt.json') != '' }}
        run: python3 research/notes/ecc2k130/rotated_m56_export_gate_20260925/ci_replay.py --evidence research/notes/ecc2k130/rotated_m56_export_gate_20260925/evidence
