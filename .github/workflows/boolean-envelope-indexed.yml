name: Indexed Boolean support envelope
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
    inputs:
      phase:
        description: Qualified comparison phase
        required: true
        default: discovery
        type: choice
        options: [discovery, full]
permissions:
  contents: read
concurrency:
  group: boolean-envelope-indexed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  correctness:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|boolean-envelope-indexed.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|boolean-envelope-indexed.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/boolean_envelope_indexed_20261002 tools
      - uses: dtolnay/rust-toolchain@stable
      - name: Frozen math and compatibility controls
        run: |
          python3 tools/isolated_bench.py busy -- cargo test --locked --manifest-path research/boolean_envelope_indexed_20261002/Cargo.toml -- --test-threads=1
  qualified-discovery:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'discovery'
    needs: correctness
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      RAYON_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/boolean_envelope_indexed_20261002 tools
      - uses: dtolnay/rust-toolchain@stable
      - name: Native frozen discovery and resource replay
        run: bash research/boolean_envelope_indexed_20261002/run.sh discovery research/boolean_envelope_indexed_20261002/ci_discovery_${{ github.run_id }}_${{ github.run_attempt }}
      - name: Preserve successful or failed execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boolean-envelope-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/boolean_envelope_indexed_20261002/ci_discovery_${{ github.run_id }}_${{ github.run_attempt }}/
          if-no-files-found: error
  qualified-full:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'full'
    needs: correctness
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      RAYON_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/boolean_envelope_indexed_20261002 tools
      - uses: dtolnay/rust-toolchain@stable
      - name: Native fresh holdouts bound to qualified discovery
        run: bash research/boolean_envelope_indexed_20261002/run.sh full research/boolean_envelope_indexed_20261002/ci_full_${{ github.run_id }}_${{ github.run_attempt }} research/boolean_envelope_indexed_20261002/qualified_discovery_01
      - name: Preserve successful or failed execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boolean-envelope-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/boolean_envelope_indexed_20261002/ci_full_${{ github.run_id }}_${{ github.run_attempt }}/
          if-no-files-found: error
