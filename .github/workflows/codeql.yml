# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# The analyzed languages are the literal-named `Analyze (<language>)` jobs
# below (actions, c-cpp, javascript-typescript, python, rust). CodeQL supports
# 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript',
# 'python', 'ruby', 'rust' and 'swift'; add a language by adding a job with the
# same shape (scope output, fail-closed first step, `languages:` value).
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * 3'

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|codeql.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|codeql.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rust_root: ${{ steps.scope.outputs.rust_root }}
      rust_cd: ${{ steps.scope.outputs.rust_cd }}
      rust_fmt: ${{ steps.scope.outputs.rust_fmt }}
      release_rust: ${{ steps.scope.outputs.release_rust }}
      release_native: ${{ steps.scope.outputs.release_native }}
      release_cuda: ${{ steps.scope.outputs.release_cuda }}
      ecbench_replay: ${{ steps.scope.outputs.ecbench_replay }}
      actions: ${{ steps.scope.outputs.actions }}
      c_cpp: ${{ steps.scope.outputs.c_cpp }}
      javascript: ${{ steps.scope.outputs.javascript }}
      python: ${{ steps.scope.outputs.python }}
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /build.rs
            /rustfmt.toml
            /clippy.toml
            /rust-toolchain*
            /src/
            /tests/
            /examples/
            /benches/
            /experiments/koblitz-s3-pair-query-20261007-v4/baseline.rs
            /experiments/koblitz-s3-pair-query-20261007-v4/candidate.rs
      - id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Compare against the merge commit's first parent, not the event's
          # base SHA: when main has moved since the event, the base SHA makes
          # unrelated merged files look like this PR's changes and selects
          # checks the PR does not need. Fails closed if the checkout is not
          # the merge of the event's head.
          if [ "$CI_EVENT" = pull_request ]; then
            test "$(git rev-parse HEAD^2)" = "$CI_PR_HEAD"
            CI_BASE="$(git rev-parse HEAD^1)"
            export CI_BASE
          fi
          node .github/scripts/ci-scope.mjs

  # One literal-named job per language instead of a matrix. A job-level `if`
  # cannot read the `matrix` context, so the former matrix job had to start a
  # runner for every row (eight per PR, four of them identical Rust analyses)
  # only to skip every step. Literal jobs keep the check names
  # `Analyze (<language>)` and let a skipped language cost nothing.
  #
  # Each job still fails closed: if `scope` did not succeed the job runs and
  # its first step fails, instead of silently skipping validation. The four
  # non-Rust jobs depend only on `scope`, not on the Rust database pipeline.
  analyze-actions:
    name: Analyze (actions)
    if: always() && !cancelled() && github.event_name != 'workflow_dispatch' && (needs.scope.result != 'success' || needs.scope.outputs.actions != 'false')
    needs: scope
    # Routine events stay within the 25-minute PR budget; scheduled and
    # main-branch scans keep the former 60-minute cap.
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 25 || 60 }}
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read
    steps:
    - name: Require successful scope classification
      if: needs.scope.result != 'success'
      run: |
        echo '::error::CI scope or release metadata failed; refusing to skip validation.'
        exit 1
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: actions
        build-mode: none
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: /language:actions

  analyze-c-cpp:
    name: Analyze (c-cpp)
    if: always() && !cancelled() && github.event_name != 'workflow_dispatch' && (needs.scope.result != 'success' || needs.scope.outputs.c_cpp != 'false')
    needs: scope
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 25 || 60 }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
    - name: Require successful scope classification
      if: needs.scope.result != 'success'
      run: |
        echo '::error::CI scope or release metadata failed; refusing to skip validation.'
        exit 1
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: c-cpp
        build-mode: none
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: /language:c-cpp

  analyze-javascript-typescript:
    name: Analyze (javascript-typescript)
    if: always() && !cancelled() && github.event_name != 'workflow_dispatch' && (needs.scope.result != 'success' || needs.scope.outputs.javascript != 'false')
    needs: scope
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 25 || 60 }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
    - name: Require successful scope classification
      if: needs.scope.result != 'success'
      run: |
        echo '::error::CI scope or release metadata failed; refusing to skip validation.'
        exit 1
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: javascript-typescript
        build-mode: none
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: /language:javascript-typescript

  analyze-python:
    name: Analyze (python)
    if: always() && !cancelled() && github.event_name != 'workflow_dispatch' && (needs.scope.result != 'success' || needs.scope.outputs.python != 'false')
    needs: scope
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 25 || 60 }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
    - name: Require successful scope classification
      if: needs.scope.result != 'success'
      run: |
        echo '::error::CI scope or release metadata failed; refusing to skip validation.'
        exit 1
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: python
        build-mode: none
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: /language:python

  # Rust keeps the job id `analyze`: check-pr-budgets.py names (codeql.yml,
  # analyze) as its one 60-minute exception. This is one job, not four: the
  # former rust, rust-boolean, rust-research and rust-aux matrix rows all
  # checked out the same complete Rust source, ran the same analysis and, on
  # PRs and merge groups, uploaded the same `/language:rust` category (their
  # `rust_paths` partition was only read by the non-Rust checkout step). Pushes
  # and scheduled scans now upload the same `/language:rust` category too,
  # instead of four per-row categories holding duplicate alerts.
  analyze:
    if: always() && !cancelled() && github.event_name != 'workflow_dispatch' && (needs.scope.result != 'success' || needs.scope.outputs.rust != 'false')
    needs: [scope, build-rust-database, warm-rust-cache]
    # Routine Rust scans consume the database finalized by the first job and
    # the evaluation cache the second job warmed; queries retain this existing
    # job identity and /language:rust category.
    # The Rust queries over the whole repository outgrew the 25-minute routine
    # cap (cancelled at 25 minutes on several PRs, 2026-10-17), so every event
    # gets 60 minutes; check-pr-budgets.py names this job as its one exception.
    # The warmed cache leaves this job far below that cap on PRs.
    timeout-minutes: 60
    name: Analyze (rust)
    # Rust uses the standard public-repository ARM runner with the same four
    # CPUs and 16 GiB envelope; CodeQL provides a Linux arm64 bundle.
    runs-on: ubuntu-24.04-arm
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
    - name: Require successful scope classification
      if: needs.scope.result != 'success'
      run: |
        echo '::error::CI scope or release metadata failed; refusing to skip validation.'
        exit 1
    - name: Require the complete Rust database handoff
      if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && (needs.build-rust-database.result != 'success' || needs.warm-rust-cache.result != 'success')
      run: |
        echo '::error::Complete Rust database creation or cache warming failed; refusing incomplete analysis.'
        exit 1

    # The repository contains many research receipts that CodeQL does not
    # parse as Rust. Keep every tracked Rust source and Cargo manifest while
    # avoiding those unrelated blobs in the time-limited PR scan.
    - name: Checkout complete Rust source
      uses: actions/checkout@v7
      with:
        filter: blob:none
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*.rs
          /**/*.rs
          /Cargo.toml
          /tools/volcano-cli/
          /isogeny_algos/
          /Cargo.lock
          /**/Cargo.toml
          /**/Cargo.lock
          /rust-toolchain*
          /.cargo/**

    - name: Prove complete Rust source coverage
      shell: bash
      run: |
        python3 - <<'PY'
        import os
        import subprocess

        paths = subprocess.check_output(
            ["git", "ls-tree", "-r", "-z", "--name-only", "HEAD"]
        ).decode().split("\0")
        required = [
            path for path in paths
            if path.endswith(".rs")
            or path == "Cargo.toml" or path.endswith("/Cargo.toml")
            or path == "Cargo.lock" or path.endswith("/Cargo.lock")
        ]
        missing = [path for path in required if not os.path.lexists(path)]
        if missing:
            raise SystemExit("Rust CodeQL checkout omitted source: " +
                             ", ".join(missing[:20]))
        print(f"Rust CodeQL checkout includes all {len(required)} "
              "tracked Rust sources and Cargo manifests")
        PY

    # Push and scheduled scans build, finalize and query in this one job.
    - name: Initialize CodeQL
      if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
      uses: github/codeql-action/init@v4
      with:
        languages: rust
        build-mode: none
    - name: Perform CodeQL Analysis
      if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
      uses: github/codeql-action/analyze@v4
      with:
        category: /language:rust

    # PRs and merge groups query the database the two upstream jobs built.
    - name: Set up CodeQL for the finalized Rust database
      id: rust-tools
      if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
      uses: github/codeql-action/setup-codeql@v4
      with:
        languages: rust
    - name: Download this workflow attempt's warmed database
      if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
      uses: actions/download-artifact@v4
      with:
        name: rust-codeql-warm-db-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/rust-codeql-handoff/
    - name: Verify handoff and run its complete query configuration
      if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
      shell: bash
      env:
        CODEQL_CLI: ${{ steps.rust-tools.outputs.codeql-path }}
        CODEQL_VERSION: ${{ steps.rust-tools.outputs.codeql-version }}
      run: |
        set -euo pipefail
        handoff_dir="$RUNNER_TEMP/rust-codeql-handoff"
        cd "$handoff_dir"
        sha256sum --check rust-db.zip.sha256
        test "$(cat source-sha.txt)" = "$GITHUB_SHA"
        test "$(cat codeql-version.txt)" = "$CODEQL_VERSION"
        "$CODEQL_CLI" database unbundle --target="$RUNNER_TEMP/rust-query-db" rust-db.zip
        # With no query override, CodeQL uses the configuration retained at
        # database creation. The relocatable bundle includes generated suites
        # and the warmed cache, so shared type inference is not re-evaluated.
        "$CODEQL_CLI" database analyze "$RUNNER_TEMP/rust-query-db/rust" \
          --format=sarifv2.1.0 --output="$RUNNER_TEMP/rust.sarif" \
          --sarif-category=/language:rust --threads=4 --ram=14000 \
          --expect-discarded-cache --min-disk-free=1024
    - name: Upload complete Rust analysis
      if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ runner.temp }}/rust.sarif
        category: /language:rust
        wait-for-processing: true

  build-rust-database:
    name: Build database (rust)
    if: needs.scope.outputs.rust != 'false' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: scope
    timeout-minutes: 25
    runs-on: ubuntu-24.04-arm
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout complete Rust source
        uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.rs
            /**/*.rs
            /Cargo.toml
            /tools/volcano-cli/
            /isogeny_algos/
            /Cargo.lock
            /**/Cargo.toml
            /**/Cargo.lock
            /rust-toolchain*
            /.cargo/**

      - name: Prove complete Rust source coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          paths = subprocess.check_output(
              ["git", "ls-tree", "-r", "-z", "--name-only", "HEAD"]
          ).decode().split("\0")
          required = [
              path for path in paths
              if path.endswith(".rs")
              or path == "Cargo.toml" or path.endswith("/Cargo.toml")
              or path == "Cargo.lock" or path.endswith("/Cargo.lock")
          ]
          missing = [path for path in required if not os.path.lexists(path)]
          if missing:
              raise SystemExit("Rust CodeQL checkout omitted source: " +
                               ", ".join(missing[:20]))
          print(f"Rust CodeQL checkout includes all {len(required)} "
                "tracked Rust sources and Cargo manifests")
          PY
      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
      - name: Finalize the complete Rust database
        id: analysis
        uses: github/codeql-action/analyze@v4
        with:
          skip-queries: true
          category: /language:rust
      - name: Bundle complete Rust database for the query job
        shell: bash
        env:
          CODEQL_CLI: ${{ steps.init.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.init.outputs.codeql-version }}
          RUST_DATABASE: ${{ fromJSON(steps.analysis.outputs.db-locations).rust }}
        run: |
          set -euo pipefail
          handoff_dir="$RUNNER_TEMP/rust-codeql-handoff"
          mkdir "$handoff_dir"
          test -n "$CODEQL_VERSION"
          test -n "$RUST_DATABASE"
          "$CODEQL_CLI" database bundle --include-temp --include-diagnostics \
            --output="$handoff_dir/rust-db.zip" --name=rust "$RUST_DATABASE"
          printf '%s\n' "$GITHUB_SHA" > "$handoff_dir/source-sha.txt"
          printf '%s\n' "$CODEQL_VERSION" > "$handoff_dir/codeql-version.txt"
          cd "$handoff_dir"
          sha256sum rust-db.zip > rust-db.zip.sha256

      - name: Retain immutable Rust database handoff
        uses: actions/upload-artifact@v4
        with:
          name: rust-codeql-db-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-codeql-handoff/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Rust type inference is about two thirds of the query phase's evaluation
  # time and every query depends on it, so splitting the query suite does not
  # shorten any job. This job evaluates the one diagnostic query that forces
  # type inference, to completion, and hands the trimmed evaluation cache to
  # the query job inside the database bundle. An interrupted evaluation leaves
  # no reusable cache, so the phase must finish within its own budget.
  warm-rust-cache:
    name: Warm cache (rust)
    if: needs.scope.outputs.rust != 'false' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: [scope, build-rust-database]
    # Type inference over the merged tree passed 25 minutes on 2026-10-19
    # (run 39226121956 was cancelled mid-evaluation); 45 leaves headroom.
    # check-pr-budgets.py names this job as a budget exception.
    timeout-minutes: 45
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: read
      actions: read
      contents: read
    steps:
      - name: Set up CodeQL for the finalized Rust database
        id: rust-tools
        uses: github/codeql-action/setup-codeql@v4
        with:
          languages: rust
      - name: Download this workflow attempt's finalized database
        uses: actions/download-artifact@v4
        with:
          name: rust-codeql-db-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-codeql-handoff/
      - name: Verify handoff and evaluate type inference to completion
        shell: bash
        env:
          CODEQL_CLI: ${{ steps.rust-tools.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.rust-tools.outputs.codeql-version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rust-codeql-handoff"
          sha256sum --check rust-db.zip.sha256
          test "$(cat source-sha.txt)" = "$GITHUB_SHA"
          test "$(cat codeql-version.txt)" = "$CODEQL_VERSION"
          "$CODEQL_CLI" database unbundle --target="$RUNNER_TEMP/rust-warm-db" rust-db.zip
          db="$RUNNER_TEMP/rust-warm-db/rust"
          "$CODEQL_CLI" database run-queries "$db" \
            codeql/rust-queries:queries/diagnostics/TypeInferenceConsistencyCounts.ql \
            --threads=4 --ram=14000 --min-disk-free=1024
          # Keep the cached predicates; drop intermediates and this query's
          # results so the query job evaluates every query itself.
          "$CODEQL_CLI" database cleanup "$db" --cache-cleanup=trim
          rm -rf "$db/results"
          du -sh "$db/db-rust/default/cache"
          out="$RUNNER_TEMP/rust-codeql-warm"
          mkdir "$out"
          "$CODEQL_CLI" database bundle --include-temp --include-diagnostics \
            --include=db-rust/default/cache \
            --output="$out/rust-db.zip" --name=rust "$db"
          printf '%s\n' "$GITHUB_SHA" > "$out/source-sha.txt"
          printf '%s\n' "$CODEQL_VERSION" > "$out/codeql-version.txt"
          cd "$out"
          sha256sum rust-db.zip > rust-db.zip.sha256
      - name: Retain immutable warmed Rust database handoff
        uses: actions/upload-artifact@v4
        with:
          name: rust-codeql-warm-db-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-codeql-warm/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  analyze-rust-long:
    if: github.event_name == 'workflow_dispatch'
    needs: scope
    timeout-minutes: 60
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|codeql.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|codeql.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Require successful scope classification
        if: needs.scope.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust-long"
