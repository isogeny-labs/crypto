name: Graph-IC GainDsu source-bound native test

on:
  pull_request:
    paths:
      - src/cryptanalysis/large_prime_graph.rs
      - tests/large_prime_graph.rs
      - research/lp_graph_algorithms_20261123/native_gain_dsu/**
      - .github/workflows/graph-ic-gain-dsu-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-exact-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Record source identities
        shell: bash
        run: |
          git rev-parse HEAD
          rustc --version
          sha256sum src/cryptanalysis/large_prime_graph.rs src/cryptanalysis/large_prime_filter.rs src/cryptanalysis/large_prime_filter_mst.rs tests/large_prime_graph.rs
      - name: Native exact-source graph integration tests
        shell: bash
        run: |
          cargo test --manifest-path research/lp_graph_algorithms_20261123/native_gain_dsu/Cargo.toml --test large_prime_graph --release -- --nocapture
