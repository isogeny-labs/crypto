  workflow_dispatch:

permissions:
  contents: read

# This workflow runs on main pushes and manual dispatches.
# Give each validation its own group so concurrent runs stay independent.
concurrency:
  group: ${{ format('run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  current:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ic-leaderboard.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ic-leaderboard.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 docs/curves research/bitop_ladder_20261019 research/f4_fp_ic_effect_20261018 research/five_leads_e2e_20261019/sessions_projective_chart_v2.tar.zst research/four_followups_20261021/results/pencil-pilot research/hec_bitop_20261020 research/ic_aimed_gather_20261023 research/ic_cover_weakclass_20261023 research/ic_d4_char2_lever_20261023 research/kummer_coordinates_20261022 research/kummer_differential_collector_20261022 research/n83_e2e_finalist_results_20261017 research/pencil_sparse_20261022 research/postgb_linear_stage_20261026 research/prime_base_oracle_tuning_20261029 research/projective_law_followup_20261022 research/quartic_n4_20261019 research/quartic_n4v2_20261020 research/three_leads_e2e_20261018/results research/twist_index_calculus_20261020 research/validation_sweep_20261019
      - name: Curve search, priced rows, sources and timeline agree (AGENTS.md §7d)
        run: node scripts/check_ic_dashboard_coverage.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: The path check's own tests
        run: python3 scripts/test_check_ic_leaderboard_paths.py
      - name: Sparse engineering component evidence inputs
        run: python3 scripts/test_leaderboard_sparse_component_inputs.py
      - name: Curve-record parser tests
        run: python3 scripts/test_build_ic_leaderboard.py
      - name: This workflow's path filter covers every file the builder reads
        run: python3 scripts/check_ic_leaderboard_paths.py
      - name: The leaderboard is current with its sources and the ledger
        run: python3 scripts/build_ic_leaderboard.py --check
      - name: The lab browser's index is current with the registry, sessions and rounds (AGENTS.md §7c)
        run: python3 scripts/build_lab_browser.py --check
