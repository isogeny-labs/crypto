name: ECC2K-130 degree-263 kernel order certificate
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-263-order-certificate.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-263-order-certificate.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay independent direction and cost certificate
        run: python3 research/ecc2k130_endo_ring_263_20260925/certificate.py --out /tmp/endo_ring_263_replay.json
      - name: Compare exact claims and operation counts
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          frozen = json.loads(Path('research/ecc2k130_endo_ring_263_20260925/receipt.json').read_text())
          fresh = json.loads(Path('/tmp/endo_ring_263_replay.json').read_text())
          assert frozen['status'] == fresh['status'] == 'PASS'
          for key in ('source_sha256', 'input_sha256', 'deterministic_sha256'):
              assert fresh[key] == frozen[key], key
          assert fresh['exact']['least_non_scalar_leaf_endomorphism_degree'] == 121046
          PYCODE
