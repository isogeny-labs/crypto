name: Semaev complete-sector polynomial gates

on:
  pull_request:
    paths:
      - 'summation_split/sector_complete.py'
      - 'summation_split/test_sector_complete.py'
      - 'summation_split/sector.py'
      - 'summation_split/core.py'
      - '.github/workflows/semaev-complete-charts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-fp-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'sympy==1.13.3'
      - name: Exact Fp resultants and complete polynomial witnesses
        run: PYTHONPATH=. python -m unittest -q summation_split.test_sector_complete
