name: Rootfind round101 verified division reuse A/B
on:
  push:
    branches:
      - 'automation/rootfind-column-accumulator-round89-20261121'
    paths:
      - 'src/cryptanalysis/prime_root_trace.rs'
      - 'research/amm_digit_perf_20261118/round101_full_ab.py'
      - '.github/workflows/rootfind-round101-division-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  round101-source-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round101_full_ab.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Frozen Round100 versus Round101 source-exact solve and verifier-only replay
        env:
          ROOTFIND_BASELINE_REF: ec848c0dd2ca25730e4f14276002219569cdcfb4
          ROOTFIND_AB_OUTPUT: research/amm_digit_perf_20261118/round101_division_cache_results.csv
        run: python3 research/amm_digit_perf_20261118/round101_full_ab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfind-round101-division-cache-ab
          path: research/amm_digit_perf_20261118/round101_division_cache_results.csv
