name: Boolean F4 bitmap membership experiment

on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# PRs retain source, correctness and existing-evidence checks.
# Fresh timing panels and their result gates run only after merge or by manual dispatch.
jobs:
  exact-output-and-paired-build:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|boolean-f4-bitmap.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|boolean-f4-bitmap.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 60 }}
    env:
      RAYON_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98'
      - uses: Swatinem/rust-cache@v2
      - name: Boolean F4 reference tests
        run: F4_F2_BITMAP_SEEN=0 cargo test --release --lib cryptanalysis::pq_f4_f2::tests -- --test-threads=1
      - name: Boolean F4 bitmap tests
        run: F4_F2_BITMAP_SEEN=1 cargo test --release --lib cryptanalysis::pq_f4_f2::tests -- --test-threads=1
      - name: Build frozen Boolean F4 benchmark
        run: cargo build --release --example f4_f2_bench
      - name: Five A/A and five paired A/B samples per workload
        if: github.event_name != 'pull_request'
        run: |
          python3 research/boolean_f4_bitmap_20260926/paired_boolean_f4.py \
            target/release/examples/f4_f2_bench \
            research/boolean_f4_bitmap_20260926/ci-result.json \
            --pairs 5 --threads 1
      - name: Four-thread paired control
        if: github.event_name != 'pull_request'
        run: |
          python3 research/boolean_f4_bitmap_20260926/paired_boolean_f4.py \
            target/release/examples/f4_f2_bench \
            research/boolean_f4_bitmap_20260926/ci-result-threads4.json \
            --pairs 5 --threads 4
      - name: Preserve raw runs and failures
        if: github.event_name != 'pull_request' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: boolean-f4-bitmap-${{ github.sha }}
          path: |
            research/boolean_f4_bitmap_20260926/ci-result.json
            research/boolean_f4_bitmap_20260926/ci-result-threads4.json
          if-no-files-found: warn
