name: Lean proof gate
# Builds every Lean target in the repository and audits each theorem's
# transitive axioms (tools/lean/proof-gate.sh, tools/lean/AuditAxioms.lean).
# Fails on `sorry`, unlisted `native_decide`, user axioms, a build failure, or a
# target with no theorems. Reviewed `native_decide` uses live in
# tools/lean/trusted-native.txt and are reported as TRUST.
# AGENTS.md "Mathematical results should include Lean proofs".
on:
  # Not a pull-request check. The merge set is gate, size, and artifacts.
  # This runs when the matching change reaches main, or on demand.
  push:
    branches: [main]
    paths:
      - '**/*.lean'
      - '**/lakefile.toml'
      - '**/lakefile.lean'
      - '**/lean-toolchain'
      - '**/lake-manifest.json'
      - 'tools/lean/**'
      - '.github/workflows/lean-proof-gate.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for this manual proof audit
        type: choice
        options: [configured, github-hosted]
        default: configured

permissions:
  contents: read
env:
  # Every tracked proof and Lake context, without unrelated research archives.
  LEAN_CHECKOUT: |
    *.lean
    lakefile.toml
    lake-manifest.json
    lean-toolchain
    /tools/lean/
    /.github/workflows/lean-proof-gate.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'github-hosted' && '-hosted' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selftest:
    # Known-good and known-bad fixtures: the gate must pass and fail them
    # exactly as expected, so it is exercised even with no proofs in the repo.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner == 'github-hosted' && 'ubuntu-latest') || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|lean-proof-gate.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|lean-proof-gate.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: [pinned, 'leanprover/lean4:v4.19.0']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ env.LEAN_CHECKOUT }}
      - name: Install elan
        run: |
          toolchain='${{ matrix.toolchain }}'
          if [ "$toolchain" = pinned ]; then toolchain=$(cat tools/lean/lean-toolchain); fi
          curl --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 120 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          for attempt in 1 2 3; do
            if sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain "$toolchain"; then break; fi
            if [ "$attempt" -eq 3 ]; then echo '::error::elan installation failed after three attempts'; exit 3; fi
            sleep 5
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - run: bash tools/lean/selftest/run.sh

  discover:
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner == 'github-hosted' && 'ubuntu-latest') || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|lean-proof-gate.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|lean-proof-gate.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      indexes: ${{ steps.list.outputs.indexes }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ env.LEAN_CHECKOUT }}
      - id: list
        run: |
          python3 tools/lean/test_ci_targets.py
          python3 tools/lean/test_checkout_coverage.py
          indexes=$(python3 tools/lean/ci-targets.py matrix)
          echo "indexes=$indexes" >> "$GITHUB_OUTPUT"
          tools/lean/proof-gate.sh --list | grep . || echo "no Lean targets in this repository yet; only the self-test runs"

  prove:
    needs: discover
    if: ${{ needs.discover.outputs.indexes != '[]' }}
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner == 'github-hosted' && 'ubuntu-latest') || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|lean-proof-gate.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|lean-proof-gate.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Avoid a simultaneous toolchain download from every target runner.
      max-parallel: 8
      matrix:
        index: ${{ fromJson(needs.discover.outputs.indexes) }}
    name: Lean target batch ${{ matrix.index }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ env.LEAN_CHECKOUT }}
      - name: Install elan
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 120 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          for attempt in 1 2 3; do
            if sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none; then break; fi
            if [ "$attempt" -eq 3 ]; then echo '::error::elan installation failed after three attempts'; exit 3; fi
            sleep 5
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit
        env:
          TARGET_INDEX: ${{ matrix.index }}
        run: |
          python3 tools/lean/ci-targets.py batch "$TARGET_INDEX" > "$RUNNER_TEMP/batch-targets.txt"
          rc_any=0
          while IFS= read -r target; do
            printf 'Lean target in batch %s: %s\n' "$TARGET_INDEX" "$target"
            pin="$target/lean-toolchain"
            if [[ "$target" == *.lean ]]; then pin="$(dirname "$target")/lean-toolchain"; fi
            if [ -f "$pin" ]; then toolchain="$(cat "$pin")"; else toolchain="$(cat tools/lean/lean-toolchain)"; fi
            installed=0
            for attempt in 1 2 3; do
              if elan default "$toolchain"; then installed=1; break; fi
              sleep 5
            done
            if [ "$installed" -eq 0 ]; then
              echo "::error::Lean toolchain download failed after three attempts: $target"
              rc_any=3
              continue
            fi
            set +e
            tools/lean/proof-gate.sh --out receipts "$target"
            rc=$?
            set -e
            if [ "$rc" -eq 3 ]; then echo "::error::infrastructure failure: $target"; rc_any=3; fi
            if [ "$rc" -ne 0 ] && [ "$rc_any" -eq 0 ]; then rc_any=1; fi
          done < "$RUNNER_TEMP/batch-targets.txt"
          exit "$rc_any"
      - name: Keep receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-receipts-${{ strategy.job-index }}
          path: receipts
          if-no-files-found: ignore
