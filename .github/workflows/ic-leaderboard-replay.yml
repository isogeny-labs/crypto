name: ic-leaderboard-replay

# Replay of every session the IC leaderboard cites, against docs/ic/validation/replay-plan.json
# (docs/VALIDATION_GATE.md, "Keeping the board rigorous and current").  Unlike audit-runs-daily, which draws a
# nonce sample of all sessions, this lane is the fixed list the board depends on, and it compares each outcome
# with what the plan says: new drift, healed drift and a cited session missing from the plan all fail.  A hosted
# runner is a shared VM; the replay checks counts and answers, never wall time.

on:
  push:
    branches: [main]
    paths:
      - 'docs/ic/**'
      - 'scripts/ic_audit/**'
      - '.github/workflows/ic-leaderboard-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ic-leaderboard-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ic-leaderboard-replay.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ic-leaderboard-replay.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Replay gate rejects missing inputs and invalid receipts
        run: bash scripts/ic_audit/test_replay_checks.sh
      - name: Pull only frozen inputs read by the native replay
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            "$RUNNER_TEMP/artifacts-awscli/bin/python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$RUNNER_TEMP/artifacts-awscli/bin/aws"
          fi
          # The second pass discovers hash-bound stderr attachments from the
          # records hydrated by the first. Never pull the whole research tree.
          for replay_pass in core attachments; do
            bash scripts/ic_audit/check_plan_coverage.sh --list-inputs > "$RUNNER_TEMP/replay-$replay_pass-inputs.txt"
            mapfile -t replay_inputs < "$RUNNER_TEMP/replay-$replay_pass-inputs.txt"
            test "${#replay_inputs[@]}" -gt 0
            python3 tools/artifacts/artifacts.py pull --jobs 16 "${replay_inputs[@]}"
          done
      - run: cargo build --release --bin ecbench
      - name: The plan covers every complete session the board cites
        run: bash scripts/ic_audit/check_plan_coverage.sh
      - name: Replay the plan
        run: bash scripts/ic_audit/replay_plan.sh ./target/release/ecbench "$RUNNER_TEMP/ic-replay"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ic-leaderboard-replay-receipts
          path: ${{ runner.temp }}/ic-replay
