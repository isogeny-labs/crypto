name: Curve algebra fixtures
on:
  pull_request:
    paths:
      - '.agents/skills/curve-algebra/**'
      - '.github/workflows/curve-algebra.yml'
  push:
    branches: [main]
    paths:
      - '.agents/skills/curve-algebra/**'
      - '.github/workflows/curve-algebra.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-examples:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|curve-algebra.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|curve-algebra.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 360 }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile native algebraic verifier
        run: c++ -std=c++17 -O2 -Wall -Wextra -Werror .agents/skills/curve-algebra/scripts/verify_examples.cpp -o /tmp/curve-algebra-check
      - name: Verify both exact examples
        run: /tmp/curve-algebra-check
