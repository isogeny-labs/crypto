name: synthetic performance studies
on:
  pull_request:
    paths:
      - "research/synthetic_performance/**"
      - ".github/workflows/synthetic-performance.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|synthetic-performance.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|synthetic-performance.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/synthetic_performance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Correctness, censoring, and real child failure tests
        run: python -m unittest discover -s research/synthetic_performance -v
      - name: Synthetic smoke run (no performance threshold in shared CI)
        run: python research/synthetic_performance/study.py --output /tmp/synthetic-study-smoke --trials 8 --arithmetic-trials 4 --count 256
      - name: Verify receipts and regenerate report
        run: python research/synthetic_performance/report.py /tmp/synthetic-study-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-study-smoke
          path: /tmp/synthetic-study-smoke
