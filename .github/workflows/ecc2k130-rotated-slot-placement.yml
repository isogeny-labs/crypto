name: ECC2K130 rotated slot placement

on:
  pull_request:
    paths:
      - 'research/notes/ecc2k130/rotated_slot_placement_20260925/**'
      - 'research/notes/ecc2k130/rotated_pdp_corpus_20260925/**'
      - 'research/notes/ecc2k130/rotated_subspace_support_20260925/**'
      - '.github/workflows/ecc2k130-rotated-slot-placement.yml'
  push:
    branches: [main]
    paths:
      - 'research/notes/ecc2k130/rotated_slot_placement_20260925/**'
      - 'research/notes/ecc2k130/rotated_pdp_corpus_20260925/**'
      - 'research/notes/ecc2k130/rotated_subspace_support_20260925/**'
      - '.github/workflows/ecc2k130-rotated-slot-placement.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push' }}

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && (20) || 15 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check frozen source and parent hashes without new outcome
        run: python3 research/notes/ecc2k130/rotated_slot_placement_20260925/ci_replay.py
      - name: Replay complete evidence when committed
        shell: bash
        run: |
          if test -f research/notes/ecc2k130/rotated_slot_placement_20260925/evidence/receipt.json; then
            python3 research/notes/ecc2k130/rotated_slot_placement_20260925/ci_replay.py --evidence research/notes/ecc2k130/rotated_slot_placement_20260925/evidence
          fi
