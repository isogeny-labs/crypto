name: Quadratic twist signed point cache native replay

on:
  pull_request:
    paths:
      - 'research/quadratic_twist_evidence_20261021/**'
      - '.github/workflows/quadratic-twist-signed-cache.yml'
      - 'src/cryptanalysis/identity_certificate.rs'
      - 'src/hash/sha256.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-signed-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/quadratic_twist_evidence_20261021/
            /src/hash/sha256.rs
            /src/cryptanalysis/identity_certificate.rs
            /docs/identity-certificates/schoenhage-10mult.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ libssl-dev jq ripgrep
      - name: Replay reference and setup-charged cached sign lifting with independent arithmetic
        run: bash research/quadratic_twist_evidence_20261021/run-signed-cache.sh "$RUNNER_TEMP/twist-signed-cache"
      - name: Upload complete native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadratic-twist-signed-cache
          path: ${{ runner.temp }}/twist-signed-cache/
          if-no-files-found: error
