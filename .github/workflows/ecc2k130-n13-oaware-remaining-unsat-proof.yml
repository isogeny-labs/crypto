name: ECC2K130 n13 remaining O-aware UNSAT proofs

on:
  # Not a pull-request check. The merge set is gate, size, and artifacts.
  # This runs when the matching change is on main, or on its schedule.
  push:
    branches: [main]
    paths:
      - 'research/notes/ecc2k130/n13_oaware_remaining_unsat_proof_20260925/**'
      - '.github/workflows/ecc2k130-n13-oaware-remaining-unsat-proof.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 30 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Hash-only frozen parent and 22-query preflight
        run: python3 research/notes/ecc2k130/n13_oaware_remaining_unsat_proof_20260925/ci_replay.py
      - name: Independently replay committed DRAT certificates when present
        shell: bash
        run: |
          if test -f research/notes/ecc2k130/n13_oaware_remaining_unsat_proof_20260925/evidence/receipt.json; then
            python3 research/notes/ecc2k130/n13_oaware_remaining_unsat_proof_20260925/ci_replay.py --evidence research/notes/ecc2k130/n13_oaware_remaining_unsat_proof_20260925/evidence
          fi
