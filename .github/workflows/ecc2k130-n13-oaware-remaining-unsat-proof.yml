name: ECC2K130 n13 remaining O-aware UNSAT proofs

on:
  pull_request:
    paths:
      - 'research/notes/ecc2k130/n13_oaware_remaining_unsat_proof_20260925/**'
      - 'research/notes/ecc2k130/n13_oaware_unsat_proof_20260925/**'
      - 'research/notes/ecc2k130/n13_oaware_sat_benchmark_20260925/**'
      - 'research/notes/ecc2k130/rotated_s3_o_branch_20260925/**'
      - '.github/workflows/ecc2k130-n13-oaware-remaining-unsat-proof.yml'
  push:
    branches: [main]
    paths:
      - 'research/notes/ecc2k130/n13_oaware_remaining_unsat_proof_20260925/**'
      - '.github/workflows/ecc2k130-n13-oaware-remaining-unsat-proof.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-n13-oaware-remaining-unsat-proof.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-n13-oaware-remaining-unsat-proof.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 30 }}
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/notes/ecc2k130
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Hash-only frozen parent and 22-query preflight
        run: python3 research/notes/ecc2k130/n13_oaware_remaining_unsat_proof_20260925/ci_replay.py
      - name: Independently replay committed DRAT certificates when present
        shell: bash
        run: |
          if test -f research/notes/ecc2k130/n13_oaware_remaining_unsat_proof_20260925/evidence/receipt.json; then
            python3 research/notes/ecc2k130/n13_oaware_remaining_unsat_proof_20260925/ci_replay.py --evidence research/notes/ecc2k130/n13_oaware_remaining_unsat_proof_20260925/evidence
          fi
