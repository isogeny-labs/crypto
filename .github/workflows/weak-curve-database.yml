name: Weak curve evidence database
on:
  pull_request:
    paths:
      - 'research/weak_curve_database_20261012/**'
      - 'research/weak_curve_leaderboard_20261012/**'
      - 'research/p192_extension_cover_20261012/**'
      - 'docs/curves/weak-families/catalog.json'
      - 'docs/curves/weak-families/models.json'
      - 'docs/curves/weak-families/properties.json'
      - 'research/weak_curve_conjectures_20261012/conjectures.json'
      - 'research/iso1_weak_classes_20261007/two_branch_20261009/p*_classes.csv'
      - 'research/iso1_weak_classes_20261007/p41_twist_derived.csv'
      - 'research/iso1_weak_classes_20261007/p43_twist_derived.csv'
      - 'research/iso1_weak_classes_20261007/p47_orbit.csv'
      - 'examples/weak_curve_cubic_identity.rs'
      - '.github/workflows/weak-curve-database.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 30 || 25 }}
    defaults:
      run:
        working-directory: research/weak_curve_database_20261012
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check source-locked database and graph
        run: |
          cargo test --release --locked
          cargo run --release --locked -- check
          test -s REPORT.pdf
          test -s class_counts.png
      - name: Replay algebraic identity certificate
        working-directory: .
        run: cargo run --release --example weak_curve_cubic_identity -- check research/weak_curve_database_20261012/cubic_identity.certificate.json
      - name: Check WeakCurves catalog and genus-128 GHS model audit
        working-directory: research/weak_curve_leaderboard_20261012
        run: |
          cargo test --release --locked
          cargo run --release --locked -- check snapshot.json
          cargo run --release --locked --bin ghs_genus128_cost_audit -- --check
          python3 validate_attack_map.py
          python3 validate_decomposition_properties.py
      - name: Verify WeakCurves artifact hashes
        working-directory: .
        run: |
          grep -Ev '  \.github/workflows/weak-curve-database\.yml$' research/weak_curve_leaderboard_20261012/ARTIFACTS.sha256 | sha256sum -c -
      - name: Verify P-192 research artifact hashes
        working-directory: research/p192_extension_cover_20261012
        run: |
          grep -Ev '  (\.gitattributes|lean/lakefile\.toml)$' ARTIFACTS.sha256 | sha256sum -c -
      - name: Verify P-192 divisor-support custody and nonspeciality receipt
        working-directory: .
        run: |
          python3 research/p192_extension_cover_20261012/verify_divisor_support_receipt.py research/p192_extension_cover_20261012/type_i_fixed_origin_reduction.json research/p192_extension_cover_20261012/type_i_negative_fixed_origin_reduction.json research/p192_extension_cover_20261012/type_i_guided_negative_fixed_origin_reduction.json research/p192_extension_cover_20261012/type_i_divisor_support.json research/p192_extension_cover_20261012/type_i_divisor_support_input.gp research/p192_extension_cover_20261012/type_i_divisor_support_gp.log research/p192_extension_cover_20261012/divisor_support_screen.py
          python3 research/p192_extension_cover_20261012/verify_nonspecial_support_receipt.py research/p192_extension_cover_20261012/type_i_divisor_support.json research/p192_extension_cover_20261012/type_i_nonspecial_support.json research/p192_extension_cover_20261012/type_i_nonspecial_support_input.gp research/p192_extension_cover_20261012/type_i_nonspecial_support_gp.log research/p192_extension_cover_20261012/nonspecial_support_screen.py research/p192_extension_cover_20261012/verify_nonspecial_support.gp
      - name: Replay P-192 line sections, projection custody, and guided collector
        working-directory: .
        run: |
          python3 research/p192_extension_cover_20261012/verify_line_support_receipt.py
          python3 research/p192_extension_cover_20261012/verify_line_reduced_source.py
          python3 research/p192_extension_cover_20261012/verify_line_projection_receipt.py
          python3 research/p192_extension_cover_20261012/verify_line_guided_collector.py
          python3 research/p192_extension_cover_20261012/verify_line_fixed_origin_receipt.py
          python3 -B research/p192_extension_cover_20261012/verify_line_sum_coverage.py
          python3 -B research/p192_extension_cover_20261012/verify_line_cell_sample.py
          python3 -B research/p192_extension_cover_20261012/verify_line_signed_short_receipt.py
          python3 -B research/p192_extension_cover_20261012/verify_line_leaf_relation.py
          python3 -B research/p192_extension_cover_20261012/prepare_line_second_gen_input.py
          python3 -B research/p192_extension_cover_20261012/verify_line_second_gen_closure.py
          python3 -B research/p192_extension_cover_20261012/verify_line_full_constant.py
          python3 -B research/p192_extension_cover_20261012/verify_line_full_collinearity.py
          python3 -B research/p192_extension_cover_20261012/verify_line_full_selected_tangencies.py
          python3 -B research/p192_extension_cover_20261012/verify_line_full_residual_discriminant.py
          cd research/p192_extension_cover_20261012
          grep -Ev '  (\.gitattributes|lean/lakefile\.toml)$' ARTIFACTS.sha256 | sha256sum -c -
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 90 || 25 }}
    defaults:
      run:
        working-directory: research/weak_curve_database_20261012/lean
    steps:
      - uses: actions/checkout@v4
      - name: Build cubic norm-one theorems and replay in a fresh kernel
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/weak_curve_database_20261012/lean
          auto-config: false
          use-mathlib-cache: true
          build: true
          build-args: 'WeakCurveDatabase'
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose WeakCurveDatabase'
      - name: Audit transitive axioms
        run: lake env lean AxiomAudit.lean
  p192-lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 35 || 25 }}
    defaults:
      run:
        working-directory: research/p192_extension_cover_20261012/lean
    steps:
      - uses: actions/checkout@v4
      - name: Build P-192 norm theorem and replay in a fresh kernel
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/p192_extension_cover_20261012/lean
          auto-config: false
          use-mathlib-cache: true
          build: true
          build-args: 'CrossRatio SignedBase ScalarAnchor AdaptiveBase ShortSums DivisorSupport NonspecialSupport'
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose CrossRatio'
      - name: Audit P-192 theorem axioms
        run: lake env lean CrossRatio.lean
      - name: Fresh-check signed-base theorem and audit axioms
        run: lake env leanchecker --fresh --verbose SignedBase && lake env lean SignedBase.lean
      - name: Fresh-check scalar-anchor theorem and audit axioms
        run: lake env leanchecker --fresh --verbose ScalarAnchor && lake env lean ScalarAnchor.lean
      - name: Fresh-check adaptive-base theorem and audit axioms
        run: lake env leanchecker --fresh --verbose AdaptiveBase && lake env lean AdaptiveBase.lean
      - name: Fresh-check short-sum collision theorems and audit axioms
        run: lake env leanchecker --fresh --verbose ShortSums && lake env lean ShortSums.lean
      - name: Fresh-check divisor-support theorems and audit axioms
        run: lake env leanchecker --fresh --verbose DivisorSupport && lake env lean DivisorSupport.lean
      - name: Fresh-check noncollinearity theorem and audit axioms
        run: lake env leanchecker --fresh --verbose NonspecialSupport && lake env lean NonspecialSupport.lean
  p192-line-lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: research/p192_extension_cover_20261012/lean
    steps:
      - uses: actions/checkout@v4
      - name: Build line inverse, support, and Frobenius fiber theorems
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/p192_extension_cover_20261012/lean
          auto-config: false
          use-mathlib-cache: true
          build: true
          build-args: 'LinePointInverse LineSupport LineFiberDescent ThreeSumCapacity LineLeafRank'
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose LinePointInverse'
      - name: Audit line-point inverse theorem axioms
        run: lake env lean LinePointInverse.lean
      - name: Fresh-check line-support theorems and audit axioms
        run: lake env leanchecker --fresh --verbose LineSupport && lake env lean LineSupport.lean
      - name: Fresh-check six-fiber descent theorem and audit axioms
        run: lake env leanchecker --fresh --verbose LineFiberDescent && lake env lean LineFiberDescent.lean
      - name: Fresh-check three-sum capacity theorem and audit axioms
        run: lake env leanchecker --fresh --verbose ThreeSumCapacity && lake env lean ThreeSumCapacity.lean
      - name: Fresh-check private-column rank theorem and audit axioms
        run: lake env leanchecker --fresh --verbose LineLeafRank && lake env lean LineLeafRank.lean
  p192-line-closure-lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: research/p192_extension_cover_20261012/lean
    steps:
      - uses: actions/checkout@v4
      - name: Build and fresh-check line-closure theorem
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/p192_extension_cover_20261012/lean
          auto-config: false
          use-mathlib-cache: true
          build: true
          build-args: 'LineClosure'
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose LineClosure'
      - name: Audit line-closure theorem axioms
        run: lake env lean LineClosure.lean
  p192-line-center-lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: research/p192_extension_cover_20261012/lean
    steps:
      - uses: actions/checkout@v4
      - name: Build and fresh-check line-centering theorems
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/p192_extension_cover_20261012/lean
          auto-config: false
          use-mathlib-cache: true
          build: true
          build-args: 'LineCenter'
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose LineCenter'
      - name: Audit line-centering theorem axioms
        run: lake env lean LineCenter.lean
  p192-full-collinearity-lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: research/p192_extension_cover_20261012/lean
    steps:
      - uses: actions/checkout@v4
      - name: Build and fresh-check full-line incidence implication
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/p192_extension_cover_20261012/lean
          auto-config: false
          use-mathlib-cache: true
          build: true
          build-args: 'FullCollinearity'
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose FullCollinearity'
      - name: Audit full-line incidence theorem axioms
        run: lake env lean FullCollinearity.lean
  p192-residual-discriminant-lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: research/p192_extension_cover_20261012/lean
    steps:
      - uses: actions/checkout@v4
      - name: Build and fresh-check residual-discriminant theorems
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/p192_extension_cover_20261012/lean
          auto-config: false
          use-mathlib-cache: true
          build: true
          build-args: 'ResidualDiscriminant'
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose ResidualDiscriminant'
      - name: Audit residual-discriminant theorem axioms
        run: lake env lean ResidualDiscriminant.lean
  p192-three-pivot-lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: research/p192_extension_cover_20261012/lean
    steps:
      - uses: actions/checkout@v4
      - name: Build unordered-support and third-pivot theorems
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/p192_extension_cover_20261012/lean
          auto-config: false
          use-mathlib-cache: true
          build: true
          build-args: 'UnorderedSupport ThreePivotSupport ThreePivotGuided'
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose ThreePivotSupport'
      - name: Fresh-check unordered-support and third-pivot axioms
        run: |
          lake env leanchecker --fresh --verbose UnorderedSupport
          lake env leanchecker --fresh --verbose ThreePivotGuided
          lake env lean UnorderedSupport.lean
          lake env lean ThreePivotSupport.lean
          lake env lean ThreePivotGuided.lean
  p192-three-pivot-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay every third-pivot row and independent sorted union
        run: |
          python3 -B research/p192_extension_cover_20261012/verify_residual_pivot002_cross.py
          python3 -B research/p192_extension_cover_20261012/verify_three_pivot_union.py
  p192-cross-pivot-lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 30 || 25 }}
    defaults:
      run:
        working-directory: research/p192_extension_cover_20261012/lean
    steps:
      - uses: actions/checkout@v4
      - name: Build cross-pivot and grid theorems
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/p192_extension_cover_20261012/lean
          auto-config: false
          use-mathlib-cache: true
          build: true
          build-args: 'AdditiveGrid CrossPivotRectangles FullFanCycleArithmetic QueryCubicLineRelation'
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose CrossPivotRectangles'
      - name: Fresh-check remaining modules and audit axioms
        run: |
          lake env leanchecker --fresh --verbose AdditiveGrid
          lake env leanchecker --fresh --verbose FullFanCycleArithmetic
          lake env leanchecker --fresh --verbose QueryCubicLineRelation
          lake env lean AdditiveGrid.lean
          lake env lean CrossPivotRectangles.lean
          lake env lean FullFanCycleArithmetic.lean
          lake env lean QueryCubicLineRelation.lean
  p192-cross-pivot-replay:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 30 || 25 }}
    steps:
      - uses: actions/checkout@v4
      - name: Replay complete-fan rank, reduced rectangles, and grid support
        run: |
          python3 -B research/p192_extension_cover_20261012/line_full_cross_pivot_cycle_rank.py
          python3 -B research/p192_extension_cover_20261012/verify_full_cross_pivot_cycle_rank.py
          python3 -B research/p192_extension_cover_20261012/line_cross_pivot_rectangles.py
          python3 -B research/p192_extension_cover_20261012/analyze_additive_grid_rank.py
          python3 -B research/p192_extension_cover_20261012/verify_additive_grid.py
          python3 -B research/p192_extension_cover_20261012/verify_full_rectangle_query_law.py
          python3 -B research/p192_extension_cover_20261012/verify_pivot002_reduced_receipt.py
          python3 -B research/p192_extension_cover_20261012/verify_three_pivot_guided_coverage.py
          sha256sum -c research/p192_extension_cover_20261012/reports/run-20261017T2055Z/ARTIFACTS.sha256
          grep -Ev '  research/p192_extension_cover_20261012/lean/lakefile\.toml$' research/p192_extension_cover_20261012/reports/run-20261017T2119Z/ARTIFACTS.sha256 | sha256sum -c -
  p192-triple-star-native-replay:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 30 || 25 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install independent PARI checker
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp
      - name: Replay 16-endpoint selection, cubic cuts, and matrix rank
        run: |
          python3 -B research/p192_extension_cover_20261012/line_triple_star_screen.py
          python3 -B research/p192_extension_cover_20261012/prepare_triple_star_gp.py
          gp -s 256000000 -q research/p192_extension_cover_20261012/verify_triple_star_reduced_native.gp > research/p192_extension_cover_20261012/type_i_triple_star_reduced96_native.log
          python3 -B research/p192_extension_cover_20261012/verify_triple_star_rank.py
          grep -Ev '  (\.github/workflows/weak-curve-database\.yml|research/p192_extension_cover_20261012/lean/(FullFanCycleArithmetic\.lean|lakefile\.toml))$' research/p192_extension_cover_20261012/reports/run-20261018T0016Z/ARTIFACTS.sha256 | sha256sum -c -
  p192-triple-star-character-replay:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 30 || 25 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install independent PARI checker
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp
      - name: Replay character selection, cubic cuts, cells, and rank
        run: |
          python3 -B research/p192_extension_cover_20261012/line_triple_star_character_selection.py
          python3 -B research/p192_extension_cover_20261012/prepare_triple_star_character_gp.py
          gp -s 256000000 -q research/p192_extension_cover_20261012/verify_triple_star_character_reduced_native.gp > research/p192_extension_cover_20261012/type_i_triple_star_character_reduced96_native.log
          python3 -B research/p192_extension_cover_20261012/verify_triple_star_character_rank.py
          grep -Ev '  (\.github/workflows/weak-curve-database\.yml|research/p192_extension_cover_20261012/lean/lakefile\.toml)$' research/p192_extension_cover_20261012/reports/run-20261018T1929Z/ARTIFACTS.sha256 | sha256sum -c -
  p192-known-scalar-query-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install independent PARI checker
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp
      - name: Replay query cubics, quotient rows, and exact modular rank
        run: |
          python3 -B research/p192_extension_cover_20261012/prepare_known_scalar_query_cubics_gp.py
          gp -s 256000000 -q research/p192_extension_cover_20261012/verify_known_scalar_query_cubics_native.gp > research/p192_extension_cover_20261012/type_i_known_scalar_query_cubic_roots_native.log
          python3 -B research/p192_extension_cover_20261012/verify_known_scalar_query_cubics.py
          python3 -B research/p192_extension_cover_20261012/verify_known_scalar_query_pivot_screen.py
          python3 -B research/p192_extension_cover_20261012/verify_known_scalar_query_transfer.py
          python3 -B research/p192_extension_cover_20261012/verify_known_scalar_query_relation_screen.py
          python3 -B research/p192_extension_cover_20261012/verify_known_scalar_query_cross_fan.py
          sha256sum -c research/p192_extension_cover_20261012/reports/run-20261018T2034Z/ARTIFACTS.sha256
  leaderboard-lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: research/weak_curve_leaderboard_20261012/lean
    steps:
      - uses: actions/checkout@v4
      - name: Build all leaderboard theorem modules
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/weak_curve_leaderboard_20261012/lean
          auto-config: false
          use-mathlib-cache: true
          build: true
          build-args: 'PrimeExamples OakleyOrders MinimalPairingField RelationSupport'
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose RelationSupport'
      - name: Fresh-kernel replay of Oakley genus theorem
        run: lake env leanchecker --fresh --verbose OakleyOrders
      - name: Audit leaderboard theorem axioms
        run: lake env lean AxiomAudit.lean
