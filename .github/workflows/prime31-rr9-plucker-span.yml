name: Prime31 RR9 Pluecker span and bilinear-rank gate

on:
  # The branch push trigger is armed only after the required resume checkpoint.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-rank-certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify frozen protocol digest
        working-directory: research/prime31_ic_20261115/rr9
        run: sha256sum -c RR9_PLUCKER_SPAN_PROTOCOL_20261119.sha256

      - name: Checkout original Prime31 arithmetic
        uses: actions/checkout@v4
        with:
          ref: 1df714645aa683cf975bc76fcacb9842cb4780fd
          path: pinned
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt

      - name: Overlay only producer and independent checker
        run: |
          cp research/prime31_ic_20261115/native/examples/prime31_rr9_plucker_span.rs \
            pinned/research/prime31_ic_20261115/native/examples/prime31_rr9_plucker_span.rs
          cp research/prime31_ic_20261115/native/examples/prime31_rr9_plucker_span_check.rs \
            pinned/research/prime31_ic_20261115/native/examples/prime31_rr9_plucker_span_check.rs

      - name: Format and original arithmetic regressions
        run: |
          rustfmt +1.100.0 --edition 2021 --check \
            pinned/research/prime31_ic_20261115/native/examples/prime31_rr9_plucker_span.rs \
            pinned/research/prime31_ic_20261115/native/examples/prime31_rr9_plucker_span_check.rs
          cargo +1.100.0 test --locked --release \
            --manifest-path pinned/research/prime31_ic_20261115/native/Cargo.toml --lib

      - name: Focused producer and checker tests
        run: |
          cargo +1.100.0 test --locked --release \
            --manifest-path pinned/research/prime31_ic_20261115/native/Cargo.toml \
            --example prime31_rr9_plucker_span
          cargo +1.100.0 test --locked --release \
            --manifest-path pinned/research/prime31_ic_20261115/native/Cargo.toml \
            --example prime31_rr9_plucker_span_check

      - name: Build immutable release endpoints
        run: |
          cargo +1.100.0 build --locked --release \
            --manifest-path pinned/research/prime31_ic_20261115/native/Cargo.toml \
            --example prime31_rr9_plucker_span
          cargo +1.100.0 build --locked --release \
            --manifest-path pinned/research/prime31_ic_20261115/native/Cargo.toml \
            --example prime31_rr9_plucker_span_check

      - name: Two byte-identical exact producer runs under 4 GiB
        run: |
          producer=pinned/research/prime31_ic_20261115/native/target/release/examples/prime31_rr9_plucker_span
          ulimit -v 4194304
          /usr/bin/time -v -o producer-a.time "$producer" > producer-a.json
          /usr/bin/time -v -o producer-b.time "$producer" > producer-b.json
          cmp producer-a.json producer-b.json

      - name: Independent replay twice and mutation controls
        run: |
          checker=pinned/research/prime31_ic_20261115/native/target/release/examples/prime31_rr9_plucker_span_check
          ulimit -v 4194304
          /usr/bin/time -v -o checker-a.time "$checker" check producer-a.json > checker-a.json
          /usr/bin/time -v -o checker-b.time "$checker" check producer-a.json > checker-b.json
          cmp checker-a.json checker-b.json
          "$checker" mutations producer-a.json > mutations.json

      - name: Bind source and exact outputs
        if: always()
        run: |
          sha256sum \
            research/prime31_ic_20261115/native/examples/prime31_rr9_plucker_span.rs \
            research/prime31_ic_20261115/native/examples/prime31_rr9_plucker_span_check.rs \
            research/prime31_ic_20261115/rr9/RR9_PLUCKER_SPAN_PROTOCOL_20261119.md \
            producer-a.json producer-b.json checker-a.json checker-b.json mutations.json \
            > SHA256SUMS 2>/dev/null || true
          git rev-parse HEAD > candidate-commit.txt

      - name: Preserve success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime31-rr9-plucker-span-evidence
          path: |
            producer-*.json
            producer-*.time
            checker-*.json
            checker-*.time
            mutations.json
            SHA256SUMS
            candidate-commit.txt
          if-no-files-found: warn
          retention-days: 30
