name: ECC2K-130 degree-7 m3 four-policy

on:
  # Not a pull-request check. The merge set is gate, size, and artifacts.
  # This runs when the matching change is on main, or on its schedule.
  push:
    branches: [main]
    paths:
      - '.github/workflows/ecc2k130-m3-four-policy.yml'
      - 'research/notes/ecc2k130/m3_four_policy_20260930/**'
      - 'research/ecc2k130_factor_base_pilot_20260924/**'
      - 'research/ecc2k130_factor_base_replication_20260925/**'
      - 'research/ecc2k130_dual_transport_20260925/**'

  workflow_dispatch:
jobs:
  validate:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-m3-four-policy.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-m3-four-policy.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github/scripts/frozen-workflow-check.mjs
            .github/scripts/run-frozen-workflow-replays.mjs
            .github/scripts/frozen-workflow-pins.json
            research/notes/ecc2k130/m3_four_policy_20260930
            research/ecc2k130_factor_base_pilot_20260924
            research/ecc2k130_factor_base_replication_20260925
            research/ecc2k130_dual_transport_20260925
            research/ecc2k130_relations
            research/ecc2k130_oriented_transport_20260924
            .github/workflows/ecc2k130-m3-four-policy.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source lock and pinned inputs
        env:
          FROZEN_VIEW_STEP: |
            python - <<'PY'
            import sys
            sys.path.insert(0, 'research/notes/ecc2k130/m3_four_policy_20260930')
            import verify, produce
            verify.checked_config()
            produce.checked_config(require_lock=False)
            PY
        run: node .github/scripts/run-frozen-workflow-replays.mjs --only m3_four_policy_20260930 -- bash -eo pipefail -c "$FROZEN_VIEW_STEP"
      - name: Compile and run pre-panel semantic tests
        env:
          FROZEN_VIEW_STEP: |
            python -m py_compile research/notes/ecc2k130/m3_four_policy_20260930/{produce,verify,test_arithmetic}.py
            python -m unittest discover research/notes/ecc2k130/m3_four_policy_20260930 -p 'test_*.py' -v
        run: node .github/scripts/run-frozen-workflow-replays.mjs --only m3_four_policy_20260930 -- bash -eo pipefail -c "$FROZEN_VIEW_STEP"
      - name: Replay the archived one-shot evidence when present
        env:
          FROZEN_VIEW_STEP: |
            evidence=research/notes/ecc2k130/m3_four_policy_20260930/evidence_run_36722040881
            if test -f "$evidence/result.json"; then
              python research/notes/ecc2k130/m3_four_policy_20260930/verify.py --evidence "$evidence" --out "$RUNNER_TEMP/replay_repaired.json"
              cmp "$RUNNER_TEMP/replay_repaired.json" "$evidence/replay_repaired.json"
            fi
        run: node .github/scripts/run-frozen-workflow-replays.mjs --only m3_four_policy_20260930 -- bash -eo pipefail -c "$FROZEN_VIEW_STEP"
