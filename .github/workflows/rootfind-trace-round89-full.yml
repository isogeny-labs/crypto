name: Rootfind round89 column convolution source-exact A/B
on:
  push:
    branches:
      - 'automation/rootfind-column-accumulator-round89-20261121'
  pull_request:
    paths:
      - 'src/cryptanalysis/prime_root_trace.rs'
      - 'research/amm_digit_perf_20261118/round89_full_ab.py'
      - '.github/workflows/rootfind-trace-round89-full.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-exact-rootfind:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round89_full_ab.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare baseline and round89 production Rust source
        shell: bash
        run: |
          set -euo pipefail
          python3 research/amm_digit_perf_20261118/round89_full_ab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round89-rootfind-before-after
          path: research/amm_digit_perf_20261118/round89_full_ab_results.csv
