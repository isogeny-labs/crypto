name: Rootfind round94 source-exact producer A/B
on:
  push:
    branches:
      - 'automation/rootfind-column-accumulator-round89-20261121'
    paths:
      - 'src/cryptanalysis/prime_root_trace.rs'
      - '.github/workflows/rootfind-round94-noop.yml'
      - 'research/amm_digit_perf_20261118/round89_full_ab.py'
  pull_request:
    paths:
      - 'src/cryptanalysis/prime_root_trace.rs'
      - '.github/workflows/rootfind-round94-noop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-exact-round94:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round89_full_ab.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare frozen round93 and round94 complete Rust solve and verify
        env:
          ROOTFIND_BASELINE_REF: 05ee9475811cc432d83058e2064bc1065153ec96
          ROOTFIND_AB_OUTPUT: research/amm_digit_perf_20261118/round94_incremental_ab_results.csv
        run: python3 research/amm_digit_perf_20261118/round89_full_ab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfind-round94-incremental-ab
          path: research/amm_digit_perf_20261118/round94_incremental_ab_results.csv
