name: Prime31 run65 exact public-shift support control
on:
  push:
    branches:
      - research/prime31-f4-admission-run51-20261121
    paths:
      - "research/prime31_ic_20261115/native/examples/prime31_run65_shift_correlations.rs"
      - ".github/workflows/prime31-run65-shift-correlations.yml"
  pull_request:
    paths:
      - "research/prime31_ic_20261115/native/examples/prime31_run65_shift_correlations.rs"
      - ".github/workflows/prime31-run65-shift-correlations.yml"
  workflow_dispatch:

jobs:
  original-rust-exact-correlation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: research/prime31_ic_20261115/native
      - name: Reproduce exact signed Dickson support and eight-shift union in original Rust
        working-directory: research/prime31_ic_20261115/native
        run: cargo run --locked --release --example prime31_run65_shift_correlations
