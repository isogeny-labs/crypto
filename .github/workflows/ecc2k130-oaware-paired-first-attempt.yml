name: ECC2K-130 n13 paired SAT first-attempt archive
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-only:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-oaware-paired-first-attempt.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-oaware-paired-first-attempt.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck frozen source and first local admission archive
        run: |
          python3 research/notes/ecc2k130/n13_oaware_sparse_dense_sat_20260925/ci_replay.py
          python3 research/notes/ecc2k130/n13_oaware_sparse_dense_sat_20260925/verify_first_attempt.py
          python3 -m py_compile \
            research/notes/ecc2k130/n13_oaware_sparse_dense_sat_20260925/host_gate.py \
            research/notes/ecc2k130/n13_oaware_sparse_dense_sat_20260925/verify_first_attempt.py
          git diff --check "$(git merge-base HEAD "${{ github.event.pull_request.base.sha }}")" HEAD
