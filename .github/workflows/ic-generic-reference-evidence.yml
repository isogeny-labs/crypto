name: IC generic reference evidence replay
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  strict-replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ic-generic-reference-evidence.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ic-generic-reference-evidence.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 45 }}
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/ic_candidate_tournament_20260915/goal_20260924/generic-reference-qualification
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive decoder
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Check note and canonical scoreboard against the frozen export
        run: python research/ic_candidate_tournament_20260915/goal_20260924/generic-reference-qualification/render_report.py --check
      - name: Fresh archive, all exported rows and eleven frozen audits
        run: |
          python -m unittest discover \
            -s research/ic_candidate_tournament_20260915/goal_20260924/generic-reference-qualification \
            -p test_archive.py -v 2>&1 | tee "$RUNNER_TEMP/ic-generic-reference-replay.log"
      - name: Retain replay log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ic-generic-reference-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ic-generic-reference-replay.log
          if-no-files-found: warn
          retention-days: 30
