name: ECC2K-130 rotated recursive S3 candidate gate
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-preflight:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-rotated-s3-candidate.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-rotated-s3-candidate.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/notes/ecc2k130
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen sources and exact S3 root cases
        run: |
          python3 -m py_compile research/notes/ecc2k130/rotated_s3_candidate_20260925/{diagnostic,verify,run,ci_replay}.py
          python3 research/notes/ecc2k130/rotated_s3_candidate_20260925/ci_replay.py
      - name: Check archived result receipt when present
        run: |
          receipt=research/notes/ecc2k130/rotated_s3_candidate_20260925/evidence/receipt.json
          if test -f "$receipt"; then
            python3 research/notes/ecc2k130/rotated_s3_candidate_20260925/ci_replay.py --evidence "$receipt"
            python3 research/notes/ecc2k130/rotated_s3_candidate_20260925/archive_check.py
          fi
