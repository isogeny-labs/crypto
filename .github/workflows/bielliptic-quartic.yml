name: Bounded bielliptic quartic diagnostic

on:
  # Not a pull-request check. The merge set is gate, size, and artifacts.
  # This runs when the matching change is on main, or on its schedule.
  push:
    branches: [main, claude/cryptanalysis-repo-setup-p59kek]
    paths:
      - '**/cryptanalysis/bielliptic_quartic.rs'
      - '**/bin/quartic_ic.rs'
      - '**/cryptanalysis/mod.rs'
      - '**/Cargo.toml'
      - 'tools/check_bielliptic_quartic.*'
      - 'research/bielliptic_quartic_20261005/**'
      - 'experiments/bielliptic-quartic/**'
      - '.github/workflows/bielliptic-quartic.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|bielliptic-quartic.yml|') && 'ubuntu-latest' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|bielliptic-quartic.yml|') && 'ubuntu-latest' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Free hosted runner disk before Rust installation
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.87.0'
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native mathematical tests and bounded CLI replay
        run: bash tools/check_bielliptic_quartic.sh
