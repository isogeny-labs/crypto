name: taskq image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'taskq/taskq/**'
      - 'taskq/pyproject.toml'
      - 'taskq/deploy/Dockerfile'
      - '.github/workflows/taskq-image.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push' }}

jobs:
  publish:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|taskq-image.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|taskq-image.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && (20) || 15 }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: taskq
          file: taskq/deploy/Dockerfile
          push: true
          build-args: TASKQ_IMAGE=ghcr.io/${{ github.repository_owner }}/taskq-worker:${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/taskq-worker:latest
            ghcr.io/${{ github.repository_owner }}/taskq-worker:${{ github.sha }}
