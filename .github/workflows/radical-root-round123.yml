name: Rootfinding Round123 quadratic shortcuts native Rust A/B
on:
  push:
    branches:
      - 'automation/radical-root-mersenne-sqrt-round114-20261122'
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  native-rust-quadratics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/cryptanalysis/prime_radical_root.rs
            research/amm_digit_perf_20261118/round123_quad_ab.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile production code twice and benchmark
        run: |
          set -euo pipefail
          rustc --version
          python3 research/amm_digit_perf_20261118/round123_quad_ab.py | tee round123_native_rust.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfind-round123-native-rust
          path: round123_native_rust.txt
          if-no-files-found: warn
