name: Prime31 matched first-x B31 versus Dickson31 full-cost Rust
on:
  push:
    branches: [automation/prime31-b31-firstx-complete-frontier-20261117]
    paths:
      - 'research/prime31_ic_20261115/native/examples/prime31_s9_b31_half_sum_oracle.rs'
      - 'research/prime31_ic_20261115/native/B31_DICKSON_FIRSTX_FULL_COST_PROTOCOL_20261117.md'
      - '.github/workflows/prime31-b31-basechoice-full-cost.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'research/prime31_ic_20261115/native/examples/prime31_s9_b31_half_sum_oracle.rs'
      - '.github/workflows/prime31-b31-basechoice-full-cost.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prime31-matched-b31-basechoice:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout candidate original Rust example
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            research/prime31_ic_20261115/native/examples/prime31_s9_b31_half_sum_oracle.rs
          sparse-checkout-cone-mode: false
      - name: Checkout pinned original Rust native crate and arithmetic
        uses: actions/checkout@v4
        with:
          ref: 1df714645aa683cf975bc76fcacb9842cb4780fd
          path: prime31-native-pinned
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            research/prime31_ic_20261115/native
            src/cryptanalysis
      - name: Install pinned Rust compiler
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Overlay candidate only, preserving pinned original arithmetic
        run: |
          cp research/prime31_ic_20261115/native/examples/prime31_s9_b31_half_sum_oracle.rs prime31-native-pinned/research/prime31_ic_20261115/native/examples/
      - name: Native Rust 40-test library regression
        run: cargo +1.100.0 test --locked --release --manifest-path prime31-native-pinned/research/prime31_ic_20261115/native/Cargo.toml --lib
      - name: Exact source first-x and Dickson B31 complete 256 unknown logs
        shell: bash
        run: |
          set -o pipefail
          timeout -k 10 1200 cargo +1.100.0 test --locked --release --manifest-path prime31-native-pinned/research/prime31_ic_20261115/native/Cargo.toml --example prime31_s9_b31_half_sum_oracle actual_prime31_b31_firstx_vs_dickson_256q_complete_cost -- --nocapture --test-threads=1 2>&1 | tee prime31-b31-basechoice-full-cost.log
      - name: Exact source reversed arm-order full 256 unknown logs
        shell: bash
        env:
          PRIME31_B31_BASECHOICE_REVERSE: '1'
        run: |
          set -o pipefail
          timeout -k 10 1200 cargo +1.100.0 test --locked --release --manifest-path prime31-native-pinned/research/prime31_ic_20261115/native/Cargo.toml --example prime31_s9_b31_half_sum_oracle actual_prime31_b31_firstx_vs_dickson_256q_complete_cost -- --nocapture --test-threads=1 2>&1 | tee prime31-b31-basechoice-reversed.log
      - name: Frozen success gates
        if: success()
        shell: bash
        run: |
          grep -Fq 'test result: ok. 1 passed;' prime31-b31-basechoice-full-cost.log
          grep -Fq 'PRIME31_B31_FIRSTX_DICKSON_COMPLETE_JSON=' prime31-b31-basechoice-full-cost.log
          grep -Fq '"same_public_target_count":256' prime31-b31-basechoice-full-cost.log
          grep -Fq '"true_sign_independent_algebraic_extraction":false' prime31-b31-basechoice-full-cost.log
          grep -Fq '"base_kind":"dickson31"' prime31-b31-basechoice-full-cost.log
          grep -Fq '"base_kind":"first_x31"' prime31-b31-basechoice-full-cost.log
          grep -Fq 'PRIME31_B31_FIRSTX_DICKSON_COMPLETE_JSON=' prime31-b31-basechoice-reversed.log
          grep -Fq '"panel_order":["first_x31","dickson31"]' prime31-b31-basechoice-reversed.log
          grep -Fq 'test result: ok. 1 passed;' prime31-b31-basechoice-reversed.log
      - name: Archive raw native Rust JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime31-b31-basechoice-full-cost-raw
          path: |
            prime31-b31-basechoice-full-cost.log
            prime31-b31-basechoice-reversed.log
          retention-days: 30
          if-no-files-found: warn
