name: Radical prime-field rootfinder correctness and timing

on:
  pull_request:
    paths:
      - 'src/cryptanalysis/prime_radical_root.rs'
      - 'src/cryptanalysis/prime_root_trace.rs'
      - 'research/amm_digit_perf_20261118/round23_verifier_isolated.py'
      - 'research/amm_digit_perf_20261118/round24_verifier_isolated.py'
      - 'research/amm_digit_perf_20261118/round25_verifier_isolated.py'
      - 'research/amm_digit_perf_20261118/round26_verifier_isolated.py'
      - 'research/amm_digit_perf_20261118/round27_verifier_isolated.py'
      - '.github/workflows/radical-root-arithmetic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radical-root-arithmetic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The default crypto library is temporarily unbuildable due to unrelated
  # F4/APS diagnostics. Compile the exact production source in a tiny,
  # dependency-free test crate so field changes are still independently gated.
  isolated-arithmetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          # The full crypto repository is unusually large; this isolated
          # crate imports only the exact production source file.
          sparse-checkout: |
            research/radical_field_perf_20261117/isolated
            src/cryptanalysis/prime_radical_root.rs
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round22_trace_field_isolated.py
            research/amm_digit_perf_20261118/round23_verifier_isolated.py
            research/amm_digit_perf_20261118/round24_verifier_isolated.py
            research/amm_digit_perf_20261118/round25_verifier_isolated.py
            research/amm_digit_perf_20261118/round26_verifier_isolated.py
            research/amm_digit_perf_20261118/round27_verifier_isolated.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile actual Rust module and check arithmetic
        run: |
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            optimized_field_arithmetic_matches_wide_reference -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            radical_power_reuse_matches_frozen_reference -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            cube_root_exhaustive_fp_and_fp2_both_classes -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            amm_digit_loop_matches_previous_reference -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            cardano_discriminant_reuse_matches_reference -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            cubic_shift_fq2_square_and_small_field_mul_match_reference -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            adaptive_window_power_and_quadratic_finish_match_frozen -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            quadratic_direct_discriminant_matches_frozen_normalized_formula -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            monic_cubic_entry_point_matches_frozen_normalization -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            fused_tonelli_and_quartic_coefficients_match_frozen -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            frobenius_fp2_power_matches_frozen_binary_and_cube_root -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            modular_half_and_linear_shortcuts_match_frozen_formula -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            actual_fp2_amm_cube_roots_match_pre_frobenius -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            fp2_cube_norm_and_mod8_sqrt_match_previous_algorithm -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            skip_zeroth_amm_digit_preserves_roots_fp_and_fp2 -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            cached_sylow_factors_match_precache_roots -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            s1_and_sparse_quadratic_quartic_match_previous -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            stack_coefficient_buffer_preserves_padding_and_modular_zeroes -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            sparse_cubics_and_even_quartics_match_frozen_reference -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            round20_sparse_fp2_and_depressed_quartic_match_reference -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            round21_small_inverses_and_cached_sylow_are_exact -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            round22_nonresidue_reciprocity_preserves_first_candidate -- --nocapture
      - name: Verify and benchmark actual Rust trace field arithmetic
        run: python3 research/amm_digit_perf_20261118/round22_trace_field_isolated.py
      - name: Verify and benchmark actual Rust trace verifier arithmetic
        run: python3 research/amm_digit_perf_20261118/round23_verifier_isolated.py
      - name: Verify and benchmark verifier fast paths in actual Rust
        run: python3 research/amm_digit_perf_20261118/round24_verifier_isolated.py
      - name: Verify and benchmark synthetic division and squaring in actual Rust
        run: python3 research/amm_digit_perf_20261118/round25_verifier_isolated.py
      - name: Verify and benchmark sparse polynomial and linear division improvements
        run: python3 research/amm_digit_perf_20261118/round26_verifier_isolated.py
      - name: Verify and benchmark monomial and sparse-square specializations
        run: python3 research/amm_digit_perf_20261118/round27_verifier_isolated.py
      - name: Actual Rust paired benchmark of AMM/Tonelli/discriminant
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "runner=$(uname -a)"
            echo "perf_event_paranoid=$(cat /proc/sys/kernel/perf_event_paranoid)"
            echo "rustc=$(rustc --version)"
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_radical_power_reuse -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_amm_digit_loop -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_cardano_discriminant -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_cubic_shift_fq2_square_and_small_field_mul -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_adaptive_window_and_quad_finish -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_quadratic_direct_discriminant -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_fused_tonelli_and_quartic_coefficients -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_frobenius_fp2_power -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_half_linear_and_tripling -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_fp2_amm_cube_root_before_after_frobenius -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_fp2_cubing_and_mod8_sqrt_actual_rust -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_skip_zeroth_amm_digit_actual_rust -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_cached_sylow_factors -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_s1_and_sparse_roots_actual_rust -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_stack_coefficient_buffer_actual_rust -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_sparse_round19_actual_rust -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_round20_sparse_fp2_and_quartic_depression -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_round21_small_inverse_constants_actual_rust -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_round21_cached_amm_sylow_actual_rust -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_round22_nonresidue_selection -- --ignored --nocapture
          } | tee "$RUNNER_TEMP/radical-power-reuse.txt"
          cat "$RUNNER_TEMP/radical-power-reuse.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radical-power-reuse-rust-bench
          path: ${{ runner.temp }}/radical-power-reuse.txt
          if-no-files-found: ignore

  radical:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check exact field arithmetic against wide reference
        run: cargo test --release --lib optimized_field_arithmetic_matches_wide_reference -- --nocapture
      - name: Check actual cubic and quartic outputs against reference
        run: cargo test --release --lib matches_prime_root_trace_on_random_large_instances -- --nocapture
      - name: Check cube-root algorithms over Fp and Fp2
        run: cargo test --release --lib cube_root_exhaustive_fp_and_fp2_both_classes -- --nocapture
      - name: Run paired before/after benchmark against actual Rust code
        run: |
          set -o pipefail
          echo "runner=$(uname -a)" | tee "$RUNNER_TEMP/radical-root-results.txt"
          echo "perf_event_paranoid=$(cat /proc/sys/kernel/perf_event_paranoid)" | tee -a "$RUNNER_TEMP/radical-root-results.txt"
          cargo test --release --lib bench_radical_field_actual_rust -- --ignored --nocapture \
            | tee -a "$RUNNER_TEMP/radical-root-results.txt"
          cat "$RUNNER_TEMP/radical-root-results.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radical-root-arithmetic-timing
          path: ${{ runner.temp }}/radical-root-results.txt
          if-no-files-found: ignore
