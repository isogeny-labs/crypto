  # The default crypto library is temporarily unbuildable due to unrelated
  # F4/APS diagnostics. Compile the exact production source in a tiny,
  # dependency-free test crate so field changes are still independently gated.
  isolated-arithmetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          # The full crypto repository is unusually large; this isolated
          # crate imports only the exact production source file.
          sparse-checkout: |
            research/radical_field_perf_20261117/isolated
            src/cryptanalysis/prime_radical_root.rs
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round22_trace_field_isolated.py
            research/amm_digit_perf_20261118/round23_verifier_isolated.py
            research/amm_digit_perf_20261118/round24_verifier_isolated.py
            research/amm_digit_perf_20261118/round25_verifier_isolated.py
            research/amm_digit_perf_20261118/round26_verifier_isolated.py
            research/amm_digit_perf_20261118/round27_verifier_isolated.py
            research/amm_digit_perf_20261118/round28_verifier_isolated.py
            research/amm_digit_perf_20261118/round29_verifier_isolated.py
            research/amm_digit_perf_20261118/round29_verifier_baseline.rs
            research/amm_digit_perf_20261118/round30_verifier_isolated.py
            research/amm_digit_perf_20261118/round30_verifier_baseline.rs
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile actual Rust module and check arithmetic
        run: |
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            optimized_field_arithmetic_matches_wide_reference -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            radical_power_reuse_matches_frozen_reference -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            cube_root_exhaustive_fp_and_fp2_both_classes -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            amm_digit_loop_matches_previous_reference -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            cardano_discriminant_reuse_matches_reference -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            cubic_shift_fq2_square_and_small_field_mul_match_reference -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            adaptive_window_power_and_quadratic_finish_match_frozen -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            quadratic_direct_discriminant_matches_frozen_normalized_formula -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            monic_cubic_entry_point_matches_frozen_normalization -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            fused_tonelli_and_quartic_coefficients_match_frozen -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            frobenius_fp2_power_matches_frozen_binary_and_cube_root -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            modular_half_and_linear_shortcuts_match_frozen_formula -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            actual_fp2_amm_cube_roots_match_pre_frobenius -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            fp2_cube_norm_and_mod8_sqrt_match_previous_algorithm -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            skip_zeroth_amm_digit_preserves_roots_fp_and_fp2 -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            cached_sylow_factors_match_precache_roots -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            s1_and_sparse_quadratic_quartic_match_previous -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            stack_coefficient_buffer_preserves_padding_and_modular_zeroes -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            sparse_cubics_and_even_quartics_match_frozen_reference -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            round20_sparse_fp2_and_depressed_quartic_match_reference -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            round21_small_inverses_and_cached_sylow_are_exact -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            round22_nonresidue_reciprocity_preserves_first_candidate -- --nocapture
      - name: Verify and benchmark actual Rust trace field arithmetic
