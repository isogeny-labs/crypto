name: Radical prime-field rootfinder correctness and timing

on:
  pull_request:
    paths:
      - 'src/cryptanalysis/prime_radical_root.rs'
      - '.github/workflows/radical-root-arithmetic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radical-root-arithmetic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The default crypto library is temporarily unbuildable due to unrelated
  # F4/APS diagnostics. Compile the exact production source in a tiny,
  # dependency-free test crate so field changes are still independently gated.
  isolated-arithmetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile actual Rust module and check arithmetic
        run: |
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            optimized_field_arithmetic_matches_wide_reference -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            radical_power_reuse_matches_frozen_reference -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            cube_root_exhaustive_fp_and_fp2_both_classes -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            amm_digit_loop_matches_previous_reference -- --nocapture
          cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
            cardano_discriminant_reuse_matches_reference -- --nocapture
      - name: Actual Rust paired benchmark of AMM/Tonelli/discriminant
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "runner=$(uname -a)"
            echo "perf_event_paranoid=$(cat /proc/sys/kernel/perf_event_paranoid)"
            echo "rustc=$(rustc --version)"
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_radical_power_reuse -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_amm_digit_loop -- --ignored --nocapture
            cargo test --release --manifest-path research/radical_field_perf_20261117/isolated/Cargo.toml \
              bench_cardano_discriminant -- --ignored --nocapture
          } | tee "$RUNNER_TEMP/radical-power-reuse.txt"
          cat "$RUNNER_TEMP/radical-power-reuse.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radical-power-reuse-rust-bench
          path: ${{ runner.temp }}/radical-power-reuse.txt
          if-no-files-found: ignore

  radical:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check exact field arithmetic against wide reference
        run: cargo test --release --lib optimized_field_arithmetic_matches_wide_reference -- --nocapture
      - name: Check actual cubic and quartic outputs against reference
        run: cargo test --release --lib matches_prime_root_trace_on_random_large_instances -- --nocapture
      - name: Check cube-root algorithms over Fp and Fp2
        run: cargo test --release --lib cube_root_exhaustive_fp_and_fp2_both_classes -- --nocapture
      - name: Run paired before/after benchmark against actual Rust code
        run: |
          set -o pipefail
          echo "runner=$(uname -a)" | tee "$RUNNER_TEMP/radical-root-results.txt"
          echo "perf_event_paranoid=$(cat /proc/sys/kernel/perf_event_paranoid)" | tee -a "$RUNNER_TEMP/radical-root-results.txt"
          cargo test --release --lib bench_radical_field_actual_rust -- --ignored --nocapture \
            | tee -a "$RUNNER_TEMP/radical-root-results.txt"
          cat "$RUNNER_TEMP/radical-root-results.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radical-root-arithmetic-timing
          path: ${{ runner.temp }}/radical-root-results.txt
          if-no-files-found: ignore
