      - 'research/amm_digit_perf_20261118/round32_verifier_isolated.py'
      - 'research/amm_digit_perf_20261118/round33_bounded_poly_isolated.py'
      - 'research/amm_digit_perf_20261118/round34_bounded_sparse_isolated.py'
      - 'research/amm_digit_perf_20261118/round36_bounded_replay_isolated.py'
      - 'research/amm_digit_perf_20261118/round38_bounded_gcd_isolated.py'
      - 'research/amm_digit_perf_20261118/round39_bounded_power_isolated.py'
      - 'research/amm_digit_perf_20261118/round40_bounded_frobenius_isolated.py'
      - 'research/amm_digit_perf_20261118/round42_mersenne_chain_isolated.py'
      - 'research/amm_digit_perf_20261118/round43_dense_square_isolated.py'
      - 'research/amm_digit_perf_20261118/round44_window3_isolated.py'
      - 'research/amm_digit_perf_20261118/round45_quadratic_frobenius_isolated.py'
      - 'research/amm_digit_perf_20261118/round46_quadratic_split_isolated.py'
      - 'research/amm_digit_perf_20261118/round47_quadratic_split_isolated.py'
      - 'research/amm_digit_perf_20261118/round48_joint_tonelli_isolated.py'
      - 'research/amm_digit_perf_20261118/round49_jacobi_isolated.py'
      - 'research/amm_digit_perf_20261118/round50_quadratic_finish_isolated.py'
      - 'research/amm_digit_perf_20261118/round51_linear_products_isolated.py'
      - 'research/amm_digit_perf_20261118/round52_monic_linear_isolated.py'
      - 'research/amm_digit_perf_20261118/round53_euclid_inverse_isolated.py'
      - 'research/amm_digit_perf_20261118/round54_dense_accumulators_isolated.py'
      - 'research/amm_digit_perf_20261118/round55_small_squares_isolated.py'
      - 'research/amm_digit_perf_20261118/round56_monomial_isolated.py'
      - 'research/amm_digit_perf_20261118/round57_monomial_frobenius_isolated.py'
      - 'research/amm_digit_perf_20261118/round58_binomial_frobenius_isolated.py'
      - 'research/amm_digit_perf_20261118/round31_bounded_baseline.rs'
      - 'research/amm_digit_perf_20261118/round23_verifier_isolated.py'
      - 'research/amm_digit_perf_20261118/round24_verifier_isolated.py'
      - 'research/amm_digit_perf_20261118/round25_verifier_isolated.py'
      - 'research/amm_digit_perf_20261118/round26_verifier_isolated.py'
      - 'research/amm_digit_perf_20261118/round27_verifier_isolated.py'
      - 'research/amm_digit_perf_20261118/round28_verifier_isolated.py'
      - 'research/amm_digit_perf_20261118/round29_verifier_isolated.py'
      - 'research/amm_digit_perf_20261118/round29_verifier_baseline.rs'
      - 'research/amm_digit_perf_20261118/round30_verifier_isolated.py'
      - 'research/amm_digit_perf_20261118/round30_verifier_baseline.rs'
      - '.github/workflows/radical-root-arithmetic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radical-root-arithmetic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bounded-monomial-frobenius-round57:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            src/cryptanalysis/prime_root_bounded.rs
            research/amm_digit_perf_20261118/round57_monomial_frobenius_isolated.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify producer and replay Frobenius, benchmark full root plus certificate
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "runner=$(uname -a)"
            echo "rustc=$(rustc --version)"
            python3 research/amm_digit_perf_20261118/round57_monomial_frobenius_isolated.py
          } | tee "$RUNNER_TEMP/round57-native-rust.txt"
          cat "$RUNNER_TEMP/round57-native-rust.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round57-monomial-frobenius-native-rust
          path: ${{ runner.temp }}/round57-native-rust.txt
          if-no-files-found: ignore

