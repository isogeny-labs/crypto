name: Rootfind Round 138 source-exact Rust A/B
on:
  push:
    branches:
      - automation/rootfind-round138-sparse-kernels-20261123
  pull_request:
    paths:
      - src/cryptanalysis/ecbench/isogeny.rs
      - research/rootfind_round138/**
      - .github/workflows/rootfind_round138.yml
permissions:
  contents: read
jobs:
  native-source-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src/cryptanalysis/ecbench/isogeny.rs
            research/rootfind_round134
            research/rootfind_round135
            research/rootfind_round136
            research/rootfind_round137
            research/rootfind_round138
      - name: Compile original and optimized production Rust files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin automation/rootfind-round137-pseudo-euclidean-gcd-20261123
          mkdir -p /tmp/rootfind_round138
          git show FETCH_HEAD:src/cryptanalysis/ecbench/isogeny.rs > /tmp/rootfind_round138/baseline.rs
          cp src/cryptanalysis/ecbench/isogeny.rs /tmp/rootfind_round138/optimized.rs
          for target in baseline optimized; do
            cat research/rootfind_round134/bench_helper.rs >> "/tmp/rootfind_round138/${target}.rs"
            cat research/rootfind_round135/bench_helper.rs >> "/tmp/rootfind_round138/${target}.rs"
            cat research/rootfind_round136/bench_helper.rs >> "/tmp/rootfind_round138/${target}.rs"
            cat research/rootfind_round137/bench_helper.rs >> "/tmp/rootfind_round138/${target}.rs"
            cat research/rootfind_round138/bench_helper.rs >> "/tmp/rootfind_round138/${target}.rs"
          done
          cp research/rootfind_round138/source_exact_main.rs /tmp/rootfind_round138/main.rs
          rustc --version
          rustc --edition=2021 -C opt-level=3 -C target-cpu=native /tmp/rootfind_round138/main.rs -o /tmp/rootfind_round138/bench
      - name: Independent brute-force oracles and paired A/B timing
        run: /tmp/rootfind_round138/bench
