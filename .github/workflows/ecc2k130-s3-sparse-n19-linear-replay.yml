name: ECC2K-130 n19 sparse S3 linear semantic replay
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'research/notes/ecc2k130/rotated_s3_sparse_n19_linear_20260929/**'
      - '.github/workflows/ecc2k130-s3-sparse-n19-linear-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-archive-replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-s3-sparse-n19-linear-replay.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-s3-sparse-n19-linear-replay.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/notes/ecc2k130
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checker and exercise small and large corruption controls
        run: |
          python -m py_compile research/notes/ecc2k130/rotated_s3_sparse_n19_linear_20260929/{verify,test_linear,audit_result}.py
          python research/notes/ecc2k130/rotated_s3_sparse_n19_linear_20260929/test_linear.py
      - name: Confirm the original first archive remains censored
        run: |
          python research/notes/ecc2k130/rotated_s3_sparse_n19_20260925/ci_replay.py \
            --evidence research/notes/ecc2k130/rotated_s3_sparse_n19_20260925/evidence/final
      - name: Independently replay the immutable n19 CNF, paths and full point panel
        run: |
          python research/notes/ecc2k130/rotated_s3_sparse_n19_linear_20260929/verify.py \
            --produced research/notes/ecc2k130/rotated_s3_sparse_n19_20260925/evidence/final/producer \
            --out "$RUNNER_TEMP/n19-linear-semantic-result.json"
          python research/notes/ecc2k130/rotated_s3_sparse_n19_linear_20260929/audit_result.py \
            --result "$RUNNER_TEMP/n19-linear-semantic-result.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: n19-linear-semantic-replay-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: ${{ runner.temp }}/n19-linear-semantic-result.json
