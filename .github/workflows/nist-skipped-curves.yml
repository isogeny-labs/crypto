name: Skipped NIST curve dissection

# Job definitions only: an operator starts the batch explicitly after review.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nist-skipped-curves-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: backlog/XP-20261021-nist-skipped-curves
      - id: plan
        name: Use the card's frozen job grid
        run: |
          jobs=$(jq -c '[.[].job]' backlog/XP-20261021-nist-skipped-curves/jobs.json)
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

  dissect:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    container:
      image: sagemath/sagemath@sha256:1dca662086a58ea620c54af578ee1d2ee5d0dbad01efed442a58ebf99c09fea9
      options: --user 0 --cpus 1 --memory 4g
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      JOB: ${{ matrix.job }}
    steps:
      - name: Install thin orchestration tools
        shell: bash
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git jq ripgrep
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: backlog/XP-20261021-nist-skipped-curves
      - name: Check out unmodified upstream DiSSECT
        if: matrix.job != 'algebra'
        uses: actions/checkout@v4
        with:
          repository: crocs-muni/DiSSECT
          ref: 8edc3030fb91411a55aa6c07d050507d840c5e55
          path: upstream-dissect
          persist-credentials: false
      - name: Install pinned upstream import dependencies
        if: matrix.job != 'algebra'
        shell: bash
        run: |
          sage -pip install --target "$RUNNER_TEMP/dissect-deps" pymongo==4.6.3 dnspython==2.6.1
      - name: Execute the selected job and check artifact coverage
        shell: bash
        run: |
          export DISSECT_ROOT="$GITHUB_WORKSPACE/upstream-dissect"
          export DISSECT_DEPS="$RUNNER_TEMP/dissect-deps"
          bash backlog/XP-20261021-nist-skipped-curves/run.sh run "$JOB" "$RUNNER_TEMP/results/$JOB"
      - name: Preserve raw output, including failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nist-skipped-${{ matrix.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results/${{ matrix.job }}/
          if-no-files-found: warn
          retention-days: 90
