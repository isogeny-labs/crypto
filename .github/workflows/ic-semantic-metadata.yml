name: ic-semantic-metadata

on:
  pull_request:
    paths:
      - AGENTS.md
      - docs/curves/ic/**
      - docs/curves/registry.json
      - .github/workflows/ic-semantic-metadata.yml
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - docs/curves/ic/**
      - docs/curves/registry.json
      - .github/workflows/ic-semantic-metadata.yml
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  metadata:
    name: canonical identities and upstream mirror
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ic-semantic-metadata.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ic-semantic-metadata.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 docs/curves
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata-only validators
        run: python -m pip install pyyaml==6.0.2 jsonschema==4.23.0
      - name: Negative controls
        run: python -m unittest discover -s docs/curves/ic -p 'test_validate_semantics.py' -v
      # aburan28/cryptanalysis is private: an unauthenticated fetch returns 404.
      # CRYPTANALYSIS_READ_TOKEN (a fine-grained token with contents: read on
      # that repository) enables the byte comparison; without it the committed
      # metadata is still validated and the run warns that the mirror was not.
      - name: Fetch authoritative cryptanalysis registry for byte comparison
        id: peer
        shell: bash
        env:
          PEER_TOKEN: ${{ secrets.CRYPTANALYSIS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PEER_TOKEN" ]; then
            echo "::warning::CRYPTANALYSIS_READ_TOKEN is not set; the upstream mirror comparison is skipped (aburan28/cryptanalysis is private)"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=cryptanalysis-peer/experiments/ic-candidate-catalog
          mkdir -p "$base/curve-links"
          for file in curves.yaml curves.schema.json curve-links/link.schema.json \
                      validate_semantics.py test_validate_semantics.py; do
            curl --fail --location --show-error --silent --retry 3 \
              -H "Authorization: Bearer $PEER_TOKEN" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/aburan28/cryptanalysis/contents/experiments/ic-candidate-catalog/$file?ref=main" \
              --output "$base/$file"
          done
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Validate committed metadata and upstream mirror
        if: steps.peer.outputs.available == 'true'
        run: python docs/curves/ic/validate_semantics.py --peer cryptanalysis-peer
      - name: Validate committed metadata (mirror not compared)
        if: steps.peer.outputs.available != 'true'
        run: python docs/curves/ic/validate_semantics.py
