name: Tree-split round-2 Lean checks
# Re-derives the study's verdict in Lean on every change to it: Data.lean
# must be what the harness generates from the committed records, and
# Verdict.lean must close by kernel `decide`. See
# research/ic_tree_split_structured_v2_20261011/PREREGISTRATION.md §7.
on:
  # Not a pull-request check. The merge set is gate, size, and artifacts.
  # This runs when the matching change is on main, or on its schedule.
  push:
    branches: [main]
    paths:
      - '.github/workflows/tree-split-structured-v2-lean.yml'
      - 'examples/tree_split_structured_v2.rs'
      - 'research/ic_tree_split_structured_v2_20261011/**'
  workflow_dispatch:

jobs:
  lean:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|tree-split-structured-v2-lean.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|tree-split-structured-v2-lean.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: research/ic_tree_split_structured_v2_20261011
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 research/ic_tree_split_structured_v2_20261011
      - name: Install Lean (toolchain pinned by lean/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Harness self-test, and Data.lean regenerated from the records
        run: |
          cargo build --release --example tree_split_structured_v2
          bin=../../target/release/examples/tree_split_structured_v2
          $bin selftest
          $bin lean runs/registered/cells.jsonl /tmp/Data.lean
          diff -u lean/TreeSplit2/Data.lean /tmp/Data.lean
          $bin readout runs/registered/cells.jsonl | diff -u runs/registered/readout.txt -
      - name: Rule hash is the registered one
        run: |
          echo "ec513363df351f6559a6d5df31bf107a993fd425c61c46ef986b0f8918bfb1e3  lean/TreeSplit2/Rule.lean" | sha256sum -c -
      - name: lake build (Rule, Verdict by decide)
        working-directory: research/ic_tree_split_structured_v2_20261011/lean
        run: lake build
