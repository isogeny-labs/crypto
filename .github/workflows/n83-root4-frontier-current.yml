name: N83 current-source root4 frontier Tier 1

on:
  push:
    branches: [codex/n83-root4-frontier-20261018]
    paths:
      - research/n83_root4_frontier_current_20261018/dispatch.json

permissions:
  contents: read

concurrency:
  group: n83-root4-frontier-${{ github.ref }}
  cancel-in-progress: false

jobs:
  root4-frontier-stratum:
    if: github.repository == 'aburan28/crypto' && github.ref == 'refs/heads/codex/n83-root4-frontier-20261018'
    strategy:
      fail-fast: false
      matrix:
        stratum: [0, 1]
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|n83-root4-frontier-current.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|n83-root4-frontier-current.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 research/n83_root4_frontier_current_20261018/pilots/k3596.tar.gz

      - name: Replay sealed points dispatch and K3596 pilot
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          root="$RUNNER_TEMP/n83-root4-frontier-stratum-${{ matrix.stratum }}"
          mkdir -p "$root/k3596-pilot"
          python3 research/n83_root4_frontier_current_20261018/generate_fresh.py > "$root/fixture-check.json"
          python3 research/n83_root4_frontier_current_20261018/audit_fresh.py > "$root/exclusion-check.json"
          python3 -m research.n83_root4_frontier_current_20261018.test_provider_jobs > "$root/provider-test.json"
          python3 -m research.n83_root4_frontier_current_20261018.test_select > "$root/selector-test.json"
          python3 -m research.n83_root4_frontier_current_20261018.check_dispatch > "$root/dispatch-check.json"
          tar -xzf research/n83_root4_frontier_current_20261018/pilots/k3596.tar.gz -C "$root/k3596-pilot"
          python3 -m research.n83_root4_frontier_current_20261018.verify_pilot "$root/k3596-pilot/pilot_work" > "$root/k3596-pilot-check.json"
          python3 research/n83_root4_frontier_current_20261018/run.py --preflight --stratum "${{ matrix.stratum }}" > "$root/schedule-preflight.json"
          rustc --version > "$root/rustc-version.txt"
          cargo --version > "$root/cargo-version.txt"

      - name: Build and test exact IC and same-point rho producers
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/n83-root4-frontier-stratum-${{ matrix.stratum }}"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-root4-frontier-stratum-${{ matrix.stratum }}-target"
          export CARGO_BUILD_JOBS=2
          cargo test --release --locked --example koblitz_orbit_dlp_fast > "$root/ic-example-tests.log" 2>&1
          cargo test --release --locked --example n83_rho_optimization_eval > "$root/rho-example-tests.log" 2>&1
          cargo build --release --locked --example koblitz_orbit_dlp_fast > "$root/ic-build.log" 2>&1
          cargo build --release --locked --example n83_rho_optimization_eval > "$root/rho-build.log" 2>&1

      - name: Run three factor bases with calibrated same-point rho
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/n83-root4-frontier-stratum-${{ matrix.stratum }}"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/n83-root4-frontier-stratum-${{ matrix.stratum }}-target"
          python3 research/n83_root4_frontier_current_20261018/run.py \
            --stratum "${{ matrix.stratum }}" \
            --binary "$CARGO_TARGET_DIR/release/examples/koblitz_orbit_dlp_fast" \
            --rho-binary "$CARGO_TARGET_DIR/release/examples/n83_rho_optimization_eval" \
            --output "$root/results" 2>&1 | tee "$root/run.log"

      - name: Independently replay bases relations scalars and resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/n83-root4-frontier-stratum-${{ matrix.stratum }}"
          if [ -d "$root/results" ]; then
            python3 research/n83_root4_frontier_current_20261018/verify.py \
              "$root/results" --stratum "${{ matrix.stratum }}" 2>&1 | tee "$root/verify.log"
          fi

      - name: Preserve all raw receipts and failed pairs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-root4-frontier-stratum-${{ matrix.stratum }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-root4-frontier-stratum-${{ matrix.stratum }}/
          if-no-files-found: error
          retention-days: 14
