name: ecbench-smoke
# A fresh, self-contained ecbench session on every pull request that can change
# what ecbench builds or measures (docs/ecbench/README.md).
#
# Unlike ecbench.yml's `harness` job, this check reads nothing from the
# artifact store and references no secret. It builds the binary from the tree
# under review, validates every committed smoke spec, runs the two smoke
# sessions (prime and Koblitz) unprivileged at L0, audits each with every
# measured run replayed, and requires every record to be a verified answer.
# It checks the harness machinery and replay determinism, never the numbers:
# a hosted runner is a shared VM, so no figure here is a measurement.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecbench-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  scope:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ecbench_replay: ${{ steps.scope.outputs.ecbench_replay }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/factor-base/
            /.github/scripts/
            /build.rs
            /rustfmt.toml
            /clippy.toml
            /rust-toolchain*
            /src/
            /tests/
            /examples/
            /benches/
            /experiments/koblitz-s3-pair-query-20261007-v4/baseline.rs
            /experiments/koblitz-s3-pair-query-20261007-v4/candidate.rs
      - id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node .github/scripts/ci-scope.mjs

  smoke:
    # Fail closed: a failed classification runs the check rather than skip it.
    if: >-
      always() && !cancelled() && !github.event.pull_request.draft &&
      (needs.scope.result != 'success' || needs.scope.outputs.ecbench_replay != 'false')
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Cargo.toml
            /Cargo.lock
            /.cargo/
            /.github/scripts/
            /build.rs
            /rustfmt.toml
            /clippy.toml
            /rust-toolchain*
            /src/
            /tests/
            /examples/
            /benches/
            /tools/factor-base/
            /tools/volcano-cli/
            /isogeny_algos/
            /docs/ecbench/
            /experiments/koblitz-s3-pair-query-20261007-v4/baseline.rs
            /experiments/koblitz-s3-pair-query-20261007-v4/candidate.rs
      - name: Materialize compile-time inputs without unrelated archives
        run: node .github/scripts/ci-scope.mjs --materialize
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ecbench
      - name: Build ecbench
        run: cargo build --release --locked --bin ecbench
      - name: Every committed smoke spec validates
        run: |
          shopt -s nullglob
          specs=(docs/ecbench/specs/smoke-*.json docs/ecbench/specs/claim-*.json)
          test "${#specs[@]}" -gt 0 || { echo '::error::no smoke specs found'; exit 1; }
          for s in "${specs[@]}"; do
            ./target/release/ecbench plan --spec "$s" --json > /dev/null || { echo "::error file=$s::spec does not validate"; exit 1; }
          done
          echo "${#specs[@]} smoke/claim specs validate" >> "$GITHUB_STEP_SUMMARY"
      - name: Host report
        run: ./target/release/ecbench host | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fresh sessions (L0, unprivileged)
        run: |
          for s in prime koblitz; do
            ./target/release/ecbench run --spec "docs/ecbench/specs/smoke-$s.json" \
              --out "$RUNNER_TEMP/$s" --cpus none --lock "$RUNNER_TEMP/$s.lock" \
              --allow-busy --settle 1 --quiet
          done
      - name: Every record is a verified answer
        run: |
          for s in prime koblitz; do
            n=$(jq -s 'length' "$RUNNER_TEMP/$s/records.jsonl")
            jq -s -e 'length > 0 and (map(.outcome.status) | all(. == "verified"))' \
              "$RUNNER_TEMP/$s/records.jsonl" > /dev/null \
              || { echo "::error::smoke-$s has a record that is not a verified answer"; exit 1; }
            echo "smoke-$s: $n records, all verified" >> "$GITHUB_STEP_SUMMARY"
          done
          test "$(jq -s 'length' "$RUNNER_TEMP/prime/records.jsonl")" = 72
      - name: Audit with every run replayed
        run: |
          for s in prime koblitz; do
            ./target/release/ecbench verify --dir "$RUNNER_TEMP/$s" --replay-all \
              --out "$RUNNER_TEMP/$s-audit.json" > /dev/null
          done
      - name: Compare and tabulate
        run: |
          ./target/release/ecbench compare --dir "$RUNNER_TEMP/prime" --a rho-neg --b bsgs-neg | tee -a "$GITHUB_STEP_SUMMARY"
          ./target/release/ecbench compare --dir "$RUNNER_TEMP/prime" --a rho-neg --b rho-neg-aa > /dev/null
          ./target/release/ecbench table --dir "$RUNNER_TEMP/prime" --dir "$RUNNER_TEMP/koblitz" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Database loads, twice, strictly
        run: |
          command -v sqlite3 >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3; }
          for _ in 1 2; do
            ./target/release/ecbench db sql "$RUNNER_TEMP/prime" "$RUNNER_TEMP/koblitz" | sqlite3 -bail "$RUNNER_TEMP/ecbench.db"
          done
          test "$(sqlite3 "$RUNNER_TEMP/ecbench.db" 'select count(*) from runs')" -gt 72
