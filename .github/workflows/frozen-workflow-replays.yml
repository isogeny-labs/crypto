name: Frozen workflow replays
# Research evidence pins the exact bytes of 30 workflows (see
# .github/scripts/frozen-workflow-pins.json). Those workflows now follow current
# CI policy (runners, the merge set, checkout fixes), so their live bytes no
# longer match the pins. Instead of reverting them, this job checks custody of
# every pin and runs each study's unchanged ci_replay.py in an isolated view
# that restores its pinned workflow bytes from Git
# (.github/scripts/frozen-workflow-check.mjs). Evidence and live workflows are
# never edited. Not a pull-request check: the merge set is gate, size, and
# artifacts (AGENTS.md). This runs when a matching change is on main, weekly,
# or on dispatch.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frozen-workflow-replays.yml'
      - '.github/scripts/frozen-workflow-check.mjs'
      - '.github/scripts/run-frozen-workflow-replays.mjs'
      - '.github/scripts/frozen-workflow-pins.json'
      - 'research/notes/ecc2k130/**'
      - '.github/workflows/ecc2k130-dag-linux-v2-outcome-replay.yml'
      - '.github/workflows/ecc2k130-factor-base-orbit-holdouts.yml'
      - '.github/workflows/ecc2k130-leaf-m10-support.yml'
      - '.github/workflows/ecc2k130-m10-capacity-once.yml'
      - '.github/workflows/ecc2k130-m3-base-selector-source.yml'
      - '.github/workflows/ecc2k130-m3-four-policy.yml'
      - '.github/workflows/ecc2k130-n13-oaware-sat-benchmark.yml'
      - '.github/workflows/ecc2k130-n13-s5-fullpoint-control.yml'
      - '.github/workflows/ecc2k130-n13-s5-solver-panel.yml'
      - '.github/workflows/ecc2k130-n19-s6-fullpoint-exporter.yml'
      - '.github/workflows/ecc2k130-native-fullpoint-edge.yml'
      - '.github/workflows/ecc2k130-native-m3-chain.yml'
      - '.github/workflows/ecc2k130-oaware-sparse-dense-sat.yml'
      - '.github/workflows/ecc2k130-phase-charged-successor-design.yml'
      - '.github/workflows/ecc2k130-rotated-nearthreshold-slot.yml'
      - '.github/workflows/ecc2k130-rotated-phase-selector.yml'
      - '.github/workflows/ecc2k130-rotated-slot-placement.yml'
      - '.github/workflows/ecc2k130-rotated-solver-admission.yml'
      - '.github/workflows/ecc2k130-s3-sparse-cnf.yml'
      - '.github/workflows/ecc2k130-s3-sparse-n19-growth.yml'
      - '.github/workflows/ecc2k130-s3-sparse-n19-linear-replay.yml'
      - '.github/workflows/ecc2k130-symbolic-dag-dimacs-gate.yml'
      - '.github/workflows/ecc2k130-symbolic-dag-dimacs-linux-preparation.yml'
      - '.github/workflows/ecc2k130-symbolic-dag-dimacs-linux-v2-check.yml'
      - '.github/workflows/ecc2k130-symbolic-dag-dimacs-linux-v2-measure.yml'
      - '.github/workflows/ecc2k130-symbolic-dag-fullpoint.yml'
      - '.github/workflows/ecc2k130-symbolic-oaware-width-gate.yml'
      - '.github/workflows/endomorphism-search.yml'
      - '.github/workflows/n53-target-cyclic-rank.yml'
      - '.github/workflows/p192-geometry-collector-lean.yml'
  schedule:
    - cron: '17 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-workflow-replays-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replays:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history without blobs: four frozen preflights assert Git
          # ancestry (merge-base --is-ancestor), and the pinned revision's
          # workflow bytes are read with git show; blobs arrive on demand.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            research/notes/ecc2k130
      - name: Custody of every pin, then each replay in its isolated view
        run: node .github/scripts/run-frozen-workflow-replays.mjs
