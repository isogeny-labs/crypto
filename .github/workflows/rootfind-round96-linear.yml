name: Rootfind round96 linear quotient-ring A/B
on:
  push:
    branches:
      - 'automation/rootfind-column-accumulator-round89-20261121'
    paths:
      - 'src/cryptanalysis/prime_root_trace.rs'
      - 'research/amm_digit_perf_20261118/round96_linear_ab.py'
      - '.github/workflows/rootfind-round96-linear.yml'
  pull_request:
    paths:
      - 'src/cryptanalysis/prime_root_trace.rs'
      - 'research/amm_digit_perf_20261118/round96_linear_ab.py'
      - '.github/workflows/rootfind-round96-linear.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-exact-round96:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round96_linear_ab.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Run source-exact native Rust A/B and regression tests
        env:
          ROOTFIND_BASELINE_REF: 2b5100f506001e3947658886731b9b4dbad4738e
          ROOTFIND_AB_OUTPUT: research/amm_digit_perf_20261118/round96_native_ab.csv
        run: python3 research/amm_digit_perf_20261118/round96_linear_ab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfind-round96-native-ab
          path: research/amm_digit_perf_20261118/round96_native_ab.csv
