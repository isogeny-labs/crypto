name: Koblitz Stage 29 public unknown target

on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  public-target-control:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|koblitz-stage29-public-target.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|koblitz-stage29-public-target.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/sat_factor_base_review_20260908/continuation-05-sota-gates
      - uses: dtolnay/rust-toolchain@stable
      - name: Test known and scalar-blind workflow targets
        run: |
          cp research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-20-rust-build/Cargo.lock Cargo.lock
          bash .github/scripts/frozen-lock-source.sh
          cargo test --release --locked --test ic_framework -- --test-threads=1
