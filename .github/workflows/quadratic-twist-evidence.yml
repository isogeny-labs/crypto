name: Quadratic twist historical evidence audit

on:
  pull_request:
    paths:
      - 'research/quadratic_twist_evidence_20261021/**'
      - '.github/workflows/quadratic-twist-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/quadratic_twist_evidence_20261021
      - name: Install native audit dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ libssl-dev jq xz-utils
      - name: Audit historical certificates natively
        run: bash research/quadratic_twist_evidence_20261021/run-audit.sh
      - name: Check corrupted-source and false-relation controls
        run: bash research/quadratic_twist_evidence_20261021/test-audit.sh
      - name: Upload native audit receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadratic-twist-native-audit
          path: research/quadratic_twist_evidence_20261021/audits/
          if-no-files-found: error
