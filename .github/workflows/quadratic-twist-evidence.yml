name: Quadratic twist native parity and audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'research/quadratic_twist_evidence_20261021/**'
      - '.github/workflows/quadratic-twist-evidence.yml'
      - 'docs/curves/sources/quadratic-twist-native-20261021.json'
      - 'src/cryptanalysis/identity_certificate.rs'
      - 'src/cryptanalysis/curve_id.rs'
      - 'src/binary_ecc/f2m.rs'
      - 'src/binary_ecc/operation_tally.rs'
      - 'docs/curves/registry.json'
      - '.github/scripts/run_frozen_registry_replay.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-audit:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/run_frozen_registry_replay.py
            /research/quadratic_twist_evidence_20261021/
            /docs/curves/registry.json
            /docs/curves/sources/quadratic-twist-native-20261021.json
            /docs/curves/sources/.artifacts.json
            /tools/artifacts/
            /.artifacts/
            /docs/identity-certificates/schoenhage-10mult.json
            /docs/ic/calibration.json
            /src/binary_ecc/f2m.rs
            /src/binary_ecc/operation_tally.rs
            /src/hash/sha256.rs
            /src/cryptanalysis/curve_id.rs
            /src/cryptanalysis/curve_aliases.json
            /src/cryptanalysis/identity_certificate.rs
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 docs/curves/sources research/quadratic_twist_evidence_20261021
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Install native audit dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ libssl-dev jq xz-utils ripgrep
      - name: Audit historical certificates natively
        run: bash research/quadratic_twist_evidence_20261021/run-audit.sh
      - name: Check corrupted-source and false-relation controls
        run: bash research/quadratic_twist_evidence_20261021/test-audit.sh
      - name: Replay every historical finite workload natively
        run: bash research/quadratic_twist_evidence_20261021/run-native.sh "$RUNNER_TEMP/twist-native"
      - name: Reject false new relations and incomplete coverage
        run: bash research/quadratic_twist_evidence_20261021/test-native.sh "$RUNNER_TEMP/twist-native" "$RUNNER_TEMP/twist-controls"
      - name: Check native identity backend tests
        run: cargo test --release --locked --manifest-path research/quadratic_twist_evidence_20261021/native/metadata/Cargo.toml
      - name: Reproduce identity certificates and registered models
        run: bash research/quadratic_twist_evidence_20261021/test-metadata.sh "$RUNNER_TEMP/twist-native" "$RUNNER_TEMP/twist-metadata"
      - name: Report registry admission inputs after a failed replay
        if: ${{ failure() }}
        shell: bash
        run: |
          metadata_dir="$RUNNER_TEMP/twist-metadata"
          if [[ -f "$metadata_dir/registry-update.json" ]]; then
            cat "$metadata_dir/registry-update.json"
            jq -n \
              --slurpfile catalog "$metadata_dir/curve-models.json" \
              --slurpfile registry docs/curves/registry.json \
              --slurpfile aliases src/cryptanalysis/curve_aliases.json '
              (reduce $registry[0].curves[] as $row ({}; .[$row.slug] = true)) as $registered |
              [$catalog[0].models[] | select($registered[.slug] != true) | {slug, icv1}] as $missing_models |
              [$catalog[0].models[] | . as $model |
                [$model.slug, $model.icv1][] | ascii_downcase | . as $key |
                select($aliases[0].aliases[$key] == null) |
                {key: $key, slug: $model.slug}] as $missing_aliases |
              {missing_registry_rows: ($missing_models | length),
               missing_alias_keys: ($missing_aliases | length),
               missing_model_examples: $missing_models[0:20],
               missing_alias_examples: $missing_aliases[0:20]}'
          fi
      - name: Replay mixed Frobenius words with independent native arithmetic
        run: python3 .github/scripts/run_frozen_registry_replay.py mixed "$RUNNER_TEMP/twist-mixed"
      - name: Check mixed-audit native identity backend tests
        run: cargo test --release --locked --manifest-path research/quadratic_twist_evidence_20261021/native/mixed-audit/Cargo.toml
      - name: Replay source-bound group-map polynomial identities and controls
        run: bash research/quadratic_twist_evidence_20261021/run-group-map.sh "$RUNNER_TEMP/twist-group-map"
      - name: Replay twist-assisted pairing transfers, independent arithmetic and controls
        run: python3 .github/scripts/run_frozen_registry_replay.py pairing "$RUNNER_TEMP/twist-pairing"
      - name: Replay conditional yield-cost polynomial and source controls
        run: bash research/quadratic_twist_evidence_20261021/run-yield.sh "$RUNNER_TEMP/twist-yield"
      - name: Replay actual S3 useful yield, degrees and scalar transfers
        run: python3 .github/scripts/run_frozen_registry_replay.py s3-yield "$RUNNER_TEMP/twist-s3-yield"
      - name: Upload native audit receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadratic-twist-native-audit
          path: |
            research/quadratic_twist_evidence_20261021/audits/
            ${{ runner.temp }}/twist-registry-inputs/
            ${{ runner.temp }}/twist-native/
            ${{ runner.temp }}/twist-controls/
            ${{ runner.temp }}/twist-metadata/
            ${{ runner.temp }}/twist-mixed/
            ${{ runner.temp }}/twist-group-map/
            ${{ runner.temp }}/twist-pairing/
            ${{ runner.temp }}/twist-yield/
            ${{ runner.temp }}/twist-s3-yield/
          if-no-files-found: error
