name: P-192 overlap-anchor Lean and coordinate replay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p192-overlap-anchor-lean.yml'
      - 'research/p192_extension_cover_20261012/*overlap_anchor*'
      - 'research/p192_extension_cover_20261012/lean/OverlapAnchorBound.lean'
      - 'research/p192_extension_cover_20261012/lean/lakefile.toml'
      - 'research/p192_extension_cover_20261012/reports/run-20261027-overlap-anchor/**'
  workflow_dispatch:

jobs:
  overlap-anchor-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/p192_extension_cover_20261012
            tools/artifacts
            .artifacts
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 2 research/p192_extension_cover_20261012/type_i_residual_endpoint_clique_pilot.json
      - name: Build and fresh-check overlap bound
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/p192_extension_cover_20261012/lean
          auto-config: false
          use-mathlib-cache: true
          build: true
          build-args: 'OverlapAnchorBound'
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose OverlapAnchorBound'
      - name: Audit axioms and replay frozen geometry
        run: |
          cd research/p192_extension_cover_20261012/lean
          lake env lean OverlapAnchorBound.lean
          cd ../../..
          python3 -B research/p192_extension_cover_20261012/screen_overlap_anchor.py
          python3 -B research/p192_extension_cover_20261012/analyze_overlap_anchor_field_incidence.py
          python3 -B research/p192_extension_cover_20261012/verify_overlap_anchor_relation_fan.py
          python3 -B research/p192_extension_cover_20261012/analyze_overlap_anchor_combined_rows.py
          sha256sum -c research/p192_extension_cover_20261012/reports/run-20261027-overlap-anchor/ARTIFACTS.sha256
