name: N83 scalar arithmetic Lean proofs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'research/n83_speed_20261012/audit/**'
      - '.github/workflows/n83-scalar-arithmetic-lean.yml'
  push:
    branches: [main]
    paths:
      - 'research/n83_speed_20261012/audit/**'
      - '.github/workflows/n83-scalar-arithmetic-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proofs:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/n83_speed_20261012/audit
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 research/n83_speed_20261012/audit
      - name: Install proof-source validation tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Reject incomplete or bypassed proof sources
        run: |
          command -v rg >/dev/null
          if rg -n '\b(sorry|admit|sorryAx|axiom|native_decide)\b|^#eval' ScalarArithmetic.lean AxiomAudit.lean; then
            echo 'Incomplete proof or unverified evaluation is not permitted.'
            exit 1
          fi
      - name: Build proofs and replay in a fresh kernel
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/n83_speed_20261012/audit
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: '--fresh --verbose ScalarArithmetic'
      - name: Audit every theorem's transitive axioms
        run: |
          set -euo pipefail
          lake env lean AxiomAudit.lean | tee /tmp/n83-scalar-axioms.log
          test "$(rg -c 'depends on axioms:' /tmp/n83-scalar-axioms.log)" -eq 4
          unexpected=$(sed -n 's/.*depends on axioms: \[\(.*\)\]/\1/p' /tmp/n83-scalar-axioms.log |
            tr ',' '\n' | sed 's/ //g' |
            rg -v '^$|^(propext|Classical.choice|Quot.sound)$' || true)
          if test -n "$unexpected"; then
            echo 'Unexpected theorem axioms:'
            printf '%s\n' "$unexpected"
            exit 1
          fi
