name: ECC2K-130 m3 probe-order bound replay

on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-m3-probe-order-bound.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-m3-probe-order-bound.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research/notes/ecc2k130/m3_probe_order_bound_20260930
            research/notes/ecc2k130/m3_four_policy_20260930
            research/ecc2k130_factor_base_pilot_20260924
            research/ecc2k130_factor_base_replication_20260925
            research/ecc2k130_dual_transport_20260925
            research/ecc2k130_relations
            research/ecc2k130_oriented_transport_20260924
            .github/workflows/ecc2k130-m3-four-policy.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recompute exact bound and compare receipt
        run: |
          python3 -m py_compile research/notes/ecc2k130/m3_probe_order_bound_20260930/derive.py
          python3 research/notes/ecc2k130/m3_probe_order_bound_20260930/derive.py \
            --out "$RUNNER_TEMP/m3-probe-order-bound.json"
          cmp "$RUNNER_TEMP/m3-probe-order-bound.json" \
            research/notes/ecc2k130/m3_probe_order_bound_20260930/BOUND.json
