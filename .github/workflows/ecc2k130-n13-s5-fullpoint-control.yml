name: ECC2K-130 n13 S5 full-point control preflight
on:
  pull_request:
    paths:
      - 'research/notes/ecc2k130/n13_s5_fullpoint_control_20260925/**'
      - '.github/workflows/ecc2k130-n13-s5-fullpoint-control.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-input-and-toy:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-n13-s5-fullpoint-control.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-n13-s5-fullpoint-control.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/notes/ecc2k130
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen source, input archive and syntax
        run: python3 research/notes/ecc2k130/n13_s5_fullpoint_control_20260925/ci_replay.py
      - name: Replay only the n2 toy complete-model control
        run: |
          python3 research/notes/ecc2k130/n13_s5_fullpoint_control_20260925/selftest.py > /tmp/s5-toy-selftest.json
          cmp /tmp/s5-toy-selftest.json research/notes/ecc2k130/n13_s5_fullpoint_control_20260925/evidence/toy_selftest.json
