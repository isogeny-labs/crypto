name: Independent relation collector profile

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/independent-relation-profile.yml
      - research/independent_relation_throughput_20261124/**

permissions:
  contents: read

concurrency:
  group: independent-relation-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  callgrind:
    if: github.event.pull_request.head.ref == 'codex/independent-relations-per-second'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            Cargo.toml
            Cargo.lock
      - name: Materialize exact build and profile inputs
        run: |
          scripts/sparse-checkout.sh apply --profile minimal \
            --path research/ecbench_phased_panel_20261117 \
            --path research/independent_relation_throughput_20261124/sampler-pool-spec.json
      - name: Install profiler and Rust toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind
          valgrind --version
          rustup update stable --no-self-update
          rustc +stable -Vv
      - name: Build exact ecbench binary
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: cargo +stable build --locked --release --bin ecbench
      - name: Profile matched pool-64, pool-128, and pool-256 executions
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/independent-relation-profile"
          spec=research/independent_relation_throughput_20261124/sampler-pool-spec.json
          mkdir -p "$out"
          {
            git rev-parse HEAD
            git status --short
            rustc +stable -Vv
            cargo +stable -V
            valgrind --version
            uname -a
            lscpu
            sha256sum target/release/ecbench "$spec"
          } > "$out/PROVENANCE.txt"

          target/release/ecbench plan --spec "$spec" --json > "$out/plan.json"

          for arm in p64 p128 p256; do
            case "$arm" in
              p64) name=tw2cj-lazy-sib8-p64 ;;
              p128) name=tw2cj-lazy-sib8-p128 ;;
              p256) name=tw2cj-lazy-sib8-p256 ;;
            esac
            seq=$(jq -r --arg name "$name" '
              . as $plan
              | ($plan.arms | map(.name) | index($name)) as $arm_index
              | $plan.executions[]
              | select(.arm == $arm_index and .workload == 0 and .warmup == false)
              | .seq' "$out/plan.json")
            test "$(printf '%s\n' "$seq" | wc -l | tr -d ' ')" = 1
            dir="$out/$arm"
            mkdir -p "$dir"
            target/release/ecbench profile-input --spec "$spec" --seq "$seq" > "$dir/input.json"
            target/release/ecbench exec < "$dir/input.json" > "$dir/unprofiled-child.json"
            ECBENCH_CALLGRIND_SOLVE=1 timeout 600s valgrind \
              --tool=callgrind --cache-sim=no --branch-sim=no \
              --callgrind-out-file="$dir/callgrind.out" \
              target/release/ecbench exec < "$dir/input.json" \
              > "$dir/profiled-child.json" 2> "$dir/callgrind.log"
            target/release/ecbench callgrind-ir --prefix "$dir/callgrind.out" > "$dir/solve-ir.json"
            callgrind_annotate --inclusive=yes --tree=both --threshold=0.1 \
              "$dir/callgrind.out" > "$dir/annotate-inclusive.txt"
            jq -e '.error == null and .report.exhausted == false and .report.recovered != null' \
              "$dir/unprofiled-child.json" "$dir/profiled-child.json" > /dev/null
            jq -S '{error,workload_id,method_id,report:{recovered:.report.recovered,
              exhausted:.report.exhausted,work:.report.work,counters:.report.counters}}' \
              "$dir/unprofiled-child.json" > "$dir/unprofiled-semantic.json"
            jq -S '{error,workload_id,method_id,report:{recovered:.report.recovered,
              exhausted:.report.exhausted,work:.report.work,counters:.report.counters}}' \
              "$dir/profiled-child.json" > "$dir/profiled-semantic.json"
            cmp "$dir/unprofiled-semantic.json" "$dir/profiled-semantic.json"
            jq --argjson solve_ir "$(jq -r .solve_ir "$dir/solve-ir.json")" '
              (.report.phases[] | select(.name == "oracle_setup")) as $setup
              | (.report.phases[] | select(.name == "relations")) as $relations
              | {
                  solve_ir: $solve_ir,
                  recovered: .report.recovered,
                  matrix_rank: .report.counters.matrix_rank,
                  matrix_rows: .report.counters.matrix_rows,
                  matrix_dependent: .report.counters.matrix_dependent,
                  sibling_second_points: $setup.work_native.sibling_second_points,
                  table_insert_attempts: $setup.work_native.table_insert_attempts,
                  tw_sib_parents: $relations.native.tw_sib_parents,
                  tw_steps_rank_three: $relations.native.tw_steps_rank_three,
                  tw_zero_rows: $relations.native.tw_zero_rows,
                  tw_collisions: $relations.native.tw_collisions
                }' "$dir/profiled-child.json" > "$dir/arm-summary.json"
            sha256sum "$dir"/* > "$dir/SHA256SUMS"
          done

          jq -n --slurpfile p64 "$out/p64/arm-summary.json" \
            --slurpfile p128 "$out/p128/arm-summary.json" \
            --slurpfile p256 "$out/p256/arm-summary.json" \
            '{schema:"independent-relation-profile/v2", unit:"callgrind.Ir",
              p64:$p64[0], p128:$p128[0], p256:$p256[0]}' \
            > "$out/SUMMARY.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: independent-relation-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/independent-relation-profile
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
