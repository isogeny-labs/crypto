name: APS single-relation correctness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'src/cryptanalysis/aps_single_relation.rs'
      - 'src/cryptanalysis/aps_single_relation/**'
      - 'src/cryptanalysis/f4_fp.rs'
      - 'src/cryptanalysis/glv_invariant_base.rs'
      - 'src/cryptanalysis/prime_fast.rs'
      - 'examples/aps_single_relation_check.rs'
      - 'research/aps_extensions_20261026/**'
      - 'research/aps_followup_20261028/**'
      - 'research/aps_replay_20261029/**'
      - '.github/workflows/aps-single-relation.yml'
  push:
    branches: [main]
    paths:
      - 'src/cryptanalysis/aps_single_relation.rs'
      - 'src/cryptanalysis/aps_single_relation/**'
      - 'src/cryptanalysis/f4_fp.rs'
      - 'src/cryptanalysis/glv_invariant_base.rs'
      - 'src/cryptanalysis/prime_fast.rs'
      - 'examples/aps_single_relation_check.rs'
      - 'research/aps_extensions_20261026/**'
      - 'research/aps_followup_20261028/**'
      - 'research/aps_replay_20261029/**'
      - '.github/workflows/aps-single-relation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|aps-single-relation.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|aps-single-relation.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      # Correctness builds of the large library; no timings are measured here.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 256
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/factor-base/
            /Cargo.toml
            /Cargo.lock
            /.cargo/
            /build.rs
            /src/
            /examples/
            /tools/volcano-cli/
            /isogeny_algos/
            /.github/scripts/
      - name: Materialize compile-time inputs
        run: node .github/scripts/ci-scope.mjs --materialize
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98'
      - uses: Swatinem/rust-cache@v2
      - name: Exact solution sets, informative relations, invalid inputs and deadlines
        run: cargo test --release --locked --lib aps_single_relation -- --test-threads=2
      - name: Public fixture runner and identity certificate
        run: cargo test --release --locked --example aps_single_relation_check
      - name: Streaming substitution, exact domains and rational-factor roots
        run: |
          cargo test --release --locked --lib f4_fp -- --test-threads=2
          cargo test --release --locked --lib glv_invariant_base -- --test-threads=2

  lean:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|aps-single-relation.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|aps-single-relation.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/aps_extensions_20261026/lean
            research/aps_followup_20261028/lean
            tools/lean
      - name: Install the pinned core-only Lean toolchain
        run: |
          toolchain=$(cat research/aps_extensions_20261026/lean/lean-toolchain)
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain "$toolchain"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit coefficient lemmas
        run: tools/lean/proof-gate.sh --out /tmp/aps-lean research/aps_extensions_20261026/lean/Coefficients.lean research/aps_followup_20261028/lean/Line.lean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aps-coefficient-proof-receipts
          path: /tmp/aps-lean
          if-no-files-found: error
