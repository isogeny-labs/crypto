name: N83 primary Linux XOR preflight

on:
  push:
    branches:
      - codex/n83-aws-handoff-20261025
    paths:
      - .github/workflows/n83-linux-xor-preflight.yml
      - research/koblitz_n83_factor_base_sweep_20261008/verification/linux-xor-actions-preflight-20261025/smoke.py

permissions:
  contents: read

concurrency:
  group: n83-primary-linux-xor-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'aburan28/crypto' && github.ref == 'refs/heads/codex/n83-aws-handoff-20261025'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      IMAGE_REF: rust:1.98.1-bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
      PREFLIGHT: research/koblitz_n83_factor_base_sweep_20261008/verification/linux-xor-actions-preflight-20261025
      BUNDLE: research/koblitz_n83_factor_base_sweep_20261008/verification/linux-xor-complete-inputs-20261025
    steps:
      - name: Check out pinned mathematical source
        uses: actions/checkout@v4
        with:
          ref: acfcd8adfad8d45ddf9c5f799f9385120dce6cf4
          fetch-depth: 1
          path: source
      - name: Check out preflight protocol
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: protocol
      - name: Record host and source identity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-linux-xor-preflight"
          uname -a > "$RUNNER_TEMP/n83-linux-xor-preflight/uname.txt"
          git -C source rev-parse HEAD > "$RUNNER_TEMP/n83-linux-xor-preflight/source-commit.txt"
          git -C protocol rev-parse HEAD > "$RUNNER_TEMP/n83-linux-xor-preflight/protocol-commit.txt"
          docker pull --platform linux/arm64 "$IMAGE_REF"
          docker image inspect "$IMAGE_REF" --format '{{.Id}} {{.Architecture}} {{.Os}} {{json .RepoDigests}}' \
            > "$RUNNER_TEMP/n83-linux-xor-preflight/image.txt"
      - name: Install and smoke Linux XOR solver
        run: |
          set -euo pipefail
          sudo apt-get update -qq 2>&1 \
            | tee "$RUNNER_TEMP/n83-linux-xor-preflight/apt-update.log"
          sudo apt-get install -y -qq --no-install-recommends cryptominisat 2>&1 \
            | tee "$RUNNER_TEMP/n83-linux-xor-preflight/apt-install.log"
          python3 "protocol/$PREFLIGHT/smoke.py" \
            --out "$RUNNER_TEMP/n83-linux-xor-preflight"
      - name: Build pinned Linux external-model verifier
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n83-cargo" "$RUNNER_TEMP/n83-target"
          docker run --rm --pull never --platform linux/arm64 \
            --cpus 2 --memory 8192m --memory-swap 8192m \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/source,dst=/src,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/n83-cargo,dst=/cargo" \
            --mount "type=bind,src=$RUNNER_TEMP/n83-target,dst=/target" \
            --env CARGO_HOME=/cargo --env CARGO_TARGET_DIR=/target \
            --env CARGO_BUILD_JOBS=2 --workdir /src "$IMAGE_REF" \
            cargo build --release --locked --example koblitz_n83_mixed_orbit_worker \
            > "$RUNNER_TEMP/n83-linux-xor-preflight/worker-build.stdout" \
            2> "$RUNNER_TEMP/n83-linux-xor-preflight/worker-build.stderr"
          install -m 755 \
            "$RUNNER_TEMP/n83-target/release/examples/koblitz_n83_mixed_orbit_worker" \
            "$RUNNER_TEMP/n83-linux-xor-preflight/koblitz_n83_mixed_orbit_worker"
          sha256sum "$RUNNER_TEMP/n83-linux-xor-preflight/koblitz_n83_mixed_orbit_worker" \
            > "$RUNNER_TEMP/n83-linux-xor-preflight/worker.sha256"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      - name: Fresh-fetch and replay all eleven S3 inputs
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --only-binary=:all: \
            --target "$RUNNER_TEMP/n83-pydeps" -r "protocol/$BUNDLE/requirements.txt"
          PYTHONPATH="$RUNNER_TEMP/n83-pydeps" python3 "protocol/$BUNDLE/fetch.py" \
            --out "$RUNNER_TEMP/n83-xor-inputs" \
            > "$RUNNER_TEMP/n83-linux-xor-preflight/input-replay.json"
          PYTHONPATH="$RUNNER_TEMP/n83-pydeps" python3 "protocol/$BUNDLE/verifier_gate.py" \
            --inputs-dir "$RUNNER_TEMP/n83-xor-inputs" \
            --worker "$RUNNER_TEMP/n83-linux-xor-preflight/koblitz_n83_mixed_orbit_worker" \
            --worker-sha256 "$(cut -d ' ' -f 1 "$RUNNER_TEMP/n83-linux-xor-preflight/worker.sha256")" \
            > "$RUNNER_TEMP/n83-linux-xor-preflight/verifier-gate.json"
      - name: Preserve preflight receipts and binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n83-linux-xor-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/n83-linux-xor-preflight/
          if-no-files-found: warn
          retention-days: 90
