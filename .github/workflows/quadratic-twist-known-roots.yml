name: Quadratic twist checked roots native replay

on:
  pull_request:
    paths:
      - 'research/quadratic_twist_evidence_20261021/**'
      - '.github/workflows/quadratic-twist-known-roots.yml'
      - 'src/cryptanalysis/identity_certificate.rs'
      - 'src/hash/sha256.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-known-roots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/quadratic_twist_evidence_20261021/
            /src/hash/sha256.rs
            /src/cryptanalysis/identity_certificate.rs
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ libssl-dev jq ripgrep
      - name: Replay reference and checked-root setup, queries and recovery with independent arithmetic
        run: bash research/quadratic_twist_evidence_20261021/run-known-roots.sh "$RUNNER_TEMP/twist-known-roots"
      - name: Upload complete native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadratic-twist-known-roots
          path: ${{ runner.temp }}/twist-known-roots/
          if-no-files-found: error
