name: Prime31 W8 sign-Fourier RR9 target-conditioned component
on:
  push:
    branches:
      - automation/prime31-rr9-weighted-resultant-20261118
    paths:
      - research/prime31_ic_20261115/native/examples/prime31_w8_sign_fourier.rs
      - research/prime31_ic_20261115/native/verify_prime31_w8_sign_fourier.py
      - research/prime31_ic_20261115/rr9/W8_SIGN_FOURIER_PROTOCOL_20261118.md
      - .github/workflows/prime31-w8-sign-fourier.yml
  pull_request:
    paths:
      - research/prime31_ic_20261115/native/examples/prime31_w8_sign_fourier.rs
      - research/prime31_ic_20261115/native/verify_prime31_w8_sign_fourier.py
      - .github/workflows/prime31-w8-sign-fourier.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-rr9-fourier-original-curve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned original arithmetic crate
        uses: actions/checkout@v4
        with:
          ref: 1df714645aa683cf975bc76fcacb9842cb4780fd
          path: pinned
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Overlay only candidate component example
        run: |
          cp research/prime31_ic_20261115/native/examples/prime31_w8_sign_fourier.rs \
             pinned/research/prime31_ic_20261115/native/examples/prime31_w8_sign_fourier.rs
      - name: Existing original-crate library tests
        run: cargo +1.100.0 test --locked --release --manifest-path pinned/research/prime31_ic_20261115/native/Cargo.toml --lib
      - name: Exact 8192 signed-row Rust test
        run: cargo +1.100.0 test --locked --release --manifest-path pinned/research/prime31_ic_20261115/native/Cargo.toml --example prime31_w8_sign_fourier
      - name: Produce source-specific operation and wall-time JSON
        run: |
          cargo +1.100.0 run --locked --release \
            --manifest-path pinned/research/prime31_ic_20261115/native/Cargo.toml \
            --example prime31_w8_sign_fourier > prime31-w8-sign-fourier.json
          test -s prime31-w8-sign-fourier.json
      - name: Independent Python BigInt replay
        run: python3 research/prime31_ic_20261115/native/verify_prime31_w8_sign_fourier.py prime31-w8-sign-fourier.json
      - name: Archive original-curve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime31-w8-sign-fourier-original-curve
          path: prime31-w8-sign-fourier.json
          retention-days: 30
          if-no-files-found: warn
