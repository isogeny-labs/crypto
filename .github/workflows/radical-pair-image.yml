name: Radical pair-image evidence

on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|radical-pair-image.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|radical-pair-image.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen evidence and report syntax
        run: |
          python3 -m json.tool research/radical_pair_image_20260921/contract.json >/dev/null
          python3 research/radical_pair_image_20260921/audit.py \
            research/radical_pair_image_20260921/results/run-003
          python3 research/radical_pair_image_20260921/thread_scaling.py verify \
            --output research/radical_pair_image_20260921/results/thread-scaling-001
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          parser = HTMLParser()
          parser.feed(Path("docs/index-calculus-scoreboard.html").read_text())
          parser.close()
          print("scoreboard HTML: pass")
          PY
