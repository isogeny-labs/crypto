name: Rootfind round111 traced division source-exact A/B
on:
  push:
    branches:
      - automation/rootfind-column-accumulator-round89-20261121
    paths:
      - src/cryptanalysis/prime_root_trace.rs
      - research/amm_digit_perf_20261118/round111_ab.py
      - .github/workflows/rootfind-round111-ab.yml
  pull_request:
    branches:
      - main
    paths:
      - src/cryptanalysis/prime_root_trace.rs
      - research/amm_digit_perf_20261118/round111_ab.py
      - .github/workflows/rootfind-round111-ab.yml
  workflow_dispatch:
jobs:
  round111-source-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          sparse-checkout: |
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round111_ab.py
          sparse-checkout-cone-mode: false
      - name: Fetch frozen round110
        env:
          ROOTFIND_BASELINE_REF: ae4ad5e451f9e04eac6a9ae8d4a1add280a1a555
        run: |
          git cat-file -e "${ROOTFIND_BASELINE_REF}^{commit}" ||
            git fetch --no-tags --depth=1 origin "$ROOTFIND_BASELINE_REF"
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare production Rust round110 vs round111
        env:
          ROOTFIND_AB_TRIALS: "13"
          ROOTFIND_BASELINE_REF: ae4ad5e451f9e04eac6a9ae8d4a1add280a1a555
        run: python3 research/amm_digit_perf_20261118/round111_ab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfind-round111-source-exact-results
          path: research/amm_digit_perf_20261118/round111_full_results.csv
          if-no-files-found: warn
