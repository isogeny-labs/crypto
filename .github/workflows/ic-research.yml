name: ic research framework
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/bin/ic.rs"
      - "src/bin/ic/**"
      - "tests/ic_*.rs"
      - "Cargo.toml"
      - "docs/ic/**"
      - ".github/workflows/ic-research.yml"
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-cli:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ic-research.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ic-research.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    # A cold release build of `ic` alone takes about 6 minutes; whole runs
    # took 7-10 minutes in October 2026 and a 10-minute limit cancelled
    # passing runs mid-test.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build ic
        run: cargo build --release --bin ic
      - name: Parameter and synthetic pipeline checks
        run: cargo test --release --test ic_framework --test ic_progress
      - name: Inspect supplied example documents
        run: |
          target/release/ic inspect --file docs/ic/prime-example.json --json
          target/release/ic inspect --file docs/ic/binary-example.json --json
