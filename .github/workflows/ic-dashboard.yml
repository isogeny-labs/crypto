name: IC dashboard presentation

on:
  pull_request:
    paths:
      - 'docs/index-calculus-scoreboard.html'
      - 'docs/ic/dashboard-overview*'
      - 'tools/*ic_dashboard*.mjs'
      - '.github/workflows/ic-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'docs/index-calculus-scoreboard.html'
      - 'docs/ic/dashboard-overview*'
      - 'tools/*ic_dashboard*.mjs'
      - '.github/workflows/ic-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  overview:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ic-dashboard.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ic-dashboard.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 docs tools
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frozen evidence pins and generated overview
        run: node tools/render_ic_dashboard.mjs --check
      - name: Check actual desktop and mobile rendering
        env:
          IC_DASHBOARD_SCREENSHOTS: /tmp/ic-dashboard-screenshots
        run: node tools/check_ic_dashboard_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ic-dashboard-browser
          path: /tmp/ic-dashboard-screenshots
