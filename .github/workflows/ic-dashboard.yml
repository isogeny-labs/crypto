name: IC dashboard presentation

on:
  pull_request:
    paths:
      - 'docs/index-calculus-scoreboard.html'
      - 'docs/ic/dashboard-overview*'
      - 'tools/*ic_dashboard*.mjs'
      - '.github/workflows/ic-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'docs/index-calculus-scoreboard.html'
      - 'docs/ic/dashboard-overview*'
      - 'tools/*ic_dashboard*.mjs'
      - '.github/workflows/ic-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  overview:
    # Not routed to crypto-eks: the browser check needs Chrome and its system
    # libraries, and that runner image has no browser and no apt-get install.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome for dashboard rendering
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd
        with:
          install-dependencies: true
      - name: Check frozen evidence pins and generated overview
        run: node tools/render_ic_dashboard.mjs --check
      - name: Check actual desktop and mobile rendering
        env:
          IC_DASHBOARD_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          IC_DASHBOARD_SCREENSHOTS: /tmp/ic-dashboard-screenshots
        run: node tools/check_ic_dashboard_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ic-dashboard-browser
          path: /tmp/ic-dashboard-screenshots
