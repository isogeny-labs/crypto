name: Rootfind Round 131 source-exact quadratic split A/B
on:
  push:
    branches:
      - automation/rootfind-round131-quadratic-split-20261123
  pull_request:
    paths:
      - src/cryptanalysis/ecbench/isogeny.rs
      - research/rootfind_round131/**
      - .github/workflows/rootfind_round131.yml
permissions:
  contents: read
jobs:
  native-rust-a-b:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src/cryptanalysis/ecbench/isogeny.rs
            research/rootfind_round131
      - name: Build source-exact baseline and candidate modules
        shell: bash
        run: |
          set -euo pipefail
          BASE=20bb59ed9ec414542fc890cc684ba22eee1f2268
          git fetch --no-tags --depth=1 origin "$BASE"
          mkdir -p /tmp/rootfind_round131
          git show "$BASE:src/cryptanalysis/ecbench/isogeny.rs" > /tmp/rootfind_round131/baseline.rs
          cp src/cryptanalysis/ecbench/isogeny.rs /tmp/rootfind_round131/optimized.rs
          cat research/rootfind_round131/bench_helper.rs >> /tmp/rootfind_round131/baseline.rs
          cat research/rootfind_round131/bench_helper.rs >> /tmp/rootfind_round131/optimized.rs
          cp research/rootfind_round131/source_exact_main.rs /tmp/rootfind_round131/main.rs
          rustc --version
          rustc --edition=2021 -C opt-level=3 -C target-cpu=native /tmp/rootfind_round131/main.rs -o /tmp/rootfind_round131/bench
      - name: Independent oracles and 13-trial alternating source-exact timing
        run: /tmp/rootfind_round131/bench
