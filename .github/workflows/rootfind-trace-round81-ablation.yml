name: Rootfind round81 verifier ablation
on:
  pull_request:
    paths:
      - 'src/cryptanalysis/prime_root_trace.rs'
      - 'research/amm_digit_perf_20261118/round81_ablation.py'
      - '.github/workflows/rootfind-trace-round81-ablation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-variant-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            src/cryptanalysis/prime_root_trace.rs
            research/amm_digit_perf_20261118/round81_ablation.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Isolate producer/verifier variant full solve+verify throughput
        run: |
          set -euo pipefail
          cargo --version
          python3 research/amm_digit_perf_20261118/round81_ablation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round81-variant-ablation-raw-csv
          path: research/amm_digit_perf_20261118/round81_ablation_results.csv
