name: Native hyperelliptic IC
on:
  pull_request:
    paths:
      - 'crates/hec-native-ic/**'
      - 'research/hec_relation_math_20261114/**'
      - 'research/hec_table_oracle_20261114/**'
      - 'research/hec_anchor_relations_20261114/**'
      - '.github/workflows/hec-native-ic.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hec-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            crates/hec-native-ic
            research/hec_relation_math_20261114
            research/hec_table_oracle_20261114
            research/hec_anchor_relations_20261114
            tools/artifacts
            .artifacts
      - name: Pull store data this workflow reads (tools/artifacts)
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 research/hec_anchor_relations_20261114
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --manifest-path crates/hec-native-ic/Cargo.toml -- --check
      - run: cargo test --manifest-path crates/hec-native-ic/Cargo.toml
      - run: cargo test --release --manifest-path crates/hec-native-ic/Cargo.toml
      - run: cargo test --release --manifest-path crates/hec-native-ic/Cargo.toml --example principal_relations --example table_oracle --example anchor_relations --example heldout
      - run: cargo build --release --examples --manifest-path crates/hec-native-ic/Cargo.toml
      - name: Held-out receipt controls (includes expected identity rejection)
        run: crates/hec-native-ic/target/release/examples/heldout --runner-self-test "$RUNNER_TEMP/hec-heldout-receipts"
