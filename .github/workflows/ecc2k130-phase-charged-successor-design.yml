name: ECC2K-130 charged phase successor design
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'research/notes/ecc2k130/rotated_phase_charged_successor_20260925/**'
      - '.github/workflows/ecc2k130-phase-charged-successor-design.yml'
  workflow_dispatch:
jobs:
  pinned-design:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-phase-charged-successor-design.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-phase-charged-successor-design.yml|') && 'crypto-eks-linux' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Hash-only design check
        run: python3 research/notes/ecc2k130/rotated_phase_charged_successor_20260925/check_protocol.py
