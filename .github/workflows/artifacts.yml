name: artifacts
# docs/artifacts.md: data files live in the artifact store (S3), with a
# .artifacts.json manifest in Git. This runs the tool's tests, fails a pull
# request that adds or modifies a tracked file the policy says belongs in the
# store, and checks that every workflow naming moved data pulls it. A PR that
# must commit such a file anyway carries the `large-file-ok` label, which the
# owner or a reviewer adds; the check then reports the files and passes. It
# runs no experiment and touches no remote.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  artifacts:
    # Keep the merge gate available while the optional EKS pools are offline.
    # This is ordinary CPU validation; experiment runner selection is separate.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - name: Free runner disk before checking the full PR tree
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      # Materialize the head's blobs once; sizing thousands of lazy blobs in a
      # sparse checkout exceeded the 25-minute PR job budget.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
      - name: Tool tests
        run: python3 -m unittest tools/artifacts/test_artifacts.py
      - name: No added or modified file that belongs in the store
        env:
          LARGE_FILE_OK: ${{ contains(github.event.pull_request.labels.*.name, 'large-file-ok') }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then exit 0; fi
          if python3 tools/artifacts/artifacts.py check HEAD^1 HEAD; then exit 0; fi
          if [ "$LARGE_FILE_OK" = true ]; then
            echo "::warning::data files committed under the large-file-ok label"
            exit 0
          fi
          exit 1
      - name: Workflows that read moved data pull it
        run: python3 tools/artifacts/wire_workflows.py --check

  pdf-readback:
    # Temporary, manual-only retrieval of this PR's four immutable report PDFs.
    # No PR checkout or repository script executes in this credentialed job.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Read back and hash the original report PDF objects
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-2
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/pdf-readback-awscli"
            "$RUNNER_TEMP/pdf-readback-awscli/bin/pip" install awscli==1.46.2
            export PATH="$RUNNER_TEMP/pdf-readback-awscli/bin:$PATH"
          fi
          out_dir="$RUNNER_TEMP/pr2957-pdfs"
          mkdir -p "$out_dir"
          while read -r artifact_digest artifact_name; do
            aws s3 cp "s3://setec-astronomy-artifacts/store/sha256/${artifact_digest:0:2}/$artifact_digest" "$out_dir/$artifact_name" --only-show-errors
            printf '%s  %s\n' "$artifact_digest" "$out_dir/$artifact_name" | sha256sum -c -
          done <<'PDF_OBJECTS'
          d69e3464a4d542e8c0674bc85973c5e53694ed67243c52a726de7a1b1d1cd231 interim-report.pdf
          2ce84e9449796ef9470537f96bff7fc4e6eef6a7d8400faf3070aff6e848c89a interim-review-packet.pdf
          4901cc5917de9ad14ffe607c66a7751ebf671c1bb73acd4a0af542b2c8621c5e terminal-report.pdf
          765e6b28491dc05846e729e976431e4c41e2c7e17a0e5ea3a5c1b3511e86095d terminal-review-packet.pdf
          PDF_OBJECTS
      - uses: actions/upload-artifact@v4
        with:
          name: pr2957-pdf-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/pr2957-pdfs/*.pdf
          if-no-files-found: error
          retention-days: 2
