name: Rootfind Round 146 source-exact Rust A/B
on:
  push:
    branches:
      - main
      - automation/rootfind-round146-mersenne-chain-20261123
    paths:
      - src/cryptanalysis/ecbench/isogeny.rs
      - research/rootfind_round146/**
      - .github/workflows/rootfind_round146.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-exact:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        replication: [1, 2]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src/cryptanalysis/ecbench/isogeny.rs
            research/rootfind_round144
            research/rootfind_round146
      - name: Compile source-exact baseline and optimized Rust
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 4f4b9fc4ee2ed9a9ae004d93b46482d7f9b675d9
          mkdir -p /tmp/rootfind_round146
          git show FETCH_HEAD:src/cryptanalysis/ecbench/isogeny.rs > /tmp/rootfind_round146/baseline.rs
          echo "baseline $(git rev-parse FETCH_HEAD) candidate $(git rev-parse HEAD)"
          cp src/cryptanalysis/ecbench/isogeny.rs /tmp/rootfind_round146/optimized.rs
          for name in baseline optimized; do
            cat research/rootfind_round146/bench_helper.rs >> "/tmp/rootfind_round146/${name}.rs"
          done
          cp research/rootfind_round144/source_exact_main.rs /tmp/rootfind_round146/main.rs
          rustc --version
          rustc --edition=2021 -C opt-level=3 -C target-cpu=native /tmp/rootfind_round146/main.rs -o /tmp/rootfind_round146/bench
      - name: Differential correctness and before/after benchmarks
        run: /tmp/rootfind_round146/bench
