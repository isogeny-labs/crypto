name: Koblitz Stage 144 current gate audit
on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-current-audit:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|koblitz-stage144-current-gate-audit.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|koblitz-stage144-current-gate-audit.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 docs/ic research/sat_factor_base_review_20260908/continuation-05-sota-gates
      - name: Replay Stage 143 historical audit and Stage 144 current audit
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage143_gate_audit.py scripts/compose_koblitz_stage144_gate_audit.py
          python3 -m json.tool docs/ic/params/k1n59-cofactor-projected-l15-rank-interval4-control-public-59001.json >/dev/null
          python3 -m json.tool docs/ic/runs/koblitz-n59-rank-solve-interval4-rejection-20260922.json >/dev/null
          git apply --check docs/ic/patches/koblitz-n59-rank-solve-interval4-rejected-20260922.patch
          python3 scripts/compose_koblitz_stage143_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-143-current-gate-audit-20260922 > "$RUNNER_TEMP/stage143-historical.json"
          python3 scripts/compose_koblitz_stage144_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-144-current-gate-audit-20260922 > "$RUNNER_TEMP/stage144-current.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
