name: ECC2K-130 native m3 counting admission

on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels this workflow's run for the older commit.
# Every other event (push, schedule, dispatch) gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.workflow_ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replay:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|ecc2k130-native-m3-counting.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|ecc2k130-native-m3-counting.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pull store data this workflow reads (tools/artifacts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 research/notes/ecc2k130
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate exact result from frozen source and inputs
        run: |
          python3 research/notes/ecc2k130/native_m3_counting_admission_20260929/compute.py \
            --out "$RUNNER_TEMP/native-m3-result.json"
          cmp "$RUNNER_TEMP/native-m3-result.json" \
            research/notes/ecc2k130/native_m3_counting_admission_20260929/RESULT.json
      - name: Independently replay integer brackets and parent admission
        run: |
          python3 research/notes/ecc2k130/native_m3_counting_admission_20260929/verify.py \
            --result "$RUNNER_TEMP/native-m3-result.json" \
            --out "$RUNNER_TEMP/native-m3-verify.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          directory = Path('research/notes/ecc2k130/native_m3_counting_admission_20260929')
          archived = json.loads((directory / 'VERIFY.json').read_text())
          replay = json.loads((Path(os.environ['RUNNER_TEMP']) / 'native-m3-verify.json').read_text())
          for key in ('classification', 'result_sha256', 'verifier_sha256',
                      'parent_admission_sha256', 'parent_admission_stdout_sha256',
                      'checks'):
              assert replay[key] == archived[key], key
          print('NATIVE_M3_COUNTING_REPLAY_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-m3-counting-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-m3-result.json
            ${{ runner.temp }}/native-m3-verify.json
          if-no-files-found: warn
          retention-days: 30
