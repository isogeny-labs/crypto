name: Koblitz Stage 134 current gate audit
on:
  # Historical stage control. Manual only: shared fixture path
  # filters used to enqueue dozens of these on one PR and starve
  # GitHub-hosted runners account-wide.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-current-audit:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|koblitz-stage134-current-gate-audit.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|koblitz-stage134-current-gate-audit.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay Stage 133 historical audit and Stage 134 current audit
        run: |
          python3 -m py_compile scripts/compose_koblitz_stage133_gate_audit.py scripts/compose_koblitz_stage134_gate_audit.py
          python3 -m json.tool docs/ic/params/k1n59-cofactor-projected-l14-full-public-59001.json >/dev/null
          python3 -m json.tool docs/ic/runs/koblitz-n59-cofactor-projected-complete-20260921.json >/dev/null
          python3 scripts/compose_koblitz_stage133_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-133-current-gate-audit-20260921 > "$RUNNER_TEMP/stage133-historical.json"
          python3 scripts/compose_koblitz_stage134_gate_audit.py verify --output research/sat_factor_base_review_20260908/continuation-05-sota-gates/stage-134-current-gate-audit-20260921 > "$RUNNER_TEMP/stage134-current.json"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
