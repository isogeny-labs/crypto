name: Toy symmetry quotient
on:
  # Retired 2026-10-11: this gate guards a study that has been quiet for 7+ days, and its
  # push/pull_request triggers were fanning out across the account's shared runners. Run it
  # on demand, or restore its push/pull_request triggers from git history to bring it back.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_HIGHMEM_WORKFLOWS, '|toy-symmetry-quotient.yml|') && 'crypto-eks-highmem' || (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && contains(vars.CRYPTO_EKS_WORKFLOWS, '|toy-symmetry-quotient.yml|') && 'crypto-eks-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact arithmetic, coverage, and negative controls
        run: python3 -m unittest discover -s research/toy_symmetry_quotient_20260924 -p 'test_*.py' -v
      - name: Reproduce the bounded pilot
        run: python3 research/toy_symmetry_quotient_20260924/experiment.py --output "$RUNNER_TEMP/toy-symmetry-results" --repetitions 1
      - uses: actions/upload-artifact@v4
        with:
          name: toy-symmetry-results
          path: ${{ runner.temp }}/toy-symmetry-results
