AWSTemplateFormatVersion: '2010-09-09'
Description: Iso Lab durable job artifacts and container images
Resources:
  Results:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'isolab-results-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}
      Tags: [{Key: project, Value: isolab}]
  ResultsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Results
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt Results.Arn, !Sub '${Results.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  JobPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: isolab-job-artifacts
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [s3:ListBucket]
            Resource: !GetAtt Results.Arn
            Condition: {StringLike: {'s3:prefix': ['runs/*', 'inputs/*']}}
          - Effect: Allow
            Action: [s3:GetObject]
            Resource: [!Sub '${Results.Arn}/inputs/*', !Sub '${Results.Arn}/runs/*']
          - Effect: Allow
            Action: [s3:PutObject, s3:AbortMultipartUpload]
            Resource: !Sub '${Results.Arn}/runs/*'
  Images:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: isolab/tasks
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
      Tags: [{Key: project, Value: isolab}]
Outputs:
  ResultsBucket: {Value: !Ref Results}
  JobPolicyArn: {Value: !Ref JobPolicy}
  ImageRepository: {Value: !GetAtt Images.RepositoryUri}
