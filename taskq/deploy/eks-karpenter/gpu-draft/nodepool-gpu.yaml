# DRAFT, NOT APPLIED. Proposal for a GPU Spot pool next to cpu-spot / cpu-l2-spot.
# Review items are in README.md. Nothing here has been run against the cluster
# (no cluster access in the drafting session); field names follow the Karpenter v1 API
# already used by ../nodepool.yaml.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  amiFamily: AL2023
  # Must be the EKS 1.36 AL2023 NVIDIA variant (driver + container toolkit baked in).
  # Resolve it, then pin by id like ../nodepool.yaml does for the CPU class:
  #   aws ssm get-parameter --region us-east-2 \
  #     --name /aws/service/eks/optimized-ami/1.36/amazon-linux-2023/x86_64/nvidia/recommended/image_id
  amiSelectorTerms:
    - id: REPLACE-WITH-RESOLVED-NVIDIA-AMI-ID
  role: KarpenterNodeRole-isolab
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: isolab
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: isolab
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi   # CUDA images are large; the CPU class uses 80Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  # No CPU-isolation userData: the CPU pools' cpuset/IRQ/kernel-arg isolation is not
  # applied here, so GPU results carry their own admission gates (PROTOCOL.md §2.4).
  tags:
    project: isolab
    managed-by: karpenter
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-spot
spec:
  template:
    metadata:
      labels:
        isolab.dev/role: worker
        isolab.dev/pool: gpu-spot
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      taints:
        - key: isolab.dev/workload     # CPU jobs never tolerate this
          value: gpu
          effect: NoSchedule
        - key: nvidia.com/gpu          # only pods that request a GPU land here
          value: "true"
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot]
        # One RTX PRO 6000 Blackwell (sm_120) per node; the same SKU the ecc2k130 work
        # certifies. Verify these sizes exist in us-east-2 before applying.
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [g7e.2xlarge, g7e.4xlarge]
      expireAfter: Never
      terminationGracePeriod: 1h
  limits:
    cpu: '16'                 # separate from the 64-vCPU CPU envelope; sized for ONE g7e.4xlarge
    memory: 128Gi
    nvidia.com/gpu: '1'
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 2m
    budgets:
      - nodes: "0"
        reasons: [Drifted]
      - nodes: "100%"
        reasons: [Empty]
