apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gha
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - id: ami-082b570a48503ea93 # EKS 1.36 AL2023, v20261012, us-east-2
  role: KarpenterNodeRole-isolab
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: isolab
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: isolab
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 150Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  kubelet:
    kubeReserved:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 1Gi
    systemReserved:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 1Gi
  tags:
    project: isolab
    workload: github-actions
    managed-by: karpenter
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gha-on-demand
spec:
  template:
    metadata:
      labels:
        gha.dev/pool: on-demand
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gha
      taints:
        - key: gha.dev/workload
          value: runner
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: [m, r]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["8", "16", "32"]
        - key: karpenter.k8s.aws/instance-family
          operator: NotIn
          values: [m7i-flex, m8i-flex]
      expireAfter: Never
      terminationGracePeriod: 6h
  limits:
    cpu: "64"
    memory: 512Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
    budgets:
      - nodes: "0"
        reasons: [Drifted]
      - nodes: "100%"
        reasons: [Empty]
