apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gha
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - id: ami-082b570a48503ea93 # EKS 1.36 AL2023, v20261012, us-east-2
  role: KarpenterNodeRole-isolab
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: isolab
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: isolab
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 150Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  kubelet:
    kubeReserved:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 1Gi
    systemReserved:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 1Gi
  tags:
    project: isolab
    workload: github-actions
    managed-by: karpenter
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gha-on-demand
spec:
  template:
    metadata:
      labels:
        gha.dev/pool: on-demand
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gha
      taints:
        - key: gha.dev/workload
          value: runner
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: [r]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["8", "16"]
        - key: karpenter.k8s.aws/instance-family
          operator: NotIn
          values: [m7i-flex, m8i-flex]
      expireAfter: Never
      terminationGracePeriod: 6h
  limits:
    cpu: "16"
    memory: 128Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
    budgets:
      - nodes: "0"
        reasons: [Drifted]
      - nodes: "100%"
        reasons: [Empty]
---
# These legacy pool names and labels remain for ARC scheduling compatibility.
# The capacity-type requirement is Spot; empty runner nodes consolidate after 5m.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gha-on-demand-extra
spec:
  template:
    metadata:
      labels:
        gha.dev/pool: on-demand
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gha
      taints:
        - key: gha.dev/workload
          value: runner
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: [r]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["16"]
      expireAfter: Never
      terminationGracePeriod: 6h
  limits:
    cpu: "16"
    memory: 128Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
    budgets:
      - nodes: "0"
        reasons: [Drifted]
      - nodes: "100%"
        reasons: [Empty]
---
# Extra-high-memory runners for single processes that need more than the
# 120 GiB highmem pod (msolve N=21 at >= 256 GB, a degree-5 dense closure at
# about 768 GB). Memory-optimised x2iedn/x2iezn only, 16 or 32 vCPU (512 GiB
# or 1 TiB), Spot only; one node at a time, inside the 64-vCPU lab cap.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gha-xmem
spec:
  template:
    metadata:
      labels:
        gha.dev/pool: xmem
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gha
      taints:
        - key: gha.dev/workload
          value: runner
          effect: NoSchedule
        - key: gha.dev/pool
          value: xmem
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: [x2iedn, x2iezn]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["16", "32"]
      expireAfter: Never
      terminationGracePeriod: 6h
  limits:
    cpu: "32"
    memory: 1100Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
    budgets:
      - nodes: "0"
        reasons: [Drifted]
      - nodes: "100%"
        reasons: [Empty]
