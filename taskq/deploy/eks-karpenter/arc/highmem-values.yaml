githubConfigUrl: https://github.com/aburan28/crypto
githubConfigSecret: arc-github-auth
runnerScaleSetName: crypto-eks-highmem
minRunners: 0
maxRunners: 1
containerMode:
  type: dind
controllerServiceAccount:
  namespace: arc-system
  name: arc-gha-rs-controller
listenerTemplate:
  spec:
    nodeSelector:
      isolab.dev/role: system
    containers:
      - name: listener
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
template:
  spec:
    automountServiceAccountToken: false
    nodeSelector:
      gha.dev/pool: on-demand
    tolerations:
      - key: gha.dev/workload
        operator: Equal
        value: runner
        effect: NoSchedule
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.0
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "16"
            memory: 112Gi
            ephemeral-storage: 20Gi
          limits:
            cpu: "16"
            memory: 120Gi
            ephemeral-storage: 100Gi
