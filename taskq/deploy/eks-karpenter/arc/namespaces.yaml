apiVersion: v1
kind: Namespace
metadata:
  name: arc-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    # ARC's Docker sidecar is privileged. Keep it off the restricted lab nodes.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: LimitRange
metadata:
  name: runner-container-defaults
  namespace: arc-runners
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 8Gi
      defaultRequest:
        cpu: 500m
        memory: 4Gi
