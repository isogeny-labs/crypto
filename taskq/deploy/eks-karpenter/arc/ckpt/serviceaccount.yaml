# The service account of the extra-high-memory runner pods. The annotation gives
# the pods (and only them) an IAM role that can read and write the checkpoint
# prefix of one bucket. Fill ROLE_ARN with `envsubst`; see CHECKPOINTS.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-xmem-runner
  namespace: arc-runners
  annotations:
    eks.amazonaws.com/role-arn: ${ROLE_ARN}
automountServiceAccountToken: false
