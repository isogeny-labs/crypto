githubConfigUrl: https://github.com/aburan28/crypto
githubConfigSecret: arc-github-auth
runnerScaleSetName: crypto-eks-linux
minRunners: 0
maxRunners: 8
containerMode:
  type: dind
controllerServiceAccount:
  namespace: arc-system
  name: arc-gha-rs-controller
listenerTemplate:
  spec:
    nodeSelector:
      isolab.dev/role: system
    containers:
      - name: listener
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
template:
  spec:
    automountServiceAccountToken: false
    nodeSelector:
      gha.dev/pool: on-demand
    tolerations:
      - key: gha.dev/workload
        operator: Equal
        value: runner
        effect: NoSchedule
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.333.1
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "4"
            memory: 24Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: "4"
            memory: 28Gi
            ephemeral-storage: 80Gi
