 <g class="body"><text x="42" y="119">Source / image / spec</text><text x="42" y="145">Original UTC deadline</text><text x="314" y="119">CRIU + encrypted EBS</text><text x="314" y="145">Full versioned S3 readback</text><text x="586" y="119">Old EC2 terminated</text><text x="586" y="145">Compatible new Spot worker</text><text x="858" y="119">Native replay</text><text x="858" y="145">All timing invalid / L0</text></g>
