 <text x="43" y="267" class="label">One distinct fresh benchmark epoch — new warmup, host checks and A/A</text>
 <text x="43" y="295" class="body">Test E: 1,806 L2 observations · 1,800 native replays · 600 admitted A/A pairs · 19 S3 payload hashes</text>
 <text x="43" y="320" class="body">Failed L2 or A/A is terminal. A controller retry cannot create another measurement epoch.</text>
