apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resume-process-probe
  namespace: isolab-recovery-system
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: resume-process-probe
  namespace: isolab-recovery-system
  labels:
    isolab.dev/recovery-probe: "true"
  annotations:
    karpenter.sh/do-not-disrupt: "true"
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 1800
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: ip-10-84-29-238.us-east-2.compute.internal
  tolerations:
    - {key: isolab.dev/workload, operator: Equal, value: cpu, effect: NoSchedule}
  initContainers:
    - name: tools
      image: 104186811093.dkr.ecr.us-east-2.amazonaws.com/isolab/tasks@sha256:67eea58f5d4a7a8882b55f089c6063bb49fad58d40260ee9b0ceb349fc0e4581
      command:
        - /bin/bash
        - -ec
        - |
          mkdir -p /work/tools/lib /work/checkpoint
          cp /host/usr/local/sbin/criu /work/tools/criu
          cp -L /host/lib64/libnet.so.1 /host/lib64/libnl-3.so.200 /host/lib64/libprotobuf-c.so.1 /work/tools/lib/
          chmod -R a+rX /work/tools
          chmod 1777 /work
      securityContext: {runAsUser: 0, runAsGroup: 0}
      volumeMounts:
        - {name: work, mountPath: /work}
        - {name: host, mountPath: /host, readOnly: true}
  containers:
    - name: supervisor
      image: 104186811093.dkr.ecr.us-east-2.amazonaws.com/isolab/tasks@sha256:67eea58f5d4a7a8882b55f089c6063bb49fad58d40260ee9b0ceb349fc0e4581
      command: [/bin/bash, -ec, "LD_LIBRARY_PATH=/work/tools/lib /work/tools/criu check; sleep 1700"]
      securityContext: {privileged: true, runAsUser: 0, runAsGroup: 0}
      resources:
        requests: {cpu: '2', memory: 2Gi}
        limits: {cpu: '2', memory: 2Gi}
      volumeMounts:
        - {name: work, mountPath: /work}
  volumes:
    - name: work
      persistentVolumeClaim: {claimName: resume-process-probe}
    - name: host
      hostPath: {path: /, type: Directory}
