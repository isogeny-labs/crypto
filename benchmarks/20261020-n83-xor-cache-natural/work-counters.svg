<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
<title id="title">XOR-cache v2 bounded repivot counters</title><desc id="desc">Four cells with two identical repetitions per setting. Cache-off repivot visits equal cache-on repivot visits plus skipped cached rows. Counts are in millions; all 16 natural attempts stopped at 10,000 conflicts.</desc>
