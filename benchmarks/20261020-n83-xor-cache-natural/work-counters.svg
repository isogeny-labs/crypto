<rect width="1100" height="510" fill="#fff"/><text x="36" y="38" class="title">Satisfied XOR-row cache: bounded repivot work</text>
<text x="36" y="62" class="sub">Run xor-cache-v2-20261020T011634Z · n=2 per setting/cell · 16 natural attempts · 10,000-conflict cap</text>
