  <title id="title">N83 K=16,627 selector-pinned positive control: measured stage times</title>
  <desc id="desc">The 35.822-second worker consisted mainly of 35.356 seconds importing the prebuilt base. After construction, the full model had 201,598 variables, 5,915,238 clauses and 3,901 XOR rows. Model construction took 187.394 milliseconds, root propagation 146.398 milliseconds, and SAT returned one checked model in 8.862 milliseconds. Container exit was zero with 2,662,318,080 peak bytes. This constructed control is not a natural relation-yield measurement.</desc>
