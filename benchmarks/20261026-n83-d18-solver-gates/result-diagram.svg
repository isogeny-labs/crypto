<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="285" viewBox="0 0 1080 285" role="img" aria-labelledby="title desc">
  <title id="title">Full D18 solver gate outcomes</title>
  <desc id="desc">Schematic comparison of completed gates. Ordered first-pair constructed control passed and natural query reached an internal cap. Cadence 32 constructed control reached a cap before import was checked and natural search was skipped. Neither is a complete runtime comparison.</desc>
  <rect width="1080" height="285" rx="16" fill="#f8fafc"/>
  <text x="31" y="42" font-family="sans-serif" font-size="25" font-weight="700" fill="#13263b">Full-D18 solver gates · status, not speed ranking</text>
  <text x="31" y="68" font-family="sans-serif" font-size="15" fill="#475569">Same S3 factor-base generation; different search policies and resource conditions</text>
  <text x="31" y="110" font-family="sans-serif" font-size="19" font-weight="700" fill="#163e69">Ordered pair</text>
  <rect x="230" y="85" width="315" height="65" rx="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="247" y="110" font-family="sans-serif" font-size="16" font-weight="700" fill="#166534">Constructed: relation replayed</text>
  <text x="247" y="134" font-family="sans-serif" font-size="15" fill="#166534">1.077 s search · rank 1</text>
  <rect x="575" y="85" width="472" height="65" rx="9" fill="#ffedd5" stroke="#ea580c"/>
  <text x="592" y="110" font-family="sans-serif" font-size="16" font-weight="700" fill="#9a3412">Natural: internal wall cap</text>
  <text x="592" y="134" font-family="sans-serif" font-size="15" fill="#9a3412">no terminal model or relation</text>
  <text x="31" y="200" font-family="sans-serif" font-size="19" font-weight="700" fill="#163e69">Cadence 32</text>
  <rect x="230" y="175" width="315" height="65" rx="9" fill="#ffedd5" stroke="#ea580c"/>
  <text x="247" y="200" font-family="sans-serif" font-size="16" font-weight="700" fill="#9a3412">Constructed: cap during import</text>
  <text x="247" y="224" font-family="sans-serif" font-size="15" fill="#9a3412">formula shape not recorded</text>
  <rect x="575" y="175" width="472" height="65" rx="9" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="592" y="200" font-family="sans-serif" font-size="16" font-weight="700" fill="#374151">Natural: not launched</text>
  <text x="592" y="224" font-family="sans-serif" font-size="15" fill="#374151">positive gate did not pass</text>
  <text x="31" y="268" font-family="sans-serif" font-size="13" fill="#64748b">Source: the two committed independent-audit receipts · boxes are schematic and not time-scaled</text>
</svg>
