<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="t d">
<title id="t">Weekly unsupervised-success rate and episodes per week</title>
<desc id="d">Points show unsupervised successes over resolved episodes per week with Wilson 95% whiskers. Bars show episodes per week. Each label gives n, the resolved episodes.</desc>
<style>:root{--bg:#ffffff;--fg:#1f2328;--mut:#6b7280;--grid:#d8dee4;--pt:#0b6bcb;--bar:#9db7d5}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9ba7b4;--grid:#30363d;--pt:#58a6ff;--bar:#35516f}}text{font-family:system-ui,sans-serif;font-size:12px;fill:var(--fg)}.m{fill:var(--mut)}.g{stroke:var(--grid);stroke-width:1}.w{stroke:var(--pt);stroke-width:2}.p{fill:var(--pt)}.b{fill:var(--bar)}</style>
<rect width="760" height="460" fill="var(--bg)"/>
<text x="70" y="28" style="font-size:16px;font-weight:600">Agent autonomy: weekly unsupervised-success rate</text>
<text class="m" x="70" y="46">Point = successes / resolved episodes; whiskers = Wilson 95% CI; n = resolved episodes</text>
<line class="g" x1="70" x2="730" y1="250.0" y2="250.0"/>
<text class="m" x="62" y="254.0" text-anchor="end">0%</text>
<line class="g" x1="70" x2="730" y1="202.5" y2="202.5"/>
<text class="m" x="62" y="206.5" text-anchor="end">25%</text>
<line class="g" x1="70" x2="730" y1="155.0" y2="155.0"/>
<text class="m" x="62" y="159.0" text-anchor="end">50%</text>
<line class="g" x1="70" x2="730" y1="107.5" y2="107.5"/>
<text class="m" x="62" y="111.5" text-anchor="end">75%</text>
<line class="g" x1="70" x2="730" y1="60.0" y2="60.0"/>
<text class="m" x="62" y="64.0" text-anchor="end">100%</text>
<text class="m" x="16" y="155" text-anchor="middle" transform="rotate(-90 16 155)">unsupervised success rate</text>
<text class="m" x="180.0" y="155" text-anchor="middle">no resolved episodes</text>
<line class="w" x1="400.0" x2="400.0" y1="250.0" y2="143.3"/>
<line class="w" x1="394.0" x2="406.0" y1="250.0" y2="250.0"/>
<line class="w" x1="394.0" x2="406.0" y1="143.3" y2="143.3"/>
<circle class="p" cx="400.0" cy="250.0" r="5"/>
<text x="410.0" y="242.0">n=3</text>
<line class="w" x1="620.0" x2="620.0" y1="250.0" y2="99.2"/>
<line class="w" x1="614.0" x2="626.0" y1="250.0" y2="250.0"/>
<line class="w" x1="614.0" x2="626.0" y1="99.2" y2="99.2"/>
<circle class="p" cx="620.0" cy="250.0" r="5"/>
<text x="630.0" y="242.0">n=1</text>
<text x="70" y="286" style="font-weight:600">Episodes per week</text>
<line class="g" x1="70" x2="730" y1="400" y2="400"/>
<text class="m" x="62" y="404.0" text-anchor="end">0</text>
<text class="m" x="62" y="304.0" text-anchor="end">6</text>
<text class="m" x="16" y="350" text-anchor="middle" transform="rotate(-90 16 350)">episodes</text>
<rect class="b" x="150.0" y="383.3" width="60.0" height="16.7"/>
<text x="180.0" y="378.3" text-anchor="middle">1</text>
<text class="m" x="180.0" y="418" text-anchor="middle">2026-10-26</text>
<rect class="b" x="370.0" y="300.0" width="60.0" height="100.0"/>
<text x="400.0" y="295.0" text-anchor="middle">6</text>
<text class="m" x="400.0" y="418" text-anchor="middle">2026-11-02</text>
<rect class="b" x="590.0" y="383.3" width="60.0" height="16.7"/>
<text x="620.0" y="378.3" text-anchor="middle">1</text>
<text class="m" x="620.0" y="418" text-anchor="middle">2026-11-09</text>
<text class="m" x="400" y="444" text-anchor="middle">week starting (Monday, UTC), by the day the episode ended</text>
</svg>
