<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
<title id="title">Prebuilt K16627 signed-Frobenius base construction and custody</title>
<desc id="desc">A public deterministic source policy generated two byte-identical 16,627-column, 2,760,082-point objects. Generic replay checked every point, S3 upload and download matched the compressed digest, and four-summand relation and rank measurements remain open.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#496579"/></marker></defs>
<style>text{font:16px sans-serif;fill:#173149}.title{font-size:25px;font-weight:700}.small{font-size:13px}.input{fill:#e9f3ee;stroke:#398264;stroke-width:2}.work{fill:#e9f1fa;stroke:#426f9b;stroke-width:2}.ok{fill:#e9f3ee;stroke:#398264;stroke-width:2}.open{fill:#fff0d9;stroke:#b07724;stroke-width:2}.arrow{stroke:#496579;stroke-width:3;marker-end:url(#arrow)}</style>
<text class="title" x="24" y="38">N83 K = 16,627: prebuilt symmetric base</text>
<rect class="input" x="24" y="75" width="205" height="225" rx="12"/>
<text x="42" y="109">Public recipe</text>
<text x="42" y="141">a = 0, GF(2^83)</text>
<text x="42" y="173">public_x_hash</text>
<text x="42" y="205">seed 2026100801</text>
<text class="small" x="42" y="260">83 phases × 2 signs</text>
<line class="arrow" x1="231" y1="188" x2="262" y2="188"/>
<rect class="work" x="266" y="75" width="245" height="225" rx="12"/>
<text x="284" y="109">Native construction</text>
<text x="284" y="141">16,627 columns</text>
<text x="284" y="173">2,760,082 points</text>
<text x="284" y="205">83,701,045 bytes</text>
<text class="small" x="284" y="239">34.164 s; repeat 46.440 s</text>
<text class="small" x="284" y="265">repeat peak 507,568,128 B</text>
<line class="arrow" x1="513" y1="188" x2="544" y2="188"/>
<rect class="ok" x="548" y="75" width="245" height="225" rx="12"/>
<text x="566" y="109">Generic replay: PASS</text>
<text x="566" y="141">all points and labels</text>
<text x="566" y="173">separate arithmetic</text>
<text x="566" y="205">31.134 s container wall</text>
<text class="small" x="566" y="239">peak 834,940,928 B</text>
<text class="small" x="566" y="265">same repository and host</text>
<line class="arrow" x1="795" y1="188" x2="826" y2="188"/>
<rect class="ok" x="830" y="75" width="266" height="225" rx="12"/>
<text x="848" y="109">S3 custody: PASS</text>
<text x="848" y="141">content-addressed object</text>
<text x="848" y="173">download digest matches</text>
<text x="848" y="205">two builds byte-identical</text>
<text class="small" x="848" y="239">durable versioned URI</text>
<text class="small" x="848" y="265">manifest and receipts in Git</text>
<rect class="open" x="24" y="326" width="1072" height="42" rx="9"/>
<text x="42" y="353">Open: degree-83 m = 4 planted control, natural relation yield, useful rank, full cold IC cost and matched rho.</text>
</svg>
