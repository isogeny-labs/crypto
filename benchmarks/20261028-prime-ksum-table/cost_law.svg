<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="760" height="330" fill="white"/>
<text x="20" y="26" font-size="15" font-weight="bold">Generic table index calculus on E(F_p): one probe per walk step</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<rect x="20" y="45" width="220" height="95" rx="6" fill="#eaf2f8" stroke="#333"/><text x="30" y="65">base F: A points with small x</text><text x="30" y="82">(prime-abscissa), logs unknown</text><text x="30" y="99">cost: A Legendre + sqrt (native)</text>
<rect x="270" y="45" width="230" height="95" rx="6" fill="#fef5e7" stroke="#333"/><text x="280" y="65">table: every signed k-sum of F</text><text x="280" y="82">~2^(k-1) C(A,k) entries and adds</text><text x="280" y="99">k = 2: pair table (baseline)</text><text x="280" y="116">k = 3, 4: this study</text>
<rect x="530" y="45" width="210" height="95" rx="6" fill="#eafaf1" stroke="#333"/><text x="540" y="65">walk R = [a]G + [b]Q</text><text x="540" y="82">one add + one probe per step</text><text x="540" y="99">hit prob ~ 2 * entries / p</text>
<rect x="150" y="190" width="260" height="95" rx="6" fill="#f4ecf7" stroke="#333"/><text x="160" y="210">relations: ~c_k * A rows of weight k</text><text x="160" y="227">c_2 = 0.46-0.63 (first cycle; measured)</text><text x="160" y="244">c_3 = 0.92-1.00, c_4 = 0.98-1.06 (measured)</text>
<rect x="450" y="190" width="290" height="95" rx="6" fill="#fdedec" stroke="#333"/><text x="460" y="210">cost ~ table + c_k A p / (2 entries)</text><text x="460" y="227">optimum: exponent k / (2k - 1)</text><text x="460" y="244">k=2: 2/3   k=3: 3/5   k=4: 4/7</text><text x="460" y="261">limit k -> large: BSGS, never below</text>
<line x1="240" y1="92" x2="268" y2="92" stroke="#333" marker-end="url(#a)"/><line x1="500" y1="92" x2="528" y2="92" stroke="#333" marker-end="url(#a)"/>
<line x1="630" y1="140" x2="350" y2="188" stroke="#333" marker-end="url(#a)"/><line x1="410" y1="237" x2="448" y2="237" stroke="#333" marker-end="url(#a)"/>
<text x="20" y="315" font-size="11" fill="#444">Derived (cost law) and measured (c_k) labels; the law and its BSGS limit hold for any generic decomposition, so this is engineering, not an advance.</text>
</svg>
