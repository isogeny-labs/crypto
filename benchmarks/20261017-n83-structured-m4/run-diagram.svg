<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">Bounded N83 structured-base m4 and m5 outcomes</title>
<desc id="desc">One authenticated 2001-column signed-Frobenius base feeds separate four- and five-summand chained-S3 queries. All completed SAT calls reached the conflict cap. The four-summand arm completed eight calls and measured rank zero. The five-summand arm completed four calls before its worker wall cap and has no completed rank.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#496579"/></marker></defs>
<style>text{font:17px sans-serif;fill:#173149}.title{font-size:25px;font-weight:700}.small{font-size:14px}.base{fill:#e9f3ee;stroke:#398264;stroke-width:2}.arm{fill:#e9f1fa;stroke:#426f9b;stroke-width:2}.cap{fill:#fff0d9;stroke:#b07724;stroke-width:2}.arrow{stroke:#496579;stroke-width:3;marker-end:url(#arrow)}</style>
<text class="title" x="25" y="38">Retained structured N83 base: bounded chained-S3 gates</text>
<rect class="base" x="25" y="70" width="260" height="282" rx="12"/>
<text x="43" y="109">Authenticated input</text>
<text x="43" y="143">2,001 orbit columns</text>
<text x="43" y="174">332,166 points</text>
<text class="small" x="43" y="213">curve, subgroup, labels</text>
<text class="small" x="43" y="235">and object hashes pass</text>
<text class="small" x="43" y="291">one public corpus</text>
<text class="small" x="43" y="313">same capped Linux worker</text>
<line class="arrow" x1="287" y1="150" x2="346" y2="150"/>
<line class="arrow" x1="287" y1="284" x2="346" y2="284"/>
<rect class="arm" x="350" y="78" width="340" height="128" rx="12"/>
<text x="369" y="111">m = 4: 8 of 8 trials</text>
<text x="369" y="141">40,000 completed conflicts</text>
<text x="369" y="172">all Unknown at solver cap</text>
<rect class="arm" x="350" y="220" width="340" height="128" rx="12"/>
<text x="369" y="253">m = 5: 4 completed trials</text>
<text x="369" y="283">20,000 completed conflicts</text>
<text x="369" y="314">next trial interrupted</text>
<line class="arrow" x1="692" y1="142" x2="751" y2="142"/>
