<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
  <title id="title">Crypto Lean proof gate: observed failure and repaired audit path</title>
  <desc id="desc">The old Lean 4.19 path built SEA but rejected the trusted-manifest option before axiom review. The repaired path passes the manifest through an environment variable and audits 20 theorems. A separate Lean download TLS failure remains an infrastructure event with bounded setup retries.</desc>
  <rect width="1120" height="490" fill="#f7f9fc"/>
  <text x="44" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172338">Lean proof gate: build, audit, and infrastructure</text>
  <text x="44" y="76" font-family="Arial,sans-serif" font-size="15" fill="#4a5b72">Observed CI run 39459394168; local replay on pinned Lean 4.19.0</text>
  <g font-family="Arial,sans-serif" font-size="16" fill="#172338">
    <rect x="44" y="117" width="228" height="88" rx="12" fill="#e8efff" stroke="#6584c3" stroke-width="2"/>
    <text x="62" y="149" font-weight="700">Pinned toolchain</text>
    <text x="62" y="176">Lean 4.19.0, SEA</text>
    <rect x="343" y="117" width="228" height="88" rx="12" fill="#e8efff" stroke="#6584c3" stroke-width="2"/>
    <text x="361" y="149" font-weight="700">Lake build</text>
    <text x="361" y="176">SeaProofs compiled</text>
    <rect x="642" y="117" width="428" height="88" rx="12" fill="#fee9e8" stroke="#bf554e" stroke-width="2"/>
    <text x="660" y="149" font-weight="700">Old axiom invocation failed</text>
    <text x="660" y="176">CLI rejected --trusted before audit</text>
    <rect x="343" y="281" width="228" height="96" rx="12" fill="#e8efff" stroke="#6584c3" stroke-width="2"/>
    <text x="361" y="313" font-weight="700">Trust manifest via env</text>
    <text x="361" y="340">Module names as args</text>
    <rect x="642" y="281" width="428" height="96" rx="12" fill="#e4f5eb" stroke="#3c8b61" stroke-width="2"/>
    <text x="660" y="313" font-weight="700">Local axiom audit passed</text>
    <text x="660" y="340">20 theorems · 0 failed · 0 trusted</text>
    <rect x="44" y="417" width="1026" height="45" rx="10" fill="#fff1d8" stroke="#c18c29" stroke-width="2"/>
    <text x="62" y="446">Separate DenseCapacity failure: TLS toolchain download; setup retries only, with no theorem verdict.</text>
  </g>
  <g stroke="#65778e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M272 161 H338"/><path d="M571 161 H637"/><path d="M457 205 V276"/><path d="M571 329 H637"/>
  </g>
  <g fill="#65778e"><path d="M337 161 l-9 -6 v12z"/><path d="M636 161 l-9 -6 v12z"/><path d="M457 275 l-6 -9 h12z"/><path d="M636 329 l-9 -6 v12z"/></g>
</svg>
