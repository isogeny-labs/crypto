[package]
name = "ecdb"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Postgres catalogue and HTTP API for elliptic curves, higher-genus curves, Jacobians, isogenies, covers and DLP transfers"
license = "MIT OR Apache-2.0"

# Outside the study library's build graph, like ecc2k130/dp-ingest: the IC
# autolab jobs freeze a Cargo.lock onto the root package, and nothing here may
# become a root dependency.
[workspace]

[[bin]]
name = "ecdb"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4", features = ["derive", "env"] }
deadpool-postgres = "0.14"
flate2 = "1"
hex = "0.4"
# AWS Lambda entry points (`ecdb lambda api|admin`), for the RDS deployment in deploy/.
lambda_http = "1"
lambda_runtime = "1"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
# Exact big integers inside JSON: group orders and Weil coefficients must not
# round through f64 on their way between Postgres and a client.
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio-postgres-rustls = "0.13"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
webpki-roots = "0.26"

[dev-dependencies]
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 4
