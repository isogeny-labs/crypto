<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="570" viewBox="0 0 1140 570">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect width="1140" height="570" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="40" y="48" font-size="27" font-weight="700">From a textbook reference to a checked research citation</text>
    <text x="40" y="78" font-size="16" fill="#475569">Handbook of Finite Fields · HFF2013 · intake and proof records, 2026-10-31</text>
    <rect x="40" y="113" width="315" height="154" rx="12" fill="#e0ecff" stroke="#93b4e9"/>
    <text x="60" y="144" font-size="20" font-weight="700">1 · Source and inventory</text>
    <text x="60" y="177" font-size="17">5,850 numbered items</text>
    <text x="60" y="205" font-size="16">Book ID + line/byte span + SHA-256</text>
    <text x="60" y="233" font-size="16">49 conjectures retain an open label</text>
    <rect x="411" y="113" width="315" height="154" rx="12" fill="#fff3da" stroke="#e6c77e"/>
    <text x="431" y="144" font-size="20" font-weight="700">2 · Statement and scope</text>
    <text x="431" y="177" font-size="17">58 rules · 35 source items</text>
    <text x="431" y="205" font-size="16">Explicit hypotheses and corrections</text>
    <text x="431" y="233" font-size="16">Full, partial, or corrected coverage</text>
    <rect x="782" y="113" width="315" height="154" rx="12" fill="#dcf4e8" stroke="#8ac5a7"/>
    <text x="802" y="144" font-size="20" font-weight="700">3 · Checked Lean statement</text>
    <text x="802" y="177" font-size="17">58 named theorems audited</text>
    <text x="802" y="205" font-size="16">Kernel build + transitive axiom audit</text>
    <text x="802" y="233" font-size="16">Actual elaborated proof dependencies</text>
    <path d="M360 190 H401" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M731 190 H772" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M939 275 V310 H570 V333" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="205" y="345" width="730" height="111" rx="12" fill="#fff" stroke="#94a3b8"/>
    <text x="230" y="378" font-size="20" font-weight="700">Research use: find → inspect assumptions → cite or import</text>
    <text x="230" y="409" font-size="16">FF.fermat → HFF2013:2.1.16 → FiniteFieldHandbook.fermat</text>
    <text x="230" y="436" font-size="16">A changed proof, rule, pin, verifier or receipt invalidates verified lookup.</text>
    <text x="40" y="505" font-size="16" font-weight="700" fill="#9a3412">Whole-book validation remains open; item counts and theorem counts measure different things.</text>
    <text x="40" y="534" font-size="15" fill="#475569">Evidence: inventory.json · rules.json · receipts/audit.log · receipts/dependencies.json · receipts/verification.json</text>
  </g>
</svg>
