<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330">
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#286357"/></marker></defs>
  <rect width="840" height="330" rx="18" fill="#f4f7f6"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#17332d">
    <text x="420" y="34" text-anchor="middle" font-size="21" font-weight="bold">One scalar, two prime fields</text>
    <text x="420" y="59" text-anchor="middle" font-size="13">y² = x³ + 1 · cyclic subgroup order 3 · Mathlib affine points</text>
    <rect x="34" y="83" width="276" height="196" rx="12" fill="white" stroke="#b9d1c9"/>
    <rect x="530" y="83" width="276" height="196" rx="12" fill="white" stroke="#b9d1c9"/>
    <text x="172" y="113" text-anchor="middle" font-size="18" font-weight="bold">Characteristic 5</text>
    <text x="668" y="113" text-anchor="middle" font-size="18" font-weight="bold">Characteristic 7</text>
    <g text-anchor="middle" font-size="18">
      <text x="172" y="155">O</text><text x="668" y="155">O</text>
      <text x="172" y="205">P = (0, 1)</text><text x="668" y="205">R = (0, 1)</text>
      <text x="172" y="255">Q = (0, 4) = [2]P</text><text x="668" y="255">S = (0, 6) = [2]R</text>
    </g>
    <g stroke="#286357" stroke-width="2" marker-end="url(#arrow)">
      <path d="M325 149H515"/><path d="M325 199H515"/><path d="M325 249H515"/>
    </g>
    <g text-anchor="middle" font-size="13">
      <text x="420" y="140">scalar 0</text><text x="420" y="190">scalar 1</text><text x="420" y="240">scalar 2</text>
      <text x="420" y="307">S = [k]R ⇔ Q = [k]P ⇔ 2 ≡ k (mod 3)</text>
    </g>
  </g>
</svg>
