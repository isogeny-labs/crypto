<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#286357"/></marker></defs>
  <rect width="900" height="360" rx="18" fill="#f4f7f6"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#17332d">
    <text x="450" y="33" text-anchor="middle" font-size="22" font-weight="bold">One scalar, an odd-to-binary transfer</text>
    <text x="450" y="58" text-anchor="middle" font-size="14">Cyclic subgroup order 3 · characteristic 5 → characteristic 2</text>
    <rect x="26" y="77" width="310" height="220" rx="12" fill="white" stroke="#b9d1c9"/>
    <rect x="564" y="77" width="310" height="220" rx="12" fill="white" stroke="#b9d1c9"/>
    <text x="181" y="107" text-anchor="middle" font-size="19" font-weight="bold">F₅: y² = x³ + 1</text>
    <text x="719" y="107" text-anchor="middle" font-size="19" font-weight="bold">F₄: y² + y = x³</text>
    <text x="719" y="130" text-anchor="middle" font-size="12">GaloisField 2 2 · four-element field</text>
    <g text-anchor="middle" font-size="19">
      <text x="181" y="169">O</text><text x="719" y="169">O</text>
      <text x="181" y="222">P = (0, 1)</text><text x="719" y="222">R = (0, 0)</text>
      <text x="181" y="275">Q = (0, 4) = [2]P</text><text x="719" y="275">S = (0, 1) = [2]R</text>
    </g>
    <g stroke="#286357" stroke-width="2" marker-end="url(#arrow)">
      <path d="M351 163H549"/><path d="M351 216H549"/><path d="M351 269H549"/>
    </g>
    <g text-anchor="middle" font-size="13">
      <text x="450" y="154">scalar 0</text><text x="450" y="207">scalar 1</text><text x="450" y="260">scalar 2</text>
      <text x="450" y="325">S = [k]R ⇔ Q = [k]P ⇔ 2 ≡ k (mod 3)</text>
      <text x="450" y="346">Abstract subgroup isomorphism · no general efficient evaluator supplied</text>
    </g>
  </g>
</svg>
