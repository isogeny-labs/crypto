<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
 <defs>
  <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#286357"/></marker>
  <marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a66a14"/></marker>
 </defs>
 <rect width="1000" height="460" rx="18" fill="#f4f7f6"/>
 <g font-family="DejaVu Sans, sans-serif" fill="#17332d" text-anchor="middle">
  <text x="500" y="34" font-size="25" font-weight="bold">Cover, lift and de-cover: F₆₅₅₃₇ → F₄</text>
  <text x="500" y="59" font-size="16">Concrete order-seven subgroup · cubic covers · a fixed integral lift</text>
  <g fill="white" stroke="#b9d1c9">
   <rect x="30" y="80" width="360" height="112" rx="12"/>
   <rect x="610" y="80" width="360" height="112" rx="12"/>
   <rect x="610" y="274" width="360" height="128" rx="12"/>
   <rect x="30" y="274" width="360" height="128" rx="12"/>
  </g>
  <text x="210" y="108" font-size="22" font-weight="bold">Eₚ / F₆₅₅₃₇</text>
  <text x="210" y="137" font-size="18">y² − xy − 4y = x³ − 4x²</text>
  <text x="210" y="169" font-size="17">P = (0,0) · Q = [3]P = (2,2)</text>
  <text x="790" y="110" font-size="22" font-weight="bold">Jac(Cₚ) / F₆₅₅₃₇</text>
  <text x="790" y="140" font-size="18">genus 4 · image generator 3Dₚ</text>
  <text x="790" y="169" font-size="16">Dₚ = [(0,0)] − [∞]</text>
  <text x="790" y="306" font-size="22" font-weight="bold">Jac(C₂) / F₄</text>
  <text x="790" y="337" font-size="18">genus 4 · image generator 3D₂</text>
  <text x="790" y="370" font-size="16">marked seven-torsion sections</text>
  <text x="210" y="303" font-size="22" font-weight="bold">E₂ / F₄</text>
  <text x="210" y="331" font-size="18">y² + ωy = x³ + ωx²</text>
  <text x="210" y="359" font-size="17">Φ(P) = (1,ω+1) · Φ(Q) = (ω,ω)</text>
  <text x="210" y="386" font-size="16">target subgroup: 7 elements</text>
  <g stroke="#a66a14" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#amber)">
   <path d="M405 135H595"/><path d="M790 205V259"/><path d="M595 338H405"/>
  </g>
  <text x="500" y="124" font-size="17">pullback πₚ*</text>
  <text x="824" y="222" text-anchor="start" font-size="16">lift and specialize</text>
  <text x="824" y="245" text-anchor="start" font-size="15">t₀ = 2 + 65537ζ</text>
  <text x="500" y="325" font-size="17">norm π₂*</text>
  <path d="M210 205V259" stroke="#286357" stroke-width="3" marker-end="url(#green)"/>
  <text x="249" y="224" text-anchor="start" font-size="20" font-weight="bold">Φ = [3]τ</text>
  <text x="249" y="248" text-anchor="start" font-size="16">Lean-checked composite</text>
  <text x="500" y="428" font-size="16">Amber: written Jacobian geometry · Green: kernel-checked point-group map</text>
  <text x="500" y="449" font-size="15">ω²+ω+1=0 · A=Z[ζ]/(ζ²+ζ+1) · toy source and target subgroups both have order 7</text>
 </g>
</svg>
