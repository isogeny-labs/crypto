<text x="39" y="88" font-size="11" font-weight="bold" fill="#222">Challenge.lean : subexponentialRate m</text>
<text x="39" y="103" font-size="9" fill="#444">exists M : TM2ComputableInTime</text>
<text x="39" y="116" font-size="9" fill="#444"> enc encOut (lexLeast m), finite Gamma,</text>
<text x="39" y="128" font-size="9" fill="#444"> time &lt;= C_k * 2^(l/k) for all k&gt;=1</text>
<text x="39" y="140" font-size="9" fill="#444">= 2^o(l) = p^o(1). sorry (challenge).</text>
<rect x="30" y="196" width="250" height="104" rx="7" fill="#fbf1d8" stroke="#caa43a" stroke-width="2"/>
<text x="39" y="214" font-size="11" font-weight="bold" fill="#222">lexLeast m / strings m (the function)</text>
<text x="39" y="229" font-size="9" fill="#444">curve membership type-enforced;</text>
<text x="39" y="242" font-size="9" fill="#444"> p prime, Delta != 0 gated; no vacuity.</text>
<text x="39" y="254" font-size="9" fill="#444"> (2) factor base x &lt; ceil(p^1/m), incl 0</text>
<text x="39" y="266" font-size="9" fill="#444">   (paper uses [1, floor(p^1/m)]).</text>
<text x="39" y="279" font-size="9" fill="#444"> (3) genericity vs Definition 3.1: verify.</text>
