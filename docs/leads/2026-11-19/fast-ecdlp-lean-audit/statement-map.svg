<text x="360" y="420" font-size="10.5" font-weight="bold" fill="#1a3a5a">Verdict (statement level):</text>
<text x="360" y="438" font-size="9.5" fill="#333">The oracle statement is a faithful, non-vacuous formalization of the paper&#x27;s search:</text>
