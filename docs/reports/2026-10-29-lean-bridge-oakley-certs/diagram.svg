<text x="20" y="24" font-size="15" fill="#172b4d">What each new theorem connects (status: proposed until CI replay is green)</text>
<rect x="20" y="50" width="200" height="50" fill="#e6f0f5" stroke="#166a8c"/><text x="30" y="72">S3Roots addX / xPlus / xMinus</text><text x="30" y="90">(own chord formulas)</text>
<rect x="290" y="50" width="200" height="50" fill="#e6f0f5" stroke="#166a8c"/><text x="300" y="72">Mathlib W.addX, W.slope</text><text x="300" y="90">(a1 = a2 = 0, xR != xF)</text>
<rect x="540" y="50" width="200" height="50" fill="#e6f0f5" stroke="#166a8c"/><text x="550" y="72">Mathlib Point.add x-coord</text><text x="550" y="90">(+ a3 = 0 for R + (-F))</text>
<line x1="220" y1="75" x2="290" y2="75" stroke="#172b4d" marker-end="url(#a)"/><text x="200" y="44" font-size="10">addX_eq_mathlib_addX</text>
