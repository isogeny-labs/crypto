<rect x="20" y="160" width="200" height="50" fill="#f3efe0" stroke="#8a6d00"/><text x="30" y="182">oakley3Prime (152 bit)</text><text x="30" y="200">oakley4Prime (183 bit)</text>
<rect x="290" y="160" width="200" height="50" fill="#f3efe0" stroke="#8a6d00"/><text x="300" y="182">18 Pratt certificates</text><text x="300" y="200">kernel decide only</text>
<rect x="540" y="160" width="200" height="50" fill="#f3efe0" stroke="#8a6d00"/><text x="550" y="182">Mathlib lucas_primality</text><text x="550" y="200">+ norm_num below 2^20</text>
<line x1="220" y1="185" x2="290" y2="185" stroke="#172b4d" marker-end="url(#a)"/><line x1="490" y1="185" x2="540" y2="185" stroke="#172b4d" marker-end="url(#a)"/>
<text x="20" y="260" font-size="11" fill="#42526e">Not covered: S_m for m &gt;= 4; that the Oakley integers are RFC point orders; the paper's field-agnostic claim without DecidableEq.</text>
