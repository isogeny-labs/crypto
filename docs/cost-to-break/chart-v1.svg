<g><title>RSA-3072: RSA-260's 13.5 GPU-years x 2^58.2 = 4.63e18 GPU-years (extrapolated); $1.42e23</title><rect x="200.0" y="329.0" width="342.2" height="18" rx="2" fill="url(#hatch)" stroke="#2a78d6" stroke-width="1"/></g>
<text x="660" y="342.5" font-size="12.5" fill="#0b0b0b">4.63e18 GPU-years · $1.42e23 (extrapolated)</text>
<text x="188" y="382.5" font-size="13.5" text-anchor="end" fill="#0b0b0b">ML-KEM-512</text>
<g><title>ML-KEM-512: cited core-SVP 2^118, refined 2^151.5 gates (±16 bits); not converted to GPU time</title><text x="206.0" y="382.0" font-size="12" font-style="italic" fill="#8a8984">not converted to GPU time (cited lattice estimate)</text></g>
<text x="660" y="382.5" font-size="12.5" fill="#0b0b0b">cited: core-SVP 2^118; 2^151.5 gates (±16 bits)</text>
<text x="188" y="422.5" font-size="13.5" text-anchor="end" fill="#0b0b0b">ML-KEM-768</text>
<g><title>ML-KEM-768: cited core-SVP 2^183, refined 2^215.1 gates; not converted to GPU time</title><text x="206.0" y="422.0" font-size="12" font-style="italic" fill="#8a8984">not converted to GPU time (cited lattice estimate)</text></g>
<text x="660" y="422.5" font-size="12.5" fill="#0b0b0b">cited: core-SVP 2^183; 2^215.1 gates</text>
<text x="24" y="500" font-size="11" fill="#8a8984">Rates: crypto:gpu/nist/RESULTS.md (P-256); crypto:gpu/ecc/validation/20261017-modal-rtx-pro-6000 (secp256k1); crypto:ecc2k130/RTX-PRO6000.md (ECC2K-130).</text>
<text x="24" y="516" font-size="11" fill="#8a8984">Prices: crypto:ecc2k130/aws/README.md (AWS g7e, 2026-09-11). RSA: the RSA-260 record (13.5 GPU-years, $3.50/GPU-h) scaled by the GNFS L-function.</text>
<text x="24" y="532" font-size="11" fill="#8a8984">ML-KEM: CRYSTALS-Kyber specification v3.02, Table 4. Generated by docs/cost-to-break/gen_table.rs from inputs-v1.json.</text>
</svg>
