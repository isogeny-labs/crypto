<text x="660" y="182.5" font-size="12.5" fill="#0b0b0b">5.07e21 GPU-years · $5.83e25–$1.49e26</text>
<text x="188" y="222.5" font-size="13.5" text-anchor="end" fill="#0b0b0b">secp256k1</text>
<g><title>secp256k1: 2^127.03 steps at 1.38 G/s = 4.01e21 GPU-years; $4.60e25–$1.18e26</title><rect x="200.0" y="209.0" width="396.1" height="18" rx="2" fill="#2a78d6" stroke="none" stroke-width="1"/></g>
<text x="660" y="222.5" font-size="12.5" fill="#0b0b0b">4.01e21 GPU-years · $4.60e25–$1.18e26</text>
