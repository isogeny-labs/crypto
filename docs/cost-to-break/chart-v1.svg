<g><title>Curve25519 / Ed25519: 2^125.83 steps at 1.88 G/s = 1.27e21 GPU-years; $1.46e25–$3.74e25</title><rect x="200.0" y="249.0" width="386.9" height="18" rx="2" fill="url(#hatch)" stroke="#2a78d6" stroke-width="1"/></g>
