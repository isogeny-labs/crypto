<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="546" viewBox="0 0 1000 546" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Cost to break, table version 1, GPU-years on a log scale</title>
<desc id="d">Horizontal bars of GPU-years per target. Solid bars use a rho rate measured in this repository; hatched bars use a proxy rate or an extrapolation from a cited record; ML-KEM rows carry cited figures and no bar.</desc>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fcfcfb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#2a78d6" stroke-width="2.5"/></pattern></defs>
<rect x="0" y="0" width="1000" height="546" fill="#fcfcfb"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#0b0b0b">Cost to break with today's best classical method (table v1)</text>
<text x="24" y="57" font-size="13" fill="#52514e">GPU-years, log scale: RTX PRO 6000 for the elliptic curves, B200-class for RSA. Derived from committed rates and cited records; not a benchmark.</text>
<rect x="24" y="70" width="22" height="12" rx="2" fill="#2a78d6"/>
<text x="52" y="80" font-size="12.5" fill="#52514e">rho rate measured in this repository</text>
<rect x="290" y="70" width="22" height="12" rx="2" fill="url(#hatch)" stroke="#2a78d6" stroke-width="1"/>
<text x="318" y="80" font-size="12.5" fill="#52514e">proxy rate (Curve25519) or extrapolation from a cited record (RSA)</text>
<line x1="200.0" y1="110" x2="200.0" y2="438" stroke="#e4e3df" stroke-width="1"/>
<text x="200.0" y="456" font-size="12" text-anchor="middle" fill="#52514e">10⁰</text>
<line x1="273.3" y1="110" x2="273.3" y2="438" stroke="#e4e3df" stroke-width="1"/>
<text x="273.3" y="456" font-size="12" text-anchor="middle" fill="#52514e">10⁴</text>
<line x1="346.7" y1="110" x2="346.7" y2="438" stroke="#e4e3df" stroke-width="1"/>
<text x="346.7" y="456" font-size="12" text-anchor="middle" fill="#52514e">10⁸</text>
<line x1="420.0" y1="110" x2="420.0" y2="438" stroke="#e4e3df" stroke-width="1"/>
<text x="420.0" y="456" font-size="12" text-anchor="middle" fill="#52514e">10¹²</text>
<line x1="493.3" y1="110" x2="493.3" y2="438" stroke="#e4e3df" stroke-width="1"/>
<text x="493.3" y="456" font-size="12" text-anchor="middle" fill="#52514e">10¹⁶</text>
<line x1="566.7" y1="110" x2="566.7" y2="438" stroke="#e4e3df" stroke-width="1"/>
<text x="566.7" y="456" font-size="12" text-anchor="middle" fill="#52514e">10²⁰</text>
<line x1="640.0" y1="110" x2="640.0" y2="438" stroke="#e4e3df" stroke-width="1"/>
<text x="640.0" y="456" font-size="12" text-anchor="middle" fill="#52514e">10²⁴</text>
<text x="420" y="476" font-size="12.5" text-anchor="middle" fill="#52514e">GPU-years (log scale)</text>
<text x="660" y="106" font-size="12" font-weight="700" fill="#52514e">GPU-years · cost in USD (spot–on-demand)</text>
<text x="188" y="142.5" font-size="13.5" text-anchor="end" fill="#0b0b0b">ECC2K-130 (calibration)</text>
<g><title>ECC2K-130 (calibration): 2^60.91 steps at 14.1 G/s = 4.85 GPU-years; $55,700–$143,000</title><rect x="200.0" y="129.0" width="12.6" height="18" rx="2" fill="#2a78d6" stroke="none" stroke-width="1"/></g>
<text x="660" y="142.5" font-size="12.5" fill="#0b0b0b">4.85 GPU-years · $55,700–$143,000</text>
<text x="188" y="182.5" font-size="13.5" text-anchor="end" fill="#0b0b0b">P-256 (secp256r1)</text>
