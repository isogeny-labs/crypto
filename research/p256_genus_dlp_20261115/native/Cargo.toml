[package]
name = "p256-genus-check"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false

[workspace]

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
serde_json = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
hex = "0.4"

[profile.release]
overflow-checks = true
