[package]
name = "p256-folded-walk"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[workspace]

[dependencies]
p256-genus-check = { path = "../native" }
p256-transfer-search = { path = "../transfer_search" }
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "std"] }

[profile.release]
overflow-checks = true
