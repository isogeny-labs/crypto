<svg xmlns="http://www.w3.org/2000/svg" width="900" height="262" viewBox="0 0 900 262" role="img" aria-labelledby="title desc">
  <title id="title">Independent finite controls and separate formal scope</title>
  <desc id="desc">H1 attachment, H2 retained collisions and H3 anchor directions feed eight native control functions. A separate Mathlib-only project has two order criteria. Original scientific lead requirements remain outside both paths. Fixture counts are not costs.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#51718c"/></marker></defs>
  <rect width="900" height="262" fill="#f6f8fb" rx="10"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="16" fill="#18334b">
    <g fill="#e6eef7" stroke="#7290ad" stroke-width="1.5">
      <rect x="18" y="16" width="270" height="72" rx="8"/>
      <rect x="315" y="16" width="270" height="72" rx="8"/>
      <rect x="612" y="16" width="270" height="72" rx="8"/>
    </g>
    <text x="153" y="44" text-anchor="middle" font-weight="bold">H1 · generic attachment</text>
    <text x="153" y="69" text-anchor="middle">1,520 primary cases</text>
    <text x="450" y="44" text-anchor="middle" font-weight="bold">H2 · collision retention</text>
    <text x="450" y="69" text-anchor="middle">48 fixture candidates</text>
    <text x="747" y="44" text-anchor="middle" font-weight="bold">H3 · anchor direction</text>
    <text x="747" y="69" text-anchor="middle">361 directions · fixed rank</text>
    <g fill="none" stroke="#51718c" stroke-width="2" marker-end="url(#arrow)">
      <path d="M153,89 V107 H450 V123"/>
      <path d="M450,89 V123"/>
      <path d="M747,89 V107 H450 V123"/>
    </g>
    <rect x="218" y="126" width="464" height="48" rx="8" fill="#e5f2ed" stroke="#6b9b85" stroke-width="1.5"/>
    <text x="450" y="156" text-anchor="middle" font-weight="bold">8 native controls · independent finite references</text>
    <rect x="18" y="197" width="402" height="45" rx="7" fill="#f0ecfa" stroke="#9b89b5"/>
    <text x="219" y="225" text-anchor="middle">Separate Mathlib scope · 2 order criteria</text>
    <rect x="442" y="197" width="440" height="45" rx="7" fill="#fff4df" stroke="#b19a66"/>
    <text x="662" y="225" text-anchor="middle">Original 3 leads / G1–G6 · acceptance retained</text>
  </g>
</svg>
