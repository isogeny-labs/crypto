notes: 'Frozen EKS command Job mllc-all-20261108 (8 vCPU, 16Gi, 14400 s; sizes 12 16 20 24 in one pod), image 104186811093.dkr.ecr.us-east-2.amazonaws.com/isolab/tasks@sha256:a43ceee769b62f514862d219dd447fc2112e30a085b13d90485919687a9ecadd, request research/ml_learnability_control_20261107/eks/requests/mllc-all-20261108.json. Only this request is launched; the per-size requests in the same directory are not launched. The `launch` step is the only step that submits a Job and it appears once in the whole card family. Every later step only reads the Job through isolab.eks.command-status/v1 receipts and S3, so each can run again on its own. This resume card has no launch step. It continues the family after a stop that came after `launch` wrote research/ml_learnability_control_20261107/receipts/R2/launch/result.json: it waits for the Job, downloads and verifies the results. The record steps (`add-raw`, `upload-raw`) are not in this card: benchrec rewrites the record file, so a later card binds the record hash it has then. If `wait` exits 41 again, the continuation is CARD-ml-learnability-control-20261107-R2-3. The head-paths-unchanged step passes when no commit after the pinned commit changed the study directory (its cards subdirectory excepted), taskq/, tools/task_card.py or tools/benchrec.py; other commits are accepted. No commit field is set because task_card.py run refuses any HEAD other than the pinned one; the pinned commit is in the head-ancestor and head-paths-unchanged steps. Pinned commit ce32bb4dc76114ee0fffee8e1733c261e79cb8f1. The `wait` step ends on state succeeded or failed. `verify` fails unless the Job succeeded with pod exit 0, its Job UID equals the launch receipt, the downloaded tree is one directory named by the Pod UID, source.sha256 holds the four committed study file hashes, host.txt holds the entry script sha256, exit_codes.txt holds `size 12 exit 0`, `size 16 exit 0`, `size 20 exit 0`, `size 24 exit 0` and `fail=0`, and `sha256sum -c SHA256SUMS` passes for every listed file. The card has no recheck, close, report or analysis step; the record is left open.'
