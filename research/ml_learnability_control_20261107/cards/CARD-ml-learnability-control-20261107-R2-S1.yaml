notes: 'Frozen EKS command Job mllc-all-20261108 (8 vCPU, 16Gi, 14400 s; 14400 s ceiling), image 104186811093.dkr.ecr.us-east-2.amazonaws.com/isolab/tasks@sha256:a43ceee769b62f514862d219dd447fc2112e30a085b13d90485919687a9ecadd, request research/ml_learnability_control_20261107/eks/requests/mllc-all-20261108.json. This card has no launch step, so it cannot submit anything. It was generated after the launch and binds research/ml_learnability_control_20261107/receipts/R2/launch/result.json and the record benchmarks/records/20261108T0501Z-mllc-panel.json at the sha256 they had at generation; if any card changed the record since, generate the card again. SALVAGE card: the Job is already terminal and failed, so this card keeps what the failed run uploaded. The `status-once` step makes one isolab.eks.command-status/v1 query. The `verify` step is verify_salvage.sh: it requires Job state failed with exactly one pod instead of pod exit 0, and exactly four `size ` lines in exit_codes.txt. When the Job is terminal the card downloads s3://isolab-results-104186811093-us-east-2/runs/mllc-all-20261108/ (without launcher/) into research/ml_learnability_control_20261107/results/R2, an idempotent sync, and verifies it. `verify` fails unless the Job failed with one pod, its Job UID and name equal the launch receipt, the downloaded tree is one directory named by the Pod UID, and each listed file holds each listed string; it also runs `sha256sum -c` against SHA256SUMS. Then `add-raw` and `upload-raw` record every downloaded file in the benchmark record. The head-paths-unchanged step passes when no commit after the pinned commit changed the study directory (its cards subdirectory excepted), taskq/, tools/task_card.py or tools/benchrec.py; other commits are accepted. No commit field is set because task_card.py run refuses any HEAD other than the pinned one. Pinned commit 5f72e0806c76d845da45ec65aa4f9179284e3a9e. The record stays open, and the card runs no close, report or analysis command.'
