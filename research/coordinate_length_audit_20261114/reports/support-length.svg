<svg xmlns="http://www.w3.org/2000/svg" width="500" height="122" viewBox="0 0 500 122">
<text x="8" y="13" font-family="DejaVu Sans,sans-serif" font-size="9.2" fill="#234b70">Actual bivariate family, every field and every positive m</text>
<rect x="4" y="28" width="151" height="46" rx="4" fill="#edf3f8" stroke="#8eb0cb"/>
<text x="11" y="46" font-family="DejaVu Sans,sans-serif" font-size="8.4" fill="#234b70">Ideal (x^m, y−x)</text>
<text x="11" y="63" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#234b70">Full ideal vanishing</text>
<rect x="173" y="28" width="151" height="46" rx="4" fill="#edf3f8" stroke="#8eb0cb"/>
<text x="180" y="46" font-family="DejaVu Sans,sans-serif" font-size="8.4" fill="#234b70">Quotient ≃ K[t]/t^m</text>
<text x="180" y="63" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#234b70">Dimension / K-length m</text>
<rect x="342" y="28" width="151" height="46" rx="4" fill="#edf3f8" stroke="#8eb0cb"/>
<text x="349" y="46" font-family="DejaVu Sans,sans-serif" font-size="8.4" fill="#234b70">Every field extension</text>
<text x="349" y="63" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#234b70">Exactly one solution</text>
<rect x="4" y="86" width="489" height="33" rx="4" fill="#edf3f8" stroke="#8eb0cb"/>
<text x="12" y="99" font-family="DejaVu Sans,sans-serif" font-size="8.4" fill="#234b70">Controls: m=0 empty; m=1 reduced; m&gt;1 nonreduced, arbitrary gap.</text>
<text x="12" y="112" font-family="DejaVu Sans,sans-serif" font-size="7.9" fill="#234b70">Target-domain control: F3 dual numbers have ≥3 endomorphisms, dimension 2.</text>
</svg>
