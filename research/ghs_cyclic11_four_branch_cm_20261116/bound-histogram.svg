<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
  <title id="title">Cyclic-11 four-branch Bouw bound by ordered inertia row</title>
  <desc id="desc">Among 910 ordered exponent rows, 280 have bound zero, 360 have bound five, and 270 have bound ten. All 270 bound-ten rows have two opposite exponent pairs.</desc>
  <rect width="900" height="350" fill="#f8fafc"/>
  <text x="42" y="42" fill="#172554" font-family="sans-serif" font-size="24" font-weight="700">Four-branch cyclic-11 inertia screen</text>
  <text x="42" y="69" fill="#475569" font-family="sans-serif" font-size="15">Ordered rows; p = 3 or 5; n = 910; Rust output and Lean certificate</text>
  <line x1="190" y1="95" x2="190" y2="282" stroke="#64748b" stroke-width="1.5"/>
  <line x1="190" y1="282" x2="780" y2="282" stroke="#64748b" stroke-width="1.5"/>
  <text x="130" y="137" fill="#334155" font-family="sans-serif" font-size="18">B = 0</text>
  <text x="130" y="202" fill="#334155" font-family="sans-serif" font-size="18">B = 5</text>
  <text x="119" y="267" fill="#334155" font-family="sans-serif" font-size="18">B = 10</text>
  <rect x="190" y="108" width="364" height="40" rx="5" fill="#64748b"/>
  <rect x="190" y="173" width="468" height="40" rx="5" fill="#3b82f6"/>
  <rect x="190" y="238" width="351" height="40" rx="5" fill="#0f766e"/>
  <text x="567" y="135" fill="#172554" font-family="sans-serif" font-size="17" font-weight="700">280</text>
  <text x="671" y="200" fill="#172554" font-family="sans-serif" font-size="17" font-weight="700">360</text>
  <text x="554" y="265" fill="#172554" font-family="sans-serif" font-size="17" font-weight="700">270</text>
  <text x="42" y="325" fill="#475569" font-family="sans-serif" font-size="14">B = upper bound on Jacobian p-rank. Every B = 10 row has two opposite inertia pairs.</text>
</svg>
