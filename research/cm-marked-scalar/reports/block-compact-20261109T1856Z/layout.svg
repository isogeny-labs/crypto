<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210"><rect width="900" height="210" fill="#f5f8fc"/><g font-family="sans-serif" fill="#183650"><text x="18" y="29" font-size="19" font-weight="bold">Same block recurrence and point circuit; bounded inline storage</text><rect x="20" y="53" width="260" height="91" rx="7" fill="#e4eaf2"/><text x="34" y="78" font-size="16">Old: term vectors in each step</text><text x="34" y="102" font-size="14">Tree of retained integer labels</text><text x="34" y="126" font-size="14">Frozen implementation retained</text><path d="M290 99 H330" stroke="#58768c" stroke-width="3"/><path d="M324 93 L331 99 L324 105" fill="none" stroke="#58768c" stroke-width="3"/><rect x="344" y="53" width="253" height="91" rx="7" fill="#dcefe6"/><text x="358" y="78" font-size="16">New: at most 2 inline terms</text><text x="358" y="102" font-size="14">Bitset: labels 1 through 2016</text><text x="358" y="126" font-size="14">Same strict ties and recurrence</text><path d="M608 99 H646" stroke="#58768c" stroke-width="3"/><path d="M640 93 L647 99 L640 105" fill="none" stroke="#58768c" stroke-width="3"/><rect x="659" y="53" width="220" height="91" rx="7" fill="#e4eaf2"/><text x="673" y="78" font-size="16">Shared full cold worker</text><text x="673" y="102" font-size="14">625 untimed paths, 5 faults</text><text x="673" y="126" font-size="14">All costs stay inside boundary</text><text x="20" y="173" font-size="14">Digits, state/result vectors, prefix and point-bank allocations still exist. No allocator or CPU clock ran.</text><text x="20" y="196" font-size="12">Source: qualification/block-compact-v1 and block-compact-cold-v1. Producer-side unverified assertions [pcc:unverified].</text></g></svg>
