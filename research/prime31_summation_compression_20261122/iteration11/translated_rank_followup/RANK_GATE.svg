<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-label="Rank transfer from full translations to actual signed spectrum"><rect width="820" height="340" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172b42"><text x="24" y="34" font-size="22" font-weight="bold">Exact numeric translation matrix: rank gate</text><rect x="24" y="58" width="772" height="64" rx="8" fill="#e8eff8" stroke="#758ba4"/><text x="410" y="82" font-size="18" text-anchor="middle">Full cyclic group columns: rank R</text><text x="410" y="105" font-size="15" text-anchor="middle">Every translation of a column basis is independent.</text><path d="M410 123v24" stroke="#52687f" stroke-width="2"/><path d="m404 142 6 7 6-7" fill="none" stroke="#52687f" stroke-width="2"/><rect x="24" y="150" width="772" height="64" rx="8" fill="#f4f6f8" stroke="#758ba4"/><text x="410" y="176" font-size="18" text-anchor="middle">Restrict to actual signed support U (2D columns)</text><text x="410" y="199" font-size="15" text-anchor="middle">A translated basis intersects U in at least ceil(2DR/r) columns.</text><path d="M410 214v22H210v13M410 236h200v13" fill="none" stroke="#52687f" stroke-width="2"/><rect x="24" y="250" width="372" height="62" rx="8" fill="#e8eff8" stroke="#758ba4"/><rect x="424" y="250" width="372" height="62" rx="8" fill="#e8eff8" stroke="#758ba4"/><text x="210" y="275" font-size="17" text-anchor="middle">Coordinate field: R ≥ 429,489,367</text><text x="210" y="296" font-size="15" text-anchor="middle">width ≥ ceil(2D/5)</text><text x="610" y="275" font-size="17" text-anchor="middle">Scalar field: R = r (unit)</text><text x="610" y="296" font-size="15" text-anchor="middle">width ≥ 2D</text><text x="410" y="331" font-size="13" text-anchor="middle">Exact numeric separability only; not a runtime lower bound or a zero-pattern bound.</text></g></svg>