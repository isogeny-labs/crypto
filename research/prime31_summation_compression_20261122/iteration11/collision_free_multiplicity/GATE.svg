</text></g><rect x="30" y="316" width="840" height="30" fill="#d6efdf"/><g font-size="15" fill="#17324d" font-weight="bold"><text x="45" y="336">1+1+1+1</text><text x="260" y="336">251,720</text><text x="480" y="336">3</text><text x="700" y="336">6</text></g><text x="30" y="383" font-size="16" font-weight="bold" fill="#226b46">Strict four distinct indices: H nonzero + deg J = 6.</text><text x="30" y="410" font-size="14" fill="#465569">Still requires charged global discovery. No new native validation or speedup.</text></svg>