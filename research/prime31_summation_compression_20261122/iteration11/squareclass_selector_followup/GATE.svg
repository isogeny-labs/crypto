<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400"><rect width="920" height="400" fill="#fff"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17304b"><text x="460" y="33" font-size="21" font-weight="bold">Fixed rational x-coordinate selector — two cases</text><rect x="245" y="51" width="430" height="66" rx="9" fill="#e8f1fa" stroke="#52759a"/><text x="460" y="77" font-size="17">X₁(T), …, Xₘ(T) in Fₚ(E)</text><text x="460" y="99" font-size="14">Adjoin square roots of f(Xᵢ); group H has order N</text><path d="M460 117 V139 H230 V155 M460 139 H690 V155" fill="none" stroke="#52759a" stroke-width="2"/><rect x="25" y="155" width="410" height="90" rx="8" fill="#eaf4eb" stroke="#57916b"/><text x="230" y="182" font-size="16" font-weight="bold">Generic signed sum identity exists</text><text x="230" y="204" font-size="14">Character projection: nonsquare groups are torsion</text><text x="230" y="225" font-size="14">Square-root arms descend to target E</text><rect x="485" y="155" width="410" height="90" rx="8" fill="#f7f1e5" stroke="#aa8643"/><text x="690" y="182" font-size="16" font-weight="bold">No generic signed identity</text><text x="690" y="204" font-size="14">Nonzero defect maps; count finite zeros</text><text x="690" y="225" font-size="14">2ᵐ/N sign orbits cancel cover-degree factor N</text><path d="M230 245 V264 M690 245 V264" stroke="#52759a" stroke-width="2"/><rect x="25" y="264" width="410" height="72" rx="8" fill="#f3f7fa" stroke="#52759a"/><text x="230" y="290" font-size="17" font-weight="bold">At most 2B regular targets</text><text x="230" y="313" font-size="14">B=31: 62, across all sign choices</text><rect x="485" y="264" width="410" height="72" rx="8" fill="#f3f7fa" stroke="#52759a"/><text x="690" y="290" font-size="17" font-weight="bold">At most 2ᵐ(1+Σ√(dᵢ/2))²</text><text x="690" y="313" font-size="14">dᵢ = pole degree on target E</text><text x="460" y="375" font-size="14">Coverage bounds only · algebraic x-root selection and adaptive indexing remain open</text></g></svg>