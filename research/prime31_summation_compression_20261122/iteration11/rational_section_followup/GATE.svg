<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400"><rect width="800" height="400" fill="#f8fafc"/><g font-family="sans-serif" fill="#172554" text-anchor="middle"><text x="400" y="36" font-size="24" font-weight="bold">Witness-producing chart coverage</text><rect x="40" y="60" width="720" height="54" rx="8" fill="#dbeafe"/><text x="400" y="84" font-size="19">Target T in prime-order group G</text><text x="400" y="104" font-size="15">Require every output in the fixed set and sum = T</text><path d="M400 114 V140 H200 V165 M400 140 H600 V165" fill="none" stroke="#64748b" stroke-width="2"/><rect x="40" y="165" width="320" height="100" rx="9" fill="#e2e8f0"/><text x="200" y="190" font-size="18" font-weight="bold">Geometric E → E maps</text><text x="200" y="218" font-size="16">At least one output permutes G</text><text x="200" y="245" font-size="18">Coverage ≤ set size</text><rect x="440" y="165" width="320" height="100" rx="9" fill="#e2e8f0"/><text x="600" y="190" font-size="18" font-weight="bold">Finite-field-only chart</text><text x="600" y="218" font-size="16">Nonzero curve defect</text><text x="600" y="245" font-size="18">Coverage ≤ 3 × pole degree</text><rect x="40" y="294" width="720" height="73" rx="8" fill="#dbeafe"/><text x="400" y="320" font-size="18" font-weight="bold">Genus-one rational covers: same set-size gate</text><text x="400" y="344" font-size="15">Higher genus, x-only root selection and adaptive indexing remain open.</text></g></svg>