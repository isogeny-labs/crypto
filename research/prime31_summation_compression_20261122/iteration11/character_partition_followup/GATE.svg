<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350"><rect width="760" height="350" fill="#fafafa"/><g font-family="Arial,sans-serif" fill="#182c3d"><text x="28" y="36" font-size="22" font-weight="bold">Regular quadratic-character decision leaves</text><text x="28" y="61" font-size="14">M31 · B=31 · pole degree ≤4 per predicate · conservative bounds</text><rect x="28" y="88" width="704" height="38" rx="6" fill="#dbe7f1"/><text x="44" y="112" font-size="15">At most 9 tests: ≥2,525,773 rational targets in each nonempty regular leaf</text><rect x="28" y="139" width="172" height="38" rx="6" fill="#e3b77e"/><text x="214" y="163" font-size="15">Entire four-sum signed support ≤618,884</text><rect x="28" y="190" width="68" height="38" rx="6" fill="#dbe7f1"/><text x="110" y="214" font-size="15">At most 10 tests: ≥243,340 regular targets</text><line x1="28" y1="244" x2="732" y2="244" stroke="#9eabb5"/><text x="28" y="269" font-size="14">9 tests: no nonempty regular exact-YES leaf.</text><text x="28" y="292" font-size="14">10 tests: no fixed signed-witness leaf.</text><text x="28" y="320" font-size="13" fill="#526576">Bounds, not a census. Exceptions, other predicates, dynamic outputs and high degrees remain open.</text></g></svg>