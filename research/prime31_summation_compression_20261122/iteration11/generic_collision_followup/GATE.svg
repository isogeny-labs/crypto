<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410"><rect width="960" height="410" fill="#f5f7fa"/><g font-family="sans-serif" fill="#16263b"><text x="36" y="42" font-size="24" font-weight="bold">Equality-only query: default transcript and exceptions</text><rect x="36" y="66" width="888" height="52" rx="8" fill="#dce8f4"/><text x="56" y="98" font-size="18">S constant registers + q query registers (including T)</text><path d="M480 118V146H250V164M480 146H710V164" fill="none" stroke="#52667d" stroke-width="2"/><rect x="36" y="164" width="428" height="104" rx="8" fill="#fff" stroke="#7289a2"/><text x="56" y="194" font-size="18" font-weight="bold">No exceptional equality</text><text x="56" y="222" font-size="16">Same transcript, same explicit witness</text><text x="56" y="246" font-size="16">At most one successful target</text><rect x="496" y="164" width="428" height="104" rx="8" fill="#fff" stroke="#7289a2"/><text x="516" y="194" font-size="18" font-weight="bold">Different-slope collisions</text><text x="516" y="222" font-size="16">At most S q + q(q−1)/2 targets</text><text x="516" y="246" font-size="16">All later adaptive actions allowed</text><rect x="36" y="292" width="888" height="84" rx="8" fill="#e3ebea"/><text x="56" y="324" font-size="18" font-weight="bold">Sparse uniform queries: useful hits / expected work = O(S/r)</text><text x="56" y="350" font-size="16">S²=o(r), q≤S, one row per hit. Coordinate predicates are outside this model.</text><text x="36" y="398" font-size="13">Written producer argument; not measured or independently verified. [pcc:unverified]</text></g></svg>