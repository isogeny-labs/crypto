<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"><rect width="720" height="320" fill="#f7fafb"/><g font-family="Arial,sans-serif" fill="#152c46"><text x="30" y="38" font-size="23" font-weight="bold">Fixed-list width: 31 lists on strict hits</text><text x="30" y="63" font-size="13">Conditional mathematical lower bounds, not observed outputs</text><text x="30" y="116" font-size="16">Signed</text><text x="30" y="175" font-size="16">Negation quotient</text><text x="30" y="234" font-size="16">Exact output</text><rect x="200" y="94" width="450" height="30" rx="4" fill="#166b72"/><rect x="200" y="153" width="225" height="30" rx="4" fill="#166b72"/><rect x="200" y="212" width="45" height="30" rx="4" fill="#62778d"/><text x="660" y="115" font-size="17" font-weight="bold">60</text><text x="435" y="174" font-size="17" font-weight="bold">30</text><text x="255" y="233" font-size="17" font-weight="bold">6</text><text x="30" y="280" font-size="13">Mean candidates ≥ max(6, n / w); no lower bound on miss cost.</text><text x="30" y="302" font-size="12">M31 B31, archived injectivity conditional; producer proof only.</text></g></svg>