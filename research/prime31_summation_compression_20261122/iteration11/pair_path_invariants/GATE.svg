<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300"><rect width="720" height="300" fill="#fff"/><g font-family="sans-serif" fill="#16283e"><text x="30" y="32" font-size="20" font-weight="bold">Conceptual quotient by negation</text><text x="30" y="55" font-size="13">Selected vertices form runs; scalar positions are proof labels only.</text><path d="M70 130 H650" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><path d="M150 130 H310 M490 130 H650" stroke="#247c69" stroke-width="5"/><path d="M650 130 C695 70 705 160 650 130" fill="none" stroke="#247c69" stroke-width="3"/><path d="M70 130 H150" stroke="#bf7c24" stroke-width="3" stroke-dasharray="5 5"/><g stroke="#506276" stroke-width="1.5"><circle cx="70" cy="130" r="15" fill="#fff"/><circle cx="150" cy="130" r="15" fill="#a7d8c5"/><circle cx="230" cy="130" r="15" fill="#a7d8c5"/><circle cx="310" cy="130" r="15" fill="#a7d8c5"/><circle cx="400" cy="130" r="15" fill="#fff"/><circle cx="490" cy="130" r="15" fill="#a7d8c5"/><circle cx="570" cy="130" r="15" fill="#a7d8c5"/><circle cx="650" cy="130" r="15" fill="#a7d8c5"/></g><g font-size="14" text-anchor="middle"><text x="70" y="166">O</text><text x="150" y="166">1</text><text x="230" y="166">2</text><text x="310" y="166">3</text><text x="400" y="166">gap</text><text x="490" y="166">n−2</text><text x="570" y="166">n−1</text><text x="650" y="166">n</text></g><text x="31" y="205" font-size="14" fill="#bf7c24">Identity branch h</text><text x="250" y="205" font-size="14" fill="#247c69">Ordinary edges: D − c</text><text x="530" y="205" font-size="14" fill="#247c69">Terminal loop ℓ</text><rect x="30" y="228" width="660" height="45" rx="7" fill="#edf3f7"/><text x="360" y="256" text-anchor="middle" font-size="17" font-weight="bold">e = D − c + ℓ + h    |    j = incident vertices</text></g></svg>