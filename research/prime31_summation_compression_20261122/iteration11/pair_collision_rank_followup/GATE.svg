<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350"><rect width="760" height="350" rx="12" fill="#f5f7fb"/><g font-family="Arial,sans-serif" fill="#1c314b"><text x="32" y="36" font-size="22" font-weight="bold">Pair collisions: rank, not just lost support</text><text x="32" y="66" font-size="15">One nonzero signed target T; each signed leaf can occur once.</text><rect x="30" y="85" width="340" height="140" rx="10" fill="#fff" stroke="#8fa6bb"/><text x="47" y="110" font-size="15" font-weight="bold">Allowed path: independent rows</text><path d="M85 157H175H265" stroke="#387c8b" stroke-width="3"/><g fill="#d9eef0" stroke="#387c8b"><circle cx="85" cy="157" r="18"/><circle cx="175" cy="157" r="18"/><circle cx="265" cy="157" r="18"/></g><text x="80" y="162">i</text><text x="170" y="162">j</text><text x="260" y="162">k</text><text x="48" y="198" font-size="14">Opposite signs at j cancel; leaf forces</text><text x="48" y="215" font-size="14">one coefficient at a time to vanish.</text><rect x="390" y="85" width="340" height="140" rx="10" fill="#fff" stroke="#8fa6bb"/><text x="407" y="110" font-size="15" font-weight="bold">Forbidden cycle: ℓT = O</text><path d="M480 165L558 125L636 165Z" fill="none" stroke="#b65e48" stroke-width="3"/><g fill="#f5e1db" stroke="#b65e48"><circle cx="480" cy="165" r="11"/><circle cx="558" cy="125" r="11"/><circle cx="636" cy="165" r="11"/></g><text x="407" y="199" font-size="14">Cycle rows cancel but 0 &lt; ℓ ≤ B &lt; r.</text><text x="407" y="216" font-size="14">Thus no cycle in a nonzero fibre.</text><rect x="30" y="245" width="700" height="75" rx="10" fill="#e8eef5" stroke="#8fa6bb"/><text x="48" y="273" font-size="17" font-weight="bold">D ≥ (B − h)²; h ≤ B² − D</text><text x="48" y="296" font-size="14">h: homogeneous pair-collision rank; D: actual pair abscissae.</text><text x="48" y="313" font-size="13">Conditional mathematical certificate, not measured M31 rank.</text></g></svg>
