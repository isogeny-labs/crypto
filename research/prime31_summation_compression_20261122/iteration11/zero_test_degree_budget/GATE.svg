<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 310" role="img" aria-label="Default path degree budget"><rect width="850" height="310" fill="#f8fafc"/><g font-family="sans-serif" fill="#172554"><text x="25" y="35" font-size="22" font-weight="bold">Adaptive zero tests: the default path must cover every hit</text><text x="25" y="65" font-size="15">A bounded exception set is removed at each regular nonzero branch.</text><g fill="#e2e8f0" stroke="#64748b"><rect x="30" y="95" width="140" height="44" rx="6"/><rect x="225" y="95" width="140" height="44" rx="6"/><rect x="420" y="95" width="140" height="44" rx="6"/><rect x="650" y="95" width="160" height="44" rx="6"/></g><g font-size="15" text-anchor="middle"><text x="100" y="122">test f₁</text><text x="295" y="122">test f₂</text><text x="490" y="122">test f₃</text><text x="730" y="122">default leaf</text></g><g stroke="#334155" stroke-width="2" fill="none"><path d="M170 117H225M365 117H420M560 117H650"/><path d="M100 140V180M295 140V180M490 140V180"/></g><g fill="#d97706" font-size="15" text-anchor="middle"><text x="100" y="200">≤ δ exceptions</text><text x="295" y="200">≤ δ exceptions</text><text x="490" y="200">≤ δ exceptions</text></g><text x="25" y="246" font-size="18" font-weight="bold">B31: 618,884 positive points / 4 exceptions = 154,721 tests</text><text x="25" y="275" font-size="15">Conditional historical support; not a runtime bound or a bound on indexed retrieval.</text></g></svg>