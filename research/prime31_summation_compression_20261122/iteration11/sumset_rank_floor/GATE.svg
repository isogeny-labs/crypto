<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250"><rect width="720" height="250" fill="#fff"/><text x="25" y="31" font-family="sans-serif" font-size="20" font-weight="bold" fill="#17324d">Rank-extension via pair sumsets</text><g font-family="sans-serif" font-size="15"><rect x="25" y="60" width="260" height="55" rx="8" fill="#e7f0f7" stroke="#3a6f93"/><text x="45" y="83">Y0: pair has a row in W</text><text x="45" y="103">includes identity</text><rect x="25" y="130" width="260" height="55" rx="8" fill="#e6f2e9" stroke="#4b805e"/><text x="45" y="153">Y1: pair has a row outside W</text><text x="45" y="173">includes some doubled leaf</text><path d="M285 88 L365 122 M285 158 L365 122" stroke="#566779" stroke-width="2" fill="none"/><rect x="365" y="82" width="330" height="80" rx="8" fill="#f0f4f7" stroke="#566779"/><text x="380" y="106">Y0 + Y1: authentic outside-W rows</text><text x="380" y="131" font-weight="bold">At least 2D nonidentity targets</text><text x="380" y="151">No multiplicity hypothesis</text><text x="25" y="222" fill="#566779">Full unrestricted reporting; pair lookup cost unchanged.</text></g></svg>