<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410"><rect width="1000" height="410" fill="#f7f9fb"/><g font-family="sans-serif" fill="#142d42"><text x="40" y="45" font-size="26" font-weight="bold">One slope, one signed point split</text><text x="40" y="76" font-size="15">Incidence schematic, not a real plot of a finite-field curve.</text><rect x="40" y="105" width="445" height="215" rx="12" fill="white" stroke="#b5c5d3"/><rect x="515" y="105" width="445" height="215" rx="12" fill="white" stroke="#b5c5d3"/><text x="63" y="137" font-size="20" font-weight="bold">Distinct-point chord</text><text x="538" y="137" font-size="20" font-weight="bold">Doubled-point tangent</text><path d="M83 249L431 168" stroke="#4078a6" stroke-width="3"/><circle cx="113" cy="242" r="7" fill="#4078a6"/><circle cx="248" cy="211" r="7" fill="#1a805b"/><circle cx="392" cy="177" r="7" fill="#1a805b"/><text x="92" y="272" font-size="16">Q</text><text x="237" y="200" font-size="16">S</text><text x="385" y="166" font-size="16">U</text><text x="65" y="300" font-size="16">F has a double root; F′ = 0.</text><path d="M565 252L914 169" stroke="#4078a6" stroke-width="3"/><circle cx="603" cy="243" r="7" fill="#4078a6"/><path d="M675 205 Q750 265 817 188 Q849 151 884 153" fill="none" stroke="#1a805b" stroke-width="2"/><circle cx="817" cy="192" r="8" fill="#1a805b"/><text x="584" y="271" font-size="16">Q</text><text x="824" y="214" font-size="16">S = U</text><text x="538" y="300" font-size="16">F simple; quartic Δ = 0.</text><text x="40" y="358" font-size="21" font-weight="bold">C = gcd(F, F′Δ) is squarefree and indexes both cases.</text><text x="40" y="385" font-size="15">Handle O, ±T separately. A degree-2D norm still costs at least its explicit construction.</text></g></svg>