<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Exact signed m=4 contraction</title>
<desc id="desc">Complete signed pair-sum hash tables are joined at group element s and R-s, including identity and empty targets; both preparation and query costs are shown.</desc>
<rect width="1000" height="420" rx="18" fill="#f3f7fa"/>
<text x="40" y="51" font-size="27" font-weight="700" fill="#172e46" font-family="Arial,sans-serif">Exact signed four-summand contraction</text>
<text x="40" y="83" font-size="17" fill="#566a7b" font-family="Arial,sans-serif">Group-semiring control over the original elliptic group - not an S5 root-solving speedup</text>
<rect x="30" y="120" width="265" height="190" rx="14" fill="#ffffff" stroke="#a6c7d4" stroke-width="2"/>
<text x="55" y="162" font-size="21" font-weight="700" fill="#176c79" font-family="Arial,sans-serif">Signed base A</text>
<text x="55" y="198" font-size="18" fill="#172e46" font-family="Arial,sans-serif">All (P1,P2) in A x A</text>
<text x="55" y="228" font-size="17" fill="#172e46" font-family="Arial,sans-serif">H[s] stores pair labels</text>
<text x="55" y="264" font-size="16" fill="#6a7d8c" font-family="Arial,sans-serif">Setup: Theta(B^2)</text>
<rect x="370" y="120" width="260" height="190" rx="14" fill="#e6f4f3" stroke="#83b9ba" stroke-width="2"/>
<text x="395" y="162" font-size="21" font-weight="700" fill="#176c79" font-family="Arial,sans-serif">Contract by s</text>
<text x="395" y="200" font-size="20" fill="#172e46" font-family="Arial,sans-serif">t = R - s</text>
<text x="395" y="233" font-size="17" fill="#172e46" font-family="Arial,sans-serif">Lookup H[t] for all s</text>
<text x="395" y="264" font-size="16" fill="#a24e48" font-family="Arial,sans-serif">Empty cost: Theta(D)</text>
<rect x="705" y="120" width="265" height="190" rx="14" fill="#ffffff" stroke="#a6c7d4" stroke-width="2"/>
<text x="730" y="162" font-size="21" font-weight="700" fill="#176c79" font-family="Arial,sans-serif">Output / certify</text>
<text x="730" y="199" font-size="17" fill="#172e46" font-family="Arial,sans-serif">H[s] x H[R-s]</text>
<text x="730" y="233" font-size="17" fill="#172e46" font-family="Arial,sans-serif">Verify signed sum = R</text>
<text x="730" y="264" font-size="16" fill="#6a7d8c" font-family="Arial,sans-serif">Cost: Theta(Y4(R))</text>
<g fill="none" stroke="#3969a9" stroke-width="4"><path d="M298 212 H365"/><path d="M633 212 H700"/></g>
<g fill="#3969a9"><path d="M365 212 l-12 -8 v16 z"/><path d="M700 212 l-12 -8 v16 z"/></g>
<rect x="30" y="336" width="940" height="55" rx="9" fill="#e7edf2"/>
<text x="55" y="370" font-size="17" fill="#172e46" font-family="Arial,sans-serif">F4(R) = sum_s F2(s) F2(R-s)  |  zero subtotals, repeated leaves and both signs preserved</text>
</svg>