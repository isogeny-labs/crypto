<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
<title id="t">Exact signed pair-spectrum S3 resultant contraction</title>
<desc id="d">A 2B signed-point base contracts to B squared pair expressions and D split roots. The target produces a resultant remainder K and a gcd J; either a Bezout-certified miss or fully verified signed four-term witnesses.</desc>
<defs>
 <style>.bg{fill:#f7f9fc}.pane{fill:#fff;stroke:#bacbdc;stroke-width:2}.blue{fill:#e8f2ff;stroke:#4875a5;stroke-width:2}.cyan{fill:#e3faf4;stroke:#258c75;stroke-width:2}.warn{fill:#fff2e8;stroke:#bf774d;stroke-width:2}.txt{font:22px system-ui,sans-serif;fill:#1c3044}.small{font:17px system-ui,sans-serif;fill:#455a6f}.micro{font:14px ui-monospace,monospace;fill:#3c5367}.head{font:bold 29px system-ui,sans-serif;fill:#163450}.arr{stroke:#587591;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#587591"/></marker>
</defs>
<rect class="bg" width="1280" height="720"/>
<text class="head" x="56" y="55">Four-summand relation: an exact algebraic contraction</text>
<text class="small" x="56" y="85">Rational abscissae and signed witnesses • distinct spectrum roots, not algebraic multiplicities</text>
<rect class="blue" rx="16" x="56" y="124" width="275" height="150"/>
<text class="txt" x="78" y="164">Signed factor base</text>
<text class="micro" x="78" y="202">A = {±P₁, …, ±P_B}</text>
<text class="micro" x="78" y="229">L = 2B verified points</text>
<path class="arr" d="M331 198H383"/>
<rect class="blue" rx="16" x="385" y="124" width="336" height="150"/>
<text class="txt" x="406" y="162">Unoriented pair chart</text>
<text class="micro" x="406" y="197">Pᵢ ± Pⱼ (i&lt;j), 2Pᵢ</text>
<text class="micro" x="406" y="222">exactly B² expressions</text>
<text class="micro" x="406" y="245">zero pairs stored separately</text>
<path class="arr" d="M721 198H771"/>
<rect class="cyan" rx="16" x="773" y="124" width="446" height="150"/>
<text class="txt" x="795" y="162">Split pair-spectrum polynomial</text>
<text class="micro" x="795" y="196">H₂(V) = ∏ (V − x(S))</text>
<text class="micro" x="795" y="221">D distinct roots, D ≤ B²</text>
<text class="micro" x="795" y="245">known rational linear factors</text>
<path class="arr" d="M981 274V321"/>
<rect class="pane" rx="16" x="590" y="323" width="629" height="141"/>
<text class="txt" x="614" y="357">Target R: polynomial elimination</text>
<text class="micro" x="614" y="389">Kᵣ(V) = Resᵤ(H₂(U), S₃(U,V,x(R))) mod H₂(V)</text>
<text class="micro" x="614" y="419">Jᵣ(V) = gcd(H₂(V), Kᵣ(V)); check H₂(x(R))</text>
<path class="arr" d="M770 464V507H380V536"/>
<path class="arr" d="M1047 464V536"/>
<rect class="warn" rx="16" x="75" y="538" width="575" height="130"/>
<text class="txt" x="100" y="577">Certified EMPTY</text>
<text class="micro" x="100" y="609">H₂(x(R)) ≠ 0  and  Jᵣ = 1</text>
<text class="small" x="100" y="636">Check extended-gcd Bézout identity + input hashes</text>
<rect class="cyan" rx="16" x="685" y="538" width="534" height="130"/>
<text class="txt" x="708" y="577">Nonempty: rational witness extraction</text>
<text class="micro" x="708" y="609">Isolate known Fp roots; restore ± labels</text>
<text class="small" x="708" y="636">Replay all four group points and recover signed rows</text>
<text class="small" x="58" y="700">Setup Θ(B²) and empty-inclusive online query Õ(D); no τ &lt; 1 guarantee • PCC unverified</text>
</svg>