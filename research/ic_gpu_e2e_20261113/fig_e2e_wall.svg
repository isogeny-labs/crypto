<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 376" width="820" height="376" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
<title id="t">End-to-end IC solve wall time by solver</title>
<desc id="d">Whole-solve wall seconds (log scale) per instance for inherited-f4, fes-f2 and fes-f2-gpu; counted S over matched rho beside each bar. fes-f2 was not run at n=29.</desc>
<style>.bg{fill:#fcfcfb}.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}.p{fill:#0b0b0b}.q{fill:#52514e}.g{stroke:#e4e3df}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}.p{fill:#f0efec}.q{fill:#c3c2b7}.g{stroke:#383835}}</style>
<rect class="bg" width="820" height="376"/>
<text class="p" x="16" y="24" font-size="15" font-weight="600">Index calculus end to end: whole-solve wall time by descent solver</text>
<text class="q" x="16" y="42" font-size="12">seconds, log scale, summed over repeats; every row recovered the planted log. Right column: counted S / matched rho (the metric)</text>
<rect class="s1" x="16" y="54" width="12" height="12" rx="2"/><text class="p" x="34" y="64" font-size="12">inherited-f4 (CPU)</text>
<rect class="s2" x="172" y="54" width="12" height="12" rx="2"/><text class="p" x="190" y="64" font-size="12">fes-f2 (CPU)</text>
<rect class="s3" x="286" y="54" width="12" height="12" rx="2"/><text class="p" x="304" y="64" font-size="12">fes-f2-gpu (A100)</text>
<line class="g" x1="210.0" x2="210.0" y1="78" y2="342" stroke-width="1"/>
<text class="q" x="210.0" y="358" font-size="11" text-anchor="middle">1 s</text>
<line class="g" x1="331.2" x2="331.2" y1="78" y2="342" stroke-width="1"/>
<text class="q" x="331.2" y="358" font-size="11" text-anchor="middle">10 s</text>
<line class="g" x1="452.3" x2="452.3" y1="78" y2="342" stroke-width="1"/>
<text class="q" x="452.3" y="358" font-size="11" text-anchor="middle">100 s</text>
<line class="g" x1="573.5" x2="573.5" y1="78" y2="342" stroke-width="1"/>
<text class="q" x="573.5" y="358" font-size="11" text-anchor="middle">1000 s</text>
<text class="q" x="680" y="74" font-size="11">S / rho (counted)</text>
<text class="p" x="200" y="119.0" font-size="12" font-weight="600" text-anchor="end">Koblitz n=23 · 24 unknowns</text>
<g><title>Koblitz n=23 · 24 unknowns, inherited-f4: 38.7 s wall, S/rho 2,014, 2487 solver calls</title><path class="s1" d="M210,84 h188.4 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-188.4 z"/></g>
<text class="p" x="408.4" y="97.0" font-size="11">38.7 s</text>
<text class="q" x="680" y="97.0" font-size="11">2,014</text>
