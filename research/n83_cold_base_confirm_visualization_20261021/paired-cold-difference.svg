<?xml version="1.0" encoding="UTF-8"?>',
       f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" role="img" aria-labelledby="title desc">',
       '<title id="title">Paired cold-process difference by public point</title>',
       f'<desc id="desc">All 16 points favor K1107. Mean K1103 minus K1107 is {mean:.3f} seconds; 95% paired Student-t interval [{lo:.3f}, {hi:.3f}] seconds.</desc>',
       '<rect width="100%" height="100%" fill="white"/>',
       '<style>text{font-family:system-ui,sans-serif;fill:#182230}.grid{stroke:#d9e0e8}.axis{stroke:#344054;stroke-width:1.5}.point{fill:#1769aa;stroke:white;stroke-width:1.5}.mean{stroke:#bd4b00;stroke-width:3}.ci{stroke:#bd4b00;stroke-width:2;stroke-dasharray:7 5}.band{fill:#f4a261;fill-opacity:.18}.small{font-size:14px}.label{font-size:16px}.title{font-size:22px;font-weight:700}.sub{font-size:15px;fill:#475467}</style>',
       '<text class="title" x="105" y="32">K1107 cold-process advantage on 16 held-out N83 points</text>',
       f'<text class="sub" x="105" y="56">K1103 − K1107; positive favors K1107. Mean {mean:.3f} s, 95% CI [{lo:.3f}, {hi:.3f}] s.</text>']
    for t in (0,.5,1,1.5,2):
        yy=y(t);s.extend([f'<line class="grid" x1="{L}" y1="{yy:.1f}" x2="{R}" y2="{yy:.1f}"/>',f'<text class="small" x="{L-12}" y="{yy+5:.1f}" text-anchor="end">{t:.1f}</text>'])
    s.append(f'<rect class="band" x="{L}" y="{y(hi):.1f}" width="{R-L}" height="{y(lo)-y(hi):.1f}"/>')
    for i in range(1,17):
        xx=x(i);s.extend([f'<line class="grid" x1="{xx:.1f}" y1="{T}" x2="{xx:.1f}" y2="{B}"/>',f'<text class="small" x="{xx:.1f}" y="{B+22}" text-anchor="middle">{i}</text>'])
    s.extend([f'<line class="axis" x1="{L}" y1="{B}" x2="{R}" y2="{B}"/>',f'<line class="axis" x1="{L}" y1="{T}" x2="{L}" y2="{B}"/>',f'<line class="ci" x1="{L}" y1="{y(lo):.1f}" x2="{R}" y2="{y(lo):.1f}"/>',f'<line class="ci" x1="{L}" y1="{y(hi):.1f}" x2="{R}" y2="{y(hi):.1f}"/>',f'<line class="mean" x1="{L}" y1="{y(mean):.1f}" x2="{R}" y2="{y(mean):.1f}"/>'])
    for i,v in pts:s.append(f'<circle class="point" cx="{x(i):.1f}" cy="{y(v):.1f}" r="6"><title>Point {i}: {v:.3f} s</title></circle>')
    s.extend([f'<text class="label" x="{(L+R)/2}" y="{B+52}" text-anchor="middle">Public point index (n = 16)</text>',f'<text class="label" transform="translate(27 {(T+B)/2}) rotate(-90)" text-anchor="middle">Cold-process difference (seconds)</text>','<line class="mean" x1="655" y1="515" x2="690" y2="515"/><text class="small" x="699" y="520">paired mean</text>','<line class="ci" x1="805" y1="515" x2="840" y2="515"/><text class="small" x="849" y="520">95% CI</text>','<text class="small" x="105" y="552">Source: research/n83_cold_base_confirm_20261021/results/analysis.json; cold selection only.</text>','</svg>',''])
    return '\n'.join(s).encode()
def main():
    p=argparse.ArgumentParser();p.add_argument("--check",action="store_true");args=p.parse_args()
    data=render(json.loads(SOURCE.read_text()))
    if args.check:
        if not OUTPUT.exists() or OUTPUT.read_bytes()!=data: raise SystemExit("graph differs from admitted analysis")
    else: OUTPUT.write_bytes(data)
    print("PASS paired-cold-difference.svg (16 points)")
if __name__=="__main__":main()

