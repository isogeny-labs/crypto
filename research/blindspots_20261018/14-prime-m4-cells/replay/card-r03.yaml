schema: crypto.autoresearch.mechanical-task-card.v1
card_id: CARD-BLINDSPOT-14-R03
experiment_id: BLINDSPOT-14
author_role: experiment-director
executor_role: executor-mechanical
kind: frozen_command
# Replay of card-09 (arm (b), 28-bit design cell bx = 63, 16 random targets to the deterministic cap of 3e9 multiply-adds or 2.5e7 nonzeros)
# and card-04 (arm (b), 16-bit design cell bx = 8, target index 0 only of recorded indices 0-4; the two planted targets are generated as in card-04 but, with the target window 0 to 1, not run). Arguments are copied from those cards.

receipt: research/blindspots_20261018/14-prime-m4-cells/replay/raw/receipt-card-r03.json
must_not_exist:
  - research/blindspots_20261018/14-prime-m4-cells/replay/raw/receipt-card-r03.json
  - research/blindspots_20261018/14-prime-m4-cells/replay/raw/tdec-b-b28-bx63.jsonl
  - research/blindspots_20261018/14-prime-m4-cells/replay/raw/tdec-b-b16-bx8-t00-01.jsonl
binds:
  - {path: research/blindspots_20261018/instruments/blindspots_14_prime_m4.rs, sha256: f6696fc0cafff9120189072a7785452422d68c7944a2812d4667e27c8872b376}
commands:
  - id: make-dirs
    argv: ["mkdir", "-p", "research/blindspots_20261018/14-prime-m4-cells/replay/raw", "research/blindspots_20261018/14-prime-m4-cells/replay/bin-r03"]
    timeout_seconds: 10
    success_exit_codes: [0]
  - id: build
    argv: ["prlimit", "--as=4294967296", "rustc", "--edition", "2021", "-C", "opt-level=3", "-C", "codegen-units=1", "-C", "target-cpu=native", "-o", "research/blindspots_20261018/14-prime-m4-cells/replay/bin-r03/b14", "research/blindspots_20261018/instruments/blindspots_14_prime_m4.rs"]
    timeout_seconds: 120
    success_exit_codes: [0]
    stdout: research/blindspots_20261018/14-prime-m4-cells/replay/raw/card-r03-build.stdout.log
    stderr: research/blindspots_20261018/14-prime-m4-cells/replay/raw/card-r03-build.stderr.log
  - id: tdec-b-b28-bx63
    argv: ["prlimit", "--as=4294967296", "research/blindspots_20261018/14-prime-m4-cells/replay/bin-r03/b14", "tdec", "--bits", "28", "--arms", "b", "--bx", "63", "--targets", "16", "--bcap-madds", "3000000000", "--bcap-nnz", "25000000", "--bdeadline-s", "60", "--out", "research/blindspots_20261018/14-prime-m4-cells/replay/raw/tdec-b-b28-bx63.jsonl"]
    timeout_seconds: 240
    success_exit_codes: [0]
    stderr: research/blindspots_20261018/14-prime-m4-cells/replay/raw/card-r03-tdec-b-b28-bx63.stderr.log
    outputs: ["research/blindspots_20261018/14-prime-m4-cells/replay/raw/tdec-b-b28-bx63.jsonl"]
  - id: tdec-b-b16-bx8-t00-01
    argv: ["prlimit", "--as=4294967296", "research/blindspots_20261018/14-prime-m4-cells/replay/bin-r03/b14", "tdec", "--bits", "16", "--arms", "b", "--bx", "8", "--targets", "16", "--planted", "2", "--check", "--t0", "0", "--t1", "1", "--bcap-madds", "100000000000", "--bcap-nnz", "120000000", "--bdeadline-s", "400", "--out", "research/blindspots_20261018/14-prime-m4-cells/replay/raw/tdec-b-b16-bx8-t00-01.jsonl"]
