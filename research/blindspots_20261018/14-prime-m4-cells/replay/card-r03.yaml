  - id: remove-bin-dir
    argv: ["rmdir", "research/blindspots_20261018/14-prime-m4-cells/replay/bin-r03"]
    timeout_seconds: 10
    success_exit_codes: [0]

bus_address: executor-mechanical-blindspot-14
