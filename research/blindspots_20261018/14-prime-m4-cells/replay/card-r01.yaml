schema: crypto.autoresearch.mechanical-task-card.v1
card_id: CARD-BLINDSPOT-14-R01
experiment_id: BLINDSPOT-14
author_role: experiment-director
executor_role: executor-mechanical
kind: frozen_command
# Replay of card-01 (selftest, arm (a) and matched rho) at the smallest (16-bit) and largest (28-bit) field sizes, plus the 16-bit bx = 3 paired cell.
# Instrument source read from its frozen path research/blindspots_20261018/instruments/ (sha256 unchanged from the original cards). Outputs are new files under replay/raw/.

receipt: research/blindspots_20261018/14-prime-m4-cells/replay/raw/receipt-card-r01.json
must_not_exist:
