bus_address: executor-mechanical-blindspot-14
background: false
write_scope:
  - research/blindspots_20261018/14-prime-m4-cells/replay/
stop_when:
  - The tool exits with status 2.
  - The status line in the printed summary does not read status completed.
  - Any command line in the printed summary ends with FAILED.
  - Any output line in the printed summary ends with MISSING.
notes: "The repository root is /home/user/crypto. Run the command through the Bash tool with timeout 600000. Run the cards one after another, never at the same time."
