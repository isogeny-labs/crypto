schema: crypto.autoresearch.mechanical-task-card.v1
card_id: CARD-BLINDSPOT-01-11
experiment_id: BLINDSPOT-01
author_role: experiment-director
executor_role: executor-mechanical
kind: frozen_command

receipt: research/blindspots_20261018/01-fp2-gaudry-k2/raw/receipt-card-11.json
must_not_exist:
  - research/blindspots_20261018/01-fp2-gaudry-k2/raw/receipt-card-11.json
  - research/blindspots_20261018/01-fp2-gaudry-k2/raw/summary.json
binds:
  - {path: examples/blindspots_01_fp2_gaudry.rs, sha256: 0629a73c7ff443e70c6ce16c0872b98a5aebc5a71d25f7bff60156c8693ff559}
commands:
  - id: make-bin-dir
    argv: [mkdir, "-p", target/blindspots-01/card-11]
    timeout_seconds: 15
    success_exit_codes: [0]
  - id: build
    argv: [prlimit, --as=4294967296, rustc, --edition, "2021", "-C", opt-level=3, "-C", codegen-units=1, "-o", target/blindspots-01/card-11/b01, examples/blindspots_01_fp2_gaudry.rs]
    timeout_seconds: 60
    success_exit_codes: [0]
  - id: summarize
    argv: [prlimit, --as=4294967296, target/blindspots-01/card-11/b01, summarize, --dir, research/blindspots_20261018/01-fp2-gaudry-k2/raw, --out, research/blindspots_20261018/01-fp2-gaudry-k2/raw/summary.json]
    timeout_seconds: 120
    success_exit_codes: [0]
    outputs: [research/blindspots_20261018/01-fp2-gaudry-k2/raw/summary.json]
  - id: remove-bin
    argv: [rm, "-f", target/blindspots-01/card-11/b01]
    timeout_seconds: 15
    success_exit_codes: [0]

bus_address: executor-mechanical-blindspot-01
background: false
write_scope:
  - research/blindspots_20261018/01-fp2-gaudry-k2/raw/
  - target/blindspots-01/
stop_when:
  - The tool exits with status 2.
  - The status line in the printed summary does not read status completed.
  - Any command line in the printed summary ends with FAILED.
  - Any output line in the printed summary ends with MISSING.
notes: "The repository root is /home/user/crypto."
