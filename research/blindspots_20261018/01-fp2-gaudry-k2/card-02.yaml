  - id: prime-b32
    argv: [prlimit, --as=4294967296, target/blindspots-01/card-02/b01, run, --family, prime, --bits, "32", --idx, 0-2, --arms, "ic-a:0-1,rho-neg:0-7", --inv-cost, "4", --crosscheck, "60", --quiet, --out, research/blindspots_20261018/01-fp2-gaudry-k2/raw/prime-b32.jsonl]
    timeout_seconds: 45
    success_exit_codes: [0]
    outputs: [research/blindspots_20261018/01-fp2-gaudry-k2/raw/prime-b32.jsonl]
  - id: rate-b32
    argv: [prlimit, --as=4294967296, target/blindspots-01/card-02/b01, run, --family, torsion, --bits, "32", --idx, 0-2, --arms, "control-shuffled-rate:0", --inv-cost, "4", --control-trials, "200", --quiet, --out, research/blindspots_20261018/01-fp2-gaudry-k2/raw/rate-b32.jsonl]
