    argv: [prlimit, --as=4294967296, target/blindspots-01/card-02/b01, run, --family, gls, --bits, "32", --idx, 0-2, --arms, "ic-gls-neg:0-1,ic-gls-psi:0-1,rho-neg:0-7,rho-psi:0-7", --inv-cost, "4", --crosscheck, "60", --quiet, --out, research/blindspots_20261018/01-fp2-gaudry-k2/raw/gls-b32.jsonl]
