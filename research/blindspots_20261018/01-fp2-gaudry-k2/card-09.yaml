  - id: gls-b40-i2
    argv: [prlimit, --as=4294967296, target/blindspots-01/card-09/b01, run, --family, gls, --bits, "40", --idx, "2", --arms, "ic-gls-neg:0-1,ic-gls-psi:0-1,rho-neg:0-7,rho-psi:0-7", --inv-cost, "4", --crosscheck, "10", --quiet, --out, research/blindspots_20261018/01-fp2-gaudry-k2/raw/gls-b40-i2.jsonl]
    timeout_seconds: 220
    success_exit_codes: [0]
