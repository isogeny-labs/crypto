    outputs: [research/blindspots_20261018/01-fp2-gaudry-k2/raw/rate-b40-i1.jsonl]
  - id: rate-b40-i2
    argv: [prlimit, --as=4294967296, target/blindspots-01/card-09/b01, run, --family, torsion, --bits, "40", --idx, "2", --arms, "control-shuffled-rate:0", --inv-cost, "4", --control-trials, "200", --quiet, --out, research/blindspots_20261018/01-fp2-gaudry-k2/raw/rate-b40-i2.jsonl]
