  verdict_meaning: >-
    The receipt is admissible evidence: the records are complete, bound, reproducible (rebuild,
    bit-identical replay, deterministic references), and every reported number follows from them.
    The frozen-rule verdicts "below measured rho at p" against rhodp at 1451 and 1601 are reproduced
    and stand as stated. This does not support a claim of beating rho: not against the negation-map
    rhostrong, not under the tuned price, not under any section-5a weight above 0, not under a
    t-based interval; 1451 lies inside the instrument-change margin; scale l ~ 2^61, weak class only.
