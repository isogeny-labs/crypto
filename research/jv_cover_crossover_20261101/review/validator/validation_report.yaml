    - 3 cover seeds per prime; the frozen percentile bootstrap is coarse in the seed direction (10 support points); a t interval resolves nothing
    - 1451 verdict within the 5.4% instrument-change margin (fast vs sparse linear stage)
    - calibration control confounded at p=251 by the 2^20 stop-poll lag (0.199 S-units); it neither establishes nor excludes a 0.3 bias, though the mechanism is absent at the new primes
    - correctness independently verified on 1 of 9 cover runs; the rest and all rho runs on the producer's planted-log flag
    - F_p-multiplication counters (f4_fp, Fq, FastStats) taken as the instrument (consistency verified; F4 not re-implemented); prior independent validations exist (research/postgb_linear_stage_20261026)
    - rhodp reference at the new primes not re-measured (27 recorded runs recomputed, not rerun); study rhodp used 4 walkers, this validation's cap was 2 threads
    - freeze before data rests on the producer's record and timestamps
    - memory not reported by any arm
    - scale l ~ 2^61 (p^6 ~ 2^63), weak class only; no statement about prime-order or deployed curves
