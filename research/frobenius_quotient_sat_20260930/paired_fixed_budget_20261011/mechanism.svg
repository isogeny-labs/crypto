   <g id="text_1">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start" x="14.254364" y="23.670261" transform="rotate(-0 14.254364 23.670261)">Mechanism claimed for phase-aware summation, and what is measured here</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f6fb2" x="14.254364" y="52.628347" transform="rotate(-0 14.254364 52.628347)">A  representatives only</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(41.934646 104.433801)">target R</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(29.479489 114.636125)">(fixed, frozen)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(183.82107 99.332971)">4 summands, x_i = v_i</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(191.710796 109.535295)">v_i in a 4-dim span</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(203.797398 119.73762)">(5 valid reps)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(384.269256 99.332971)">S3 chain + line/final</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(375.712146 109.535295)">equation, CryptoMiniSat</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(384.695584 119.73762)">1 thread, 120 s CPU</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(550.123516 104.434133)">5 admissible x</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(533.697266 114.636458)">(effective factor base)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(679.386432 99.332971)">relation row over</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(685.259401 109.535295)">5 rep columns</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(695.860494 119.73762)">coeff +-1</text>
   </g>
