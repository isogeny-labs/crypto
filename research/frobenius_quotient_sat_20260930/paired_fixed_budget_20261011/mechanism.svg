   </g>
   <g id="text_10">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(164.911226 237.688274)">4 summands, x_i = v_i^(2^k_i)</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(163.244429 247.890598)">one-hot phase e_i (13 bits each)</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(166.427281 258.092923)">adds 13 AND gates per bit of x</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(384.269256 237.688274)">S3 chain + line/final</text>
