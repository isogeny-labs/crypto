    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(384.695584 258.092923)">1 thread, 120 s CPU</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(547.419453 242.789436)">65 admissible x</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(537.203516 252.99176)">(5 reps x 13 phases)</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(679.386432 237.688274)">relation row over</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(671.863932 247.890598)">the SAME 5 columns</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(662.729752 258.092923)">coeff +-lambda^k mod r</text>
   </g>
