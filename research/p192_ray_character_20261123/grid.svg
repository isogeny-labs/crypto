<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Circular exponent intervals and cost gate for the P-192 square grid">
  <rect width="960" height="560" fill="#f8fafc"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172033} .title{font-size:28px;font-weight:700}.sub{font-size:16px}.lab{font-size:18px;font-weight:700}.small{font-size:15px}.mono{font-family:monospace;font-size:16px}.blue{fill:#2563eb}.amber{fill:#b45309}
  </style>
  <text x="40" y="52" class="title">Square-class grid: coverage before cost</text>
  <text x="40" y="82" class="sub">P-192 · labels in Fᵣ×/{±1}, N = (r−1)/4 · derived model, not a runtime measurement</text>
  <rect x="38" y="112" width="884" height="205" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text x="58" y="145" class="lab">Rows are intervals of M labels, shifted by public c</text>
  <line x1="93" y1="260" x2="868" y2="260" stroke="#64748b" stroke-width="3"/>
  <line x1="93" y1="253" x2="93" y2="267" stroke="#64748b" stroke-width="3"/>
  <line x1="868" y1="253" x2="868" y2="267" stroke="#64748b" stroke-width="3"/>
  <text x="75" y="288" class="small">0</text><text x="852" y="288" class="small">N</text>
  <rect x="110" y="177" width="243" height="32" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="125" y="200" class="mono">[0, M−1]</text>
  <rect x="313" y="218" width="243" height="32" rx="6" fill="#93c5fd" stroke="#2563eb"/>
  <text x="329" y="241" class="mono">[c, c+M−1]</text>
  <rect x="619" y="177" width="240" height="32" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="632" y="200" class="mono">[(L−1)c, ...]</text>
  <path d="M557 244 L607 244" stroke="#b45309" stroke-width="6" stroke-dasharray="7 5"/>
  <text x="568" y="292" class="small amber">gap &gt; M leaves labels uncovered</text>
  <rect x="38" y="339" width="426" height="179" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="58" y="374" class="lab">Exact coverage certificate</text>
  <text x="58" y="404" class="mono">gaps: a, b, a+b</text>
  <text x="58" y="432" class="mono">U(L,M) = Σ count(g) min(M,g)</text>
  <text x="58" y="472" class="small">Full cover iff M ≥ largest circular gap</text>
  <rect x="482" y="339" width="440" height="179" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="502" y="374" class="lab">Point-work and memory gate</text>
  <text x="502" y="404" class="mono">C = 0.5(M−1)+0.75(L−1+E[J])</text>
  <text x="502" y="433" class="mono">rho ≈ 2^95.826 additions</text>
  <text x="502" y="472" class="small">32 M bytes for 32-byte table records</text>
  <text x="40" y="544" class="small">Source: REPORT.md and native/src/main.rs · [pcc:unverified]</text>
</svg>
