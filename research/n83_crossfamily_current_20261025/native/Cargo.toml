[package]
name = "n83-crossfamily-current-native"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
crypto_lib = { package = "crypto", path = "../../.." }
flate2 = "1.1"
hmac = "0.12"
hex = "0.4"
libc = "0.2"
num-bigint = "0.4"
num-traits = "0.2"
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"

[profile.release]
overflow-checks = true
