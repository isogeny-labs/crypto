<svg xmlns="http://www.w3.org/2000/svg" width="500" height="126" viewBox="0 0 500 126">
<text x="10" y="13" font-family="DejaVu Sans,sans-serif" font-size="9" fill="#234b70">Actual geometric 2-torsion over algebraically closed fields</text>
<rect x="3" y="26" width="151" height="42" rx="4" fill="#edf3f8" stroke="#8eb0cb"/>
<text x="9" y="43" font-family="DejaVu Sans,sans-serif" font-size="8.2" fill="#234b70">2 ≠ 0</text>
<text x="9" y="60" font-family="DejaVu Sans,sans-serif" font-size="7.6" fill="#234b70">4 points; explicit binary basis</text>
<rect x="173" y="26" width="151" height="42" rx="4" fill="#edf3f8" stroke="#8eb0cb"/>
<text x="179" y="43" font-family="DejaVu Sans,sans-serif" font-size="8.2" fill="#234b70">Characteristic2, a₁=0</text>
<text x="179" y="60" font-family="DejaVu Sans,sans-serif" font-size="7.6" fill="#234b70">1 point: identity only</text>
<rect x="343" y="26" width="151" height="42" rx="4" fill="#edf3f8" stroke="#8eb0cb"/>
<text x="349" y="43" font-family="DejaVu Sans,sans-serif" font-size="8.2" fill="#234b70">Characteristic2, a₁≠0</text>
<text x="349" y="60" font-family="DejaVu Sans,sans-serif" font-size="7.6" fill="#234b70">2 points: unique nonzero</text>
<rect x="3" y="81" width="491" height="37" rx="4" fill="#edf3f8" stroke="#8eb0cb"/>
<text x="11" y="95" font-family="DejaVu Sans,sans-serif" font-size="8.3" fill="#234b70">Actual E/F2: y²+xy=x³+1, #E=4; geometric E[2] has2 points, all rational.</text>
<text x="11" y="111" font-family="DejaVu Sans,sans-serif" font-size="8.1" fill="#234b70">2 ∤ 2^k−1 (k&gt;0). Qualified corpus node retains gcd(r,q)=1: not refuted.</text>
</svg>
