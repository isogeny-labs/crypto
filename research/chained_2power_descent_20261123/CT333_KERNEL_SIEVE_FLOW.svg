<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="380" viewBox="0 0 1160 380" role="img" aria-label="Frobenius kernel sieve: six Weierstrass roots give fifteen matchings; three zero-kernel splitting types; a rational kernel is not a cheaper ECDLP transfer">
<rect width="1160" height="380" rx="16" fill="#f5f8fa"/>
<text x="40" y="46" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#17334a">CT333: rational Richelot-kernel screening</text>
<text x="40" y="75" font-family="Arial,sans-serif" font-size="14" fill="#435c70">Frobenius acts on 15 unordered pair partitions of six geometric branch points</text>
<rect x="35" y="108" width="316" height="184" rx="12" fill="#e3edf3" stroke="#c2d5e0"/>
<text x="54" y="141" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#17334a">No rational first step</text>
<text x="54" y="178" font-family="Arial,sans-serif" font-size="17" fill="#17334a">(3)(1)(1)(1)  :  0/15</text>
<text x="54" y="211" font-family="Arial,sans-serif" font-size="17" fill="#17334a">(3)(2)(1)     :  0/15</text>
<text x="54" y="244" font-family="Arial,sans-serif" font-size="17" fill="#17334a">(5)(1)          :  0/15</text>
<path d="M 352 202 L 405 202" stroke="#54778a" stroke-width="3"/>
<path d="M 395 195 L 406 202 L 395 209" fill="none" stroke="#54778a" stroke-width="3"/>
<rect x="415" y="108" width="330" height="184" rx="12" fill="#e0f1f0" stroke="#a9d1cb"/>
<text x="434" y="141" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#17334a">Rational subgroup, split roots?</text>
<text x="434" y="176" font-family="Arial,sans-serif" font-size="17" fill="#17334a">(3)(3): 3 stable subgroups</text>
<text x="434" y="206" font-family="Arial,sans-serif" font-size="16" fill="#17334a">0 with all pair classes fixed</text>
<text x="434" y="248" font-family="Arial,sans-serif" font-size="14" fill="#426477">Frobenius permutes the triple</text>
<path d="M 746 202 L 797 202" stroke="#54778a" stroke-width="3"/>
<path d="M 787 195 L 798 202 L 787 209" fill="none" stroke="#54778a" stroke-width="3"/>
<rect x="809" y="108" width="316" height="184" rx="12" fill="#edf0f5" stroke="#c2cbd7"/>
<text x="829" y="141" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#17334a">Still required: full solver</text>
<text x="829" y="177" font-family="Arial,sans-serif" font-size="15" fill="#17334a">Descended explicit morphism</text>
<text x="829" y="208" font-family="Arial,sans-serif" font-size="15" fill="#17334a">Transfer + Cantor + IC + LA</text>
<text x="829" y="239" font-family="Arial,sans-serif" font-size="15" fill="#17334a">Strongest cold rho/BSGS/IC</text>
<text x="40" y="330" font-family="Arial,sans-serif" font-size="14" fill="#435c70">Zero rational kernels restrict only the first base-field (2,2) step. Nonrational multihop descents remain possible.</text>
<text x="40" y="354" font-family="Arial,sans-serif" font-size="13" fill="#6d8192">Producer-only combinatorial result  |  720 permutations  |  [pcc:unverified]  |  2026-11-23</text>
</svg>