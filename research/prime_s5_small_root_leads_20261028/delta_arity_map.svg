<?xml version="1.0" encoding="UTF-8"?>
<!-- Lead 4 (2026-10-28): delta-vs-arity map for S_{m+1} small-root decomposition oracles over F_p.
     Hand-written, editable SVG. Every coordinate is computed from the formulas stated in README.md §3:
       Panel A: y = 60 + 133.333 * (-log10 delta); x(m) = 120 + 92.5 * (m - 2).
       Panel B: x = 640 + 1333.33 * delta; y = 460 - 400 * tau.
     Provenance: black = measured (Probe B/C, 2026-10-08); blue = derived (this note);
     green = derived target region (program note §2.1 + §2.4); red x = killed on paper (derived). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" font-family="Helvetica, Arial, sans-serif" font-size="11">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="700" fill="#ffffff"/>
  <text x="540" y="24" text-anchor="middle" font-size="15" font-weight="bold">Prime-field S₄/S₅ decomposition oracles: required reach vs lattice reach (lead 4, 2026-10-28)</text>
  <text x="540" y="42" text-anchor="middle" font-size="11" fill="#444">No idea is placed inside a target region. Killed-idea markers are paper estimates (derived), not runs.</text>

  <!-- ===================== PANEL A ===================== -->
  <g id="panelA">
    <text x="305" y="58" text-anchor="middle" font-size="12" font-weight="bold">A. Reach δ (B = p^δ) vs number of summands m (polynomial S_{m+1})</text>
    <!-- target band (m >= 4) between delta_req and 1/4 -->
    <polygon points="305,163.8 397.5,180.4 490,193.3 490,140.3 305,140.3" fill="#2e9d4a" fill-opacity="0.22" stroke="none"/>
    <text x="420" y="162" text-anchor="middle" font-size="10" fill="#1d6b32">beats rho (T_dec = O(1))</text>
    <!-- axes -->
    <line x1="90" y1="460" x2="520" y2="460" stroke="#000"/>
    <line x1="90" y1="60" x2="90" y2="460" stroke="#000"/>
    <!-- y ticks (log scale) -->
    <g font-size="10" text-anchor="end">
      <line x1="86" y1="60" x2="90" y2="60" stroke="#000"/><text x="83" y="64">1</text>
      <line x1="86" y1="100.1" x2="90" y2="100.1" stroke="#000"/><text x="83" y="104">1/2</text>
      <line x1="86" y1="140.3" x2="90" y2="140.3" stroke="#000"/><text x="83" y="144">1/4</text>
      <line x1="86" y1="193.3" x2="90" y2="193.3" stroke="#000"/><text x="83" y="197">0.1</text>
      <line x1="86" y1="233.5" x2="90" y2="233.5" stroke="#000"/><text x="83" y="237">0.05</text>
      <line x1="86" y1="326.7" x2="90" y2="326.7" stroke="#000"/><text x="83" y="331">0.01</text>
      <line x1="86" y1="366.8" x2="90" y2="366.8" stroke="#000"/><text x="83" y="371">0.005</text>
      <line x1="86" y1="460" x2="90" y2="460" stroke="#000"/><text x="83" y="464">0.001</text>
    </g>
    <text x="34" y="260" transform="rotate(-90 34 260)" text-anchor="middle" font-size="11">δ (log scale)</text>
    <!-- x ticks -->
    <g font-size="10" text-anchor="middle">
      <line x1="120" y1="460" x2="120" y2="464" stroke="#000"/><text x="120" y="476">m=2 (S₃)</text>
      <line x1="212.5" y1="460" x2="212.5" y2="464" stroke="#000"/><text x="212.5" y="476">m=3 (S₄)</text>
      <line x1="305" y1="460" x2="305" y2="464" stroke="#000"/><text x="305" y="476">m=4 (S₅)</text>
      <line x1="397.5" y1="460" x2="397.5" y2="464" stroke="#000"/><text x="397.5" y="476">m=5 (S₆)</text>
      <line x1="490" y1="460" x2="490" y2="464" stroke="#000"/><text x="490" y="476">m=6 (S₇)</text>
    </g>
    <!-- linear-algebra wall delta = 1/4 -->
    <line x1="90" y1="140.3" x2="520" y2="140.3" stroke="#c0392b" stroke-dasharray="6,4"/>
    <text x="518" y="134" text-anchor="end" font-size="10" fill="#c0392b">δ = 1/4 wall (m·B² ≥ √p)</text>
    <!-- required lower edge 1/(2(m-1)) -->
    <polyline points="120,100.1 212.5,140.3 305,163.8 397.5,180.4 490,193.3" fill="none" stroke="#1d6b32" stroke-width="1.6" stroke-dasharray="3,3"/>
    <text x="128" y="94" font-size="10" fill="#1d6b32">δ_req = 1/(2(m−1)) (relation phase &lt; √p)</text>
    <!-- JM / Sym asymptotic -->
    <polyline points="120,163.8 212.5,244.0 305,313.7 397.5,377.4 490,437.0" fill="none" stroke="#1f5fbf" stroke-width="2"/>
    <g fill="#1f5fbf"><circle cx="120" cy="163.8" r="2.5"/><circle cx="212.5" cy="244.0" r="2.5"/><circle cx="305" cy="313.7" r="2.5"/><circle cx="397.5" cy="377.4" r="2.5"/><circle cx="490" cy="437.0" r="2.5"/></g>
    <text x="404" y="364" font-size="9.5" fill="#1f5fbf">JM = Sym asymptotic,</text>
    <text x="404" y="375" font-size="9.5" fill="#1f5fbf">1/(m(m+1)2^(m−2)) (derived)</text>
    <!-- milestone and goal -->
    <polygon points="212.5,133.3 214.6,138.2 219.8,138.6 215.9,141.9 217.1,147.0 212.5,144.3 207.9,147.0 209.1,141.9 205.2,138.6 210.4,138.2" fill="#e0a800" stroke="#7a5c00" stroke-width="0.6"/>
    <text x="222" y="128" font-size="10" fill="#7a5c00">milestone S₄, δ ≥ 1/4 (ties rho)</text>
    <polygon points="305,146.2 307.1,151.1 312.3,151.5 308.4,154.8 309.6,159.9 305,157.2 300.4,159.9 301.6,154.8 297.7,151.5 302.9,151.1" fill="#e0a800" stroke="#7a5c00" stroke-width="0.6"/>
    <text x="314" y="152" font-size="10" fill="#7a5c00">goal S₅, δ ≈ 1/5</text>
    <!-- measured m=2 (Probe B/C) -->
    <circle cx="120" cy="193.3" r="3.5" fill="#000"/>
    <line x1="120" y1="166.1" x2="120" y2="173.9" stroke="#555" stroke-width="5"/>
    <text x="115" y="197" text-anchor="end" font-size="8.5" fill="#000">HG</text>
    <text x="115" y="173" text-anchor="end" font-size="8.5" fill="#555">heur.</text>
    <!-- practical finite-level points (derived) -->
    <g fill="#ffffff" stroke="#1f5fbf" stroke-width="1.5">
      <circle cx="212.5" cy="266.6" r="3.5"/>
      <circle cx="212.5" cy="292.1" r="3.5"/>
      <circle cx="305" cy="362.0" r="3.5"/>
      <circle cx="305" cy="392.7" r="3.5"/>
    </g>
    <g font-size="9" fill="#1f5fbf" text-anchor="end">
      <text x="205" y="270">1/35.5 (Sym ℓ=4, dim 969)</text>
      <text x="205" y="296">1/55 (Sym ℓ=2, dim 165)</text>
      <text x="299" y="366">1/184 (ℓ=3, dim 20475)</text>
      <text x="299" y="396">1/313 (ℓ=2, dim 4845)</text>
      <text x="299" y="452">ℓ=1 (dim 495): 1.3e−4, off scale ↓</text>
    </g>
    <!-- gap arrows at m=4 -->
    <line x1="318" y1="311" x2="318" y2="162" stroke="#444" stroke-width="1" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <text x="322" y="240" font-size="10" fill="#444">16×</text>
    <line x1="338" y1="390" x2="338" y2="162" stroke="#444" stroke-width="1" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <text x="342" y="292" font-size="10" fill="#444">≈63×</text>
    <!-- idea markers -->
    <g font-size="9">
      <rect x="402" y="318" width="112" height="28" fill="#eef3fb" stroke="#1f5fbf"/>
      <text x="406" y="329" fill="#1f5fbf">L4-B: this curve is the</text>
      <text x="406" y="341" fill="#1f5fbf">ceiling if P1–P3 hold</text>
      <rect x="142" y="306" width="62" height="16" fill="#eef3fb" stroke="#1f5fbf"/>
      <text x="146" y="317" fill="#1f5fbf">L4-A: runs ○</text>
      <!-- L4-D bracket at m=3 between practical bound and JM -->
      <path d="M 219,292 L 223,292 L 223,244 L 219,244" fill="none" stroke="#8e44ad" stroke-width="1.4"/>
      <text x="227" y="271" fill="#8e44ad">L4-D: q(δ) decay</text>
      <!-- L4-C bracket at m=3 between JM and 1/4 -->
      <path d="M 233,242 L 237,242 L 237,144 L 233,144" fill="none" stroke="#d35400" stroke-width="1.4"/>
      <text x="241" y="192" fill="#d35400">L4-C: structure</text>
      <text x="241" y="203" fill="#d35400">test in this gap</text>
    </g>
    <!-- killed markers (red x) -->
    <g stroke="#c0392b" stroke-width="1.8">
      <line x1="128" y1="199.9" x2="136" y2="207.9"/><line x1="136" y1="199.9" x2="128" y2="207.9"/>
      <line x1="128" y1="223.3" x2="136" y2="231.3"/><line x1="136" y1="223.3" x2="128" y2="231.3"/>
      <line x1="208.5" y1="367.3" x2="216.5" y2="375.3"/><line x1="216.5" y1="367.3" x2="208.5" y2="375.3"/>
      <line x1="301" y1="309.7" x2="309" y2="317.7"/><line x1="309" y1="309.7" x2="301" y2="317.7"/>
    </g>
    <g font-size="9" fill="#c0392b">
      <text x="139" y="208">K6</text>
      <text x="139" y="231">K7</text>
      <text x="204" y="389" text-anchor="end">K8 u = x³ ≈ 1/216</text>
    </g>
  </g>

  <!-- ===================== PANEL B ===================== -->
  <g id="panelB">
    <text x="840" y="58" text-anchor="middle" font-size="12" font-weight="bold">B. Oracle cost exponent τ = log_p T_dec vs δ, at m = 4 (S₅)</text>
    <!-- target triangle: delta in (1/6,1/4), tau < 3 delta - 1/2 -->
    <polygon points="862.2,460 973.3,460 973.3,360" fill="#2e9d4a" fill-opacity="0.30" stroke="#1d6b32" stroke-width="0.8"/>
    <text x="945" y="440" text-anchor="middle" font-size="9" fill="#1d6b32">target</text>
    <!-- axes -->
    <line x1="640" y1="460" x2="1040" y2="460" stroke="#000"/>
    <line x1="640" y1="60" x2="640" y2="460" stroke="#000"/>
    <g font-size="10" text-anchor="middle">
      <line x1="640" y1="460" x2="640" y2="464" stroke="#000"/><text x="640" y="476">0</text>
      <line x1="706.7" y1="460" x2="706.7" y2="464" stroke="#000"/><text x="706.7" y="476">0.05</text>
      <line x1="773.3" y1="460" x2="773.3" y2="464" stroke="#000"/><text x="773.3" y="476">0.1</text>
      <line x1="862.2" y1="460" x2="862.2" y2="464" stroke="#000"/><text x="862.2" y="476">1/6</text>
      <line x1="906.7" y1="460" x2="906.7" y2="464" stroke="#000"/><text x="906.7" y="476">1/5</text>
      <line x1="973.3" y1="460" x2="973.3" y2="464" stroke="#000"/><text x="973.3" y="476">1/4</text>
      <line x1="1040" y1="460" x2="1040" y2="464" stroke="#000"/><text x="1040" y="476">0.3</text>
    </g>
    <text x="840" y="492" text-anchor="middle" font-size="11">δ</text>
    <g font-size="10" text-anchor="end">
      <line x1="636" y1="460" x2="640" y2="460" stroke="#000"/><text x="633" y="464">0</text>
      <line x1="636" y1="360" x2="640" y2="360" stroke="#000"/><text x="633" y="364">0.25</text>
      <line x1="636" y1="260" x2="640" y2="260" stroke="#000"/><text x="633" y="264">0.5</text>
      <line x1="636" y1="160" x2="640" y2="160" stroke="#000"/><text x="633" y="164">0.75</text>
      <line x1="636" y1="60" x2="640" y2="60" stroke="#000"/><text x="633" y="64">1</text>
    </g>
    <text x="604" y="260" transform="rotate(-90 604 260)" text-anchor="middle" font-size="11">τ</text>
    <!-- wall delta = 1/4 -->
    <line x1="973.3" y1="60" x2="973.3" y2="460" stroke="#c0392b" stroke-dasharray="6,4"/>
    <text x="978" y="75" font-size="9" fill="#c0392b">δ = 1/4 wall</text>
    <!-- boundary tau = 3 delta - 1/2 -->
    <line x1="862.2" y1="460" x2="1040" y2="300" stroke="#1d6b32" stroke-dasharray="3,3" stroke-width="1.4"/>
    <text x="978" y="296" font-size="9" fill="#1d6b32">τ = 3δ − 1/2</text>
    <!-- enumeration tau = 3 delta -->
    <line x1="640" y1="460" x2="1040" y2="100" stroke="#000" stroke-width="1.8"/>
    <text x="880" y="230" font-size="9" fill="#000" transform="rotate(-42 880 230)">generic: enumerate 3, root-find the 4th: τ = 3δ</text>
    <!-- BGS interval product tau = 3.2 delta -->
    <line x1="640" y1="460" x2="1040" y2="76" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="780" y="316" font-size="9" fill="#c0392b" transform="rotate(-44 780 316)">K4 box product (BGS): τ = 3.2δ</text>
    <!-- lattice and hybrids -->
    <line x1="640" y1="460" x2="656.7" y2="460" stroke="#1f5fbf" stroke-width="5"/>
    <line x1="640" y1="460" x2="667.8" y2="451.7" stroke="#1f5fbf" stroke-width="2.5"/>
    <line x1="640" y1="460" x2="695.6" y2="426.7" stroke="#1f5fbf" stroke-width="2.5"/>
    <circle cx="656.7" cy="460" r="2.5" fill="#1f5fbf"/>
    <circle cx="667.8" cy="451.7" r="2.5" fill="#1f5fbf"/>
    <circle cx="695.6" cy="426.7" r="2.5" fill="#1f5fbf"/>
    <g font-size="8.5" fill="#1f5fbf">
      <text x="700" y="424">enum. 2 + 2-var lattice: τ = 2δ (δ ≤ 1/24)</text>
      <text x="700" y="437">enum. 1 + 3-var lattice: τ = δ (δ ≤ 1/48)</text>
      <text x="700" y="450">pure lattice: τ = 0 (δ ≤ 1/80, asymptotic)</text>
    </g>
    <polygon points="906.7,453 908.8,457.9 914,458.3 910.1,461.6 911.3,466.7 906.7,464 902.1,466.7 903.3,461.6 899.4,458.3 904.6,457.9" fill="#e0a800" stroke="#7a5c00" stroke-width="0.6"/>
    <text x="648" y="100" font-size="10" fill="#333">No known oracle enters the triangle; every</text>
    <text x="648" y="114" font-size="10" fill="#333">route past δ = 1/24 is on or above τ = 3δ.</text>
    <text x="648" y="132" font-size="10" fill="#8e44ad">L4-D measures where lattice cost leaves τ = 0.</text>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g id="legend" font-size="10">
    <rect x="40" y="510" width="1000" height="170" fill="#fafafa" stroke="#ccc"/>
    <circle cx="60" cy="530" r="3.5" fill="#000"/><text x="72" y="534">measured (Probe B/C, m = 2, 40/56-bit): Howgrave-Graham (HG) holds to δ = 0.10; heuristic success fades at 0.14–0.16 (grey bar)</text>
    <line x1="52" y1="550" x2="68" y2="550" stroke="#1f5fbf" stroke-width="2"/><text x="72" y="554">derived: asymptotic Jochemsz–May reach; the symmetrised (elementary-symmetric) lattice has the same asymptotic value (README §3.2)</text>
    <circle cx="60" cy="570" r="3.5" fill="#fff" stroke="#1f5fbf" stroke-width="1.5"/><text x="72" y="574">derived: finite-level determinant bound, symmetric lattice; on a 40-bit curve these mean B ≤ 3 at m = 3 and B = 1 at m = 4</text>
    <rect x="52" y="584" width="16" height="10" fill="#2e9d4a" fill-opacity="0.3"/><text x="72" y="593">derived target region: 1/(2(m−1)) ≤ δ &lt; 1/4 (A); at m = 4, δ ∈ (1/6 + τ/3, 1/4) with τ &lt; 3δ − 1/2 (B); from program note §2.1 and §2.4</text>
    <g stroke="#c0392b" stroke-width="1.8"><line x1="56" y1="602" x2="64" y2="610"/><line x1="64" y1="602" x2="56" y2="610"/></g><text x="72" y="610">killed on paper (README §5): K1–K3 sit on the JM curve (no first-order change or constant only); K4 interval box products; K6 trace base, K7 line triples, K8 u = x³: higher degree</text>
    <text x="52" y="630" fill="#1f5fbf">L4-B (closure test, ranked 1): ideal-rigidity ceiling, checks P1–P3.   L4-A (control, ranked 2): finite-level S₄/S₅ baseline.</text>
    <text x="52" y="646" fill="#8e44ad">L4-D (measurement, ranked 3): success-probability decay past the rigorous bound.   <tspan fill="#d35400">L4-C (measurement, ranked 4): Poisson and clustering test in the gap.</tspan></text>
    <text x="52" y="666" fill="#555">Panel A: y = 60 + 133.33·(−log10 δ). Panel B: x = 640 + 1333.33·δ, y = 460 − 400·τ. Stars and green regions are requirements, not results.</text>
  </g>
</svg>
