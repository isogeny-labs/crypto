<svg xmlns="http://www.w3.org/2000/svg" width="500" height="120" viewBox="0 0 500 120">
<rect x="0" y="5" width="500" height="34" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="22" font-size="7.2" font-family="DejaVu Sans,sans-serif">Actual point orders</text>
<text x="104" y="18" font-size="6.9" font-family="DejaVu Sans,sans-serif">ord_P(Nf) = ord_P(f) + ord_-P(f)</text>
<text x="104" y="32" font-size="6.8" font-family="DejaVu Sans,sans-serif">Fixed point: twice order; distinct pair: sum of two orders</text>
<rect x="0" y="44" width="500" height="34" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="61" font-size="7.2" font-family="DejaVu Sans,sans-serif">Actual infinity places</text>
<text x="104" y="57" font-size="6.9" font-family="DejaVu Sans,sans-serif">Base infinity order of norm = elliptic infinity order of f</text>
<text x="104" y="71" font-size="6.8" font-family="DejaVu Sans,sans-serif">Embedded norm upstairs has twice that order; parameter: 1 vs 2</text>
<rect x="0" y="83" width="500" height="34" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="100" font-size="7.2" font-family="DejaVu Sans,sans-serif">Skeptical F5 control</text>
<text x="104" y="96" font-size="6.9" font-family="DejaVu Sans,sans-serif">Actual rational-only product 4 differs from 1</text>
<text x="104" y="110" font-size="6.8" font-family="DejaVu Sans,sans-serif">Its square and norm product are 1: square cancellation fails</text>
</svg>
