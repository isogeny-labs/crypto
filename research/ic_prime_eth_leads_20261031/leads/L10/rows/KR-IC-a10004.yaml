title: Target-family amortisation is dominated inside the BTN (Boolean tensor network) cost model
claim: >-
  Making the target R = R0 + [T]G a free variable costs one point addition (~b edges) per bit of T,
  whereas a base point costs ~b edges per b/m bits of window, so a free target bit is m times less
  edge-efficient than a base bit, and letting (u,v) float costs 2b additions. Since D.1 cost depends
  only on the edge count (KR-IC-a10002), amortising the transform over a target family gains nothing
  inside D.1. The only amortisation the model admits is solver-side clause retention across targets
  (lead L12), a constant. Descent trees are also dominated: the deepest level needs (m+1)b > mb edges.
  Edge counts (b per addition, 10^5 b by the paper's gadget counts) are estimates, not measurements.
