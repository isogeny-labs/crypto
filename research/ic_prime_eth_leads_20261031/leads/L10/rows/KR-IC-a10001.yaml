title: Black-box D.1 index calculus cannot cross rho below 2^256-bit groups, and the Bochum arity balance is optimal
claim: >-
  Model (assumed, not proved in Lean): relation phase costs 2^{b/m} attempts, each a black-box Boolean
  tensor contraction of an mb-edge network at 2^{c*m*b/g}, g = sqrt(log2 b), c the unknown constant in
  Theorem D.1's O(s/sqrt(log s)); linear algebra, m! and polylog factors dropped (all in the direction
  favourable to index calculus). Inside that model, derived by Lean theorems blackbox_balance (for every
  real m>0, E(m)^2 >= 4*c*b^2/g, so the Bochum m ~ (log b)^{1/4} is optimal up to the constant),
  no_crossover (E(m)/b < 1/2 with m >= 3 forces g > 16c), arity_two_blackbox (m = 2 is never below
  rho for any c >= 0) and crossover_bits (g integer > 16 and g*g <= log2 b gives log2 b > 256). For
  c >= 1 (an assumption: D.1 states O(.)), crossing rho needs log2 b > 256, i.e. a group of more than
  2^256 bits; for general c the threshold is log2 b > 256 c^2. Hence the Bochum route is not a
  usable ECDLP attack at any deployed size unless the contractor exponent on these networks improves
  from s/sqrt(log s), or relation networks need o(mb) edges.
