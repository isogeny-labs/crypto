title: Polynomial-method GF(2) solvers lose to guessing m-1 windows when m <= 2d
claim: >-
  Model: a Boolean degree-d system on n = m*l variables (m windows of l bits) is solved by a
  polynomial-method algorithm in 2^{(1-1/(2d)) n}; enumeration guesses m-1 windows and finishes the
  last by root finding, 2^{(m-1) l}. Lean polymethod_vs_enumeration (real m, d>0, l>=0, m <= 2d):
  (m-1) l <= (1-1/(2d)) m l, i.e. enumeration is no worse (non-strict). Any weaker saving 1/(c d) with
  c >= 2 (the 1/(5d), 1/(2.7d) bounds) is covered a fortiori because the condition becomes m <= c d,
  which contains m <= 2d (monotone; not stated in Lean). Whether Weil-descended or digit Semaev systems have
  d >= 2 at m = 3 (hence m <= 2d up to m = 4) is NOT in the Lean file. The exponents attributed to
  LPTWY, BKW and Dinur are quoted from LEADS.md; KN-LIT-3290 holds no constants.
