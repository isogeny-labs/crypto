<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 438" width="820" height="438" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Linear-algebra row operations of three solvers in m = 3 rootfind-subtract solves</title>
