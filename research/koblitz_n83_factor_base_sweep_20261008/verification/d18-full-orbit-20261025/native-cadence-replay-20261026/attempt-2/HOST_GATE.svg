<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">N83 native cadence attempt 2 host launch gate</title>
  <desc id="desc">Six sampled one-minute load values all exceed the frozen threshold of 24; cumulative swapouts rise after 13:31 PDT. The constructed worker was not launched.</desc>
  <rect width="960" height="470" fill="#fff"/>
