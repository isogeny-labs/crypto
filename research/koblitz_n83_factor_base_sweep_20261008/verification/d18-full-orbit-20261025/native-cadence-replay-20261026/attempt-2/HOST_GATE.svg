    <text x="94" y="375">13:29</text><text x="240" y="375">13:30</text><text x="386" y="375">13:31</text><text x="532" y="375">13:32</text><text x="678" y="375">13:33</text><text x="824" y="375">13:34</text>
    <text x="393" y="407">Local sampling time, PDT</text>
  </g>
  <text x="26" y="232" transform="rotate(-90 26 232)" fill="#45566a" font-family="Arial,sans-serif" font-size="14">One-minute load average</text>
