  <text x="64" y="61" fill="#45566a" font-family="Arial,sans-serif" font-size="14">Primary Koblitz a=0, GF(2^83) · attempt 2 · 26 Oct 2026 PDT · six samples</text>
  <line x1="110" y1="350" x2="864" y2="350" stroke="#60758b" stroke-width="2"/>
  <line x1="110" y1="70" x2="110" y2="350" stroke="#60758b" stroke-width="2"/>
