<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="520" viewBox="0 0 1250 520" role="img" aria-labelledby="title desc">
  <title id="title">Matched edge-lift support ratios over 72 cells</title>
  <desc id="desc">Range and upper median of distinct monomial and total term ratios for ac and bc lifts relative to the ab baseline.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#17202a}.muted{fill:#66717d}.grid{stroke:#d8dde2;stroke-width:1}.base{stroke:#1f2933;stroke-width:2;stroke-dasharray:7 6}.ac{stroke:#27734f;fill:#27734f}.bc{stroke:#36566f;fill:#36566f}.range{stroke-width:7;stroke-linecap:round}.title{font:700 27px system-ui,sans-serif}.label{font:18px system-ui,sans-serif}.small{font:15px system-ui,sans-serif}.tick{font:14px system-ui,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1100" height="520"/>
  <text class="title ink" x="45" y="48">Quadratic edge-lift support ratios (72 matched cells)</text>
  <text class="small muted" x="45" y="76">min — upper median — max; reference lift ab = 1.00</text>

  <g transform="translate(280,105)">
    <line class="grid" x1="0" y1="0" x2="0" y2="330"/><line class="grid" x1="150" y1="0" x2="150" y2="330"/>
    <line class="grid" x1="300" y1="0" x2="300" y2="330"/><line class="grid" x1="450" y1="0" x2="450" y2="330"/>
    <line class="grid" x1="600" y1="0" x2="600" y2="330"/><line class="grid" x1="750" y1="0" x2="750" y2="330"/>
    <line class="grid" x1="900" y1="0" x2="900" y2="330"/>
    <line class="base" x1="600" y1="0" x2="600" y2="330"/>
    <text class="tick muted" x="-8" y="355">0.6</text><text class="tick muted" x="142" y="355">0.7</text>
    <text class="tick muted" x="292" y="355">0.8</text><text class="tick muted" x="442" y="355">0.9</text>
    <text class="tick ink" x="588" y="355">1.0</text><text class="tick muted" x="738" y="355">1.1</text><text class="tick muted" x="888" y="355">1.2</text>

    <text class="label ink" x="-235" y="45">distinct · ac</text>
    <line class="ac range" x1="0" y1="40" x2="321" y2="40"/><circle class="ac" cx="115" cy="40" r="11"/>
    <text class="small muted" x="336" y="46">0.479 / 0.677 / 0.814</text>

    <text class="label ink" x="-235" y="115">distinct · bc</text>
    <line class="bc range" x1="0" y1="110" x2="507" y2="110"/><circle class="bc" cx="370" cy="110" r="11"/>
    <text class="small muted" x="522" y="116">0.479 / 0.847 / 0.938</text>

    <text class="label ink" x="-235" y="220">terms · ac</text>
    <line class="ac range" x1="151" y1="215" x2="846" y2="215"/><circle class="ac" cx="548" cy="215" r="11"/>
    <text class="small muted" x="580" y="197">0.701 / 0.965 / 1.164</text>

    <text class="label ink" x="-235" y="290">terms · bc</text>
    <line class="bc range" x1="426" y1="285" x2="846" y2="285"/><circle class="bc" cx="595" cy="285" r="11"/>
    <text class="small muted" x="610" y="310">0.884 / 0.997 / 1.164</text>
  </g>

  <text class="small muted" x="45" y="490">Population: n∈{11,13,17,19}, a∈{0,1}, m∈{3,4,5}, ℓ∈{3,4,5}; deterministic planted systems.</text>
</svg>
