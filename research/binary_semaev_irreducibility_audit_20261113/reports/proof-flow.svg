<svg xmlns="http://www.w3.org/2000/svg" width="500" height="132" viewBox="0 0 500 132">
<rect x="3" y="14" width="151" height="59" rx="4" fill="#edf3f8" stroke="#8eb0cb"/>
<text x="10" y="34" font-family="DejaVu Sans,sans-serif" font-size="8.2" fill="#234b70">Literal binary S3</text>
<text x="10" y="55" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#234b70">(xy+xz+yz)²+xyz+b</text>
<rect x="173" y="14" width="151" height="59" rx="4" fill="#edf3f8" stroke="#8eb0cb"/>
<text x="180" y="34" font-family="DejaVu Sans,sans-serif" font-size="8.2" fill="#234b70">Actual quadratic root</text>
<text x="180" y="55" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#234b70">u=(x+y)²z/(xy)</text>
<rect x="343" y="14" width="151" height="59" rx="4" fill="#edf3f8" stroke="#8eb0cb"/>
<text x="350" y="34" font-family="DejaVu Sans,sans-serif" font-size="8.2" fill="#234b70">Artin–Schreier root</text>
<text x="350" y="55" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#234b70">v²+v=Y+c+s/Y</text>
<path d="M157,46 L169,46" stroke="#234b70"/>
<path d="M327,46 L339,46" stroke="#234b70"/>
<text x="10" y="95" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#234b70">Proved primitive/MV bridges</text>
<text x="245" y="95" font-family="DejaVu Sans,sans-serif" font-size="8.2" fill="#234b70">deg∞ RHS=1; every v²+v excluded</text>
<text x="10" y="118" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#234b70">Algebraic-closure coefficient map removes the square-root premise.</text>
</svg>
