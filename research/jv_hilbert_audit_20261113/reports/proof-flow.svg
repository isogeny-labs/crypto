<text x="78" y="25" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8.5" fill="#234b70">Actual source ideal I</text>
<text x="78" y="40" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8.5" fill="#234b70">three literal quadratics</text>
<rect x="173" y="7" width="154" height="46" rx="5" fill="#edf5fa" stroke="#234b70"/>
<text x="250" y="25" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8.5" fill="#234b70">Cubic linear functional L</text>
<text x="250" y="40" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8.5" fill="#234b70">all source multiples vanish</text>
<rect x="345" y="7" width="154" height="46" rx="5" fill="#edf5fa" stroke="#234b70"/>
<text x="422" y="25" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8.5" fill="#234b70">L(h³)=1; h³ outside I</text>
<text x="422" y="40" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8.5" fill="#234b70">sharp monomial cutoff 4</text>
<rect x="1" y="82" width="154" height="46" rx="5" fill="#edf5fa" stroke="#234b70"/>
<text x="78" y="100" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8.5" fill="#234b70">Eight quotient classes</text>
<text x="78" y="115" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8.5" fill="#234b70">1, x, y, h, xh, yh, h², h³</text>
<rect x="173" y="82" width="154" height="46" rx="5" fill="#edf5fa" stroke="#234b70"/>
<text x="250" y="100" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8.5" fill="#234b70">64 dual / 24 product checks</text>
<text x="250" y="115" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8.5" fill="#234b70">independence and spanning</text>
<rect x="345" y="82" width="154" height="46" rx="5" fill="#edf5fa" stroke="#234b70"/>
<text x="422" y="100" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8.5" fill="#234b70">Actual quotient basis</text>
<text x="422" y="115" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8.5" fill="#234b70">dimension / F-length 8</text>
