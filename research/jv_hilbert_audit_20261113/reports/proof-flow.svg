<svg xmlns="http://www.w3.org/2000/svg" width="500" height="132" viewBox="0 0 500 132">
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#234b70"/></marker></defs>
