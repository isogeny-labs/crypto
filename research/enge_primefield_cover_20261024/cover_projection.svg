<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300">
<rect width="940" height="300" fill="#fff"/>
<style>text{font:17px sans-serif;fill:#17233b}.title{font-size:21px;font-weight:bold}.small{font-size:14px}.math{font-size:19px}</style>
<text x="26" y="35" class="title">What projection preserves and what it costs</text>
<rect x="29" y="69" width="350" height="75" rx="8" fill="#e8f1fb" stroke="#2b69a9"/>
<text x="45" y="99" class="math">C(d,s): y² = f(tᵈ+s)</text>
<text x="45" y="125" class="small">cover functions and rational zero divisors</text>
<path d="M381 105 H555" stroke="#344e73" stroke-width="2" marker-end="url(#arrow)"/>
<text x="423" y="90" class="small">π(t,y)=(tᵈ+s,y)</text>
<rect x="561" y="69" width="348" height="75" rx="8" fill="#eef5e9" stroke="#58873a"/>
<text x="579" y="99" class="math">E: y² = f(x)</text>
<text x="579" y="125" class="small">projected relation rows and signed rank</text>
<path d="M203 148 V198" stroke="#344e73" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M737 148 V198" stroke="#344e73" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="29" y="204" width="350" height="59" rx="8" fill="#e8f1fb" stroke="#2b69a9"/>
<text x="47" y="239" class="math">div C(h)</text>
<path d="M381 233 H555" stroke="#344e73" stroke-width="2" marker-end="url(#arrow)"/>
<text x="430" y="219" class="small">pushforward π</text>
<rect x="561" y="204" width="348" height="59" rx="8" fill="#eef5e9" stroke="#58873a"/>
<text x="579" y="239" class="math">div E(Norm h)</text>
<text x="26" y="288" class="small">Identity of rows is exact; relation yield, rank, memory and blind target descent need separate pricing.</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#344e73"/></marker></defs>
</svg>
