<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940">
  <style>
    .title { font: 700 31px sans-serif; fill: #13213c; }
    .subtitle { font: 18px sans-serif; fill: #42516d; }
    .box-title { font: 700 19px sans-serif; fill: #13213c; }
    .body { font: 15px sans-serif; fill: #263550; }
    .proved { fill: #dff4e5; stroke: #2d7d46; stroke-width: 3; }
    .conditional { fill: #fff1c9; stroke: #b77900; stroke-width: 3; }
    .missing { fill: #fde0df; stroke: #b83a3a; stroke-width: 3; }
    .counter { fill: #e6e5fb; stroke: #6553b7; stroke-width: 3; }
    .arrow { stroke: #52637e; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 9 7; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52637e"/>
    </marker>
  </defs>
  <rect width="1500" height="940" fill="#fbfcff"/>
  <text x="55" y="58" class="title">JKSST xedni conclusion: formal claim-chain audit</text>
  <text x="55" y="91" class="subtitle">Green = proved · amber = conditional/open premise · red = missing algorithm bridge · purple = counterexample to an overbroad reading</text>

  <rect x="55" y="145" rx="14" width="250" height="120" class="missing"/>
  <text x="75" y="178" class="box-title">Selected xedni lifts</text>
  <text x="75" y="207" class="body">Formal algorithm, good reduction,</text>
  <text x="75" y="230" class="body">and uniform selected-height bound</text>
  <text x="75" y="253" class="body">are not instantiated.</text>

  <rect x="365" y="145" rx="14" width="250" height="120" class="conditional"/>
  <text x="385" y="178" class="box-title">Height / discriminant</text>
  <text x="385" y="207" class="body">log |D| &gt;= C1 max h-hat(Pi)</text>
  <text x="385" y="230" class="body">is a displayed JKSST premise,</text>
  <text x="385" y="253" class="body">not a proved lift theorem.</text>

  <rect x="675" y="145" rx="14" width="250" height="120" class="conditional"/>
  <text x="695" y="178" class="box-title">Lang height gap</text>
  <text x="695" y="207" class="body">m &gt;= C3 log |D| remains open</text>
  <text x="695" y="230" class="body">in the required uniformity.</text>
  <text x="695" y="253" class="body">Quadraticity alone is insufficient.</text>

  <rect x="985" y="145" rx="14" width="250" height="120" class="proved"/>
  <text x="1005" y="178" class="box-title">Bounded group relation</text>
  <text x="1005" y="207" class="body">Packing + torsion + pigeonhole</text>
  <text x="1005" y="230" class="body">are proved when their height and</text>
  <text x="1005" y="253" class="body">Mordell--Weil premises are supplied.</text>

  <path d="M305 205 L365 205" class="arrow dash"/>
  <path d="M615 205 L675 205" class="arrow dash"/>
  <path d="M925 205 L985 205" class="arrow dash"/>

  <rect x="210" y="365" rx="14" width="270" height="132" class="missing"/>
  <text x="230" y="398" class="box-title">Reduction to sampled subgroup</text>
  <text x="230" y="427" class="body">Actual exact-order cyclic encoding is</text>
  <text x="230" y="450" class="body">proved; lift reduction, sampling, and</text>
  <text x="230" y="473" class="body">success correspondence are not.</text>

  <rect x="615" y="365" rx="14" width="270" height="132" class="proved"/>
  <text x="635" y="398" class="box-title">Ordinary relation event</text>
  <text x="635" y="427" class="body">For fixed nonzero coefficients:</text>
  <text x="635" y="450" class="body">exact probability = 1/q.</text>
  <text x="635" y="473" class="body">Deduplicated union upper bound proved.</text>

  <rect x="1020" y="365" rx="14" width="270" height="132" class="missing"/>
  <text x="1040" y="398" class="box-title">Useful relation selection</text>
  <text x="1040" y="427" class="body">Nonzero denominator is additional.</text>
  <text x="1040" y="450" class="body">At the zero sample every denominator</text>
  <text x="1040" y="473" class="body">vanishes: usefulness is not automatic.</text>

  <path d="M1110 265 C1110 310 345 310 345 365" class="arrow dash"/>
  <path d="M480 431 L615 431" class="arrow dash"/>
  <path d="M885 431 L1020 431" class="arrow dash"/>

  <rect x="210" y="600" rx="14" width="270" height="132" class="conditional"/>
  <text x="230" y="633" class="box-title">q-to-p conversion</text>
  <text x="230" y="662" class="body">Hasse + #E = Hq gives p &lt;= 4Hq.</text>
  <text x="230" y="685" class="body">Uniform /p needs uniformly bounded H</text>
  <text x="230" y="708" class="body">and actual curve-order instantiation.</text>

  <rect x="615" y="600" rx="14" width="270" height="132" class="missing"/>
  <text x="635" y="633" class="box-title">Repeated adaptive trials</text>
  <text x="635" y="662" class="body">One-shot probability does not itself</text>
  <text x="635" y="685" class="body">give a uniform conditional hazard after</text>
  <text x="635" y="708" class="body">every history.</text>

  <rect x="1020" y="600" rx="14" width="270" height="132" class="proved"/>
  <text x="1040" y="633" class="box-title">Conditional Omega(p)</text>
  <text x="1040" y="662" class="body">A finite-horizon K/p recurrence gives</text>
  <text x="1040" y="685" class="body">truncated runtime &gt;= p/(16K).</text>
  <text x="1040" y="708" class="body">The recurrence remains an input.</text>

  <path d="M1155 497 C1155 552 345 552 345 600" class="arrow dash"/>
  <path d="M480 666 L615 666" class="arrow dash"/>
  <path d="M885 666 L1020 666" class="arrow dash"/>

  <rect x="55" y="805" rx="12" width="1390" height="82" class="counter"/>
  <text x="75" y="837" class="box-title">Kernel-checked skeptical controls</text>
  <text x="75" y="866" class="body">Exact lattice-ball count is not fixed by rank/minimum/radius · model discriminants rescale by u^12 · composite coefficients break 1/q · fixed positive probability is not O(1/p).</text>
</svg>
