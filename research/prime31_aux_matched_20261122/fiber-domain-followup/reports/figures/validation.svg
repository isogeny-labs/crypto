<text x="917" y="171" font-size="27" fill="#087f82" font-weight="bold" text-anchor="end">C</text>
<rect x="0" y="206" width="952" height="60" rx="12" fill="#fff4df" stroke="none" stroke-width="2"/>
<text x="20" y="244" font-size="23" fill="#192c42" font-weight="bold" text-anchor="start">Fiber driver</text>
