<svg xmlns="http://www.w3.org/2000/svg" width="960" height="354" viewBox="0 0 960 354" role="img"><title>One validation pass, reused forward paths and separately charged index construction</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53647a"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><text x="0" y="25" font-size="20" fill="#53647a" font-weight="normal" text-anchor="start">SYMBOLIC ACCOUNTING FOR q QUERIES; THESE ARE NOT MEASURED DURATIONS</text>
<rect x="0" y="58" width="952" height="60" rx="12" fill="#eff4f8" stroke="none" stroke-width="2"/>
