<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" viewBox="0 0 960 190" role="img"><title>Rank of the base matrix follows from a projection of the retained augmented row space</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53647a"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="470" height="130" rx="12" fill="#eff4f8" stroke="none" stroke-width="2"/>
<rect x="523" y="0" width="429" height="130" rx="12" fill="#e8f5f2" stroke="none" stroke-width="2"/>
<text x="22" y="34" font-size="19" fill="#345d98" font-weight="bold" text-anchor="start">KEEP ONE AUGMENTED MATRIX</text>
<text x="235" y="82" font-size="34" fill="#192c42" font-weight="bold" text-anchor="middle">B = [ A | −β ]</text>
<text x="235" y="115" font-size="20" fill="#53647a" font-weight="normal" text-anchor="middle">Unknowns: base logs ℓ and target log s</text>
<path d="M476,68 L516,68" fill="none" stroke="#53647a" stroke-width="2.5" marker-end="url(#head)"/>
<text x="544" y="34" font-size="19" fill="#087f82" font-weight="bold" text-anchor="start">PROJECT AWAY THE LAST COLUMN</text>
<text x="737" y="80" font-size="27" fill="#192c42" font-weight="bold" text-anchor="middle">rank(A) = rank(B) − ε</text>
<text x="737" y="115" font-size="20" fill="#53647a" font-weight="normal" text-anchor="middle">ε = 1 if the target column is pinned</text>
<text x="476" y="173" font-size="22" fill="#192c42" font-weight="normal" text-anchor="middle">A row (0, …, 0, 1) determines s even before every base logarithm is known.</text></g></svg>
