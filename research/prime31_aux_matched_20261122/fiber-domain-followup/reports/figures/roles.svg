<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img"><title>An auxiliary isogeny creates coordinates; the target curve supplies signed points</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53647a"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="452" height="152" rx="12" fill="#eff4f8" stroke="none" stroke-width="2"/>
<rect x="508" y="0" width="452" height="152" rx="12" fill="#eff4f8" stroke="none" stroke-width="2"/>
<text x="22" y="32" font-size="19" fill="#087f82" font-weight="bold" text-anchor="start">AUXILIARY CURVE</text>
<text x="22" y="66" font-size="28" fill="#192c42" font-weight="bold" text-anchor="start">A− : y² = x³ − x</text>
<text x="22" y="103" font-size="21" fill="#192c42" font-weight="normal" text-anchor="start">H₂ chooses the kernel</text>
<text x="22" y="134" font-size="21" fill="#192c42" font-weight="normal" text-anchor="start">S + H₂ chooses one fiber</text>
<text x="530" y="32" font-size="19" fill="#345d98" font-weight="bold" text-anchor="start">QUOTIENT CURVE</text>
<text x="530" y="66" font-size="28" fill="#192c42" font-weight="bold" text-anchor="start">C = A− / H₂</text>
<text x="530" y="103" font-size="21" fill="#192c42" font-weight="normal" text-anchor="start">Every S + h has the same image</text>
<text x="530" y="134" font-size="21" fill="#192c42" font-weight="normal" text-anchor="start">φ(S + h) = φ(S)</text>
<path d="M456,77 L504,77" fill="none" stroke="#53647a" stroke-width="2.5" marker-end="url(#head)"/>
<text x="480" y="53" font-size="24" fill="#087f82" font-weight="bold" text-anchor="middle">φ</text>
<rect x="0" y="197" width="452" height="99" rx="12" fill="#e8f5f2" stroke="none" stroke-width="2"/>
<text x="22" y="233" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">V: 1,024 auxiliary x-values</text>
<text x="22" y="270" font-size="21" fill="#192c42" font-weight="normal" text-anchor="start">Forget auxiliary y; keep x as a label</text>
<rect x="508" y="197" width="452" height="99" rx="12" fill="#e9effb" stroke="none" stroke-width="2"/>
<text x="530" y="233" font-size="24" fill="#345d98" font-weight="bold" text-anchor="start">F: 515 usable target x-values</text>
<text x="530" y="270" font-size="21" fill="#192c42" font-weight="normal" text-anchor="start">Lift (x, ±y) on the target E</text>
<path d="M226,155 L226,192" fill="none" stroke="#53647a" stroke-width="2.5" marker-end="url(#head)"/>
<path d="M456,246 L504,246" fill="none" stroke="#53647a" stroke-width="2.5" marker-end="url(#head)" stroke-dasharray="7 6"/>
<text x="480" y="333" font-size="20" fill="#53647a" font-weight="normal" text-anchor="middle">The dashed step is a coordinate filter, not a group homomorphism A− → E.</text></g></svg>
