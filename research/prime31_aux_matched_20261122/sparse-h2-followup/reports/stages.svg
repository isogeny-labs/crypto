<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="365" viewBox="0 0 1200 365" role="img" aria-labelledby="title desc">
  <title id="title">Screening precedes a frozen selection for recovery</title>
  <desc id="desc">There are 77 screening inputs and a separate prospective pool of 385 recovery candidates. Screening receipts and the candidate pool inform a frozen selected subset. No recovery candidate is selected for execution yet. Inputs are not execution receipts.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#526a80"/></marker></defs>
  <style>text{font-family:"DejaVu Sans",Arial,sans-serif;fill:#192c42;font-size:22px}.head{font-size:22px;font-weight:700}.count{font-size:38px;font-weight:700}.small{font-size:19px;fill:#53647a}</style>
  <rect width="1200" height="365" fill="white"/>
  <rect x="20" y="18" width="340" height="151" rx="14" fill="#eaf0f9" stroke="#b7c9e2" stroke-width="2"/>
  <text x="190" y="52" text-anchor="middle" class="head">Screening inventory</text>
  <text x="190" y="99" text-anchor="middle" class="count">77 inputs</text>
  <text x="190" y="132" text-anchor="middle">1 stream; cap 64 queries</text>
  <text x="190" y="157" text-anchor="middle" class="small">Execution needs admission</text>
  <rect x="430" y="18" width="340" height="151" rx="14" fill="#f3f1f9" stroke="#c5bfdc" stroke-width="2"/>
  <text x="600" y="52" text-anchor="middle" class="head">Recovery candidate pool</text>
  <text x="600" y="99" text-anchor="middle" class="count">385 candidates</text>
  <text x="600" y="132" text-anchor="middle">5 paired streams</text>
  <text x="600" y="157" text-anchor="middle" class="small">Not an instruction to run all</text>
  <rect x="430" y="227" width="340" height="100" rx="14" fill="#fff4df" stroke="#d9bd81" stroke-width="2"/>
  <text x="600" y="263" text-anchor="middle" class="head">Freeze selected subset</text>
  <text x="600" y="296" text-anchor="middle" class="small">From retained pilot evidence</text>
  <rect x="840" y="227" width="340" height="100" rx="14" fill="#e7f3f2" stroke="#80bdb7" stroke-width="2"/>
  <text x="1010" y="263" text-anchor="middle" class="head">Recovery attempts</text>
  <text x="1010" y="296" text-anchor="middle" class="small">None selected at this stage</text>
  <path d="M190 171V277H425M600 171V222M772 277H835" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="278" y="262" text-anchor="middle" class="small">Pilot receipts</text>
  <text x="600" y="354" text-anchor="middle" class="small">A prepared input is not a completed run. Recovery cap: 65,536 queries, under the same physical limits.</text>
</svg>
