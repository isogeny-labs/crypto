<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="495" viewBox="0 0 1200 495" role="img" aria-labelledby="title desc">
  <title id="title">Algorithm timing, process timing, and study preparation</title>
  <desc id="desc">The outer process observation includes input parsing, the internal algorithm interval, and final output. The internal interval includes setup, collection and matrix work, scalar replay, and intermediate logging. Historical reference preparation is separately retained as study expenditure; unavailable cost is null, not zero. This is a schematic, not measured durations.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#526a80"/></marker></defs>
  <style>
    text { font-family: "DejaVu Sans",Arial,sans-serif; fill:#192c42; font-size:21px; }
    .title { font-weight:700; font-size:23px; }
    .small { font-size:18px; fill:#53647a; }
    .white { fill:white; }
  </style>
  <rect width="1200" height="495" fill="#fff"/>
  <rect x="15" y="18" width="1170" height="286" rx="14" fill="#f3f6fa" stroke="#aebfd1" stroke-width="2"/>
  <text x="45" y="58" class="title">OUTER PROCESS OBSERVATION</text>
  <text x="45" y="88" class="small">Startup, input, algorithm, output, shutdown - the launched process boundary</text>

  <rect x="36" y="140" width="176" height="114" rx="10" fill="#e3eaf2"/>
  <text x="124" y="172" text-anchor="middle">Read input</text>
  <text x="124" y="201" text-anchor="middle" class="small">Reference lookup</text>
  <text x="124" y="227" text-anchor="middle" class="small">and fixture hash</text>

  <rect x="253" y="112" width="694" height="172" rx="12" fill="#e7f3f2" stroke="#80bdb7" stroke-width="2"/>
  <text x="600" y="143" text-anchor="middle" class="title">INTERNAL ALGORITHM INTERVAL</text>
  <rect x="272" y="162" width="202" height="91" rx="8" fill="#087f82"/>
  <rect x="492" y="162" width="216" height="91" rx="8" fill="#087f82"/>
  <rect x="726" y="162" width="202" height="91" rx="8" fill="#087f82"/>
  <text x="373" y="196" text-anchor="middle" class="white">Own setup</text>
  <text x="373" y="225" text-anchor="middle" class="small white">Base + optional table</text>
  <text x="600" y="196" text-anchor="middle" class="white">Queries + matrix</text>
  <text x="600" y="225" text-anchor="middle" class="small white">Replay of signed rows</text>
  <text x="827" y="196" text-anchor="middle" class="white">Scalar replay</text>
  <text x="827" y="225" text-anchor="middle" class="small white">Check the public target</text>
  <text x="600" y="274" text-anchor="middle" class="small">Includes target validation, mapping, and intermediate event output</text>

  <rect x="988" y="140" width="176" height="114" rx="10" fill="#e3eaf2"/>
  <text x="1076" y="176" text-anchor="middle">Final summary</text>
  <text x="1076" y="206" text-anchor="middle" class="small">Serialization</text>
  <text x="1076" y="232" text-anchor="middle" class="small">and shutdown</text>
  <path d="M214 197H250M949 197H985" fill="none" stroke="#526a80" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="15" y="337" width="1170" height="111" rx="14" fill="#fff4df" stroke="#d9bd81" stroke-width="2"/>
  <text x="600" y="371" text-anchor="middle" class="title">STUDY PREPARATION IS RETAINED SEPARATELY</text>
  <text x="600" y="404" text-anchor="middle">Reference construction, matching audit, compilation, admission, and failed attempts</text>
  <text x="600" y="432" text-anchor="middle" class="small">Historical reference time and priced cost: null means unavailable, not zero.</text>
  <text x="600" y="480" text-anchor="middle" class="small">Schematic intervals; widths are not durations. Source: ACCOUNTING.md and the v2 driver.</text>
</svg>
