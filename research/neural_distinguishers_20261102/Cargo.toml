[package]
name = "neural-distinguishers"
version = "0.1.0"
edition = "2021"
description = "crypto-ml-v1 reduced-round neural distinguishers (Speck32/64, AES) with classical baselines and controls"
publish = false

# Standalone research crate: not a member of the main crate, its own lockfile, no dependency on the crypto crate.
[workspace]

[dependencies]
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.10"
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
debug = "line-tables-only"
