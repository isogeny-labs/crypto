notes: 'Attempt 2 of the split-graph secant panel: Job sgsecant-panel-20261108-a2 (4 vCPU, 8Gi, 10800 s), image 104186811093.dkr.ecr.us-east-2.amazonaws.com/isolab/tasks@sha256:d1ab2c5c44bc83931d5d402e4ac58f58f5ea92af19d951b1441cc32068c2f07b, request research/split_graph_secant_cost_20261107/eks/r2img_request_attempt2.json. Attempt 1 (Job sgsecant-panel-20261107, card CARD-split-graph-secant-cost-20261107-R2-1) stayed Pending for its whole 3600 s deadline and produced no output; see research/split_graph_secant_cost_20261107/eks/ATTEMPT2.md. Attempt 1 files under receipts/R2 and results/R2 are not read or written by any step; this card family uses receipts/A2 and results/A2. The request differs from the attempt-1 request only in job.job_name, job.seconds and provenance.note, and the first precondition step checks that with jq. Collect card 03: it has no launch step, so it cannot submit anything. It needs research/split_graph_secant_cost_20261107/receipts/A2/launch/result.json from CARD-split-graph-secant-cost-20261107-A2-1. The `status-once` step makes one isolab.eks.command-status/v1 query and exits 41 when the Job is pending or active. When the Job is succeeded or failed the card downloads s3://isolab-results-104186811093-us-east-2/runs/sgsecant-panel-20261108-a2/ (without launcher/) into research/split_graph_secant_cost_20261107/results/A2, an idempotent sync, verifies it, and runs the independent recheck on the panel directory. `verify` fails unless the Job succeeded with one pod and pod exit 0, its Job UID and name equal the launch receipt, the downloaded tree is one directory named by the Pod UID, the binary hash line is present and `sha256sum -c --ignore-missing SHA256SUMS` passes. A task card writes a receipt once, so each firing is a different numbered card. The card has no add-raw or upload-raw step: those rewrite the benchmark record, whose sha256 changes when A2-1 launches, so a final card binds the record hash it has then. A recheck mismatch exits 1 and is a result to report. The head-paths-unchanged step passes when no commit after the pinned commit changed the study directory (its cards subdirectory excepted), taskq/, tools/task_card.py or tools/benchrec.py; other commits are accepted. No commit field is set because task_card.py run refuses any HEAD other than the pinned one. Pinned commit d032c1e1ee5b7b730b2ea130573b3e160107946e. The record stays open, and the card runs no close, report or analysis command.'
