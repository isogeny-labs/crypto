notes: 'Frozen EKS command Job sgsecant-panel-20261107, image 104186811093.dkr.ecr.us-east-2.amazonaws.com/isolab/tasks@sha256:d1ab2c5c44bc83931d5d402e4ac58f58f5ea92af19d951b1441cc32068c2f07b, request research/split_graph_secant_cost_20261107/eks/r2img_request.json. The `launch` step is the only step that submits a Job, and it appears once. Every later step only reads the Job through isolab.eks.command-status/v1 receipts and S3, so each can run again on its own. This resume card contains no launch step. It continues CARD-split-graph-secant-cost-20261107-R2-1 after an interruption that came after `launch` wrote research/split_graph_secant_cost_20261107/receipts/R2/launch/result.json: it waits for the Job, downloads and verifies the results. The record steps (`add-raw`, `upload-raw`) are not in this card: benchrec rewrites the record file, so a later card binds the record hash it has then. Pinned commit 7897a300a75d7e6458a04ab5852340efa1335152. The `wait` step ends on state succeeded or failed; `verify` fails unless the Job succeeded with pod exit 0, its Job UID equals the launch receipt, the downloaded tree is one directory named by the Pod UID, the binary hash line is present and `sha256sum -c --ignore-missing SHA256SUMS` passes. `add-raw` and `upload-raw` run before any recheck so that raw files are recorded before the recheck prints a result. The record is left open: the card runs no close, report or analysis command. The final `recheck` step runs sgsecant_recheck.py on the panel directory under the download and exits 1 on a mismatch; a mismatch is a result to report.'
