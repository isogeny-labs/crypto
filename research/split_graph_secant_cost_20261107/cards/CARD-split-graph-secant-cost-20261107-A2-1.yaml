notes: 'Attempt 2 of the split-graph secant panel: Job sgsecant-panel-20261108-a2 (4 vCPU, 8Gi, 10800 s), image 104186811093.dkr.ecr.us-east-2.amazonaws.com/isolab/tasks@sha256:d1ab2c5c44bc83931d5d402e4ac58f58f5ea92af19d951b1441cc32068c2f07b, request research/split_graph_secant_cost_20261107/eks/r2img_request_attempt2.json. Attempt 1 (Job sgsecant-panel-20261107, card CARD-split-graph-secant-cost-20261107-R2-1) stayed Pending for its whole 3600 s deadline and produced no output; see research/split_graph_secant_cost_20261107/eks/ATTEMPT2.md. Attempt 1 files under receipts/R2 and results/R2 are not read or written by any step; this card family uses receipts/A2 and results/A2. The request differs from the attempt-1 request only in job.job_name, job.seconds and provenance.note, and the first precondition step checks that with jq. The `launch` step is the only step that submits a Job and it appears once in this card family. The `wait-short` step polls isolab.eks.command-status/v1 for at most 5400 s and its exit 41 (no terminal state yet) counts as success, so the card ends with a receipt. There is no pool check; the 10800 s deadline absorbs queueing. After this card, the collect cards CARD-split-graph-secant-cost-20261107-A2-C01 to CARD-split-graph-secant-cost-20261107-A2-C04 are fired one at a time, each only after the previous one has stopped. The head-paths-unchanged step passes when no commit after the pinned commit changed the study directory (its cards subdirectory excepted), taskq/, tools/task_card.py or tools/benchrec.py; other commits are accepted. No commit field is set because task_card.py run refuses any HEAD other than the pinned one. Pinned commit d032c1e1ee5b7b730b2ea130573b3e160107946e. The record stays open, and the card runs no close, report or analysis command.'
