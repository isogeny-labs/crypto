<g>
<rect x="100" y="132" width="40" height="138" fill="#c0392b"/><rect x="150" y="79" width="40" height="191" fill="#e08a1e"/><rect x="200" y="165" width="40" height="105" fill="#2e6fb7"/>
<rect x="360" y="105" width="40" height="165" fill="#c0392b"/><rect x="410" y="57" width="40" height="213" fill="#e08a1e"/><rect x="460" y="145" width="40" height="125" fill="#2e6fb7"/>
</g>
<g text-anchor="middle" font-size="11"><text x="120" y="126">76.5</text><text x="170" y="73">106.3</text><text x="220" y="159">58.1</text><text x="380" y="99">91.5</text><text x="430" y="51">118.3</text><text x="480" y="139">69.4</text></g>
