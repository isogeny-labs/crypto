<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="sans-serif" font-size="12">
<rect width="640" height="330" fill="#fff"/>
<text x="20" y="22" font-size="14" font-weight="bold">Genus-16 GHS (m = 5): log2 cost by model vs Pollard rho</text>
