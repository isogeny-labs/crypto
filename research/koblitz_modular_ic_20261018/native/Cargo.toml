[package]
name = "koblitz-modular-carriers"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
rand = { version = "0.8", features = ["small_rng"] }
