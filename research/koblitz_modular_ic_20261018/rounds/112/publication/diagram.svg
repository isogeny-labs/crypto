<svg xmlns="http://www.w3.org/2000/svg" width="830" height="320" viewBox="0 0 830 320">
<rect width="830" height="320" fill="white"/>
<text x="28" y="34" font-size="20" font-family="sans-serif">R112: first blowup of the x=0, y=1 repeated edge</text>
<text x="28" y="67" font-size="14" font-family="sans-serif">y=1+x(1+w); quotient by x^3 has 24 terms and special fiber w^3</text>
<polyline points="80,245 200,110 450,65 750,155" fill="none" stroke="#28649c" stroke-width="4"/>
<circle cx="80" cy="245" r="5"/><circle cx="200" cy="110" r="5"/><circle cx="450" cy="65" r="5"/><circle cx="750" cy="155" r="5"/>
<text x="82" y="270" font-size="14" font-family="sans-serif">(0,7)</text><text x="200" y="98" font-size="14" font-family="sans-serif">(1,2)</text><text x="448" y="53" font-size="14" font-family="sans-serif">(3,0)</text><text x="747" y="180" font-size="14" font-family="sans-serif">(7,4)</text>
<text x="93" y="198" font-size="14" font-family="sans-serif">slope 5: 1+w</text>
<text x="275" y="120" font-size="14" font-family="sans-serif">slope 1: (1+w)^2</text>
<text x="28" y="302" font-size="13" font-family="sans-serif">The repeated slope-1 root requires another blowup.</text>
</svg>
