<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 740 340"><rect width="740" height="340" fill="white"/><text x="20" y="33" font-family="sans-serif" font-size="21" fill="#17384c">Quadratic infinity orders; negative means pole</text><line x1="344" y1="62" x2="344" y2="274" stroke="#657582" stroke-width="2"/><text x="20" y="115" font-family="sans-serif" font-size="20" fill="#17384c">U=0</text><rect x="92" y="95" width="252" height="21" fill="#205984"/><text x="470" y="112" font-family="sans-serif" font-size="17" fill="#17384c">b: -7</text><rect x="200" y="125" width="144" height="21" fill="#b87337"/><text x="470" y="142" font-family="sans-serif" font-size="17" fill="#17384c">c: -4</text><text x="20" y="207" font-family="sans-serif" font-size="20" fill="#17384c">U=1</text><rect x="344" y="187" width="36" height="21" fill="#205984"/><text x="470" y="204" font-family="sans-serif" font-size="17" fill="#17384c">b: +1</text><rect x="308" y="217" width="36" height="21" fill="#b87337"/><text x="470" y="234" font-family="sans-serif" font-size="17" fill="#17384c">c: -1</text><text x="20" y="316" font-family="sans-serif" font-size="15" fill="#435569">Each quadratic place contributes weighted degree 16 in the full source.</text></svg>
