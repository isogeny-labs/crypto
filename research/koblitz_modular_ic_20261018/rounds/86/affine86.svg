<svg xmlns="http://www.w3.org/2000/svg" width="900" height="255" viewBox="0 0 900 255">
<rect width="900" height="255" fill="white"/>
<text x="20" y="30" font-family="sans-serif" font-size="22" fill="#17384c">R86: source coordinates to affine diamond lambda</text>
<rect x="18" y="65" width="245" height="128" fill="#205984"/>
<text x="30" y="94" font-family="sans-serif" font-size="18" fill="white">R49 source chart</text>
<text x="30" y="124" font-family="sans-serif" font-size="16" fill="white">b = u c² + c</text>
<text x="30" y="153" font-family="sans-serif" font-size="16" fill="white">c = z(1+z)g</text>
<text x="275" y="137" font-family="sans-serif" font-size="30" fill="#435569">→</text>
<rect x="325" y="65" width="245" height="128" fill="#557b46"/>
<text x="337" y="94" font-family="sans-serif" font-size="18" fill="white">R50 diamond k</text>
<text x="337" y="124" font-family="sans-serif" font-size="16" fill="white">k = (u+1)c²</text>
<text x="337" y="153" font-family="sans-serif" font-size="16" fill="white">z k = (1+z)c²</text>
<text x="582" y="137" font-family="sans-serif" font-size="30" fill="#435569">→</text>
<rect x="632" y="65" width="250" height="128" fill="#b87337"/>
<text x="644" y="94" font-family="sans-serif" font-size="18" fill="white">Affine lambda update</text>
<text x="644" y="124" font-family="sans-serif" font-size="16" fill="white">[λ+(1+z)²g]/(z²g)</text>
<text x="644" y="153" font-family="sans-serif" font-size="16" fill="white">cross-product = 0 mod E</text>
<text x="20" y="230" font-family="sans-serif" font-size="16" fill="#435569">Native: 4 zero remainders, 2 rejected corruptions. Lean: 2 algebraic lemmas. Next: degree-16 equation and 32 RR lifts.</text>
</svg>
