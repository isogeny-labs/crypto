<svg xmlns="http://www.w3.org/2000/svg" width="850" height="350" viewBox="0 0 850 350">
<rect width="850" height="350" fill="white"/>
<text x="28" y="34" font-size="20" font-family="sans-serif">R117: exact e=1 G51 Newton edges and two precision gaps</text>
<text x="45" y="77" font-size="15" font-family="sans-serif">y0/e1: lambda order -10</text>
<line x1="90" y1="255" x2="390" y2="105" stroke="#28649c" stroke-width="4"/>
<circle cx="90" cy="255" r="6"/><circle cx="240" cy="180" r="6"/><circle cx="390" cy="105" r="6"/>
<text x="55" y="278" font-size="13" font-family="sans-serif">(0,-160)</text><text x="213" y="202" font-size="13" font-family="sans-serif">(8,-80)</text><text x="375" y="95" font-size="13" font-family="sans-serif">(16,0)</text>
<text x="470" y="77" font-size="15" font-family="sans-serif">y1/e1: lambda order 0</text>
<line x1="490" y1="175" x2="790" y2="175" stroke="#b56528" stroke-width="4"/>
<circle cx="490" cy="175" r="6"/><circle cx="640" cy="175" r="6"/><circle cx="790" cy="175" r="6"/>
<text x="470" y="198" font-size="13" font-family="sans-serif">(0,0)</text><text x="622" y="198" font-size="13" font-family="sans-serif">(8,0)</text><text x="762" y="198" font-size="13" font-family="sans-serif">(16,0)</text>
<text x="28" y="312" font-size="14" font-family="sans-serif">y0/e3: lambda^0,^1 unknown. y1/e2: lambda^0 unknown.</text>
<text x="28" y="336" font-size="13" font-family="sans-serif">Both exact edges have repeated initial polynomial (1+T+T^2)^8.</text>
</svg>
