<svg xmlns="http://www.w3.org/2000/svg" width="900" height="255" viewBox="0 0 900 255">
<rect width="900" height="255" fill="white"/>
<text x="20" y="30" font-family="sans-serif" font-size="22" fill="#17384c">R88: explicit two-way diamond coordinates</text>
<rect x="18" y="62" width="260" height="133" fill="#205984"/>
<text x="30" y="90" font-family="sans-serif" font-size="18" fill="white">Original source</text>
<text x="30" y="120" font-family="sans-serif" font-size="16" fill="white">z, V, T=lambda</text>
<text x="30" y="150" font-family="sans-serif" font-size="16" fill="white">E(V,z), P(T,V,z)</text>
<text x="290" y="135" font-family="sans-serif" font-size="32" fill="#435569">↔</text>
<rect x="350" y="62" width="530" height="133" fill="#557b46"/>
<text x="362" y="90" font-family="sans-serif" font-size="18" fill="white">Transformed source: p, q, t</text>
<text x="362" y="120" font-family="sans-serif" font-size="16" fill="white">k=p+q+p², G=pk²+p+k²</text>
<text x="362" y="150" font-family="sans-serif" font-size="16" fill="white">inverse: z=1/k, V=1/k+1/p, T=G[t+(k+1)²]/(pk⁴)</text>
<text x="20" y="230" font-family="sans-serif" font-size="16" fill="#435569">Native: both compositions and 4 ideal lifts. Lean: target base and affine return. Next: 32 RR generator lifts.</text>
</svg>
