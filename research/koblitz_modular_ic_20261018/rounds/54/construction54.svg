<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="220" viewBox="0 0 1120 220"><rect width="1120" height="220" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#15364a"><rect x="10" y="15" width="260" height="185" rx="8" fill="#d7eee3"/><text x="20" y="49" font-size="20">Actual normal RR algebra</text><text x="20" y="91" font-size="17">32 source generators</text><text x="20" y="127" font-size="17">528 multiplication columns</text><text x="20" y="163" font-size="17">Original nu/source bindings</text><rect x="290" y="15" width="260" height="185" rx="8" fill="#d7eee3"/><text x="300" y="49" font-size="20">Split fiber component</text><text x="300" y="91" font-size="17">rank E = rank K = 16</text><text x="300" y="127" font-size="17">K F = E; F K = I</text><text x="300" y="163" font-size="17">Full multiplication products</text><rect x="570" y="15" width="260" height="185" rx="8" fill="#d7eee3"/><text x="580" y="49" font-size="20">Primitive coordinate</text><text x="580" y="91" font-size="17">w = nu / b</text><text x="580" y="127" font-size="17">Degree 16 over F32</text><text x="580" y="163" font-size="17">Four quartic prime factors</text><rect x="850" y="15" width="260" height="185" rx="8" fill="#d7eee3"/><text x="860" y="49" font-size="20">Binary point evaluators</text><text x="860" y="91" font-size="17">Four degree-20 moduli</text><text x="860" y="127" font-size="17">a = rho_i(w), all 32 values</text><text x="860" y="163" font-size="17">128 full conversions</text></g></svg>
