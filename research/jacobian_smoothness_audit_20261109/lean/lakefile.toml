name = "jacobian_smoothness_audit"
version = "0.1.0"
defaultTargets = ["MumfordSmoothness", "MumfordCantorGroup", "MumfordFiveControl", "MumfordStoll", "MumfordStollCycleGroup"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "MumfordSmoothness"
roots = ["MumfordSmoothness"]

[[lean_lib]]
name = "MumfordCantorGroup"
roots = ["MumfordCantor", "MumfordCantorGroup"]

[[lean_lib]]
name = "MumfordFiveControl"
roots = ["MumfordFiveControl"]

[[lean_lib]]
name = "MumfordStoll"
roots = ["MumfordStoll"]

[[lean_lib]]
name = "MumfordStollCycleGroup"
roots = ["MumfordStollCantor", "MumfordStollCycleGroup"]
