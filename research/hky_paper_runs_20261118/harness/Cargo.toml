# Standalone build of the HKY closure engine, the PKM tower pilot with the paper-instance loader,
# the basis checker and the depth-16 instance generator (research/hky_paper_runs_20261118).
#
# The root crate does not compile as a whole, so this crate compiles only the modules the pilot
# needs, by path, from the repository's own sources (the approach of
# research/rand_vs_struct_fb_20261118/harness). Nothing here is a copy except the stubs under src/.
[package]
name = "hky-paper-harness"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "crypto_lib"
path = "src/lib.rs"

[dependencies]
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
num-integer = "0.1"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
rayon = "1.10"
libc = "0.2"
sha2 = "0.10"
certified-relations = { path = "../../../crates/certified-relations" }
relation-replay-checker = { path = "../../../crates/relation-replay-checker" }

[profile.release]
debug = false
incremental = false

[[example]]
name = "pkm_tower_pilot"
path = "../../../examples/pkm_tower_pilot.rs"

[[example]]
name = "hky_basis_check"
path = "../tools/hky_basis_check.rs"

[[example]]
name = "hky_paper_instance"
path = "../tools/hky_paper_instance.rs"
