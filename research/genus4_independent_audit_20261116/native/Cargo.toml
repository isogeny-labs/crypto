[package]
name = "genus4-independent-audit"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
rand = "=0.8.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"

[lib]
name = "g4audit"
path = "lib.rs"

[[bin]]
name = "g4audit"
path = "main.rs"
