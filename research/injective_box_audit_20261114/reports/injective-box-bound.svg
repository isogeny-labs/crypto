<svg xmlns="http://www.w3.org/2000/svg" width="500" height="142" viewBox="0 0 500 142">
<rect x="0" y="6" width="500" height="40" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="25" font-size="8.8" font-family="DejaVu Sans,sans-serif">Actual sampler</text>
<text x="130" y="21" font-size="7.8" font-family="DejaVu Sans,sans-serif">Uniform injective d-tuples; d ≤ p−1</text>
<text x="130" y="37" font-size="8.1" font-family="DejaVu Sans,sans-serif">Full conditional supports: cardinality (p−1).descFactorial d</text>
<rect x="0" y="52" width="500" height="40" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="71" font-size="8.8" font-family="DejaVu Sans,sans-serif">Exact finite bound</text>
<text x="130" y="67" font-size="7.8" font-family="DejaVu Sans,sans-serif">Nonzero j: coordinate count ≤ p·(U−L)+1</text>
<text x="130" y="83" font-size="8.1" font-family="DejaVu Sans,sans-serif">Probability ≤ product of counts / falling factorial</text>
<rect x="0" y="98" width="500" height="40" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="117" font-size="8.8" font-family="DejaVu Sans,sans-serif">Negative control</text>
<text x="130" y="113" font-size="7.8" font-family="DejaVu Sans,sans-serif">Index j=0, d=1, L=U=0: probability 1</text>
<text x="130" y="129" font-size="8.1" font-family="DejaVu Sans,sans-serif">For p≥3, this exceeds deleted-index bound 1/(p−1)</text>
</svg>
