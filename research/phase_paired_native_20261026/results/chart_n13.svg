<title id="t">Cost per newly independent verified relation, arm A against arm B</title>
<desc id="d">Grouped bars per repetition and their mean, conflicts and CPU seconds, native sat::Solver, n = 13 stage diagnostic. The same numbers are in tables.md.</desc>
