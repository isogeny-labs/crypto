<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="sans-serif" font-size="12">
<title id="t">Arm A refutation CPU per target: legacy, native, CryptoMiniSat</title>
