  control_checks:
    - "Validator verify --replay-all with ecbench bf5eec6d on byte-identical copies of both sessions (taskset -c 2, RAYON_NUM_THREADS=1): P20 1440/1440 and P28 1440/1440 measured replays identical, 1680/1680 verified, 0 problems, all checks true, rc 0. This replay used a different binary from the measurement (bf5eec6d vs 583e62f0) on a different host class (ECBENV3h13e37662a118 vs ECBENV2h3a51beea0bc2). Session copies unchanged by the replay (sha256 before = after)"
    - "[d]G = Q with the validator's own affine arithmetic for all 1440 measured records of every arm at each size: 2880/2880. Curve a, b derived from plan.json points. p and r prime; every point on the curve; [r]G = O; r is the only multiple of r in the Hasse interval, so #E = r (prime order); j-invariants 304448, 761303, 122401184, 131563971 equal the ICV1 strings and are not 0 or 1728, so Aut(E) = {+-1}. Negation is the strongest fold over a prime field; rho records show automorphisms_used 2"
    - "A/A null arms: walk-aa/walk and rho-neg-aa/rho-neg exactly 1.0 [1, 1] at every weight and size. 288/288 pairs identical in total GAE, U, every phase's adds, doubles, scalar_mults, gae and native counts, and recovered scalar"
    - "Completeness: walk, srenew, walk-aa, rho-neg, rho-neg-aa each 288 measured + 48 warm-up per size; 288/288 verified, matches_target true; 0 censored; 0 unpaired; 288 pairs share keys (workload, round) and algorithm seeds across all five arms"
    - "Only `targets` differs: in every one of the 288 paired records per size, the method params of srenew and walk differ in exactly one key (targets: walk vs stride-renew). linalg incremental-gauss, solver empty and budget 0 on both. walk-aa params equal walk's. The frozen specs differ in the same single key"
    - "Band --ranks: srenew < walk on every curve at both sizes (re-run, byte-identical to band.md); recomputed means give rho-neg < srenew < walk at every weight on all four curves"
    - "Section 6 reading recomputed: P20 conditions 1-4 hold (improvement); P28 conditions 1-4 hold (improvement)"
  heuristic_validation_checks:
    - "Not applicable: no heuristic distribution is claimed. The section 7 predictions were frozen before confirmatory data (commit 4d4593aa precedes both jobs). Checked:"
    - "Prediction 1 (P20 below 1 at every weight; about 0.85-0.90 from scalar multiplications alone): holds; 0.842 at w=0, slightly beyond the predicted range on the favourable side"
    - "Prediction 2 (the gain shrinks with size): P20 15.8% -> P28 2.3% (P24 null and P32 run 1 are producer numbers, not validated here). The direction holds, but the P28 gain is mostly not the scalar-multiplication share the prediction names (see cost_model_checks)"
    - "Prediction 3 (ratio at w=1 close to the ratio at w=0): fails at P20 (0.842 vs 0.926). Unpriced counts per pair barely change, so pricing them dilutes the gain. Roughly holds at P28 (0.977 vs 0.968)"
    - "Null-object rule (inventor-protocol section 3): the A/A arms are null objects of the same shape and measure exactly 1. The protocol states the gain should decay with size, and the measured ratios move toward 1 from P20 to P28"
    - "Inventor-protocol section 6 ladder: no extrapolation is claimed. The improvement is a measured ratio against the baseline at each claimed size, with matched controls"
  cost_model_checks:
    - "Unit declared: ecbench GAE / sqrt(r), cold whole pipeline, one target. The section 5a band w = 0, 0.1, 1 is applied to every arm including rho. IC arms carry lower_bound true (unpriced natives: sqrt_solves, lookups, row_ops, legendre_symbols, target_guard_probes); rho leaves canonicalisations unpriced. C = 0 on every record"
    - "Stride-renew set-up and per-relation cost are charged. Code that ran (ic_boundary.rs at cb2ec6873f30): stride and renew_by are drawn by draw_jumps (two counted scalar multiplications + one add each) into rel.group_ops. Each restart R0 = [a]G + [b]Q costs two counted muls + one add; each step R <- R + S and each renewal S <- S + T is a counted add. CountedGroup::mul is the default double-and-add (no override in the crate) and charges every doubling and addition; GroupOps::gae = adds + doubles. origin/main differs only by instrumentation (rng_draws, walk_modr_adds) and a scale_coeff hook, and the cross-binary replay is identical"
    - "Records confirm it, 288/288 srenew records per size: relations scalar_mults = 4 + 2*stride_restarts; relations adds >= stride_steps + stride_renewals + stride_restarts + 2; 1 <= stride_renewals <= relations; every phase gae = adds + doubles; total_gae = sum of phase gae (walk too). Doublings per scalar multiplication are equal across arms (P20 17.61 vs 17.62; P28 25.23 vs 25.23). factor_base natives and oracle_setup GAE are identical per pair"
    - "Where the saving comes from (validation/mechanism.py, per-pair means): P20 dG = 1440.5 GAE (15.8%), of which 950.3 doublings and 490.2 adds; scalar muls 59.94 -> 6.00; trials ratio 0.995 [0.937, 1.057], relations 0.975 [0.927, 1.023]. The P20 gain is the deterministic scalar-multiplication saving"
    - "P28: dG = 6226 GAE (2.34%), of which 1482 doublings and 4744 adds; scalar muls 64.75 -> 6.00. Trials ratio 0.957 [0.915, 0.999] and relations 0.956 [0.916, 0.996] (203.3 vs 212.7). No dependent rows in either arm (matrix_dependent 0, rank = rows). About 2,200 GAE (about 0.8% of S) is the scalar-multiplication saving (1,482 measured doublings plus an estimated 730 additions). About 4,000 GAE comes from needing fewer relations and trials, an effect protocol section 7 did not predict and for which no mechanism is stated"
    - "Not a relabelling: the total falls at every weight on both sizes, the unpriced natives are priced in the band, and the gain is in charged group operations"
    - "Memory: mean max RSS walk 33969 vs srenew 33959 KiB (P20) and 38489 vs 38448 KiB (P28); no time-memory trade-off"
    - "Success probability: every measured run solved and verified, so the cost per solved target needs no inverse-success factor"
  proof_architecture_checks: []
  verdict: passed
  verdict_by_size:
    P20: "pass: section 6 conditions 1-4 hold. The gain is the predicted, deterministic scalar-multiplication saving"
    P28: >-
      pass with caveats: section 6 conditions 1-4 hold, but about 2/3 of the 2.3% gain comes from srenew
      needing 4.4% fewer relations. That effect is about two standard errors from zero, was not predicted,
      and has no mechanism. The w=1 upper bound is 0.9955, within 0.5% of 1. The scalar-multiplication
      component alone (about 0.8%) would probably not resolve at this sample size.
