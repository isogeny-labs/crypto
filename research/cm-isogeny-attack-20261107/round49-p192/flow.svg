<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="255"><rect width="1000" height="255" fill="white"/><rect x="10" y="4" width="980" height="74" rx="5" fill="#e7f0ec" stroke="#49617a"/><text x="25" y="32" font-family="sans-serif" font-size="21">Division-free numerator and denominator circuits</text><text x="25" y="60" font-family="sans-serif" font-size="18">Require scalar-field descent and 2d below r</text><rect x="10" y="88" width="980" height="74" rx="5" fill="#e7f0ec" stroke="#49617a"/><text x="25" y="116" font-family="sans-serif" font-size="21">Propagate value and two derivatives</text><text x="25" y="144" font-family="sans-serif" font-size="18">Form W_A and W_B without coefficient expansion</text><rect x="10" y="172" width="980" height="74" rx="5" fill="#e7f0ec" stroke="#49617a"/><text x="25" y="200" font-family="sans-serif" font-size="21">Extract and verify</text><text x="25" y="228" font-family="sans-serif" font-size="18">x=W_B/W_A; retry only when W_A vanishes</text></svg>