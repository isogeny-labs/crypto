<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320"><rect width="1000" height="320" fill="white"/><rect x="10" y="3" width="980" height="72" rx="5" fill="#e7f0ec" stroke="#49617a"/><text x="25" y="30" font-family="sans-serif" font-size="22">Explicit graph kernel and quadratic shift</text><text x="25" y="57" font-family="sans-serif" font-size="18">Saved small-field kernel; dense coefficient construction charged</text><rect x="10" y="82" width="980" height="72" rx="5" fill="#e7f0ec" stroke="#49617a"/><text x="25" y="109" font-family="sans-serif" font-size="22">Regularize trace; evaluate at P=-U</text><text x="25" y="136" font-family="sans-serif" font-size="18">N(-U) / (4*y(U)^2*f_r_prime(x(U))^2) = x(R0+psi(U))</text><rect x="10" y="161" width="980" height="72" rx="5" fill="#e7f0ec" stroke="#49617a"/><text x="25" y="188" font-family="sans-serif" font-size="22">Lift and select the rational point</text><text x="25" y="215" font-family="sans-serif" font-size="18">Marked action psi(U)=[x]U; require 2R0 nonrational</text><rect x="10" y="240" width="980" height="72" rx="5" fill="#e7f0ec" stroke="#49617a"/><text x="25" y="267" font-family="sans-serif" font-size="22">Repeat action, then implicit BSGS</text><text x="25" y="294" font-family="sans-serif" font-size="18">d-1 actions produce [x^d]G; charge both search stages</text></svg>