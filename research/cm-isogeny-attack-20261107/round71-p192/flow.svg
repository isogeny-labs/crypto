<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="595"><rect width="1000" height="595" fill="white"/><text x="30" y="35" font-size="23" font-family="sans-serif">Round71: marked response construction</text><rect x="30" y="60" width="940" height="80" fill="#dbeafe" rx="9"/><text x="50" y="89" font-size="21" font-family="sans-serif">Signed pair numerator</text><text x="50" y="119" font-size="18" font-family="sans-serif">A + WB + eps(C + WD); W squared = f(T)f(V)</text><rect x="30" y="160" width="940" height="80" fill="#dbeafe" rx="9"/><text x="50" y="189" font-size="21" font-family="sans-serif">Balanced giant product</text><text x="50" y="219" font-size="18" font-family="sans-serif">Four polynomials; individual degree at most 2n</text><rect x="30" y="260" width="940" height="80" fill="#fef3c7" rx="9"/><text x="50" y="289" font-size="21" font-family="sans-serif">Fast MME theorem (written reduction)</text><text x="50" y="319" font-size="18" font-family="sans-serif">Evaluate at b original signed baby pairs</text><rect x="30" y="360" width="940" height="80" fill="#dcfce7" rx="9"/><text x="50" y="389" font-size="21" font-family="sans-serif">Retained exact prototype</text><text x="50" y="419" font-size="18" font-family="sans-serif">381 decoder rows, 2694 queries, 24 P-192 responses</text><rect x="30" y="460" width="940" height="80" fill="#e5e7eb" rx="9"/><text x="50" y="489" font-size="21" font-family="sans-serif">Next implementation</text><text x="50" y="519" font-size="18" font-family="sans-serif">Retain zero indices; qualify scalar extraction; fast backend</text><text x="30" y="582" font-size="15" font-family="sans-serif">Proof bound: b+n²; choose b~r^(2/3). Prototype does not implement fast MME. PCC standing: unverified.</text></svg>