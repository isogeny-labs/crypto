<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="115"><rect width="1000" height="115" fill="white"/><g fill="#edf4f7" stroke="#557b9e"><rect x="5" y="10" width="225" height="75"/><rect x="270" y="10" width="280" height="75"/><rect x="590" y="10" width="400" height="75"/></g><g font-family="sans-serif" font-size="17"><text x="18" y="35">Public baby points G,Q</text><text x="18" y="63">cache beta,gamma,H_Q</text><text x="234" y="50">→</text><text x="282" y="35">Giant block: numerator norm</text><text x="282" y="63">divide by H_G(x)^4 H_Q(z)^4</text><text x="553" y="50">→</text><text x="602" y="35">center/tail product → B-only response</text><text x="602" y="63">calibration + seven shifts → decoder</text></g><text x="12" y="108" font-family="sans-serif" font-size="14">P192 executes prescribed 27-factor windows; the complete decoder panel runs on the small curves.</text></svg>