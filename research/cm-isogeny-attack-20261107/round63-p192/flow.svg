<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320"><rect width="1000" height="320" fill="white"/><rect x="5" y="4" width="990" height="73" rx="6" fill="#e7f0ec" stroke="#49617a"/><text x="18" y="31" font-family="sans-serif" font-size="21">Public G,Q -&gt; signed baby / giant tables</text><text x="18" y="59" font-family="sans-serif" font-size="16">b+n addition calls and b+1+n point slots per generator; exact final-block clipping</text><rect x="5" y="83" width="990" height="73" rx="6" fill="#e7f0ec" stroke="#49617a"/><text x="18" y="110" font-family="sans-serif" font-size="21">Plus/minus factors -&gt; first spectral jet</text><text x="18" y="138" font-family="sans-serif" font-size="16">(L-J+s)(L+J+s) = (L^2-J^2) + s*(2L); preserve relative y signs</text><rect x="5" y="162" width="990" height="73" rx="6" fill="#e7f0ec" stroke="#49617a"/><text x="18" y="189" font-family="sans-serif" font-size="21">Baby coordinates -&gt; norm algebra</text><text x="18" y="217" font-family="sans-serif" font-size="16">H(Z), beta=x(jQ), gamma=y(jG)y(jQ); norm(E0+s E1)/norm(D^2)</text><rect x="5" y="241" width="990" height="73" rx="6" fill="#e7f0ec" stroke="#49617a"/><text x="18" y="268" font-family="sans-serif" font-size="21">Singular determinant -&gt; calibrated point action</text><text x="18" y="296" font-family="sans-serif" font-size="16">Unit-only pivots retain B at zero constant; one calibration and seven shifts decode</text></svg>