<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330"><rect width="1000" height="330" fill="white"/><rect x="8" y="5" width="984" height="73" rx="5" fill="#e7f0ec" stroke="#49617a"/><text x="22" y="32" font-family="sans-serif" font-size="21">Signed block n/d at P=-U</text><text x="22" y="60" font-family="sans-serif" font-size="16">Preserve x(jG), x(jQ), and the relative y sign</text><rect x="8" y="86" width="984" height="73" rx="5" fill="#e7f0ec" stroke="#49617a"/><text x="22" y="113" font-family="sans-serif" font-size="21">Six-coefficient norm det M(d+s*n0)</text><text x="22" y="141" font-family="sans-serif" font-size="16">Keep e^0,e^1,e^2 and s*e^0,s*e^1,s*e^2; invert only units</text><rect x="8" y="167" width="984" height="73" rx="5" fill="#e7f0ec" stroke="#49617a"/><text x="22" y="194" font-family="sans-serif" font-size="21">Pole coefficient = [s]det / [e^2]det</text><text x="22" y="222" font-family="sans-serif" font-size="16">First derivative of translated x suffices; origin chart handled separately</text><rect x="8" y="248" width="984" height="73" rx="5" fill="#e7f0ec" stroke="#49617a"/><text x="22" y="275" font-family="sans-serif" font-size="21">Divide by 4*y(U)^2, lift and subtract R0</text><text x="22" y="303" font-family="sans-serif" font-size="16">Unique rational point; replay against the declared public point action</text></svg>