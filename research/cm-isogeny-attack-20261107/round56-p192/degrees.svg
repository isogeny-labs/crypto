<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250"><rect width="1000" height="250" fill="white"/><text x="15" y="25" font-family="sans-serif" font-size="20">Polynomial degrees on the six F11 targets (r=7)</text><text x="580" y="25" font-family="sans-serif" font-size="17">Grey: full trace; blue: cyclic trace</text><text x="15" y="66" font-family="sans-serif" font-size="18">Kernel polynomial</text><rect x="300" y="42" width="288" height="19" fill="#7b858b"/><text x="598" y="58" font-family="sans-serif" font-size="17">24</text><rect x="300" y="64" width="36" height="19" fill="#376e8a"/><text x="346" y="80" font-family="sans-serif" font-size="17">3</text><text x="15" y="122" font-family="sans-serif" font-size="18">A numerator</text><rect x="300" y="98" width="588" height="19" fill="#7b858b"/><text x="898" y="114" font-family="sans-serif" font-size="17">49</text><rect x="300" y="120" width="84" height="19" fill="#376e8a"/><text x="394" y="136" font-family="sans-serif" font-size="17">7</text><text x="15" y="178" font-family="sans-serif" font-size="18">B numerator (maximum)</text><rect x="300" y="154" width="552" height="19" fill="#7b858b"/><text x="862" y="170" font-family="sans-serif" font-size="17">46</text><rect x="300" y="176" width="48" height="19" fill="#376e8a"/><text x="358" y="192" font-family="sans-serif" font-size="17">4</text><text x="15" y="231" font-family="sans-serif" font-size="16">Unit: polynomial degree; all six targets. Native records, rounds55-56. No timing inference.</text></svg>