<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320"><rect width="1000" height="320" fill="white"/><rect x="5" y="4" width="990" height="73" rx="6" fill="#e7f0ec" stroke="#49617a"/><text x="18" y="31" font-family="sans-serif" font-size="21">Point action -&gt; six scalar images</text><text x="18" y="59" font-family="sans-serif" font-size="16">T([z]G)=[1/(1-z)]G from the transverse norm; S(W)=G-W</text><rect x="5" y="83" width="990" height="73" rx="6" fill="#e7f0ec" stroke="#49617a"/><text x="18" y="110" font-family="sans-serif" font-size="21">Canonical point -&gt; retained transporter</text><text x="18" y="138" font-family="sans-serif" font-size="16">Least encoded image and normalized H; generic canonicalization charges two changing-target norms</text><rect x="5" y="162" width="990" height="73" rx="6" fill="#e7f0ec" stroke="#49617a"/><text x="18" y="189" font-family="sans-serif" font-size="21">Known affine move -&gt; closed matrix tracker</text><text x="18" y="217" font-family="sans-serif" font-size="16">M &lt;- H A M; f_M(k)=(ak+b)/(ck+d). Rational degree stays one.</text><rect x="5" y="241" width="990" height="73" rx="6" fill="#e7f0ec" stroke="#49617a"/><text x="18" y="268" font-family="sans-serif" font-size="21">Nontrivial collision -&gt; checked roots</text><text x="18" y="296" font-family="sans-serif" font-size="16">Cross-multiply M1 and M2; degree &lt;= 2. Reject proportional matrices; verify roots against Q.</text></svg>