<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320"><rect width="1000" height="320" fill="white"/><rect x="5" y="4" width="990" height="73" rx="6" fill="#e7f0ec" stroke="#49617a"/><text x="18" y="31" font-family="sans-serif" font-size="21">Prepared H,E0,E1 -&gt; field Euclidean arithmetic</text><text x="18" y="59" font-family="sans-serif" font-size="16">Monic square-free H; norm(E0+s E1) = A+s B, s^2=0</text><rect x="5" y="83" width="990" height="73" rx="6" fill="#e7f0ec" stroke="#49617a"/><text x="18" y="110" font-family="sans-serif" font-size="21">Unit E0 -&gt; resultant and trace coefficient</text><text x="18" y="138" font-family="sans-serif" font-size="16">A=Res(H,E0); B=A*coeff_(b-1)((E1/E0)*H&#x27; mod H)</text><rect x="5" y="162" width="990" height="73" rx="6" fill="#e7f0ec" stroke="#49617a"/><text x="18" y="189" font-family="sans-serif" font-size="21">One common root t -&gt; smaller resultant</text><text x="18" y="217" font-family="sans-serif" font-size="16">A=0; B=E1(t)*Res(H/(Z-t),E0); empty norm is one</text><rect x="5" y="241" width="990" height="73" rx="6" fill="#e7f0ec" stroke="#49617a"/><text x="18" y="268" font-family="sans-serif" font-size="21">Two common roots -&gt; zero first coefficient</text><text x="18" y="296" font-family="sans-serif" font-size="16">No nilpotent inverse; chosen norm feeds block output, with dense and stream references</text></svg>