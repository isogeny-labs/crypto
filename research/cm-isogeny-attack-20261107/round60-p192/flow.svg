<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330"><rect width="1000" height="330" fill="white"/><rect x="8" y="5" width="984" height="73" rx="5" fill="#e7f0ec" stroke="#49617a"/><text x="22" y="32" font-family="sans-serif" font-size="20">Cross-difference norm -&gt; short normalized base</text><text x="22" y="60" font-family="sans-serif" font-size="16">N_Q / c_Q = x((1-pi)P)-x((1-pi)R); the base is identical for Q and -Q</text><rect x="8" y="86" width="984" height="73" rx="5" fill="#e7f0ec" stroke="#49617a"/><text x="22" y="113" font-family="sans-serif" font-size="20">Square-zero first variations -&gt; graph-dependent coefficients</text><text x="22" y="141" font-family="sans-serif" font-size="16">One zero factor at R=P+U; retain B and C, without dividing by that factor</text><rect x="8" y="167" width="984" height="73" rx="5" fill="#e7f0ec" stroke="#49617a"/><text x="22" y="194" font-family="sans-serif" font-size="20">Ratio and rational lift -&gt; inverse-affine point action</text><text x="22" y="222" font-family="sans-serif" font-size="16">C/B = x(P+[(1-k)^-1]U); subtract P and choose the rational lift</text><rect x="8" y="248" width="984" height="73" rx="5" fill="#e7f0ec" stroke="#49617a"/><text x="22" y="275" font-family="sans-serif" font-size="20">Reusable first call -&gt; ordinary marked action</text><text x="22" y="303" font-family="sans-serif" font-size="16">bG=M_Q(G), Q2=G-bG, output U-M_Q2(U); charge both constructors</text></svg>