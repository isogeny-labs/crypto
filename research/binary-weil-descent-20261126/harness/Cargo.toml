[package]
name = "bwd_harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Gaudry-Diem k = 3 Weil-descent decomposition oracle (arm D) for binary composite F_{2^n}, subfield factor base, single target, against matched negation-map rho. Reuses the #5253 harness modules (field, gen, ic, rho, seeds) and crypto modules unchanged by #[path]."

# Standalone: not a member of the crypto workspace.
[workspace]

[dependencies]
num-bigint = "0.4"
sha2 = "0.10"
serde_json = "1.0"

[profile.release]
debug = 0
opt-level = 3
