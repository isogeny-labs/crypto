<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370"><rect width="1000" height="370" fill="#f5f8fc"/><g font-family="DejaVu Sans" text-anchor="middle" fill="#17334c"><text x="500" y="32" font-size="23" font-weight="bold">Three related native-window views</text><rect x="65" y="72" width="870" height="180" rx="10" fill="#dce9fb"/><text x="500" y="107" font-size="20">Inclusive observed process window</text><rect x="100" y="130" width="330" height="90" rx="8" fill="#d8eee1"/><rect x="470" y="130" width="430" height="90" rx="8" fill="#e5e0f4"/><text x="265" y="166" font-size="19">Callback windows</text><text x="265" y="195" font-size="15">includes nested F4 from visitor code</text><text x="685" y="166" font-size="19">Outside callback windows</text><text x="685" y="195" font-size="15">not exclusive solver attribution</text><text x="500" y="280" font-size="17">Staircase operations are already a subset of native total</text><text x="500" y="310" font-size="16">Do not add inclusive to its parts, or stair to native total</text><text x="500" y="340" font-size="15">Ambient process work · nontransactional reads · full overflow unqualified · no price</text><text x="500" y="363" font-size="13">Software correctness controls only; no comparable performance values</text></g></svg>
