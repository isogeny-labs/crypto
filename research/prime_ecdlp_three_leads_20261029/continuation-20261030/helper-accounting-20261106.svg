<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390"><rect width="1000" height="390" fill="#f5f8fc"/><g font-family="DejaVu Sans" text-anchor="middle" fill="#18334d"><text x="500" y="31" font-size="23" font-weight="bold">Equal counters can belong to two executed paths</text><text x="120" y="96" font-size="18">Producer</text><text x="120" y="210" font-size="18">Replay audit</text><g fill="#dce9fb"><rect x="245" y="60" width="310" height="75" rx="9"/><rect x="610" y="60" width="350" height="75" rx="9"/></g><g fill="#d8eee1"><rect x="245" y="175" width="310" height="75" rx="9"/><rect x="610" y="175" width="350" height="75" rx="9"/></g><text x="400" y="90" font-size="18">Parameter / setup helpers</text><text x="400" y="116" font-size="15">coordinate p, legacy producer view</text><text x="785" y="90" font-size="18">Raw relation encoding</text><text x="785" y="116" font-size="15">scalar n + coordinate-p orientation</text><text x="400" y="205" font-size="18">Disjoint helper captures</text><text x="400" y="231" font-size="14">parameters + constructor + oracle checks</text><text x="785" y="205" font-size="18">Replay encoding ledger</text><text x="785" y="231" font-size="15">retained Result-error prefix</text><path d="M785 135 V175" stroke="#315d88" stroke-width="2" stroke-dasharray="5 4"/><text x="500" y="289" font-size="17">Producer and replay are distinct work: charge both executions</text><text x="500" y="320" font-size="16">Within one execution: inverse/sqrt diagnostics overlap multiplication children</text><text x="500" y="350" font-size="16">Overflow = unavailable · current-thread source calls · no complete price</text><text x="500" y="376" font-size="13">Local correctness controls · shared encoder comparison is consistency, not independent cost proof</text></g></svg>
