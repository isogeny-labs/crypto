<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><rect width="1000" height="400" fill="#f7f9fc"/><g font-family="DejaVu Sans" text-anchor="middle" fill="#142c45"><text x="500" y="32" font-size="23" font-weight="bold">Caller owns audit work across success and refusal</text><rect x="30" y="66" width="270" height="90" rx="10" fill="#dceaff"/><text x="165" y="99" font-size="18">Unchanged checkpoint gate</text><text x="165" y="128" font-size="16">refusal ends before input / replay</text><rect x="365" y="66" width="270" height="90" rx="10" fill="#dceaff"/><text x="500" y="99" font-size="18">Caller-owned accounting</text><text x="500" y="128" font-size="16">shared meter + affine checks</text><path d="M300 110 H355" stroke="#244a73" stroke-width="3"/><path d="M635 110 H700 V199 M500 156 V199" fill="none" stroke="#244a73" stroke-width="3"/><rect x="310" y="202" width="330" height="90" rx="10" fill="#d7f0e6"/><text x="475" y="234" font-size="18">Scalar modulus n</text><text x="475" y="262" font-size="16">coefficient + augmented spaces</text><rect x="675" y="202" width="295" height="90" rx="10" fill="#e7e3f8"/><text x="822" y="234" font-size="18">Coordinate field p</text><text x="822" y="262" font-size="16">setup / equations / oracle checks</text><text x="500" y="330" font-size="17">Success: replay v2 + work · Rejection: partial-work envelope</text><text x="500" y="363" font-size="16">Overlapping diagnostic / integer views are alternatives; no price or complete-cost claim</text><text x="500" y="388" font-size="13">Source f866dd7a · local software controls · no comparable performance values</text></g></svg>
