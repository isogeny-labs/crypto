<svg xmlns="http://www.w3.org/2000/svg" width="850" height="330" viewBox="0 0 850 330"><rect width="850" height="330" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker></defs><g font-family="DejaVu Sans" font-size="15" fill="#172033"><text x="20" y="27" font-size="20" font-weight="bold">Local bookkeeping flow — mock callbacks only</text><g fill="#e0f2fe" stroke="#0284c7"><rect x="20" y="60" width="175" height="65" rx="8"/><rect x="265" y="60" width="165" height="65" rx="8"/><rect x="515" y="60" width="160" height="65" rx="8"/><rect x="515" y="170" width="250" height="55" rx="8"/><rect x="20" y="250" width="745" height="55" rx="8"/></g><text x="35" y="86">Create attempt</text><text x="35" y="110">sync or return error</text><text x="280" y="87">Supplied gate</text><text x="280" y="110">Permit / Refuse</text><text x="530" y="87">Work callback</text><text x="530" y="110">Result / unwind</text><text x="530" y="195">Publish terminal or retain</text><text x="530" y="215">primary + publication errors</text><text x="35" y="274">Read-only named inventory: unfinished stays unfinished; separate retry ID</text><text x="35" y="294">Counts unavailable · no uninterrupted clock · no process launch / admission</text><g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"><path d="M195,92 H265"/><path d="M430,92 H515"/><path d="M595,125 V170"/><path d="M350,125 V197 H515"/><path d="M675,92 H805 V278 H765"/></g><text x="447" y="77" font-size="13">Permit</text><text x="359" y="180" font-size="13">Refuse / Err</text><text x="687" y="145" font-size="13">unwind:</text><text x="687" y="163" font-size="13">unfinished</text></g></svg>
