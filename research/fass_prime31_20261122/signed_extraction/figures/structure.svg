   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183044" x="264.96" y="45.239375" transform="rotate(-0 264.96 45.239375)">Public curve, selector, subgroup and target</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #586774" x="264.96" y="66.496281" transform="rotate(-0 264.96 66.496281)">Finite sign-closed base B; repetitions allowed</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183044" x="143.136" y="114.089375" transform="rotate(-0 143.136 114.089375)">Finite prefix R = P1 + P2</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #586774" transform="translate(81.89043 129.837675)">Q finite: right polynomial G_X</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #586774" transform="translate(71.061523 140.624044)">Q = O: actual base polynomial F_B</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183044" x="407.52" y="114.089375" transform="rotate(-0 407.52 114.089375)">Identity prefix R = O</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #586774" transform="translate(360.940789 130.068519)">Q in B: every (P, -P, Q)</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #586774" transform="translate(346.649875 140.624044)">Q = O: no triples in this chart</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183044" x="143.136" y="192.119375" transform="rotate(-0 143.136 192.119375)">All witness and sign branches</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #586774" transform="translate(67.32393 208.098519)">Complete gcd roots and rational lifts</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #586774" transform="translate(68.5605 218.654044)">Set P3 = Q - R; require membership</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183044" x="407.52" y="192.119375" transform="rotate(-0 407.52 192.119375)">Original group replay</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #586774" transform="translate(370.478656 208.098519)">P1 + P2 + P3 = Q</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #586774" transform="translate(339.742719 218.654044)">Retain every ordered point triple</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183044" x="264.96" y="267.089375" transform="rotate(-0 264.96 267.089375)">Separate output views with witness backpointers</text>
   </g>
