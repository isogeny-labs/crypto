<svg xmlns="http://www.w3.org/2000/svg" width="500" height="142" viewBox="0 0 500 142">
<rect x="0" y="6" width="500" height="40" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="25" font-size="8.8" font-family="DejaVu Sans,sans-serif">Any char-p field</text>
<text x="130" y="21" font-size="7.8" font-family="DejaVu Sans,sans-serif">p^k-th unit roots: identity only</text>
<text x="130" y="37" font-size="8.1" font-family="DejaVu Sans,sans-serif">Finite field: units / p^k-th powers has cardinality 1</text>
<rect x="0" y="52" width="500" height="40" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="71" font-size="8.8" font-family="DejaVu Sans,sans-serif">Actual curve domains</text>
<text x="130" y="67" font-size="7.8" font-family="DejaVu Sans,sans-serif">Finite E/nE and E[n] have equal cardinality</text>
<text x="130" y="83" font-size="8.1" font-family="DejaVu Sans,sans-serif">Ordinary char2: 2 / 2 / 1; paired ordinary char3: 3 / 3 / 1</text>
<rect x="0" y="98" width="500" height="40" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="117" font-size="8.8" font-family="DejaVu Sans,sans-serif">Scope controls</text>
<text x="130" y="113" font-size="7.8" font-family="DejaVu Sans,sans-serif">Prime nonidentity root implies coprimality</text>
<text x="130" y="129" font-size="8.1" font-family="DejaVu Sans,sans-serif">Imperfect F2(X): X gives a nonidentity square class</text>
</svg>
