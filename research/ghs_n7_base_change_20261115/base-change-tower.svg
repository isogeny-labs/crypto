<rect x="45" y="73" width="340" height="96" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="215" y="108" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#17345e">E / F128, trace ±9</text>
<text x="215" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#17345e">A = Res(E) / F2</text>
<rect x="575" y="73" width="340" height="96" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
<text x="745" y="108" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#14532d">Y / F2, genus 7</text>
<text x="745" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14532d">J(Y) ~ A by Weil polynomial</text>
<line x1="388" y1="121" x2="572" y2="121" stroke="#475569" stroke-width="3" stroke-dasharray="9 6"/>
<text x="480" y="109" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">isogeny exists; formulas open</text>
<line x1="215" y1="172" x2="215" y2="268" stroke="#3b82f6" stroke-width="3"/>
<polygon points="215,278 207,262 223,262" fill="#3b82f6"/>
<line x1="745" y1="172" x2="745" y2="268" stroke="#22c55e" stroke-width="3"/>
<polygon points="745,278 737,262 753,262" fill="#22c55e"/>
<text x="480" y="220" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155">gcd(s, 7) = 1</text>
<text x="480" y="245" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">F128 ⊗ F(2^s) = F(2^(7s))</text>
<rect x="45" y="284" width="340" height="91" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="215" y="318" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#17345e">E_s / F(2^(7s))</text>
<text x="215" y="347" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#17345e">published W0 or W1 by absolute trace</text>
<rect x="575" y="284" width="340" height="91" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
<text x="745" y="318" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#14532d">Y_s / F(2^s), genus 7</text>
<text x="745" y="347" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14532d">J(Y_s) ~ Res(E_s)</text>
<line x1="388" y1="329" x2="572" y2="329" stroke="#475569" stroke-width="3" stroke-dasharray="9 6"/>
<text x="480" y="315" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">base-changed isogeny</text>
<text x="480" y="403" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">q=4 source and target counts checked; evaluated subgroup map and attack cost open</text>
