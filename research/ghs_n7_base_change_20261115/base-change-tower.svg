<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Coprime base-change tower from the F2 genus-seven carrier to Fq">
<rect width="960" height="420" fill="#f8fafc"/>
