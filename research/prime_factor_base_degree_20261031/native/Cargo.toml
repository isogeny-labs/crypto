[package]
name = "prime-degree-certificate"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "prime-degree-certificate"
path = "main.rs"

[[bin]]
name = "secant-graph-certificate"
path = "secant_graph.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
