<title id="title">Concrete F17 group semantics and canonical degree</title>
<desc id="desc">The same original generator set gives exact signed group relations by evaluation and has canonical homogeneous first vanishing degree three. The inherited dense comparator has degree five. All four branches and the identity inverse pairs are checked.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#355e72" stroke-width="1.4"/></marker></defs>
