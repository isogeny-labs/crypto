<text x="62" y="140">Actual generators G = {g1, g2, qx, qz} over F17[x,z,m]</text>
<text x="62" y="317">Evaluation of these same generators</text>
<text x="617" y="317">Canonical highest forms of G</text>
<text x="62" y="533">All four signs, tangents, repeated abscissae and flexes are retained</text>
</g>
<g font-size="17">
<text x="62" y="175">h(x)=4x²+9x+9 · V={5,6,10,16} · y²=x³+2x+2 · nonzero discriminant</text>
<text x="62" y="352">∃m, every p∈G evaluates to zero</text>
<text x="62" y="384">↔ x,z∈V and actual P+Q=R</text>
<text x="62" y="411">Full split identity proves membership</text>
<text x="617" y="352">First vanishing homogeneous degree = 3</text>
<text x="617" y="384">Inherited dense comparator: degree = 5</text>
<text x="617" y="411">Actual total degrees select the forms</text>
<text x="62" y="568">Identity target has its own exact theorem: P+Q=O ↔ inverse pair</text>
