<text x="40" y="72" font-size="17">icv1-fp5-tm1-a77cc6af · FB1hed5b19904cc8 · formal proof, not timing</text>
<g stroke="#3a765c" stroke-width="2" fill="#e7f3eb">
<rect x="40" y="108" width="1020" height="106" rx="12"/>
