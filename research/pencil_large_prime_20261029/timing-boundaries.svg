<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280"><rect width="1100" height="280" fill="white"/><g font-family="sans-serif" fill="#172b4d"><text x="30" y="30" font-size="22">Pencil online timing boundary — implementation map</text><text x="30" y="60" font-size="15">Target-blind setup precedes the window. Additional adapter verification follows it.</text><path d="M30 92 H1070" stroke="#26618b" stroke-width="3"/><text x="30" y="85" font-size="14">First target validity check</text><text x="830" y="85" font-size="14">First source check completed</text><rect x="30" y="108" width="195" height="78" rx="5" fill="#e5f0f7" stroke="#26618b"/><text x="40" y="138" font-size="17">Query / control</text><text x="40" y="165" font-size="13">validation and transfer</text><rect x="240" y="108" width="195" height="78" rx="5" fill="#e5f0f7" stroke="#26618b"/><text x="250" y="138" font-size="17">Decomposition</text><text x="250" y="165" font-size="13">point-driven sieve</text><rect x="450" y="108" width="195" height="78" rx="5" fill="#e5f0f7" stroke="#26618b"/><text x="460" y="138" font-size="17">Relation checks</text><text x="460" y="165" font-size="13">polynomial and Jacobian</text><rect x="660" y="108" width="195" height="78" rx="5" fill="#e5f0f7" stroke="#26618b"/><text x="670" y="138" font-size="17">Elimination</text><text x="670" y="165" font-size="13">signed graph and residual</text><rect x="870" y="108" width="195" height="78" rx="5" fill="#e5f0f7" stroke="#26618b"/><text x="880" y="138" font-size="17">Source check</text><text x="880" y="165" font-size="13">first verification</text><text x="30" y="218" font-size="15">Stages repeat as needed; query/control owns intervening bookkeeping. Five exclusive times sum to the window.</text><text x="30" y="248" font-size="15">No measured durations shown; box widths are not costs. Source: timing-boundaries.csv and native_solver.rs.</text></g></svg>