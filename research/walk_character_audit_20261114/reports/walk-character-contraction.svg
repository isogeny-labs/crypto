<svg xmlns="http://www.w3.org/2000/svg" width="500" height="142" viewBox="0 0 500 142">
<rect x="0" y="6" width="500" height="40" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="25" font-size="8.8" font-family="DejaVu Sans,sans-serif">Actual iid law</text>
<text x="130" y="21" font-size="7.8" font-family="DejaVu Sans,sans-serif">Character expectation = λ^t·ψ(start)</text>
<text x="130" y="37" font-size="8.1" font-family="DejaVu Sans,sans-serif">Actual squared character moment = normSq(λ)^t</text>
<rect x="0" y="52" width="500" height="40" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="71" font-size="8.8" font-family="DejaVu Sans,sans-serif">Derived contraction</text>
<text x="130" y="67" font-size="7.8" font-family="DejaVu Sans,sans-serif">Normalized unit-phase variance = pair-defect sum / 2</text>
<text x="130" y="83" font-size="8.1" font-family="DejaVu Sans,sans-serif">Positive pair + phase separation ⇒ strict contraction</text>
<rect x="0" y="98" width="500" height="40" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="117" font-size="8.8" font-family="DejaVu Sans,sans-serif">Domain controls</text>
<text x="130" y="113" font-size="7.8" font-family="DejaVu Sans,sans-serif">Prime + positive pair + distinct supports + j≠0: normSq(λ)&lt;1</text>
<text x="130" y="129" font-size="8.1" font-family="DejaVu Sans,sans-serif">Zero weight or composite0/2: coefficient1; j0 is trivial</text>
</svg>
