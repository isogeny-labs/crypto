<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360"><rect width="960" height="360" fill="#f4f7fc"/><g font-family="sans-serif" fill="#172f50"><text x="30" y="38" font-size="24">ECDLP index calculus: structured bases to checked relations</text><g fill="#dce9fb" stroke="#436c9f"><rect x="30" y="70" width="270" height="110" rx="8"/><rect x="345" y="70" width="270" height="110" rx="8"/><rect x="660" y="70" width="270" height="110" rx="8"/></g><g font-size="17"><text x="45" y="100">Verified archive + public R</text><text x="45" y="132">Coset / torus / Dickson</text><text x="45" y="158">Actual signed subgroup points</text><text x="360" y="100">Enumerate m−1 prefix points</text><text x="360" y="132">Derive final point; index lookup</text><text x="360" y="158">Caps retain unknown outcomes</text><text x="675" y="100">Replay multiset sum = R</text><text x="675" y="132">Return point-index witnesses</text><text x="675" y="158">Generic oracle implemented</text></g><path d="M300 125 H340 M615 125 H655" stroke="#436c9f" stroke-width="4"/><rect x="30" y="215" width="900" height="112" fill="#fff0d4" stroke="#b17e26"/><text x="45" y="245" font-size="18">Separate obligations: labelled rows, useful rank, scalar replay and full cost</text><text x="45" y="275" font-size="16">Actual-width, weighted and partial-relation leads retain source hypotheses and existing obstructions.</text><text x="45" y="305" font-size="16">No unknown DLP solved; no new speedup, algebraic PDP theorem or sub-rho claim.</text></g></svg>
