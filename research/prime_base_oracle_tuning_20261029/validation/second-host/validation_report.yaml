    - inc-aa/inc = 1.0 exactly at w = 0, 0.1, 1 over 240 pairs (ecbench compare and stdlib)
    - rho-neg-aa/rho-neg = 1.0 exactly at w = 0, 0.1, 1 over 240 pairs (validator-run compares; the producer did not run these)
    - "[d]G = Q under the validator's own affine arithmetic: 2016/2016 second-host and 1008/1008 original verified records; p = 803441, r = 804007 prime, [r]G = O, all 48 targets and G on y^2 = x^3 + 232725x + 341758"
    - L2 gate 2016/2016 executions at L2 (wall times are host observations, not compared and not a claim)
  heuristic_validation_checks:
    - not applicable: a deterministic replay of counted operations; no heuristic prediction is tested by this round
  cost_model_checks:
    - unit declared (ecbench GAE / sqrt(r)) with unpriced native work priced at w = 0, 0.1, 1 on every arm, rho included; C = 0 (no calibration pins)
    - memory reported beside time: mean peak RSS sel/inc 0.999 on both hosts (no time-memory trade); RSS is a host observation and differs between hosts
    - bitop/v1 work is not covered by the second-host replay (fields absent in the older build)
  proof_architecture_checks: []
  null_object_and_ladder:
    - The A/A arms are the null objects of the paired ratio and read exactly 1.000; no correlation or bias statistic is reported by this round.
    - No extrapolated speedup is claimed by this round; the row's ratio is measured at the instance scale (one 20-bit curve).
  verdict: passed
  verdict_scope: >-
    The second-host re-execution is admissible evidence that every original holdout-P20 record reproduces on another
    host class and ecbench build in every counted, band-priced and outcome field. This meets the PROTOCOL.md section 13
    second-host replay requirement in substance. It is not evidence about any hypothesis, does not demonstrate a speedup
    beyond the already-validated counted ratio, and does not itself authorize promotion (Coordinator decision).
  limitations:
    - "Form: a new session from the frozen spec matched record by record, plus a local verify of the new session; not an `ecbench verify --replay-all` receipt of the original session's bytes produced on the second host. `ecbench claim build --independent-receipt` (vs_rho) would need that form."
    - Not an independent implementation; both hosts ran ecbench. The validator's [d]G = Q check and stdlib recompute are the implementation-independent checks.
    - The second-host binary's source revision (cb2ec687) is attested by its image, not rebuilt.
    - bitop/v1 work and phase work_native are not reproduced (absent in the older build); wall times are not compared.
    - Rounds 3-5 (144 extra target-round pairs per arm, same curve, new seeds) are post-freeze data; consistent with the frozen 96-pair reading, not a replacement for it.
    - One 20-bit curve; no curve-to-curve, other-size or exponent claim.
    - second-host/README.md says two spec fields changed; three did (label as well). Descriptive only.
