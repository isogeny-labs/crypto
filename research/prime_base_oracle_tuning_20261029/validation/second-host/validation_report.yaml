      result: agree to <= 9e-16 relative at every weight; sel/inc 0.8364 [0.806, 0.866] / 0.8166 [0.786, 0.847] / 0.7461 [0.714, 0.779] at w = 0 / 0.1 / 1; sel/rho-neg 7.95 / 8.24 / 9.62
