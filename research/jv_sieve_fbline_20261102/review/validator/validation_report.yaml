      - "AGENTS.md: Standing workflow rules, sec. 5a"
      - research/jv_sieve_fbline_20261102/{PROTOCOL.md, README.md, run.sh, results/*, analysis/analysis.txt}
      - "research/jv_sieve_fbline_20261102/fit/src/analyze.rs lines 155-166 only (after the independent recomputation, to explain the gamma_hat interval difference)"
      - research/jv_sieve_strong_rho_v2_20261020/raw/ic_{1009,1511,1823}_sparse.json
      - "research/jv_sieve_strong_rho_v2_20261020/PROTOCOL.md (rule A4 only)"
      - research/jv_cover_next_leads_20261102/LEADS.md
      - "src/cryptanalysis/jv_sieve.rs (run_cover_sieve_dlp_on, sieve_batch header) and jv_cover.rs (Fq counter, Spec, Ctx, line_poly, line_div, line_count, chi_table, table_count, search_fb_line_mode, pmul, pscale) at aa1c89ab2a; git diffs 3764c93e98..44a1e45ddd and 44a1e45ddd..aa1c89ab2a"
      - examples/jv_cover.rs (seed loop)
      - scripts/validation_gate.py (checker functions), scripts/fixtures/validation_gate/positive/
