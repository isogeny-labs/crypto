[package]
name = "b2lp_harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Double-large-prime variant (arm D2) of the #5261 Gaudry-Diem k = 3 Weil-descent oracle for binary composite F_{2^n}, small subfield base + signed large-prime graph, single target, against matched negation-map rho. Reuses #5253 and #5261 modules unchanged by #[path]."

# Standalone: not a member of the crypto workspace.
[workspace]

[dependencies]
num-bigint = "0.4"
sha2 = "0.10"
serde_json = "1.0"

[profile.release]
debug = 0
opt-level = 3
