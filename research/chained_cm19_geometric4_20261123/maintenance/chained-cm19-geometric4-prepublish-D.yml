name: CM19 geometric cover finite cases and quantified coefficients
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - research/chained_cm19_geometric4_20261123/**
      - .github/workflows/chained-cm19-geometric4.yml
permissions:
  contents: read
jobs:
  finite-cases-and-coefficient-proof:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.artifacts/config.json
            /.gitattributes
            /.gitignore
            /AGENTS.md
            /pcc/claims/PCC-20261123-25c352.json
            /pcc/claims/PCC-20261123-5b6e3c.json
            /pcc/claims/PCC-20261123-ab2053.json
            /pcc/claims/PCC-20261123-b6d84e.json
            /pcc/claims/PCC-20261123-c543f0.json
            /pcc/claims/PCC-20261123-f15be8.json
            /pcc/claims/PCC-20261123-f29afa.json
            /pcc/keyring.json
            /research/chained_cm19_3torsion_divisors_20261123/ACTUAL_H_BASIS_PROOF_A.md
            /research/chained_cm19_actual_j4_20261123/GLOBAL_SPLIT_TRANSFER_C.md
            /research/chained_cm19_curve_maps_20261123/CURRENT_RESULT_B.md
            /scripts/checkpoint.sh
            /research/chained_cm19_geometric4_20261123/
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Install pinned standard Lean release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst --output "$RUNNER_TEMP/lean-4.35.0-linux.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean-4.35.0-linux.tar.zst" -C "$RUNNER_TEMP"
          echo "LEAN_TOOLCHAIN_DIR=$RUNNER_TEMP/lean-4.35.0-linux" >> "$GITHUB_ENV"
      - name: Verify frozen bytes and run bounded finite cases and forall proof
        shell: bash
        run: bash research/chained_cm19_geometric4_20261123/run_ci_D.sh "$RUNNER_TEMP/cm19-geometric4-ci"
      - name: Retain complete original CI outputs and binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm19-geometric4-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cm19-geometric4-ci
          if-no-files-found: warn
          retention-days: 14
