<svg xmlns="http://www.w3.org/2000/svg" width="500" height="120" viewBox="0 0 500 120">
<rect x="0" y="5" width="500" height="34" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="22" font-size="8.1" font-family="DejaVu Sans,sans-serif">Actual source domain</text>
<text x="116" y="18" font-size="7.6" font-family="DejaVu Sans,sans-serif">B = F5[X]/(X^5); lambda = x^2</text>
<text x="116" y="32" font-size="7.6" font-family="DejaVu Sans,sans-serif">Exact homogeneous degree 2, exact linear-generator rank 1</text>
<rect x="0" y="44" width="500" height="34" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="61" font-size="8.1" font-family="DejaVu Sans,sans-serif">Actual homology</text>
<text x="116" y="57" font-size="7.6" font-family="DejaVu Sans,sans-serif">Ann(lambda) in B_k is zero for k=0,1,2</text>
<text x="116" y="71" font-size="7.6" font-family="DejaVu Sans,sans-serif">At k=3: x^3 kills lambda; trivial annihilators are zero</text>
<rect x="0" y="83" width="500" height="34" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="100" font-size="8.1" font-family="DejaVu Sans,sans-serif">Printed bound fails</text>
<text x="116" y="96" font-size="7.6" font-family="DejaVu Sans,sans-serif">First fall degree = 3+2 = 5; printed bound = 4</text>
<text x="116" y="110" font-size="7.6" font-family="DejaVu Sans,sans-serif">Gamma_5(1,2,4,2) = 0; binary q=2 claim retained</text>
</svg>
