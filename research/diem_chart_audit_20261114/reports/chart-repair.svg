<svg xmlns="http://www.w3.org/2000/svg" width="500" height="127" viewBox="0 0 500 127">
<text x="9" y="13" font-family="DejaVu Sans,sans-serif" font-size="9.2" fill="#234b70">Actual F2 obstruction: P1 has3 points; each torus has1 point.</text>
<rect x="4" y="28" width="151" height="35" rx="4" fill="#edf3f8" stroke="#8eb0cb"/>
<text x="59" y="50" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#234b70">[1:0]</text>
<rect x="173" y="28" width="151" height="35" rx="4" fill="#edf3f8" stroke="#8eb0cb"/>
<text x="228" y="50" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#234b70">[1:1]</text>
<rect x="342" y="28" width="151" height="35" rx="4" fill="#edf3f8" stroke="#8eb0cb"/>
<text x="397" y="50" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#234b70">[0:1]</text>
<rect x="4" y="77" width="489" height="42" rx="4" fill="#edf3f8" stroke="#8eb0cb"/>
<text x="12" y="93" font-family="DejaVu Sans,sans-serif" font-size="9" fill="#234b70">Three injective charts: [1:u], [1:u−1], [u−1:1] (u≠0).</text>
<text x="12" y="109" font-family="DejaVu Sans,sans-serif" font-size="8.7" fill="#234b70">Products need3^n charts overF2. Proved overhead: 3^n ≤5n!.</text>
</svg>
