<text class="p" x="400.6" y="179.4" font-size="12" font-weight="600">1.66×</text>
<text class="p" x="290" y="215.4" font-size="12" text-anchor="end">macaulay, batch 8192: cursor → 2D update</text>
<g><title>macaulay, batch 8192: cursor → 2D update: 1.11× faster</title><path class="b" d="M300,200 h16.3 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-16.3 z"/></g>
