<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#2b5672"/></marker></defs>
<rect width="980" height="390" fill="#f4f8fb"/>
<g font-family="sans-serif" fill="#19394d">
<text x="28" y="38" font-size="23" font-weight="bold">The trace-compatible domain contains conditional linear fibers</text>
<g fill="white" stroke="#8ba7ba" stroke-width="1.5"><rect x="28" y="85" width="280" height="105" rx="8"/><rect x="350" y="85" width="280" height="105" rx="8"/><rect x="672" y="85" width="280" height="105" rx="8"/><rect x="180" y="245" width="620" height="95" rx="8"/></g>
<g text-anchor="middle" font-size="16">
<text x="168" y="116" font-weight="bold">Fix a leaf pair (a,b)</text><text x="168" y="145">L(u) = A u² + B u</text><text x="168" y="173" font-size="14">A=(a+b)², B=ab; nonzero/distinct</text>
<text x="490" y="116" font-weight="bold">Kernel stays inside ker(Tr)</text><text x="490" y="145">delta = ab/(a+b)² = s²+s</text><text x="490" y="173" font-size="14">Roots share trace; rank n−2</text>
<text x="812" y="116" font-weight="bold">Couple the second S3 block</text><text x="812" y="145">D nonzero: u = N / D</text><text x="812" y="173" font-size="14">D=0 branches retained explicitly</text>
<text x="490" y="275" font-weight="bold">Structural choice: few ratios, few normalized operators</text><text x="490" y="302">r=a/b fixes L_r(u)=(r+1)²u²+ru</text><text x="490" y="326" font-size="14">Small quotient set is a reuse criterion; complete solving cost remains to test</text>
</g>
<g stroke="#2b5672" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M308 137 H343"/><path d="M630 137 H665"/><path d="M490 190 V238"/></g>
