- The tool exits 2 before running any command; return `refused` with the IMPEDIMENT line.
notes: 'Frozen EKS L2 ecbench jobs of the positive control job PC (bsgs.textbook / bsgs.negation, 33-41 bit). Image 104186811093.dkr.ecr.us-east-2.amazonaws.com/isolab/tasks@sha256:292bdc3d91ef540bc7719f20902c5acc614dab458676225623275bb3a838cae5, ecbench a18af09f9fb875dd09d0399259b5481b6952d9a8f1f52f5fccc7d9ab1a0cd3b9, source dbd587a01aefba0634acc459ea30cfb9bbf49a09. Each launch step is the only step that submits that job and it appears once; it runs launch-remote under the study''s benchmark record through run_recorded.sh and accepts exit 0 or 26 (26 is a launcher build that did not succeed, for example a pod that ended with exit 42 or 43). The admit step after it fails unless the job is a complete session with a passing pod audit and a pod exit of 0, 42 or 43 (PROTOCOL.md section 10: levels gate wall time, never counts). A stop after a submission is reconciled by the director against the saved receipts of that job, never by a new submission; an interrupted launch is finished with the matching
  resume card whose id ends in -R- and the job name (R-PC, R-M1 to R-M9). Run the card detached and strictly alone: no other card of this study may run at the same time, because benchrec rewrites the record file after each wrapped command. Expected duration about 20 minutes. The tool writes its receipt when the last command ends.'
