notes: 'FINISH card for job prime-medium-rho-p4-20261108-m9. Card -9 ran its steps through session-identity-m9 (launch, admission, fetch: records.jsonl sha256 recorded in its fetch-m9 stdout) and its process was then killed during the local verify-m9 replay, when the executor''s turn ended, so it has no receipt. This card has no launch, wait or fetch step and cannot submit anything. It binds the admission and launch receipts, the five fetched session files and card -9''s fetch stdout at the sha256 they have now, re-checks the frozen identities, then runs card -9''s own session-identity-m9, verify-m9 (ecbench verify --replay-all with the frozen binary), audit-pass-m9 and add-raw-m9 steps unchanged. The head-paths-unchanged step is card -9''s, against its pinned commit; no commit field is set because task_card.py run refuses any HEAD other than the pinned one.'
