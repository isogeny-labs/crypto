  <!-- axes -->
  <line x1="80" y1="300" x2="600" y2="300" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="80" x2="80" y2="300" stroke="#333" stroke-width="1.5"/>
  <!-- scale: S=0 at y=300, S=16 at y=80 → 13.75 px per S -->
  <!-- rho 2.083 -->
  <rect x="120" y="271.4" width="70" height="28.6" fill="#4a6fa5"/>
  <text x="155" y="320" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="11" fill="#333">rho-frob</text>
  <text x="155" y="265" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="12" fill="#1b1b1b">2.08</text>
  <!-- counted 5.966 -->
  <rect x="250" y="218.0" width="70" height="82.0" fill="#2f6f4e"/>
  <text x="285" y="320" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="11" fill="#333">ic-counted</text>
  <text x="285" y="212" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="12" fill="#1b1b1b">5.97</text>
  <!-- fiber 14.483 -->
  <rect x="380" y="100.9" width="70" height="199.1" fill="#a65d3f"/>
  <text x="415" y="320" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="11" fill="#333">ic-fiber</text>
  <text x="415" y="95" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="12" fill="#1b1b1b">14.48</text>
  <!-- aa 2.083 -->
  <rect x="510" y="271.4" width="70" height="28.6" fill="#4a6fa5" opacity="0.55"/>
  <text x="545" y="320" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="11" fill="#333">rho-aa</text>
  <text x="545" y="265" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="12" fill="#1b1b1b">2.08</text>
  <text x="32" y="350" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="11" fill="#555">Fiber/counted ops ratio 2.427 [2.396, 2.459]. Measured support ≠ S win.</text>
