<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">H115 Frobenius--Kummer resolvent mechanism and evidence gates</title>
  <desc id="desc">The r-squared division torsor maps r-to-one under Frobenius minus one to the degree-r Verschiebung-minus-one fiber, whose moments feed a frozen radix-six predicate family. A separate subexponential shortcut gate remains open.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16324f"/></marker>
    <style>
      .bg{fill:#f7fafc}.box{fill:#fff;stroke:#16324f;stroke-width:2}.known{fill:#e8f4ff}.test{fill:#fff6dd}.open{fill:#ffe9e6;stroke:#a4332b}.head{font:700 25px system-ui,sans-serif;fill:#102a43}.body{font:17px system-ui,sans-serif;fill:#243b53}.small{font:15px system-ui,sans-serif;fill:#486581}.math{font:18px ui-monospace,SFMono-Regular,monospace;fill:#102a43}.arrow{stroke:#16324f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}
    </style>
  </defs>
  <rect class="bg" width="1200" height="640"/>
  <text class="head" x="50" y="48">H115: exact algebra, frozen experiment, unresolved cost bridge</text>

  <rect class="box known" x="50" y="105" rx="14" width="270" height="155"/>
  <text class="head" x="75" y="140">Division torsor</text>
  <text class="math" x="75" y="178">[r]R = Q</text>
  <text class="body" x="75" y="210">r² geometric points</text>
  <text class="small" x="75" y="238">Known Kummer object</text>

  <path class="arrow" d="M320 180 L430 180"/>
  <text class="math" x="342" y="155">π − 1</text>
  <text class="small" x="337" y="211">r-to-one</text>

  <rect class="box known" x="430" y="85" rx="14" width="330" height="195"/>
  <text class="head" x="455" y="122">Cocycle fiber</text>
  <text class="math" x="455" y="158">(V−1)c = Q</text>
  <text class="math" x="455" y="190">c ∈ c₀(Q) + H</text>
  <text class="body" x="455" y="222">|H| = r, degree r</text>
  <text class="small" x="455" y="252">Derived: (V−1)(π−1)=[r]</text>

  <path class="arrow" d="M760 180 L850 180"/>
  <text class="small" x="774" y="154">sum x/y</text>

  <rect class="box test" x="850" y="90" rx="14" width="300" height="185"/>
  <text class="head" x="875" y="127">Frozen observables</text>
  <text class="body" x="875" y="164">16 power sums, j ≤ 8</text>
  <text class="body" x="875" y="194">54 public channels</text>
  <text class="body" x="875" y="224">648 radix-six IDs</text>
  <text class="small" x="875" y="252">Exactness is measured, not assumed</text>

  <rect class="box" x="90" y="360" rx="14" width="290" height="155"/>
  <text class="head" x="115" y="397">Structural gate</text>
  <text class="body" x="115" y="434">Frobenius eigenspaces</text>
  <text class="body" x="115" y="464">fiber identity + Fₚ descent</text>
  <text class="small" x="115" y="493">Must pass on every toy point</text>

  <rect class="box test" x="455" y="360" rx="14" width="290" height="155"/>
  <text class="head" x="480" y="397">Statistical gate</text>
  <text class="body" x="480" y="434">one ID exact on 15 rows</text>
  <text class="body" x="480" y="464">366 decoded targets</text>
  <text class="small" x="480" y="493">matched controls + tamper tests</text>

  <rect class="box open" x="820" y="340" rx="14" width="330" height="195"/>
  <text class="head" x="845" y="377">Open cost bridge</text>
  <text class="body" x="845" y="416">Toy producer enumerates Θ(r)</text>
  <text class="body" x="845" y="446">Need uniform rᵒ⁽¹⁾ moment</text>
  <text class="body" x="845" y="476">plus complete decoder cost</text>
  <text class="small" x="845" y="508">No speedup without this proof</text>

  <path class="arrow dash" d="M380 438 L455 438"/>
  <path class="arrow dash" d="M745 438 L820 438"/>
  <text class="small" x="50" y="605">Blue = known/derived algebra · amber = frozen empirical test · red = unresolved algorithmic obligation</text>
</svg>
