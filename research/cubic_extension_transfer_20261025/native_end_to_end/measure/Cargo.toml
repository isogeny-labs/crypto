[package]
name = "cubic-native-measure"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
hex = "0.4"

[profile.release]
debug = false
