<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-labelledby="title desc">
<title id="title">n=83 cubic-cover projector and Prym audit</title>
<desc id="desc">The Jacobian splits into the transported elliptic image and a Prym whose two elliptic factors have order coprime to the target prime and traces different from the source.</desc>
<rect width="1180" height="420" fill="#fff"/>
<style>.box{stroke:#24324a;stroke-width:2;rx:14}.t{font:16px Helvetica,Arial,sans-serif;fill:#172033}.s{font:14px Helvetica,Arial,sans-serif;fill:#34445f}.e{stroke:#40516f;stroke-width:2;fill:none;marker-end:url(#a)}.l{font:14px Helvetica,Arial,sans-serif;fill:#34445f}</style>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#40516f"/></marker></defs>
<text x="590" y="34" text-anchor="middle" class="t" font-weight="700">n=83 cubic-cover projector and Prym audit</text>
<rect class="box" x="35" y="145" width="205" height="105" fill="#dceaff"/><text x="138" y="176" text-anchor="middle" class="t">E / GF(2^83)</text><text x="138" y="202" text-anchor="middle" class="s">#E = 4r</text><text x="138" y="226" text-anchor="middle" class="s">trace = -6151469093347</text>
<rect class="box" x="330" y="145" width="155" height="105" fill="#eef4ff"/><text x="408" y="188" text-anchor="middle" class="t">J(C)</text><text x="408" y="216" text-anchor="middle" class="s">genus 3</text>
<rect class="box" x="575" y="72" width="220" height="88" fill="#dff6e7"/><text x="685" y="105" text-anchor="middle" class="t">elliptic image</text><text x="685" y="133" text-anchor="middle" class="s">p = [3^-1] phi* phi_*</text>
<rect class="box" x="575" y="244" width="220" height="88" fill="#fff0dc"/><text x="685" y="277" text-anchor="middle" class="t">Prym / kernel</text><text x="685" y="305" text-anchor="middle" class="s">P(T) = T^4 + q^2</text>
<rect class="box" x="875" y="190" width="205" height="72" fill="#fff7ea"/><text x="978" y="218" text-anchor="middle" class="t">trace +2^42</text><text x="978" y="244" text-anchor="middle" class="s">gcd(order,r) = 1</text>
<rect class="box" x="875" y="286" width="205" height="72" fill="#fff7ea"/><text x="978" y="314" text-anchor="middle" class="t">trace -2^42</text><text x="978" y="340" text-anchor="middle" class="s">gcd(order,r) = 1</text>
<polygon points="865,70 1090,70 1125,105 1090,140 865,140 830,105" fill="#ffe1e1" stroke="#9f2f35" stroke-width="2"/><text x="978" y="99" text-anchor="middle" class="t">No shared r</text><text x="978" y="124" text-anchor="middle" class="s">No source-isogenous factor</text>
<path class="e" d="M240 175 L330 175"/><text class="l" x="285" y="164" text-anchor="middle">phi*</text>
<path class="e" d="M330 222 L240 222"/><text class="l" x="285" y="243" text-anchor="middle">phi_*</text>
<path class="e" d="M485 174 C525 155 535 121 575 116"/><text class="l" x="526" y="139">p</text>
<path class="e" d="M485 222 C525 242 535 282 575 287"/><text class="l" x="515" y="277">1-p</text>
<path class="e" d="M795 276 L875 234"/><path class="e" d="M795 300 L875 320"/>
<path class="e" d="M978 190 L978 140"/>
</svg>
