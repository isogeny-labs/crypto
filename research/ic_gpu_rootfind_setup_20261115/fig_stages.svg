<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Stages of the device pair-table build on an A100</title>
<desc id="d">Median stage times: at 4096 the copy of the build-index map to the host is 47 ms of about 64 ms; the key kernel 2 ms.</desc>
<style>.bg{fill:#fcfcfb}.c1{fill:#2a78d6}.c2{fill:#86b6ee}.c3{fill:#c3c2b7}.c4{fill:#8f8e89}.c5{fill:#d95f3b}.p{fill:#0b0b0b}.q{fill:#52514e}.g{stroke:#e4e3df}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.c1{fill:#3987e5}.c2{fill:#1f5ea8}.c3{fill:#6b6a64}.c4{fill:#8f8e89}.c5{fill:#e0714f}.p{fill:#f0efec}.q{fill:#c3c2b7}.g{stroke:#383835}}</style>
