<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">R13 shared-host A/A preflight</title>
  <desc id="desc">The frozen controls passed, then five SMT and sixty busy-machine preflight refusals prevented any timed price process.</desc>
  <rect width="1000" height="330" fill="#f7f9fc"/>
  <text x="40" y="42" font-family="sans-serif" font-size="24" font-weight="bold" fill="#172b4d">R13 A/A: controls passed; isolation did not start</text>
  <text x="40" y="70" font-family="sans-serif" font-size="15" fill="#52627a">Shared Xeon 6975P-C · 2026-10-26 · first A/A row · no timed price file</text>
  <rect x="40" y="112" width="200" height="126" rx="12" fill="#e1f3ec" stroke="#2b8a62" stroke-width="2"/>
  <text x="60" y="145" font-family="sans-serif" font-size="19" font-weight="bold" fill="#14543a">Frozen controls</text>
  <text x="60" y="177" font-family="sans-serif" font-size="16" fill="#14543a">24 / 24 holdouts</text>
  <text x="60" y="203" font-family="sans-serif" font-size="16" fill="#14543a">90 / 90 pin rows</text>
  <path d="M 246 175 H 287" stroke="#52627a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="292" y="112" width="190" height="126" rx="12" fill="#fff1dd" stroke="#c47b18" stroke-width="2"/>
  <text x="311" y="145" font-family="sans-serif" font-size="19" font-weight="bold" fill="#704205">SMT correction</text>
  <text x="311" y="177" font-family="sans-serif" font-size="16" fill="#704205">5 topology refusals</text>
  <text x="311" y="203" font-family="sans-serif" font-size="16" fill="#704205">reserve CPUs 2,18</text>
  <path d="M 488 175 H 529" stroke="#52627a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="534" y="112" width="198" height="126" rx="12" fill="#fce7e7" stroke="#bd4343" stroke-width="2"/>
  <text x="552" y="145" font-family="sans-serif" font-size="19" font-weight="bold" fill="#7c2222">Quiet preflight</text>
  <text x="552" y="177" font-family="sans-serif" font-size="16" fill="#7c2222">60 / 60 refused</text>
  <text x="552" y="203" font-family="sans-serif" font-size="16" fill="#7c2222">other CPU above limit</text>
  <path d="M 738 175 H 779" stroke="#52627a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="784" y="112" width="176" height="126" rx="12" fill="#e9edf3" stroke="#52627a" stroke-width="2"/>
  <text x="802" y="145" font-family="sans-serif" font-size="19" font-weight="bold" fill="#172b4d">Timed process</text>
  <text x="802" y="177" font-family="sans-serif" font-size="16" fill="#172b4d">0 price files</text>
  <text x="802" y="203" font-family="sans-serif" font-size="16" fill="#172b4d">runner stopped</text>
  <text x="40" y="288" font-family="sans-serif" font-size="14" fill="#52627a">Source: R13 runs/aa/refusals.log (65 entries), pin/pin.json, aa-return.log. No performance ratio is inferred.</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M 0 0 L 8 5 L 0 10 z" fill="#52627a"/></marker></defs>
</svg>
