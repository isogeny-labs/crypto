<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
  <title id="title">R13 cold base-to-candidate ratios on the second replacement host</title>
  <desc id="desc">The paired suite has 40 pairs at each primary size. The incomplete holdout has 39, 39, and 34 pairs. Points show native geometric ratios and vertical bars show native 95 percent intervals. All intervals are below the preregistered 1.01 lower-bound threshold.</desc>
  <rect width="1100" height="580" fill="#fff"/>
  <text x="90" y="45" font-family="sans-serif" font-size="25" font-weight="bold" fill="#162438">R13 cold single-target comparison</text>
  <text x="90" y="74" font-family="sans-serif" font-size="16" fill="#34485e">Host i-048baef2256adcc25 · 5-round suite and incomplete holdout · 95% native intervals</text>
  <g stroke="#d6dee7" stroke-width="1">
    <path d="M105 110H1000 M105 200H1000 M105 290H1000 M105 380H1000 M105 470H1000"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#314254" text-anchor="end">
    <text x="96" y="115">1.02</text><text x="96" y="205">1.01</text><text x="96" y="295">1.00</text><text x="96" y="385">0.99</text><text x="96" y="475">0.98</text>
  </g>
  <path d="M105 105V470H1000" fill="none" stroke="#53677d" stroke-width="2"/>
  <path d="M105 200H1000" stroke="#a84631" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="995" y="187" font-family="sans-serif" font-size="14" fill="#a84631" text-anchor="end">acceptance: every lower bound &gt; 1.01</text>
  <g stroke="#1b6b91" fill="#1b6b91" stroke-width="3">
    <path d="M215 267V310 M204 267H226 M204 310H226 M515 345V389 M504 345H526 M504 389H526 M815 361V392 M804 361H826 M804 392H826"/>
    <circle cx="215" cy="288" r="7"/><circle cx="515" cy="367" r="7"/><circle cx="815" cy="376" r="7"/>
  </g>
  <g stroke="#7355a2" fill="#7355a2" stroke-width="3">
    <path d="M285 286V316 M274 286H296 M274 316H296 M585 371V394 M574 371H596 M574 394H596 M885 368V416 M874 368H896 M874 416H896"/>
    <rect x="279" y="295" width="12" height="12"/><rect x="579" y="377" width="12" height="12"/><rect x="879" y="386" width="12" height="12"/>
  </g>
  <g font-family="sans-serif" font-size="18" fill="#24364a" text-anchor="middle">
    <text x="250" y="505">K₀ / GF(2³⁷)</text><text x="550" y="505">K₁ / GF(2⁴⁷)</text><text x="850" y="505">K₀ / GF(2⁵⁷)</text>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#34485e">
    <circle cx="250" cy="536" r="6" fill="#1b6b91"/><text x="265" y="541">paired suite, n = 40 each</text>
    <rect x="540" y="530" width="12" height="12" fill="#7355a2"/><text x="560" y="541">holdout, incomplete: n = 39, 39, 34</text>
  </g>
</svg>
