   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(58.49225 180.638765)">Split squarefree f</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(44.524828 194.2101)">original root variable t</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(315.057266 180.638765)">Algorithm 2 lift</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(303.099922 194.2101)">onto E and its twist</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(612.248281 180.638765)">Source ring Fp[t]/u</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(607.050781 194.2101)">state: (u, v, offset C)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(594.742617 279.051578)">For each representative P:</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(638.329102 292.006035)">T = C + P</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(599.936836 304.960492)">g = gcd(u, ψM(S(t) − T))</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(609.192422 317.914949)">child: (g, v mod g, T)</text>
   </g>
