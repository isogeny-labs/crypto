   <g id="text_13">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(30.0501 256.619559)">The setup stopped on an unsupported Git option before any timing row.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(30.0501 270.77077)">The raw archive was hash-checked, uploaded/read back in approved S3, and promoted to CAS.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(30.0501 284.921981)">The pod was deleted with HTTP 204. Separate temporary development-qualifier directories</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(30.0501 299.073192)">were not archived; wrapper outputs and the main benchmark build were retained.</text>
   </g>
