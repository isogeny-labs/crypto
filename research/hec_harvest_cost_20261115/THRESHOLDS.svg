<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='355' viewBox='0 0 1000 355'><rect width='1000' height='355' fill='#f5f8fa'/><g font-family='Arial' fill='#233746'><text x='25' y='35' font-size='23' font-weight='bold'>Overharvest density k = 10: requirements for a 10× model gain</text><text x='25' y='65' font-size='17'>Zero-large-prime model · quadratic algebra · no weight penalty · conditional, not measured</text><text x='25' y='115' font-size='22'>Genus 2</text><text x='180' y='115' font-size='22' fill='#146b7e'>retain ≤ 0.316%</text><text x='490' y='115' font-size='22'>base ×100.00</text><text x='725' y='115' font-size='22'>pool ×1000.00</text><text x='25' y='190' font-size='22'>Genus 3</text><text x='180' y='190' font-size='22' fill='#146b7e'>retain ≤ 3.162%</text><text x='490' y='190' font-size='22'>base ×10.00</text><text x='725' y='190' font-size='22'>pool ×100.00</text><text x='25' y='265' font-size='22'>Genus 4</text><text x='180' y='265' font-size='22' fill='#146b7e'>retain ≤ 6.813%</text><text x='490' y='265' font-size='22'>base ×4.64</text><text x='725' y='265' font-size='22'>pool ×46.42</text><text x='25' y='310' font-size='17'>Pool is relative to the original optimum B₀. All three retain a core of 0.3162 B₀ at equality.</text><text x='25' y='338' font-size='17'>Finite catalogue, collision regime, target rank and omitted costs must be checked separately.</text></g></svg>