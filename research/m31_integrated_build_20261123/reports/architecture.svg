    <text x="58" y="157" font-size="16" fill="#dce7f5">Ordinary PRIME31 relation field n = 2147446831. Full curve identity is mandatory.</text>

    <rect x="36" y="196" width="292" height="70" rx="9" fill="#e2edf9" stroke="#5b86b3"/>
