<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
  <rect width="1000" height="650" fill="#f5f8fc"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#182c43">
    <text x="36" y="49" font-size="29" font-weight="bold">M31 implementation map</text>
    <text x="36" y="78" font-size="17">Three native components. Shared arithmetic; separate completeness contracts.</text>
