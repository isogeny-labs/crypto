    <text x="54" y="248" font-size="16">Public point maps + exact RHS</text>
    <rect x="354" y="196" width="292" height="70" rx="9" fill="#dff1ed" stroke="#4b9384"/>
    <text x="372" y="223" font-size="18" font-weight="bold">Three leaf selectors + Q</text>
    <text x="372" y="248" font-size="16">Monic selectors remain unchanged</text>
    <rect x="672" y="196" width="292" height="70" rx="9" fill="#fff0dc" stroke="#b7803a"/>
    <text x="690" y="223" font-size="18" font-weight="bold">Base, target T, public a,b</text>
    <text x="690" y="248" font-size="16">Construct R = [a]G + [b]T</text>

    <path d="M182 268 V294 M500 268 V294 M818 268 V294" fill="none" stroke="#62768c" stroke-width="2.5"/>
    <path d="M176 286 L182 296 L188 286 M494 286 L500 296 L506 286 M812 286 L818 296 L824 286" fill="none" stroke="#62768c" stroke-width="2.5"/>
    <rect x="36" y="303" width="292" height="101" rx="9" fill="#ffffff" stroke="#5b86b3"/>
    <text x="54" y="330" font-size="18" font-weight="bold">Four fresh graph workers</text>
    <text x="54" y="355" font-size="16">Eager / lazy / pivot / MST</text>
    <text x="54" y="381" font-size="16">Separate H and H-transpose tape</text>
    <rect x="354" y="303" width="292" height="101" rx="9" fill="#ffffff" stroke="#4b9384"/>
    <text x="372" y="330" font-size="18" font-weight="bold">Structured Semaev / F4</text>
    <text x="372" y="355" font-size="16">Expanded S4 or chained S3</text>
    <text x="372" y="381" font-size="16">Cancellation chart + certified NF</text>
    <rect x="672" y="303" width="292" height="101" rx="9" fill="#ffffff" stroke="#b7803a"/>
    <text x="690" y="330" font-size="18" font-weight="bold">RR5 coefficient visitor</text>
    <text x="690" y="355" font-size="16">Quartic roots + signed point lift</text>
    <text x="690" y="381" font-size="16">Point-replayed row callback</text>

    <path d="M182 406 V432 M500 406 V432 M818 406 V432" fill="none" stroke="#62768c" stroke-width="2.5"/>
    <path d="M176 424 L182 434 L188 424 M494 424 L500 434 L506 424 M812 424 L818 434 L824 424" fill="none" stroke="#62768c" stroke-width="2.5"/>
    <rect x="36" y="442" width="292" height="88" rx="9" fill="#e2edf9" stroke="#5b86b3"/>
    <text x="54" y="470" font-size="18" font-weight="bold">Ranks and target outcomes</text>
    <text x="54" y="495" font-size="16">Original-source witness replay</text>
    <text x="54" y="518" font-size="16">Operator-only tape has no solve claim</text>
    <rect x="354" y="442" width="292" height="88" rx="9" fill="#dff1ed" stroke="#4b9384"/>
    <text x="372" y="470" font-size="18" font-weight="bold">Rational signed witnesses</text>
    <text x="372" y="495" font-size="16">Exact certificate + point replay</text>
    <text x="372" y="518" font-size="16">All charts finish before completion</text>
    <rect x="672" y="442" width="292" height="88" rx="9" fill="#fff0dc" stroke="#b7803a"/>
    <text x="690" y="470" font-size="18" font-weight="bold">Existing relation adapter</text>
    <text x="690" y="495" font-size="16">Target functional + [d]G = T</text>
    <text x="690" y="518" font-size="16">Consumer stop remains incomplete</text>

    <text x="36" y="572" font-size="17" font-weight="bold">Evidence contract</text>
    <text x="36" y="599" font-size="16">Retain caps, failures, source hashes and replayable rows. Local tests are unsigned development evidence.</text>
    <text x="36" y="625" font-size="16">No matched performance panel was run. Complete cold-solving cost remains unmeasured.</text>
