[package]
name = "m31-structured-f4"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "lib.rs"

[[bin]]
name = "m31-structured-f4"
path = "main.rs"

[[bin]]
name = "m31-structured-identity-certificate"
path = "identity_certificate.rs"

[dependencies]
crypto_f4 = { package = "rr5-original-f4-closure", path = "../../prime31_four_summand_20261122/native/f4-source" }
prime31-algebraic-ic = { path = "../../prime31_four_summand_20261122/native/original-native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 1
debug = 0
lto = false
codegen-units = 64

[profile.release.package.rr5-original-f4-closure]
opt-level = 0
codegen-units = 256
