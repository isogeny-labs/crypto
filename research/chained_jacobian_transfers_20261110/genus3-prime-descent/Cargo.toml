[package]
name = "ghs-prime-descent"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = ["engine"]

[dependencies]
ghs-original-engines = { path = "engine" }
isogeny_algos = { path = "../../../isogeny_algos" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[lints.clippy]
needless_range_loop = "allow"
type_complexity = "allow"
