<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410">
 <rect width="1120" height="410" fill="#f7f9fc"/>
 <g font-family="DejaVu Sans, sans-serif" text-anchor="middle" fill="#14253a">
  <text x="560" y="34" font-size="24" font-weight="bold">Cancel on the two stated annihilated outputs</text>
  <rect x="35" y="65" width="400" height="104" rx="12" fill="#e0ebff" stroke="#466bad" stroke-width="2"/>
  <text x="235" y="104" font-size="24">X = [4] g(f(x))</text>
  <text x="235" y="144" font-size="20">[r]X = 0</text>
  <rect x="35" y="212" width="400" height="104" rx="12" fill="#e0ebff" stroke="#466bad" stroke-width="2"/>
  <text x="235" y="252" font-size="24">Y = k2(b(a(h0(x))))</text>
  <text x="235" y="292" font-size="20">[r]Y = 0</text>
  <rect x="645" y="65" width="430" height="104" rx="12" fill="#e4f3ee" stroke="#2c8267" stroke-width="2"/>
  <text x="860" y="104" font-size="24">[4]X = [16] g(f(x))</text>
  <text x="860" y="144" font-size="20">old cleared identity</text>
  <rect x="645" y="212" width="430" height="104" rx="12" fill="#e4f3ee" stroke="#2c8267" stroke-width="2"/>
  <text x="860" y="252" font-size="24">[4]Y</text>
  <text x="860" y="292" font-size="20">same point as [4]X</text>
  <path d="M450 115 H625 M450 262 H625" stroke="#466bad" stroke-width="3"/>
  <path d="M625 115 l-12 -7 v14 Z M625 262 l-12 -7 v14 Z" fill="#466bad"/>
  <text x="535" y="99" font-size="21">[4]</text><text x="535" y="247" font-size="21">[4]</text>
  <text x="235" y="197" font-size="24" fill="#2c8267">X = Y</text>
  <text x="860" y="197" font-size="24">=</text>
  <rect x="155" y="340" width="810" height="45" rx="10" fill="#fff0d2" stroke="#a77822"/>
  <text x="560" y="370" font-size="22">4u + vr = 1  ⇒  apply [u] to recover X and Y</text>
 </g>
</svg>
