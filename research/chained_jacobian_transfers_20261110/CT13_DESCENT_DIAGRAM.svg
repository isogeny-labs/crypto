<text x="465" y="218" font-size="16" fill="#754c0c">Frobenius cycles the labels</text>
<text x="465" y="244" font-size="15" fill="#754c0c">two nondegenerate matchings</text>
<rect x="861" y="129" rx="15" width="262" height="133" fill="#ffe7e6" stroke="#b94b43" stroke-width="2"/>
<text x="880" y="160" font-size="20" font-weight="bold" fill="#74302c">Raw support polynomial</text>
