<text x="75" y="190" font-size="18" fill="#193d68">C: y² = x⁶ + 2x² + 2</text>
<text x="75" y="220" font-size="18" fill="#193d68">#J(F17) = 285 (odd)</text>
<text x="75" y="244" font-size="15" fill="#193d68">Elliptic input subgroup: r = 19</text>
