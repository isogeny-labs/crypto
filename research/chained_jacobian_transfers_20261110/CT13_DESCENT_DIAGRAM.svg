<text x="78" y="471" font-size="21" font-weight="bold" fill="#403079">Separate structural obstruction</text>
<text x="78" y="501" font-size="18" fill="#403079">Odd #J(F17) ⇒ no rational 2-torsion; a rational kernel (2,2,4) would force a fixed nonzero 2K.</text>
<text x="78" y="526" font-size="16" fill="#403079">Excludes that double-Richelot type; does not exclude (4,4), extension-field steps, or odd-degree maps.</text>
<text x="56" y="572" font-size="13" fill="#6d7788">Sources: Kunzweiler 2024, Proposition 7/8; Magma Richelot handbook. Scope: public toy example only.</text>
