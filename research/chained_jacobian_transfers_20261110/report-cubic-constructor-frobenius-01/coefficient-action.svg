<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="340" viewBox="0 0 1080 340">
 <rect width="1080" height="340" fill="#f7f9fc"/>
 <g font-family="DejaVu Sans, sans-serif" fill="#14253a" text-anchor="middle">
  <text x="540" y="35" font-size="25" font-weight="bold">Exact coefficient action over Fin223</text>
  <g fill="#e0ebff" stroke="#466bad" stroke-width="2">
   <rect x="45" y="70" width="260" height="95" rx="12"/>
   <rect x="410" y="70" width="260" height="95" rx="12"/>
   <rect x="775" y="70" width="260" height="95" rx="12"/>
  </g>
  <text x="175" y="109" font-size="26">a → a</text>
  <text x="175" y="145" font-size="20">base coefficient</text>
  <text x="540" y="109" font-size="26">b → 183b</text>
  <text x="540" y="145" font-size="20">183³ = 1, 183 ≠ 1</text>
  <text x="905" y="109" font-size="26">c → 39c</text>
  <text x="905" y="145" font-size="20">39³ = 1, 39 ≠ 1</text>
  <rect x="110" y="200" width="860" height="98" rx="12" fill="#e4f3ee" stroke="#2c8267" stroke-width="2"/>
  <text x="540" y="240" font-size="25">Third iterate: identity</text>
  <text x="540" y="278" font-size="25">Fixed vectors: exactly (a,0,0)</text>
  <text x="540" y="328" font-size="18">The operator is stated explicitly; full field/native correspondence remains separate.</text>
 </g>
</svg>
