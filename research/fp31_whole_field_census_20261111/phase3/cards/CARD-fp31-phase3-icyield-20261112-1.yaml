notes: >-
  Local route at isolation L1, a deviation recorded in PROTOCOL.md section 7 (no AWS identity; the EKS dispatch
  accepts only ecbench specs from main). CHECKPOINT_SKIP is set because the checkpoint hook would otherwise refuse
  ecbench launchers until a resume checkpoint is pushed to S3, which needs AWS. The benchmark record is
  benchmarks/records/20261112T0103Z-fp31-ic-yield-across-classes.json. The first command (96 cells: 48 classes times
  m in 3 and 2, estimated 1.6 h) runs detached and the tool exits 4; run `python3 tools/task_card.py wait` on this
  card and repeat it for as long as it exits 4. run_phase3.sh exits 0 even when a cell prints FAILED; the script
  prints one line per cell, beginning with ok, skip or FAILED, and a FAILED cell is recorded and not retried
  (PROTOCOL.md section 4). The three binaries are untracked build outputs bound by sha256 only.
