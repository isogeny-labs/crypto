notes: >-
  Local route (PROTOCOL.md section 7: no AWS identity), isolation L2; ecbench refuses L2 runs on a busy host and grades
  each row. Nothing else may run on the host during this card (PROTOCOL.md section 4). CHECKPOINT_SKIP is set because
  the checkpoint hook would otherwise refuse ecbench launchers until a resume checkpoint is pushed to S3, which needs
  AWS. The benchmark record is benchmarks/records/20261112T0419Z-fp31-per-curve-cost-randomised.json. The first command
  (48 classes x 16 sessions, estimated 3.6 h) runs detached and the tool exits 4; run `python3 tools/task_card.py wait`
  on this card and repeat it for as long as it exits 4. run_phase5.sh exits 0 even when a session prints FAILED; the
  script prints one line per session, beginning with ok, skip or FAILED, and a FAILED session is recorded as missing
  and not retried or replaced (PROTOCOL.md section 4). The two binaries are untracked build outputs bound by sha256 only.
