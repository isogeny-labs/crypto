<svg xmlns="http://www.w3.org/2000/svg" width="500" height="142" viewBox="0 0 500 142">
<rect x="0" y="6" width="500" height="40" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="25" font-size="8.3" font-family="DejaVu Sans,sans-serif">Derived permutation</text>
<text x="128" y="21" font-size="8" font-family="DejaVu Sans,sans-serif">q mod3=2; e=(2q−1)/3; 3e=2(q−1)+1</text>
<text x="128" y="37" font-size="8" font-family="DejaVu Sans,sans-serif">Actual cube inverse x^e, including x=0</text>
<rect x="0" y="52" width="500" height="40" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="71" font-size="8.3" font-family="DejaVu Sans,sans-serif">Actual point count</text>
<text x="128" y="67" font-size="8" font-family="DejaVu Sans,sans-serif">E_b: y²=x³+b, char≠2,3 and b≠0</text>
<text x="128" y="83" font-size="8" font-family="DejaVu Sans,sans-serif">E_b.Point ≃ Option K; #E_b=q+1; trace0</text>
<rect x="0" y="98" width="500" height="40" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="117" font-size="8.3" font-family="DejaVu Sans,sans-serif">Actual point orders</text>
<text x="128" y="113" font-size="8" font-family="DejaVu Sans,sans-serif">Every divisor r&gt;2 of #E_b has ord_r(q)=2</text>
<text x="128" y="129" font-size="8" font-family="DejaVu Sans,sans-serif">Lagrange derives the result for each actual point order</text>
</svg>
