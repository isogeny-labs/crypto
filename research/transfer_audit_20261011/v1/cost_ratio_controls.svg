<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="364" viewBox="0 0 1100 364" font-family="Helvetica, Arial, sans-serif" font-size="11">
<title>Positive controls: registered pairing-friendly curves (mnt/mnt1 k = 3, BLS12-381 k = 12)</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="24" font-size="15" font-weight="bold" fill="#111">Positive controls: registered pairing-friendly curves (mnt/mnt1 k = 3, BLS12-381 k = 12)</text>
<text x="16" y="42" fill="#444">the pairing route is the intended attack on these; the verdict machinery must be able to say so</text>
<rect x="16" y="52" width="10" height="10" fill="#0072B2"/><text x="30" y="61" fill="#222">Weil/GHS</text>
<rect x="116" y="52" width="10" height="10" fill="#009E73"/><text x="130" y="61" fill="#222">isogeny</text>
<rect x="216" y="52" width="10" height="10" fill="#D55E00"/><text x="230" y="61" fill="#222">genus-g cover</text>
<rect x="316" y="52" width="10" height="10" fill="#CC79A7"/><text x="330" y="61" fill="#222">pairing</text>
<circle cx="21.0" cy="78.0" r="4.5" fill="#444444" stroke="#444444"/><text x="30" y="82" fill="#222">map executed, subgroup verified</text>
<path d="M221.0 72.5 L226.5 78.0 L221.0 83.5 L215.5 78.0 Z" fill="#ffffff" stroke="#444444" stroke-width="1.8"/><text x="230" y="82" fill="#222">arithmetic argument, not executed</text>
<circle cx="421.0" cy="78.0" r="4.5" fill="#ffffff" stroke="#444444" stroke-width="1.8"/><text x="430" y="82" fill="#222">subgroup not evaluated</text>
<text x="616" y="82" fill="#222">no marker: route does not carry the subgroup</text>
<line x1="330.0" y1="110.0" x2="330.0" y2="290.0" stroke="#e2e2e2"/><text x="330.0" y="304.0" text-anchor="middle" fill="#444">-20</text>
<line x1="650.0" y1="110.0" x2="650.0" y2="290.0" stroke="#e2e2e2"/><text x="650.0" y="304.0" text-anchor="middle" fill="#444">0</text>
<line x1="970.0" y1="110.0" x2="970.0" y2="290.0" stroke="#e2e2e2"/><text x="970.0" y="304.0" text-anchor="middle" fill="#444">20</text>
<rect x="330.0" y="110.0" width="320.0" height="180.0" fill="#fff3e0"/>
<line x1="650.0" y1="108.0" x2="650.0" y2="290.0" stroke="#b00020" stroke-width="1.5"/>
<text x="650.0" y="102.0" text-anchor="middle" fill="#b00020" font-weight="bold">parity with the matched rho</text>
<text x="650.0" y="322.0" text-anchor="middle" fill="#222">log2( route cost / matched rho cost )   (right of the red line: the route costs more than rho)</text>
