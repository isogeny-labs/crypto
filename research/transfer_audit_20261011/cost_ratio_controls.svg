<title>Pairing-friendly controls: positive (mnt/mnt1 k = 3, BLS12-381 k = 12) and boundary (BN254, BN318, BLS12-638, BN350, BN446)</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="24" font-size="15" font-weight="bold" fill="#111">Pairing-friendly controls: positive (mnt/mnt1 k = 3, BLS12-381 k = 12) and boundary (BN254, BN318, BLS12-638, BN350, BN446)</text>
<text x="16" y="42" fill="#444">the pairing route is the intended attack on mnt/mnt1; the boundary curves sit on both sides of the 8-bit margin; relative to rho on E, not absolute security</text>
