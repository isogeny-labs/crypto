<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title>transfer-audit pipeline</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#444"/></marker></defs>
<text x="16" y="24" font-size="15" font-weight="bold" fill="#111">transfer-audit: from a curve to a certified, priced verdict</text>
<text x="16" y="42" fill="#444">counts are subgroup-preservation statuses over the audited curves in this run (toys included); every box is a module of src/bin/transfer_audit/</text>
<rect x="16" y="70" width="210" height="86" rx="6" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
<text x="26" y="90" font-weight="bold" fill="#111">1. curve + generator + r</text>
<text x="26" y="108" fill="#333" font-size="11">registry (ICV1 slug) or toy spec</text>
<text x="26" y="122" fill="#333" font-size="11">spec.rs: validate; else INVALID_INSTANCE</text>
<text x="26" y="136" fill="#333" font-size="11">field, curve, [r]G = O, r prime</text>
<line x1="226" y1="113" x2="262" y2="113" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="262" y="70" width="330" height="86" rx="6" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
<text x="272" y="90" font-weight="bold" fill="#111">2. repository traits + baseline</text>
<text x="272" y="108" fill="#333" font-size="11">curve_traits::compute: Δ, d_K, conductor,</text>
<text x="272" y="122" fill="#333" font-size="11">volcano levels, subfield, embedding degree</text>
<text x="272" y="136" fill="#333" font-size="11">matched rho: sqrt(pi r/(2c)), c = class size (negation incl.)</text>
<rect x="262" y="190" width="330" height="54" rx="6" fill="#ffffff" stroke="#0072B2" stroke-width="1.5"/>
<text x="272" y="210" font-weight="bold" fill="#111">A. Weil/GHS descent</text>
<text x="272" y="228" fill="#333" font-size="11">ghs.rs: per divisor l of n; trace executed</text>
<text x="272" y="242" fill="#333" font-size="11">verified 1 | arithmetic 0 | refuted 13 | other 15</text>
<line x1="427" y1="156" x2="427" y2="190" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="262" y="252" width="330" height="54" rx="6" fill="#ffffff" stroke="#009E73" stroke-width="1.5"/>
<text x="272" y="272" font-weight="bold" fill="#111">B. isogeny moves</text>
<text x="272" y="290" fill="#333" font-size="11">isogeny.rs: invariants, volcano, GHS extension</text>
<text x="272" y="304" fill="#333" font-size="11">verified 1 | arithmetic 17 | refuted 0 | other 2</text>
<line x1="427" y1="244" x2="427" y2="252" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="262" y="314" width="330" height="54" rx="6" fill="#ffffff" stroke="#D55E00" stroke-width="1.5"/>
<text x="272" y="334" font-weight="bold" fill="#111">C. genus-g covers</text>
<text x="272" y="352" fill="#333" font-size="11">cover.rs: g=3 binary executed; g=2..8 priced</text>
<text x="272" y="366" fill="#333" font-size="11">verified 8 | arithmetic 9 | refuted 0 | other 17</text>
<line x1="427" y1="306" x2="427" y2="314" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="262" y="376" width="330" height="54" rx="6" fill="#ffffff" stroke="#CC79A7" stroke-width="1.5"/>
<text x="272" y="396" font-weight="bold" fill="#111">D. pairing</text>
<text x="272" y="414" fill="#333" font-size="11">pairing.rs: embedding degree, L[1/3] price</text>
<text x="272" y="428" fill="#333" font-size="11">verified 0 | arithmetic 17 | refuted 0 | other 0</text>
<line x1="427" y1="368" x2="427" y2="376" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="592" y1="300" x2="640" y2="300" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="640" y="190" width="524" height="240" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
<text x="650" y="210" font-weight="bold" fill="#111">3. certificate per candidate (certificate.rs)</text>
<text x="650" y="228" fill="#333" font-size="11">map: type, degrees, field, executed | arithmetic, not executed | not evaluated</text>
<text x="650" y="242" fill="#333" font-size="11">subgroup preservation (subgroup.rs): verified | arithmetic |</text>
<text x="650" y="256" fill="#333" font-size="11">  not_evaluated | refuted; image order r; kernel ∩ &lt;G&gt; = 1;</text>
<text x="650" y="270" fill="#333" font-size="11">  additivity and scalar equivariance on seeded samples</text>
<text x="650" y="284" fill="#333" font-size="11">cost (cost.rs, frozen CostModel): map construction, transfer</text>
<text x="650" y="298" fill="#333" font-size="11">  evaluation, relation collection, linear algebra, descent/</text>
<text x="650" y="312" fill="#333" font-size="11">  back-mapping; measured | modeled | not_evaluated per cell</text>
<text x="650" y="326" fill="#333" font-size="11">verdict (verdict.rs): class-weak | weak representative exists |</text>
<text x="650" y="340" fill="#333" font-size="11">  source-transfer-weak | implementation-weak | no weakness</text>
<text x="650" y="354" fill="#333" font-size="11">  found in scope; formula leads recorded, never promoted</text>
<text x="650" y="368" fill="#333" font-size="11">evaluation: evaluated | excluded | not evaluable (a field,</text>
<text x="650" y="382" fill="#333" font-size="11">  not a verdict label); margin 8 bits before a weakness verdict</text>
<text x="650" y="396" fill="#333" font-size="11">open obligations; references</text>
<rect x="640" y="70" width="524" height="86" rx="6" fill="#fff8e1" stroke="#b58900" stroke-width="1.5"/>
<text x="650" y="90" font-weight="bold" fill="#111">controls (controls.rs)</text>
<text x="650" y="108" fill="#333" font-size="11">F10 synthetic formula advantage is flagged</text>
<text x="650" y="122" fill="#333" font-size="11">F6 subfield subgroup survives the trace</text>
<text x="650" y="136" fill="#333" font-size="11">F9 measured IC vs rho in odd characteristic</text>
<line x1="902" y1="156" x2="902" y2="190" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
