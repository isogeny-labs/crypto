[package]
name = "p3h"
version = "0.1.0"
edition = "2021"
description = "P3 harness: ECC2K-130 isogeny-class IC yield / Dreg (research/isogeny_class_ic_yield_20261102)"
publish = false

# Detached from the repository workspace: a standalone package that depends on the
# repository library by path.  Build with CARGO_TARGET_DIR=<repo>/target so the
# library build is shared with the repository's own targets.
[workspace]

[[bin]]
name = "p3h"
path = "src/main.rs"

[dependencies]
crypto = { path = "../../../.." }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
sha2 = { version = "0.10", features = ["compress"] }
num-bigint = "0.4"
num-traits = "0.2"
rayon = "1.10"
