<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230"><rect width="1000" height="230" fill="#f7fafc"/><g font-family="Arial" fill="#233746"><text x="20" y="32" font-size="23" font-weight="bold">Direct base-field Smith route: all six archived genus-3 curves</text><rect x="25" y="65" width="280" height="95" rx="6" fill="#e3edf3"/><text x="45" y="99" font-size="23">6 fixed input curves</text><text x="45" y="132" font-size="17">All retained; no replacement</text><text x="325" y="123" font-size="28">→</text><rect x="370" y="65" width="270" height="95" rx="6" fill="#e3edf3"/><text x="390" y="99" font-size="23">2 tractable kernels</text><text x="390" y="132" font-size="17">p127/f1 and p1009/f1</text><text x="660" y="123" font-size="28">→</text><rect x="705" y="65" width="270" height="95" rx="6" fill="#f4e6e2"/><text x="725" y="99" font-size="23">0 rational maps</text><text x="725" y="132" font-size="17">Both discriminants nonsquare</text><text x="25" y="192" font-size="18">Controls: 64 wedge reconstructions and three planted cubic maps pass.</text><text x="25" y="218" font-size="16">No real map constructed. Other kernels and quadratic descent are outside this exclusion.</text></g></svg>
