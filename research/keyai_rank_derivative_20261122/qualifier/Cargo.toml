[package]
name = "keyai-rank-derivative-qualifier"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
autobins = false
autoexamples = false
autotests = false
autobenches = false

# A declared actual-source closure, separate from the root-library gate.
[workspace]

[lib]
name = "crypto_lib"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "keyai-rank-derivative-controls"
path = "../../../examples/keyai_rank_derivative_controls.rs"
test = true
bench = false

[[bin]]
name = "keyai-rank-derivative-source-manifest"
path = "src/source_manifest.rs"
test = false
bench = false

[[test]]
name = "adversarial"
path = "src/adversarial.rs"

[[test]]
name = "support-module-tests"
path = "src/support_module_tests.rs"

[dependencies]
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }

[build-dependencies]
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10"

# Correctness only. Build time and operation counters from this profile are
# not comparative performance evidence.
[profile.release]
debug = 0
lto = false

[profile.release.package.keyai-rank-derivative-qualifier]
opt-level = 0
codegen-units = 256
