<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
<rect width="800" height="400" fill="white"/>
<text x="35" y="35" font-family="sans-serif" font-size="21">Weighted-to-affine coefficient exponents</text>
<text x="35" y="59" font-family="sans-serif" font-size="13">Pinned author Magma and Rust use W² in N6; W¹ is a synthetic mutation.</text>
<path d="M100 325 H755 M100 85 V325" stroke="#555" stroke-width="2" fill="none"/>
<text x="30" y="95" font-family="sans-serif" font-size="13">w exponent</text>
<path d="M100 325 H755" stroke="#e5e5e5"/>
<text x="80" y="330" font-family="sans-serif" font-size="13">0</text>
<path d="M100 255 H755" stroke="#e5e5e5"/>
<text x="80" y="260" font-family="sans-serif" font-size="13">1</text>
<path d="M100 185 H755" stroke="#e5e5e5"/>
<text x="80" y="190" font-family="sans-serif" font-size="13">2</text>
<path d="M100 115 H755" stroke="#e5e5e5"/>
<text x="80" y="120" font-family="sans-serif" font-size="13">3</text>
<rect x="162" y="115" width="76" height="210" fill="#31688e"/>
<text x="176" y="106" font-family="sans-serif" font-size="15">z^11w^3</text>
<text x="194" y="348" font-family="sans-serif" font-size="16">A</text>
<rect x="382" y="185" width="76" height="140" fill="#31688e"/>
<text x="396" y="176" font-family="sans-serif" font-size="15">z^10w^2</text>
<text x="414" y="348" font-family="sans-serif" font-size="16">B</text>
<rect x="602" y="115" width="76" height="210" fill="#31688e"/>
<text x="616" y="106" font-family="sans-serif" font-size="15">z^9w^3</text>
<text x="634" y="348" font-family="sans-serif" font-size="16">C</text>
<text x="35" y="382" font-family="sans-serif" font-size="12">Formal polynomial reductions over every commutative ring; no compiled-code or Pic⁰ claim.</text>
</svg>
