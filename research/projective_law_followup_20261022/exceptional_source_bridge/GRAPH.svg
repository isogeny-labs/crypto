<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="F17 2-torsion exceptional dispatch witness">
  <rect width="900" height="340" fill="#fff"/>
  <text x="40" y="38" font-family="sans-serif" font-size="23" fill="#182638">F17 2-torsion: public dispatch and direct doubling</text>
  <text x="40" y="65" font-family="sans-serif" font-size="14" fill="#526171">u=x²+6x+5, v=0; both source hashes pinned</text>
  <text x="40" y="110" font-family="sans-serif" font-size="16" fill="#182638">Public dispatch</text>
  <rect x="205" y="83" width="270" height="60" rx="8" fill="#dcecf6" stroke="#39749a"/>
  <text x="225" y="108" font-family="sans-serif" font-size="15">Author: inverse before double</text>
  <text x="225" y="130" font-family="sans-serif" font-size="15">Rust: same_u_inverse</text>
  <path d="M475 113h52" stroke="#39749a" stroke-width="2"/>
  <polygon points="527,108 538,113 527,118" fill="#39749a"/>
  <rect x="538" y="83" width="285" height="60" rx="8" fill="#d9f0e2" stroke="#35815a"/>
  <text x="556" y="108" font-family="sans-serif" font-size="15">Both return Identity</text>
  <text x="556" y="130" font-family="sans-serif" font-size="15">Cantor returns Identity</text>
  <text x="40" y="205" font-family="sans-serif" font-size="16" fill="#182638">Direct subroutine</text>
  <rect x="205" y="178" width="270" height="66" rx="8" fill="#f5e8d9" stroke="#a8662c"/>
  <text x="225" y="205" font-family="sans-serif" font-size="15">Author DBL2B0:</text>
  <text x="225" y="228" font-family="sans-serif" font-size="15">(Q,R,S,T,Z,W)=(0,0,0,0,0,0)</text>
  <path d="M475 211h52" stroke="#a8662c" stroke-width="2"/>
  <polygon points="527,206 538,211 527,216" fill="#a8662c"/>
  <rect x="538" y="178" width="285" height="66" rx="8" fill="#f9e2df" stroke="#b05042"/>
  <text x="556" y="204" font-family="sans-serif" font-size="15">Invalid weighted divisor</text>
  <text x="556" y="227" font-family="sans-serif" font-size="15">Z=0 and W=0</text>
  <text x="205" y="276" font-family="sans-serif" font-size="14" fill="#526171">This direct author path is unreachable for the fixture through ADDDIVISOR.</text>
  <text x="205" y="303" font-family="sans-serif" font-size="14" fill="#526171">One finite input; no cost or universal correctness claim.</text>
</svg>
