<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
<title id="title">Two-chart glued scheme proof gates</title>
<desc id="desc">The two-chart datum, glued scheme, and chart cover are checked. Projective completion and subsequent bridges remain open.</desc>
<rect width="900" height="400" fill="#fff"/>
<text x="32" y="40" font-family="sans-serif" font-size="23" fill="#172554">Two-chart glued scheme</text>
<rect x="35" y="65" width="540" height="37" fill="#dcfce7"/><text x="48" y="90" font-family="sans-serif" font-size="16">Separate charts and inverse overlap transition</text>
<rect x="35" y="109" width="540" height="37" fill="#dcfce7"/><text x="48" y="134" font-family="sans-serif" font-size="16">Bool-indexed GlueData and glued scheme</text>
<rect x="35" y="153" width="540" height="37" fill="#dcfce7"/><text x="48" y="178" font-family="sans-serif" font-size="16">Open chart maps; jointly covering</text>
<path d="M 305 198 L 305 220" stroke="#64748b" stroke-width="2"/>
<rect x="35" y="225" width="540" height="37" fill="#fef3c7"/><text x="48" y="250" font-family="sans-serif" font-size="16">Chosen smooth projective completion: open</text>
<rect x="35" y="269" width="540" height="37" fill="#fef3c7"/><text x="48" y="294" font-family="sans-serif" font-size="16">Infinity stalk and Pic⁰ transport: open</text>
<rect x="35" y="313" width="540" height="37" fill="#fef3c7"/><text x="48" y="338" font-family="sans-serif" font-size="16">Rust semantics, rho cost: open / unmeasured</text>
<text x="615" y="93" font-family="sans-serif" font-size="14" fill="#166534">formal construction checked</text>
<text x="615" y="253" font-family="sans-serif" font-size="14" fill="#92400e">external identification open</text>
</svg>
