<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Verified implication graph for the explicit infinity chart, with remaining projective and Picard bridges shown separately">
  <rect width="900" height="330" fill="#fff"/>
  <style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#182331}.h{font-size:20px;font-weight:bold}.b{font-size:15px}.s{font-size:13px}.ok{fill:#e2f1eb;stroke:#32765a;stroke-width:2}.open{fill:#fff2df;stroke:#ad7628;stroke-width:2}.arrow{stroke:#4d5965;stroke-width:2;fill:none;marker-end:url(#head)}</style>
  <defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#4d5965"/></marker></defs>
  <text x="30" y="35" class="h">Explicit infinity-chart point and remaining bridges</text>
  <rect x="30" y="69" width="250" height="76" rx="9" class="ok"/>
  <text x="47" y="96" class="b">w² = z·u in chart quotient</text>
  <text x="47" y="119" class="s">z in prime ⇒ w in prime</text>
  <path d="M280 107 H324" class="arrow"/>
  <rect x="325" y="69" width="250" height="76" rx="9" class="ok"/>
  <text x="342" y="96" class="b">Prime equals origin (z,w)</text>
  <text x="342" y="119" class="s">maximal-origin proof</text>
  <path d="M575 107 H619" class="arrow"/>
  <rect x="620" y="69" width="250" height="76" rx="9" class="ok"/>
  <text x="637" y="96" class="b">Chart complement of D(z)</text>
  <text x="637" y="119" class="s">exactly one point</text>
  <path d="M745 145 V188" class="arrow"/>
  <rect x="455" y="190" width="415" height="57" rx="9" class="open"/>
  <text x="472" y="216" class="b">Identify glued curve with weighted Proj</text>
  <text x="472" y="237" class="s">open: graded chart and overlap isomorphisms</text>
  <path d="M455 219 H414" class="arrow"/>
  <rect x="30" y="190" width="382" height="57" rx="9" class="open"/>
  <text x="47" y="216" class="b">Principal divisor and Pic⁰ transport</text>
  <text x="47" y="237" class="s">open: orders, class map, returned Mumford pair</text>
  <text x="30" y="294" class="s">Green: pinned Lean proof, standard foundations only. Amber: unproved geometric and group-law obligations.</text>
</svg>
