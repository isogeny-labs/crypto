<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250">
<rect width="640" height="250" fill="white"/>
<text x="24" y="30" font-family="sans-serif" font-size="18" fill="#222">Conditional fraction-field valuation</text>
<text x="24" y="59" font-family="sans-serif" font-size="12" fill="#444">Given w² = z·u, v(u) = 1, z³·g = G, and w ≠ 0</text>
<line x1="204" y1="95" x2="204" y2="205" stroke="#666" stroke-width="1"/>
<text x="24" y="116" font-family="sans-serif" font-size="13" fill="#222">v(G) = 1</text>
<rect x="204" y="100" width="360" height="22" fill="#325d88"/>
<text x="570" y="116" font-family="sans-serif" font-size="13" fill="#222">6</text>
<text x="24" y="177" font-family="sans-serif" font-size="13" fill="#222">v(G) = v(w)</text>
<rect x="204" y="161" width="300" height="22" fill="#608eaf"/>
<text x="510" y="177" font-family="sans-serif" font-size="13" fill="#222">5</text>
<text x="24" y="225" font-family="sans-serif" font-size="11" fill="#555">Bar length: exponent of v(w) inverse in v(g); no rho cost measurement.</text>
</svg>
