<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<title id="title">Conditional simple-branch zero-order proof</title>
<desc id="desc">At a simple branch, y squared equals x minus a times a unit q and ord y is one. If N equals x minus a times t and B is a unit, then N minus B y equals y times y q inverse t minus B. The second factor is a unit, giving order one. Global Pic zero and Rust semantics remain open.</desc>
<rect width="900" height="330" fill="#f8fafc"/>
<text x="30" y="38" font-family="sans-serif" font-size="22" font-weight="bold" fill="#14243a">Simple-branch zero order: checked under explicit hypotheses</text>
<rect x="28" y="65" width="250" height="120" rx="10" fill="#dceefc" stroke="#426b91"/>
<text x="43" y="92" font-family="sans-serif" font-size="16" fill="#14243a">Existing local-stalk facts</text>
<text x="43" y="122" font-family="sans-serif" font-size="17" fill="#14243a">y² = (x − a)q</text>
<text x="43" y="150" font-family="sans-serif" font-size="16" fill="#14243a">q unit; ord(y) = 1</text>
<path d="M278 125 H323" stroke="#426b91" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="326" y="65" width="250" height="120" rx="10" fill="#dceefc" stroke="#426b91"/>
<text x="342" y="92" font-family="sans-serif" font-size="16" fill="#14243a">Explicit inputs</text>
<text x="342" y="122" font-family="sans-serif" font-size="17" fill="#14243a">N = (x − a)t</text>
<text x="342" y="150" font-family="sans-serif" font-size="16" fill="#14243a">B unit</text>
<path d="M576 125 H621" stroke="#426b91" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="624" y="65" width="248" height="120" rx="10" fill="#c8f0db" stroke="#26704b"/>
<text x="640" y="92" font-family="sans-serif" font-size="16" fill="#14243a">Checked conclusion</text>
<text x="640" y="122" font-family="sans-serif" font-size="17" fill="#14243a">ord(N − By) = 1</text>
<text x="640" y="150" font-family="sans-serif" font-size="14" fill="#14243a">Lean theorem, standard axioms</text>
<rect x="28" y="215" width="844" height="82" rx="10" fill="#fff0d8" stroke="#ad7a22"/>
<text x="43" y="246" font-family="sans-serif" font-size="16" fill="#573b10">Still open: prove the factorization for every applicable law numerator;</text>
<text x="43" y="274" font-family="sans-serif" font-size="16" fill="#573b10">global divisor/Pic^0 class equation; compiled Rust exceptional-branch semantics.</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#426b91"/></marker></defs>
</svg>
