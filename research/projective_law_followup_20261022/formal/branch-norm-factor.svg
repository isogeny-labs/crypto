<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 320" role="img" aria-labelledby="title desc">
<title id="title">Branch factor forced by a norm identity and transported to weighted Proj</title>
<desc id="desc">At a rational branch root of f that is also a root of the norm support product, a checked polynomial norm identity forces the numerator polynomial to be divisible by X minus a. Checked projective evaluation transports this to the actual weighted-Proj stalk. Runtime and global divisor-class links remain open.</desc>
<rect width="930" height="320" fill="#f8fafc"/>
<text x="28" y="38" font-family="sans-serif" font-size="21" font-weight="bold" fill="#14243a">Branch root: norm factor transported to weighted Proj</text>
<rect x="25" y="68" width="255" height="125" rx="10" fill="#dceefc" stroke="#426b91"/>
<text x="42" y="96" font-family="sans-serif" font-size="16" fill="#14243a">Norm identity</text>
<text x="42" y="127" font-family="sans-serif" font-size="15" fill="#14243a">n² − u1 u2 U = b²f</text>
<text x="42" y="157" font-family="sans-serif" font-size="15" fill="#14243a">in K[X]</text>
<path d="M280 130 H326" stroke="#426b91" stroke-width="3"/><path d="M326 130 L316 124 L316 136 Z" fill="#426b91"/>
<rect x="330" y="68" width="265" height="125" rx="10" fill="#dceefc" stroke="#426b91"/>
<text x="347" y="96" font-family="sans-serif" font-size="16" fill="#14243a">Rational branch support root</text>
<text x="347" y="127" font-family="sans-serif" font-size="15" fill="#14243a">f(a) = 0</text>
<text x="347" y="157" font-family="sans-serif" font-size="15" fill="#14243a">u1(a) u2(a) U(a) = 0</text>
<path d="M595 130 H641" stroke="#426b91" stroke-width="3"/><path d="M641 130 L631 124 L631 136 Z" fill="#426b91"/>
<rect x="645" y="68" width="260" height="125" rx="10" fill="#c8f0db" stroke="#26704b"/>
<text x="662" y="96" font-family="sans-serif" font-size="16" fill="#14243a">Checked transport</text>
<text x="662" y="127" font-family="sans-serif" font-size="15" fill="#14243a">(X − a) divides n</text>
<text x="662" y="157" font-family="sans-serif" font-size="15" fill="#14243a">n(x) = (x − a)t in Proj stalk</text>
<rect x="25" y="220" width="880" height="75" rx="10" fill="#fff0d8" stroke="#ad7a22"/>
<text x="42" y="250" font-family="sans-serif" font-size="16" fill="#573b10">Open: compiled-numerator bridge and B unit; global divisor/Pic^0 equation.</text>
<text x="42" y="277" font-family="sans-serif" font-size="16" fill="#573b10">No 1,260-target or matched-rho cost row changes.</text>
</svg>
