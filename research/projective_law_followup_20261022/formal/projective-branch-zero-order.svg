<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 320" role="img" aria-labelledby="title desc">
<title id="title">Conditional zero order at an actual projective branch</title>
<desc id="desc">At a rational simple branch, the checked actual weighted-Proj stalk is a DVR with y of order one and x minus a of order two. If N equals x minus a times t and B is a unit, the checked order of N minus B y is one. Runtime factorization and global divisor-class equation remain open.</desc>
<rect width="930" height="320" fill="#f8fafc"/>
<text x="28" y="38" font-family="sans-serif" font-size="21" font-weight="bold" fill="#14243a">Actual projective branch: conditional numerator zero order</text>
<rect x="25" y="68" width="255" height="125" rx="10" fill="#dceefc" stroke="#426b91"/>
<text x="42" y="96" font-family="sans-serif" font-size="16" fill="#14243a">Checked local geometry</text>
<text x="42" y="127" font-family="sans-serif" font-size="15" fill="#14243a">R is a DVR; ord(y) = 1</text>
<text x="42" y="157" font-family="sans-serif" font-size="15" fill="#14243a">y² = (x − a)q; q unit</text>
<path d="M280 130 H326" stroke="#426b91" stroke-width="3"/><path d="M326 130 L316 124 L316 136 Z" fill="#426b91"/>
<rect x="330" y="68" width="265" height="125" rx="10" fill="#dceefc" stroke="#426b91"/>
<text x="347" y="96" font-family="sans-serif" font-size="16" fill="#14243a">Actual quintic + source 2+2</text>
<text x="347" y="127" font-family="sans-serif" font-size="15" fill="#14243a">valid inputs + support root</text>
<text x="347" y="157" font-family="sans-serif" font-size="15" fill="#14243a">norm identity; b ≠ 0</text>
<path d="M595 130 H641" stroke="#426b91" stroke-width="3"/><path d="M641 130 L631 124 L631 136 Z" fill="#426b91"/>
<rect x="645" y="68" width="260" height="125" rx="10" fill="#c8f0db" stroke="#26704b"/>
<text x="662" y="96" font-family="sans-serif" font-size="16" fill="#14243a">Checked conclusion</text>
<text x="662" y="137" font-family="sans-serif" font-size="18" fill="#14243a">ord(N − B y) = 1</text>
<rect x="25" y="220" width="880" height="75" rx="10" fill="#fff0d8" stroke="#ad7a22"/>
<text x="42" y="250" font-family="sans-serif" font-size="16" fill="#573b10">Open: compiled numerator and B hypotheses; global divisor/Pic^0 equation;</text>
<text x="42" y="277" font-family="sans-serif" font-size="16" fill="#573b10">universal Rust semantics. No target or cost change.</text>
</svg>
