<rect class="checked" x="30" y="200" rx="7" width="260" height="70"/><text x="48" y="230">Affine chart domain</text><text class="small" x="48" y="254">checked; q separable</text>
<rect class="checked" x="30" y="310" rx="7" width="260" height="70"/><text x="48" y="340">Two-open Proj cover</text><text class="small" x="48" y="364">checked previously</text>
