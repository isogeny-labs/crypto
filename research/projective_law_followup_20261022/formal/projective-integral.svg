<rect width="1000" height="520" fill="#fff"/>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#17212b;font-size:16px}.small{font-size:13px}.checked{fill:#d8e9f7;stroke:#3778a8;stroke-width:2}.open{fill:#f2f2f2;stroke:#777;stroke-width:2}.edge{stroke:#5b6470;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6470"/></marker></defs>
