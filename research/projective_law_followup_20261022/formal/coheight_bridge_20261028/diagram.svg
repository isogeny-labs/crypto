<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="205" viewBox="0 0 1100 205" role="img" aria-label="Quadratic-support proof boundary">
  <rect width="1100" height="205" fill="white"/>
  <style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#18243a} .box{stroke:#64748b;stroke-width:1.5} .open{fill:#fef3c7} .conditional{fill:#dbeafe} .given,.proved{fill:#dcfce7} .arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker></defs>
  <text x="18" y="27" font-size="18" font-weight="bold">Irreducible support: local-ring and divisor proof boundaries</text>
  <rect class="box given" x="18" y="65" width="155" height="78" rx="8"/><text x="29" y="93" font-size="13">Quadratic Mumford</text><text x="29" y="113" font-size="13">support (given)</text>
  <path class="arrow" d="M173 104 H193"/>
  <rect class="box proved" x="200" y="65" width="150" height="78" rx="8"/><text x="211" y="93" font-size="13">Maximal chart ideal</text><text x="211" y="113" font-size="13">Proj point (proved)</text>
  <path class="arrow" d="M350 104 H370"/>
  <rect class="box proved" x="377" y="65" width="155" height="78" rx="8"/><text x="388" y="93" font-size="13">Domain + Noetherian</text><text x="388" y="113" font-size="13">stalk (proved*)</text>
  <path class="arrow" d="M532 104 H552"/>
  <rect class="box open" x="559" y="65" width="150" height="78" rx="8"/><text x="570" y="93" font-size="13">Cotangent rank 1</text><text x="570" y="113" font-size="13">(open)</text>
  <path class="arrow" d="M709 104 H729"/>
  <rect class="box conditional" x="736" y="65" width="150" height="78" rx="8"/><text x="747" y="93" font-size="13">DVR + coheight 1</text><text x="747" y="113" font-size="13">(conditional)</text>
  <path class="arrow" d="M886 104 H906"/>
  <rect class="box open" x="913" y="65" width="170" height="78" rx="8"/><text x="924" y="93" font-size="13">Global divisor / Pic0</text><text x="924" y="113" font-size="13">equation (open)</text>
  <text x="18" y="174" font-size="12">* Domain assumes separable quintic; Noetherianity does not. Blue implication needs the open rank-one input.</text>
  <text x="18" y="191" font-size="12">No target runs or cost ratios were changed.</text>
</svg>
