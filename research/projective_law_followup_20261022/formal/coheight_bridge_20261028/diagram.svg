<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="258" viewBox="0 0 1200 258" role="img" aria-label="Quadratic-support proof boundaries with compiled Jacobian input">
  <rect width="1200" height="258" fill="white"/>
  <style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#18243a}.box{stroke:#64748b;stroke-width:1.5}.open{fill:#fef3c7}.conditional{fill:#dbeafe}.given,.proved{fill:#dcfce7}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker></defs>
  <text x="18" y="27" font-size="18" font-weight="bold">Irreducible quadratic support: proved inputs and open local-ring bridge</text>
  <rect class="box given" x="18" y="86" width="155" height="78" rx="8"/><text x="29" y="114" font-size="13">Quadratic Mumford</text><text x="29" y="134" font-size="13">support (given)</text>
  <path class="arrow" d="M173 125 H192"/>
  <rect class="box proved" x="199" y="86" width="155" height="78" rx="8"/><text x="210" y="114" font-size="13">Maximal chart ideal</text><text x="210" y="134" font-size="13">Proj point (proved)</text>
  <path class="arrow" d="M354 107 H373"/>
  <rect class="box proved" x="380" y="48" width="170" height="67" rx="8"/><text x="391" y="73" font-size="13">Domain + Noetherian</text><text x="391" y="93" font-size="13">stalk (proved*)</text>
  <path class="arrow" d="M354 143 H373"/>
  <rect class="box proved" x="380" y="135" width="170" height="67" rx="8"/><text x="391" y="153" font-size="12">Jacobian nonzero;</text><text x="391" y="171" font-size="12">formal tangent rank 1</text><text x="391" y="189" font-size="12">(proved*)</text>
  <path class="arrow" d="M550 82 H577 V113 H590"/>
  <path class="arrow" d="M550 168 H577 V137 H590"/>
  <rect class="box open" x="597" y="86" width="150" height="78" rx="8"/><text x="608" y="114" font-size="13">Cotangent rank 1</text><text x="608" y="134" font-size="13">(open bridge)</text>
  <path class="arrow" d="M747 125 H766"/>
