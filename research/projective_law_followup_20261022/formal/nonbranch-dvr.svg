<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
  <title id="title">Rational nonbranch point local DVR proof dependencies</title>
  <desc id="desc">Blue nodes are checked Lean theorems under the displayed hypotheses. Gray nodes are open. Amber gives the characteristic-two counterexample.</desc>
  <style>
    text { font-family: DejaVu Sans, Arial, sans-serif; fill:#182436; }
    .title { font-size:22px; font-weight:700; }
    .sub { font-size:13px; fill:#536075; }
    .label { font-size:16px; font-weight:600; }
    .detail { font-size:12px; }
    .checked { fill:#e8f3ff; stroke:#2372b8; stroke-width:2; }
    .open { fill:#f1f3f6; stroke:#788596; stroke-width:2; }
    .limit { fill:#fff1d6; stroke:#b87912; stroke-width:2; }
    .line { fill:none; stroke:#596579; stroke-width:2; }
    .tip { fill:#596579; }
  </style>
  <rect width="1100" height="480" fill="white"/>
  <text x="30" y="38" class="title">Rational nonbranch point: actual local DVR</text>
  <text x="30" y="60" class="sub">Lean 4.34.1 · source SHA-256 0eb48894992f0c1e412c20cdec44acc71692ea2b165b2d7afc3d72b6b204ce3f · no measurements</text>
  <rect x="35" y="90" width="310" height="70" rx="8" class="checked"/>
  <text x="55" y="118" class="label">Separable monic quintic</text><text x="55" y="141" class="detail">affine ring domain, checked earlier</text>
  <rect x="395" y="90" width="310" height="70" rx="8" class="checked"/>
  <text x="415" y="118" class="label">Rational point and 2y != 0</text><text x="415" y="141" class="detail">visible pointwise hypotheses</text>
  <rect x="755" y="90" width="310" height="70" rx="8" class="checked"/>
  <text x="775" y="118" class="label">Evaluation ideal coordinates</text><text x="775" y="141" class="detail">kernel = (x - a, y - y0)</text>
  <path d="M705 125 H755" class="line"/><path d="M755 125 L745 120 L745 130 Z" class="tip"/>
  <rect x="35" y="223" width="310" height="70" rx="8" class="checked"/>
  <text x="55" y="251" class="label">y + y0 is a local unit</text><text x="55" y="274" class="detail">residue is 2y0 != 0</text>
  <rect x="395" y="223" width="310" height="70" rx="8" class="checked"/>
  <text x="415" y="251" class="label">Maximal ideal is (x - a)</text><text x="415" y="274" class="detail">(y - y0)(y + y0) = (x - a)q</text>
  <rect x="755" y="223" width="310" height="70" rx="8" class="checked"/>
  <text x="775" y="251" class="label">Actual weighted-Proj DVR</text><text x="775" y="274" class="detail">local criterion + stalk equivalence</text>
  <path d="M550 160 V192 H190 V223 M910 160 V194 H550 V223 M345 258 H395 M705 258 H755 M190 160 V223" class="line"/>
  <path d="M190 223 L185 213 L195 213 Z M550 223 L545 213 L555 213 Z M395 258 L385 253 L385 263 Z M755 258 L745 253 L745 263 Z" class="tip"/>
  <rect x="35" y="356" width="310" height="72" rx="8" class="limit"/>
  <text x="55" y="384" class="label">Characteristic-2 limit</text><text x="55" y="407" class="detail">F2: X^5+X^3+1, point (0,1) singular</text>
  <rect x="395" y="356" width="310" height="72" rx="8" class="open"/>
  <text x="415" y="384" class="label">Common 2+2 norm transport</text><text x="415" y="407" class="detail">proof-side numerator into this DVR</text>
  <rect x="755" y="356" width="310" height="72" rx="8" class="open"/>
  <text x="775" y="384" class="label">Global Pic0 and runtime</text><text x="775" y="407" class="detail">divisor class and compiled semantics</text>
  <path d="M910 293 V325 H550 V356 M705 392 H755" class="line"/>
  <path d="M550 356 L545 346 L555 346 Z M755 392 L745 387 L745 397 Z" class="tip"/>
  <text x="35" y="458" class="sub">Blue: checked under displayed hypotheses · amber: explicit limit · gray: open · arrows: proof dependencies</text>
</svg>
