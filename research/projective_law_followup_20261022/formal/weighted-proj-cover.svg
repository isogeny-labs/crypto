    <rect x="35" y="183" width="830" height="61" rx="7" fill="#d9f4e2" stroke="#207244"/>
    <text x="51" y="209">CHECKED: prime containing Z and the sextic equation also contains Y</text>
    <text x="51" y="231" font-size="12" fill="#345c42">y_mem_of_z_mem; primality applied to Y² in the ideal</text>
    <path d="M450 244 V268" stroke="#596579" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="35" y="273" width="830" height="61" rx="7" fill="#d9f4e2" stroke="#207244"/>
    <text x="51" y="299">CHECKED: adding X puts the entire coordinate ideal inside that prime</text>
    <text x="51" y="321" font-size="12" fill="#345c42">irrelevant_le_of_x_z_mem; ambient polynomial ring only</text>
    <path d="M450 334 V358" stroke="#596579" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="35" y="363" width="830" height="61" rx="7" fill="#f3f4f6" stroke="#7c8491"/>
    <text x="51" y="389">OPEN: graded quotient and irrelevant-ideal correspondence</text>
    <text x="51" y="411" font-size="12" fill="#5c6470">needed before a statement about relevant homogeneous primes of Proj</text>
    <path d="M450 424 V448" stroke="#596579" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="35" y="453" width="830" height="61" rx="7" fill="#f3f4f6" stroke="#7c8491"/>
    <text x="51" y="479">OPEN: D₊(X) and D₊(Z) cover the chosen weighted Proj</text>
    <text x="51" y="501" font-size="12" fill="#5c6470">then identify both degree-zero localizations with the constructed charts</text>
    <path d="M450 514 V538" stroke="#596579" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="35" y="543" width="830" height="61" rx="7" fill="#f3f4f6" stroke="#7c8491"/>
    <text x="51" y="569">OPEN: smooth projective completion, divisor theory, and Pic⁰ transport</text>
