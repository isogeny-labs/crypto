  </defs>
  <rect width="900" height="650" fill="#ffffff"/>
  <text x="30" y="42" font-family="sans-serif" font-size="24" font-weight="bold">Weighted Proj cover: checked prerequisite</text>
  <text x="30" y="68" font-family="sans-serif" font-size="14" fill="#4b5563">Pinned Lean 4.34.1 / Mathlib d13f23b; proof dependencies, no operation counts</text>
  <g font-family="sans-serif" font-size="15">
    <rect x="35" y="93" width="830" height="61" rx="7" fill="#d9f4e2" stroke="#207244"/>
    <text x="51" y="119">CHECKED: Y² - (X⁵Z + a₃X³Z³ + a₂X²Z⁴ + a₁XZ⁵ + a₀Z⁶) = Y² - Z·tail</text>
    <text x="51" y="141" font-size="12" fill="#345c42">equation_factor; any field and arbitrary coefficients</text>
