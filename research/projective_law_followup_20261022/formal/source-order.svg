<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-label="Dependency graph for the source order on the actual weighted-Proj curve">
<title>Source-order proof gates</title>
<desc>Checked integrality, local Noetherianity, and source function feed the Lean-checked source order. Closed-point orders, finite divisor, Picard class, and Rust correspondence remain open.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
<rect width="1120" height="480" fill="#f8fafc"/>
<text x="40" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#0f172a">Actual weighted-Proj source-order gate</text>
<text x="40" y="67" font-family="sans-serif" font-size="14" fill="#475569">Blue: Lean checked · gray: open obligation. Arrows denote prerequisites, not measured performance.</text>
<g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M305 143 L430 218"/><path d="M305 238 L430 238"/><path d="M305 333 L430 258"/><path d="M675 238 L785 165"/><path d="M675 238 L785 275"/><path d="M903 195 L903 245"/><path d="M903 305 L903 355"/></g>
<g font-family="sans-serif" text-anchor="middle" font-size="17">
<rect x="40" y="105" width="265" height="76" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="172" y="137" fill="#1e3a8a">Actual curve integral</text><text x="172" y="160" font-size="13" fill="#1e40af">quintic separable</text>
<rect x="40" y="200" width="265" height="76" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="172" y="232" fill="#1e3a8a">Actual curve locally Noetherian</text><text x="172" y="255" font-size="13" fill="#1e40af">any field</text>
<rect x="40" y="295" width="265" height="76" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="172" y="327" fill="#1e3a8a">Source function in K(X)</text><text x="172" y="350" font-size="13" fill="#1e40af">N/B − y</text>
<rect x="430" y="198" width="245" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="552" y="229" fill="#1e3a8a">Source order on X</text><text x="552" y="254" font-size="13" fill="#1e40af">Lean checked</text>
<rect x="785" y="125" width="235" height="70" rx="10" fill="#e2e8f0" stroke="#64748b"/><text x="902" y="155" fill="#334155">Closed support coheight one</text><text x="902" y="178" font-size="13" fill="#475569">open</text>
<rect x="785" y="245" width="235" height="60" rx="10" fill="#e2e8f0" stroke="#64748b"/><text x="902" y="273" fill="#334155">Finite principal divisor</text><text x="902" y="293" font-size="13" fill="#475569">open</text>
<rect x="785" y="355" width="235" height="60" rx="10" fill="#e2e8f0" stroke="#64748b"/><text x="902" y="382" fill="#334155">Pic⁰ class equality</text><text x="902" y="403" font-size="13" fill="#475569">open</text>
</g>
<text x="40" y="446" font-family="sans-serif" font-size="13" fill="#475569">Nonvanishing, infinity pole, and compiled Rust correspondence are separate open gates in the CSV.</text>
</svg>
