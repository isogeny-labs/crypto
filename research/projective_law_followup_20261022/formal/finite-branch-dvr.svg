<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 335" role="img" aria-labelledby="title desc">
<title id="title">Local orders at a simple finite branch of weighted Proj</title>
<desc id="desc">A checked projective-stalk isomorphism transports the affine branch DVR to the actual weighted-Proj curve. At a rational simple branch, pulled-back y has order one and pulled-back x minus a has order two. Global divisor, Pic zero, and compiled-law semantics remain open.</desc>
<rect width="930" height="335" fill="#f8fafc"/>
<text x="28" y="38" font-family="sans-serif" font-size="21" font-weight="bold" fill="#14243a">Simple finite branch: checked local orders on weighted Proj</text>
<rect x="25" y="68" width="255" height="130" rx="10" fill="#dceefc" stroke="#426b91"/>
<text x="42" y="96" font-family="sans-serif" font-size="16" fill="#14243a">Rational simple branch</text>
<text x="42" y="128" font-family="sans-serif" font-size="15" fill="#14243a">f(a) = 0; f′(a) ≠ 0</text>
<text x="42" y="158" font-family="sans-serif" font-size="15" fill="#14243a">actual Proj stalk</text>
<path d="M280 132 H326" stroke="#426b91" stroke-width="3"/><path d="M326 132 L316 126 L316 138 Z" fill="#426b91"/>
<rect x="330" y="68" width="265" height="130" rx="10" fill="#dceefc" stroke="#426b91"/>
<text x="347" y="96" font-family="sans-serif" font-size="16" fill="#14243a">Checked stalk isomorphism</text>
<text x="347" y="128" font-family="sans-serif" font-size="15" fill="#14243a">affine branch localization</text>
<text x="347" y="158" font-family="sans-serif" font-size="15" fill="#14243a">DVR; y² = (x − a)q, q unit</text>
<path d="M595 132 H641" stroke="#426b91" stroke-width="3"/><path d="M641 132 L631 126 L631 138 Z" fill="#426b91"/>
<rect x="645" y="68" width="260" height="130" rx="10" fill="#c8f0db" stroke="#26704b"/>
<text x="662" y="96" font-family="sans-serif" font-size="16" fill="#14243a">Checked projective orders</text>
<text x="662" y="128" font-family="sans-serif" font-size="16" fill="#14243a">ord(y) = 1</text>
<text x="662" y="158" font-family="sans-serif" font-size="16" fill="#14243a">ord(x − a) = 2</text>
<rect x="25" y="226" width="880" height="80" rx="10" fill="#fff0d8" stroke="#ad7a22"/>
<text x="42" y="257" font-family="sans-serif" font-size="16" fill="#573b10">Still open: every numerator factorization and nonbranch multiplicity;</text>
<text x="42" y="283" font-family="sans-serif" font-size="16" fill="#573b10">global divisor/Pic^0 equation and compiled Rust semantics. No cost change.</text>
</svg>
