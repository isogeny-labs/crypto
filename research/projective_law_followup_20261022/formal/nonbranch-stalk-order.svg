<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-labelledby="title desc">
  <title id="title">Nonbranch weighted-Proj local-order proof dependencies</title>
  <desc id="desc">Blue nodes are checked, amber is a checked theorem with explicit hypotheses, and gray nodes are open. Arrows show proof dependencies, not measured performance.</desc>
