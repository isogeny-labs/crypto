      .sub { font-size:13px; fill:#536075; }
      .node { stroke-width:2; rx:9; }
      .checked { fill:#e8f3ff; stroke:#2372b8; }
      .conditional { fill:#fff1d8; stroke:#a66b0a; }
      .open { fill:#f1f3f6; stroke:#788596; }
      .label { font-size:15px; font-weight:600; }
