<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 330" role="img" aria-labelledby="title desc">
<title id="title">Finite branch stalk on actual weighted Proj</title>
<desc id="desc">A rational branch point lies in the Z basic open of actual weighted Proj. The checked affine-chart isomorphism and open-immersion stalk maps identify its stalk with localization of the affine ring at the branch ideal. Global Pic zero and runtime law remain open.</desc>
<rect width="930" height="330" fill="#f8fafc"/>
<text x="28" y="38" font-family="sans-serif" font-size="21" font-weight="bold" fill="#14243a">Finite branch: actual weighted-Proj stalk</text>
<rect x="25" y="67" width="260" height="126" rx="10" fill="#dceefc" stroke="#426b91"/>
<text x="41" y="95" font-family="sans-serif" font-size="16" fill="#14243a">Weighted Proj, Z basic open</text>
<text x="41" y="127" font-family="sans-serif" font-size="15" fill="#14243a">rational branch point</text>
<text x="41" y="155" font-family="sans-serif" font-size="15" fill="#14243a">root f(a) = 0</text>
<path d="M285 130 H329" stroke="#426b91" stroke-width="3"/>
<path d="M329 130 L319 124 L319 136 Z" fill="#426b91"/>
<rect x="333" y="67" width="263" height="126" rx="10" fill="#dceefc" stroke="#426b91"/>
<text x="349" y="95" font-family="sans-serif" font-size="16" fill="#14243a">Affine chart Spec(A)</text>
<text x="349" y="127" font-family="sans-serif" font-size="15" fill="#14243a">checked chart isomorphism</text>
<text x="349" y="155" font-family="sans-serif" font-size="15" fill="#14243a">open-immersion stalk maps</text>
<path d="M596 130 H640" stroke="#426b91" stroke-width="3"/>
<path d="M640 130 L630 124 L630 136 Z" fill="#426b91"/>
<rect x="644" y="67" width="260" height="126" rx="10" fill="#c8f0db" stroke="#26704b"/>
<text x="660" y="95" font-family="sans-serif" font-size="16" fill="#14243a">Localization at branch ideal</text>
<text x="660" y="127" font-family="sans-serif" font-size="15" fill="#14243a">stalk ring isomorphism</text>
<text x="660" y="155" font-family="sans-serif" font-size="15" fill="#14243a">Lean checked, standard axioms</text>
<rect x="25" y="220" width="879" height="80" rx="10" fill="#fff0d8" stroke="#ad7a22"/>
<text x="42" y="251" font-family="sans-serif" font-size="16" fill="#573b10">Still open: global divisor and Pic^0 class equation;</text>
<text x="42" y="277" font-family="sans-serif" font-size="16" fill="#573b10">compiled Rust law and all exceptional branches. No cost row changes.</text>
</svg>
