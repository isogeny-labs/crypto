<rect class="checked" x="30" y="188" rx="7" width="255" height="72"/><text x="48" y="218">zbar nonzero</text><text class="small" x="48" y="241">zero prime lies in D(zbar)</text>
<rect class="checked" x="335" y="135" rx="7" width="290" height="72"/><text x="353" y="165">X-chart preimage of Z-open</text><text class="small" x="353" y="188">equals D(zbar)</text>
