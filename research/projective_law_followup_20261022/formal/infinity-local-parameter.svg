<text x="404" y="78" font-family="sans-serif" font-size="13" fill="#222">Conditional local ring: m = (z,w)</text>
<text x="404" y="100" font-family="sans-serif" font-size="13" fill="#222">and w²=z·unit imply m=(w)</text>
