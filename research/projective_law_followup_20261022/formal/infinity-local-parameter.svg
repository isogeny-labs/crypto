<text x="259" y="192" font-family="sans-serif" font-size="13" fill="#222">Open: actual smooth projective stalk, m=(z,w), DVR</text>
<text x="259" y="214" font-family="sans-serif" font-size="12" fill="#444">Derivative alone is not a Lean construction of these objects.</text>
