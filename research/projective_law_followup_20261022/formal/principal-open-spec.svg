<svg xmlns="http://www.w3.org/2000/svg" width="850" height="380" viewBox="0 0 850 380" role="img" aria-labelledby="title desc">
<title id="title">Principal-open scheme proof gates</title>
<desc id="desc">Five checked formal gates and four open or unmeasured gates.</desc>
