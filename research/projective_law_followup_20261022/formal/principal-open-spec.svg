<text x="35" y="42" font-family="sans-serif" font-size="23" fill="#172554">Principal-open scheme overlap</text>
<text x="35" y="70" font-family="sans-serif" font-size="14" fill="#334155">Pinned Lean declarations: 5 checked; projective and runtime bridges remain open</text>
<rect x="35" y="93" width="500" height="37" fill="#dcfce7"/><text x="48" y="118" font-family="sans-serif" font-size="16">Open immersions and basic-open ranges</text>
<rect x="35" y="137" width="500" height="37" fill="#dcfce7"/><text x="48" y="162" font-family="sans-serif" font-size="16">Spec(Aₓ) ≅ Spec(Bz)</text>
<path d="M 285 182 L 285 209" stroke="#64748b" stroke-width="2"/>
<rect x="35" y="214" width="500" height="37" fill="#fef3c7"/><text x="48" y="239" font-family="sans-serif" font-size="16">Chosen smooth projective gluing: open</text>
<rect x="35" y="258" width="500" height="37" fill="#fef3c7"/><text x="48" y="283" font-family="sans-serif" font-size="16">Infinity stalk, divisor / Pic⁰: open</text>
<rect x="35" y="302" width="500" height="37" fill="#fef3c7"/><text x="48" y="327" font-family="sans-serif" font-size="16">Rust semantics and rho cost: open / unmeasured</text>
<text x="575" y="126" font-family="sans-serif" font-size="14" fill="#166534">checked</text>
<text x="575" y="246" font-family="sans-serif" font-size="14" fill="#92400e">open</text>
</svg>
