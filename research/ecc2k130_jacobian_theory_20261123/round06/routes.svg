<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1070" viewBox="0 0 1000 1070">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#607086"/></marker></defs>
<rect width="1000" height="1070" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172438">
<text x="45" y="55" font-size="29" font-weight="bold">A full double-cover Prym: two cases remain</text>
<text x="45" y="90" font-size="17">ECC2K-130 • round06 • 2026-11-23 • written, unsigned deductions</text>
<rect x="45" y="122" width="910" height="112" rx="12" fill="#edf1f8" stroke="#8194b2"/>
<text x="65" y="160" font-size="22" font-weight="bold">Scope: all of Prym(X/D) is isogenous to A</text>
<text x="65" y="194" font-size="18">Smooth curves over F2; geometrically connected separable double cover.</text>
<text x="65" y="220" font-size="16">An arbitrary A-factor in a larger Prym is outside this reduction.</text>
<path d="M500,234 V268" stroke="#607086" stroke-width="2" marker-end="url(#a)"/>
<rect x="45" y="275" width="910" height="106" rx="12" fill="#e8f5ed" stroke="#57936b"/>
<text x="65" y="312" font-size="23" font-weight="bold">Local zeta factors force a short list</text>
<text x="65" y="347" font-size="21">reduced L(D) × branch product = 1+T^131</text>
<text x="65" y="372" font-size="16">Only branch products 1, 1+T, 1+T^131 can occur.</text>
<path d="M250,381 V417 M750,381 V417" stroke="#607086" stroke-width="2" marker-end="url(#a)"/>
<rect x="45" y="425" width="440" height="208" rx="12" fill="#fff2da" stroke="#b58b42"/>
<text x="65" y="465" font-size="25" font-weight="bold">Genus260 → genus130</text>
<text x="65" y="503" font-size="18">One rational branch point,</text>
<text x="65" y="534" font-size="18">ramification invariant1.</text>
<text x="65" y="568" font-size="18">Both curves ordinary.</text>
<text x="65" y="606" font-size="16">No such target Prym constructed.</text>
<rect x="515" y="425" width="440" height="208" rx="12" fill="#fff2da" stroke="#b58b42"/>
<text x="535" y="465" font-size="25" font-weight="bold">Genus261 → genus131</text>
<text x="535" y="503" font-size="18">Etale double cover.</text>
<text x="535" y="534" font-size="18">Both curves ordinary.</text>
<text x="535" y="568" font-size="18">Base must be nonhyperelliptic.</text>
<text x="535" y="606" font-size="16">No such target Prym constructed.</text>
<rect x="45" y="669" width="910" height="125" rx="12" fill="#ffeae6" stroke="#b76b60"/>
<text x="65" y="707" font-size="22" font-weight="bold">Excluded: genus130 hyperelliptic option</text>
<text x="65" y="742" font-size="19">The third branch product gives base P1 and genus130.</text>
<text x="65" y="773" font-size="17">Round05 excludes it: 2 F4-points, below the universal minimum3.</text>
<rect x="45" y="827" width="910" height="123" rx="12" fill="#fff" stroke="#8194b2"/>
<text x="65" y="865" font-size="22" font-weight="bold">A double cover would still leave the source transfer</text>
<text x="65" y="900" font-size="18">Both surviving Pryms are principally polarized; the earlier ell-divisible</text>
<text x="65" y="929" font-size="18">isogeny constraint applies. It is not an evaluation-time lower bound.</text>
<text x="45" y="997" font-size="15">Sources: REPORT.md; check.cpp/replay.gp; Achter–Casalaina-Martin Theorem A.</text>
<text x="45" y="1028" font-size="15">Original general curve/map goal remains open. No attack-cost or performance result.</text>
</g></svg>
