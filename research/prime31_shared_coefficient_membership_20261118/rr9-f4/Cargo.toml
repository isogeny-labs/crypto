[package]
name = "prime31-rr9-f4"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[workspace]

[dependencies]
libc = "0.2"
prime31-selector-sat = { path = "../native" }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
rand = { version = "0.8", features = ["std_rng"] }

[profile.release]
codegen-units = 1
lto = "thin"
