notes: Claim run for protocol P1 (PROTOCOL.md with Addendum A). The build writes only under CARGO_TARGET_DIR,
  which is outside the repository. The run-cells command creates one new directory runs/run-YYYYmmddTHHMMSSZ/
  (the UTC start time) and writes every plant JSON, emit record, msolve log, parsed JSON, skips.tsv, cells.tsv,
  jobs.tsv, parsed.jsonl and provenance.txt there; it records msolve cap, timeout and not-admissible cells
  and imputes nothing. It runs 40 msolve jobs, one at a time, cheapest cells first; the run-cells command
  has a 50000 second limit. A job that reaches the memory cap or the 1200 second limit is a recorded result,
  not a stop.
