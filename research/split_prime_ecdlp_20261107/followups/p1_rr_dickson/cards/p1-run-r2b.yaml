notes: Round 2 part R2b of PROTOCOL-R2.md with its Addendum A, Dickson T24 m5 t4, systems RR then T, one seed; route this host (L0), no benchmark record steps, no commit pin (binds pin every input by sha256). THIS CARD MUST RUN ALONE ON THE HOST, so no other msolve job, card or build may be running while the run-cells command runs, and PROTOCOL-R2.md orders it after every other round-2 job; the driver records the load and the msolve processes visible at its start in provenance.txt. The build writes only under CARGO_TARGET_DIR, outside the repository. The run-cells command creates one new directory runs/run-r2b-20261108T053603Z (plain mkdir, it fails if the directory exists), scans seeds 1 to 50 with emit (RR then T on the same seed, recording every skipped seed in skips.tsv) and takes the first admissible seed, then runs RR and T at VLIMIT=13631488 KiB and TLIMIT=10800 s. A job that reaches the memory cap or the time limit is a recorded result (the parse status), not a stop, and nothing is imputed. The run-cells command is launched detached because it can take longer than an agent shell can hold (up to about 6 hours); its time limit is 30000 s.
