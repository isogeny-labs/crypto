notes: Round 2 parts R2c (arm F, 18 jobs) and R2a (arm T, 8 jobs) of PROTOCOL-R2.md with its Addendum A; route this host (L0), no benchmark record steps, no commit pin (binds pin every input by sha256). The build writes only under CARGO_TARGET_DIR, outside the repository, and must produce the p1tool built from the bound main.rs. The run-cells command creates one new directory runs/run-r2a-20261108T053528Z (plain mkdir, it fails if the directory exists) and writes every emit record, plant JSON, msolve log, parsed JSON, jobs.tsv, parsed.jsonl and provenance.txt there. It runs 26 msolve jobs, one at a time, all F jobs first (cheapest cells first), then the T jobs, at VLIMIT=6291456 KiB and TLIMIT=3600 s; seeds are round 1's admissible seeds written literally in the driver. A job that reaches the memory cap or the time limit is a recorded result (the parse status), not a stop, and nothing is imputed. The run-cells command is launched detached because it can take longer than an agent shell can hold (estimate 1 to 8 hours); its time limit is 120000 s. No other msolve job may be started by this card.
