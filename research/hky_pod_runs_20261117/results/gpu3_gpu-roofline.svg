<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" role="img" aria-label="Roofline: roofline, operations per second against operations per byte">
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.surface{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.mut{fill:#898781}.grid{stroke:#e4e3dd}.axis{stroke:#c3c2b7}.ring{stroke:#fcfcfb}.halo{stroke:#fcfcfb}.l0{stroke:#2a78d6}.f0{fill:#2a78d6}.l1{stroke:#eb6834}.f1{fill:#eb6834}.l2{stroke:#1baf7a}.f2{fill:#1baf7a}.l3{stroke:#898781}.f3{fill:#898781}@media (prefers-color-scheme: dark){.surface{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.mut{fill:#898781}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.ring{stroke:#1a1a19}.halo{stroke:#1a1a19}.l0{stroke:#3987e5}.f0{fill:#3987e5}.l1{stroke:#d95926}.f1{fill:#d95926}.l2{stroke:#199e70}.f2{fill:#199e70}.l3{stroke:#898781}.f3{fill:#898781}}</style>
