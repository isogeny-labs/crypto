<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#47637b"/></marker></defs><rect width="900" height="520" fill="white"/><g font-family="Arial,sans-serif" fill="#193147"><text x="25" y="30" font-size="21" font-weight="bold">Twist evidence publication: authentication passes, object write is denied</text><rect x="40" y="65" width="820" height="76" rx="8" fill="#e9f2f7" stroke="#47637b"/><text x="450" y="96" text-anchor="middle" font-size="18">Prepared immutable archive: 38,156,064 bytes; SHA-256 checked</text><text x="450" y="122" text-anchor="middle" font-size="14">Exact original byte digest retained; source scientific results unchanged</text><path d="M450 141 L450 177" stroke="#47637b" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="185" width="390" height="95" rx="8" fill="#edf5ef" stroke="#47637b"/><text x="235" y="218" text-anchor="middle" font-size="18">AWS caller authentication: accepted</text><text x="235" y="249" text-anchor="middle" font-size="14">Caller identifiers and credentials omitted</text><rect x="470" y="185" width="390" height="95" rx="8" fill="#fff1e6" stroke="#a66d42"/><text x="665" y="218" text-anchor="middle" font-size="18">Native HeadObject: 403</text><text x="665" y="249" text-anchor="middle" font-size="14">Exact-prefix ListObjectsV2: AccessDenied</text><path d="M235 280 L235 316 M665 280 L665 316" stroke="#47637b" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="325" width="820" height="73" rx="8" fill="#fff1e6" stroke="#a66d42"/><text x="450" y="354" text-anchor="middle" font-size="19">Conditional PutObject (If-None-Match: *): AccessDenied</text><text x="450" y="381" text-anchor="middle" font-size="15">No successful write; fresh-download verification not attempted</text><path d="M450 398 L450 430" stroke="#47637b" stroke-width="2" marker-end="url(#a)"/><text x="450" y="459" text-anchor="middle" font-size="17">Next: owner grants read/write permission for this one object</text><text x="450" y="490" text-anchor="middle" font-size="14">No remote deletion, overwrite, policy change or fictitious index entry</text></g></svg>