<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="445" viewBox="0 0 1100 445"><rect width="1100" height="445" fill="white"/><g font-family="DejaVu Sans,sans-serif" font-size="18" fill="#223544"><text x="24" y="34" font-size="27" font-weight="bold">Fixed Frobenius-factor subset and detector controls</text><text x="24" y="65" font-size="17">PARI characteristic polynomials; exact native integer-division recheck; no transfer or cost claim.</text><text x="24" y="126">Overlap source factor</text><rect x="380" y="103" width="500" height="30" fill="#dce3e7"/><rect x="380" y="103" width="0" height="30" fill="#1a7c72"/><text x="925" y="126">0/20</text><text x="24" y="187">Overlap twist factor</text><rect x="380" y="164" width="500" height="30" fill="#dce3e7"/><rect x="380" y="164" width="0" height="30" fill="#1a7c72"/><text x="925" y="187">0/20</text><text x="24" y="248">Known-cover source factor</text><rect x="380" y="225" width="500" height="30" fill="#dce3e7"/><rect x="380" y="225" width="500" height="30" fill="#1a7c72"/><text x="925" y="248">10/10</text><text x="24" y="309">Corrupted polynomial rejected</text><rect x="380" y="286" width="500" height="30" fill="#dce3e7"/><rect x="380" y="286" width="500" height="30" fill="#1a7c72"/><text x="925" y="309">10/10</text><text x="24" y="391" font-size="16">Overlap subset: exactly shifts 1 and 3 on all 10 fixtures; not every genus-two polynomial.</text><text x="24" y="418" font-size="16">Known covers: y²=x⁶+a x²+b to E via (x²,y). False control adds 1 to the polynomial.</text></g></svg>
