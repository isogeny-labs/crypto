<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Research assessment path for 100 supplied ideas</title>
  <desc id="desc">A proposal first needs a relation preserving mechanism for elliptic curve points. Direct decomposition experiments and conditional support experiments then require exact verification and full cost accounting. Multiplicative field ideas are evaluated in their own group.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#43607a"/></marker>
  </defs>
  <rect width="1000" height="470" fill="#f7fafc"/>
  <text x="40" y="45" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17324d">From proposal to a testable ECDLP claim</text>
  <text x="40" y="70" font-family="Arial,sans-serif" font-size="15" fill="#43607a">Categorical assessment of the user-supplied list · 2026-11-23 · no performance measurements</text>
  <rect x="40" y="112" width="235" height="90" rx="12" fill="#dceafa" stroke="#4677a8" stroke-width="2"/>
  <text x="58" y="143" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17324d">100 proposals</text>
  <text x="58" y="170" font-family="Arial,sans-serif" font-size="15" fill="#17324d">Exact mechanism stated?</text>
  <path d="M275 157 H345" fill="none" stroke="#43607a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="350" y="112" width="270" height="90" rx="12" fill="#fff4dc" stroke="#bd8c32" stroke-width="2"/>
  <text x="368" y="143" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#614307">Group and relation gate</text>
  <text x="368" y="169" font-family="Arial,sans-serif" font-size="15" fill="#614307">E(Fp) point sum or Fp× product?</text>
  <path d="M620 157 H690" fill="none" stroke="#43607a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="695" y="112" width="265" height="90" rx="12" fill="#e2f3e8" stroke="#3d8b5b" stroke-width="2"/>
  <text x="713" y="143" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#23583a">EC experiment gate</text>
  <text x="713" y="170" font-family="Arial,sans-serif" font-size="15" fill="#23583a">Exact verified point relations</text>
  <path d="M485 202 V248 H335 V269" fill="none" stroke="#43607a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="40" y="275" width="425" height="120" rx="12" fill="#f0e8f7" stroke="#8e70ac" stroke-width="2"/>
  <text x="58" y="307" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#51396a">Other paths</text>
  <text x="58" y="334" font-family="Arial,sans-serif" font-size="15" fill="#51396a">M: evaluate in multiplicative-field setting</text>
  <text x="58" y="360" font-family="Arial,sans-serif" font-size="15" fill="#51396a">U: supply a missing map or operative predicate</text>
  <path d="M827 202 V269" fill="none" stroke="#43607a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="535" y="275" width="425" height="120" rx="12" fill="#e2f3e8" stroke="#3d8b5b" stroke-width="2"/>
  <text x="553" y="307" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#23583a">Complete cost and correctness</text>
  <text x="553" y="334" font-family="Arial,sans-serif" font-size="15" fill="#23583a">Setup · collection · verification · rank/solve</text>
  <text x="553" y="360" font-family="Arial,sans-serif" font-size="15" fill="#23583a">Target descent · matched baseline</text>
  <text x="40" y="442" font-family="Arial,sans-serif" font-size="14" fill="#43607a">E = direct EC test · S = conditional support · M = multiplicative-field scope · U = mechanism missing as stated</text>
</svg>
