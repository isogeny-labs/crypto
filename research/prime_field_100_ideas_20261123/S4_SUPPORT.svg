<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Exact nonzero coefficient counts in specialized S4 resultants</title>
  <desc id="desc">For the fixed 1009-field cases, generic coordinates have 125 of 125 nonzero coefficients. Coordinate zero has 88, 37, or 35 depending on the curve. Counts come from the committed PARI GP output.</desc>
  <rect width="1000" height="470" fill="#f8fafc"/>
  <text x="32" y="41" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17354c">Specialized S4 coefficient support</text>
  <text x="32" y="66" font-family="Arial,sans-serif" font-size="15" fill="#526b7d">E/F1009 · exact nonzero count in 5×5×5 coefficient box · PARI/GP 2.17.3</text>
  <line x1="282" y1="99" x2="907" y2="99" stroke="#9cb0bd" stroke-width="2"/>
  <line x1="282" y1="99" x2="282" y2="396" stroke="#9cb0bd" stroke-width="2"/>
  <line x1="532" y1="99" x2="532" y2="396" stroke="#d4dfe6" stroke-dasharray="4 4"/>
  <line x1="782" y1="99" x2="782" y2="396" stroke="#d4dfe6" stroke-dasharray="4 4"/>
  <line x1="907" y1="99" x2="907" y2="396" stroke="#d4dfe6" stroke-dasharray="4 4"/>
  <text x="282" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526b7d">0</text>
  <text x="532" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526b7d">50</text>
  <text x="782" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526b7d">100</text>
  <text x="907" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526b7d">125</text>
  <text x="25" y="145" font-family="Arial,sans-serif" font-size="15" fill="#17354c">a=2, b=3, z=7</text><rect x="282" y="124" width="625" height="28" fill="#4773a8"/><text x="917" y="145" font-family="Arial,sans-serif" font-size="15" fill="#17354c">125</text>
  <text x="25" y="197" font-family="Arial,sans-serif" font-size="15" fill="#17354c">a=2, b=3, z=0</text><rect x="282" y="176" width="440" height="28" fill="#49a675"/><text x="732" y="197" font-family="Arial,sans-serif" font-size="15" fill="#17354c">88</text>
  <text x="25" y="249" font-family="Arial,sans-serif" font-size="15" fill="#17354c">a=0, b=3, z=0</text><rect x="282" y="228" width="185" height="28" fill="#49a675"/><text x="477" y="249" font-family="Arial,sans-serif" font-size="15" fill="#17354c">37</text>
  <text x="25" y="301" font-family="Arial,sans-serif" font-size="15" fill="#17354c">a=2, b=0, z=0</text><rect x="282" y="280" width="175" height="28" fill="#49a675"/><text x="467" y="301" font-family="Arial,sans-serif" font-size="15" fill="#17354c">35</text>
  <text x="25" y="353" font-family="Arial,sans-serif" font-size="15" fill="#17354c">a=1, b=14, z=0</text><rect x="282" y="332" width="440" height="28" fill="#49a675"/><text x="732" y="353" font-family="Arial,sans-serif" font-size="15" fill="#17354c">88</text>
  <text x="25" y="405" font-family="Arial,sans-serif" font-size="15" fill="#17354c">a=1, b=14, z=7</text><rect x="282" y="384" width="625" height="28" fill="#4773a8"/><text x="917" y="405" font-family="Arial,sans-serif" font-size="15" fill="#17354c">125</text>
  <text x="32" y="452" font-family="Arial,sans-serif" font-size="13" fill="#526b7d">Deterministic coefficient census; no timing, solver, relation-rank, or uncertainty estimate. Source: S4_SUPPORT_GP.txt.</text>
</svg>
