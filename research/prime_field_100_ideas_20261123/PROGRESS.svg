<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="t d">
  <title id="t">First bounded execution pass across 100 proposals</title>
  <desc id="d">Three parallel workstreams cover ranges 1 to 34, 35 to 67, and 68 to 100. They yield arithmetic counterexamples, historical baseline checks, and a completed exact Semaev support diagnostic.</desc>
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4d6477"/></marker></defs>
  <rect width="1000" height="440" fill="#f7f9fc"/>
  <text x="32" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17354c">First bounded execution pass</text>
  <text x="32" y="68" font-family="Arial,sans-serif" font-size="15" fill="#526b7d">2026-11-24 · exact checks and historical record inspection · no new performance timing</text>
  <rect x="35" y="106" width="280" height="82" rx="12" fill="#e0ecfb" stroke="#4773a8" stroke-width="2"/>
  <text x="55" y="137" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17354c">Items 1–34</text>
  <text x="55" y="164" font-family="Arial,sans-serif" font-size="15" fill="#17354c">Relation maps and decomposition</text>
  <rect x="360" y="106" width="280" height="82" rx="12" fill="#e0ecfb" stroke="#4773a8" stroke-width="2"/>
  <text x="380" y="137" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17354c">Items 35–67</text>
  <text x="380" y="164" font-family="Arial,sans-serif" font-size="15" fill="#17354c">Topology, quantum, hardware</text>
  <rect x="685" y="106" width="280" height="82" rx="12" fill="#e0ecfb" stroke="#4773a8" stroke-width="2"/>
  <text x="705" y="137" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17354c">Items 68–100</text>
  <text x="705" y="164" font-family="Arial,sans-serif" font-size="15" fill="#17354c">Matrix, graph, parameter rules</text>
  <path d="M175 188 V228 H255 V250" fill="none" stroke="#4d6477" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M500 188 V250" fill="none" stroke="#4d6477" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M825 188 V228 H745 V250" fill="none" stroke="#4d6477" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="35" y="258" width="290" height="120" rx="12" fill="#f3e9f6" stroke="#8f69a4" stroke-width="2"/>
  <text x="55" y="289" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#543565">Arithmetic screens</text>
  <text x="55" y="319" font-family="Arial,sans-serif" font-size="15" fill="#543565">#26, #35, #46, #80, #83</text>
  <text x="55" y="348" font-family="Arial,sans-serif" font-size="14" fill="#543565">Literal mechanisms only</text>
  <rect x="355" y="258" width="290" height="120" rx="12" fill="#fff0db" stroke="#bc8737" stroke-width="2"/>
  <text x="375" y="289" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#65410e">Historical baselines</text>
  <text x="375" y="319" font-family="Arial,sans-serif" font-size="15" fill="#65410e">GPU, hypergraph, fixed-base sweep</text>
  <text x="375" y="348" font-family="Arial,sans-serif" font-size="14" fill="#65410e">Source workloads kept distinct</text>
  <rect x="675" y="258" width="290" height="120" rx="12" fill="#e1f3e7" stroke="#46855d" stroke-width="2"/>
  <text x="695" y="289" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#28533a">#24 support diagnostic</text>
  <text x="695" y="319" font-family="Arial,sans-serif" font-size="15" fill="#28533a">z=0: 88/125; z=7: 125/125</text>
  <text x="695" y="348" font-family="Arial,sans-serif" font-size="14" fill="#28533a">Prime-order E/F1009, no solver test</text>
  <text x="35" y="416" font-family="Arial,sans-serif" font-size="14" fill="#526b7d">The item ledger retains the decisive obligation for each of the 100 proposals.</text>
</svg>
