  <title id="title">Primary N83 K2048 capped five-summand SAT search times</title>
  <desc id="desc">On fixture zero U used 152.482 seconds and D used 166.213 seconds. On fixture one U used 159.272 seconds and D used 153.158 seconds. Every search returned Unknown at 5000 conflicts; one run per cell on a shared host.</desc>
