<text x="9" y="22" font-size="8.1" font-family="DejaVu Sans,sans-serif">Actual source fields</text>
<text x="116" y="18" font-size="7.6" font-family="DejaVu Sans,sans-serif">|K|=q^2, |L|=q^6; derive [L:K]=3</text>
