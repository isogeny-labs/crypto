<text x="116" y="57" font-size="7.6" font-family="DejaVu Sans,sans-serif">Construct an invertible matrix sending epsilon to theta</text>
<text x="116" y="71" font-size="7.6" font-family="DejaVu Sans,sans-serif">Prove denominator nonzero; uniqueness modulo unit scalars</text>
