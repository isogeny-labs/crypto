notes: "Command 1 runs the frozen ecbench binary on the frozen spec with --cpus none, which records the conditions and pins no core, so the session is level L0. This session reports counted group operations only, which are deterministic in the seed and hold at any isolation level; isolation gates wall-clock figures, which this session does not report. Command 2 replays every measured run and exits 1 if the audit finds a problem. Command 3 compares arm rho-neg against arm rho-plain and saves the comparison inside the session directory. Command 4 prints the table. Commands 5 to 28 only print the line count and the first 100 lines of the standard output of commands 1 to 4 in 20-line windows. Return all of it verbatim and compute nothing."
