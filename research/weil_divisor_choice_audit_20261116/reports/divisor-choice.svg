<svg xmlns="http://www.w3.org/2000/svg" width="500" height="120" viewBox="0 0 500 120">
<rect x="0" y="5" width="500" height="34" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="22" font-size="7.2" font-family="DejaVu Sans,sans-serif">Actual quotient</text>
<text x="104" y="18" font-size="6.9" font-family="DejaVu Sans,sans-serif">Degree-zero divisors D,E; disjoint support</text>
<text x="104" y="32" font-size="6.8" font-family="DejaVu Sans,sans-serif">div(f)=nD, div(g)=nE; value g(D)/f(E)</text>
<rect x="0" y="44" width="500" height="34" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="61" font-size="7.2" font-family="DejaVu Sans,sans-serif">Choice proof</text>
<text x="104" y="57" font-size="6.9" font-family="DejaVu Sans,sans-serif">Replace D by D+div(h), f by f*h^n</text>
<text x="104" y="71" font-size="6.8" font-family="DejaVu Sans,sans-serif">Actual reciprocity cancels both changes</text>
<rect x="0" y="83" width="500" height="34" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="100" font-size="7.2" font-family="DejaVu Sans,sans-serif">Moving guard</text>
<text x="104" y="96" font-size="6.9" font-family="DejaVu Sans,sans-serif">Geometric moving avoids any finite set</text>
<text x="104" y="110" font-size="6.8" font-family="DejaVu Sans,sans-serif">Actual F2 curve: no suitable rational shift</text>
</svg>
