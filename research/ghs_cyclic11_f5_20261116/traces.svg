<svg xmlns="http://www.w3.org/2000/svg" width="850" height="320" viewBox="0 0 850 320" role="img" aria-label="F5 three-branch cyclic-11 Kummer trace screen: 60 rows with trace negative 75, 30 with trace 90">
  <rect width="850" height="320" fill="#ffffff"/>
  <text x="30" y="40" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#14213d">F5 cyclic-11 three-branch trace screen</text>
  <text x="30" y="66" font-family="Arial,sans-serif" font-size="14" fill="#475569">90 exponent rows · independent direct point recount · fifth-extension trace t</text>
  <text x="31" y="129" font-family="Arial,sans-serif" font-size="18" fill="#14213d">t = −75</text>
  <rect x="155" y="100" width="540" height="41" rx="4" fill="#b45309"/>
  <text x="710" y="127" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#b45309">60 rows</text>
  <text x="31" y="206" font-family="Arial,sans-serif" font-size="18" fill="#14213d">t = 90</text>
  <rect x="155" y="177" width="270" height="41" rx="4" fill="#0f766e"/>
  <text x="440" y="204" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#0f766e">30 rows</text>
  <line x1="155" y1="235" x2="695" y2="235" stroke="#334155" stroke-width="2"/>
  <text x="155" y="258" font-family="Arial,sans-serif" font-size="13" fill="#475569">0</text>
  <text x="418" y="258" font-family="Arial,sans-serif" font-size="13" fill="#475569">30</text>
  <text x="680" y="258" font-family="Arial,sans-serif" font-size="13" fill="#475569">60 rows</text>
  <text x="30" y="300" font-family="Arial,sans-serif" font-size="14" fill="#475569">Both traces are nonzero multiples of 5: no elliptic source factor in this 90-row family.</text>
</svg>
