<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510">
<rect width="1000" height="510" fill="#f6f8fa"/>
<style>text{font-family:Arial,sans-serif;fill:#182d40;font-size:17px}.small{font-size:14px}.box{fill:white;stroke:#506c80;stroke-width:2}.line{fill:none;stroke:#506c80;stroke-width:2;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#506c80"/></marker></defs>
<text x="30" y="35" style="font-size:23px">Three bounded constructions; verify every original point sum</text>
<rect class="box" x="25" y="75" width="200" height="185" rx="9"/>
<text x="45" y="108">Original target R</text><text class="small" x="45" y="140">Charts A, B; union U</text>
<text class="small" x="45" y="180">Matched public targets</text><text class="small" x="45" y="206">Positive controls separated</text><text class="small" x="45" y="232">Disjoint train / holdout</text>
<rect class="box" x="290" y="65" width="340" height="60" rx="9"/><text x="310" y="90">Product reference: gU(x)=gU(y)=0</text><text class="small" x="310" y="112">Exact union; not its unrestricted linear span</text>
<rect class="box" x="290" y="145" width="340" height="60" rx="9"/><text x="310" y="170">Asymmetric: AA, AB, BB</text><text class="small" x="310" y="192">Retain and count every attempted branch</text>
<rect class="box" x="290" y="225" width="340" height="60" rx="9"/><text x="310" y="250">Selector: guarded gA and gB</text><text class="small" x="310" y="272">Independent selector on each summand</text>
<path class="line" d="M225 110 H260 V95 H290"/><path class="line" d="M225 175 H290"/><path class="line" d="M225 235 H260 V255 H290"/>
<rect class="box" x="740" y="125" width="235" height="110" rx="9"/><text x="760" y="154">Verify P+Q=R</text><text class="small" x="760" y="180">Original points, curve, signs</text><text class="small" x="760" y="205">Checked projected rank</text>
<path class="line" d="M630 95 H690 V150 H740"/><path class="line" d="M630 175 H740"/><path class="line" d="M630 255 H690 V210 H740"/>
<rect class="box" x="25" y="345" width="200" height="90" rx="9"/><text x="45" y="375">Torsion lift base B</text><text class="small" x="45" y="401">Direct reference on B+B</text>
<rect class="box" x="290" y="345" width="340" height="90" rx="9"/><text x="310" y="375">ψ(R); solve on C+C</text><text class="small" x="310" y="401">Lift preimages; correct the T discrepancy</text><text class="small" x="310" y="423">Check [r] targets and explicit map values</text>
<path class="line" d="M225 390 H290"/><path class="line" d="M630 390 H858 V235"/>
<text class="small" x="30" y="480">Measured F4 counts and finite checks are stage diagnostics. Degree of regularity and complete native cost remain uncertified.</text>
</svg>
