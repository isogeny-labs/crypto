<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title3 desc3">
<title id="title3">A cover changes the ambient group</title><desc id="desc3">The curve map and its induced pullback point in opposite directions.</desc>
<defs>
<marker id="a3ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#192b3b"/></marker>
<marker id="a3blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2864ad"/></marker>
<marker id="a3green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#087d68"/></marker>
<marker id="a3purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7555a5"/></marker>
<marker id="a3muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#586879"/></marker>
</defs><style>
text{font-family:DejaVu Sans,Arial,sans-serif;fill:#192b3b} .math{font-family:DejaVu Sans,Arial,sans-serif;font-weight:500}
</style>
<rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7f6f2" stroke="none" stroke-width="1.5" />
<text x="56" y="48" font-size="14" font-weight="600" text-anchor="start" style="fill:#586879" letter-spacing="1.7" >ELLIPTIC CURVES · JACOBIANS · INDEX CALCULUS</text>
<text x="56" y="101" font-size="36" font-weight="700" text-anchor="start" style="fill:#192b3b"  >A cover changes the ambient group</text>
<text x="56" y="140" font-size="20" font-weight="400" text-anchor="start" style="fill:#586879"  >The curve map and its induced pullback point in opposite directions.</text>
<text x="1382" y="48" font-size="15" font-weight="400" text-anchor="end" style="fill:#586879"  >03 / 04</text>
<text x="56" y="193" font-size="14" font-weight="600" text-anchor="start" style="fill:#586879" letter-spacing="1.4" >CURVES</text>
<rect x="56" y="216" width="595" height="160" rx="18" fill="#f1edf8" stroke="#7555a5" stroke-width="1.5" />
<text x="82" y="254" font-size="23" font-weight="600" text-anchor="start" style="fill:#7555a5"  >Genus-2 hyperelliptic curve C</text>
<text x="82" y="302" font-size="30" font-weight="500" text-anchor="start" style="fill:#192b3b"  >Y² = X⁶ + aX² + b</text>
<text x="82" y="343" font-size="18" font-weight="400" text-anchor="start" style="fill:#586879"  >Same field 𝔽p as the challenge curve</text>
<rect x="925" y="216" width="459" height="160" rx="18" fill="#edf3fc" stroke="#2864ad" stroke-width="1.5" />
<text x="951" y="254" font-size="23" font-weight="600" text-anchor="start" style="fill:#2864ad"  >Elliptic curve E</text>
<text x="951" y="302" font-size="28" font-weight="500" text-anchor="start" style="fill:#192b3b"  >y² = x³ + ax + b</text>
<text x="951" y="343" font-size="18" font-weight="400" text-anchor="start" style="fill:#586879"  >The published ECCp-131 curve</text>
<path d="M669 284 L905 284" fill="none" stroke="#7555a5" stroke-width="2.5" marker-end="url(#a3purple)" />
<text x="787" y="252" font-size="19" font-weight="500" text-anchor="middle" style="fill:#7555a5"  >degree-2 cover f</text>
<text x="787" y="327" font-size="20" font-weight="500" text-anchor="middle" style="fill:#7555a5"  >(X,Y) ↦ (X²,Y)</text>
<text x="56" y="426" font-size="14" font-weight="600" text-anchor="start" style="fill:#586879" letter-spacing="1.4" >GROUPS OF DIVISOR CLASSES</text>
<rect x="56" y="450" width="739" height="299" rx="18" fill="#f1edf8" stroke="#7555a5" stroke-width="1.5" />
<text x="84" y="490" font-size="26" font-weight="600" text-anchor="start" style="fill:#7555a5"  >Jac(C)(𝔽p)</text>
<text x="84" y="525" font-size="20" font-weight="400" text-anchor="start" style="fill:#586879"  >Ambient group size ≈ p²</text>
<rect x="116" y="552" width="608" height="155" rx="22" fill="#edf3fc" stroke="#2864ad" stroke-width="1.5" />
<text x="420" y="592" font-size="23" font-weight="600" text-anchor="middle" style="fill:#2864ad"  >Embedded elliptic subgroup</text>
<text x="420" y="635" font-size="29" font-weight="500" text-anchor="middle" style="fill:#192b3b"  >f*(Q) = k f*(P)</text>
<text x="420" y="674" font-size="21" font-weight="500" text-anchor="middle" style="fill:#2864ad"  >Subgroup order remains n ≈ p</text>
<rect x="1000" y="493" width="384" height="214" rx="18" fill="#edf3fc" stroke="#2864ad" stroke-width="1.5" />
<text x="1028" y="537" font-size="27" font-weight="600" text-anchor="start" style="fill:#2864ad"  >E(𝔽p)</text>
<text x="1028" y="583" font-size="30" font-weight="500" text-anchor="start" style="fill:#192b3b"  >Q = kP</text>
<text x="1028" y="628" font-size="19" font-weight="400" text-anchor="start" style="fill:#586879"  >Challenge subgroup order n</text>
<text x="1028" y="666" font-size="17" font-weight="400" text-anchor="start" style="fill:#586879"  >For ECCp-131: #E(𝔽p) = n</text>
<path d="M982 615 L743 615" fill="none" stroke="#2864ad" stroke-width="2.5" marker-end="url(#a3blue)" />
<text x="866" y="571" font-size="22" font-weight="600" text-anchor="middle" style="fill:#2864ad"  >pullback f*</text>
<rect x="56" y="775" width="1328" height="91" rx="18" fill="white" stroke="#192b3b" stroke-width="1.5" />
<text x="84" y="811" font-size="23" font-weight="400" text-anchor="start" style="fill:#192b3b"  >Pushforward after pullback gives multiplication by 2.</text>
<text x="84" y="846" font-size="20" font-weight="400" text-anchor="start" style="fill:#586879"  >Since n is odd, pullback is injective on the target subgroup. The same unknown k survives.</text>
<path d="M56 886 L1384 886" fill="none" stroke="#d9dfe5" stroke-width="1" />
<text x="56" y="918" font-size="15" font-weight="400" text-anchor="start" style="fill:#586879"  >Schematic group regions, not a plot of finite-field points.  A larger ambient group alone supplies no speedup.</text>
</svg>