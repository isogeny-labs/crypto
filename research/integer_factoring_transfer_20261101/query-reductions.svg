<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
  <title id="title">Finite upstream leading-norm query reductions</title>
  <desc id="desc">Bars show 61.2 percent for 92-bit, 60.6 percent for 124-bit, and 57.6 percent for 144-bit inputs. These are query-count reductions, not wall-clock speedups.</desc>
  <rect width="820" height="430" fill="white"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#111827">
    <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="700">Finite upstream leading-norm query reductions</text>
    <text x="410" y="55" text-anchor="middle" font-size="12" fill="#4b5563">matched traversal; one retained input per bar; no timing or confidence interval</text>
    <line x1="150" y1="330" x2="750" y2="330" stroke="#374151" stroke-width="1.5"/>
    <line x1="150" y1="85" x2="150" y2="330" stroke="#374151" stroke-width="1.5"/>
    <g font-size="11" fill="#4b5563">
      <line x1="150" y1="330" x2="150" y2="336" stroke="#374151"/><text x="150" y="353" text-anchor="middle">0%</text>
      <line x1="321" y1="330" x2="321" y2="336" stroke="#374151"/><text x="321" y="353" text-anchor="middle">20%</text>
      <line x1="493" y1="330" x2="493" y2="336" stroke="#374151"/><text x="493" y="353" text-anchor="middle">40%</text>
      <line x1="664" y1="330" x2="664" y2="336" stroke="#374151"/><text x="664" y="353" text-anchor="middle">60%</text>
      <line x1="750" y1="330" x2="750" y2="336" stroke="#374151"/><text x="750" y="353" text-anchor="middle">70%</text>
    </g>
    <g stroke="#e5e7eb" stroke-width="1">
      <line x1="321" y1="85" x2="321" y2="330"/>
      <line x1="493" y1="85" x2="493" y2="330"/>
      <line x1="664" y1="85" x2="664" y2="330"/>
    </g>
    <g font-size="14">
      <text x="132" y="130" text-anchor="end">92-bit</text>
      <text x="132" y="205" text-anchor="end">124-bit</text>
      <text x="132" y="280" text-anchor="end">144-bit</text>
    </g>
    <g fill="#2563eb">
      <rect x="150" y="103" width="525" height="38" rx="4"/>
      <rect x="150" y="178" width="519" height="38" rx="4"/>
      <rect x="150" y="253" width="494" height="38" rx="4"/>
    </g>
    <g font-size="14" font-weight="700">
      <text x="685" y="128">61.2%</text>
      <text x="679" y="203">60.6%</text>
      <text x="654" y="278">57.6%</text>
    </g>
    <text x="450" y="385" text-anchor="middle" font-size="13">Reduction in charged leading-norm queries</text>
    <text x="410" y="412" text-anchor="middle" font-size="11" fill="#6b7280">Source: cofactor-collision-selection.md @ 5aebed85; decoding, storage and exact LA remain additional costs.</text>
  </g>
</svg>
