[package]
name = "quadratic-twist-pair-rank-audit"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[[bin]]
name = "pair-rank-audit"
path = "main.rs"
[[bin]]
name = "pair-rank-cert"
path = "cert.rs"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
hex = "0.4"

[[bin]]
name = "pair-rank-frozen-analysis"
path = "frozen-analysis.rs"
