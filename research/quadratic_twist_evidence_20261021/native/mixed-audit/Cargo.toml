[package]
name = "quadratic-twist-mixed-audit"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "quadratic-twist-mixed-audit"
path = "main.rs"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
hex = "0.4"
