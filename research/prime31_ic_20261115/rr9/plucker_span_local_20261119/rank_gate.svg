<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Prime31 RR9 exterior-four span and pairing ranks</title>
  <desc id="desc">All left, right, and pairing ranks equal 70 in N4, P4, N8, and P8. The advance threshold is 35.</desc>
  <rect width="1000" height="560" fill="#0b1020"/>
  <text x="60" y="55" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="700">Prime31 RR9 Pluecker-span gate</text>
  <text x="60" y="86" fill="#94a3b8" font-family="sans-serif" font-size="16">Exact local attempt 03 · fixed linear compression only · PCC standing unverified</text>
  <line x1="190" y1="455" x2="930" y2="455" stroke="#64748b" stroke-width="2"/>
  <line x1="190" y1="110" x2="190" y2="455" stroke="#64748b" stroke-width="2"/>
  <line x1="190" y1="282.5" x2="930" y2="282.5" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="925" y="272" fill="#fbbf24" font-family="sans-serif" font-size="14" text-anchor="end">advance threshold 35</text>
  <line x1="190" y1="110" x2="930" y2="110" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 7" opacity="0.75"/>
  <text x="925" y="101" fill="#86efac" font-family="sans-serif" font-size="14" text-anchor="end">ambient rank 70</text>
  <g fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="end">
    <text x="178" y="460">0</text>
    <text x="178" y="386">15</text>
    <text x="178" y="312">30</text>
    <text x="178" y="238">45</text>
    <text x="178" y="164">60</text>
    <text x="178" y="115">70</text>
  </g>
  <g font-family="sans-serif" font-size="14" text-anchor="middle">
    <g transform="translate(260 0)">
      <rect x="-46" y="110" width="28" height="345" rx="3" fill="#38bdf8"/><rect x="-14" y="110" width="28" height="345" rx="3" fill="#a78bfa"/><rect x="18" y="110" width="28" height="345" rx="3" fill="#34d399"/>
      <text x="0" y="482" fill="#f8fafc" font-weight="700">N4</text><text x="0" y="505" fill="#94a3b8">70 / 70 / 70</text>
    </g>
    <g transform="translate(450 0)">
      <rect x="-46" y="110" width="28" height="345" rx="3" fill="#38bdf8"/><rect x="-14" y="110" width="28" height="345" rx="3" fill="#a78bfa"/><rect x="18" y="110" width="28" height="345" rx="3" fill="#34d399"/>
      <text x="0" y="482" fill="#f8fafc" font-weight="700">P4</text><text x="0" y="505" fill="#94a3b8">70 / 70 / 70</text>
    </g>
    <g transform="translate(640 0)">
      <rect x="-46" y="110" width="28" height="345" rx="3" fill="#38bdf8"/><rect x="-14" y="110" width="28" height="345" rx="3" fill="#a78bfa"/><rect x="18" y="110" width="28" height="345" rx="3" fill="#34d399"/>
      <text x="0" y="482" fill="#f8fafc" font-weight="700">N8</text><text x="0" y="505" fill="#94a3b8">70 / 70 / 70</text>
    </g>
    <g transform="translate(830 0)">
      <rect x="-46" y="110" width="28" height="345" rx="3" fill="#38bdf8"/><rect x="-14" y="110" width="28" height="345" rx="3" fill="#a78bfa"/><rect x="18" y="110" width="28" height="345" rx="3" fill="#34d399"/>
      <text x="0" y="482" fill="#f8fafc" font-weight="700">P8</text><text x="0" y="505" fill="#94a3b8">70 / 70 / 70</text>
    </g>
  </g>
  <g font-family="sans-serif" font-size="14">
    <rect x="60" y="525" width="16" height="12" fill="#38bdf8"/><text x="84" y="536" fill="#cbd5e1">left</text>
    <rect x="150" y="525" width="16" height="12" fill="#a78bfa"/><text x="174" y="536" fill="#cbd5e1">right</text>
    <rect x="245" y="525" width="16" height="12" fill="#34d399"/><text x="269" y="536" fill="#cbd5e1">pairing</text>
