    print(''freeze commit'', want)

    print(''HEAD/printed'', head)

    print(''git diff --quiet exit'', diff)

    print(''porcelain lines/count'', len(status.splitlines()))

    print(status)

    sys.exit(0 if (diff == 0 and status == '''') else 1)

