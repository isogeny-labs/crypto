  - "import glob, json, os, sys\nreceipt = 'research/arity_completion_20261104/koblitz_m5_m6/receipts/CARD-arity-koblitz-m2.receipt.json'\nok = os.path.isfile(receipt)\nprint('m2 receipt', receipt, 'present' if ok else 'MISSING')\nstatus = json.load(open(receipt)).get('status') if ok else None\nprint('m2 receipt status', status)\nbad = []\nfor name in sorted(glob.glob('research/arity_completion_20261104/koblitz_m5_m6/raw/shard2/*.json')):\n    if '\"status\":\"process_error\"' in open(name).read():\n        bad.append(name)\nprint('m2 process_error records', len(bad))\nfor name in bad:\n    print(name)\nsys.exit(0 if (ok and status == 'completed' and not bad) else 1)\n"
