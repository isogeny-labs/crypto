stop_when:
- Any command in the card exits with a status other than 0, or times out; a failed gate stops the card before the shard.
- The m2-precondition command exits with a status other than 0, meaning the m = 2 receipt is missing, its status is not completed, or an m = 2 cell record carries "status":"process_error"; run no m = 5 cell.
- The write-once-m5 command exits with a status other than 0, meaning an m = 5 cell record already exists; run no m = 5 cell.
- The shard-m5 command exits with a status other than 0 or reaches its timeout; a capped cell is recorded by run_shard.sh itself and does not stop the card.
- 'On any stop: report the printed text verbatim, retry nothing and edit nothing.'
notes: Report the printed text verbatim. Per-engine evaluability and the K1 to K7 verdicts are the director assessment through research/arity_completion_20261104/koblitz_m5_m6/analyze.py, never the executor reading of the cell records. run_shard.sh records caps and errors and exits 0, so every stop beyond the m2 process_error gate is the director assessment through analyze.py, and /usr/bin/time and the isolab admission are the job of the executing image. The binary is the one built by CARD-arity-koblitz-build; its sha256 is in research/arity_completion_20261104/koblitz_m5_m6/receipts/n83_msweep_cell.sha256.
