commands:
- id: host-memory
  argv:
  - python3
  - -c
  - 'import re, sys

    kb = int(re.search(r''MemTotal:\s+(\d+) kB'', open(''/proc/meminfo'').read()).group(1))

    print(''MemTotal kB'', kb, ''required kB'', 120 * 1024 * 1024)

    sys.exit(0 if kb >= 120 * 1024 * 1024 else 1)

    '
  timeout_seconds: 60
  success_exit_codes:
  - 0
- id: controls-verdict
  argv:
  - python3
  - -c
  - "import json, sys\nwant = [('ctl-m4-n8-kummer', 4, 8, 6), ('ctl-m3-n15-kummer', 3, 15, 7), ('ctl-m2-n10-kummer', 2, 10, 5)]\nbad = 0\nfor cell, m, n, d in want:\n    rows = []\n    try:\n        for ln in open('research/arity_completion_20261104/prime_tower_m5/cells/' + cell + '.jsonl').read().splitlines():\n            r = json.loads(ln)\n            if isinstance(r, dict) and r.get('m') == m and r.get('N') == n and r.get('kind') == 'kummer':\n                rows.append(r)\n    except OSError:\n        pass\n    ok = len(rows) != 0 and all((not r.get('timed_out')) and (not r.get('oversize')) and r.get('solving_degree_max') == d for r in rows)\n    print('control', cell, 'rows', len(rows), 'recorded D', d, 'ok' if ok else 'MISMATCH')\n    bad += 0 if ok else 1\nsys.exit(1 if bad else 0)\n"
  timeout_seconds: 60
  success_exit_codes:
  - 0
- id: t3-cap-verdict
  argv:
  - python3
  - -c
  - "import json, sys\nbad = 0\nfor kind in ('kummer', 'isogeny'):\n    rows = []\n    try:\n        for ln in open('research/arity_completion_20261104/prime_tower_m5/cells/' + kind + '-m5-t3.jsonl').read().splitlines():\n            r = json.loads(ln)\n            if isinstance(r, dict) and r.get('m') == 5 and r.get('N') == 15:\n                rows.append(r)\n    except OSError:\n        pass\n    ok = len(rows) != 0 and all((not r.get('timed_out')) and (not r.get('oversize')) for r in rows)\n    print('t3 cell', kind, 'rows', len(rows), 'completed within cap' if ok else 'EXCEEDED CAP OR MISSING')\n    bad += 0 if ok else 1\nsys.exit(1 if bad else 0)\n"
  timeout_seconds: 60
  success_exit_codes:
  - 0
