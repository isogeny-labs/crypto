- The host-memory command exits with status 1, meaning the host has less than 120 GiB of memory; run no t = 4 cell.
- The controls-verdict command exits with status 1, meaning a control cell differs from its recorded D or is missing; run no m = 5 cell.
- The t3-cap-verdict command exits with status 1, meaning a t = 3 cell exceeded its cap or has no rows; run no t = 4 cell.
