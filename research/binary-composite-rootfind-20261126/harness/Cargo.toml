[package]
name = "bcr_harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Binary composite IC (subfield factor base) with the tuned S4 root finder vs matched negation-map rho; counted field operations. Includes crypto modules by #[path]."

# Standalone: not a member of the crypto workspace.
[workspace]

