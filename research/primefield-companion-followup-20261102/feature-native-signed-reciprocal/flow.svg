<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250"><rect width="1000" height="250" fill="#f5f7fb"/><g font-family="sans-serif" fill="#172941"><text x="25" y="31" font-size="22">Reciprocal signed-mode constraint — T-1896</text><g fill="white" stroke="#5278a0" stroke-width="2"><rect x="25" y="60" width="220" height="105" rx="8"/><rect x="300" y="60" width="300" height="105" rx="8"/><rect x="655" y="60" width="320" height="105" rx="8"/></g><g font-size="17"><text x="40" y="90">Same public sign orbit</text><text x="40" y="120">weighted modes +1, -1</text><text x="40" y="147">No hidden-scalar input</text><text x="315" y="90">One mode-1 coefficient stream</text><text x="315" y="120">F₁(V) = a(W) + V b(W)</text><text x="315" y="147">N(W) = a² + Wab + b²</text><text x="670" y="90">Branch ε = ±1; W = V + V⁻¹</text><text x="670" y="120">gcd(g, m²σεN − f₊f₋)</text><text x="670" y="147">Orientation remains a next step</text></g><path d="M250 110h40m-9 -7l9 7 -9 7 M605 110h40m-9 -7l9 7 -9 7" fill="none" stroke="#5278a0" stroke-width="3"/><text x="25" y="202" font-size="17">x = 0 handled separately; a zero product can retain both branches.</text><text x="25" y="230" font-size="15">Sources: signed.rs, DERIVATION.md, Norm.lean, validation03/check.stdout. Schematic, not a timing chart.</text></g></svg>
