<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300"><rect width="800" height="300" fill="white"/><rect x="15" y="8" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="33" text-anchor="middle" font-family="sans-serif" font-size="14">Search establishes zero columns 0,...,j-1 and retains c_j</text><rect x="15" y="66" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="91" text-anchor="middle" font-family="sans-serif" font-size="14">j=0: identity transport, unchanged zero extra queries</text><rect x="15" y="124" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="149" text-anchor="middle" font-family="sans-serif" font-size="14">0&lt;j&lt;n-1: query only c_(j+1); derive both corrections</text><rect x="15" y="182" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="207" text-anchor="middle" font-family="sans-serif" font-size="14">j=n-1&gt;0: derive both corrections from cache and zeros</text><rect x="15" y="240" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="265" text-anchor="middle" font-family="sans-serif" font-size="14">Continue unchanged row transport, Schur reduction and lifting</text></svg>