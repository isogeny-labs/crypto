<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280"><rect width="800" height="280" fill="white"/><rect x="10" y="6" width="780" height="38" rx="4" fill="#edf3f6" stroke="#286e89"/><text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="13">q shifted characters: at most 2^q + q public signatures</text><path d="M400 44 v17 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="10" y="61" width="780" height="38" rx="4" fill="#edf3f6" stroke="#286e89"/><text x="400" y="85" text-anchor="middle" font-family="sans-serif" font-size="13">If 2^q + q &lt; r: exclude X by an exact cardinality argument</text><path d="M400 99 v17 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="10" y="116" width="780" height="38" rx="4" fill="#edf3f6" stroke="#286e89"/><text x="400" y="140" text-anchor="middle" font-family="sans-serif" font-size="13">Optional sparse certificate: offer public points to feature-row elimination</text><path d="M400 154 v17 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="10" y="171" width="780" height="38" rx="4" fill="#edf3f6" stroke="#286e89"/><text x="400" y="195" text-anchor="middle" font-family="sans-serif" font-size="13">Keep independent rows; discard consistent dependencies with cost charged</text><path d="M400 209 v17 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="10" y="226" width="780" height="38" rx="4" fill="#edf3f6" stroke="#286e89"/><text x="400" y="250" text-anchor="middle" font-family="sans-serif" font-size="13">Inconsistent dependency: normalize, then independently check all moments</text></svg>