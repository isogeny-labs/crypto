<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280"><rect width="960" height="280" fill="#f5f8fc"/><g font-family="sans-serif" fill="#17324d"><text x="25" y="30" font-size="20">Opposite-radius initialization · T-1878</text><text x="25" y="57" font-size="15">Odd m; even n; k = n/2; public observations at b and −b</text><rect x="25" y="85" width="270" height="92" rx="8" fill="#dceaf7" stroke="#477298"/><text x="37" y="115" font-size="17">Parity split in Y = V²</text><text x="37" y="148" font-size="14">E(Y) = s,  V O(Y) = d</text><rect x="345" y="85" width="270" height="92" rx="8" fill="#dceaf7" stroke="#477298"/><text x="357" y="115" font-size="17">First gcd: degree k</text><text x="357" y="148" font-size="14">g = gcd(Yᵏ − u, E − s)</text><rect x="665" y="85" width="270" height="92" rx="8" fill="#dceaf7" stroke="#477298"/><text x="677" y="115" font-size="17">Restore orientation</text><text x="677" y="148" font-size="14">d = 0: both signs; d ≠ 0: one</text><path d="M295 130h45m275 0h45" stroke="#17324d" stroke-width="3"/><text x="25" y="211" font-size="15">Folded arrays still have n entries; oriented lifting may reach degree n.</text><text x="25" y="239" font-size="15">Cost: second source orbit + norm/gcd/lift. Early recovery can make this trade unfavorable.</text><text x="25" y="265" font-size="13">Derived construction; producer validation02; no timing claim.</text></g></svg>