<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230"><rect width="960" height="230" fill="#f5f8fc"/><g font-family="sans-serif" fill="#17324d"><text x="20" y="30" font-size="20">One bounded engine, two validated stream identities · T-1880</text><rect x="20" y="65" width="270" height="82" rx="8" fill="#dceaf7" stroke="#477298"/><text x="32" y="94" font-size="17">Stream (r,m,cap)</text><text x="32" y="122" font-size="14">Original recurrence and cursor</text><rect x="660" y="65" width="280" height="82" rx="8" fill="#dceaf7" stroke="#477298"/><text x="672" y="94" font-size="17">Stream (r,2m,cap)</text><text x="672" y="122" font-size="14">Doubled recurrence and cursor</text><rect x="335" y="65" width="290" height="82" rx="8" fill="#dceaf7" stroke="#477298"/><text x="347" y="94" font-size="17">Shared interval engine</text><text x="347" y="122" font-size="14">Cache identity: r, width, cap</text><path d="M290 105h40m300 0h25" stroke="#17324d" stroke-width="3"/><text x="20" y="181" font-size="16">Share polynomial and progression tables; reject mismatched keys and borrow conflicts.</text><text x="20" y="210" font-size="15">Retain original width: fewer setups can coexist with more evaluation batches.</text></g></svg>