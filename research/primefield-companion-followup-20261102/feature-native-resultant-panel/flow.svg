<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"><rect width="900" height="380" fill="#f7f9fc"/><g font-family="sans-serif" fill="#17334d"><text x="25" y="35" font-size="22">Prepared panel: inputs and controls, no comparison data</text><g fill="#e6f0f9" stroke="#45779d"><rect x="25" y="65" width="390" height="90" rx="9"/><rect x="475" y="65" width="400" height="90" rx="9"/><rect x="25" y="195" width="850" height="95" rx="9"/></g><g font-size="17"><text x="43" y="93">Native deterministic input generator</text><text x="43" y="119">2 primes × 4 sizes × 3 ratios × 2 classes</text><text x="43" y="143">48 fixed root/point cases + direct oracle</text><text x="493" y="93">Five matched prospective arms</text><text x="493" y="119">Scalar | Euclid | half-GCD | A/A | +1</text><text x="493" y="143">240 rows required; panel not executed</text><text x="43" y="225">Strict analyzer: identities, hashes, order, completeness, oracle and counters</text><text x="43" y="252">A/A must match; positive control must differ only by one Product event</text><text x="43" y="278">Synthetic tests cover rejected rows, bad receipt pins and output overwrite</text></g><path d="M415 110h60M675 155v40" fill="none" stroke="#45779d" stroke-width="3"/><text x="25" y="327" font-size="16">Still required: canonical protocol/export, admitted launcher, preflight and freeze.</text><text x="25" y="355" font-size="16">No cloud submission. No funds reserved. Software checks and fixture construction only.</text></g></svg>
