<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230"><rect width="960" height="230" fill="#f4f8fc"/><g font-family="sans-serif" fill="#17324d"><text x="20" y="30" font-size="22">Three modes from one bounded anchor stream</text><rect x="20" y="60" width="270" height="95" fill="#dceaf7"/><text x="35" y="90" font-size="18">Read c₁₊ⱼₘ once</text><text x="35" y="120" font-size="15">Joint stride + neighbor inversion</text><rect x="340" y="60" width="270" height="95" fill="#b9dfda"/><text x="355" y="90" font-size="18">Derive lower / anchor / upper</text><text x="355" y="120" font-size="15">Restore leading Vᴸ in mode 0</text><rect x="660" y="60" width="280" height="95" fill="#dceaf7"/><text x="675" y="90" font-size="18">Evaluate all in old quotient</text><text x="675" y="120" font-size="15">Then apply the same C0 and C2 gcds</text><path d="M290 105h45m275 0h45" stroke="#17324d" stroke-width="3"/><text x="20" y="188" font-size="17">Tradeoff: one traversal, but modes 1/2 are evaluated before C0 pruning.</text><text x="20" y="215" font-size="15">Optional adapter; at most cap triples and 3·cap denominator entries per refill.</text></g></svg>