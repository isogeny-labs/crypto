<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240"><rect width="900" height="240" fill="#f4f7fa"/><g font-family="sans-serif" fill="#193449"><text x="24" y="30" font-size="19">T-1833 · Euclidean matrix action inside half-GCD</text><rect x="24" y="50" width="260" height="105" rx="10" fill="#d5e8f5"/><text x="40" y="79" font-size="17">Owned matrix M</text><text x="40" y="108" font-size="17">Upper row: a, b</text><text x="40" y="136" font-size="17">Lower row: c, d</text><text x="292" y="110" font-size="24">→</text><rect x="330" y="50" width="240" height="105" rx="10" fill="#cceadd"/><text x="346" y="79" font-size="17">Two products: qc, qd</text><text x="346" y="108" font-size="16">Form a − qc, b − qd</text><text x="346" y="136" font-size="16">Move buffers c, d</text><text x="580" y="110" font-size="24">→</text><rect x="620" y="50" width="255" height="105" rx="10" fill="#e1def4"/><text x="636" y="79" font-size="17">Exact S(q) M</text><text x="636" y="108" font-size="17">Upper row: c, d</text><text x="636" y="136" font-size="17">Lower: a − qc, b − qd</text><text x="24" y="188" font-size="16">Removed field products per step: L(a) + L(b) + L(c) + L(d), with L(0) = 0.</text><text x="24" y="218" font-size="15">General recursive matrix composition remains. No timing or total-memory claim.</text></g></svg>
