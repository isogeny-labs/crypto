<svg xmlns="http://www.w3.org/2000/svg" width="900" height="245"><rect width="900" height="245" fill="#f4f7fa"/><g font-family="sans-serif" fill="#123047"><text x="25" y="30" font-size="21">Balanced homogeneous reciprocal substitution</text><g fill="#dcebf3" stroke="#517b96"><rect x="20" y="60" width="255" height="95" rx="8"/><rect x="320" y="60" width="255" height="95" rx="8"/><rect x="620" y="60" width="255" height="95" rx="8"/></g><g font-size="17"><text x="35" y="90">Split declared vector length</text><text x="35" y="122">a = low + W^k high</text><text x="335" y="90">Recurse on both halves</text><text x="335" y="122">Share powers (V²+1)^k</text><text x="635" y="90">Shift low; multiply high</text><text x="635" y="122">Add homogeneous outputs</text><text x="285" y="110">→</text><text x="585" y="110">→</text><text x="25" y="192">Keep declared lengths even when high coefficients vanish.</text><text x="25" y="225">Certified recovery retains endpoint correction, capacity bounds and point verification.</text></g></g></svg>