<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230"><rect width="900" height="230" fill="#f4f7fa"/><g font-family="sans-serif" fill="#193449"><text x="24" y="30" font-size="19">T-1834 · Exact quotient, short remainder product</text><rect x="24" y="50" width="255" height="100" rx="10" fill="#d5e8f5"/><text x="40" y="79" font-size="17">Unchanged reversal division</text><text x="40" y="109" font-size="16">Compute exact quotient q</text><text x="40" y="135" font-size="15">Leading coefficient inversion retained</text><text x="288" y="108" font-size="24">→</text><rect x="325" y="50" width="250" height="100" rx="10" fill="#cceadd"/><text x="341" y="79" font-size="17">Compute q b modulo X^d</text><text x="341" y="109" font-size="16">At most d output coefficients</text><text x="341" y="135" font-size="15">d = degree of b</text><text x="585" y="108" font-size="24">→</text><rect x="625" y="50" width="250" height="100" rx="10" fill="#e1def4"/><text x="641" y="79" font-size="17">Subtract low coefficients</text><text x="641" y="109" font-size="16">Return same q and r</text><text x="641" y="135" font-size="15">High cancellation proved separately</text><text x="24" y="184" font-size="16">Exact division controls: 1,792 lower product counts · 800 equal · 0 higher (2,592 cases).</text><text x="24" y="214" font-size="15">Finite operation checks, not timing. Recursive temporaries and quotient storage remain.</text></g></svg>
