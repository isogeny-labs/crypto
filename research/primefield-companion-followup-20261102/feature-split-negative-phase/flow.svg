<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300"><rect width="1000" height="300" fill="#f6f8fa"/><g font-family="sans-serif" font-size="18" fill="#172b4d"><text x="25" y="32">Even negative phase: bounded public trace and disjoint quotient split</text><rect x="20" y="60" width="285" height="130" rx="10" fill="#deebff"/><text x="35" y="92">At most 64 public candidates</text><text x="35" y="124">Check η⁴ = −1</text><text x="35" y="156">s = η − η³; check s² = 2</text><path d="M305 125H345" stroke="#172b4d" stroke-width="3"/><rect x="345" y="60" width="290" height="130" rx="10" fill="#d7f2e3"/><text x="360" y="92">Dₙ = (Dₜ − s)(Dₜ + s)</text><text x="360" y="124">t = n/2; coprime factors</text><text x="360" y="156">Retain u = +i and −i</text><path d="M635 125H675" stroke="#172b4d" stroke-width="3"/><rect x="675" y="60" width="305" height="130" rx="10" fill="#deebff"/><text x="690" y="92">Four canonical branches</text><text x="690" y="124">Compare grouped support by u</text><text x="690" y="156">Existing recovery and point check</text><text x="25" y="232">Search exhausted → unsplit domain; insufficient section capacity → seeded streaming.</text><text x="25" y="270">Half each quotient degree, twice the branches. Root search and all added work count.</text></g></svg>
