<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280"><rect width="1000" height="280" fill="#f6f8fa"/><g font-family="sans-serif" font-size="18" fill="#172b4d"><text x="28" y="32">Initial character restricts phase construction</text><rect x="25" y="60" width="260" height="110" rx="10" fill="#deebff"/><text x="42" y="94">Existing public query: s = χ(k)</text><text x="42" y="125">s = 0 → verify identity</text><text x="42" y="152">s = ±1 → normalize by χ(b)</text><path d="M285 112H330" stroke="#172b4d" stroke-width="3"/><rect x="330" y="60" width="300" height="110" rx="10" fill="#d7f2e3"/><text x="347" y="94">Keep phases with u² = s·χ(b)</text><text x="347" y="125">Two of {1, −1, i, −i}</text><text x="347" y="152">Then construct branch polynomials</text><path d="M630 112H675" stroke="#172b4d" stroke-width="3"/><rect x="675" y="60" width="300" height="110" rx="10" fill="#deebff"/><text x="692" y="94">Powered / streamed filtering</text><text x="692" y="125">Replay and point verification</text><text x="692" y="152">Public recovery output</text><text x="28" y="210">Exact support target: G_seed(Z) = gcd(G_old(Z), Z^L − s), Z = k^m</text><text x="28" y="245">Initial mode0 construction and sign extraction remain charged. No timing comparison.</text></g></svg>