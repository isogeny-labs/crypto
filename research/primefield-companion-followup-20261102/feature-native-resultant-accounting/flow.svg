<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370"><rect width="900" height="370" fill="#f6f8fb"/><g font-family="sans-serif" fill="#172b4d"><text x="30" y="35" font-size="22">Projected-resultant accounting boundary</text><rect x="30" y="60" width="840" height="220" rx="12" fill="#e1edf7" stroke="#386b91"/><text x="50" y="88" font-size="16">INSIDE: context + roots + polynomial work + projection + temporary destruction</text><g fill="white" stroke="#386b91"><rect x="55" y="115" width="240" height="66" rx="8"/><rect x="330" y="115" width="240" height="66" rx="8"/><rect x="605" y="115" width="240" height="66" rx="8"/></g><g font-size="17"><text x="75" y="143">Scalar accumulation</text><text x="75" y="166">+ terminal projection</text><text x="350" y="143">Euclidean classes</text><text x="350" y="166">+ terminal projection</text><text x="625" y="143">Half-GCD classes</text><text x="625" y="166">+ terminal projection</text></g><text x="55" y="218" font-size="16">Separate counters: field events | helper calls | observed allocator requests</text><text x="55" y="252" font-size="16">Exit: scalar value; no live interval allocations; error/overflow rejects row</text><text x="30" y="313" font-size="16">OUTSIDE: input parsing, correctness oracle, formatting and receipts</text><text x="30" y="342" font-size="15">Software self-tests only. Comparison panel remains draft and unlaunched.</text></g></svg>
