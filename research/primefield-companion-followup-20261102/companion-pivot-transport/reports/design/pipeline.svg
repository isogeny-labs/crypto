<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300"><rect width="800" height="300" fill="white"/><rect x="15" y="8" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="33" text-anchor="middle" font-family="sans-serif" font-size="15">One charged source query: c = A e0</text><path d="M400 48 v18 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="15" y="66" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="91" text-anchor="middle" font-family="sans-serif" font-size="15">If c = 0: return right-null vector e0 with zero product</text><path d="M400 106 v18 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="15" y="124" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="149" text-anchor="middle" font-family="sans-serif" font-size="15">Otherwise choose first nonzero entry and swap its row to row 0</text><path d="M400 164 v18 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="15" y="182" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="207" text-anchor="middle" font-family="sans-serif" font-size="15">Two transpose queries encode the swap at generator width s+2</text><path d="M400 222 v18 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="15" y="240" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="265" text-anchor="middle" font-family="sans-serif" font-size="15">Transport RHS and left witnesses by the same row permutation</text></svg>