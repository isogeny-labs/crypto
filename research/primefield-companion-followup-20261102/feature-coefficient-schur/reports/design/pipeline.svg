<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280"><rect width="800" height="280" fill="white"/><rect x="10" y="6" width="780" height="38" rx="4" fill="#edf3f6" stroke="#286e89"/><text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="14">Fixed public character basis: m = 1 + q + C(q,2) + C(q,3)</text><path d="M400 44 v17 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="10" y="61" width="780" height="38" rx="4" fill="#edf3f6" stroke="#286e89"/><text x="400" y="85" text-anchor="middle" font-family="sans-serif" font-size="14">Supply 1 or 2 unused points; require E = F C F^T invertible</text><path d="M400 99 v17 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="10" y="116" width="780" height="38" rx="4" fill="#edf3f6" stroke="#286e89"/><text x="400" y="140" text-anchor="middle" font-family="sans-serif" font-size="14">Update C and RHS coefficients u; save only F and H for lifting</text><path d="M400 154 v17 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="10" y="171" width="780" height="38" rx="4" fill="#edf3f6" stroke="#286e89"/><text x="400" y="195" text-anchor="middle" font-family="sans-serif" font-size="14">Supply x with C phi(x) = 0 and h(x) nonzero; seed sparse witness</text><path d="M400 209 v17 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="10" y="226" width="780" height="38" rx="4" fill="#edf3f6" stroke="#286e89"/><text x="400" y="250" text-anchor="middle" font-family="sans-serif" font-size="14">Lift through frames; independently verify every feature moment</text></svg>