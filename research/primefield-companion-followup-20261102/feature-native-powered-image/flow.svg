<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280"><rect width="1000" height="280" fill="#f5f7fb"/><g font-family="sans-serif" fill="#16324b"><text x="24" y="31" font-size="22">Powered canonical recovery — T-1905</text><g fill="white" stroke="#577c9d" stroke-width="2"><rect x="24" y="60" width="250" height="120" rx="8"/><rect x="323" y="60" width="340" height="120" rx="8"/><rect x="712" y="60" width="264" height="120" rx="8"/></g><g font-size="17"><text x="39" y="91">Initial mode-0 construction</text><text x="39" y="123">Existing streamed setup</text><text x="39" y="155">Retain phase and orientation</text><text x="338" y="91">Active quotient fits capacity?</text><text x="338" y="123">Yes: power all m sections once</text><text x="338" y="155">No: retain streamed constraint</text><text x="727" y="91">Same canonical update</text><text x="727" y="123">Powered/fallback scalar phase</text><text x="727" y="155">Replay and point verification</text></g><path d="M279 120h34m-8 -7l8 7 -8 7 M668 120h34m-8 -7l8 7 -8 7" fill="none" stroke="#577c9d" stroke-width="3"/><text x="24" y="216" font-size="17">Direct product: A² · V · F₁(V) · Fₘ₋₁(V) − f₊f₋. No reciprocal evaluation in the powered branch.</text><text x="24" y="252" font-size="15">Source: powered.rs, powered-image.rs and validation03. Capacity rule, not a timing-based selector.</text></g></svg>
