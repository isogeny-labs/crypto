<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220"><rect width="900" height="220" fill="#f2f7fa"/><g font-family="sans-serif" font-size="19" fill="#17364b"><text x="20" y="35">Dense indicator → candidate count m and power sums</text><text x="20" y="80">m ≤ threshold → Newton identities → G(X) = ∏(X−candidate)</text><text x="20" y="125">Next sign → modular power in F_r[X]/G → monic gcd</text><text x="20" y="170">degree(G)=1 → candidate → verify [candidate]P = Q</text><text x="20" y="204" font-size="16">Dense arrays dropped after conversion; degree never increases</text></g></svg>