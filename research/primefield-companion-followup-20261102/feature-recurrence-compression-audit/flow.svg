<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270"><rect width="1000" height="270" fill="#f5f7fb"/><g font-family="sans-serif" fill="#16324b"><text x="24" y="31" font-size="22">Residue-section powering — T-1904</text><g fill="white" stroke="#587fa3" stroke-width="2"><rect x="24" y="60" width="265" height="120" rx="8"/><rect x="337" y="60" width="315" height="120" rx="8"/><rect x="700" y="60" width="275" height="120" rx="8"/></g><g font-size="17"><text x="39" y="90">Supplied quotient R = Fᵣ[Y]/g</text><text x="39" y="122">Any quotient value v</text><text x="39" y="153">No coefficient vector</text><text x="352" y="90">Binary power (X−1)ʰ</text><text x="352" y="122">Reduce by Xᵐ = v</text><text x="352" y="153">Keep m components over R</text><text x="715" y="90">Return F₀(v), …, Fₘ₋₁(v)</text><text x="715" y="122">Cost depends on m and deg(g)</text><text x="715" y="153">Integrate after pruning next</text></g><path d="M294 120h33m-8 -7l8 7 -8 7 M657 120h33m-8 -7l8 7 -8 7" fill="none" stroke="#587fa3" stroke-width="3"/><text x="24" y="216" font-size="17">Large-field check: 34 algebra products; mode-1 length 71,303,168; m = 7.</text><text x="24" y="247" font-size="15">Source: power.rs and validation03/check.stdout. Algebra-product count, not a timing or field-product ratio.</text></g></svg>
