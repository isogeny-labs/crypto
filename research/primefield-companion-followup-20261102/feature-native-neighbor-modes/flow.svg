<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240"><rect width="900" height="240" fill="#f4f7fa"/><g font-family="sans-serif" fill="#17324d"><text x="22" y="30" font-size="20">One long-stride stream → paired neighboring coefficients</text><rect x="25" y="55" width="395" height="88" fill="#dceaf6"/><rect x="480" y="55" width="395" height="88" fill="#dcefe2"/><text x="42" y="85" font-size="17">F1 anchor: c(N), N = jm + 1</text><text x="42" y="117" font-size="17">Bounded chunk; existing stride recurrence</text><text x="497" y="85" font-size="17">F2: −c(N)(h−N)/(N+1)</text><text x="497" y="117" font-size="17">Batch inverse; 1 ≤ N, N+1 ≤ h</text><text x="28" y="182" font-size="17">Joint balanced evaluation → shared phase branches → unchanged canonical update</text><text x="28" y="216" font-size="15">Producer correctness evidence • Added inversions and multiplication work explicitly charged</text></g></svg>