<svg xmlns="http://www.w3.org/2000/svg" width="900" height="225" viewBox="0 0 900 225"><rect width="900" height="225" fill="#f4f7fa"/><g font-family="sans-serif" fill="#193449"><text x="24" y="30" font-size="19">T-1832 · Fuse the singleton tail into the existing baby loop</text><rect x="24" y="50" width="255" height="90" rx="10" fill="#d5e8f5"/><text x="40" y="78" font-size="17">Public tail center z</text><text x="40" y="106" font-size="15">Known before the loop</text><text x="288" y="100" font-size="24">→</text><rect x="325" y="50" width="255" height="90" rx="10" fill="#cceadd"/><text x="341" y="78" font-size="17">For each prefix coordinate x</text><text x="341" y="106" font-size="15">Accumulate (z − x) modulo p</text><text x="588" y="100" font-size="24">→</text><rect x="625" y="50" width="250" height="90" rx="10" fill="#e1def4"/><text x="641" y="78" font-size="17">Same tail resultant class</text><text x="641" y="106" font-size="15">Existing scale/sign combination</text><text x="24" y="173" font-size="16">Derived for s ≥ 1: s − 1 field products; zero inversions; O(1) tail accumulator storage.</text><text x="24" y="203" font-size="15">No prefix vector or tail coefficient polynomial. Main nonsingleton resultant remains.</text></g></svg>
