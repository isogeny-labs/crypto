<svg xmlns="http://www.w3.org/2000/svg" width="960" height="215"><rect width="960" height="215" fill="#f4f8fc"/><g font-family="sans-serif" fill="#17324d"><text x="20" y="30" font-size="22">Remove work after the last needed value</text><rect x="20" y="60" width="430" height="95" fill="#dceaf7"/><text x="35" y="90" font-size="19">Power: consume bit → shift exponent</text><text x="35" y="120" font-size="16">Square only if another bit remains</text><rect x="500" y="60" width="440" height="95" fill="#b9dfda"/><text x="515" y="90" font-size="19">Prefix inverse: process indices N−1 … 1</text><text x="515" y="120" font-size="16">Write accumulated inverse directly at index 0</text><text x="20" y="190" font-size="17">Retain caller inverse checks; test empty/singleton batches and exponent zero.</text></g></svg>