<svg xmlns="http://www.w3.org/2000/svg" width="960" height="215"><rect width="960" height="215" fill="#f5f8fc"/><g font-family="sans-serif" fill="#17324d"><text x="20" y="28" font-size="20">Public width plan before first use · T-1884</text><rect x="20" y="60" width="280" height="80" rx="8" fill="#dceaf7" stroke="#477298"/><text x="32" y="90" font-size="16">Eligible public schedule</text><text x="32" y="119" font-size="14">Odd m; opposite radii; 8m | r−1</text><rect x="340" y="60" width="280" height="80" rx="8" fill="#dceaf7" stroke="#477298"/><text x="352" y="90" font-size="16">Plan width from 2m</text><text x="352" y="119" font-size="14">Bound by the same block cap</text><rect x="660" y="60" width="280" height="80" rx="8" fill="#dceaf7" stroke="#477298"/><text x="672" y="90" font-size="16">One engine for both strides</text><text x="672" y="119" font-size="14">Retain separate stream identities</text><path d="M300 100h35m285 0h35" stroke="#17324d" stroke-width="3"/><text x="20" y="178" font-size="16">Record first-stream costs even if no rescue occurs; do not select width from outcomes.</text><text x="20" y="203" font-size="14">Exact coefficients and source queries stay fixed; setup, cache size and evaluation mix can change.</text></g></svg>