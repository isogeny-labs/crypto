<svg xmlns="http://www.w3.org/2000/svg" width="960" height="235"><rect width="960" height="235" fill="#f5f8fc"/><g font-family="sans-serif" fill="#17324d"><text x="20" y="28" font-size="20">Scoped engine borrowing · T-1881</text><rect x="20" y="62" width="280" height="86" rx="8" fill="#dceaf7" stroke="#477298"/><text x="32" y="92" font-size="16">Original context owns engine</text><text x="32" y="124" font-size="14">Owned(RefCell&lt;Engine&gt;)</text><rect x="350" y="62" width="270" height="86" rx="8" fill="#dceaf7" stroke="#477298"/><text x="362" y="92" font-size="16">Doubled context borrows it</text><text x="362" y="124" font-size="14">Borrowed(&amp;RefCell&lt;Engine&gt;)</text><rect x="670" y="62" width="270" height="86" rx="8" fill="#dceaf7" stroke="#477298"/><text x="682" y="92" font-size="16">Owner cannot be escaped</text><text x="682" y="124" font-size="14">Compile-only probe: E0515</text><path d="M300 105h45m275 0h45" stroke="#17324d" stroke-width="3"/><text x="20" y="184" font-size="16">Same cell, cache identity, width and query policy; no Rc ownership operations.</text><text x="20" y="214" font-size="15">Tradeoff: context layout 264 bytes versus 32-byte prior Rc handle structure.</text></g></svg>