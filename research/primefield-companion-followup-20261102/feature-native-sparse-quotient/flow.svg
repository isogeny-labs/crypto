<svg xmlns="http://www.w3.org/2000/svg" width="900" height="235" viewBox="0 0 900 235"><rect width="900" height="235" fill="#f4f7fa"/><g font-family="sans-serif" fill="#193449"><text x="24" y="30" font-size="19">T-1839 · Sparse relevant divisor band, arbitrary quotient length</text><rect x="24" y="58" width="245" height="102" rx="10" fill="#d5e8f5"/><text x="40" y="88" font-size="17">Inspect the leading band</text><text x="40" y="116" font-size="15">At most min(deg(b), n−1) entries</text><text x="40" y="143" font-size="15">Stop on second nonzero term</text><text x="279" y="108" font-size="24">→</text><rect x="320" y="50" width="260" height="58" rx="8" fill="#cceadd"/><text x="336" y="75" font-size="16">Zero or one subleading term</text><text x="336" y="97" font-size="15">C[i] = (A[i] − beta C[i−j]) / alpha</text><rect x="320" y="120" width="260" height="58" rx="8" fill="#e1def4"/><text x="336" y="145" font-size="16">Two relevant nonzero terms</text><text x="336" y="167" font-size="15">Retained Newton field arithmetic</text><text x="590" y="108" font-size="24">→</text><rect x="630" y="58" width="245" height="102" rx="10" fill="#d5e8f5"/><text x="646" y="89" font-size="17">Same quotient</text><text x="646" y="119" font-size="16">Full divisor still used for remainder</text><text x="646" y="145" font-size="15">Lower coefficients are not discarded</text><text x="24" y="212" font-size="16">Derived: at most 2n−1 field products; one output vector; scan and reversal costs charged.</text></g></svg>
