<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300"><rect width="1000" height="300" fill="#f6f8fa"/><g font-family="sans-serif" font-size="18" fill="#172b4d"><text x="25" y="30">Initial mode constraints without a binomial coefficient scan</text><rect x="20" y="55" width="280" height="120" rx="10" fill="#deebff"/><text x="35" y="85">Slots ≥ 2m·phase_degree</text><text x="35" y="115">Dickson doubling → Dₙ(W)</text><text x="35" y="145">Squarefree phase domain</text><path d="M300 115H345" stroke="#172b4d" stroke-width="3"/><rect x="345" y="55" width="300" height="120" rx="10" fill="#d7f2e3"/><text x="360" y="85">Canonical phase Vⁿ = u</text><text x="360" y="115">(X − 1)ʰ mod (Xᵐ − V)</text><text x="360" y="145">All sections F₀,…,Fₘ₋₁</text><path d="M645 115H690" stroke="#172b4d" stroke-width="3"/><rect x="690" y="55" width="290" height="120" rx="10" fill="#deebff"/><text x="705" y="85">Filter mode0</text><text x="705" y="115">Reuse signed-mode sections</text><text x="705" y="145">Existing updates and recovery</text><text x="25" y="220">Capacity rejection → existing seeded streaming initializer</text><text x="25" y="255">Degree n = (r − 1)/(4m), quotient work and source extraction remain charged.</text><text x="25" y="285">Logical coefficient capacity is not peak RAM. No timing ranking.</text></g></svg>