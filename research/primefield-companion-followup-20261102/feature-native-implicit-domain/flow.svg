<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220"><rect width="900" height="220" fill="#f5f8fa"/><g font-family="sans-serif" font-size="16" fill="#19334a"><text x="20" y="28">T-1850 · Exact image-domain state without initial expansion</text><rect x="20" y="55" width="240" height="100" rx="8" fill="#d3e8f4"/><text x="34" y="82">Implicit U = Z^(d+1) − Z</text><text x="34" y="110">Only r, m, degree stored</text><text x="34" y="138">Zero constraint: retain U</text><text x="275" y="105">→</text><rect x="310" y="55" width="280" height="100" rx="8" fill="#cce9df"/><text x="324" y="82">Nonzero constraint C</text><text x="324" y="110">T = Z^(d+1) mod C</text><text x="324" y="138">G = monic gcd(C, T − Z mod C)</text><text x="605" y="105">→</text><rect x="640" y="55" width="240" height="100" rx="8" fill="#e1e2f2"/><text x="654" y="82">Dense retained G</text><text x="654" y="110">Existing phase / replay</text><text x="654" y="138">Same public verification</text><text x="20" y="191">Implicit pullback has degree r: check cap first, then (only if admitted) allocate X^r − X.</text></g></svg>
