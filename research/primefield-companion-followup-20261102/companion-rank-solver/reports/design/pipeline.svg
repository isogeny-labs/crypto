<svg xmlns="http://www.w3.org/2000/svg" width="800" height="355"><rect width="800" height="355" fill="white"/><rect x="15" y="8" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="33" text-anchor="middle" font-family="sans-serif" font-size="14">Compress generators exactly in the same prime field</text><path d="M400 48 v18 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="15" y="66" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="91" text-anchor="middle" font-family="sans-serif" font-size="14">Zero source: b=0 gives x=0; otherwise w=e_i/b_i</text><path d="M400 106 v18 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="15" y="124" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="149" text-anchor="middle" font-family="sans-serif" font-size="14">Nonzero source: query columns and move a scalar pivot to (0,0)</text><path d="M400 164 v18 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="15" y="182" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="207" text-anchor="middle" font-family="sans-serif" font-size="14">Invert that scalar; construct Schur generators and reduced RHS</text><path d="M400 222 v18 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="15" y="240" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="265" text-anchor="middle" font-family="sans-serif" font-size="14">Repeat, then lift through frames and undo the correct permutations</text><path d="M400 280 v18 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="15" y="298" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="323" text-anchor="middle" font-family="sans-serif" font-size="14">Check A x=b or A^T w=0 and w^T b=1 on the original source</text></svg>