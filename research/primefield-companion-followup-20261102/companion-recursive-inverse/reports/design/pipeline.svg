<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300"><rect width="800" height="300" fill="white"/><rect x="15" y="8" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="33" text-anchor="middle" font-family="sans-serif" font-size="15">Source generators (N, s): distinct wraps in the same prime field</text><path d="M400 48 v18 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="15" y="66" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="91" text-anchor="middle" font-family="sans-serif" font-size="15">Two source queries give leading E generators of width s+2</text><path d="M400 106 v18 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="15" y="124" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="149" text-anchor="middle" font-family="sans-serif" font-size="15">Prepare E inverse; form Schur generators; prepare S inverse</text><path d="M400 164 v18 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="15" y="182" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="207" text-anchor="middle" font-family="sans-serif" font-size="15">Apply 2s block solves to compile width-s inverse generators</text><path d="M400 222 v18 m-4 -5 l4 5 l4 -5" fill="none" stroke="#286e89"/><rect x="15" y="240" width="770" height="40" rx="5" fill="#edf3f6" stroke="#286e89"/><text x="400" y="265" text-anchor="middle" font-family="sans-serif" font-size="15">Reuse: one generated inverse application per new right-hand side</text></svg>