<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250"><rect width="880" height="250" fill="white"/><g font-family="sans-serif" fill="#142b43"><text x="20" y="28" font-size="21">Local Miller evaluation: retain order and leading coefficient</text><rect x="20" y="50" width="265" height="75" fill="#e4eef8"/><text x="32" y="79" font-size="17">Line / vertical line</text><text x="32" y="106" font-size="16">Zeros represented, not divided</text><text x="300" y="96" font-size="25">→</text><rect x="345" y="50" width="245" height="75" fill="#dcf0e5"/><text x="357" y="79" font-size="17">Binary Miller chain</text><text x="357" y="106" font-size="16">(order, coefficient)</text><text x="603" y="96" font-size="25">→</text><rect x="645" y="50" width="215" height="75" fill="#e4eef8"/><text x="657" y="79" font-size="17">Regularized value</text><text x="657" y="106" font-size="16">or local zero term</text><text x="20" y="162" font-size="17">Ordinary subgroup point: update c(T+S) from c(S), c(T) and f(T).</text><text x="20" y="195" font-size="17">Self-zero: obtain −c(S)². The oriented sign remains an input dependency.</text><text x="20" y="230" font-size="15">PCC-20261107-b635c0: unsigned. Four native software methods pass; no timing claim.</text></g></svg>