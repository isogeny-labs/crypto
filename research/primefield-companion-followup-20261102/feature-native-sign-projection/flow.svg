<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230"><rect width="760" height="230" fill="white"/><g font-family="sans-serif" font-size="17" fill="#17324d"><rect x="20" y="25" width="290" height="65" fill="#e8f1fa" stroke="#17324d"/><text x="35" y="53">Full multiplicative value W</text><text x="35" y="77">nonzero, in F_p</text><path d="M310 58 H435" stroke="#17324d" stroke-width="2"/><text x="335" y="45">power m</text><rect x="435" y="25" width="305" height="65" fill="#e8f1fa" stroke="#17324d"/><text x="450" y="53">Image U = W^m</text><text x="450" y="77">order q = 2^v2(p-1)</text><text x="25" y="130">Products and transport commute with projection.</text><text x="25" y="160">A promised +1 / -1 sign is preserved.</text><text x="25" y="195" fill="#9b301b">Non-sign rejection and arbitrary addition do not survive.</text></g></svg>
