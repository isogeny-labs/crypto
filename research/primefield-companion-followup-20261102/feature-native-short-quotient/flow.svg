<svg xmlns="http://www.w3.org/2000/svg" width="900" height="235" viewBox="0 0 900 235"><rect width="900" height="235" fill="#f4f7fa"/><g font-family="sans-serif" fill="#193449"><text x="24" y="30" font-size="19">T-1837 · Degree-directed quotient construction</text><rect x="24" y="58" width="230" height="100" rx="10" fill="#d5e8f5"/><text x="40" y="88" font-size="17">Canonical a, b</text><text x="40" y="116" font-size="16">n = deg(a) − deg(b) + 1</text><text x="40" y="143" font-size="15">Leading inverse reused if needed</text><text x="269" y="108" font-size="24">→</text><rect x="310" y="50" width="260" height="58" rx="8" fill="#cceadd"/><text x="326" y="75" font-size="16">Nonzero a, n = 1 or 2</text><text x="326" y="97" font-size="15">Direct highest-coefficient formulas</text><rect x="310" y="120" width="260" height="58" rx="8" fill="#e1def4"/><text x="326" y="145" font-size="16">n ≥ 3, or zero dividend</text><text x="326" y="167" font-size="15">Unchanged Newton reversal</text><text x="584" y="108" font-size="24">→</text><rect x="625" y="58" width="250" height="100" rx="10" fill="#d5e8f5"/><text x="641" y="89" font-size="17">Same quotient q</text><text x="641" y="119" font-size="16">Existing short remainder product</text><text x="641" y="145" font-size="15">General and monic tree paths</text><text x="24" y="212" font-size="16">Proved for n = 2: at least one field multiplication removed; inversion count unchanged.</text></g></svg>
