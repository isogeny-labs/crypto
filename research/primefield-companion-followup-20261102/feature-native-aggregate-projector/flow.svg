<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210"><rect width="900" height="210" fill="#f1f7fa"/><g font-family="sans-serif" font-size="19" fill="#17364b"><text x="20" y="35">Public Q+iP → standalone sign s → exact indicator E(a,s)</text><text x="20" y="80">Update I ← I·E mod (X^r − X)</text><text x="20" y="125">Count N = −coeff[r−1]</text><text x="470" y="125">Moment M = −coeff[r−2]</text><text x="20" y="170">N=1 → candidate M → verify [M]P = Q</text><text x="20" y="198" font-size="15">No subset expansion; coefficient state still has dimension r</text></g></svg>