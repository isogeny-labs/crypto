<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690">
 <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#506079"/></marker></defs>
 <rect width="1120" height="690" fill="#f6f8fc"/>
 <g font-family="Helvetica" fill="#172c45">
  <text x="35" y="43" font-size="25" font-weight="bold">Seven arms, one public-input recovery contract</text>
  <text x="35" y="72" font-size="15">Prime31 coordinates: p=2147483647. Relation arithmetic: r=2147446831. Structured correctness fixture.</text>
  <rect x="35" y="96" width="1050" height="76" rx="10" fill="#e5ebf3" stroke="#a4b4c8"/>
  <text x="55" y="124" font-size="18" font-weight="bold">Inside each arm: construct family, admit public Q, construct signed factor base</text>
  <text x="55" y="151" font-size="15">Same Q+[a]G policy, original equations and domains. Expected scalars stay in the calling checks.</text>
  <path d="M195 172V194M560 172V194M925 172V194" fill="none" stroke="#506079" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M190 190L195 199L200 190ZM555 190L560 199L565 190ZM920 190L925 199L930 190Z" fill="#506079"/>
  <rect x="35" y="201" width="320" height="230" rx="10" fill="#fff" stroke="#9db0c7"/>
  <rect x="400" y="201" width="320" height="230" rx="10" fill="#fff" stroke="#9db0c7"/>
  <rect x="765" y="201" width="320" height="230" rx="10" fill="#fff" stroke="#2e7c89"/>
  <text x="55" y="233" font-size="22" font-weight="bold">Original · 1 arm</text>
  <text x="55" y="268" font-size="16">No Macaulay object</text>
  <text x="55" y="302" font-size="15">For every query abscissa z:</text>
  <text x="55" y="329" font-size="15">specialize the original equations</text>
  <text x="55" y="356" font-size="15">and pass them directly to F4.</text>
  <text x="55" y="405" font-size="14" fill="#506079">No preconditioning backend</text>
  <text x="420" y="233" font-size="22" font-weight="bold">Fresh · 3 arms</text>
  <text x="420" y="268" font-size="16">Prepare envelope metadata</text>
  <text x="420" y="302" font-size="15">For every z: assemble [ U ; T(z) ]</text>
  <text x="420" y="329" font-size="15">and perform fresh exact reduction.</text>
  <text x="420" y="356" font-size="15">No shared projections or pivots.</text>
  <text x="420" y="405" font-size="14" fill="#506079">Integer / FMA / Split16</text>
  <text x="785" y="233" font-size="22" font-weight="bold">Shared · 3 arms</text>
  <text x="785" y="268" font-size="16">Once: reduce U to [ I | B ]</text>
  <text x="785" y="302" font-size="15">Project Rk = Ck − Ak B.</text>
  <text x="785" y="329" font-size="15">For every z: R(z) = Σ z^k Rk.</text>
  <text x="785" y="356" font-size="15">Recombine, then reduce residual.</text>
  <text x="785" y="405" font-size="14" fill="#506079">Integer / FMA / Split16</text>
  <path d="M195 431V452H560M925 431V452H560M560 431V468" fill="none" stroke="#506079" stroke-width="2"/>
  <path d="M560 452V468" fill="none" stroke="#506079" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M555 465L560 474L565 465Z" fill="#506079"/>
  <rect x="35" y="476" width="1050" height="67" rx="10" fill="#ddeef0" stroke="#2e7c89"/>
  <text x="55" y="503" font-size="18" font-weight="bold">Production integer F4 → signed lift → original-equation and group replay</text>
  <text x="55" y="529" font-size="15">Keep original equations, unrestricted u, actual accepted tuples, failed attempts and stopping reasons.</text>
  <path d="M365 543V562" stroke="#506079" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M360 559L365 568L370 559Z" fill="#506079"/>
  <rect x="35" y="570" width="650" height="63" rx="10" fill="#e5ebf3" stroke="#a4b4c8"/>
  <text x="55" y="596" font-size="17" font-weight="bold">Existing IncrementalGauss modulo r</text>
  <text x="55" y="620" font-size="14">Explicit G anchor; retain dependent rows, rank changes and decision scans.</text>
  <path d="M685 601H721" stroke="#506079" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M718 596L727 601L718 606Z" fill="#506079"/>
  <rect x="730" y="570" width="355" height="63" rx="10" fill="#ddeef0" stroke="#2e7c89"/>
  <text x="750" y="596" font-size="17" font-weight="bold">Verify [k]G = Q</text>
  <text x="750" y="620" font-size="14">Accept only after the public group check.</text>
  <text x="35" y="658" font-size="14" fill="#506079">Phase counters are partial. Family/base setup is performed but unpriced. No timing or complete-cost result.</text>
  <text x="35" y="679" font-size="12" fill="#506079">PR #4922 · REPORT.md, sections 1–3 and 8 · finite affine chart · no uniform-target benchmark</text>
 </g>
</svg>
