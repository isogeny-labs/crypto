<rect class="c2" x="324.9" y="360" width="11" height="11" rx="2"/><text class="q" x="340.9" y="369.5" font-size="11">C++ emulation arm (backend=emulate)</text>
<rect class="c3" x="579.4" y="360" width="11" height="11" rx="2"/><text class="q" x="595.4" y="369.5" font-size="11">worker=native, all threads (4)</text>
