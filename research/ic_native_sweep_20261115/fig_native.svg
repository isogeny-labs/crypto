<text class="p" x="200" y="235.5" font-size="12" text-anchor="end">m = 3, log2 r = 33.4, |F_x| = 2048</text>
<rect class="c1" x="210" y="210" width="75.6" height="13" rx="2"/><text class="q" x="290.6" y="220.5" font-size="10.5">0.56×</text>
<rect class="c2" x="210" y="225" width="307.1" height="13" rx="2"/><text class="q" x="522.1" y="235.5" font-size="10.5">2.27×</text>
<rect class="c3" x="210" y="240" width="304.2" height="13" rx="2"/><text class="q" x="519.2" y="250.5" font-size="10.5">2.24×</text>
<text class="p" x="200" y="294.5" font-size="12" text-anchor="end">m = 3, log2 r = 35.2, |F_x| = 2048</text>
<rect class="c1" x="210" y="269" width="103.9" height="13" rx="2"/><text class="q" x="318.9" y="279.5" font-size="10.5">0.77×</text>
