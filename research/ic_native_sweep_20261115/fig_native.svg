<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 374" width="900" height="374" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Relation-phase speed-up of multi-threaded CPU sweeps over one thread</title>
<desc id="d">Median relation-phase wall of rootfind-subtract one thread divided by each arm's, on a 4-thread VM, L0; the native and emulation sweeps are within 11% of each other.</desc>
<style>.bg{fill:#fcfcfb}.c1{fill:#8f8e89}.c2{fill:#86b6ee}.c3{fill:#2a78d6}.p{fill:#0b0b0b}.q{fill:#52514e}.g{stroke:#e4e3df}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.c1{fill:#8f8e89}.c2{fill:#1f5ea8}.c3{fill:#3987e5}.p{fill:#f0efec}.q{fill:#c3c2b7}.g{stroke:#383835}}</style>
<rect class="bg" width="900" height="374"/>
<text class="p" x="20" y="30" font-size="17" font-weight="600">Multi-threaded CPU sweeps: relation-phase speed-up over one thread</text>
<text class="q" x="20" y="52" font-size="12.5">4-thread VM, L0, median of 4 [pcc:unverified]; identical S, relations and logarithm in all 48 checks</text>
<line class="g" x1="210.0" x2="210.0" y1="84" y2="334"/><text class="q" x="210.0" y="350" font-size="11" text-anchor="middle">0×</text>
<line class="g" x1="345.6" x2="345.6" y1="84" y2="334"/><text class="q" x="345.6" y="350" font-size="11" text-anchor="middle">1×</text>
<line class="g" x1="481.1" x2="481.1" y1="84" y2="334"/><text class="q" x="481.1" y="350" font-size="11" text-anchor="middle">2×</text>
<line class="g" x1="616.7" x2="616.7" y1="84" y2="334"/><text class="q" x="616.7" y="350" font-size="11" text-anchor="middle">3×</text>
<line class="g" x1="752.2" x2="752.2" y1="84" y2="334"/><text class="q" x="752.2" y="350" font-size="11" text-anchor="middle">4×</text>
<text class="p" x="200" y="117.5" font-size="12" text-anchor="end">m = 2, log2 r = 27.5, |F_x| = 4096</text>
<rect class="c1" x="210" y="92" width="116.2" height="13" rx="2"/><text class="q" x="331.2" y="102.5" font-size="10.5">0.86×</text>
<rect class="c2" x="210" y="107" width="384.6" height="13" rx="2"/><text class="q" x="599.6" y="117.5" font-size="10.5">2.84×</text>
<rect class="c3" x="210" y="122" width="426.4" height="13" rx="2"/><text class="q" x="641.4" y="132.5" font-size="10.5">3.15×</text>
<text class="p" x="200" y="176.5" font-size="12" text-anchor="end">m = 2, log2 r = 30.0, |F_x| = 4096</text>
<rect class="c1" x="210" y="151" width="125.6" height="13" rx="2"/><text class="q" x="340.6" y="161.5" font-size="10.5">0.93×</text>
<rect class="c2" x="210" y="166" width="451.4" height="13" rx="2"/><text class="q" x="666.4" y="176.5" font-size="10.5">3.33×</text>
