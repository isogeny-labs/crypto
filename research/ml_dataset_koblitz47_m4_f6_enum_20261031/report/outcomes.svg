<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">Koblitz47 m4 verified method artifacts and instruction coverage</title>
<desc id="desc">Eight F6 and eight enumeration cells have verified method artifacts. Zero of sixteen cells have a complete whole-worker instruction label.</desc>
<rect width="760" height="300" fill="white"/>
<text x="25" y="34" font-family="sans-serif" font-size="20" fill="#172238">Koblitz n=47, m=4: 16 retained cells</text>
<text x="25" y="80" font-family="sans-serif" font-size="15">F6 pair index</text>
<rect x="190" y="59" width="400" height="30" fill="#247d68"/>
<text x="605" y="81" font-family="sans-serif" font-size="15">8 verified</text>
<text x="25" y="132" font-family="sans-serif" font-size="15">Enumeration</text>
<rect x="190" y="111" width="400" height="30" fill="#247d68"/>
<text x="605" y="133" font-family="sans-serif" font-size="15">8 verified</text>
<text x="25" y="187" font-family="sans-serif" font-size="15">Whole-worker PMU label</text>
<circle cx="194" cy="177" r="5" fill="#ca6b35"/>
<text x="605" y="184" font-family="sans-serif" font-size="15">0 eligible</text>
<line x1="190" y1="216" x2="590" y2="216" stroke="#52606d"/>
<text x="186" y="238" font-family="sans-serif" font-size="13">0</text><text x="385" y="238" font-family="sans-serif" font-size="13">4</text><text x="585" y="238" font-family="sans-serif" font-size="13">8 cells</text>
<text x="25" y="278" font-family="sans-serif" font-size="13" fill="#52606d">Both twists: four verified cells per method. Independent scalar labels: 0.</text>
</svg>
