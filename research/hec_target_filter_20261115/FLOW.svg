<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330">
<rect width="1000" height="330" fill="#f4f8fa"/>
<g font-family="Arial,sans-serif" fill="#233746">
<text x="25" y="33" font-size="23" font-weight="bold">Identical supports do not certify identical target information</text>
<rect x="25" y="56" width="455" height="160" rx="8" fill="#e3f2ec"/>
<rect x="520" y="56" width="455" height="160" rx="8" fill="#fae9e5"/>
<text x="45" y="89" font-size="21">System A over F₅</text>
<text x="45" y="125" font-size="24">x + y + k = 0</text>
<text x="45" y="160" font-size="24">x + y = 0</text>
<text x="45" y="197" font-size="21" font-weight="bold">Feasible k: {0}</text>
<text x="540" y="89" font-size="21">System B over F₅</text>
<text x="540" y="125" font-size="24">x + y + k = 0</text>
<text x="540" y="160" font-size="24">x + 2y = 0</text>
<text x="540" y="197" font-size="21" font-weight="bold">Feasible k: all of F₅</text>
<text x="25" y="254" font-size="20">Exact projection: yᵀ C x = yᵀ d for every y with yᵀ B = 0.</text>
<text x="25" y="288" font-size="18">Safe singleton: eliminate a non-target variable's sole row; retain a reverse extension witness.</text>
<text x="25" y="316" font-size="17">Protect target columns, normalize cancellations, and keep inconsistent zero rows.</text>
</g></svg>
