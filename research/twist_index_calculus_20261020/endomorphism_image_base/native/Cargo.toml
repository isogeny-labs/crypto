[package]
name = "twist-endomorphism-image-study"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = "0.10"
hex = "0.4"
rayon = "1.10"

[profile.release]
opt-level = 3
