[package]
name = "twist-pure-zero-verify"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "twist-historical-s5-match"
path = "src/historical_match.rs"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = "0.10"
hex = "0.4"
