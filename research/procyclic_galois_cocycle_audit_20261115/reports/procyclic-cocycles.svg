<text x="9" y="22" font-size="8.1" font-family="DejaVu Sans,sans-serif">Actual Krull Galois</text>
<text x="116" y="18" font-size="7.6" font-family="DejaVu Sans,sans-serif">q-Frobenius fixes exactly K; closed generated group is whole</text>
<text x="116" y="32" font-size="7.6" font-family="DejaVu Sans,sans-serif">Density derived using the infinite Galois correspondence</text>
