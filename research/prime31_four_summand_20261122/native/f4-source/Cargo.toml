[package]
name = "rr5-original-f4-closure"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "crypto_lib"
path = "src/lib.rs"
test = false
doctest = false

[features]
default = []
wide-vars = []

[dependencies]
certified-relations = { path = "../../../../crates/certified-relations" }
relation-replay-checker = { path = "../../../../crates/relation-replay-checker" }
hex = "0.4"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }

[build-dependencies]
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10"
