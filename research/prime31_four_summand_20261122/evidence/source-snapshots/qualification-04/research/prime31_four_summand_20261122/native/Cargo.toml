[package]
name = "prime31-four-summand"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "prime31_four_summand"
path = "lib.rs"

[[bin]]
name = "prime31-four-summand"
path = "main.rs"

[dependencies]
prime31-algebraic-ic = { path = "original-native" }
crypto_lib = { package = "rr5-original-f4-closure", path = "f4-source" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 1
debug = 0
lto = false
codegen-units = 64

[profile.release.package.rr5-original-f4-closure]
opt-level = 0
codegen-units = 256
