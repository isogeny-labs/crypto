<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" font-family="system-ui,Arial,sans-serif" font-size="13">
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="360" y="24" text-anchor="middle" font-size="16" font-weight="600">Binary Koblitz last-fall degree d_F (HKY), median of 3 draws — m=2 [pcc:unverified]</text>
  <text x="360" y="42" text-anchor="middle" fill="#555">orbit vs random vs polynomial-window (subspace); "—" = orbit base unavailable (H-avail)</text>
  <!-- axes -->
  <line x1="70" y1="300" x2="690" y2="300" stroke="#333"/>
  <line x1="70" y1="90"  x2="70"  y2="300" stroke="#333"/>
  <!-- y ticks 0..4 -->
  <g fill="#333" text-anchor="end">
    <text x="62" y="304">0</text><line x1="66" y1="300" x2="70" y2="300" stroke="#333"/>
    <text x="62" y="252">1</text><line x1="66" y1="248" x2="70" y2="248" stroke="#333"/>
    <text x="62" y="200">2</text><line x1="66" y1="196" x2="70" y2="196" stroke="#333"/>
    <text x="62" y="148">3</text><line x1="66" y1="144" x2="70" y2="144" stroke="#333"/>
    <text x="62" y="96">4</text><line x1="66" y1="92" x2="70" y2="92" stroke="#333"/>
  </g>
  <text x="26" y="200" transform="rotate(-90 26 200)" text-anchor="middle" fill="#333">median d_F</text>
  <!-- bars: 7 cells, 3 arms each. x base per cell. unit = 52px per degree (300 - 52*d). -->
  <!-- cell layout: start 90, cell width 84, bar width 22 -->
  <g>
    <!-- n9 ell3: 2,2,2 -->
    <rect x="92"  y="196" width="22" height="104" fill="#4e79a7"/>
    <rect x="115" y="196" width="22" height="104" fill="#e15759"/>
    <rect x="138" y="196" width="22" height="104" fill="#59a14f"/>
    <text x="126" y="318" text-anchor="middle">n9 ℓ3</text>
    <!-- n15 ell5: 2,2,2 -->
    <rect x="178" y="196" width="22" height="104" fill="#4e79a7"/>
    <rect x="201" y="196" width="22" height="104" fill="#e15759"/>
    <rect x="224" y="196" width="22" height="104" fill="#59a14f"/>
    <text x="212" y="318" text-anchor="middle">n15 ℓ5</text>
    <!-- n15 ell6: 2,3,2 -->
    <rect x="264" y="196" width="22" height="104" fill="#4e79a7"/>
    <rect x="287" y="144" width="22" height="156" fill="#e15759"/>
    <rect x="310" y="196" width="22" height="104" fill="#59a14f"/>
    <text x="298" y="318" text-anchor="middle">n15 ℓ6</text>
    <!-- n21 ell8: 3,3,2 -->
    <rect x="350" y="144" width="22" height="156" fill="#4e79a7"/>
    <rect x="373" y="144" width="22" height="156" fill="#e15759"/>
    <rect x="396" y="196" width="22" height="104" fill="#59a14f"/>
    <text x="384" y="318" text-anchor="middle">n21 ℓ8</text>
    <!-- n13 ell5: -,3,2 -->
    <rect x="436" y="300" width="22" height="0" fill="#4e79a7"/>
    <text x="447" y="296" text-anchor="middle" fill="#999" font-size="11">—</text>
    <rect x="459" y="144" width="22" height="156" fill="#e15759"/>
    <rect x="482" y="196" width="22" height="104" fill="#59a14f"/>
    <text x="470" y="318" text-anchor="middle">n13 ℓ5*</text>
    <!-- n19 ell7: -,3,2 -->
    <rect x="522" y="300" width="22" height="0" fill="#4e79a7"/>
    <text x="533" y="296" text-anchor="middle" fill="#999" font-size="11">—</text>
    <rect x="545" y="144" width="22" height="156" fill="#e15759"/>
    <rect x="568" y="196" width="22" height="104" fill="#59a14f"/>
    <text x="556" y="318" text-anchor="middle">n19 ℓ7*</text>
    <!-- n23 ell11: -,4,3 -->
    <rect x="608" y="300" width="22" height="0" fill="#4e79a7"/>
    <text x="619" y="296" text-anchor="middle" fill="#999" font-size="11">—</text>
    <rect x="631" y="92" width="22" height="208" fill="#e15759"/>
    <rect x="654" y="144" width="22" height="156" fill="#59a14f"/>
    <text x="642" y="318" text-anchor="middle">n23 ℓ11*</text>
  </g>
  <text x="70" y="344" fill="#777" font-size="11">* prime n: orbit base unavailable at this ℓ (ord_n(2) constraint)</text>
  <!-- legend -->
  <g>
    <rect x="300" y="352" width="14" height="14" fill="#4e79a7"/><text x="318" y="364">orbit</text>
    <rect x="370" y="352" width="14" height="14" fill="#e15759"/><text x="388" y="364">random</text>
    <rect x="450" y="352" width="14" height="14" fill="#59a14f"/><text x="468" y="364">subspace (window)</text>
  </g>
</svg>
