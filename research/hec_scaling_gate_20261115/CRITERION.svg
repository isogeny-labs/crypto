<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="245" viewBox="0 0 1000 245"><rect width="1000" height="245" fill="#f7fafc"/><g font-family="Arial" fill="#233746"><text x="25" y="35" font-size="23" font-weight="bold">Same-curve affine amplification: exact coefficient gate</text><rect x="25" y="65" width="280" height="100" rx="7" fill="#e3edf3"/><text x="45" y="96" font-size="19">Center f: F(X) = f(X+s)</text><text x="45" y="130" font-size="17">No degree d−1 term; p ∤ d</text><text x="325" y="120" font-size="28">→</text><rect x="370" y="65" width="270" height="100" rx="7" fill="#e3edf3"/><text x="390" y="96" font-size="19">K = gcd{d−i : Fᵢ ≠ 0}</text><text x="390" y="130" font-size="17">aᴷ = 1 and a is square</text><text x="660" y="120" font-size="28">→</text><rect x="705" y="65" width="270" height="100" rx="7" fill="#f4e6e2"/><text x="725" y="96" font-size="19">Six fixtures: K = 1</text><text x="725" y="130" font-size="17">a = 1; b = ±1 only</text><text x="25" y="203" font-size="18">Exact finite gate: 40 polynomial controls + six fixed fixtures; every nonzero a enumerated.</text><text x="25" y="231" font-size="17">Scope: infinity-fixing affine maps x ↦ ax+t, y ↦ by. No claim about general correspondences.</text></g></svg>
