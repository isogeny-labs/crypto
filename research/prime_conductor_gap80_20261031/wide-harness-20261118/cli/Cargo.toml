[package]
name = "conductor-prime-mont4-cli"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

# Compile the original CLI source against the actual tested library. This
# development package is a plan/codec consumer, not a measured-session image.
[[bin]]
name = "ecbench"
path = "../../../../src/bin/ecbench.rs"

[[test]]
name = "endpoint_pairs"
path = "../../../../tests/endpoint_pairs.rs"

[dependencies]
crypto_lib = { package = "crypto", path = "../../../.." }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "raw_value"] }
num-bigint = { version = "=0.4.8", features = ["rand"] }
num-traits = "=0.2.19"
rand = { version = "=0.8.8", features = ["small_rng"] }
sha2 = { version = "=0.10.9", features = ["compress"] }
rayon = "=1.12.0"
hex = "=0.4.3"
