notes: 'Frozen EKS command Job pfd-a-20261108 (14 vCPU, 56Gi, 172800 s; no planned time, ceiling 172800 s), image 104186811093.dkr.ecr.us-east-2.amazonaws.com/isolab/tasks@sha256:0d6b2ecd6df3f5f092fe4b6179986b041eb7d6be3b94e52d92809bdab2ff3ae8, request research/pkm_falldegree_unblock_20261107/requests/pfd-a.json. Collect card 22: it has no launch step, so it cannot submit anything. It needs research/pkm_falldegree_unblock_20261107/receipts/R2/launch/result.json from CARD-pkm-falldegree-unblock-20261107-pfd-a-R2-1. The `status-once` step makes one isolab.eks.command-status/v1 query and exits 41 when the Job is pending or active; the query itself takes about 1 to 3 minutes (not measured here) because it runs as a CodeBuild build. When the Job is succeeded or failed the card downloads s3://isolab-results-104186811093-us-east-2/runs/pfd-a-20261108/ (without launcher/) into research/pkm_falldegree_unblock_20261107/results/R2, an idempotent sync, and verifies it. A task card writes a receipt once, so each firing is a different numbered card; this card writes only under its own collect directory and its own stdout and stderr files. The card has no add-raw or upload-raw step: those rewrite the benchmark record, whose sha256 changes when R2-1 launches, so a final card binds the record hash it has then. The head-paths-unchanged step passes when no commit after the pinned commit changed the study directory (its cards subdirectory excepted), taskq/, tools/task_card.py or tools/benchrec.py; other commits are accepted. No commit field is set because task_card.py run refuses any HEAD other than the pinned one. Pinned commit dfc7d74752f2f2e260075a98daa51006f10d74ff. `verify` fails unless the Job succeeded with one pod and pod exit 0, its Job UID and name equal the launch receipt, the downloaded tree is one directory named by the Pod UID, and each listed file holds each listed string. This Job''s entry script writes no SHA256SUMS file, so `verify` writes the local sha256 of every downloaded file to the output file instead; there is no in-pod manifest to compare it with. The record stays open, and the card runs no close, report or analysis command.'
