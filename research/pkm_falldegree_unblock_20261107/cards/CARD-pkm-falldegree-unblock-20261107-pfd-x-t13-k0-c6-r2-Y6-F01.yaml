notes: 'Frozen EKS command Job pfd-x-t13-k0-c6-20261110-r2 (12 vCPU, 56Gi, 90000 s; Amendment 7 B capped F4 run (Amendments 9-14: 12 vCPU, no pin, <= 90000 s; Amendment 14: 56Gi, max-dense 12.8e9)), image 104186811093.dkr.ecr.us-east-2.amazonaws.com/isolab/tasks@sha256:0d6b2ecd6df3f5f092fe4b6179986b041eb7d6be3b94e52d92809bdab2ff3ae8, request research/pkm_falldegree_unblock_20261107/requests_r2h/pfd-x-t13-k0-c6-r2.json. This card has no launch step, so it cannot submit anything. It was generated after the launch and binds research/pkm_falldegree_unblock_20261107/receipts/Y6/launch/result.json and the record benchmarks/records/20261110T0305Z-pkm-fd-pfd-x-t13.json at the sha256 they had at generation; if any card changed the record since, generate the card again. AUDIT-SALVAGE card: the Job FAILED (its entry script stopped at a failing stage) and its Pod object was deleted with its node, so the status route answers pods []. This card keeps what the failed run uploaded. `pod-from-audit` (status_with_audit_pod_failed.sh) requires the status to be state failed with pods [], then takes the one job-controller-created pod owned by the job uid and its node-reported exit code from the EKS audit log (/aws/eks/isolab/cluster, 2026-11-08T00:00:00Z to 2026-11-10T17:45:04Z). `verify` (verify_failed_nosums.sh) requires state failed with exactly one pod and a nonzero exit, the same Job UID and name as the launch receipt, one result directory named by the Pod UID, and each listed string in each listed file; it writes the local sha256 of every file. Nothing from a failed stage is admitted as a passed gate. The `status-once` step polls isolab.eks.command-status/v1 every 60 s for at most 900 s (a poll that fails, for example on the CodeBuild concurrent-build limit, is polled again) and exits 41 when the Job is still pending or active at the ceiling. When the Job is terminal the card downloads s3://isolab-results-104186811093-us-east-2/runs/pfd-x-t13-k0-c6-20261110-r2/ (without launcher/)