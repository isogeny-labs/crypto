notes: 'Frozen EKS command Job pfd-a-20261108 (14 vCPU, 56Gi, 172800 s; no planned time, ceiling 172800 s), image 104186811093.dkr.ecr.us-east-2.amazonaws.com/isolab/tasks@sha256:0d6b2ecd6df3f5f092fe4b6179986b041eb7d6be3b94e52d92809bdab2ff3ae8, request research/pkm_falldegree_unblock_20261107/requests/pfd-a.json. The `launch` step is the only step that submits a Job and it appears once in this card family. The `wait-short` step polls isolab.eks.command-status/v1 for at most 900 s and its exit 41 (no terminal state yet) counts as success, so the card ends with a receipt. The `pool-check` step reads the status of these named Jobs and fails if any is pending or active: sgsecant-panel-20261107, ecld-panel-20261107, mllc-all-20261108, minors-gd-panel-20261107. The status route reads one Job by name and cannot list Jobs, so a Job not named there is not seen. After this card, the collect cards CARD-pkm-falldegree-unblock-20261107-pfd-a-R2-C01 to CARD-pkm-falldegree-unblock-20261107-pfd-a-R2-C26 are fired one at a time, about every 2 h, each only after the previous one has stopped. The head-paths-unchanged step passes when no commit after the pinned commit changed the study directory (its cards subdirectory excepted), taskq/, tools/task_card.py or tools/benchrec.py; other commits are accepted. No commit field is set because task_card.py run refuses any HEAD other than the pinned one. Pinned commit dfc7d74752f2f2e260075a98daa51006f10d74ff. The record stays open, and the card runs no close, report or analysis command.'
