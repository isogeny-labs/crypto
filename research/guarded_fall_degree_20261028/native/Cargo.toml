[package]
name = "fall-degree-replay"
version = "0.1.0"
edition = "2021"
description = "Native replay of bounded-degree polynomial ideal refutations"
publish = false
default-run = "fall-degree-replay"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
overflow-checks = true

# Keep the checker relocatable under a larger repository without changing its
# root workspace membership or dependency graph.
[workspace]
