[package]
name = "char2-fall-degree"
version = "0.1.0"
edition = "2021"
description = "Exact small binary-extension-field bounded-degree certificates"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "char2-fall-degree"
path = "src/main.rs"
