<svg xmlns="http://www.w3.org/2000/svg" width="500" height="120" viewBox="0 0 500 120">
<rect x="0" y="5" width="500" height="34" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="22" font-size="7.6" font-family="DejaVu Sans,sans-serif">Actual sampler</text>
<text x="104" y="18" font-size="7.4" font-family="DejaVu Sans,sans-serif">Uniform ordered distinct pair in Z/p + fair static vertex labels</text>
<text x="104" y="32" font-size="7.0" font-family="DejaVu Sans,sans-serif">First repeat from0; no fresh labels assumed after a repeat</text>
<rect x="0" y="44" width="500" height="34" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="61" font-size="7.6" font-family="DejaVu Sans,sans-serif">Finite lower bound</text>
<text x="104" y="57" font-size="7.4" font-family="DejaVu Sans,sans-serif">p ≥ 4m²(4m+1) ⇒ mean first repeat E ≥ m²/2</text>
<text x="104" y="71" font-size="7.0" font-family="DejaVu Sans,sans-serif">Good word probability ≥ 3/4; short-relation failure ≤ 1/4</text>
<rect x="0" y="83" width="500" height="34" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="100" font-size="7.6" font-family="DejaVu Sans,sans-serif">Scope guard</text>
<text x="104" y="96" font-size="7.4" font-family="DejaVu Sans,sans-serif">For every C, some prime p has E² &gt; Cp</text>
<text x="104" y="110" font-size="7.0" font-family="DejaVu Sans,sans-serif">Two choices only; qualified large-partition conjectures retained</text>
</svg>
