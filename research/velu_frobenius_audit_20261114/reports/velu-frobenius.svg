<svg xmlns="http://www.w3.org/2000/svg" width="500" height="120" viewBox="0 0 500 120">
<rect x="0" y="5" width="500" height="34" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="22" font-size="8.1" font-family="DejaVu Sans,sans-serif">Actual curve / field</text>
<text x="116" y="18" font-size="7.6" font-family="DejaVu Sans,sans-serif">E/F5: y^2 = x^3 + 1; actual K=F25, degree 2</text>
<text x="116" y="32" font-size="7.6" font-family="DejaVu Sans,sans-serif">A=(0,1) fixed; B=(1,a), a^2=2, anti-fixed</text>
<rect x="0" y="44" width="500" height="34" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="61" font-size="8.1" font-family="DejaVu Sans,sans-serif">Actual counterpoint</text>
<text x="116" y="57" font-size="7.6" font-family="DejaVu Sans,sans-serif">P=A+B has exact order 3 and is non-rational</text>
<text x="116" y="71" font-size="7.6" font-family="DejaVu Sans,sans-serif">Frobenius(P) lies outside the actual subgroup &lt;P&gt;</text>
<rect x="0" y="83" width="500" height="34" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="100" font-size="8.1" font-family="DejaVu Sans,sans-serif">Required qualification</text>
<text x="116" y="96" font-size="7.6" font-family="DejaVu Sans,sans-serif">Cyclic subgroup stability iff a scalar exists on P</text>
<text x="116" y="110" font-size="7.6" font-family="DejaVu Sans,sans-serif">Irrational B is a positive stable example: F(B)=-B</text>
</svg>
