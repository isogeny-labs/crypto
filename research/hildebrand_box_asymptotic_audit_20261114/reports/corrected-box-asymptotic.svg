<svg xmlns="http://www.w3.org/2000/svg" width="500" height="142" viewBox="0 0 500 142">
<rect x="0" y="6" width="500" height="40" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="25" font-size="8.8" font-family="DejaVu Sans,sans-serif">Exact finite core</text>
<text x="130" y="21" font-size="7.8" font-family="DejaVu Sans,sans-serif">Actual uniform conditional injective support law</text>
<text x="130" y="37" font-size="8.1" font-family="DejaVu Sans,sans-serif">Probability ≤ (W+1)^d / (p−1).descFactorial d</text>
<rect x="0" y="52" width="500" height="40" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="71" font-size="8.8" font-family="DejaVu Sans,sans-serif">Derived asymptotics</text>
<text x="130" y="67" font-size="7.8" font-family="DejaVu Sans,sans-serif">d≥2: W→∞ and actual denominator / p^d → 1</text>
<text x="130" y="83" font-size="8.1" font-family="DejaVu Sans,sans-serif">Exact W^d = ((ε/2)/2^d)·p^(d−1); correction → 1</text>
<rect x="0" y="98" width="500" height="40" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="117" font-size="8.8" font-family="DejaVu Sans,sans-serif">Corrected result</text>
<text x="130" y="113" font-size="7.8" font-family="DejaVu Sans,sans-serif">Uniform in cell shifts, a₀ and nonzero index j</text>
<text x="130" y="129" font-size="8.1" font-family="DejaVu Sans,sans-serif">For all sufficiently large primes: probability ≤ 1.1·(ε/2)/(2^d·p)</text>
</svg>
