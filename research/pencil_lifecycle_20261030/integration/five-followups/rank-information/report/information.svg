<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300"><rect width="1000" height="300" fill="white"/><g font-family="sans-serif" fill="#152b3c"><text x="25" y="35" font-size="24">Equal total rank does not imply equal target information</text><text x="25" y="65" font-size="17">Derived linear systems over F7; synthetic correctness fixtures, not cohort measurements</text><rect x="25" y="95" width="450" height="140" rx="8" fill="#eef2f5"/><rect x="515" y="95" width="450" height="140" rx="8" fill="#e7f3ee"/><text x="45" y="130" font-size="22">x = 0</text><text x="45" y="165" font-size="19">rank(A) = rank([A b]) = 1</text><text x="45" y="205" font-size="19">k remains arbitrary</text><text x="535" y="130" font-size="22">k + 3 = 0</text><text x="535" y="165" font-size="19">rank(A) = 0; rank([A b]) = 1</text><text x="535" y="205" font-size="19">k = 4 is determined</text><text x="25" y="275" font-size="17">Both augmented row spaces have rank 1. The existing collector already checks a target pivot.</text></g></svg>