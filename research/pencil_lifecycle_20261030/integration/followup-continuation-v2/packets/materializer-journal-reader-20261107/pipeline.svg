<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280"><rect width="1000" height="280" fill="white"/><g font-family="sans-serif" font-size="18" fill="#17324d"><text x="25" y="30">Read-only receipt consistency checks (source and software fixtures)</text><rect x="25" y="60" width="260" height="100" fill="#edf3fa" stroke="#17324d"/><text x="40" y="90">Bounded, no-symlink reads</text><text x="40" y="120">Strict JSON and ABI</text><text x="305" y="110">→</text><rect x="345" y="60" width="290" height="100" fill="#edf3fa" stroke="#17324d"/><text x="360" y="90">Length / digest / count</text><text x="360" y="120">Typed inline-prefix equality</text><text x="655" y="110">→</text><rect x="695" y="60" width="280" height="100" fill="#edf3fa" stroke="#17324d"/><text x="710" y="90">Consistency result only</text><text x="710" y="120">No terminal authentication</text><text x="25" y="205">Intermediate → incomplete; failed final → prefix plus possible extra evidence</text><text x="25" y="235">Passed final → exact full journal; legacy → weaker inline-only evidence</text></g></svg>