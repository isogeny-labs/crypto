<rect x="25" y="20" width="850" height="52" rx="7" fill="white" stroke="#446080"/><text x="45" y="53" font-size="22" font-family="sans-serif">Exact source: P = N^2 - b^2 F</text>
<rect x="25" y="96" width="850" height="52" rx="7" fill="white" stroke="#446080"/><text x="45" y="129" font-size="22" font-family="sans-serif">F(a)=P(a)=0 implies N(a)=0</text>
<rect x="25" y="172" width="850" height="52" rx="7" fill="white" stroke="#446080"/><text x="45" y="205" font-size="22" font-family="sans-serif">P'(a) = -b^2 F'(a) is nonzero</text>
<rect x="25" y="248" width="850" height="52" rx="7" fill="white" stroke="#446080"/><text x="45" y="281" font-size="22" font-family="sans-serif">P and each factor are nonzero</text>
<rect x="25" y="324" width="850" height="52" rx="7" fill="white" stroke="#446080"/><text x="45" y="357" font-size="22" font-family="sans-serif">Simple root: factor multiplicities sum to 1</text>
</svg>