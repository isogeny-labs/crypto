<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="345"><rect width="1000" height="345" fill="#f7f9fc"/><g fill="#172c45" font-family="sans-serif"><text x="25" y="35" font-size="24">Mixed 1+2: source-order field dispatcher</text><rect x="25" y="55" width="950" height="39" rx="6" fill="#e3edf7"/><text x="40" y="81" font-size="17">1. K ≠ 0</text><text x="470" y="81" font-size="17">Generic Some / common</text><rect x="25" y="102" width="950" height="39" rx="6" fill="#e3edf7"/><text x="40" y="128" font-size="17">2. K = 0; cancellation</text><text x="470" y="128" font-size="17">Extracted point / cancellation</text><rect x="25" y="149" width="950" height="39" rx="6" fill="#e3edf7"/><text x="40" y="175" font-size="17">3. Cancellation false; mismatch</text><text x="470" y="175" font-size="17">None — excluded by valid inputs</text><rect x="25" y="196" width="950" height="39" rx="6" fill="#e3edf7"/><text x="40" y="222" font-size="17">4. Positive; repeated support</text><text x="470" y="222" font-size="17">Tripling Some / tripling</text><rect x="25" y="243" width="950" height="39" rx="6" fill="#e3edf7"/><text x="40" y="269" font-size="17">5. Positive; distinct support</text><text x="470" y="269" font-size="17">Double + generic Some / positiveDistinct</text><text x="25" y="322" font-size="16">Original valid inputs + four nonzero weights → valid Some payload; 10 fixed checks</text></g></svg>