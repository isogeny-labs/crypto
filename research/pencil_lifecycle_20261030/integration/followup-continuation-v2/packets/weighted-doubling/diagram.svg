<svg xmlns="http://www.w3.org/2000/svg" width="950" height="260"><rect width="950" height="260" fill="white"/><g font-family="sans-serif" fill="#182433"><text x="20" y="32" font-size="22">Weighted doubling: local field preservation</text><rect x="20" y="55" width="910" height="45" fill="#e8eff5"/><text x="35" y="85" font-size="18">z,w,y,2 nonzero + normalized point equation</text><text x="35" y="135" font-size="18">Normalize literal output → u=(X−xx)², v=sX+(yy−s·xx)</text><text x="35" y="180" font-size="18">s=f′(xx)/(2yy); explicit Taylor quotient → u divides f−v²</text><text x="35" y="230" font-size="17">y=0 uses earlier inverse branch. Zero derivative is permitted.</text></g></svg>