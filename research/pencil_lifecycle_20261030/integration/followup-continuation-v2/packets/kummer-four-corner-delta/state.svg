<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290"><rect width="900" height="290" fill="white"/><g font-family="sans-serif" font-size="17" text-anchor="middle"><text x="450" y="25">Four retained corners provide the signed recovery neighbour</text><rect x="25" y="55" width="350" height="105" fill="#e3edf4" stroke="#456"/><text x="200" y="84">[R]                 [R+T]</text><text x="200" y="123">[R+G]           [R+G+T]</text><text x="450" y="92">4 repaired</text><text x="450" y="118">operations →</text><rect x="535" y="55" width="340" height="105" fill="#e1efe3" stroke="#456"/><text x="705" y="84">[R′]                 [R′+T]</text><text x="705" y="123">[R′+G]           [R′+G+T]</text><text x="450" y="196">R′ = 2R + cT; 2T = 0; signed anchor G is not 2-torsion.</text><text x="450" y="229">Recover(G, [R′], [R′+G]) before signed reference computation.</text><text x="450" y="266">252 transitions • 1008 matching corners • 252 exact recoveries</text></g></svg>