<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600"><rect width="720" height="600" fill="white"/><style>text{font-family:Arial;fill:#18354c}.h{font-size:17px;font-weight:bold}.b{font-size:13px}</style><text x="25" y="30" class="h">Normalized C-zero output: quotient derived from coefficients</text>
<rect x="45" y="55" width="630" height="75" rx="8" stroke="#678" fill="#eef4f8"/><text x="60" y="82" class="h">Original input residual divisibilities</text><text x="60" y="107" class="b">B nonzero, C zero; interpolation gives product divisibility</text>
<path d="M360,130 L360,150" stroke="#678" stroke-width="2"/>
<rect x="45" y="150" width="630" height="75" rx="8" stroke="#678" fill="#eef4f8"/><text x="60" y="177" class="h">Actual shape assumptions</text><text x="60" y="202" class="b">f monic, degree 5, coefficient 4 zero; l degree at most 2</text>
<path d="M360,225 L360,245" stroke="#678" stroke-width="2"/>
<rect x="45" y="245" width="630" height="75" rx="8" stroke="#678" fill="#eef4f8"/><text x="60" y="272" class="h">Derived quotient degree</text><text x="60" y="297" class="b">degree(f-l^2)=5; degree(u1*u2)=4; quotient degree 1</text>
<path d="M360,320 L360,340" stroke="#678" stroke-width="2"/>
<rect x="45" y="340" width="630" height="75" rx="8" stroke="#678" fill="#eef4f8"/><text x="60" y="367" class="h">Derived coefficients</text><text x="60" y="392" class="b">t[1]=1; t[0]=-(q1+q2+(A/B)^2)</text>
<path d="M360,415 L360,435" stroke="#678" stroke-width="2"/>
<rect x="45" y="435" width="630" height="75" rx="8" stroke="#678" fill="#eef4f8"/><text x="60" y="462" class="h">Output curve membership</text><text x="60" y="487" class="b">x=q1+q2+(A/B)^2; y=-l(x); y^2=f(x)</text>
<text x="25" y="555" class="b">Scope: normalized Field algebra. No quotient formula assumed; weighted transport separate.</text><text x="25" y="580" class="b">12 main declarations; 10 control/witness declarations; 22 axiom readbacks.</text></svg>
