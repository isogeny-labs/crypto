<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410"><rect width="1000" height="410" fill="white"/><g font-family="sans-serif" fill="#19334b"><text x="30" y="42" font-size="25">Graph Ring: conditional word-value correspondence</text><rect x="30" y="80" width="280" height="120" fill="#edf3f8" stroke="#52677d"/><text x="45" y="112" font-size="18">Add / neg / subtract</text><text x="45" y="146" font-size="16">Canonical operands</text><text x="45" y="179" font-size="16">Addition requires r ≤ 2^63</text><text x="325" y="145" font-size="24">→</text><rect x="365" y="80" width="280" height="120" fill="#edf3f8" stroke="#52677d"/><text x="380" y="112" font-size="18">Literal machine formulas</text><text x="380" y="146" font-size="16">Exact headroom / no underflow</text><text x="380" y="179" font-size="16">Wide product then remainder</text><text x="660" y="145" font-size="24">→</text><rect x="700" y="80" width="270" height="120" fill="#edf3f8" stroke="#52677d"/><text x="715" y="112" font-size="18">Canonical field decoding</text><text x="715" y="155" font-size="16">Value semantics only</text><text x="30" y="250" font-size="18">Fresh replay: 7 main + 10 producer + 9 reviewer controls; 26 axiom readbacks.</text><text x="30" y="290" font-size="16">Ring constructor does not enforce additive bound. Signed proof assumes decoded sign ±1.</text><text x="30" y="330" font-size="16">Inverse, counters, i8 bridge and compiled execution remain separate obligations.</text><text x="30" y="375" font-size="15">Source bindings and receipts accompany REVIEW.md. No scientific execution or cost estimate.</text></g></svg>
