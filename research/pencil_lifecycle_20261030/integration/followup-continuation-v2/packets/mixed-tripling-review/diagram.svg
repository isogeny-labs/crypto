<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260"><rect width="1000" height="260" fill="#f7f9fc"/><g font-family="sans-serif" fill="#152c45"><text x="30" y="38" font-size="24">Tripling: reviewed field-value proof chain</text><rect x="25" y="70" width="215" height="115" rx="9" fill="#e3edf7"/><text x="37" y="98" font-size="18">Original validity</text><text x="37" y="130" font-size="15">K=0; cancellation false</text><text x="37" y="155" font-size="15">repeated support</text><rect x="270" y="70" width="215" height="115" rx="9" fill="#e3edf7"/><text x="282" y="98" font-size="18">Branch readiness</text><text x="282" y="130" font-size="15">2 and y nonzero</text><text x="282" y="155" font-size="15">k=8y³ nonzero</text><rect x="515" y="70" width="215" height="115" rx="9" fill="#e3edf7"/><text x="527" y="98" font-size="18">Hermite identity</text><text x="527" y="130" font-size="15">f−h²=(T−x)³u</text><text x="527" y="155" font-size="15">h+v=A·u</text><rect x="760" y="70" width="215" height="115" rx="9" fill="#e3edf7"/><text x="772" y="98" font-size="18">Weighted output</text><text x="772" y="130" font-size="15">six fields normalized</text><text x="772" y="155" font-size="15">u divides f−v²</text><text x="25" y="225" font-size="16">4 fresh checks passed • field values only • no word, counter or class-sum inference</text></g></svg>