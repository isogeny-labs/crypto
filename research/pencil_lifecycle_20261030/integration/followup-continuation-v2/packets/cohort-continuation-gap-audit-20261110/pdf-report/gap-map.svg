<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#f8fafc"/>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 700; }
    .sub { font-size: 15px; fill: #4b5873; }
    .box { rx: 14; stroke-width: 2; }
    .ready { fill: #e7f7ee; stroke: #23845b; }
    .partial { fill: #fff5d9; stroke: #b47b00; }
    .missing { fill: #ffe7e7; stroke: #b33b3b; }
    .separate { fill: #eee9ff; stroke: #6750b8; }
    .head { font-size: 17px; font-weight: 700; }
    .body { font-size: 14px; }
    .arrow { stroke: #506078; stroke-width: 2.4; fill: none; marker-end: url(#a); }
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#506078"/></marker></defs>
  <text x="40" y="50" class="title">Full-1,260 pencil continuation: implementation path</text>
  <text x="40" y="78" class="sub">Source-only audit at 36a0004f7857; boxes describe component state, not scientific outcomes.</text>

  <rect x="40" y="115" width="290" height="125" class="box ready"/>
  <text x="60" y="145" class="head">Frozen enrollment exists</text>
  <text x="60" y="174" class="body">1,260 targets / 22,680 slots</text>
  <text x="60" y="197" class="body">pencil + rho + rho_AA</text>
  <text x="60" y="220" class="body">6,300 measured pairs, 36 cells</text>

  <rect x="385" y="115" width="290" height="125" class="box partial"/>
  <text x="405" y="145" class="head">Two solver paths</text>
  <text x="405" y="174" class="body">donor: relation trace</text>
  <text x="405" y="197" class="body">managed: progress/custody</text>
  <text x="405" y="220" class="body">separate copied loop today</text>

  <rect x="730" y="115" width="290" height="125" class="box missing"/>
  <text x="750" y="145" class="head">I1 shared production core</text>
  <text x="750" y="174" class="body">progress + ordered relation stream</text>
  <text x="750" y="197" class="body">identical arithmetic and order</text>
  <text x="750" y="220" class="body">observer costs separated</text>

  <rect x="1075" y="115" width="285" height="125" class="box missing"/>
  <text x="1095" y="145" class="head">I2 retained session export</text>
  <text x="1095" y="174" class="body">host / plan / preparation</text>
  <text x="1095" y="197" class="body">attempt / custody / FilePins</text>
  <text x="1095" y="220" class="body">no invented unknowns</text>

  <path d="M330,177 H377" class="arrow"/><path d="M675,177 H722" class="arrow"/><path d="M1020,177 H1067" class="arrow"/>

  <rect x="110" y="315" width="330" height="145" class="box partial"/>
  <text x="130" y="345" class="head">I3-I4 actual stream + rank</text>
  <text x="130" y="374" class="body">atomic target-local rows and admissions</text>
  <text x="130" y="397" class="body">generated vs incorporated prefix ranks</text>
  <text x="130" y="420" class="body">pending/cap/terminal preserved</text>
  <text x="130" y="443" class="body">group replay remains a separate check</text>

  <rect x="535" y="315" width="330" height="145" class="box partial"/>
  <text x="555" y="345" class="head">I5-I7 costs + attempts</text>
  <text x="555" y="374" class="body">nine-category source-bound finite ledger</text>
  <text x="555" y="397" class="body">calibration and 36-cell ratios</text>
  <text x="555" y="420" class="body">timeout/exit/retry/resource join</text>
  <text x="555" y="443" class="body">all non-GAE costs remain explicit</text>

  <rect x="960" y="315" width="330" height="145" class="box missing"/>
  <text x="980" y="345" class="head">I6 matched clocks, if retained</text>
  <text x="980" y="374" class="body">common cold endpoint</text>
  <text x="980" y="397" class="body">method-specific online mapping</text>
  <text x="980" y="420" class="body">fresh state + per-target A/A</text>
  <text x="980" y="443" class="body">wall result stays null until then</text>

  <path d="M1217,240 V278 H275 V307" class="arrow"/>
  <path d="M440,387 H527" class="arrow"/><path d="M865,387 H952" class="arrow"/>

  <rect x="305" y="535" width="350" height="150" class="box missing"/>
  <text x="325" y="565" class="head">Gate then full scientific cohort</text>
  <text x="325" y="594" class="body">18-slot gate + 15 measured replays</text>
  <text x="325" y="617" class="body">then all 1,260 targets</text>
  <text x="325" y="640" class="body">all 22,680 primary slots + replay</text>
  <text x="325" y="663" class="body">failures retained; no survivor denominator</text>

  <rect x="745" y="535" width="350" height="150" class="box ready"/>
  <text x="765" y="565" class="head">Standardized publication path exists</text>
  <text x="765" y="594" class="body">ratio-of-sums only at full denominator</text>
  <text x="765" y="617" class="body">target / cost / resource / replay rows</text>
  <text x="765" y="640" class="body">graphs + neutral PDF + checksums</text>
  <text x="765" y="663" class="body">missing pair => null affected ratio</text>

  <path d="M700,460 V495 H480 V527" class="arrow"/><path d="M655,610 H737" class="arrow"/>

  <rect x="160" y="735" width="1080" height="55" class="box separate"/>
  <text x="180" y="759" class="head">Separate method identities: K1 duplicate labels · K2 degree-one rule · K3 signed/Kummer stream</text>
  <text x="180" y="780" class="body">Each needs production integration and its own full 1,260-target matched cohort; fixed controls are not pooled into the baseline.</text>
</svg>
