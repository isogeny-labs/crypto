<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120"><rect width="1000" height="120" fill="white"/><rect x="8" y="8" width="234" height="100" rx="4" fill="#eef5f8" stroke="#24485a"/><text x="125" y="34" text-anchor="middle" font-family="sans-serif" font-size="16">Canonical words</text><text x="125" y="61" text-anchor="middle" font-family="sans-serif" font-size="16">Prime 2 &lt; p &lt; 2^31</text><text x="125" y="88" text-anchor="middle" font-family="sans-serif" font-size="16">N and S1 nonzero</text><rect x="258" y="8" width="234" height="100" rx="4" fill="#eef5f8" stroke="#24485a"/><text x="375" y="34" text-anchor="middle" font-family="sans-serif" font-size="16">Native product</text><text x="375" y="61" text-anchor="middle" font-family="sans-serif" font-size="16">No UInt64 overflow</text><text x="375" y="88" text-anchor="middle" font-family="sans-serif" font-size="16">Product is nonzero</text><rect x="508" y="8" width="234" height="100" rx="4" fill="#eef5f8" stroke="#24485a"/><text x="625" y="34" text-anchor="middle" font-family="sans-serif" font-size="16">Generated inverse</text><text x="625" y="61" text-anchor="middle" font-family="sans-serif" font-size="16">Widened modpow model</text><text x="625" y="88" text-anchor="middle" font-family="sans-serif" font-size="16">ni = 1/N; si = 1/S1</text><rect x="758" y="8" width="234" height="100" rx="4" fill="#eef5f8" stroke="#24485a"/><text x="875" y="34" text-anchor="middle" font-family="sans-serif" font-size="16">Producer checks</text><text x="875" y="61" text-anchor="middle" font-family="sans-serif" font-size="16">10 named readbacks</text><text x="875" y="88" text-anchor="middle" font-family="sans-serif" font-size="16">7 fixed controls</text></svg>