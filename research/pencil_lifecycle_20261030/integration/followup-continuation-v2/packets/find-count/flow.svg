<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120"><rect width="1000" height="120" fill="white"/><rect x="8" y="8" width="234" height="100" rx="4" fill="#eef5f8" stroke="#24485a"/><text x="125" y="34" text-anchor="middle" font-family="sans-serif" font-size="16">Counted word find</text><text x="125" y="61" text-anchor="middle" font-family="sans-serif" font-size="16">One visit per call</text><text x="125" y="88" text-anchor="middle" font-family="sans-serif" font-size="16">Same mutation order</text><rect x="258" y="8" width="234" height="100" rx="4" fill="#eef5f8" stroke="#24485a"/><text x="375" y="34" text-anchor="middle" font-family="sans-serif" font-size="16">Rank bounds</text><text x="375" y="61" text-anchor="middle" font-family="sans-serif" font-size="16">Single find: rank + 1</text><text x="375" y="88" text-anchor="middle" font-family="sans-serif" font-size="16">Two finds: sum + 2</text><rect x="508" y="8" width="234" height="100" rx="4" fill="#eef5f8" stroke="#24485a"/><text x="625" y="34" text-anchor="middle" font-family="sans-serif" font-size="16">Machine counter</text><text x="625" y="61" text-anchor="middle" font-family="sans-serif" font-size="16">Exact modulo 2^64</text><text x="625" y="88" text-anchor="middle" font-family="sans-serif" font-size="16">Bounded prefixes exact</text><rect x="758" y="8" width="234" height="100" rx="4" fill="#eef5f8" stroke="#24485a"/><text x="875" y="34" text-anchor="middle" font-family="sans-serif" font-size="16">Controls</text><text x="875" y="61" text-anchor="middle" font-family="sans-serif" font-size="16">Compression: 3 then 2</text><text x="875" y="88" text-anchor="middle" font-family="sans-serif" font-size="16">Wrap boundary retained</text></svg>