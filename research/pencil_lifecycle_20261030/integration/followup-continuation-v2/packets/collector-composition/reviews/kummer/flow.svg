<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410"><rect width="1000" height="410" fill="white"/><g font-family="sans-serif" fill="#19334b"><text x="30" y="40" font-size="25">Conditional signed-pair uniqueness: independent review</text><rect x="30" y="80" width="280" height="120" fill="#edf3f8" stroke="#52677d"/><text x="45" y="110" font-size="18">Required assumptions</text><text x="45" y="143" font-size="16">Exact fibers {D,-D}</text><text x="45" y="174" font-size="16">Anchor g+g != 0</text><text x="325" y="145" font-size="24">→</text><rect x="365" y="80" width="280" height="120" fill="#edf3f8" stroke="#52677d"/><text x="380" y="110" font-size="18">Two projection matches</text><text x="380" y="143" font-size="16">pi(D) = pi(E)</text><text x="380" y="174" font-size="16">pi(g+D) = pi(g+E)</text><text x="660" y="145" font-size="24">→</text><rect x="700" y="80" width="270" height="120" fill="#edf3f8" stroke="#52677d"/><text x="715" y="110" font-size="18">Unique signed value</text><text x="715" y="153" font-size="21">E = D</text><text x="30" y="250" font-size="18">Fresh replay: 3 main + 3 producer controls + 8 reviewer controls; 14 axiom readbacks.</text><text x="30" y="290" font-size="17">Source obligations: nonzero projective quotient, actual fibers, caller anchor, identity shortcut.</text><text x="30" y="330" font-size="17">Neither candidate existence nor geometric/xadd closure follows from uniqueness.</text><text x="30" y="375" font-size="15">No scientific execution or new measurements. Source bindings and receipts accompany REVIEW.md.</text></g></svg>
