<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><rect width="1000" height="430" fill="white"/><g font-family="sans-serif" font-size="20" fill="#142c40"><text x="35" y="42">Two-find union: source review and remaining size invariant</text><rect x="35" y="80" width="280" height="90" fill="#d8eee4"/><text x="50" y="112">Two word finds</text><text x="50" y="145">same values and target</text><rect x="360" y="80" width="280" height="90" fill="#d8eee4"/><text x="375" y="112">Union / anchor formulas</text><text x="375" y="145">conditional source fidelity</text><rect x="685" y="80" width="280" height="90" fill="#d8eee4"/><text x="700" y="112">Size choice already exists</text><text x="700" y="145">exact sum needs cardinality</text><path d="M315 125 H360 M640 125 H685" stroke="#142c40" stroke-width="3"/><rect x="210" y="230" width="580" height="105" fill="#fff0cb"/><text x="230" y="265">Next: find preserves every vertex root</text><text x="230" y="301">then root-only size = component cardinality</text><path d="M825 170 V205 H500 V230" fill="none" stroke="#142c40" stroke-width="3"/><text x="35" y="388" font-size="17">120 archive hashes matched; 17 saved readbacks. No fresh Lean replay.</text></g></svg>