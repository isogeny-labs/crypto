<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160"><rect width="1000" height="160" fill="white"/><text x="20" y="25" font-family="Arial" font-size="20">Native inherited-limit gate: source proposal, unexecuted</text><rect x="10" y="50" width="188" height="55" fill="#edf4fa" stroke="#456"/><text x="16" y="82" font-family="Arial" font-size="16">Owned output</text><rect x="208" y="50" width="188" height="55" fill="#edf4fa" stroke="#456"/><text x="214" y="82" font-family="Arial" font-size="16">Physical caps</text><rect x="406" y="50" width="188" height="55" fill="#edf4fa" stroke="#456"/><text x="412" y="82" font-family="Arial" font-size="16">Native AS/DATA</text><rect x="604" y="50" width="188" height="55" fill="#edf4fa" stroke="#456"/><text x="610" y="82" font-family="Arial" font-size="16">Checkpoint policy</text><rect x="802" y="50" width="188" height="55" fill="#edf4fa" stroke="#456"/><text x="808" y="82" font-family="Arial" font-size="16">First child cmd</text><text x="20" y="140" font-family="Arial" font-size="15">Finite or unreadable native limits reject before child commands; no limit is raised.</text></svg>