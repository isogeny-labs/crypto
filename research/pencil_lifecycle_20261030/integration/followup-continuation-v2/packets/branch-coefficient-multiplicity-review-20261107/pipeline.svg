<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300"><rect width="1040" height="300" fill="#f7fafc"/><g font-family="sans-serif" fill="#17324d"><text x="25" y="32" font-size="21">Coefficient-data multiplicity: source composition</text><rect x="25" y="65" width="300" height="90" rx="9" fill="#e2eaf3"/><text x="40" y="95" font-size="17">Actual coefficientData</text><text x="40" y="125" font-size="15">hb + valid1 + valid2</text><rect x="365" y="65" width="300" height="90" rx="9" fill="#e2eaf3"/><text x="380" y="95" font-size="17">Source norm identity</text><text x="380" y="125" font-size="15">n^2 - u1*u2*U = b^2*f</text><rect x="705" y="65" width="310" height="90" rx="9" fill="#e2eaf3"/><text x="720" y="95" font-size="17">Generic multiplicity theorem</text><text x="720" y="125" font-size="15">hroot + simple root + hsupport</text><path d="M325 110H355 M665 110H695" stroke="#17324d" stroke-width="3"/><text x="25" y="208" font-size="18">Separable quintic + branch root supplies simple-root condition.</text><text x="25" y="243" font-size="18">Conclusion: u1,u2,U nonzero; multiplicities at a sum to 1.</text><text x="25" y="278" font-size="17" fill="#8b4513">Source fidelity supported; no kernel compilation or axiom readback.</text></g></svg>