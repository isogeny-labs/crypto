<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340"><rect width="1100" height="340" fill="white"/><g font-family="sans-serif" fill="#17364a" text-anchor="middle"><text x="550" y="30" font-size="22">Remainder cancellation trace · T-1190</text><g stroke="#17364a" fill="#edf5f7"><rect x="30" y="70" width="300" height="95"/><rect x="400" y="70" width="300" height="95"/><rect x="770" y="70" width="300" height="95"/></g><text x="180" y="105">Initial polynomial r</text><text x="180" y="135">divisor b; finite trace</text><text x="550" y="105">r ← r − c Xʲ b</text><text x="550" y="135">repeat every trace step</text><text x="920" y="105">Final remainder zero</text><text x="920" y="135">implies b divides initial r</text><path d="M330 115H400M700 115H770" stroke="#17364a"/><text x="550" y="220">Invariant: initial r = b × sum(trace terms) + final r</text><text x="550" y="265">No claim that trace sum equals the native overwritten quotient</text><text x="550" y="310">Next: indexed UInt64 cancellation → polynomial cancellation</text></g></svg>