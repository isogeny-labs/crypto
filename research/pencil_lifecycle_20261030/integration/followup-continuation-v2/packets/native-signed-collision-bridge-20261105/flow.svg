<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510"><rect width="1000" height="510" fill="#f8fafc"/><g font-family="sans-serif" fill="#172033"><text x="40" y="44" font-size="25">Native signed collision bridge — source proposal</text><text x="40" y="75" font-size="16">No execution • costs unmeasured • independent review pending publication</text><rect x="40" y="100" width="920" height="62" rx="6" fill="#e2e8f0"/><text x="58" y="125" font-size="19">1  Candidate divisor D = aP + bT</text><text x="58" y="149" font-size="16">Canonicalize D; apply the same sign to both labels.</text><rect x="40" y="176" width="920" height="62" rx="6" fill="#e2e8f0"/><text x="58" y="201" font-size="19">2  First normalized label retained</text><text x="58" y="225" font-size="16">Map canonical divisor to (A, B, first attempt).</text><rect x="40" y="252" width="920" height="62" rx="6" fill="#e2e8f0"/><text x="58" y="277" font-size="19">3  Duplicate normalized label</text><text x="58" y="301" font-size="16">Subtract labels: Δa + Δb k = 0.</text><rect x="40" y="328" width="920" height="62" rx="6" fill="#e2e8f0"/><text x="58" y="353" font-size="19">4  Branch on Δb</text><text x="58" y="377" font-size="16">Zero: redundant or invariant conflict. Nonzero: k = −Δa / Δb.</text><rect x="40" y="404" width="920" height="62" rx="6" fill="#e2e8f0"/><text x="58" y="429" font-size="19">5  Source verification and finalization</text><text x="58" y="453" font-size="16">Require kG = Q; retain counter snapshots and terminal evidence.</text></g></svg>