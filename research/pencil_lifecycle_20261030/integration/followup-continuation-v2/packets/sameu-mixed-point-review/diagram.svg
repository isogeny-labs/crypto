<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="265"><rect width="1000" height="265" fill="#f7f9fc"/><g fill="#172c45" font-family="sans-serif"><text x="25" y="35" font-size="24">Same support: extraction validity and its boundary</text><rect x="25" y="65" width="215" height="120" rx="8" fill="#e3edf7"/><text x="35" y="95" font-size="18">Original congruences</text><text x="35" y="130" font-size="14">u divides f−v₁² and f−v₂²</text><text x="35" y="155" font-size="14">same monic quadratic u</text><rect x="270" y="65" width="215" height="120" rx="8" fill="#e3edf7"/><text x="280" y="95" font-size="18">Factor identity</text><text x="280" y="130" font-size="14">(v₁−v₂)(v₁+v₂)=c·u</text><text x="280" y="155" font-size="14">noninverse; slope ≠ 0</text><rect x="515" y="65" width="215" height="120" rx="8" fill="#e3edf7"/><text x="525" y="95" font-size="18">Extracted point</text><text x="525" y="130" font-size="14">x=(t₂−t₁)/(s₁−s₂)</text><text x="525" y="155" font-size="14">valid; z,w nonzero</text><rect x="760" y="65" width="215" height="120" rx="8" fill="#e3edf7"/><text x="770" y="95" font-size="18">Separate boundary</text><text x="770" y="130" font-size="14">singular example: y=0</text><text x="770" y="155" font-size="14">next doubling weight=0</text><text x="25" y="230" font-size="16">5 fresh checks passed • 68 bindings matched • nonunit weighted fixture added</text></g></svg>