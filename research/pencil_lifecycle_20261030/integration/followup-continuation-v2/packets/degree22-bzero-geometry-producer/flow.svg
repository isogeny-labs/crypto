<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420"><rect width="960" height="420" fill="white"/><g fill="#172b4d" font-family="sans-serif"><text x="30" y="35" font-size="23">B-zero support geometry</text><text x="30" y="65" font-size="15">u = X² + qX + r; v = sX + t; s ≠ 0; (qs − t)t − rs² = 0</text><rect x="30" y="100" width="900" height="55" rx="10" fill="#e8f0fa"/><text x="60" y="135" font-size="20">u = (X − xW)(X − xP),  xW = −t/s,  xP = t/s − q</text><rect x="30" y="200" width="420" height="105" rx="10" fill="#e8f0fa"/><rect x="510" y="200" width="420" height="105" rx="10" fill="#e8f0fa"/><text x="50" y="233" font-size="18">W = (xW, 0)</text><text x="50" y="265" font-size="16">f = (X − xW)g; g(xW) ≠ 0</text><text x="530" y="233" font-size="18">P = (xP, 2t − qs)</text><text x="530" y="265" font-size="16">literal weighted extraction; yP ≠ 0</text><path d="M240 155V195 M720 155V195" stroke="#172b4d" stroke-width="2"/><text x="30" y="345" font-size="16">Validity places both points on f. Coprimality with f' makes xW ≠ xP.</text><text x="30" y="378" font-size="15">Producer proof; independent review pending. Divisor valuations and class sum remain separate.</text></g></svg>