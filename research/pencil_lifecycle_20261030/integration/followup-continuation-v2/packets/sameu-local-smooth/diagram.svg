<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="275"><rect width="1000" height="275" fill="#f7f9fc"/><g fill="#172c45" font-family="sans-serif"><text x="25" y="35" font-size="24">Local nonsingularity: extraction → doubling</text><rect x="25" y="65" width="215" height="120" rx="8" fill="#e3edf7"/><text x="35" y="95" font-size="17">Assume extracted y=0</text><text x="35" y="130" font-size="14">two original congruences</text><text x="35" y="155" font-size="14">noninverse; slope ≠ 0</text><rect x="270" y="65" width="215" height="120" rx="8" fill="#e3edf7"/><text x="280" y="95" font-size="17">Squared factor</text><text x="280" y="130" font-size="14">u=(X−x)² divides f</text><text x="280" y="155" font-size="14">value(x)=deriv(x)=0</text><rect x="515" y="65" width="215" height="120" rx="8" fill="#e3edf7"/><text x="525" y="95" font-size="17">Local condition</text><text x="525" y="130" font-size="14">not(value=0 and deriv=0)</text><text x="525" y="155" font-size="14">therefore y ≠ 0</text><rect x="760" y="65" width="215" height="120" rx="8" fill="#e3edf7"/><text x="770" y="95" font-size="17">Following doubling</text><text x="770" y="130" font-size="14">explicit 2 ≠ 0</text><text x="770" y="155" font-size="14">nonzero weights; valid</text><text x="25" y="225" font-size="16">Singular f=X⁵ remains a negative control: local condition fails at x=0</text></g></svg>