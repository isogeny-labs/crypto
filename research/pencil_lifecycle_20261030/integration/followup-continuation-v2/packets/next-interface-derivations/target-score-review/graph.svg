<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390"><rect width="1000" height="390" fill="white"/><g font-family="sans-serif" fill="#183247"><text x="35" y="40" font-size="24">Target-score: source policy and fixed controls</text><rect x="35" y="80" width="280" height="95" rx="8" fill="#e4eff7"/><text x="50" y="110" font-size="18">score reads target coefficient b</text><text x="50" y="140" font-size="17">constant a omitted</text><path d="M315 125 H365" stroke="#183247" stroke-width="2"/><rect x="365" y="80" width="280" height="95" rx="8" fill="#e4eff7"/><text x="380" y="110" font-size="18">priority = (score &gt; 0, score)</text><text x="380" y="140" font-size="17">all unseen split edges inserted</text><path d="M645 125 H695" stroke="#183247" stroke-width="2"/><rect x="695" y="80" width="270" height="95" rx="8" fill="#e5f4e8"/><text x="710" y="110" font-size="18">edge checks both a and b</text><text x="710" y="140" font-size="17">contradiction: native assertion</text><text x="35" y="225" font-size="20">5 producer groups: exact replay</text><text x="35" y="260" font-size="20">5 reviewer groups: 3 deliberate contradictions caught</text><text x="35" y="300" font-size="18">Score0 anchor can enable a later scalar return in the fixed F7 fixture.</text><text x="35" y="345" font-size="16">Source inspection + fixed controls. No universal theorem or performance comparison.</text></g></svg>
