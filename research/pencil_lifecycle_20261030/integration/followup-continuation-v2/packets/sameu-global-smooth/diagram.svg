<svg xmlns="http://www.w3.org/2000/svg" width="920" height="370" viewBox="0 0 920 370"><rect width="920" height="370" fill="#f6f8fb"/><g font-family="sans-serif" fill="#17263b"><text x="30" y="38" font-size="23">Global certificate → local condition → extracted ordinate</text><rect x="30" y="70" width="260" height="100" fill="#dce9f5"/><text x="45" y="103" font-size="17">A f + B f′ = 1</text><text x="45" y="137" font-size="15">IsCoprime f f.derivative</text><text x="307" y="125" font-size="26">→</text><rect x="350" y="70" width="240" height="100" fill="#dce9f5"/><text x="365" y="103" font-size="17">No common zero f(x), f′(x)</text><text x="365" y="137" font-size="15">Explicit quintic identity</text><text x="609" y="125" font-size="26">→</text><rect x="650" y="70" width="240" height="100" fill="#dce9f5"/><text x="665" y="103" font-size="17">Extracted y ≠ 0</text><text x="665" y="137" font-size="15">Original congruences retained</text><text x="30" y="215" font-size="18">Characteristic 5 controls</text><text x="30" y="248" font-size="16">f = X⁵ − X: f′ = −1; certificate (0, −1); local condition holds.</text><text x="30" y="280" font-size="16">f = X⁵: f′ = 0; global condition fails.</text><text x="30" y="332" font-size="15">5 lemmas · 5 fixed controls · no squarefree/separable equivalence assumed</text></g></svg>