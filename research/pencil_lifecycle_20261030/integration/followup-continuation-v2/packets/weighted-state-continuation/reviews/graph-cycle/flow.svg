<svg xmlns="http://www.w3.org/2000/svg" width="740" height="600"><rect width="740" height="600" fill="white"/><style>text{font-family:Arial;fill:#18354c}.h{font-size:17px;font-weight:bold}.b{font-size:13px}</style><text x="25" y="30" class="h">Signed graph cycles: independently checked scalar equations</text>
<rect x="35" y="55" width="670" height="75" rx="8" stroke="#678" fill="#eef4f8"/><text x="50" y="82" class="h">Reduced same-root equation</text><text x="50" y="107" class="b">(cu+cv)*root = a+b*k</text>
<path d="M370,130 L370,150" stroke="#678" stroke-width="2"/>
<rect x="35" y="150" width="670" height="75" rx="8" stroke="#678" fill="#eef4f8"/><text x="50" y="177" class="h">Opposite signs</text><text x="50" y="202" class="b">constraint(-a,-b): -(-a)/(-b) = k</text>
<path d="M370,225 L370,245" stroke="#678" stroke-width="2"/>
<rect x="35" y="245" width="670" height="75" rx="8" stroke="#678" fill="#eef4f8"/><text x="50" y="272" class="h">Equal signs</text><text x="50" y="297" class="b">anchor = (a/(2cu), b/(2cu)); require 2cu nonzero</text>
<path d="M370,320 L370,340" stroke="#678" stroke-width="2"/>
<rect x="35" y="340" width="670" height="75" rx="8" stroke="#678" fill="#eef4f8"/><text x="50" y="367" class="h">Compare with existing anchor</text><text x="50" y="392" class="b">(x-a)+(y-b)*k = 0</text>
<path d="M370,415 L370,435" stroke="#678" stroke-width="2"/>
<rect x="35" y="435" width="670" height="75" rx="8" stroke="#678" fill="#eef4f8"/><text x="50" y="462" class="h">Constraint outcome</text><text x="50" y="487" class="b">nonzero coefficient: extract k; zero coefficient: numerator must be zero</text>
<text x="25" y="555" class="b">Field-value review; actual node coordinates, forest invariants and word semantics separate.</text><text x="25" y="580" class="b">10 main theorems + 8 producer controls + 8 reviewer controls; 26 readbacks.</text></svg>
