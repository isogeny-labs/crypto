<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350"><rect width="960" height="350" fill="white"/><g font-family="sans-serif" fill="#172c40"><text x="24" y="32" font-size="22">Standalone Lean launcher: five fixed controls</text><text x="24" y="58" font-size="14">Exit codes are categorical outcomes; no timing or statistical sample.</text><rect x="24" y="75" width="910" height="35" rx="5" fill="#e8f1f7"/><text x="38" y="97" font-size="17">legacy-rejected: wrapper 0; native 1</text><rect x="24" y="118" width="910" height="35" rx="5" fill="#e8f1f7"/><text x="38" y="140" font-size="17">strict-rejected: wrapper 1; native 1</text><rect x="24" y="161" width="910" height="35" rx="5" fill="#e8f1f7"/><text x="38" y="183" font-size="17">strict-positive: wrapper 0; native 0</text><rect x="24" y="204" width="910" height="35" rx="5" fill="#e8f1f7"/><text x="38" y="226" font-size="17">strict-input-mutation: wrapper 2; native 0</text><rect x="24" y="247" width="910" height="35" rx="5" fill="#e8f1f7"/><text x="38" y="269" font-size="17">stale-output: wrapper 1; native not invoked</text><text x="24" y="330" font-size="13">Source: results.json; native receipts and binding inventories retained. Independent review pending.</text></g></svg>
