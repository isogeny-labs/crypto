<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280"><rect width="1000" height="280" fill="white"/><g font-family="sans-serif" fill="#183247"><text x="30" y="38" font-size="25">Collector row to diagnostic equation</text><rect x="30" y="65" width="420" height="135" rx="8" fill="#eaf0f6"/><rect x="550" y="65" width="420" height="135" rx="8" fill="#e7f3ed"/><text x="50" y="105" font-size="23">Native: [A, b, −a]</text><text x="50" y="155" font-size="23">Ax + bk = −a</text><text x="476" y="135" font-size="32">→</text><text x="570" y="105" font-size="23">Diagnostic: [A, b, +a]</text><text x="570" y="155" font-size="23">Ax + bk + a = 0</text><text x="30" y="245" font-size="18">Negate the final augmented column; retain nuisance and target coefficients.</text></g></svg>