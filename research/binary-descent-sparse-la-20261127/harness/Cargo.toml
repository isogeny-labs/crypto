[package]
name = "bdsl_harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Arm D-S: arm D (Gaudry-Diem k = 3 Weil descent, #5261) with structured Gaussian elimination + Wiedemann mod ell replacing the echelon LA; single target, against matched negation-map rho. Reuses the #5253 and #5261 modules unchanged by #[path]."

# Standalone: not a member of the crypto workspace.
[workspace]

[dependencies]
num-bigint = "0.4"
sha2 = "0.10"
serde_json = "1.0"

[profile.release]
debug = 0
opt-level = 3
