<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Measured PKM m=4 F4 solving degree against the complete-cost threshold</title>
  <desc id="desc">Measured degrees are 6, 7 and 7 at N 8, 12 and 16. The derived rho-competitive threshold is degree 4.</desc>
  <rect width="900" height="540" fill="white"/>
  <text x="450" y="32" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#0f172a">PKM tower, m=4: recorded F4 degree versus cost threshold</text>
  <text x="450" y="55" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#475569">Prior evidence; no new run · degree is a solver-stage measurement, not a fitted asymptotic</text>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="105" y1="380" x2="805" y2="380"/>
    <line x1="105" y1="320" x2="805" y2="320"/>
    <line x1="105" y1="260" x2="805" y2="260"/>
    <line x1="105" y1="200" x2="805" y2="200"/>
    <line x1="105" y1="140" x2="805" y2="140"/>
    <line x1="105" y1="80" x2="805" y2="80"/>
  </g>
  <g stroke="#334155" stroke-width="2">
    <line x1="105" y1="80" x2="105" y2="380"/>
    <line x1="105" y1="380" x2="805" y2="380"/>
  </g>

  <g font-family="DejaVu Sans, sans-serif" font-size="13" fill="#334155" text-anchor="end">
    <text x="92" y="385">3</text>
    <text x="92" y="325">4</text>
    <text x="92" y="265">5</text>
    <text x="92" y="205">6</text>
    <text x="92" y="145">7</text>
    <text x="92" y="85">8</text>
  </g>
  <g font-family="DejaVu Sans, sans-serif" font-size="13" fill="#334155" text-anchor="middle">
    <text x="175" y="404">8</text>
    <text x="455" y="404">12</text>
    <text x="735" y="404">16</text>
  </g>
  <text x="455" y="435" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#0f172a">Tower variable count N</text>
  <text x="25" y="230" text-anchor="middle" transform="rotate(-90 25 230)" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#0f172a">F4 solving degree D</text>

  <line x1="175" y1="200" x2="455" y2="140" stroke="#c2410c" stroke-width="4"/>
  <line x1="455" y1="140" x2="735" y2="140" stroke="#c2410c" stroke-width="4"/>
  <g fill="#fff7ed" stroke="#c2410c" stroke-width="4">
    <circle cx="175" cy="200" r="9"/>
    <circle cx="455" cy="140" r="9"/>
    <circle cx="735" cy="140" r="9"/>
  </g>
  <g font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">
    <text x="175" y="183">6</text>
    <text x="455" y="123">7</text>
    <text x="735" y="123">7</text>
  </g>

  <line x1="105" y1="320" x2="805" y2="320" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="795" y="308" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">derived m=4 rho threshold: D &lt;= 4</text>

  <g transform="translate(125 505)" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#475569">
    <circle cx="8" cy="0" r="6" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
    <text x="22" y="4">measured Kummer F4 degree (no interval reported)</text>
    <line x1="390" y1="0" x2="430" y2="0" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="440" y="4">derived complete-cost threshold</text>
  </g>
</svg>
