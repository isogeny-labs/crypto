<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">PDP exponent required to beat rho by arity</title>
  <desc id="desc">The rho crossover e less than m over two minus one is zero at arity two and one half at arity three. Exact enumeration has exponent m minus one and remains above the crossover.</desc>
  <rect width="900" height="470" fill="white"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
    <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700">Arity decides whether PDP scaling can matter</text>
    <text x="450" y="58" text-anchor="middle" font-size="13" fill="#475569">PDP cost 2^(e s), s = log₂(p)/m; rho crossover requires e &lt; m/2 − 1</text>
    <line x1="90" y1="390" x2="850" y2="390" stroke="#334155" stroke-width="2"/>
    <line x1="90" y1="86" x2="90" y2="390" stroke="#334155" stroke-width="2"/>
    <g font-size="12" fill="#475569">
      <text x="82" y="394" text-anchor="end">0</text>
      <text x="82" y="318" text-anchor="end">1</text>
      <text x="82" y="242" text-anchor="end">2</text>
      <text x="82" y="166" text-anchor="end">3</text>
      <text x="82" y="90" text-anchor="end">4</text>
      <text x="205" y="416" text-anchor="middle">m=2</text>
      <text x="395" y="416" text-anchor="middle">m=3</text>
      <text x="585" y="416" text-anchor="middle">m=4</text>
      <text x="775" y="416" text-anchor="middle">m=5</text>
      <text x="28" y="238" text-anchor="middle" transform="rotate(-90 28 238)">PDP exponent e in s</text>
    </g>
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="90" y1="314" x2="850" y2="314"/>
      <line x1="90" y1="238" x2="850" y2="238"/>
      <line x1="90" y1="162" x2="850" y2="162"/>
      <line x1="90" y1="86" x2="850" y2="86"/>
    </g>
    <polyline points="205,390 395,352 585,314 775,276" fill="none" stroke="#dc2626" stroke-width="4"/>
    <polyline points="205,314 395,238 585,162 775,86" fill="none" stroke="#2563eb" stroke-width="4"/>
    <g fill="#dc2626">
      <circle cx="205" cy="390" r="6"/><circle cx="395" cy="352" r="6"/><circle cx="585" cy="314" r="6"/><circle cx="775" cy="276" r="6"/>
    </g>
    <g fill="#2563eb">
      <circle cx="205" cy="314" r="6"/><circle cx="395" cy="238" r="6"/><circle cx="585" cy="162" r="6"/><circle cx="775" cy="86" r="6"/>
    </g>
    <rect x="545" y="332" width="285" height="43" rx="5" fill="#fff1f2" stroke="#dc2626"/>
    <text x="557" y="350" font-size="13" font-weight="700" fill="#b91c1c">m=3 gate: e &lt; 0.5</text>
    <text x="557" y="367" font-size="12" fill="#7f1d1d">m=2 would require e &lt; 0</text>
    <line x1="112" y1="109" x2="146" y2="109" stroke="#2563eb" stroke-width="4"/>
    <text x="154" y="114" font-size="12">exact enumeration e = m − 1</text>
    <line x1="112" y1="134" x2="146" y2="134" stroke="#dc2626" stroke-width="4"/>
    <text x="154" y="139" font-size="12">rho crossover e = m/2 − 1 (strict)</text>
    <text x="450" y="451" text-anchor="middle" font-size="12" fill="#64748b">The graph is a cost identity, not a measured solver slope.</text>
  </g>
</svg>
