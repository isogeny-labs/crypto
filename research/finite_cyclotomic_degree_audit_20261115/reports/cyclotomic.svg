<svg xmlns="http://www.w3.org/2000/svg" width="500" height="120" viewBox="0 0 500 120">
<rect x="0" y="5" width="500" height="34" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="22" font-size="8.1" font-family="DejaVu Sans,sans-serif">Actual field</text>
<text x="104" y="18" font-size="7.6" font-family="DejaVu Sans,sans-serif">All roots adjoin = simple primitive-root extension</text>
<text x="104" y="32" font-size="7.6" font-family="DejaVu Sans,sans-serif">Finiteness derived; actual Frobenius order = actual field degree</text>
<rect x="0" y="44" width="500" height="34" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="61" font-size="8.1" font-family="DejaVu Sans,sans-serif">Rationality</text>
<text x="104" y="57" font-size="7.6" font-family="DejaVu Sans,sans-serif">Finite extension L: all roots lie in L iff r divides #L−1</text>
<text x="104" y="71" font-size="7.6" font-family="DejaVu Sans,sans-serif">Actual #L=q^finrank; no elliptic torsion identification assumed</text>
<rect x="0" y="83" width="500" height="34" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="100" font-size="8.1" font-family="DejaVu Sans,sans-serif">Guard control</text>
<text x="104" y="96" font-size="7.6" font-family="DejaVu Sans,sans-serif">Characteristic p: actual pth-root field is the base field</text>
<text x="104" y="110" font-size="7.6" font-family="DejaVu Sans,sans-serif">Actual degree1 versus modular order0; r1/r2 also degree1</text>
</svg>
