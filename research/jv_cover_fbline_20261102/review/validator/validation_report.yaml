  verdict: passed
  verdict_scope: >-
    Admissible evidence that, on the 9 weak-class JV instances p in {1301,1451,1601} x seeds 1-3,
    JV_FB_LINE=65536 lowers counted total F_p multiplications to a geo-mean 0.5865 [0.530, 0.650] of the plain
    cover (every instance lower), and that the U1/U2 re-score point estimates against #3278's 126-run negation-map
    reference are 0.791/0.659/0.548 and 1.900/1.585/1.318. Not evidence of an asymptotic improvement, of the model
    crossovers p*, or of a U1 ranking robust to the cover's unemitted F_p additions. Does not support an ECDLP claim
    or authorize promotion.
  limitations:
    - "L1 constant factor that fades with p at fixed n: g(p) ~ (1 + 4.2/sqrt p)^-5"
    - "L2 model p* ignores L1: U2 ~1850 (not 1799), U1 ~1152 (not 1185), both model"
    - "L3 U1 'below' ranks a lower-bound arm; at p=1301 it flips if cover F_p additions cost >= 0.32 mult each at one per mult (assumption; research/ic_acct1_cover_bitop_20261021 could settle k)"
    - "L4 3 cover seeds per prime, one residual stream per instance; pairing is instance-level (rng draws diverge after factor_base)"
    - "L5 local host not isolab-eks (disclosed); arm-B staging into negrho_rescore's inputs/cover layout not recorded (numbers independently reproduced); README 'fit/src/main.rs sha af4e1355' refers to #3278's tool, not this study's fit/ (f4149680)"
    - "L6 weak class only (full rational 2-torsion, #E = 4l), l ~ 2^60-2^62"
    - "L7 square-table undercharge (p-1)/2 products per run; search lookups/additions unemitted (quantified, negligible)"
