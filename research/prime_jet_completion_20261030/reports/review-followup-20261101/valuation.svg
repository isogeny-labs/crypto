<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
<title id="title">Recorded two-adic valuations by L for original and flattened controls</title>
<desc id="desc">At L 4, 8, 16 and 32, original valuations are 3, 4, 5 and 6. Flattened valuations are 5, 6, 7 and 8. Normalized residue rank is 2 for both at each size.</desc>
<rect width="920" height="520" fill="#ffffff"/>
<text x="460" y="36" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#17233b">Finite exact control: first-coefficient valuation</text>
<text x="460" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#44536a">Recorded v₂ value (not a timing); source: native/expected.txt</text>
<g stroke="#d8dee8" stroke-width="1">
<line x1="120" y1="410" x2="800" y2="410"/><line x1="120" y1="350" x2="800" y2="350"/><line x1="120" y1="290" x2="800" y2="290"/><line x1="120" y1="230" x2="800" y2="230"/><line x1="120" y1="170" x2="800" y2="170"/><line x1="120" y1="110" x2="800" y2="110"/>
</g>
<g font-family="sans-serif" font-size="13" fill="#344054" text-anchor="end">
<text x="108" y="415">0</text><text x="108" y="355">2</text><text x="108" y="295">4</text><text x="108" y="235">6</text><text x="108" y="175">8</text><text x="108" y="115">10</text>
</g>
<text transform="translate(32 260) rotate(-90)" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#344054">2-adic valuation v₂</text>
<g font-family="sans-serif" font-size="14" fill="#344054" text-anchor="middle">
<text x="200" y="438">4</text><text x="380" y="438">8</text><text x="560" y="438">16</text><text x="740" y="438">32</text>
</g>
<text x="460" y="470" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#344054">Size parameter L</text>
<g fill="#31688e">
<rect x="174" y="320" width="30" height="90"/><rect x="354" y="290" width="30" height="120"/><rect x="534" y="260" width="30" height="150"/><rect x="714" y="230" width="30" height="180"/>
</g>
<g fill="#d97941">
<rect x="208" y="260" width="30" height="150"/><rect x="388" y="230" width="30" height="180"/><rect x="568" y="200" width="30" height="210"/><rect x="748" y="170" width="30" height="240"/>
</g>
<g font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#17233b">
<text x="189" y="312">3</text><text x="369" y="282">4</text><text x="549" y="252">5</text><text x="729" y="222">6</text>
<text x="223" y="252">5</text><text x="403" y="222">6</text><text x="583" y="192">7</text><text x="763" y="162">8</text>
</g>
<rect x="270" y="80" width="15" height="15" fill="#31688e"/><text x="292" y="93" font-family="sans-serif" font-size="13" fill="#344054">Original</text>
<rect x="380" y="80" width="15" height="15" fill="#d97941"/><text x="402" y="93" font-family="sans-serif" font-size="13" fill="#344054">Flattened</text>
<text x="460" y="502" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#526179">Normalized residue rank: 2 for both controls at all four sizes</text>
</svg>
