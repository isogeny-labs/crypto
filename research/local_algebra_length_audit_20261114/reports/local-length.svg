<svg xmlns="http://www.w3.org/2000/svg" width="500" height="142" viewBox="0 0 500 142">
<rect x="0" y="6" width="500" height="40" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="25" font-size="8.4" font-family="DejaVu Sans,sans-serif">Actual quotients</text>
<text x="122" y="21" font-size="7.8" font-family="DejaVu Sans,sans-serif">A = K[t]/(t^m); B = K[x,y]/(x^m,y-x)</text>
<text x="122" y="37" font-size="7.8" font-family="DejaVu Sans,sans-serif">Self-module length(A)=length(B)=m for every field K</text>
<rect x="0" y="52" width="500" height="40" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="71" font-size="8.4" font-family="DejaVu Sans,sans-serif">Local support</text>
<text x="122" y="67" font-size="7.8" font-family="DejaVu Sans,sans-serif">Positive m: A and B local; exactly one geometric point</text>
<text x="122" y="83" font-size="7.8" font-family="DejaVu Sans,sans-serif">Arbitrarily large ring length at support1; m=0 nonlocal</text>
<rect x="0" y="98" width="500" height="40" fill="#eaf2f6" stroke="#2c788e"/>
<text x="9" y="117" font-size="8.4" font-family="DejaVu Sans,sans-serif">Residue control</text>
<text x="122" y="113" font-size="7.8" font-family="DejaVu Sans,sans-serif">F4 over F2: field, hence local; self-module length1</text>
<text x="122" y="129" font-size="7.8" font-family="DejaVu Sans,sans-serif">F2-module length2; locality alone does not equate them</text>
</svg>
