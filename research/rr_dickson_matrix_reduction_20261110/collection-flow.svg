<svg xmlns="http://www.w3.org/2000/svg" width="900" height="345" viewBox="0 0 900 345">
<rect width="900" height="345" fill="#f5f7fa"/>
<g font-family="sans-serif" fill="#183047">
<text x="25" y="35" font-size="23">Supplied-basis collection — supported cases and explicit limits</text>
<rect x="25" y="65" width="250" height="95" rx="8" fill="#dbece8"/>
<text x="40" y="94" font-size="18">Pinned input + basis bytes</text><text x="40" y="121" font-size="15">Validate RR/F arm, field and order</text><text x="40" y="145" font-size="15">Record both SHA-256 digests</text>
<path d="M275 110H310" stroke="#183047" stroke-width="3"/>
<rect x="310" y="65" width="265" height="95" rx="8" fill="#dbece8"/>
<text x="325" y="94" font-size="18">Affine / quadratic collection</text><text x="325" y="121" font-size="15">Enumerate all rational roots</text><text x="325" y="145" font-size="15">Unsupported or capped → UNKNOWN</text>
<path d="M575 110H610" stroke="#183047" stroke-width="3"/>
<rect x="610" y="65" width="265" height="95" rx="8" fill="#dbece8"/>
<text x="625" y="94" font-size="18">Validate and normalize</text><text x="625" y="121" font-size="15">Check each assignment on input</text><text x="625" y="145" font-size="15">Union signed outputs; retain errors</text>
<rect x="25" y="185" width="850" height="85" rx="8" fill="#fff0d2" stroke="#bc8a2e" stroke-dasharray="5 4"/>
<text x="40" y="213" font-size="18">Enumeration of supplied equations ≠ proof of complete original-input solutions</text>
<text x="40" y="239" font-size="16">Basis equivalence/provenance and independent matched-input qualification remain required.</text>
<text x="40" y="260" font-size="15">A forged unit basis cannot establish original-input UNSAT; input completeness is explicitly uncertified.</text>
<text x="25" y="306" font-size="16">Archived basis exercised without planted support metadata. Native development checks only.</text>
<text x="25" y="333" font-size="15">No new msolve run, F4 degree/width measurement or cost improvement. Producer-unverified.</text>
</g></svg>
