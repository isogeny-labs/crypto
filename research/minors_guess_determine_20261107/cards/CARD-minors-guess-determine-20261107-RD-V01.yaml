notes: 'Frozen EKS command Job minors-gd-panel-20261108-c (12 vCPU, 32Gi, 43200 s; planned 2 to 4.6 h on 12 vCPU, ceiling 43200 s), image 104186811093.dkr.ecr.us-east-2.amazonaws.com/isolab/tasks@sha256:72934ab9ea2d9d93c50088972aca1924cfde23af87755cd8a802a04f6254dd4c, request research/minors_guess_determine_20261107/eks/r2img_request_c.json. This card has no launch step, so it cannot submit anything. It was generated after the launch and binds research/minors_guess_determine_20261107/receipts/RD/launch/result.json and the record benchmarks/records/20261108T0449Z-minors-gd-panel.json at the sha256 they had at generation; if any card changed the record since, generate the card again. AUDIT-COLLECT card: the Job succeeded, but its Pod object was deleted when its node was removed, so the status route answers pods []. The `status-once` step makes one isolab.eks.command-status/v1 query. The `pod-from-audit` step (status_with_audit_pod.sh) requires that answer to be state succeeded with pods [], then reads the EKS API-server audit log (/aws/eks/isolab/cluster) from 2026-11-08T00:00:00Z to 2026-11-08T17:08:11Z and accepts exactly one pod created by the job-controller with an ownerReference to the status job_uid, and that pod''s node-reported terminated container state with one consistent exit code; it writes the status with that pod filled in, and `verify` reads that file. The `status-once` step polls isolab.eks.command-status/v1 every 60 s for at most 900 s (a poll that fails, for example on the CodeBuild concurrent-build limit, is polled again) and exits 41 when the Job is still pending or active at the ceiling. When the Job is terminal the card downloads s3://isolab-results-104186811093-us-east-2/runs/minors-gd-panel-20261108-c/ (without launcher/) into research/minors_guess_determine_20261107/results/RD, an idempotent sync, and verifies it. `verify` fails unless the Job succeeded with one pod and pod exit 0, its Job UID and name equal the launch receipt, the downloaded tree is one directory named by the Pod UID, and each listed file holds each listed string; it also runs `sha256sum -c` against SHA256SUMS. Then `add-raw` and `upload-raw` record every downloaded file in the benchmark record. The head-paths-unchanged step passes when no commit after the pinned commit changed the study directory (its cards, receipts and results subdirectories excepted), taskq/, tools/task_card.py or tools/benchrec.py; other commits are accepted. No commit field is set because task_card.py run refuses any HEAD other than the pinned one. Pinned commit 734b73a3b207e273fb2041fabf3d0c06caefc7d4. The record stays open, and the card runs no close, report or analysis command.'
