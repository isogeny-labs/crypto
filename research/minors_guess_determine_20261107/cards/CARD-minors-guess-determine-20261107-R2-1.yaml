notes: 'Frozen EKS command Job minors-gd-panel-20261107 (14 vCPU, 32Gi, 43200 s; planned 2 to 4 h, ceiling 43200 s), image 104186811093.dkr.ecr.us-east-2.amazonaws.com/isolab/tasks@sha256:72934ab9ea2d9d93c50088972aca1924cfde23af87755cd8a802a04f6254dd4c, request research/minors_guess_determine_20261107/eks/r2img_request.json. The `launch` step is the only step that submits a Job and it appears once in this card family. The `wait-short` step polls isolab.eks.command-status/v1 for at most 900 s and its exit 41 (no terminal state yet) counts as success, so the card ends with a receipt. The `pool-check` step reads the status of these named Jobs and fails if any is pending or active: sgsecant-panel-20261107, ecld-panel-20261107, mllc-all-20261108, pfd-a-20261108. The status route reads one Job by name and cannot list Jobs, so a Job not named there is not seen. After this card, the collect cards CARD-minors-guess-determine-20261107-R2-C01 to CARD-minors-guess-determine-20261107-R2-C14 are fired one at a time, about every 1 h, each only after the previous one has stopped. The head-paths-unchanged step passes when no commit after the pinned commit changed the study directory (its cards subdirectory excepted), taskq/, tools/task_card.py or tools/benchrec.py; other commits are accepted. No commit field is set because task_card.py run refuses any HEAD other than the pinned one. Pinned commit dfc7d74752f2f2e260075a98daa51006f10d74ff. The record stays open, and the card runs no close, report or analysis command.'
