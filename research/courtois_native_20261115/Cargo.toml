[package]
name = "courtois-native-study"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
crypto_lib = { package = "crypto", path = "../.." }
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.dev]
debug = 0

[profile.release]
debug = 0
codegen-units = 256

