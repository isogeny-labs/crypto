[package]
name = "b2lsp_harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Arm D2S: double-large-prime k = 3 Weil descent (#5291) with a BFS large-prime forest and #5290's sparse LA (SGE + Wiedemann), single target, against matched negation-map rho. Reuses #5253, #5261, #5291 and #5290 modules unchanged by #[path]."

# Standalone: not a member of the crypto workspace.
[workspace]

[dependencies]
num-bigint = "0.4"
sha2 = "0.10"
serde_json = "1.0"

[profile.release]
debug = 0
opt-level = 3
