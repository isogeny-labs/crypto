[package]
name = "compact-speed-analysis"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false

[workspace]

[features]
scale-screen = ["certified-relations/scale-screen"]

[dependencies]
certified-relations = { path = "../../../crates/certified-relations" }
relation-replay-checker = { path = "../../../crates/relation-replay-checker" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series"] }
