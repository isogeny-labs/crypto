# Project-scoped stdio connections. Trust this checkout, install the clients with
# scripts/isolab-agent.sh setup BACKEND, and supply credentials in the environment.
# Resolve the checkout root so sessions launched in a subdirectory work too.
[mcp_servers.isolab]
command = "bash"
args = ["-c", 'exec bash "$(git rev-parse --show-toplevel)/scripts/isolab-agent.sh" mcp nats']
env_vars = ["ISOLAB_URL", "ISOLAB_TOKEN", "ISOLAB_CREDS", "ISOLAB_NAMESPACE", "ISOLAB_BIN", "ISOLAB_AGENT_STATE_DIR", "SSL_CERT_FILE", "SSL_CERT_DIR", "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "NO_PROXY", "http_proxy", "https_proxy", "all_proxy", "no_proxy"]
startup_timeout_sec = 15
tool_timeout_sec = 120

[mcp_servers.isolab-eks]
command = "bash"
args = ["-c", 'exec bash "$(git rev-parse --show-toplevel)/scripts/isolab-agent.sh" mcp eks']
env_vars = ["KUBECONFIG", "ISOLAB_KUBE_CONTEXT", "ISOLAB_MCP_BIN", "ISOLAB_AGENT_STATE_DIR", "AWS_REGION", "AWS_DEFAULT_REGION", "AWS_PROFILE", "AWS_CONFIG_FILE", "AWS_SHARED_CREDENTIALS_FILE", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN", "AWS_WEB_IDENTITY_TOKEN_FILE", "AWS_ROLE_ARN", "AWS_ROLE_SESSION_NAME", "AWS_CONTAINER_CREDENTIALS_RELATIVE_URI", "AWS_CONTAINER_CREDENTIALS_FULL_URI", "AWS_CONTAINER_AUTHORIZATION_TOKEN", "AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE", "AWS_CA_BUNDLE", "TMPDIR", "SSL_CERT_FILE", "SSL_CERT_DIR", "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "NO_PROXY", "http_proxy", "https_proxy", "all_proxy", "no_proxy"]
startup_timeout_sec = 15
tool_timeout_sec = 90
