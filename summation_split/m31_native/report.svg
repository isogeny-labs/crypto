<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800"><title>M31 projective quotient and guarded multiplicity</title><rect width="100%" height="100%" fill="white"/>
<rect x="0" y="0" width="1120" height="8" fill="#076d6d"/>
<text x="35" y="47" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#14283d">M31 projective algebra and guarded multiplicity</text>
<text x="35" y="74" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#566b7a">Exact component structure; projected solver runtime and memory remain unmeasured.</text>
<rect x="35" y="112" width="510" height="57" fill="#14283d"/>
<text x="51" y="133" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#ffffff">ONE NORMALIZED PROJECTIVE NODE</text>
<text x="51" y="154" font-size="10" font-family="monospace" font-weight="400" fill="#ffffff">J = (z^2-z, zw-w, zs-s, w^2-s)</text>
<line x1="290" y1="169" x2="290" y2="188" stroke-width="1.5" stroke="#076d6d"/>
<line x1="156.5" y1="188" x2="423.5" y2="188" stroke-width="1.5" stroke="#076d6d"/>
<line x1="156.5" y1="188" x2="156.5" y2="207" stroke-width="1.6" stroke="#076d6d"/>
<line x1="156.5" y1="207" x2="152.5" y2="200" stroke-width="1.6" stroke="#076d6d"/>
<line x1="156.5" y1="207" x2="160.5" y2="200" stroke-width="1.6" stroke="#076d6d"/>
<line x1="423.5" y1="188" x2="423.5" y2="207" stroke-width="1.6" stroke="#076d6d"/>
<line x1="423.5" y1="207" x2="419.5" y2="200" stroke-width="1.6" stroke="#076d6d"/>
<line x1="423.5" y1="207" x2="427.5" y2="200" stroke-width="1.6" stroke="#076d6d"/>
<rect x="35" y="211" width="243" height="132" fill="#edf4f7"/>
<rect x="302" y="211" width="243" height="132" fill="#edf4f7"/>
<text x="51" y="236" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#076d6d">INFINITY COMPONENT</text>
<text x="51" y="260" font-size="10.5" font-family="monospace" font-weight="400" fill="#14283d">z = 0, w = 0, s = 0</text>
<text x="51" y="282" font-size="10.5" font-family="monospace" font-weight="400" fill="#14283d">(A,B,C) = (1,0,0)</text>
<text x="51" y="307" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#566b7a">A single point retains identity and</text>
<text x="51" y="321.5" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#566b7a">cancellation branches.</text>
<text x="318" y="236" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#076d6d">AFFINE COMPONENT</text>
<text x="318" y="260" font-size="10.5" font-family="monospace" font-weight="400" fill="#14283d">z = 1, s = w^2</text>
<text x="318" y="282" font-size="10.5" font-family="monospace" font-weight="400" fill="#14283d">(A,B,C) = (w^2,w,1)</text>
<text x="318" y="307" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#566b7a">One affine line. Its coordinate w may be</text>
<text x="318" y="321.5" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#566b7a">geometric.</text>
<text x="47" y="369" font-size="11" font-family="monospace" font-weight="400" fill="#14283d">Fp[z,w,s]/J  =  Fp  x  Fp[w]</text>
<text x="47" y="390" font-size="9.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#566b7a">The product is a decomposition of coordinate rings, not field descent.</text>
<rect x="575" y="112" width="510" height="47" fill="#14283d"/>
<text x="589" y="132" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#ffffff">CLASSIFY ALL ORIGINAL LEAVES + TARGET</text>
<text x="589" y="150" font-size="9.5" font-family="monospace" font-weight="400" fill="#ffffff">e_i = f(x_i)^((p-1)/2)  in {0,+1,-1}</text>
<line x1="830" y1="159" x2="830" y2="178" stroke-width="1.5" stroke="#076d6d"/>
<line x1="696.5" y1="178" x2="963.5" y2="178" stroke-width="1.5" stroke="#076d6d"/>
<line x1="696.5" y1="178" x2="696.5" y2="198" stroke-width="1.6" stroke="#076d6d"/>
<line x1="696.5" y1="198" x2="692.5" y2="191" stroke-width="1.6" stroke="#076d6d"/>
<line x1="696.5" y1="198" x2="700.5" y2="191" stroke-width="1.6" stroke="#076d6d"/>
<line x1="963.5" y1="178" x2="963.5" y2="198" stroke-width="1.6" stroke="#076d6d"/>
<line x1="963.5" y1="198" x2="959.5" y2="191" stroke-width="1.6" stroke="#076d6d"/>
<line x1="963.5" y1="198" x2="967.5" y2="191" stroke-width="1.6" stroke="#076d6d"/>
<rect x="575" y="202" width="243" height="132" fill="#edf4f7"/>
<rect x="842" y="202" width="243" height="132" fill="#e2f2ed"/>
<text x="589" y="226" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#14283d">PURE OR ZERO-ORDINATE</text>
<text x="589" y="250" font-size="11" font-family="monospace" font-weight="400" fill="#14283d">G = 0</text>
<text x="589" y="275" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#566b7a">Added derivative equations are inactive.</text>
<text x="589" y="289.5" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#566b7a">Simple roots remain allowed.</text>
<text x="856" y="226" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#076d6d">NONZERO MIXED SECTORS</text>
<text x="856" y="250" font-size="11" font-family="monospace" font-weight="400" fill="#14283d">G = 1</text>
<text x="856" y="275" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#566b7a">At a Semaev zero, every coordinate</text>
<text x="856" y="289.5" font-size="10" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#566b7a">partial derivative vanishes.</text>
<rect x="575" y="356" width="510" height="46" fill="#14283d"/>
<text x="589" y="376" font-size="10" font-family="monospace" font-weight="400" fill="#ffffff">append NF(G*dS/dt), NF(G*dS/du)</text>
<text x="589" y="394" font-size="9" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#ffffff">Differentiate the unreduced S first; then reduce in the common section.</text>
<line x1="35" y1="440" x2="1085" y2="440" stroke-width="1" stroke="#e0edef"/>
<text x="35" y="478" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#076d6d">COMMON COORDINATE FIELD</text>
<text x="35" y="509" font-size="15" font-family="monospace" font-weight="400" fill="#14283d">p=2147483647, E: y^2=x^3-3x+21</text>
<text x="35" y="545" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#14283d">Geometric witnesses may use Fp2. Input and projected coordinates remain</text>
<text x="35" y="563.85" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#14283d">in M31. Infinity is a valid internal chart, not a discarded denominator</text>
<text x="35" y="582.7" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#14283d">failure.</text>
<text x="575" y="478" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#076d6d">COMMON FOUR-POINT SECTION</text>
<text x="575" y="509" font-size="15" font-family="monospace" font-weight="400" fill="#14283d">t(t-1)=u(u-1)=0 over M31</text>
<text x="575" y="545" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#14283d">The guard is computed in this exact section algebra. The construction</text>
<text x="575" y="563.85" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#14283d">keeps all pure and exceptional branches while activating derivatives</text>
<text x="575" y="582.7" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#14283d">only where the invariant applies.</text>
<rect x="35" y="653" width="1050" height="87" fill="#14283d"/>
<text x="54" y="682" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#ffffff">500 specialized fibers  |  792 tensor certificates  |  400 exact monolithic values</text>
<text x="54" y="711" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#ffffff">Distinct development checks. They are not a 50-case projected Groebner extraction panel.</text>
<text x="35" y="775" font-size="10.5" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#566b7a">Source: PR #5087, summation_split/m31_native/{multiplicity.md,PROTOCOL.md,src/}. Unsigned local evidence.</text>
</svg>
